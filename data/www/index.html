<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 NUT Server | Config</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="ups.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </div>
                <div class="brand-name">NUT-OS <span>v1.0</span></div>
            </div>
            
            <nav class="tabs">
                <button class="tab active" data-target="wifi">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
                    Wi-Fi Config
                </button>
                <button class="tab" data-target="nut">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><path d="M8 21h8M12 17v4"/></svg>
                    NUT Server
                </button>
                <button class="tab" data-target="ups">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    UPS Parameters
                </button>
                <button class="tab" data-target="logs">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    System Logs
                </button>
                <button class="tab" data-target="ota">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    Firmware OTA
                </button>
            </nav>

            <div class="system-status">
                <div class="status-indicator warning"></div>
                <span>AP Mode Active</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            <header class="topbar">
                <h1 class="page-title">Network Configuration</h1>
                <div class="device-id">ID: <span>ESP32-S3-8A4F</span></div>
            </header>

            <div class="tab-content active" id="content-wifi">
                <div class="panel config-panel">
                    <div class="panel-header">
                        <h2>Connection Setup</h2>
                    </div>
                    <form id="wifi-form" class="form-container">
                        <div class="form-group">
                            <label for="ssid">Network Name (SSID)</label>
                            <input type="text" id="ssid" placeholder="Type network name here..." required>
                        </div>
                        <div class="form-group">
                            <label for="password">Security Key</label>
                            <div class="input-wrapper">
                                <input type="password" id="password" placeholder="••••••••••••" required>
                                <button type="button" class="btn-icon" id="toggle-pwd">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btn-connect">
                                <span class="glow"></span>
                                Initialize Connection
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="tab-content" id="content-nut">
                <div class="panel config-panel">
                    <div class="panel-header">
                        <h2>NUT Server Credentials</h2>
                    </div>
                    <form id="nut-form" class="form-container">
                        <div class="form-group">
                            <label for="nut-upsname">UPS Name</label>
                            <input type="text" id="nut-upsname" placeholder="eaton" required>
                        </div>
                        <div class="form-group">
                            <label for="nut-username">Username</label>
                            <input type="text" id="nut-username" placeholder="admin" required>
                        </div>
                        <div class="form-group">
                            <label for="nut-password">Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="nut-password" placeholder="••••••••••••" required>
                                <button type="button" class="btn-icon" id="toggle-nut-pwd">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btn-save-nut">
                                <span class="glow"></span>
                                Save Credentials
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="tab-content" id="content-ups">
                <div class="panel ups-panel">
                    <div class="panel-header">
                        <h2>Real-Time Data Feed</h2>
                        <div class="polling-indicator">
                            <span class="pulse-dot"></span> Live
                        </div>
                    </div>
                    
                    <div class="metrics-grid">
                        <div class="metric-card highlight">
                            <div class="metric-label">UPS Status</div>
                            <div class="metric-value status-online" id="ups-status">--</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">Battery Charge</div>
                            <div class="metric-value"><span id="ups-charge">--</span><span class="unit">%</span></div>
                            <div class="progress-bar-container"><div class="progress-bar" id="bar-charge" style="width: 0%"></div></div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">UPS Load</div>
                            <div class="metric-value"><span id="ups-load">--</span><span class="unit">%</span></div>
                            <div class="progress-bar-container"><div class="progress-bar load" id="bar-load" style="width: 0%"></div></div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">Real Power</div>
                            <div class="metric-value"><span id="ups-realpower">--</span><span class="unit">W</span></div>
                        </div>
                    </div>

                    <div class="details-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Parameter</th>
                                    <th>Value</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody id="ups-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="content-logs">
                <div class="panel">
                    <div class="logs-actions">
                        <div class="auto-refresh">
                            <span class="toggle-label">Auto-refresh</span>
                            <label class="switch">
                                <input type="checkbox" id="toggle-auto-refresh" checked>
                                <span class="slider"></span>
                            </label>
                            <span id="refresh-state" class="state-text active">Active</span>
                        </div>
                        <div class="logs-controls">
                            <button class="btn btn-outline" id="btn-refresh">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                                Refresh
                            </button>
                            <button class="btn btn-outline" id="btn-clear-logs" style="color: var(--danger); border-color: var(--danger);">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                Clear
                            </button>
                            <button class="btn btn-primary" id="btn-download">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Export
                            </button>
                        </div>
                    </div>
                    <div class="terminal-container" id="terminal-output">
                    </div>
                </div>
            </div>

        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
