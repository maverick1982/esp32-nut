<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 NUT - OTA Update</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2'%3E%3Cpath d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="shared.css?v=1.1.1">
    <link rel="stylesheet" href="mobile.css?v=1.1.1">
    <script src="fflate.min.js?v=1.1.1"></script>
</head>
<body style="background-color: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui);">
    <div class="ota-container">
        <h2>OTA Firmware Update</h2>
        <div class="online-update" id="onlineUpdate">
            <dl>
                <dt>Installed</dt><dd id="ouCurrent">--</dd>
                <dt>Latest release</dt><dd id="ouLatest">--</dd>
                <dt>Last check</dt><dd id="ouChecked">--</dd>
            </dl>
            <p class="ou-msg" id="ouMsg" aria-live="polite"></p>
            <div class="ou-actions">
                <button type="button" class="btn btn-outline" id="btnCheckUpdate">Check for updates</button>
                <button type="button" class="btn btn-primary" id="btnInstallUpdate" hidden>Download and install</button>
            </div>
            <div class="progress-bar-container" id="ouProgressContainer">
                <div class="progress-bar" id="ouProgressBar"></div>
            </div>
        </div>
        <p>Drag and drop the compiled .bin file below or click to select.</p>
        
        <div class="dropzone" id="dropzone">
            <p>Drag the .bin or .zip file here or click to upload</p>
            <input type="file" id="fileInput" accept=".bin,.zip">
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="status" id="statusMessage"></div>
        
        <a href="/" class="btn-back">&larr; Back to Home</a>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                uploadFile();
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                uploadFile();
            }
        });

        function uploadFile() {
            const file = fileInput.files[0];
            if (!file) return;

            if (file.name.endsWith('.zip')) {
                showStatus('Extracting firmware.bin...', '');
                const reader = new FileReader();
                reader.onload = function(e) {
                    const buffer = new Uint8Array(e.target.result);
                    try {
                        const unzipped = fflate.unzipSync(buffer);
                        let binBuffer = null;
                        
                        // find firmware.bin or any .bin if firmware.bin doesn't exist, but spec says "firmware.bin"
                        if (unzipped['firmware.bin']) {
                            binBuffer = unzipped['firmware.bin'];
                        }
                        
                        if (binBuffer) {
                            const binBlob = new Blob([binBuffer], { type: 'application/octet-stream' });
                            const binFile = new File([binBlob], 'firmware.bin', { type: 'application/octet-stream' });
                            performUpload(binFile);
                        } else {
                            showStatus('Il file .zip non contiene alcun firmware.bin', 'error');
                        }
                    } catch (err) {
                        showStatus('Error: Invalid ZIP file.', 'error');
                    }
                };
                reader.onerror = () => showStatus('Error reading ZIP file.', 'error');
                reader.readAsArrayBuffer(file);
            } else if (file.name.endsWith('.bin')) {
                performUpload(file);
            } else {
                showStatus('Please select a valid .bin or .zip file.', 'error');
            }
        }

        function performUpload(file) {
            const formData = new FormData();
            formData.append('update', file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/update', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressContainer.style.display = 'block';
                    progressBar.style.width = percentComplete + '%';
                }
            };

            xhr.onload = () => {
                // US-061: no valid session (expired or logged out): back to the login page
                if (xhr.status === 401) {
                    window.location.replace('/login');
                    return;
                }
                if (xhr.status === 200 && xhr.responseText.trim() === 'OK') {
                    showStatus('Update complete! Rebooting...', 'success');
                    progressBar.style.backgroundColor = '#28a745';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 5000);
                } else {
                    showStatus('Error during update.', 'error');
                    progressBar.style.backgroundColor = '#dc3545';
                }
            };

            xhr.onerror = () => {
                showStatus('Network error during upload.', 'error');
                progressBar.style.backgroundColor = '#dc3545';
            };

            showStatus('Uploading...', '');
            xhr.send(formData);
        }

        function showStatus(message, className) {
            statusMessage.textContent = message;
            statusMessage.className = 'status ' + className;
        }

        // Online update: status from GET /api/update, polled while a check or install runs
        const ou = (id) => document.getElementById(id);
        let ouTimer = null;
        let ouInstalling = false;
        let ouTargetVersion = '';
        let ouRebootPolls = 0;

        function ouMessage(text, cls) {
            ou('ouMsg').textContent = text;
            ou('ouMsg').className = 'ou-msg' + (cls ? ' ' + cls : '');
        }

        function ouAge(seconds) {
            if (seconds < 90) return 'just now';
            if (seconds < 5400) return Math.round(seconds / 60) + ' minutes ago';
            if (seconds < 129600) return Math.round(seconds / 3600) + ' hours ago';
            return Math.round(seconds / 86400) + ' days ago';
        }

        async function ouFetch(url, options) {
            const res = await fetch(url, Object.assign({ cache: 'no-store' }, options));
            if (res.status === 401) {
                window.location.replace('/login');
                throw new Error('unauthorized');
            }
            return res;
        }

        function ouPoll(delay) {
            clearTimeout(ouTimer);
            ouTimer = setTimeout(ouLoad, delay);
        }

        function ouRender(s) {
            ou('ouCurrent').textContent = s.current || '--';
            const latest = ou('ouLatest');
            latest.textContent = '';
            if (s.latest) {
                if (typeof s.release_url === 'string' && s.release_url.startsWith('https://github.com/')) {
                    const a = document.createElement('a');
                    a.href = s.release_url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.textContent = s.latest;
                    latest.appendChild(a);
                } else {
                    latest.textContent = s.latest;
                }
            } else {
                latest.textContent = '--';
            }
            ou('ouChecked').textContent = s.checked ? ouAge(s.checked_age_s || 0) : 'never';

            const busy = s.phase === 'checking' || s.phase === 'downloading' || s.phase === 'restarting';
            ou('btnCheckUpdate').disabled = busy;
            ou('btnInstallUpdate').hidden = !(s.installable === true);
            ou('btnInstallUpdate').disabled = busy;
            ou('btnInstallUpdate').textContent = 'Download and install ' + (s.latest || '');
            ou('ouProgressContainer').style.display = (s.phase === 'downloading' || s.phase === 'restarting') ? 'block' : 'none';
            ou('ouProgressBar').style.width = (s.phase === 'restarting' ? 100 : (s.progress || 0)) + '%';

            if (s.phase === 'checking') {
                ouMessage('Checking GitHub...', '');
            } else if (s.phase === 'downloading') {
                ouMessage('Downloading and writing ' + (s.latest || 'the update') + ': ' + (s.progress || 0) + '%. Do not power off the board.', '');
            } else if (s.phase === 'restarting') {
                ouMessage('Update installed. Restarting...', 'success');
            } else if (s.phase === 'failed') {
                ouMessage('Update failed: ' + (s.error || 'unknown error') + '. The running firmware is unchanged.', 'error');
            } else if (s.checked && !s.last_check_ok) {
                ouMessage('Check failed: ' + (s.error || 'unknown error'), 'error');
            } else if (s.available && s.installable) {
                ouMessage('Firmware ' + s.latest + ' is available.', 'success');
            } else if (s.available && !(s.asset && s.asset.name)) {
                ouMessage('Firmware ' + s.latest + ' is available, but the release has no file for this board. Install it manually.', 'error');
            } else if (s.available) {
                ouMessage('Firmware ' + s.latest + ' is available, but the release publishes no checksum. Download it from GitHub and upload it below.', 'error');
            } else if (s.installable) {
                ouMessage('This is a development build. The latest release can be installed.', '');
            } else if (s.checked) {
                ouMessage('The firmware is up to date.', 'success');
            } else {
                ouMessage('', '');
            }
            return busy;
        }

        async function ouLoad() {
            let s = null;
            try {
                const res = await ouFetch('/api/update');
                if (res.ok) s = await res.json();
            } catch (err) {
                s = null;
            }
            if (!s) {
                if (ouInstalling && ouRebootPolls < 40) {
                    ouRebootPolls++;
                    ouMessage('Restarting, waiting for the board...', '');
                    ouPoll(3000);
                } else if (!ouInstalling) {
                    ouMessage('Online update is not available.', 'error');
                    ou('btnCheckUpdate').disabled = true;
                }
                return;
            }
            if (ouInstalling && s.phase === 'idle' && s.current === ouTargetVersion) {
                ouInstalling = false;
                ouRender(s);
                ouMessage('Update complete: now running ' + s.current + '.', 'success');
                return;
            }
            if (s.phase === 'failed') ouInstalling = false;
            if (ouRender(s) || ouInstalling) ouPoll(s.phase === 'checking' ? 1000 : 2000);
        }

        async function ouPost(url, body) {
            const res = await ouFetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {})
            });
            let json = null;
            try { json = await res.json(); } catch (err) { json = null; }
            if (res.ok) return null;
            return (json && typeof json.error === 'string' && json.error) || ('Failed (HTTP ' + res.status + ')');
        }

        ou('btnCheckUpdate').addEventListener('click', async () => {
            ou('btnCheckUpdate').disabled = true;
            try {
                const err = await ouPost('/api/update/check');
                if (err) {
                    ouMessage(err, 'error');
                    ou('btnCheckUpdate').disabled = false;
                    return;
                }
                ouMessage('Checking GitHub...', '');
                ouPoll(1000);
            } catch (e) {
                ouMessage('Network error', 'error');
                ou('btnCheckUpdate').disabled = false;
            }
        });

        ou('btnInstallUpdate').addEventListener('click', async () => {
            const version = ou('ouLatest').textContent;
            if (!window.confirm('Download ' + version + ' from GitHub and install it? The board restarts when it is done.')) return;
            ou('btnInstallUpdate').disabled = true;
            try {
                const err = await ouPost('/api/update/install');
                if (err) {
                    ouMessage(err, 'error');
                    ou('btnInstallUpdate').disabled = false;
                    return;
                }
                ouInstalling = true;
                ouTargetVersion = version;
                ouRebootPolls = 0;
                ouPoll(1000);
            } catch (e) {
                ouMessage('Network error', 'error');
                ou('btnInstallUpdate').disabled = false;
            }
        });

        ouLoad();
    </script>
</body>
</html>
