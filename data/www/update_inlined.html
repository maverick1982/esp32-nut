<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 NUT - OTA Update</title>

    <style>:root {
    /* Color Palette - Hi-Tech / Cyberpunk minimal */
    --bg-base: #06090e;
    --bg-panel: rgba(14, 20, 31, 0.7);
    --bg-panel-border: rgba(45, 60, 90, 0.5);
    --accent: #00f0ff;
    --accent-hover: #00c3d0;
    --accent-glow: rgba(0, 240, 255, 0.3);
    --text-primary: #e0e6ed;
    --text-secondary: #8a9bb3;
    --danger: #ff3366;
    --success: #00ff9d;
    --warning: #ffb800;
    --info: #00bfff;

    /* Typography */
    --font-ui: 'Inter', sans-serif;
    --font-heading: 'Orbitron', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
    
    /* Layout */
    --sidebar-width: 260px;
    --border-radius: 4px; /* Sharp corners for tech look */
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.03), transparent 25%),
        linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
    background-position: 0 0, 0 0, -1px -1px, -1px -1px;
}

/* --- Layout --- */
.app-container {
    display: flex;
    height: 100vh;
}

/* --- Sidebar --- */
.sidebar {
    width: var(--sidebar-width);
    background: rgba(8, 12, 18, 0.85);
    border-right: 1px solid var(--bg-panel-border);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    padding: 1.5rem 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    padding: 0 1.5rem 2rem;
    gap: 1rem;
}

.brand-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    color: var(--accent);
    filter: drop-shadow(0 0 8px var(--accent-glow));
}

.brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.brand-name {
    font-family: var(--font-heading);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 1px;
}

.brand-name span {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--accent);
    vertical-align: super;
}

.tabs {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 0 1rem;
    flex-grow: 1;
}

.tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    padding: 0.8rem 1rem;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    border-radius: var(--border-radius);
    transition: var(--transition);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.tab svg {
    width: 18px;
    height: 18px;
    opacity: 0.7;
}

.tab:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.02);
}

.tab.active {
    color: var(--accent);
    background: rgba(0, 240, 255, 0.05);
    border-color: rgba(0, 240, 255, 0.2);
    box-shadow: inset 2px 0 0 var(--accent);
}

.tab.active svg {
    opacity: 1;
    filter: drop-shadow(0 0 5px var(--accent-glow));
}

.system-status {
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-secondary);
    border-top: 1px solid var(--bg-panel-border);
}

.system-status.dual {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
}

.status-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}
.status-indicator.warning {
    background: var(--warning);
    box-shadow: 0 0 8px rgba(255, 184, 0, 0.5);
    animation: pulse 2s infinite;
}

.status-indicator.success {
    background: var(--success);
    box-shadow: 0 0 8px rgba(0, 255, 157, 0.5);
    animation: none;
}

.status-indicator.danger {
    background: var(--danger);
    box-shadow: 0 0 8px rgba(255, 51, 102, 0.5);
    animation: none;
}

.status-indicator.info {
    background: var(--info);
    box-shadow: 0 0 8px rgba(0, 191, 255, 0.5);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* --- Main Content --- */
.content-area {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    padding: 2rem 3rem;
    overflow-y: auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--bg-panel-border);
}

.page-title {
    font-family: var(--font-heading);
    font-size: 1.5rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.device-id {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-secondary);
}
.device-id span {
    color: var(--text-primary);
}

.tab-content {
    display: none;
    flex-direction: column;
    gap: 1.5rem;
    animation: fadeIn 0.4s ease-out forwards;
}

.tab-content.active {
    display: flex;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* --- Panels --- */
.panel {
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-border);
    border-radius: var(--border-radius);
    padding: 1.5rem;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
}

.panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
}

.panel-header h2 {
    font-size: 0.9rem;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
}

.placeholder-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 200px;
    border-style: dashed;
    opacity: 0.6;
}
.placeholder-panel p {
    margin-top: 1rem;
    color: var(--text-secondary);
}

.mono {
    font-family: var(--font-mono);
}

/* --- Buttons --- */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: var(--border-radius);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.btn svg {
    width: 16px;
    height: 16px;
}

.btn-outline {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
}

.btn-outline:hover {
    background: rgba(0, 240, 255, 0.1);
    box-shadow: 0 0 15px var(--accent-glow);
}

.btn-primary {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #000;
    font-weight: 700;
}

.btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 0 20px var(--accent-glow);
}

.btn-primary:disabled {
    background: rgba(0, 240, 255, 0.2);
    border-color: transparent;
    color: rgba(255, 255, 255, 0.3);
    cursor: not-allowed;
}

/* --- Network List --- */
.network-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 250px;
    overflow-y: auto;
    padding-right: 0.5rem;
}

.network-list::-webkit-scrollbar {
    width: 6px;
}
.network-list::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
}
.network-list::-webkit-scrollbar-thumb {
    background: var(--bg-panel-border);
    border-radius: 3px;
}
.network-list::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
}

.scan-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 0;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    gap: 1rem;
}

.spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--bg-panel-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.network-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--bg-panel-border);
    border-radius: var(--border-radius);
    cursor: pointer;
    transition: var(--transition);
}

.network-item:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(0, 240, 255, 0.3);
}

.network-item.selected {
    background: rgba(0, 240, 255, 0.08);
    border-color: var(--accent);
}

.net-info {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.net-ssid {
    font-weight: 600;
    font-family: var(--font-mono);
}

.net-meta {
    font-size: 0.75rem;
    color: var(--text-secondary);
    display: flex;
    gap: 0.5rem;
}

.net-signal {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-secondary);
}

.net-signal svg {
    width: 18px;
    height: 18px;
}

.signal-excellent { color: var(--success); }
.signal-good { color: var(--accent); }
.signal-weak { color: var(--warning); }

/* --- Forms --- */
.form-container {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 1.5rem;
    align-items: end;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-group label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-secondary);
    letter-spacing: 1px;
}

input[type="text"],
input[type="password"] {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--bg-panel-border);
    color: var(--text-primary);
    padding: 0.8rem 1rem;
    border-radius: var(--border-radius);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    outline: none;
    transition: var(--transition);
    width: 100%;
}

input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
}

input:disabled, input[readonly] {
    opacity: 0.6;
    cursor: not-allowed;
}
input[readonly] {
    cursor: default;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.btn-icon {
    position: absolute;
    right: 10px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 5px;
    display: flex;
}
.btn-icon:hover:not(:disabled) {
    color: var(--accent);
}
.btn-icon svg {
    width: 18px;
    height: 18px;
}
.btn-icon:disabled {
    cursor: not-allowed;
    opacity: 0.5;
}

/* --- Terminal Logs --- */
.terminal-container {
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid var(--bg-panel-border);
    border-radius: var(--border-radius);
    padding: 1.25rem;
    height: 400px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-primary);
    box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
}

.terminal-container::-webkit-scrollbar {
    width: 8px;
}
.terminal-container::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.3);
}
.terminal-container::-webkit-scrollbar-thumb {
    background: var(--bg-panel-border);
    border-radius: 4px;
}
.terminal-container::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
}

.terminal-line {
    margin-bottom: 0.4rem;
    display: flex;
    gap: 1rem;
    word-break: break-all;
    line-height: 1.4;
}

.terminal-time {
    color: var(--text-secondary);
    opacity: 0.7;
    white-space: nowrap;
}

.terminal-level-info { color: var(--accent); font-weight: 600; white-space: nowrap; }
.terminal-level-warn { color: var(--warning); font-weight: 600; white-space: nowrap; }
.terminal-level-err { color: var(--danger); font-weight: 600; white-space: nowrap; }

.terminal-msg {
    color: var(--text-primary);
}

.logs-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.logs-controls {
    display: flex;
    gap: 1rem;
}

.auto-refresh {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    padding: 0.5rem 1rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: var(--border-radius);
    border: 1px solid var(--bg-panel-border);
}

.auto-refresh .toggle-label {
    text-transform: uppercase;
    letter-spacing: 1px;
}

.auto-refresh .state-text {
    font-weight: bold;
    width: 60px;
}

.auto-refresh .state-text.active {
    color: var(--success);
    text-shadow: 0 0 8px rgba(0, 255, 157, 0.5);
}

.auto-refresh .state-text.paused {
    color: var(--warning);
    text-shadow: 0 0 8px rgba(255, 184, 0, 0.5);
}

/* Switch */
.switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.switch .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--bg-panel-border);
    transition: .4s;
    border-radius: 12px;
}

.switch .slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: var(--text-secondary);
    transition: .4s;
    border-radius: 50%;
}

.switch input:checked + .slider {
    background-color: rgba(0, 255, 157, 0.1);
    border-color: var(--success);
}

.switch input:checked + .slider:before {
    transform: translateX(20px);
    background-color: var(--success);
    box-shadow: 0 0 8px rgba(0, 255, 157, 0.8);
}
/* OTA Update Styles */
.ota-container {
    max-width: 500px;
    margin: 2rem auto;
    background: var(--bg-panel);
    padding: 2rem;
    border-radius: var(--border-radius);
    border: 1px solid var(--bg-panel-border);
    backdrop-filter: blur(10px);
}
.dropzone {
    border: 2px dashed var(--bg-panel-border);
    border-radius: var(--border-radius);
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    margin-bottom: 1rem;
    font-family: var(--font-mono);
}
.dropzone.dragover {
    border-color: var(--accent);
    background: rgba(0, 240, 255, 0.05);
}
.dropzone input[type="file"] {
    display: none;
}
.progress-bar-container {
    width: 100%;
    height: 20px;
    background-color: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1rem;
    display: none;
    border: 1px solid var(--bg-panel-border);
}
.progress-bar {
    height: 100%;
    width: 0%;
    background-color: var(--accent);
    transition: width 0.2s;
    box-shadow: 0 0 10px var(--accent-glow);
}
.status {
    text-align: center;
    font-weight: bold;
    font-family: var(--font-mono);
    margin-bottom: 1rem;
}
.status.success { color: var(--success); }
.status.error { color: var(--danger); }
.btn-back {
    display: inline-block;
    margin-top: 1rem;
    text-decoration: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-transform: uppercase;
    transition: var(--transition);
}
.btn-back:hover {
    color: var(--accent-hover);
    text-shadow: 0 0 8px var(--accent-glow);
}
/* UPS Parameters Specific Styles */



.polling-indicator {

    display: flex;

    align-items: center;

    gap: 0.5rem;

    font-family: var(--font-mono);

    font-size: 0.75rem;

    color: var(--success);

    text-transform: uppercase;

    letter-spacing: 1px;

}



.pulse-dot {

    width: 6px;

    height: 6px;

    background-color: var(--success);

    border-radius: 50%;

    box-shadow: 0 0 8px var(--success);

    animation: blink 1.5s infinite;

}



@keyframes blink {

    0%, 100% { opacity: 1; }

    50% { opacity: 0.3; }

}



.metrics-grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

    gap: 1.5rem;

    margin-bottom: 2rem;

}



.metric-card {

    background: rgba(0, 0, 0, 0.3);

    border: 1px solid var(--bg-panel-border);

    border-radius: var(--border-radius);

    padding: 1.5rem;

    display: flex;

    flex-direction: column;

    gap: 0.75rem;

    transition: var(--transition);

}



.metric-card:hover {

    border-color: rgba(0, 240, 255, 0.3);

    background: rgba(0, 240, 255, 0.02);

}



.metric-card.highlight {

    background: rgba(0, 240, 255, 0.05);

    border-color: var(--accent);

    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1) inset;

}



.metric-label {

    font-family: var(--font-mono);

    font-size: 0.75rem;

    color: var(--text-secondary);

    text-transform: uppercase;

    letter-spacing: 1px;

}



.metric-value {

    font-family: var(--font-heading);

    font-size: 2rem;

    color: var(--text-primary);

    display: flex;

    align-items: baseline;

    gap: 0.25rem;

}



.metric-value .unit {

    font-size: 1rem;

    color: var(--text-secondary);

}



.metric-value.status-online { color: var(--success); text-shadow: 0 0 10px rgba(0, 255, 157, 0.3); }

.metric-value.status-batt { color: var(--warning); text-shadow: 0 0 10px rgba(255, 184, 0, 0.3); }



.progress-bar-container {

    width: 100%;

    height: 4px;

    background: rgba(255, 255, 255, 0.1);

    border-radius: 2px;

    overflow: hidden;

    margin-top: 0.5rem;

}



.progress-bar {

    height: 100%;

    background: var(--success);

    box-shadow: 0 0 10px var(--success);

    transition: width 0.5s ease-out;

}

.progress-bar.load {

    background: var(--accent);

    box-shadow: 0 0 10px var(--accent);

}



.details-table-container {

    background: rgba(0, 0, 0, 0.2);

    border: 1px solid var(--bg-panel-border);

    border-radius: var(--border-radius);

    overflow: hidden;

}



.data-table {

    width: 100%;

    border-collapse: collapse;

    font-family: var(--font-mono);

    font-size: 0.85rem;

    text-align: left;

}



.data-table th {

    background: rgba(255, 255, 255, 0.03);

    color: var(--text-secondary);

    font-weight: normal;

    text-transform: uppercase;

    letter-spacing: 1px;

    padding: 1rem;

    border-bottom: 1px solid var(--bg-panel-border);

}



.data-table td {

    padding: 1rem;

    border-bottom: 1px solid rgba(255, 255, 255, 0.05);

    color: var(--text-primary);

}



.data-table tbody tr {

    transition: background 0.2s;

}



.data-table tbody tr:hover {

    background: rgba(0, 240, 255, 0.05);

}



.data-table td:first-child {

    color: var(--accent);

}



.data-table td:last-child {

    color: var(--text-secondary);

}



.flash {

    animation: flash-bg 0.5s ease-out;

}



@keyframes flash-bg {

    0% { background: rgba(0, 240, 255, 0.2); }

    100% { background: transparent; }

}


/* UPS Parameters Specific Styles */

.polling-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--success);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.pulse-dot {
    width: 6px;
    height: 6px;
    background-color: var(--success);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--success);
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.metric-card {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--bg-panel-border);
    border-radius: var(--border-radius);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    transition: var(--transition);
}

.metric-card:hover {
    border-color: rgba(0, 240, 255, 0.3);
    background: rgba(0, 240, 255, 0.02);
}

.metric-card.highlight {
    background: rgba(0, 240, 255, 0.05);
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1) inset;
}

.metric-label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.metric-value {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: var(--text-primary);
    display: flex;
    align-items: baseline;
    gap: 0.25rem;
}

.metric-value .unit {
    font-size: 1rem;
    color: var(--text-secondary);
}

.metric-value.status-online { color: var(--success); text-shadow: 0 0 10px rgba(0, 255, 157, 0.3); }
.metric-value.status-batt { color: var(--warning); text-shadow: 0 0 10px rgba(255, 184, 0, 0.3); }

.progress-bar-container {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 0.5rem;
}

.progress-bar {
    height: 100%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
    transition: width 0.5s ease-out;
}
.progress-bar.load {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
}

.details-table-container {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--bg-panel-border);
    border-radius: var(--border-radius);
    overflow: hidden;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-align: left;
}

.data-table th {
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-secondary);
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 1rem;
    border-bottom: 1px solid var(--bg-panel-border);
}

.data-table td {
    padding: 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
}

.data-table tbody tr {
    transition: background 0.2s;
}

.data-table tbody tr:hover {
    background: rgba(0, 240, 255, 0.05);
}

.data-table td:first-child {
    color: var(--accent);
}

.data-table td:last-child {
    color: var(--text-secondary);
}

/* Mobile Responsive Styles for US-042 */
@media (max-width: 768px) {
    .app-container {
        flex-direction: column;
    }
    
    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--bg-panel-border);
        padding: 1rem 0;
    }
    
    .brand {
        justify-content: center;
        padding: 0 1.5rem 1rem;
    }
    
    .tabs {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
    }
    
    .tab {
        flex: 1 1 45%;
        justify-content: center;
        padding: 0.6rem;
    }
    
    .system-status.dual {
        flex-direction: row;
        justify-content: space-around;
        padding: 1rem 0 0 0;
    }
    
    .content-area {
        padding: 1rem;
    }
    
    .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
    }
    
    .form-container {
        grid-template-columns: 1fr;
        gap: 1rem;
    }
    
    .logs-actions {
        flex-direction: column;
        align-items: stretch;
    }
    
    .logs-controls {
        flex-wrap: wrap;
        justify-content: space-between;
    }
    
    .logs-controls .btn {
        flex: 1 1 45%;
        justify-content: center;
    }
    
    .ups-actions {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start !important;
    }
    
    /* Responsive Data Table */
    .data-table, .data-table tbody, .data-table tr, .data-table td {
        display: block;
        width: 100%;
    }
    .data-table thead {
        display: none;
    }
    .data-table td {
        border: none;
        padding: 0.5rem 1rem;
        text-align: left;
    }
    .data-table td:first-child {
        padding-top: 1rem;
        font-weight: bold;
        color: var(--accent);
    }
    .data-table td:nth-child(2) {
        font-size: 1.1em;
    }
    .data-table td:last-child {
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
        font-size: 0.8em;
    }
    .data-table tr {
        margin-bottom: 0.5rem;
    }
}

/* OTA Update Styles */
.ota-container {
    max-width: 500px;
    margin: 2rem auto;
    background: var(--bg-panel);
    padding: 2rem;
    border-radius: var(--border-radius);
    border: 1px solid var(--bg-panel-border);
    backdrop-filter: blur(10px);
}
.dropzone {
    border: 2px dashed var(--bg-panel-border);
    border-radius: var(--border-radius);
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    margin-bottom: 1rem;
    font-family: var(--font-mono);
}
.dropzone.dragover {
    border-color: var(--accent);
    background: rgba(0, 240, 255, 0.05);
}
.dropzone input[type="file"] {
    display: none;
}
.progress-bar-container {
    width: 100%;
    height: 20px;
    background-color: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1rem;
    display: none;
    border: 1px solid var(--bg-panel-border);
}
.progress-bar {
    height: 100%;
    width: 0%;
    background-color: var(--accent);
    transition: width 0.2s;
    box-shadow: 0 0 10px var(--accent-glow);
}
.status {
    text-align: center;
    font-weight: bold;
    font-family: var(--font-mono);
    margin-bottom: 1rem;
}
.status.success { color: var(--success); }
.status.error { color: var(--danger); }
.btn-back {
    display: inline-block;
    margin-top: 1rem;
    text-decoration: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-transform: uppercase;
    transition: var(--transition);
}
.btn-back:hover {
    color: var(--accent-hover);
    text-shadow: 0 0 8px var(--accent-glow);
}

<body style="background-color: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui);">
    <div class="ota-container">
        <h2>OTA Firmware Update</h2>
        <p>Drag and drop the compiled .bin file below or click to select.</p>
        
        <div class="dropzone" id="dropzone">
            <p>Drag the .bin or .zip file here or click to upload</p>
            <input type="file" id="fileInput" accept=".bin,.zip">
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="status" id="statusMessage"></div>
        
        <a href="/" class="btn-back">&larr; Back to Home</a>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                uploadFile();
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                uploadFile();
            }
        });

        function uploadFile() {
            const file = fileInput.files[0];
            if (!file) return;

            if (file.name.endsWith('.zip')) {
                showStatus('Extracting firmware.bin...', '');
                const reader = new FileReader();
                reader.onload = function(e) {
                    const buffer = new Uint8Array(e.target.result);
                    try {
                        const unzipped = fflate.unzipSync(buffer);
                        let binBuffer = null;
                        
                        // find firmware.bin or any .bin if firmware.bin doesn't exist, but spec says "firmware.bin"
                        if (unzipped['firmware.bin']) {
                            binBuffer = unzipped['firmware.bin'];
                        }
                        
                        if (binBuffer) {
                            const binBlob = new Blob([binBuffer], { type: 'application/octet-stream' });
                            const binFile = new File([binBlob], 'firmware.bin', { type: 'application/octet-stream' });
                            performUpload(binFile);
                        } else {
                            showStatus('Il file .zip non contiene alcun firmware.bin', 'error');
                        }
                    } catch (err) {
                        showStatus('Error: Invalid ZIP file.', 'error');
                    }
                };
                reader.onerror = () => showStatus('Error reading ZIP file.', 'error');
                reader.readAsArrayBuffer(file);
            } else if (file.name.endsWith('.bin')) {
                performUpload(file);
            } else {
                showStatus('Please select a valid .bin or .zip file.', 'error');
            }
        }

        function performUpload(file) {
            const formData = new FormData();
            formData.append('update', file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/update', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressContainer.style.display = 'block';
                    progressBar.style.width = percentComplete + '%';
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200 && xhr.responseText.trim() === 'OK') {
                    showStatus('Update complete! Rebooting...', 'success');
                    progressBar.style.backgroundColor = '#28a745';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 5000);
                } else {
                    showStatus('Error during update.', 'error');
                    progressBar.style.backgroundColor = '#dc3545';
                }
            };

            xhr.onerror = () => {
                showStatus('Network error during upload.', 'error');
                progressBar.style.backgroundColor = '#dc3545';
            };

            showStatus('Uploading...', '');
            xhr.send(formData);
        }

        function showStatus(message, className) {
            statusMessage.textContent = message;
            statusMessage.className = 'status ' + className;
        }
    </script>
</body>
</html>
