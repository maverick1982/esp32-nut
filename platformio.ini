; Impostazioni condivise per tutti i firmware ESP32
[env]
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384

; ---------------------------------------------------------
; 1. ESP32-S3 environments
;    pioarduino 55.03.312-1 = Arduino 3.3.12 su ESP-IDF 5.5.5 (US-089, ADR 0010)
;    Shared settings of every ESP32-S3 image; each environment adds its board
;    and its board profile.
; ---------------------------------------------------------
[esp32s3_common]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
extra_scripts =
    pre:scripts/embed_web.py
    pre:scripts/build_env.py
board_build.partitions = partitions.csv
test_build_src = true
; The precompiled Arduino core ignores sdkconfig.defaults: the core dump to flash stays
; enabled. The wrap lets CrashDiag skip it when the partition table (OTA-updated boards)
; has no coredump partition, so a panic completes and reboots (issue #47, ADR 0008).
build_flags =
    ${env.build_flags}
    -Wl,--wrap=esp_core_dump_write
    ; NTP server of DHCP option 42 kept for NtpClock, lwIP never sets it (US-145, #135)
    -Wl,--wrap=dhcp_set_ntp_servers
    ; Libraries (WebApi) include the board profile headers of include/board (US-094)
    -I include
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; Generic ESP32-S3 boards (Universal 8MB DIO)
[env:esp32-s3-standard]
extends = esp32s3_common
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
; One board profile per environment (ADR 0010 §3): the code asks board(), never #if
build_src_filter = +<*> -<board/> +<board/esp32s3_devkit.cpp>

; Arduino Nano ESP32: ESP32-S3 N16R8. The project-local board uses the generic
; ESP32-S3 variant so Arduino's CDC/DFU and double-tap recovery never claim the
; Nano's only USB OTG controller before the UPS host starts.
[env:arduino-nano-esp32]
extends = esp32s3_common
board = arduino_nano_esp32_nut
build_src_filter = +<*> -<board/> +<board/arduino_nano_esp32.cpp>

; ---------------------------------------------------------
; 2. ESP32-P4 with RMII Ethernet (US-092, issue #94)
;    Profile esp32p4_eth: Waveshare ESP32-P4-ETH and the Espressif reference design.
;    Two images: the ESP-IDF libraries of the P4 differ between silicon v3.1+ and the
;    revisions before v3. scripts/chip_rev.py writes the revision range of the libraries
;    into the image header, so the bootloader and the OTA check refuse the wrong image.
; ---------------------------------------------------------
[p4_eth]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
extra_scripts =
    pre:scripts/embed_web.py
    pre:scripts/build_env.py
    post:scripts/chip_rev.py
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
build_src_filter = +<*> -<board/> +<board/esp32p4_eth.cpp>
build_flags =
    ${env.build_flags}
    -Wl,--wrap=esp_core_dump_write
    -Wl,--wrap=dhcp_set_ntp_servers
    -I include
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; ESP32-P4 silicon v3.1+ (current production): not tested on hardware yet
[env:esp32-p4-eth]
extends = p4_eth
board = esp32-p4_r3-evboard

; ESP32-P4 silicon before v3 (v1.x): tested on a v1.3 board
[env:esp32-p4-eth-v1]
extends = p4_eth
board = esp32-p4-evboard

; ---------------------------------------------------------
; 3. Environment per i Test (Native)
; ---------------------------------------------------------
[env:native]
platform = native
platform_packages =
    toolchain-gccmingw32
test_framework = unity
test_build_src = true
lib_ignore =
    USBHostUPS
    DiagnosticLED
    NUTServer
; test_arduino_nano_profile runs in native-arduino-nano-esp32 (the Nano board profile)
test_ignore = test_diagnostic_led, test_network_manager, test_ota_handler, test_system_state, test_usb_host, integration, test_config_manager, test_arduino_nano_profile
build_src_filter =
    -<*>
    +<board/esp32s3_devkit.cpp>
    +<../lib/USBHostUPS/src/HIDParser.cpp>
    +<../lib/USBHostUPS/src/APCDriver.cpp>
    +<../lib/USBHostUPS/src/BelkinDriver.cpp>
    +<../lib/USBHostUPS/src/CyberPowerDriver.cpp>
    +<../lib/USBHostUPS/src/OpenUPSDriver.cpp>
    +<../lib/USBHostUPS/src/EatonDriver.cpp>
    +<../lib/USBHostUPS/src/EcoFlowDriver.cpp>
    +<../lib/USBHostUPS/src/GenericDriver.cpp>
    +<../lib/USBHostUPS/src/LegrandDriver.cpp>
    +<../lib/USBHostUPS/src/LiebertDriver.cpp>
    +<../lib/USBHostUPS/src/PowercomDriver.cpp>
    +<../lib/USBHostUPS/src/DriverRegistry.cpp>
    +<../lib/USBHostUPS/src/QxEngine.cpp>
    +<../lib/USBHostUPS/src/QxEngineControl.cpp>
    +<../lib/USBHostUPS/src/QxBlazerCommon.cpp>
    +<../lib/USBHostUPS/src/QxMegatec.cpp>
    +<../lib/USBHostUPS/src/QxQ1.cpp>
    +<../lib/USBHostUPS/src/QxMustek.cpp>
    +<../lib/USBHostUPS/src/QxMegatecOld.cpp>
    +<../lib/USBHostUPS/src/QxZinto.cpp>
    +<../lib/USBHostUPS/src/QxHunnox.cpp>
    +<../lib/USBHostUPS/src/QxInnovatae.cpp>
    +<../lib/USBHostUPS/src/QxProtocols.cpp>
    +<../lib/USBHostUPS/src/QxProbe.cpp>
    +<../lib/USBHostUPS/src/QxControl.cpp>
    +<../lib/USBHostUPS/src/QxUsbTransports.cpp>
    +<../lib/USBHostUPS/src/QxUsbKrauler.cpp>
    +<../lib/USBHostUPS/src/QxUsbCypress.cpp>
    +<../lib/USBHostUPS/src/QxDriver.cpp>
    +<../lib/NUTServer/src/NUTServer.cpp>
; libstdc++ linked statically (US-073): with the DLL, the operator new of a test does not see
; the std::string allocations (test_nut_table counts them)
extra_scripts = post:scripts/native_static_link.py
build_flags =
    -std=gnu++17
    -I test/mocks
    -I include
    -I lib/USBHostUPS/src
    -I lib/NUTServer/src

; Regression profile for the Nano board data without requiring hardware.
[env:native-arduino-nano-esp32]
extends = env:native
test_filter = test_arduino_nano_profile
; the native test_ignore skips this suite, which needs the Nano board profile
test_ignore =
    integration
build_src_filter =
    ${env:native.build_src_filter}
    -<board/esp32s3_devkit.cpp>
    +<board/arduino_nano_esp32.cpp>

