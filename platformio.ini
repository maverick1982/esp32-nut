; Impostazioni condivise per tutti i firmware ESP32
[env]
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384

; ---------------------------------------------------------
; 1. Environment per Firmware ESP32-S3 (Universal 8MB DIO)
;    pioarduino 55.03.312-1 = Arduino 3.3.12 su ESP-IDF 5.5.5 (US-089, ADR 0010)
; ---------------------------------------------------------
[env:esp32-s3-standard]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_web.py
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
test_build_src = true
; One board profile per environment (ADR 0010 §3): the code asks board(), never #if
build_src_filter = +<*> -<board/> +<board/esp32s3_devkit.cpp>
; The precompiled Arduino core ignores sdkconfig.defaults: the core dump to flash stays
; enabled. The wrap lets CrashDiag skip it when the partition table (OTA-updated boards)
; has no coredump partition, so a panic completes and reboots (issue #47, ADR 0008).
build_flags =
    ${env.build_flags}
    -Wl,--wrap=esp_core_dump_write
    ; Libraries (WebApi) include the board profile headers of include/board (US-094)
    -I include
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; ---------------------------------------------------------
; 2. ESP32-P4 with RMII Ethernet (US-092, issue #94)
;    Profile esp32p4_eth: Waveshare ESP32-P4-ETH and the Espressif reference design.
;    Two images: the ESP-IDF libraries of the P4 differ between silicon v3.1+ and the
;    revisions before v3. scripts/chip_rev.py writes the revision range of the libraries
;    into the image header, so the bootloader and the OTA check refuse the wrong image.
; ---------------------------------------------------------
[p4_eth]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/chip_rev.py
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
build_src_filter = +<*> -<board/> +<board/esp32p4_eth.cpp>
build_flags =
    ${env.build_flags}
    -Wl,--wrap=esp_core_dump_write
    -I include
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; ESP32-P4 silicon v3.1+ (current production): not tested on hardware yet
[env:esp32-p4-eth]
extends = p4_eth
board = esp32-p4_r3-evboard

; ESP32-P4 silicon before v3 (v1.x): tested on a v1.3 board
[env:esp32-p4-eth-v1]
extends = p4_eth
board = esp32-p4-evboard

; ---------------------------------------------------------
; 3. Environment per i Test (Native)
; ---------------------------------------------------------
[env:native]
platform = native
platform_packages =
    toolchain-gccmingw32
test_framework = unity
test_build_src = true
lib_ignore =
    USBHostUPS
    DiagnosticLED
    NUTServer
test_ignore = test_diagnostic_led, test_network_manager, test_ota_handler, test_system_state, test_usb_host, integration, test_config_manager
build_src_filter =
    -<*>
    +<board/esp32s3_devkit.cpp>
    +<../lib/USBHostUPS/src/HIDParser.cpp>
    +<../lib/USBHostUPS/src/APCDriver.cpp>
    +<../lib/USBHostUPS/src/CyberPowerDriver.cpp>
    +<../lib/USBHostUPS/src/OpenUPSDriver.cpp>
    +<../lib/USBHostUPS/src/EatonDriver.cpp>
    +<../lib/USBHostUPS/src/EcoFlowDriver.cpp>
    +<../lib/USBHostUPS/src/GenericDriver.cpp>
    +<../lib/USBHostUPS/src/LegrandDriver.cpp>
    +<../lib/USBHostUPS/src/LiebertDriver.cpp>
    +<../lib/USBHostUPS/src/PowercomDriver.cpp>
    +<../lib/USBHostUPS/src/DriverRegistry.cpp>
    +<../lib/NUTServer/src/NUTServer.cpp>
build_flags =
    -std=gnu++17
    -I test/mocks
    -I include
    -I lib/USBHostUPS/src
    -I lib/NUTServer/src

