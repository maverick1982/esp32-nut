; Impostazioni condivise per tutti i firmware ESP32
[env]
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384

; ---------------------------------------------------------
; 1. Environment per Firmware ESP32-S3 (Universal 8MB DIO)
; ---------------------------------------------------------
[env:esp32-s3-standard]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.04
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_web.py
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
test_build_src = true
; The precompiled Arduino core ignores sdkconfig.defaults: the core dump to flash stays
; enabled. The wrap lets CrashDiag skip it when the partition table (OTA-updated boards)
; has no coredump partition, so a panic completes and reboots (issue #47, ADR 0008).
build_flags =
    ${env.build_flags}
    -Wl,--wrap=esp_core_dump_write
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

; ---------------------------------------------------------
; 3. Environment per i Test (Native)
; ---------------------------------------------------------
[env:native]
platform = native
platform_packages =
    toolchain-gccmingw32
test_framework = unity
test_build_src = true
lib_ignore =
    USBHostUPS
    DiagnosticLED
    NUTServer
test_ignore = test_diagnostic_led, test_network_manager, test_ota_handler, test_system_state, test_usb_host, integration, test_config_manager
build_src_filter =
    -<*>
    +<../lib/USBHostUPS/src/HIDParser.cpp>
    +<../lib/USBHostUPS/src/APCDriver.cpp>
    +<../lib/USBHostUPS/src/CyberPowerDriver.cpp>
    +<../lib/USBHostUPS/src/OpenUPSDriver.cpp>
    +<../lib/USBHostUPS/src/EatonDriver.cpp>
    +<../lib/USBHostUPS/src/GenericDriver.cpp>
    +<../lib/USBHostUPS/src/PowercomDriver.cpp>
    +<../lib/USBHostUPS/src/DriverRegistry.cpp>
    +<../lib/NUTServer/src/NUTServer.cpp>
build_flags =
    -std=gnu++17
    -I test/mocks
    -I lib/USBHostUPS/src
    -I lib/NUTServer/src

