name: CI

# Builds every release image (US-102) on main and on the pull requests to
# main: a board profile or a platform change that breaks one image shows up
# before the release tag. Pushes to other branches do not run it.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running build; every commit on main
# keeps its own finished run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-s3-standard, arduino-nano-esp32, esp32-p4-eth, esp32-p4-eth-v1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          # One cache per image: the ESP32-S3 and ESP32-P4 toolchains differ
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify board manifests
        run: |
          python scripts/release_package.py manifests --version v0.0.0 --out manifests
          python scripts/check_release_manifests.py --out manifests --version v0.0.0

  # The native environment uses the MinGW toolchain (platform_packages), as on
  # the development PCs: the board profile tests run on Windows
  board-profile-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      # As on the development PCs: the native tests need the MinGW toolchain of
      # platform_packages in PATH, not the g++ preinstalled on the runner
      - name: Use the PlatformIO MinGW toolchain
        shell: pwsh
        run: echo "$env:USERPROFILE\.platformio\packages\toolchain-gccmingw32\bin" >> $env:GITHUB_PATH

      - name: Test Arduino Nano ESP32 profile
        run: pio test -e native-arduino-nano-esp32
