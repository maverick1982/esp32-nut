    body: |-
      ## Descrizione
      Creare test unitari per la classe `DiagnosticLED` in `test/test_diagnostic_led/test_diagnostic_led.cpp` usando il framework Unity integrato in PlatformIO. I test devono verificare:
      1. **Stato iniziale:** dopo `begin()`, lo stato è `CONNECTING`.
      2. **Transizioni di stato:** `setState()` cambia correttamente lo stato e `getState()` lo riflette.
      3. **Pattern OPERATIONAL:** dopo `setState(OPERATIONAL)`, il LED è acceso fisso.
      4. **Pattern CONNECTING:** dopo `setState(CONNECTING)`, il LED alterna ON/OFF con periodo ~1000ms.
      5. **Pattern ERROR:** dopo `setState(ERROR)`, il LED alterna ON/OFF con periodo ~250ms.

      Per i test in ambiente nativo (non su hardware), mockare `digitalWrite` e `millis()` per verificare i pattern senza GPIO reale.

      ## File Coinvolti
      - `test/test_diagnostic_led/test_diagnostic_led.cpp` — Creazione del file di test con i casi sopra descritti

      ## Criteri di Completamento
      - [ ] Il file di test esiste e contiene almeno 5 test case che coprono inizializzazione, transizioni e i 3 pattern.
      - [ ] I test passano con `pio test` (ambiente nativo o embedded a seconda della configurazione).
      - [ ] Nessun test fallito o warning critico.
    ref: TASK-05
  - id: TASK-06
