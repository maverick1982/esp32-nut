      ## Descrizione
      Modificare `DiagnosticLED` per utilizzare un oggetto `Adafruit_NeoPixel` invece di `digitalWrite` per rispondere al rework feedback. Il pin per ESP32-S3-DevKitC-1 è GPIO 48.
      - Includere `<Adafruit_NeoPixel.h>` in `DiagnosticLED.h`.
      - Istanziare o includere `Adafruit_NeoPixel` come membro privato della classe (allocato dinamicamente o staticamente con 1 LED).
