schema: archetipo/plan/v2
spec_code: US-006
body: |-
  ## Soluzione Tecnica (Finalizzazione)
  Dopo un'accurata diagnosi hardware, è stato accertato che il chip WS2812B è collegato al GPIO 48 (in linea con lo schema elettrico `img3.jpg` e smentendo il pinout descrittivo). Inoltre, la resistenza di serie da 0 ohm (R1) non era stata saldata in fabbrica, interrompendo il segnale dati. Effettuato il ponte hardware, il NeoPixel Sweeper ha illuminato con successo il LED sul pin 48.

  Il piano finale consiste nel rimuovere la logica diagnostica (lo sweeper dinamico) e ripristinare la macchina a stati diagnostica definita originariamente:
  - **CONNECTING**: Lampeggio Giallo (~1 Hz)
  - **OPERATIONAL**: Verde fisso
  - **ERROR**: Lampeggio veloce Rosso (~4 Hz)

  Il driver `Adafruit_NeoPixel` verrà allocato staticamente/fissato sul GPIO 48. I test unitari precedentemente commentati per permettere lo sweeping verranno de-commentati e ripristinati, assicurandosi che verifichino i cambi di stato e colore sull'istanza `_pixels`.
tasks:
  - id: TASK-01
    title: Implementazione header DiagnosticLED con enum LedState e interfaccia pubblica
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Creare il file header `DiagnosticLED.h` nella libreria locale `lib/DiagnosticLED/src/`. Definire l'enum `LedState` con i valori `CONNECTING`, `OPERATIONAL`, `ERROR` e la classe `DiagnosticLED` con i metodi `begin(uint8_t pin)`, `setState(LedState state)`, `update()` e `getState()`. Il metodo `update()` gestisce i pattern di lampeggio in modo non-bloccante usando `millis()`.

      ## File Coinvolti
      - `lib/DiagnosticLED/src/DiagnosticLED.h` — Creazione del file header con enum, classe e costanti per i tempi di lampeggio

      ## Criteri di Completamento
      - [ ] Il file `lib/DiagnosticLED/src/DiagnosticLED.h` esiste e contiene l'enum `LedState` con almeno i valori CONNECTING, OPERATIONAL, ERROR.
      - [ ] La classe `DiagnosticLED` dichiara i metodi `begin()`, `setState()`, `update()` e `getState()`.
      - [ ] Sono definite costanti per i periodi di lampeggio (es. `LED_BLINK_SLOW_MS = 1000`, `LED_BLINK_FAST_MS = 125`).
    ref: TASK-01
  - id: TASK-02
    title: Implementazione sorgente DiagnosticLED con logica pattern non-bloccante
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      Creare il file sorgente `DiagnosticLED.cpp` in `lib/DiagnosticLED/src/`. Implementare:
      - `begin(uint8_t pin)`: configura il pin come OUTPUT e inizializza lo stato a CONNECTING.
      - `setState(LedState state)`: cambia lo stato corrente e resetta il timer del pattern.
      - `update()`: in base allo stato corrente, pilota il LED:
        - `CONNECTING`: toggle del LED ogni `LED_BLINK_SLOW_MS / 2` (lampeggio ~1 Hz, 500ms on / 500ms off).
        - `OPERATIONAL`: LED acceso fisso (`digitalWrite(pin, HIGH)`).
        - `ERROR`: toggle del LED ogni `LED_BLINK_FAST_MS / 2` (lampeggio ~4 Hz, ~125ms on / 125ms off).
      - Usare `millis()` per il timing non-bloccante. Nessuna chiamata a `delay()`.

      ## File Coinvolti
      - `lib/DiagnosticLED/src/DiagnosticLED.cpp` — Creazione del file con l'implementazione completa della classe

      ## Criteri di Completamento
      - [ ] Il file `lib/DiagnosticLED/src/DiagnosticLED.cpp` esiste e implementa tutti i metodi dichiarati nell'header.
      - [ ] Il pattern CONNECTING produce un lampeggio lento (~1 Hz).
      - [ ] Il pattern OPERATIONAL tiene il LED acceso fisso.
      - [ ] Il pattern ERROR produce un lampeggio rapido (~4 Hz).
      - [ ] Nessuna chiamata a `delay()` nel codice.
    ref: TASK-02
  - id: TASK-03
    title: Aggiunta metodo isConnected() a USBHostUPS
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Aggiungere un metodo pubblico `bool isConnected() const` alla classe `USBHostUPS` che espone lo stato di connessione del dispositivo USB. Il valore si basa sul campo `_initialized` già presente nella classe (o un flag equivalente che indica se un dispositivo UPS è stato enumerato con successo ed è ancora connesso). Questo metodo è necessario per determinare lo stato di sistema nel loop principale.

      ## File Coinvolti
      - `lib/USBHostUPS/src/USBHostUPS.h` — Aggiunta dichiarazione `bool isConnected() const`
      - `lib/USBHostUPS/src/USBHostUPS.cpp` — Aggiunta implementazione che ritorna lo stato di connessione basato su `_initialized` e `_dev_handle`

      ## Criteri di Completamento
      - [ ] Il metodo `isConnected()` è dichiarato nell'header e implementato nel sorgente.
      - [ ] Il metodo ritorna `true` quando un dispositivo UPS è enumerato e connesso, `false` altrimenti.
      - [ ] Il progetto compila senza errori dopo la modifica.
    ref: TASK-03
  - id: TASK-04
    title: Integrazione DiagnosticLED nel loop principale di main.cpp
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
    body: |-
      ## Descrizione
      Integrare la classe `DiagnosticLED` nel file `src/main.cpp`:
      1. Includere `DiagnosticLED.h`.
      2. Dichiarare un'istanza globale `DiagnosticLED diagnostic_led`.
      3. In `setup()`, chiamare `diagnostic_led.begin(LED_PIN)` con il pin del LED integrato (GPIO 48 per ESP32-S3-DevKitC-1, definito come costante in `main.h` o `DiagnosticLED.h`).
      4. In `loop()`, calcolare lo stato di sistema:
         - Se `!network_mgr.isConnected()` → `diagnostic_led.setState(LedState::CONNECTING)`
         - Se `network_mgr.isConnected() && !usb_ups.isConnected()` → `diagnostic_led.setState(LedState::ERROR)`
         - Se `network_mgr.isConnected() && usb_ups.isConnected()` → `diagnostic_led.setState(LedState::OPERATIONAL)`
      5. Chiamare `diagnostic_led.update()` ad ogni iterazione del loop.
      6. Aggiornare anche l'header `include/main.h` per includere `DiagnosticLED.h`.

      ## File Coinvolti
      - `src/main.cpp` — Aggiunta inclusione, istanza globale, inizializzazione in setup() e logica di stato + update in loop()
      - `include/main.h` — Aggiunta `#include "DiagnosticLED.h"`

      ## Criteri di Completamento
      - [ ] `DiagnosticLED.h` è incluso in `main.h`.
      - [ ] Un'istanza `diagnostic_led` è dichiarata e inizializzata in `setup()` con il pin corretto.
      - [ ] Il loop calcola lo stato di sistema combinando `network_mgr.isConnected()` e `usb_ups.isConnected()` e chiama `setState()` di conseguenza.
      - [ ] `diagnostic_led.update()` è chiamato ad ogni iterazione del loop.
      - [ ] Il progetto compila senza errori.
    ref: TASK-04
  - id: TASK-05
    title: Test unitari per la macchina a stati DiagnosticLED
    type: Test
    status: DONE
    dependencies:
