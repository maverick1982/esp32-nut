  - id: TASK-10
    title: Abilitazione alimentazione NeoPixel su ESP32-S3
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Sulle board ESP32-S3, il NeoPixel richiede spesso che un pin di alimentazione specifico venga attivato per funzionare. Per la DevKitC-1 e cloni, questo pin è tipicamente il GPIO 38.
      Nel metodo `begin()` di `DiagnosticLED.cpp` aggiungeremo il setup di questo pin di alimentazione (impostandolo ad OUTPUT e su HIGH).
      Se la libreria core di Arduino per ESP32 definisce la macro `RGB_BUILTIN`, useremo quella; altrimenti faremo fallback sul PIN 48 per i dati. Inoltre definiremo una costante `NEOPIXEL_POWER_PIN` a 38.

      ## File Coinvolti
      - `lib/DiagnosticLED/src/DiagnosticLED.h`
      - `lib/DiagnosticLED/src/DiagnosticLED.cpp`

      ## Criteri di Completamento
      - [ ] In `DiagnosticLED.h`, viene definita una macro `NEOPIXEL_POWER_PIN` (valore 38).
      - [ ] In `DiagnosticLED.cpp` `begin()`, il `NEOPIXEL_POWER_PIN` viene configurato come `OUTPUT` e scritto su `HIGH`.
      - [ ] La compilazione completa senza errori.
    ref: TASK-10
  - id: TASK-11
    title: Migrazione da Adafruit_NeoPixel a neopixelWrite (Core)
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      In base all'ultimo feedback, Adafruit_NeoPixel in combinazione con il GPIO 48 non ha successo. Vogliamo sfruttare la funzione core nativa di Arduino ESP32 (`neopixelWrite`) pensata specificamente per pilotare `RGB_BUILTIN` senza driver RMT esterni che spesso conflittano sull'ESP32-S3.
      1. In `platformio.ini`, rimuovere `adafruit/Adafruit NeoPixel` dalle dipendenze.
      2. In `DiagnosticLED.h`, rimuovere l'inclusione di Adafruit_NeoPixel, l'oggetto `_pixels`, e usare macro colore semplici in formato esadecimale (es. `0x00RRGGBB`). Mantenere la variabile per salvare lo stato dei colori.
      3. In `DiagnosticLED.cpp` aggiornare `setPixelColorAndShow` per chiamare `neopixelWrite(RGB_BUILTIN, r, g, b)`. Aggiungere un piccolo delay di 10ms dopo l'accensione del pin di potenza prima di fare il primo `neopixelWrite`.
      4. Rimuovere ogni riferimento ad Adafruit_NeoPixel anche nei file di test (`test_diagnostic_led.cpp`), sostituendo la logica dei colori con semplici numeri `uint32_t` o define di costanti.

      ## File Coinvolti
      - `platformio.ini`
      - `lib/DiagnosticLED/src/DiagnosticLED.h`
      - `lib/DiagnosticLED/src/DiagnosticLED.cpp`
      - `test/test_diagnostic_led/test_diagnostic_led.cpp`

      ## Criteri di Completamento
      - [ ] La dipendenza adafruit viene rimossa.
      - [ ] Il metodo `update()` usa `neopixelWrite(RGB_BUILTIN, ...)` estraendo le componenti R, G, B dal colore salvato.
      - [ ] I test unitari sono refattorizzati per compilare con le nuove costanti dei colori e verificano che `getCurrentColor()` esponga il valore HEX corretto.
      - [ ] Il codice compila correttamente.
    ref: TASK-11
  - id: TASK-12
    title: Implementazione della routine diagnostica Pin Sweeper
    type: Fix
    status: DONE
    body: |-
      ## Descrizione
      Poiché non conosciamo il pin esatto del NeoPixel, implementiamo una routine temporanea di diagnostica. Sostituiamo il corpo del metodo `DiagnosticLED::update()` con un ciclo che prova una serie di pin noti per ESP32-S3: `8, 21, 33, 35, 38, 48, 4, 18, 47, 45`.
      Il metodo manterrà internamente l'indice del pin testato correntemente e lo cambierà ogni 2 secondi, usando sempre `millis()` per non bloccare il loop.
      Ad ogni cambio pin, scriverà su `Serial` il messaggio `"*** DIAGNOSTICA NEOPIXEL: Provo il PIN %d ***\n"` e invierà un colore (es. Rosso acceso) al pin corrente tramite `rgbLedWrite(pin, 255, 0, 0)`.
      Sui pin precedenti che sono stati testati invierà un colore spento `rgbLedWrite(pin_precedente, 0, 0, 0)` prima di passare al successivo per evitare che rimangano tutti accesi se ci sono più LED.
      Una volta scoperto il pin corretto, questo task servirà da base per impostare definitivamente il PIN corretto e annullare questa routine temporanea.

      ## File Coinvolti
      - `lib/DiagnosticLED/src/DiagnosticLED.cpp`
      - `lib/DiagnosticLED/src/DiagnosticLED.h`

      ## Criteri di Completamento
      - [ ] `DiagnosticLED.h` dichiara i membri necessari per tenere traccia dell'indice del pin diagnostico e del tempo trascorso.
      - [ ] `DiagnosticLED::update()` ignora lo stato di sistema e si limita a scorrere l'array di pin, stampare su `Serial` e chiamare `rgbLedWrite(pin, r, g, b)`.
      - [ ] Il codice compila senza errori.
    ref: TASK-12
  - id: TASK-13
    title: Configurazione Definitiva NeoPixel su GPIO 47
    type: Fix
    status: DONE
    body: "## Descrizione\nSostituiamo la routine di diagnostica con la soluzione finale basata sul pin 47 fornito dall'utente. Per massimizzare la compatibilità hardware con i cloni cinesi WS2812/SK6812 (che potrebbero non digerire bene la funzione nativa `rgbLedWrite`), ripristineremo `Adafruit_NeoPixel`.\nInoltre, rimuoveremo completamente il blocco forzato del `GPIO 38` come power pin, poiché tenerlo HIGH potrebbe aver interferito con il funzionamento della scheda durante il precedente Pin Sweeper.\n\n1. In `platformio.ini`, ripristinare la libreria `adafruit/Adafruit NeoPixel@^1.12.0` in `lib_deps`.\n2. In `DiagnosticLED.h`: \n   - Includere `Adafruit_NeoPixel.h`\n   - Impostare `#define LED_BUILTIN_PIN 47` e rimuovere la definizione `NEOPIXEL_POWER_PIN`.\n   - Rimuovere i campi dello sweeper (`_sweepIndex`) e reintrodurre `Adafruit_NeoPixel _pixels`.\n3. In `DiagnosticLED.cpp`: \n   - Re-inizializzare `_pixels(1, LED_BUILTIN_PIN, NEO_GRB + NEO_KHZ800)` nel costruttore.\n   - Ripristinare `setPixelColorAndShow` affinché usi `_pixels.setPixelColor()` e `_pixels.show()`.\n   - In `begin()`, rimuovere pinMode e digitalWrite per il power pin 38. Chiamare `_pixels.begin()`, `setBrightness(50)` e `show()`.\n   - In `update()`, **ripristinare la logica originale** a stati (CONNECTING = blink giallo, OPERATIONAL = fisso verde, ERROR = blink veloce rosso) rimpiazzando lo sweeper.\n4. In `test_diagnostic_led.cpp`: aggiornare le macro colore se necessario.\n\n## File Coinvolti\n- `platformio.ini`\n- `lib/DiagnosticLED/src/DiagnosticLED.h`\n- `lib/DiagnosticLED/src/DiagnosticLED.cpp`\n- `test/test_diagnostic_led/test_diagnostic_led.cpp`\n\n## Criteri di Completamento\n- [ ] La libreria Adafruit è presente in `platformio.ini`.\n- [ ] Il codice usa il pin 47 fisso.\n- [ ] Non vi sono più pin di potenza forzati a HIGH.\n- [ ] Il pattern a stati di connettività in `update()` è stato ripristinato.\n- [ ] Compilazione e test passano."
    ref: TASK-13
  - id: TASK-14
    title: Implementazione NeoPixel Sweeper con Adafruit_NeoPixel
    type: Fix
    status: DONE
    body: |-
      ## Descrizione
      A causa di incongruenze tra schema elettrico (che riporta GPIO 48) e pinout del fornitore (che riporta GPIO 47), modifichiamo la classe `DiagnosticLED` per eseguire uno sweeping su un array limitato di pin: `{48, 47, 38, 21, 35, 33, 8, 45, 4, 18}`.
      La particolarità di questo sweeper è che **DEVE utilizzare `Adafruit_NeoPixel`** e non `rgbLedWrite()`, per assicurare che il timing del segnale sia digeribile dalla board.
      1. In `DiagnosticLED.h`: rimpiazzare l'istanza privata `_pixels` con un puntatore `Adafruit_NeoPixel* _pixels;`. Aggiungere un membro `uint8_t _sweepIndex;` (inizializzato a 0 nel costruttore).
      2. In `DiagnosticLED.cpp` `begin()`: allocare dinamicamente il primo pixel `_pixels = new Adafruit_NeoPixel(1, testPins[0], NEO_GRB + NEO_KHZ800);`, avviarlo e impostare rosso brillante.
      3. In `DiagnosticLED.cpp` `update()`: ogni 2 secondi, spegnere il led corrente (`_pixels->setPixelColor(0,0)`, `_pixels->show()`), distruggere l'oggetto (`delete _pixels;`), avanzare l'indice dell'array, stampare su `Serial` (es. `"*** DIAGNOSTICA NEOPIXEL (Adafruit): Provo il PIN %d ***\n"`), e **riallocare** `_pixels = new Adafruit_NeoPixel(1, testPins[_sweepIndex], ...);`. Poi fare `begin()`, `setBrightness(255)` e mandare Rosso fisso.

      Per i test unitari (`test_diagnostic_led.cpp`): commentare tutto temporaneamente in modo che non fallisca la compilazione, visto che il comportamento in questo step è diagnostico. La signature di `setPixelColorAndShow()` può semplicemente inoltrare al puntatore `if(_pixels) _pixels->setPixelColor...` oppure rimanere inutilizzata finché lo sweeper è attivo.

      ## File Coinvolti
      - `lib/DiagnosticLED/src/DiagnosticLED.h`
      - `lib/DiagnosticLED/src/DiagnosticLED.cpp`
      - `test/test_diagnostic_led/test_diagnostic_led.cpp`

      ## Criteri di Completamento
      - [ ] `_pixels` è un puntatore gestito dinamicamente.
      - [ ] `update()` cambia pin ogni 2 secondi, allocando un nuovo oggetto `Adafruit_NeoPixel` per azzerare il canale RMT e garantire pulizia del segnale.
      - [ ] Il PIN corrente viene stampato sulla Seriale.
      - [ ] Nessun errore di sintassi, compilazione ok.
    ref: TASK-14
  - id: TASK-15
    title: Ripristino logica diagnostica su GPIO 48
    type: Fix
    status: DONE
    body: |-
      ## Descrizione
      Dopo aver identificato il GPIO 48 tramite ponte hardware e sweeper software, ripristiniamo la logica funzionale del LED, eliminando il codice di test temporaneo.
      1. In `DiagnosticLED.h`:
         - Impostare la macro `LED_BUILTIN_PIN 48` in caso fosse stata cambiata.
         - Rimuovere il membro `_sweepIndex` e ripristinare `Adafruit_NeoPixel _pixels;` al posto del puntatore `Adafruit_NeoPixel* _pixels;` per una gestione della memoria statica e più sicura, visto che il pin non deve più cambiare a runtime.
      2. In `DiagnosticLED.cpp`:
         - Nel costruttore, inizializzare `_pixels(1, LED_BUILTIN_PIN, NEO_GRB + NEO_KHZ800)`.
         - In `begin()`: chiamare `_pixels.setPin(_pin); _pixels.begin(); _pixels.setBrightness(50); _pixels.show(); setPixelColorAndShow(COLOR_OFF);` per l'avvio.
         - In `update()`: ripristinare integralmente lo `switch (_state)` originale che gestisce i 3 pattern (`CONNECTING`, `OPERATIONAL`, `ERROR`) tramite `millis()`, eliminando il loop di test `testPins[]` e le stampe seriali.
         - Ripristinare `setPixelColorAndShow()` senza la sintassi puntatore (`_pixels.setPixelColor(...)`).
      3. In `test_diagnostic_led.cpp`:
         - De-commentare (rimuovere i `return;` inseriti all'inizio) tutte le funzioni di test unitario, in modo da riattivare la verifica della corretta logica della macchina a stati.

      ## File Coinvolti
      - `lib/DiagnosticLED/src/DiagnosticLED.h`
      - `lib/DiagnosticLED/src/DiagnosticLED.cpp`
      - `test/test_diagnostic_led/test_diagnostic_led.cpp`

      ## Criteri di Completamento
