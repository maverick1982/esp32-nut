      - Aggiungere il getter `uint32_t getCurrentColor() const;` alla classe.
      - Modificare `setState()` e `update()` per usare `setPixelColor()` e `show()` invece di `digitalWrite()`.
      - Impostare i colori: CONNECTING = Giallo (es. `Color(255, 255, 0)`), OPERATIONAL = Verde (`Color(0, 255, 0)`), ERROR = Rosso (`Color(255, 0, 0)`). Per spegnere usare NERO (`Color(0, 0, 0)`).

      ## File Coinvolti
      - `lib/DiagnosticLED/src/DiagnosticLED.h`
      - `lib/DiagnosticLED/src/DiagnosticLED.cpp`

