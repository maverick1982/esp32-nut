      ## Descrizione
      Creare o estendere i test per verificare che la logica di calcolo dello stato di sistema in `main.cpp` produca il `LedState` corretto per ogni combinazione di stati. Testare le seguenti combinazioni:
      1. Wi-Fi disconnesso + UPS disconnesso → `CONNECTING`
      2. Wi-Fi disconnesso + UPS connesso → `CONNECTING`
      3. Wi-Fi connesso + UPS disconnesso → `ERROR`
      4. Wi-Fi connesso + UPS connesso → `OPERATIONAL`

      Si può estrarre la logica di calcolo dello stato in una funzione helper `LedState computeSystemState(bool wifiConnected, bool upsConnected)` per facilitare il test unitario.

      ## File Coinvolti
