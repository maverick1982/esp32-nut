      ## Descrizione
      **Obiettivo:** dimostrare che gli HID non cambiano, misurare la flash per il PR e documentare il percorso Q* dell'host.

      **Leggere:** `docs/concepts/architecture.md` (paragrafi Q*, righe ~151-157), `docs/adr/0013-qx-ups-support.md` sezioni 2, 3, 5; `platformio.ini`.

