  # US-136: Driver Q* nella scheda: percorso Q* dopo l'aggancio, primitive USB, attesa limitata, dati stale e sezione Q* dell'export — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-07

  ---

  ## Spec

  **Epic:** EP-007 — Supporto UPS Q* (nutdrv_qx)
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come sviluppatore che porta i trasporti USB di `nutdrv_qx` (ADR 0013, sezioni 2, 3 e 5), voglio che dopo l'aggancio di un UPS Q* l'host crei il driver Q* sul trasporto della riga trovata, con le primitive USB che servono ai trasporti Q* e un'attesa delle risposte limitata, in modo che ogni trasporto successivo sia solo la copia del suo `*_command()` e che un tester possa mandarci un export diagnostico con gli scambi Q*.

  **Criteri di Accettazione**
  - Primitive dell'host sull'interfaccia agganciata, senza lock applicativi durante il trasferimento (ADR 0008): SET_REPORT di byte arbitrari; string descriptor con indice e langid espliciti, senza la memoria degli indici falliti di `requestStringDescriptor()`; lettura dei pezzi dell'interrupt IN con timeout.
  - L'interfaccia di trasporto Q* (un comando, una risposta, come i `*_command()` di NUT) è usata dal driver Q*, che implementa il nucleo di `IUPSDriver` con `hid() == nullptr`.
  - Il comando Q* è sincrono nel task di poll: per l'interrupt IN la primitiva prende i pezzi dalla coda degli eventi fino al terminatore o al timeout del trasporto; gli altri eventi letti nel frattempo restano in ordine e vengono gestiti appena il comando finisce (test nativo).
  - Un passo del poll blocca al massimo per i timeout di un comando del trasporto, molto meno dei 30 s del Task WDT; il limite è scritto nel piano per ogni trasporto.
  - Monitor del collegamento e scala di ripristino ricevono gli esiti dei trasferimenti come per gli HID; dati stale dopo i poll falliti consecutivi di `upsdrv_updateinfo()`; `isWaitingFirstData()` vero fino al protocollo riconosciuto e al primo giro completo.
  - Export diagnostico USB, sezione Q*: trasporto, protocollo, esito del riconoscimento e ultimi 20 scambi (comando, risposta grezza in testo ed esadecimale, lunghezza, ora, errore).
  - Regressione HID: test nativi, replay ed e2e verdi senza cambiare le asserzioni; misura della flash sull'immagine da 4 MB (#93) riportata nel PR.

  ---

  ## Soluzione tecnica

  Il lavoro sta quasi tutto in codice nuovo e puro (compilato anche in nativo), con un solo innesto nell'host: `USBHostUPS` offre le primitive e la supervisione, il driver Q* (`QxDriver`) mette insieme trasporto, riconoscimento (`QxProber`, US-134), motore (`QxEngine`, US-133) e controllo (`QxControl`, US-135). Nessun trasporto USB reale: il registro dei trasporti è vuoto, quindi con un UPS Q* vero la scheda resta sul percorso "non ancora supportato" di US-132 finché US-137 non aggiunge krauler, fabula e hunnox. Con gli UPS HID non cambia nulla.

  ### 1. Primitive USB dell'host — `IQxUsbPrimitives.h` (nuovo)

  Interfaccia pura, implementata dall'host e finta nei test:

  ```cpp
  class IQxUsbPrimitives {
  public:
      // SET_REPORT(type, id) di len byte sull'interfaccia agganciata: byte mandati o errore < 0
      virtual int setReport(uint8_t reportType, uint8_t reportId, const uint8_t* data, size_t len) = 0;
      // GET_DESCRIPTOR(STRING, index, langid): descrittore grezzo (bLength, 0x03, UTF-16LE),
      // al massimo 255 byte. Nessuna memoria degli indici falliti (a differenza di
      // requestStringDescriptor(), review M5): per krauler l'indice è il comando
      virtual int getStringDescriptor(uint8_t index, uint16_t langid, uint8_t* buf, size_t buflen) = 0;
      // Un pezzo dell'interrupt IN dell'interfaccia agganciata (usb_interrupt_read()):
      // lunghezza, oppure QX_USB_ERR_TIMEOUT dopo timeoutMs
      virtual int readInterrupt(uint8_t* buf, size_t buflen, uint32_t timeoutMs) = 0;
      // Scarta i pezzi interrupt IN arrivati fuori da un comando (gli altri eventi restano)
      virtual void discardInput() = 0;
      // Budget del comando in corso: dopo deadline nessun trasferimento nuovo parte
      // (QX_USB_ERR_TIMEOUT senza traffico) e le attese interrupt sono accorciate; 0 = nessuno
      virtual void setDeadline(uint32_t deadlineMs) = 0;
      virtual uint32_t nowMs() const = 0;
      // Testo dell'ultimo errore per l'export ("ESP_ERR_TIMEOUT", "budget", "no device")
      virtual const char* lastError() const = 0;
  };
  ```

  Codici di errore negativi come quelli di libusb (`QX_USB_ERR_IO`, `_TIMEOUT`, `_NO_DEVICE`, `_PIPE`), così i trasporti portati restano vicini al codice upstream (`ret <= 0`). L'host implementa le primitive in un adattatore interno (membro di `USBHostUPS`, non una base in più): chiama `hid_class_request_set_report()` (copia in `_request_buffer`, l'API vuole un puntatore non const) e `hid_host_device_get_string_descriptor()` senza tenere `_mutex` né altri lock applicativi, rifiuta i trasferimenti quando `!_link.canPoll(now)` come `requestReport()`, passa ogni esito da `noteControlResult()` (monitor del collegamento, ADR 0008) e conta i successi in `_get_ok_since_claim` (`isControlPipeProven()`, politica di riavvio e attesa dopo il ciclo della porta valgono anche per Q*). Contatori propri per la riga di statistica (", N Q* transfers ok, M failed" solo se non nulli: la riga HID resta identica).

  ### 2. Trasporto USB Q* — `QxUsbTransport.h`, `QxUsbTransports.h/.cpp` (nuovi)

  ```cpp
  static const uint32_t QX_CTRL_TIMEOUT_MS = 1500;     // USBUPS_CTRL_TIMEOUT_MS di hid_host.c
  static const uint32_t QX_STEP_BOUND_MAX_MS = 12000;  // limite di un passo, < 30 s del Task WDT
  inline uint32_t qxStepBoundMs(uint32_t budgetMs) { return 2 * budgetMs + QX_CTRL_TIMEOUT_MS; }

  class QxUsbTransport : public IQxTransport {
  public:
      explicit QxUsbTransport(IQxUsbPrimitives& usb) : _usb(usb) {}
      // Template method: deadline = now + commandBudgetMs(), doCommand(), deadline tolta
      int command(const char* cmd, size_t cmdlen, char* buf, size_t buflen) final;
      virtual const char* name() const = 0;          // nome del sottodriver USB di NUT
      virtual uint32_t commandBudgetMs() const = 0;  // limite scritto nel piano per ogni trasporto
      virtual bool needsInterruptIn() const { return false; }
      const char* lastError() const { return _usb.lastError(); }
  protected:
      virtual int doCommand(const char* cmd, size_t cmdlen, char* buf, size_t buflen) = 0; // il *_command() portato
      IQxUsbPrimitives& _usb;
  };
  ```

  `QxUsbTransports::create(name, usb)` restituisce `std::unique_ptr<QxUsbTransport>` da una tabella `{nome, fabbrica}` **vuota** in questa storia (commento: US-137 aggiunge `krauler`, `fabula`, `hunnox`): per ogni nome di `qx_usb_id[]` restituisce `nullptr`.

  ### 3. Limite di attesa di un passo del poll (criterio 4)

  Regole che lo garantiscono per costruzione:
  - **Un comando Q* per passo del walk.** `QxEngine` guadagna un walk a passi (sezione 4): ogni chiamata del poll manda al massimo un comando al trasporto; le righe che riusano la risposta precedente (`previous_item`) non contano.
  - **Il claim e i ripieghi di `instcmd()` al massimo due comandi**, il secondo solo dopo una risposta del primo (`blazer_claim`: `Q1` poi `I`/`FW?`; ripieghi `load.*.delay`). Per questo il limite è `2 × budget + QX_CTRL_TIMEOUT_MS` (un trasferimento partito poco prima della scadenza finisce entro il suo timeout).
  - **Budget per comando** imposto dalle primitive con la deadline del template method: un trasporto che ripete (krauler fino a 10 volte su risposte corrotte) si ferma alla scadenza. Deviazione da NUT solo quando il dispositivo non risponde o risponde male fino alla scadenza: il comando sarebbe fallito comunque.
  - **Una richiesta di comando/SET VAR prende il posto del passo di poll** in quell'iterazione del task.

  | Trasporto | Storia | Budget per comando | Passo massimo (`qxStepBoundMs`) | Motivo |
  |---|---|---|---|---|
  | finto dei test (`QxLoopbackTransport`) | US-136 | 2 000 ms | 5,5 s | SET_REPORT a blocchi di 8 byte + pezzi interrupt fino a `\r` |
  | krauler, fabula | US-137 | 3 000 ms | 7,5 s | 1 GET_DESCRIPTOR ≤ 1,5 s; con errore `ret <= 0` ritorno subito; ripetizioni solo su risposte arrivate |
  | hunnox | US-137 | 4 500 ms | 10,5 s | preambolo `hunnox_protocol()` fino a 3 GET_DESCRIPTOR (passo 0) + il comando, errori del preambolo ignorati come in NUT |
  | SET_REPORT + interrupt IN (cypress, phoenix, ippon, sgs) | dopo US-137 | ≤ 4 500 ms, fissato al porting | ≤ 10,5 s | scritture a blocchi da 8 byte + letture da 1 000 ms fino a `\r` |

  Un test nativo controlla che ogni trasporto registrato rispetti `qxStepBoundMs(budget) <= QX_STEP_BOUND_MAX_MS` (oggi vuoto, protegge US-137) e, con un orologio finto, che un passo del driver sul trasporto finto non superi il suo limite neanche con un dispositivo muto.

  ### 4. Walk a passi in `QxEngine` (modifica di US-133)

  `walk(mode)` diventa `beginWalk(mode)` + `walkStep()` con cursore di riga (`_walkRow`, `_walkMode`, `_walkActive`); `walkStep()` ritorna dopo la prima riga che ha chiamato `process()` oppure a fine tabella (stima della batteria a fine walk FULL, come oggi) oppure al fallimento di una riga `QX_FLAG_QUICK_POLL`. API nuove:

  ```cpp
  enum class Phase : uint8_t { Pending, Ok, Failed };
  Phase initInfoStep(UPSData& data, uint32_t nowMs);    // upsdrv_initinfo() un comando alla volta
  Update updateInfoStep(UPSData& data, uint32_t nowMs); // upsdrv_updateinfo(); Update::Pending finché il walk non finisce
  void abortWalk();                                     // un comando gira tra due passi: il walk riparte
  bool walkPending() const;
  ```

  Le operazioni di inizio (scelta full/quick, azzeramento di stato e allarmi, `driver.version.data`) avvengono al primo passo, quelle di fine (`commitStatus()`, allarmi, `_lastPollMs`, `_retry`, `walkFailed()`) all'ultimo. `initInfo()` e `updateInfo()` restano sincroni come wrapper che ciclano sui passi: `test_qx_engine`, `test_qx_protocols`, `test_qx_probe`, `test_qx_control` non cambiano.

  ### 5. Driver Q* — `QxDriver.h/.cpp`, `QxExchangeLog.h` (nuovi), `IQxHostPort.h` (nuovo)

  `IQxHostPort` è ciò che il driver vede dell'host: `lock()`, `unlock()` (il `_mutex` ricorsivo dei dati) e `log(level, text)`. `QxDriver : IUPSDriver` con `hid() == nullptr`:

  - **Stato:** `Probing` → `Init` → `Polling`. `setup()` (aggancio e ogni ripristino della scala) riporta tutto a `Probing`: `QxProber::restart()`, motore rilasciato, dati ombra svuotati con `driver.name = nutdrv_qx`, `ups.vendorid`/`ups.productid` in `%04x` (`nutdrv_qx.c:3920-3921`).
  - **`poll(data, now)`**, un passo: in `Probing` `QxProber::step()`; a `Claimed` `takeEngine()` + `initUps()`; in `Init` `initInfoStep()` (a `Failed`, il `fatalx("Can't initialise data")` di NUT, log ERROR e ritorno a `Probing` con `setup()`); in `Polling` `updateInfoStep()` ogni `DEFAULT_POLLINTERVAL_S` (2 s) dall'inizio del walk precedente, e a ogni passo finché il walk è in corso.
  - **Dati ombra, nessun lock durante i trasferimenti:** motore e prober scrivono in un `UPSData _shadow` del driver, senza lock; alla fine di ogni passo che ha cambiato qualcosa il driver prende `host.lock()` e rende i dati dell'host uguali all'ombra (scrive le chiavi cambiate con `valueEquals`, toglie quelle sparite). Sul percorso Q* l'host non scrive altre chiavi in `UPSData`. I consumatori vedono un walk completo alla volta.
  - **Registro degli scambi:** un decoratore `IQxTransport` interno avvolge il `QxUsbTransport` e passa a prober e motore; dopo ogni comando, sotto `host.lock()`, scrive in `QxExchangeLog` (anello di 20 voci a dimensione fissa: comando fino a 32 byte, risposta grezza fino a 128 byte con flag `truncated`, risultato, `uptime_ms` d'inizio, durata, errore da `lastError()` se risultato < 0).
  - **Log:** le righe del prober (`[Q*] Using protocol: ...`, `[Q*] Device not supported!`) vanno al log dell'host; a `Update::Stale` una volta WARN `[Q*] Communications with the UPS lost: status read failed!`; al primo `Ok` dopo, con `reestablished()`, INFO `[Q*] Communications with the UPS re-established` (`nutdrv_qx.c:3525-3601`).
  - **Hook del nucleo:** `initialPollDone()` vero solo dopo `initInfo` riuscito e il primo `updateInfoStep() == Ok`; `dataStale()` vero da `Update::Stale` al successivo `Ok`; `firstDataWaitBounded()` falso; `control()` = `QxControl::instance()`; `qx()` = `this`.
  - **Comandi (nel task di poll):** `runCommand(data, name, param)` e `runSetVariable(data, name, value)` fanno `abortWalk()`, chiamano `QxControl::runCommand/runSetVariable` sull'ombra, pubblicano. `commands()` restituisce, sotto lock dell'host, una cache calcolata nel task di poll con `QxControl::commandsOf()` alla fine di `Init` (il motore non si legge mai da un altro task).
  - **Diagnostica:** `fillDiagnostics(UsbDiagQx&)`, chiamata sotto lock: trasporto, protocollo (`nome versione` del claim), stato del riconoscimento (`probing`, `claimed`, `not_supported`, `waiting`), tentativi, giri falliti, protocollo forzato, scambi dal più vecchio.

  ### 6. Nucleo di `IUPSDriver` (aggiunte neutre, default = comportamento HID di oggi)

  ```cpp
  virtual bool dataStale() const { return false; }           // l'host lo aggiunge a isDataStale()
  virtual bool firstDataWaitBounded() const { return true; } // FIRST_DATA_MAX_MS vale solo se vero
  virtual QxDriver* qx() { return nullptr; }                 // estensione Q*, come hid()
  virtual const QxDriver* qx() const { return nullptr; }
  ```

  Servono all'host per ogni famiglia (regola dell'ADR 0013, sezione 1); `qx()` segue il modello di `hid()`. La decisione "primo dato pronto" esce da `service()` in una funzione pura `FirstData.h` (`firstDataReady(initialPollDone, statusKnown, bounded, elapsedMs)`), identica per gli HID e provata in nativo.

  ### 7. Interrupt IN nel task di poll — `EventBacklog.h` (nuovo, template header-only)

  `EventBacklog<Ev, N>`: FIFO a dimensione fissa (N = 8) degli eventi letti durante un comando. `readInterruptChunk(source, backlog, bound, buf, buflen, got, timeoutMs, dropped)`: riceve dalla coda fino al primo pezzo INPUT dell'interfaccia agganciata (→ `Chunk`) o al timeout (→ `Timeout`); un DISCONNECTED o TRANSFER_ERROR dell'interfaccia agganciata va nel backlog e chiude l'attesa (→ `Gone`/`Error`); ogni altro evento va nel backlog, tranne gli INPUT di altre interfacce, scartati e contati; backlog pieno → `Error` senza togliere altro dalla coda (l'ordine resta). `discardInputChunks()` fa lo stesso con attesa 0. Template sul tipo di evento e sulla sorgente (`receive(ev, waitMs)`, `now()`), così il test nativo usa eventi e coda finti. `USBHostUPS::processEvents()` gestisce prima il backlog e poi la coda, con il corpo del `switch` spostato in `handleEvent()`; per gli HID il backlog è sempre vuoto.

  ### 8. Innesto in `USBHostUPS`

  - **Aggancio:** `claimQxInterface()` chiama `QxUsbTransports::create(match.qx_transport, _qx_usb)`. `nullptr` → percorso di US-132 invariato. Altrimenti, sotto `_mutex`: `_driver = new QxDriver(...)`, `_driver->setup()`, `_unsupported_device = ""`, `_link.reset()`, `_first_data_ready = false`, `_claimed_at`, `_get_ok_since_claim = 0`, `_in_pipe_wanted = transport->needsInterruptIn()` (pipe IN avviata solo allora, con il ritentativo di oggi), `_is_ready_to_poll = true`. Il ramo HID imposta `_in_pipe_wanted = true` e non cambia.
  - **Supervisione condivisa:** `service()` non cambia ordine: monitor del collegamento, controllo del trasferimento bloccato, ciclo della porta e riavvio valgono per Q* come per gli HID; il watchdog degli INPUT resta inerte (`DriverDispatch::inputValuesPolled()` vero senza HID). `recoverInterface()` con `_in_pipe_wanted == false` salta stop/clear halt/start della pipe IN e fa solo `setup()` del driver (riparte il riconoscimento). `processInputReport()` esce subito senza estensione HID (`DriverDispatch::hidOf(_driver) == nullptr`). `isDataStale()` aggiunge `_driver->dataStale()`; il primo dato usa `firstDataReady()` con `_driver->firstDataWaitBounded()`.
  - **Comandi da altri task:** i tre metodi neutri di `IUpsControlPort` (US-135). `driverCommands()` = `qx()->commands()` sotto `_mutex`. `runDriverCommand()`/`runDriverSetVariable()` mettono la richiesta in una casella unica (serializzata da un mutex FreeRTOS proprio, mai `_op_mutex`, che il task di poll tiene durante `service()`), poi aspettano un semaforo binario fino a `qxStepBoundMs(budget) × 2 + 1 s`; scaduto il tempo la richiesta è abbandonata (numero di generazione) e l'esito è `FAILED`. `service()` la serve subito dopo `processEvents()` e la supervisione: se il poll non può girare (riavvio chiesto, pipe in ripristino, `!_link.canPoll()`, driver non Q* o non pronto) risponde `FAILED`/`NOT_CONNECTED` senza trasferimenti; altrimenti esegue `qx()->runCommand/runSetVariable` al posto del passo di poll di quell'iterazione. Il log "Command X: OK" resta quello di `USBHostUPS::executeCommand()`.
  - **Export:** `snapshotUSBDiagnostics()` riempie `s.qx` con `qx()->fillDiagnostics()` quando c'è un driver Q*; con US-132 (nessun driver) solo `present` e `transport`.

  ### 9. Sezione Q* dell'export — `UsbDiagSnapshot.h`, `UsbDiagJson.cpp`

  `UsbDiagSnapshot` guadagna `UsbDiagQx qx` (`present`, `transport`, `protocol`, `probe`, `tries`, `failed_cycles`, `forced_protocol`, `exchanges`, più `epoch_ms`/`uptime_ms` della scheda all'istante dell'export). `UsbDiagJson` scrive l'oggetto `"qx"` dopo `"export_read"` **solo se `present`**: l'export HID resta identico byte per byte. Ogni scambio: `uptime_ms`, `time` (solo con l'ora della scheda valida, calcolata con `boardEpochMs()` come le righe del System Log, `src/network/web_config_server.cpp:536`), `command` (testo con escape JSON), `answer_text`, `answer_hex` (due cifre maiuscole separate da spazio), `length` (risultato del trasporto), `duration_ms`, `truncated`, `error`.

  ### Fuori da questa storia (da una spec successiva)

  Punti lasciati aperti da US-135 che i criteri di US-136 non chiedono: catalogo RW delle variabili Q* con intervalli (oggi un SET VAR Q* da NUT o Web UI risponde READONLY, perché `checkSetValue()` non trova la variabile nel catalogo; `runDriverSetVariable()` è comunque implementato e provato), salvataggio di `ups.delay.*` come valori lato driver, `beeper.toggle` dalla Web UI. Un UPS Q* che nessun protocollo riconosce resta "in attesa dei primi dati" (stale) e il System Log scrive `Device not supported!` una volta.

  ### Note

  - #93 riguarda l'ESP32-S3 con 4 MB (slot OTA massimo 0x1F0000 = 2 031 616 byte): in questo branch non c'è un ambiente classico, la misura si fa sull'immagine `esp32-s3-standard` rispetto a quello slot e a `cf910d2`.
  - ADR 0013 vieta rami di famiglia dentro la logica HID: le decisioni passano da `qx()`/`hid()` e da proprietà (`_in_pipe_wanted`), non da `if (qx)` sparsi.
  - Modifiche ai file con Edit/Write, non con script inline (memoria di progetto).

  ---

  ## Strategia di test

  La "dimostrazione" è un test nativo del driver Q* con primitive finte e un trasporto finto; l'host vero (`USBHostUPS.cpp`, non compilabile in nativo) si verifica con la regressione completa, la build e, con il consenso dell'utente, una prova di fumo sull'Eaton 3S.

  - **`test_qx_engine` (casi nuovi):** il walk a passi produce gli stessi `UPSData` del walk sincrono su tutte le tabelle `testing_t` portate; un comando al trasporto per passo; `abortWalk()` e ripartenza; `Update::Pending`; nessun test esistente cambiato.
  - **`test_qx_interrupt_read` (nuovo):** ordine degli eventi conservato nel backlog, pezzo dell'interfaccia agganciata restituito, timeout, DISCONNECTED/TRANSFER_ERROR che chiudono l'attesa e restano in coda, INPUT di altre interfacce scartati e contati, backlog pieno, `discardInputChunks()`.
  - **`test_qx_driver` (nuovo, la dimostrazione):** `FakeQxUsbPrimitives` (orologio finto, trasferimenti registrati, controllo che nessuna primitiva giri con il lock finto dell'host preso) + `QxLoopbackTransport` (SET_REPORT a blocchi di 8 byte, risposta in pezzi interrupt fino a `\r`, risposte dalla tabella `testing_t` di megatec) + `FakeQxHostPort`. Ciclo completo: aggancio (`setup`), riconoscimento di `megatec`, `Init` in più passi, primo giro completo (`initialPollDone()` passa a vero solo allora), valori in `UPSData` dell'host (`ups.status`, `input.voltage`, `driver.name`, `ups.vendorid`), comandi tramite `QxControl` e una porta che inoltra a `QxDriver::runCommand` (stringa mandata per `beeper.toggle`, `shutdown.return`), dispositivo muto → `dataStale()` dopo i fallimenti consecutivi di NUT e riga di log una volta, ritorno → `re-established`, registro degli ultimi 20 scambi (il 21° scaccia il primo), `fillDiagnostics()`. Limite di attesa: con risposte che scadono, ogni `poll()` resta entro `qxStepBoundMs(budget)` sull'orologio finto. `FirstData.h`: HID invariato (limite di 30 s) e Q* senza limite. Registro dei trasporti: `nullptr` per ogni nome di `qx_usb_id[]`, limite rispettato da ogni riga registrata.
  - **`test_usb_diag_json` (casi nuovi):** export HID identico senza `qx`; oggetto `qx` con scambi, esadecimale, escape dei byte di controllo, `time` presente solo con l'ora valida, `truncated`.
  - **Regressione:** suite nativa completa (replay inclusi), e2e completa (`npx playwright test`), build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`; nessuna asserzione esistente cambia; dimensione del firmware S3 confrontata con `cf910d2` e con lo slot da 4 MB di #93.
  - **Prova di fumo HID (solo con sì esplicito dell'utente):** Eaton 3S, 30 minuti, nessun WARN nuovo rispetto alla build di US-132, stessi valori.

  Nessuna modifica alla Web UI: niente mockup e niente e2e nuovi; il video dimostrativo non è previsto (nessun incremento visibile all'utente).

  ---

  _Piano generato con ARchetipo Planning — 2026-11-07_
tasks:
  - id: TASK-01
    title: 'QxEngine: walk a passi (un comando Q* per passo) con initInfoStep, updateInfoStep e abortWalk'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** il motore Q* può fare un walk un comando alla volta, così un passo del poll aspetta al massimo un comando; i wrapper sincroni restano identici.

      **Leggere:** `lib/USBHostUPS/src/QxEngine.h`, `QxEngine.cpp` (righe 280-460: `walk()`, `initInfo()`, `walkFailed()`, `updateInfo()`, `commitStatus()`), sezione 4 "Walk a passi" del piano; `nut_repo/drivers/nutdrv_qx.c:4489-4783` (qx_ups_walk) e `3525-3601` (upsdrv_updateinfo).

      **Modificare:**
      1. `QxEngine.h`: `Update` guadagna `Pending` (commento: walk non finito, un comando mandato); nuovo `enum class Phase : uint8_t { Pending, Ok, Failed };`; metodi pubblici `Phase initInfoStep(UPSData&, uint32_t)`, `Update updateInfoStep(UPSData&, uint32_t)`, `void abortWalk()`, `bool walkPending() const`; membri privati `WalkMode _walkMode`, `size_t _walkRow`, `bool _walkActive`, `bool _walkFull`, `bool _initStarted`; metodi privati `void beginWalk(WalkMode)` e `enum class WalkStep { Pending, Done, Failed } walkStep()`.
      2. `QxEngine.cpp`: spostare il corpo del ciclo di `walk()` in `walkStep()`, che riparte da `_walkRow`, e ritorna `Pending` subito dopo una riga che ha chiamato `process()` (non dopo una riga che ha riusato `_prevAnswer`), `Failed` dove oggi `walk()` ritorna false, `Done` a fine tabella dopo la stima della batteria (solo FULL). `beginWalk()` contiene l'azzeramento iniziale di oggi (batt, `_prevCommand`, `_prevAnswer`). `walk(mode)` = `beginWalk` + ciclo su `walkStep` finché `Pending`.
      3. `initInfoStep()`: al primo passo `setinfo("driver.version.data", ...)` e `beginWalk(INIT)`; a `Done` la coda di oggi (`initBattery`, `_lastPollMs`, `initinfo` del sottodriver) e `Phase::Ok`; a `Failed` `Phase::Failed`. `initInfo()` = ciclo su `initInfoStep` finché `Pending`.
      4. `updateInfoStep()`: al primo passo di un walk la scelta full/quick e l'azzeramento di stato e allarmi di oggi, salvati in `_walkFull`; a `Done` la coda di oggi (`_lastPollMs`, `_dataChanged`, `commitStatus`, allarmi, `_retry`, `_reestablished`); a `Failed` `walkFailed()`; altrimenti `Update::Pending`. `updateInfo()` = ciclo su `updateInfoStep` finché `Pending`. `_reestablished = false` solo al primo passo.
      5. `abortWalk()`: `_walkActive = false`, `_initStarted = false`, `clearWork()`; `reset()` azzera i campi nuovi (commento in `reset()`: ogni campo nuovo va azzerato qui).
      6. Ogni `DataScope` resta per chiamata pubblica.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_engine -f test_qx_protocols -f test_qx_probe -f test_qx_control` verde senza toccare i test.

      **Fatto quando:** i wrapper sincroni danno gli stessi risultati di prima e le API a passi esistono.

      **Blocchi:** se un sottodriver portato chiama `process()` dentro un preprocess durante il walk (più comandi per riga), fermarsi e segnalarlo: cambia il conteggio per passo.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxEngine.h — Phase, Update::Pending, API a passi, stato del walk
      - lib/USBHostUPS/src/QxEngine.cpp — walkStep/beginWalk, wrapper sincroni

      ## Criteri di Completamento
      - [ ] `walk()`, `initInfo()`, `updateInfo()` sono wrapper sui passi
      - [ ] `walkStep()` si ferma dopo ogni riga che chiama `process()`
      - [ ] `reset()` azzera lo stato del walk
      - [ ] le quattro suite Q* esistenti passano senza modifiche
