      **Modificare:**
      1. `USBHostUPS.h`: classe annidata privata `QxUsbPort : public IQxUsbPrimitives, public IQxHostPort` con riferimento all'host; membro `QxUsbPort _qx_usb{*this};`; `EventBacklog<HidEvent, 8> _event_backlog;` con `struct HidEventTraits`; `uint32_t _qx_deadline = 0;`, `const char* _qx_last_error = "";`, contatori `_stat_qx_ok`, `_stat_qx_failed`; metodo privato `void handleEvent(const HidEvent& ev);`.
      2. `processEvents()`: prima `while (_event_backlog.pop(ev)) handleEvent(ev);`, poi la coda come oggi; il corpo dello `switch` va in `handleEvent()` senza cambiamenti.
      3. Primitive (poll task, nessun lock applicativo preso):
         - `setReport`: rifiuta se `!_is_ready_to_poll || !_hid_dev_handle`, se `!_link.canPoll(millis())` o se la deadline è passata (`QX_USB_ERR_TIMEOUT`, errore "budget"); copia in `_request_buffer`, `hid_class_request_set_report()`, `noteControlResult()`, contatori, `_get_ok_since_claim++` sul successo; esito ESP mappato sui codici `QX_USB_ERR_*` e `_qx_last_error = esp_err_to_name(err)`.
         - `getStringDescriptor`: come sopra con `hid_host_device_get_string_descriptor(handle, index, langid, buf, min(buflen,255), &len)`; nessun accesso a `_failed_strings` né a `_lang_id`.
         - `readInterrupt`: timeout accorciato alla deadline; `readInterruptChunk<HidEventTraits>()` su una sorgente che usa `xQueueReceive(_event_queue, &ev, pdMS_TO_TICKS(wait))` e `millis()`; gli scarti si sommano a `_dropped_events`; `Gone` → `QX_USB_ERR_NO_DEVICE`, `Error` → `QX_USB_ERR_IO`, `Timeout` → `QX_USB_ERR_TIMEOUT`. I timeout interrupt non vanno al monitor del collegamento (in NUT sono un comando senza risposta).
         - `discardInput`, `setDeadline`, `nowMs` (`millis()`), `lastError`; `lock/unlock` su `_mutex`; `log` su `log()` dell'host.
      4. `logStats()`: aggiungere ", %u Q* transfers ok, %u failed" solo se uno dei due contatori è non nullo (riga HID identica) e azzerarli.
      5. Commento di thread model in testa alla classe: le primitive Q* girano solo nel task di poll, senza `_mutex`; gli eventi letti durante un comando passano dal backlog.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` da PowerShell compila; suite nativa verde.

      **Fatto quando:** le primitive esistono e il percorso HID è invariato (backlog sempre vuoto).

      **Blocchi:** se `hid_class_request_set_report()` usa un timeout diverso da `CTRL_REQUEST_TIMEOUT_MS`, aggiornare `QX_CTRL_TIMEOUT_MS` e la tabella del piano prima di proseguire.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — QxUsbPort, backlog, contatori
      - lib/USBHostUPS/src/USBHostUPS.cpp — primitive, handleEvent, logStats

      ## Criteri di Completamento
      - [ ] SET_REPORT, string descriptor e interrupt IN senza lock applicativi
      - [ ] esiti dei control transfer a `noteControlResult()`
      - [ ] eventi letti durante un comando gestiti dopo, in ordine
      - [ ] riga di statistica HID invariata
      - [ ] build S3 verde
    ref: TASK-08
  - id: TASK-09
    title: 'USBHostUPS: aggancio del driver Q*, supervisione condivisa, stale/primo dato e comandi nel task di poll'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
      - TASK-08
    body: |-
      ## Descrizione
      **Obiettivo:** dopo l'aggancio di un UPS Q* con trasporto disponibile l'host crea `QxDriver` e lo supervisiona come un HID; senza trasporto resta il percorso di US-132; comandi e SET VAR Q* girano nel task di poll.

      **Leggere:** sezione 8 del piano; `lib/USBHostUPS/src/USBHostUPS.cpp` (`service` 297-403, `claimInterface` 473-610, `claimQxInterface` 701-746, `releaseBoundState` 684-699, `recoverInterface` 803-827, `retryInterfaceStart` 829-847, `isDataStale` 944-955, `processInputReport` 631-671, `snapshotUSBDiagnostics` 1583-1621); `IUpsControlPort.h` (metodi neutri); `DriverDispatch.h`.

      **Modificare:**
      1. `claimQxInterface()`: dopo il controllo dell'interfaccia 0 e il rilascio della precedente, `auto t = QxUsbTransports::create(match.qx_transport, _qx_usb);`. Con `nullptr` tutto come oggi. Altrimenti, sotto `_mutex`: `_driver = new QxDriver(std::move(t), _qx_usb, vid, pid)`, `_driver->setup()`, `_unsupported_device = ""`, `_qx_transport`, `_vid/_pid/_quirks/_device_product`, `_link.reset(millis())`, `_first_data_ready = false`, `_claimed_at`, `_get_ok_since_claim = 0`, `_in_restart_pending = false`, `_in_recoveries = 0`, `_event_backlog.clear()`, `_in_pipe_wanted = _driver->qx()->needsInterruptIn()`; se vero `hid_host_device_start()` con lo stesso ritentativo di `claimInterface()`; poi `_is_ready_to_poll = true`; log INFO "Q* UPS attached (USB transport: %s): probing the protocol".
      2. `claimInterface()` (ramo HID): `_in_pipe_wanted = true` accanto agli altri azzeramenti; nient'altro.
      3. `recoverInterface()`: se `!_in_pipe_wanted`, solo `setup()` del driver e `applySavedDriverValues()`, niente stop/clear halt/start e niente `_in_restart_pending`. `processInputReport()`: `if (... || !DriverDispatch::hidOf(_driver)) return;`.
      4. `service()`: sostituire il blocco del primo dato con `firstDataReady(_driver->initialPollDone(), statusKnown, _driver->firstDataWaitBounded(), now - _claimed_at, FIRST_DATA_MAX_MS, timedOut)` (stesso log); `statusKnown` calcolato come oggi sotto `_mutex` e solo se `initialPollDone()`. `isDataStale()`: `|| (_driver && _driver->dataStale())` sotto `_mutex`.
      5. Casella dei comandi: membri `SemaphoreHandle_t _qx_req_mutex, _qx_req_done` (creati in `begin()`, liberati in `end()`), struct `QxRequest { bool pending; bool setvar; char name[48]; char value[64]; uint32_t gen; CommandResult cmd; NutTable::SetStatus set; }` sotto `_mutex`. Override di `driverCommands()` (`qx()->commands()` sotto `_mutex`, vuoto senza driver Q*), `runDriverCommand()`, `runDriverSetVariable()` come da piano: prendono `_qx_req_mutex`, scrivono la richiesta, aspettano `_qx_req_done` fino a `qxStepBoundMs(budget) * 2 + 1000` ms, a scadenza abbandonano (generazione) e restituiscono `FAILED`; nome o valore troppo lunghi → `NOT_SUPPORTED`/`CONVERSION_FAILED` senza richiesta. Mai `_op_mutex`.
      6. `service()`: nuova `serviceQxRequest(now)` chiamata dopo la supervisione del collegamento e prima del watchdog INPUT/poll; se il poll non può girare (vedi piano) risponde subito `FAILED` (o `NOT_CONNECTED` senza driver); altrimenti esegue `qx()->runCommand/runSetVariable(_ups_data, ...)`, salta `_driver->poll()` in quell'iterazione, scrive l'esito sotto `_mutex` se la generazione coincide e dà il semaforo. Anche i rami di uscita anticipata di `service()` (riavvio chiesto, pipe in ripristino, ciclo della porta) rispondono a una richiesta in attesa.
      7. `releaseBoundState()`: risponde `NOT_CONNECTED` a una richiesta in attesa e svuota il backlog.
      8. `snapshotUSBDiagnostics()`: `s.qx.present = _qx_transport != nullptr`; `s.qx.transport`; con `_driver && _driver->qx()` `fillDiagnostics(s.qx)`; `s.qx.uptime_ms = millis()` (l'ora della scheda la mette il server web, TASK-10).
      9. Nessun `if (qx)` nella logica HID oltre ai punti elencati (proprietà `_in_pipe_wanted`, `hidOf()`, `qx()`).

      **Verifica:** build `esp32-s3-standard` da PowerShell; suite nativa completa verde (replay inclusi).

      **Fatto quando:** l'host compila con il percorso Q* completo e con registro vuoto si comporta come US-132.

      **Blocchi:** se un comando Q* può arrivare dal task di poll stesso (per esempio dallo spegnimento automatico), la casella andrebbe in stallo: verificare chi chiama `executeCommand()` (`src/`) e, se è il task di poll, eseguire direttamente invece di aspettare; segnalarlo.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — casella dei comandi, `_in_pipe_wanted`, override dei metodi neutri
      - lib/USBHostUPS/src/USBHostUPS.cpp — claimQxInterface, service, recoverInterface, isDataStale, snapshot

      ## Criteri di Completamento
      - [ ] registro vuoto → comportamento di US-132 invariato
      - [ ] con trasporto: `QxDriver` creato, supervisione condivisa, watchdog INPUT inerte
      - [ ] stale da `dataStale()`, primo dato senza scadenza per Q*
      - [ ] comandi e SET VAR eseguiti nel task di poll con attesa limitata, mai `_op_mutex`
      - [ ] build S3 e suite nativa verdi
    ref: TASK-09
  - id: TASK-10
    title: Sezione Q* dell'export diagnostico USB in UsbDiagJson e ora della scheda
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** l'export `/api/usb/dump` contiene l'oggetto `qx` con trasporto, protocollo, esito del riconoscimento e ultimi 20 scambi; l'export HID resta identico byte per byte.

      **Leggere:** sezione 9 del piano; `lib/WebApi/src/UsbDiagJson.h/.cpp` (regole di formattazione: CRLF, rientro di 2 spazi, escape), `lib/USBHostUPS/src/UsbDiagSnapshot.h`, `lib/TimeCore/src/BoardTime.h`, `src/network/web_config_server.cpp` (righe ~520-540 per l'ora delle righe di log, e il gestore di `/api/usb/dump`).

      **Modificare:**
      1. `UsbDiagJson.cpp`: dopo l'oggetto `export_read`, se `s.qx.present` scrivere `"qx": { "transport", "protocol", "probe", "tries", "failed_cycles", "forced_protocol", "exchanges": [ { "uptime_ms", "time" (solo se `s.qx.epoch_ms > 0`, ISO 8601 UTC con millisecondi da `boardEpochMs(s.qx.epoch_ms, s.qx.uptime_ms, e.uptime_ms)`), "command", "answer_text", "answer_hex", "length", "duration_ms", "truncated", "error" } ] }` con le stesse regole di escape del file (byte di controllo come `\\u00XX`, `\\r` come `\\r`).
      2. Aggiornare il commento di testa di `UsbDiagJson.h` (US-136: oggetto `qx` solo con un UPS Q*).
      3. `src/network/web_config_server.cpp`, gestore dell'export: se l'ora della scheda è valida, `s.qx.epoch_ms` = epoca corrente in ms e `s.qx.uptime_ms = millis()` subito dopo `snapshotUSBDiagnostics()`, con la stessa fonte dell'ora usata per le righe del System Log.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_usb_diag_json` verde (i casi esistenti invariati).

      **Fatto quando:** l'oggetto `qx` è scritto solo con `present` e il formato rispetta il piano.

      **Blocchi:** se il formato dell'ora delle righe di log non è ISO 8601, usare quello delle righe di log e annotarlo nel piano.

      ## File Coinvolti
      - lib/WebApi/src/UsbDiagJson.cpp — oggetto qx
      - lib/WebApi/src/UsbDiagJson.h — commento
      - src/network/web_config_server.cpp — ora della scheda nella snapshot

      ## Criteri di Completamento
      - [ ] oggetto `qx` dopo `export_read` solo con un UPS Q*
      - [ ] risposta in testo ed esadecimale, lunghezza, ora, errore per ogni scambio
      - [ ] export HID identico
