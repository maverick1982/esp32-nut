    body: |-
      ## Descrizione
      **Obiettivo:** il test nativo richiesto dal criterio 3: eventi letti durante un comando restano in ordine e vengono gestiti dopo.

      **Leggere:** `lib/USBHostUPS/src/EventBacklog.h`, `FirstData.h`; struttura di un test esistente (`test/test_link_monitor/test_main.cpp`).

      **Modificare:**
      1. Creare `test/test_qx_interrupt_read/test_main.cpp` con un evento finto (tipo, handle, dati, lunghezza), i suoi `Traits` e una coda finta con orologio:
         - pezzo dell'interfaccia agganciata → `Chunk`, byte e lunghezza giusti, troncato a `buflen`;
         - CONNECTED e INPUT di un'altra interfaccia prima del pezzo → il primo nel backlog, il secondo scartato e contato;
         - DISCONNECTED dell'interfaccia agganciata → `Gone`, evento nel backlog dopo quelli letti prima (ordine);
         - TRANSFER_ERROR → `Error`, nel backlog;
         - coda vuota → `Timeout` dopo il tempo chiesto sull'orologio finto;
         - backlog pieno → `Error`, l'evento successivo resta nella coda;
         - `discardInputChunks()`: toglie i pezzi dell'interfaccia agganciata e conserva gli altri eventi in ordine;
         - svuotamento: `pop()` restituisce gli eventi nell'ordine di arrivo.
