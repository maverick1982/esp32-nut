      2. e2e completa: `npx playwright test` verde.
      3. Build da PowerShell: `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`.
      4. Flash: dimensione di `.pio/build/esp32-s3-standard/firmware.bin` confrontata con quella di `cf910d2` (build in un worktree) e con lo slot OTA da 4 MB di #93 (0x1F0000 = 2 031 616 byte); scrivere numeri e margine in `docs/test-results/US-136/flash.md` per il testo del PR.
