      - TASK-05
    body: |
      ## Descrizione
      **Obiettivo:** far decodificare al catalogo le variabili legate e dargli l'ultima parola sui loro valori, qualunque sia l'ordine dei report.

      **Da leggere:**
      - `lib/USBHostUPS/src/IUPSDriver.h`;
      - `lib/USBHostUPS/src/GenericDriver.h` / `.cpp` (`setup`, `decodeReport`, `findInputTwins`);
      - `lib/USBHostUPS/src/UsageMapIndex.h`, per il pattern di fingerprint;
      - `lib/USBHostUPS/src/USBHostUPS.cpp`, righe 470-485 e 600-620;
      - `test/test_record_replay/FixtureReplayRunner.h`, righe 205-215.

      **Modifiche:**
      - In `IUPSDriver.h`:
        - `virtual void postDecode(IUSBHostUPS* host, uint8_t report_id, uint8_t report_type, const uint8_t* data, size_t length, UPSData& ups_data) {}`
        - `virtual void writableVariables(const UPSData& data, std::vector<NutTable::RWVariable>& out) const {}`
      - In `GenericDriver`:
        - membro `std::vector<NutTable::Bound> _rw` più fingerprint degli usage. Si ricostruisce con `NutTable::bind(hid2nut(...), host->getUsages())` quando cambia, e si invalida in `setup()`.
        - `postDecode`:
          1. per ogni Bound il cui `idx` o `twin_idx` appartiene al report ricevuto (stesso `report_type` e `report_id`), estrarre il valore con `HIDParser::extractUsage` usando quel def e chiamare `NutTable::onValue`;
          2. per ogni Bound in stato ACTIVE con `has`, chiamare `ups_data.set(name, value)`.
        - `writableVariables`:
          - aggiunge i Bound in stato ACTIVE con `ST_FLAG_RW` la cui chiave è in `data`, con `aux` ed `enumValues`;
          - aggiunge `ups.delay.shutdown` e `ups.delay.start` se `data.hasKey`, con aux `delayAux()` (TASK-12) e senza ENUM;
          - ordina con `strcasecmp`.
        - `virtual const NutTable::Context& rwContext() const`, con un default vuoto statico; EatonDriver lo sovrascrive (TASK-05).
      - Chiamare `_driver->postDecode(...)` subito dopo ciascun `_driver->decodeReport(...)` in `USBHostUPS.cpp` (due chiamate), con gli stessi argomenti e sotto lo stesso lock. Fare lo stesso nel replay runner.
      - Rimuovere le mappature `"UPS.Input.APCSensitivity"` (`APCDriver.cpp`) e `"UPS.Output.CPSInputSensitivity"` (`CyberPowerDriver.cpp`): non scattano mai e usano valori diversi da upstream.

      **Passi:**
      1. Hook in IUPSDriver.
      2. Binding e postDecode.
      3. writableVariables.
      4. Chiamate nell'host e nel runner.
      5. Pulizia delle mappature.

      **Verifica:** suite nativa verde, a parte le aspettative di replay che TASK-11 deve ricalcolare.

      **Blocchi:** se `decodeReport` a riga 479 o 613 non è sotto `_mutex`, fermarsi e segnalarlo.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUPSDriver.h — hook `postDecode` / `writableVariables`
      - lib/USBHostUPS/src/GenericDriver.h / GenericDriver.cpp — binding, cache, re-assert, contesto
      - lib/USBHostUPS/src/EatonDriver.h / EatonDriver.cpp — override di `rwContext()`
      - lib/USBHostUPS/src/USBHostUPS.cpp — chiamate a `postDecode`
      - lib/USBHostUPS/src/APCDriver.cpp — rimozione della mappatura APCSensitivity
      - lib/USBHostUPS/src/CyberPowerDriver.cpp — rimozione della mappatura CPSInputSensitivity
      - test/test_record_replay/FixtureReplayRunner.h — chiamata a `postDecode`

      ## Criteri di Completamento
      - [ ] Il valore di una variabile legata è quello del suo campo di catalogo anche se un'altra mappatura scrive la stessa chiave dopo
      - [ ] I report gemelli aggiornano le variabili legate
