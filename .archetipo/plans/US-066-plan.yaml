    body: |
      ## Descrizione
      **Obiettivo:** fissare per ogni fixture reale le variabili che il catalogo lega e verificare i valori dove ci sono scenari.

      **Da leggere:** `test/test_record_replay/test_main.cpp` e `test/test_record_replay/FixtureReplayRunner.h`.

      **Modifiche:**
      - Aggiungere a `runFixtureTest` un parametro opzionale `const char* expectedRW`: i nomi distinti dei candidati legati da `NutTable::bind(hid2nut, usages)`, ordinati e separati da spazio. Dipendono solo dal descriptor. Esclusi `ups.delay.*` (TASK-12).
      - Attesi, ricavati in pianificazione da un'analisi indipendente dei descriptor con i percorsi upstream. Sono identici cercando l'usage solo tra i Feature o in qualunque tipo di report:
        - Eaton 3S: `battery.charge.low input.transfer.high input.transfer.low outlet.1.desc outlet.desc output.voltage.nominal`
        - Eaton 5P: `battery.charge.low battery.charge.restart battery.protection output.voltage.nominal ups.shutdown ups.start.reboot ups.test.interval`
        - APC BX1500G, BX750MI, CS500, CS750RS, ES700G, RS900MI e Smart-UPS 750 (issue #78): `battery.charge.low battery.mfr.date battery.runtime.low input.sensitivity input.transfer.high input.transfer.low`
        - APC XS700U e Smart-UPS 750 (issue #13): `battery.charge.low battery.mfr.date battery.runtime.low`
        - APC Smart-UPS 750 PID 0003 (issue #22): `battery.charge.low battery.runtime.low`
        - CyberPower BR700ELCD e CP1350C: `battery.charge.low battery.runtime.low input.transfer.high input.transfer.low`
        - CyberPower CP1500EPFCLCD e CP1600EPFCLCD: le stesse più `input.sensitivity`
        - Powercom SPD-750U e OpenUPS: elenco vuoto
      - Se il binding reale differisce, non correggere gli attesi copiando l'output: verificare il percorso nel descriptor e nel file upstream, e segnalare la differenza.
      - Le aspettative di scenario (`expected_ups_data`) che cambiano per l'ultima parola del catalogo vanno ricalcolate dai byte dei report, con il calcolo nel commento. Per le fixture APC e CyberPower che replicano il report della sensitivity, aggiungere `input.sensitivity` con il valore upstream calcolato dai byte.

      **Verifica:** `pio test -e native -f test_record_replay`.

      **Blocchi:** nessuno.

      ## File Coinvolti
