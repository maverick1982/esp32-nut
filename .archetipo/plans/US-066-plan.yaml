  - id: TASK-05
    title: Conversioni mge con contesto — classe di tensione nominale e controllo Pegasus/3S
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |
      ## Descrizione
      **Obiettivo:** portare le conversioni mge che dipendono dal modello o dal primo valore letto.

      **Da leggere:** in `nut_repo/drivers/mge-hid.c`:
      - `nominal_output_voltage_fun` (1434) e `nominal_output_voltage_info` (1525);
      - `eaton_check_pegasus_fun` (819), `pegasus_threshold_info` (848), `pegasus_yes_no_info_fun` (858);
      - i tipi `MGE_PEGASUS` / `MGE_3S` (127) e `COUNTRY_*` (155-164, `COUNTRY_UNKNOWN = -1`), più la riga 1381;
      - `mge_model_names` (1780-1810) e l'assegnazione di `mge_type` (2408).

      **Modifiche:**
      - `NutTable::Context { long nominal = -1; int mge_type = 0; int country = -1; }`.
      - `NominalVoltage`:
        - il primo valore fissa `nominal`;
        - si accettano solo i valori della stessa classe, secondo lo switch upstream;
        - `enumValues` restituisce i valori della lookup accettati dalla classe.
      - `PegasusThreshold` / `PegasusYesNo`: validi solo se `mge_type & 0xFF00` è `MGE_PEGASUS`. Per lo switch mascherato di upstream anche `MGE_3S` (0x110) ricade lì, quindi il controllo sul paese non scatta mai.
      - In `EatonDriver`:
        - ricavare `mge_type` come `get_model_name()`: iProduct (`ups.model`) più la stringa iModel, o `ConfigApparentPower` di `Flow.[4]` come ripiego, confrontati con le righe di `mge_model_names` sotto `MGE_DEFAULT` (offline, Pegasus, 3S). Il calcolo avviene in `onLoop()` quando i dati sono noti, o alla fine del primo poll completo;
        - leggere `country` dall'usage `UPS.PowerSummary.0xFFFF0095` (Country);
        - esporre il contesto (`rwContext()`).
      - Il contesto si azzera in `setup()`.

      **Passi:**
      1. Context e NominalVoltage.
      2. Il controllo Pegasus.
      3. Il collegamento in EatonDriver.

      **Verifica:** la build native compila, e i test arrivano in TASK-06.

      **Blocchi:** se la logica di confronto del modello upstream non si può applicare a `ups.model` com'è formattato oggi, segnalarlo con un esempio reale preso dalla fixture Eaton.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — Context, NominalVoltage, Pegasus
      - lib/USBHostUPS/src/EatonDriver.h / EatonDriver.cpp — `mge_type`, paese, contesto

      ## Criteri di Completamento
      - [ ] La classe di tensione si fissa al primo valore e filtra decode ed ENUM come `nominal_output_voltage_fun`
      - [ ] Le voci Pegasus compaiono solo per i modelli e i paesi previsti da upstream
      - [ ] Il contesto riparte da zero a ogni `setup()`
    ref: TASK-05
  - id: TASK-06
    title: Test unitari del catalogo (nuovo test_rw_catalog)
    type: Test
    status: DONE
    dependencies:
