    body: |
      ## Descrizione
      **Obiettivo:** coprire con test puri il match dei percorsi, la regola di binding INIT, le conversioni, gli ENUM, le descrizioni e la tabella EcoFlow.

      **Da leggere:** `test/test_command_catalog/test_main.cpp`, in particolare l'helper `mk()`.

      **Modifiche:** nuovo `test/test_rw_catalog/test_main.cpp` con un helper `mk(path, usage, report_type, report_id, coll_index...)`. Casi:
      - `pathMatches`:
        - `UPS.Flow.[4].ConfigVoltage` combacia con `coll_index[1] == 5` e non con 0 o 3;
        - `UPS.Flow.ConfigVoltage` non combacia con un usage indicizzato;
        - i segmenti `0xFFFF004D` combaciano.
      - `bind`:
        - un usage solo Input si lega, perché il tipo non conta;
        - con Input e Feature sullo stesso percorso, si lega il primo in ordine di descriptor e l'altro è il gemello;
        - per mge, con `RemainingCapacityLimitSetting` e `RemainingCapacityLimit` presenti, `battery.charge.low` usa il primo;
        - le voci absent hanno `dfl`.
      - `onValue`:
        - due candidati con lo stesso nome, il primo fallisce la prima conversione: diventa DEAD e il secondo diventa ACTIVE;
        - se il primo poi riceve un valore valido resta DEAD;
        - un fallimento dopo RW mantiene il valore precedente.
      - Conversioni:
        - Number arrotonda (19.6 → "20");
        - Lookup fuori tabella fallisce;
        - BatteryDate 0 → "not set" e 0x4D68 → la data calcolata a mano;
        - MgeDate e MgeTime su un timestamp noto.
      - `enumValues`:
        - `ups.shutdown` → disabled, enabled;
        - cps `input.sensitivity` → low, normal, high;
        - tensione nominale: prima lettura 230, poi ENUM della classe HV e un valore LV rifiutato.
      - Pegasus: Protection Station 650 → valido; 3S 700 valido anche con paese 0 (switch mascherato upstream); "Eaton 3S" (iProduct reale della fixture) → `MGE_DEFAULT`, non valido.
      - `describe`: "battery.charge.low" e "BATTERY.CHARGE.LOW" danno la stringa di cmdvartab; "outlet.1.desc" dà `nullptr`.
      - EcoFlow: `UPS.PowerSummary.RemainingCapacityLimit` si lega a `battery.charge.low` con `info_len` 5.
      - Voce in sola lettura sintetica (senza `ST_FLAG_RW`): si lega, diventa ACTIVE e pubblica il valore, ma non compare in `writableVariables()`. Una voce RO che precede una RW con lo stesso nome vince e la variabile non è RW, come in upstream. Garantisce che il motore sia pronto per le migrazioni.

      **Verifica:** `pio test -e native -f test_rw_catalog`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_rw_catalog/test_main.cpp — nuova suite

      ## Criteri di Completamento
      - [ ] Tutti i casi elencati sono presenti e passano
      - [ ] I valori attesi sono calcolati a mano o presi da upstream, mai copiati dall'output del codice
