      - `nut_repo/drivers/powercom-hid.c` righe 528-529 (`PCMDelayBefore*` = 0x00ff0056/0x00ff0057) e 620-639 (default 60/20, aux 8);
      - `test/test_powercom_driver/test_powercom_driver.cpp` (righe 281-301) e `test/test_command_catalog/test_main.cpp` (righe 480-510).

      **Modifiche:**
      - In `IUPSDriver`:
        - `virtual bool delayVariablesSupported() const { return shutdownCommandsSupported(); }`
        - `virtual uint8_t delayAux() const { return 10; }`
      - In `PowercomDriver`: `delayVariablesSupported()` true, `defaultOnDelay()` 60, `defaultOffDelay()` 20, `delayAux()` 8. `shutdownCommandsSupported()` resta false: niente comandi, come in US-058.
      - `CommandCatalog::applyDefaultDelays`:
        - il parametro booleano diventa `delay_vars` e i chiamanti (`USBHostUPS::applyDefaultDelays`, replay runner) passano `delayVariablesSupported()`;
        - la presenza si verifica sul percorso in qualunque tipo di report, con una nuova `hasPath()`;
        - aggiungere tra i percorsi di `ups.delay.shutdown` il codice Powercom `PCMDelayBeforeShutdown` (0x00FF0057), solo per questa funzione;
        - `hasFeature` resta invariato per i comandi, che scrivono e richiedono quindi un Feature.
      - Aggiornare i commenti di US-058 che dicono "ups.delay.* is not set" per i driver senza comandi.
      - Test:
        - `test_powercom_driver`: l'asserzione della riga 301 si inverte. Ora `ups.delay.shutdown` = "20" e `ups.delay.start` = "60" ci sono, e `writableVariables` li riporta con aux 8. Nel commento spiegare il motivo: powercom-hid.c:620-639.
        - `test_command_catalog`: un caso con il percorso presente solo come Input, che ora imposta `ups.delay.*`.
        - Replay Powercom: verificare la presenza di `ups.delay.*` con 60/20.

      **Passi:**
      1. Hook in IUPSDriver e override Powercom.
      2. `applyDefaultDelays` e chiamanti.
      3. Test.

      **Verifica:** `pio test -e native -f test_powercom_driver -f test_command_catalog -f test_record_replay`.

      **Blocchi:** se il comportamento di qualche comando cambia (lista `LIST CMD` diversa su qualche fixture), fermarsi e segnalarlo: questa modifica deve toccare solo le variabili.

