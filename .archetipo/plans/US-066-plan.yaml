  - id: TASK-09
    title: Server NUT — LIST RW, GET TYPE, LIST ENUM/RANGE, GET DESC e GET CMDDESC
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |
      ## Descrizione
      **Obiettivo:** rispondere ai comandi usati da upsrw come fa upsd.

      **Da leggere:**
      - `lib/NUTServer/src/NUTServer.cpp`, righe 284-360 (LIST) e 461-500 (GET DESC/CMDDESC/TYPE);
      - `nut_repo/server/netlist.c`: `list_rw` 84, `list_enum` 156, `tree_dump` riga 53;
      - `nut_repo/server/netget.c`: `get_desc` 69-98, `get_cmddesc` 130, `get_type` 134.

      **Modifiche:**
      - `LIST RW [<ups>]`:
        - stessi controlli di `LIST VAR`: `ERR UNKNOWN-UPS` con nome errato, `ERR DATA-STALE` se `isDataStale()`;
        - poi `BEGIN LIST RW <ups>`, una riga `RW <ups> <var> "<valore>"` per ogni elemento di `getWritableVariables()` e `END LIST RW <ups>`;
        - prendere l'elenco prima di bloccare i dati;
        - `LIST CMD` e `LIST CLIENT` restano invariati.
      - `GET TYPE`: se la variabile è in `getWritableVariables()` (confronto `strcasecmp`), rispondere `TYPE <ups> <var> RW` più ` ENUM` se `enums` non è vuoto, più ` STRING:<aux>`. Altrimenti la risposta resta quella attuale.
      - `LIST ENUM` / `LIST RANGE`:
        - `ERR UNKNOWN-UPS`, `ERR DATA-STALE`, e `ERR VAR-NOT-SUPPORTED` se la variabile non è in `UPSData`;
        - poi `BEGIN`, una riga `ENUM <ups> <var> "<v>"` per ogni valore se la variabile è RW enumerata, `END`;
        - RANGE è sempre vuota.
      - `GET DESC`: `NutTable::describe(var)` se non è null, altrimenti `"Description unavailable"`.
      - `GET CMDDESC`: per un comando sconosciuto `"Description unavailable"` al posto di `"Unavailable"`. Aggiornare il commento che oggi attribuisce "Unavailable" a upsd.

      **Passi:**
      1. LIST RW.
      2. GET TYPE.
      3. LIST ENUM e RANGE.
      4. GET DESC e CMDDESC.

      **Verifica:** `pio test -e native -f test_nut_server` (vanno aggiornate le asserzioni su "Unavailable", TASK-10).

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/NUTServer/src/NUTServer.cpp — gestori LIST RW, GET TYPE, LIST ENUM/RANGE, GET DESC/CMDDESC

      ## Criteri di Completamento
      - [ ] LIST RW ha lo stesso formato di upsd ed è ordinata come l'albero di upsd
      - [ ] GET TYPE delle variabili non RW è identico a prima
      - [ ] LIST ENUM restituisce `VAR-NOT-SUPPORTED` per una variabile assente
      - [ ] DESC e CMDDESC senza descrizione rispondono `"Description unavailable"`
    ref: TASK-09
