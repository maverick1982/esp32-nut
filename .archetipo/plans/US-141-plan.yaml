      ## Descrizione
      **Obiettivo:** dare al reporter della #150 (ESP32-S3 N16R8 generica) una build da installare e una bozza di commento da pubblicare.

      **Leggere:** `scripts/release_package.py` (comando `package`, `BOARDS`), lo zip esistente `esp32-nut-enum-delay-v3.zip` nella root (struttura e README.txt come modello).

      **Passi:**
      1. Build con versione di test: `$env:PLATFORMIO_BUILD_FLAGS='-DFIRMWARE_VERSION=\"cypress-v1\"'` (PowerShell) poi `pio run -e esp32-s3-standard`.
      2. `python scripts/release_package.py package --env esp32-s3-standard --version cypress-v1 --build-dir .pio/build/esp32-s3-standard --out <scratchpad>/pkg/esp32-s3-standard --zip-dir .` → zip nella root, non tracciato.
      3. Sostituire nel zip il README generato (che rimanda al web installer, che installa l'ultima release) con un README di test in inglese: installazione via OTA dalla web UI con `firmware.bin` oppure flash completo con esptool all'indirizzo 0x0 di `firmware.factory.bin`; cosa cambia (trasporto cypress); cosa mandare dopo 10-15 minuti (System Log ed export USB Diagnostics, sezione `qx` con `ep_in_mps` e gli scambi); come tornare alla v1.16.0.
      4. Bozza del commento per la #150 in inglese (file nella scratchpad): cosa è stato fatto, come installare, cosa allegare; segnaposto `ZIP_LINK` per lo zip, che allega l'utente. Facoltativa una riga per la #12 (stesso VID/PID). **Non pubblicare:** il commento lo pubblica Claude solo dopo l'ok esplicito dell'utente.

      **Verifica:** `firmware.bin` del zip contiene la stringa `cypress-v1`; lo zip contiene firmware, bootloader, partizioni, boot_app0, factory, manifest e il README di test.

      **Blocchi:** TASK-05. Se la review cambia il codice, rifare lo zip.

      ## File Coinvolti
      - esp32-nut-cypress-v1.zip (root, non tracciato) — zip di test
      - file nella scratchpad — README di test e bozza del commento

