  - id: TASK-03
    title: 'Copertura degli INPUT nel driver: IUPSDriver::inputValuesPolled e GenericDriver::computeInputCoverage'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** il driver sa se ogni valore che legge dagli INPUT report è richiesto anche dal poll.

      **Leggi:**
      - `lib/USBHostUPS/src/IUPSDriver.h`;
      - `lib/USBHostUPS/src/GenericDriver.h` / `.cpp`: `featureReportsRead()` (filtro dei lettori), `buildPollLists()`, `pruneFullPoll()`, `loop()` (righe ~526-534 e la chiamata a `pruneFullPoll`).

      **Modifica:**
      - `IUPSDriver`: `virtual bool inputValuesPolled() const { return false; }`, con commento (US-123: il default falso tiene attivo il watchdog degli INPUT).
      - `GenericDriver`: override `bool inputValuesPolled() const override { return _input_values_polled; }`, membro `bool _input_values_polled = false;` e metodo privato `void computeInputCoverage(IHidTransport* host)`.
      - Chiamare `computeInputCoverage(host)` subito dopo ogni `buildPollLists(host, _quick, _full)`, cioè in `loop()` e in `pruneFullPoll()`.

      **Regola** (vedi il piano):
      - `!_nut_bound` → false;
      - set dei report richiesti = (tipo, id) di `_quick` ∪ `_full` con tipo 1 o 3;
      - gruppi: per ogni riga in `_nut_rows` con lo stesso filtro di `featureReportsRead()`, le usage `{b.idx, b.twin_idx}` valide; il beeper attivo fuori riga quando `!_beeper_row`; ogni usage di `readsFieldOutsideRows()`;
      - un gruppo è dipendente se ha una usage di tipo 1 e nessuna usage (1 o 3) con (tipo, id) richiesto;
      - `_input_values_polled = nessun gruppo dipendente`.

      Commento: il calcolo usa le liste e non il salto dei semi-statici o statici (valori che non cambiano).

      **Passi:** nessun log nuovo. PowercomDriver e CyberPowerDriver ereditano tutto (le loro `buildPollLists` riempiono le stesse liste).

      **Verifica:** `pio test -e native` compila. I test di TASK-04 verificano la regola.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUPSDriver.h — nuovo metodo virtuale
      - lib/USBHostUPS/src/GenericDriver.h — override, membro, dichiarazione del metodo privato
      - lib/USBHostUPS/src/GenericDriver.cpp — computeInputCoverage() e le due chiamate

      ## Criteri di Completamento
      - [ ] `inputValuesPolled()` è falso prima che le liste siano costruite
      - [ ] Il valore viene ricalcolato dopo la costruzione iniziale e dopo `pruneFullPoll()`
      - [ ] La regola usa lo stesso filtro dei lettori di `featureReportsRead()`, con beeper fuori riga e `readsFieldOutsideRows()`
      - [ ] Suite nativa compilata senza errori
    ref: TASK-03
