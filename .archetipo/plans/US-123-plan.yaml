  # US-123: Watchdog degli INPUT report: niente dati stale né riavvio quando il poll rilegge già tutti i valori (#111) — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-06
  **Branch:** da creare all'implementazione, da `main` ed13689 (es. `feature/us-123-input-watchdog-polled`)

  ---

  ## Spec

  **Epic:** EP-001 — Gestione USB Host
  **Priorità:** HIGH | **Punti:** 3 | **Bloccato da:** -

  Il watchdog degli INPUT agisce (dati stale, recovery, riavvio) solo se almeno un valore letto dal driver arriva soltanto dagli INPUT report. Se il poll GET_REPORT rilegge tutti quei valori, un silenzio degli INPUT produce solo una riga di log, come in NUT `usbhid-ups` (ADR 0003).

  ## Contesto verificato nel codice

  - `InputWatchdog` (`lib/USBHostUPS/src/LinkMonitor.h`) impara il periodo degli INPUT. Se il device è periodico, dopo un silenzio di 5 × periodo (almeno 30 s) `isStale()` diventa vero e `tick()` restituisce RECOVER, RECOVER, RESTART. `USBHostUPS::service()` (`USBHostUPS.cpp:358-369`) esegue l'azione, e `isDataStale()` (`USBHostUPS.cpp:876`) somma `_in_wd.isStale()`.
  - Il poll salta un report solo se l'INPUT gemello è arrivato da meno di `maxReportAgeMs()` (2 s, `GenericDriver::isFreshFromInput`). Quando gli INPUT tacciono, i report delle liste di poll vengono richiesti con GET_REPORT.
  - `GenericDriver::loop()` costruisce le liste al primo giro (`bindNutTable` → `buildPollLists` → `findInputTwins`, `GenericDriver.cpp:526-534`) e le ricostruisce una volta, potate, in `pruneFullPoll()` (`GenericDriver.cpp:479-482`) dopo l'INIT walk (US-120). Il driver viene ricreato a ogni claim (`USBHostUPS.cpp:540-541`): un flag del driver riparte da zero con il nuovo dispositivo.
  - **Le fixture:** scansione dei descrittori delle 31 fixture in `test/fixtures` (usage INPUT senza una usage FEATURE con lo stesso percorso). Sono solo due:
    - APC CS500 (#18): INPUT 51 `ACPresent`. È un report solo INPUT, ma `APCDriver` lo chiede con GET_REPORT INPUT (`pollInputReports()` vero), quindi è coperto;
    - Smart-UPS 750 pid 0003 (#22): INPUT 137 vendor, sotto `QUIRK_NO_INTERRUPT_PIPE` e senza righe che lo leggono.

    Tutte le altre, MGE della #111 compresa, hanno un FEATURE gemello per ogni usage INPUT. **Su tutte le fixture note il watchdog risulterà quindi inattivo.** Il caso "non coperto" si prova con un descrittore sintetico. La regola resta comunque utile: protegge i dispositivi futuri con valori solo INPUT che il driver non chiede (per esempio con `pollInputReports()` falso, come CyberPower).

  ---

  ## Soluzione tecnica

  Il driver, che conosce righe e liste di poll, calcola una volta per lista se ogni valore letto dagli INPUT è anche richiesto dal poll. L'host passa l'informazione al watchdog, che resta logica pura.

  - **`IUPSDriver::inputValuesPolled()`** (nuovo, virtuale, default `false`): "vero quando ogni valore che il driver legge dagli INPUT report è richiesto anche dal poll". Il default falso tiene il comportamento di oggi per qualunque driver che non lo calcola.
  - **`GenericDriver`**: nuovo membro `bool _input_values_polled = false` e metodo privato `computeInputCoverage(IHidTransport* host)`, chiamato subito dopo **ogni** `buildPollLists(host, _quick, _full)` in `loop()` (costruzione iniziale e `pruneFullPoll()`). Regola:
    1. Se le righe non sono legate (`!_nut_bound`), il risultato è `false`: non si sa niente, il watchdog resta attivo.
    2. Si raccolgono i report richiesti: le coppie (tipo, id) di `_quick` ∪ `_full`, con tipo 1 o 3 (le stringhe non contano).
    3. Si considerano i "lettori" con lo stesso filtro di `featureReportsRead()`:
       - ogni riga legata non `HU_FLAG_ABSENT`, e dopo `_nut_init_done` né riga di comando né `DEAD`, con le sue usage `idx` e `twin_idx`;
       - il beeper attivo letto fuori riga (`!_beeper_row`, usage con il percorso di `host->getActiveBeeperPath()`), come gruppo a sé;
       - le usage di `readsFieldOutsideRows()`, ognuna come gruppo a sé.
    4. Un gruppo di usage è **dipendente dagli INPUT** se contiene almeno una usage di tipo 1 e nessuna delle sue usage (tipo 1 o 3) ha il proprio (tipo, id) tra i report richiesti.
    5. `_input_values_polled = (nessun gruppo dipendente)`.

    Il conteggio si basa sulle liste, non sul salto dei report semi-statici (US-072) o statici (`pollStaticReportsOnce`). Quei valori non cambiano a runtime, quindi non si "congelano". Va scritto nel commento del metodo.
  - **`InputWatchdog`** (logica pura, `LinkMonitor.h`):
    - `void setValuesPolled(bool polled)`, con il membro `_values_polled` azzerato da `reset()`;
    - con `_values_polled` vero, `isStale()` restituisce sempre `false` e `tick()` sempre `NONE`, senza toccare `_silent`, `_recoveries` o `_windowStartMs`;
    - il periodo continua a essere appreso (`input_period_ms` nell'export resta);
    - nuovo `bool takeSilenceNotice(uint32_t now)`: vero **una sola volta per silenzio**, quando i valori sono coperti, il device è periodico e `now - _lastInputMs >= silenceThresholdMs()`. Un nuovo `onInput()` o un `reset()` lo riarma.
    - Se il flag passa da vero a falso durante un silenzio (non succede nel firmware, dove la copertura cambia solo con le liste), la scala riparte da `tick()` come oggi.
  - **`USBHostUPS::service()`**: prima di `_in_wd.tick(now)`, chiamare `_in_wd.setValuesPolled(_driver->inputValuesPolled())` (`_driver` è già garantito non nullo lì). Dopo `tick()`, se `_in_wd.takeSilenceNotice(now)` è vero: `log("INFO", "[USB] No INPUT report for %u s (period %u ms), values still read with GET_REPORT", ...)`. `isDataStale()` non cambia: legge `_in_wd.isStale()`, che con i valori coperti è falso. Il bool del watchdog viene scritto dal task `ups_poll` e letto da `isDataStale()` in altri task, come gli altri campi del watchdog oggi: non serve un lock nuovo.
  - **Export USB Diagnostics:** `UsbDiagSnapshot` guadagna `bool input_watchdog = false`, scritto in `link` come `"input_watchdog": true|false` subito dopo `input_recoveries`. `USBHostUPS::fillDiagSnapshot` (vicino a `USBHostUPS.cpp:1527`) imposta `s.input_watchdog = _driver && !(_quirks & QUIRK_NO_INTERRUPT_PIPE) && !_driver->inputValuesPolled()`. Vero significa che un silenzio degli INPUT porterebbe a stale, recovery e riavvio.
  - **QUIRK_NO_INTERRUPT_PIPE** non cambia: `processInputReport()` scarta gli INPUT prima del watchdog, che non viene mai alimentato.
  - **ADR 0008**: addendum al punto A2 con regola, motivazione (#111, NUT senza watchdog degli INPUT), risultato sulle fixture (watchdog inattivo su tutte) e nuovo campo dell'export.

  ### Alternative scartate

  - **Togliere del tutto `InputWatchdog`:** coincide col risultato sulle fixture note, ma toglierebbe la protezione ai dispositivi con valori solo INPUT non richiesti.
  - **Tenere una recovery senza escalation quando i valori sono coperti:** nella build v1.12 della #111 proprio la recovery dell'interfaccia ha lasciato l'MGE "Disconnected" fino al distacco del cavo. Non si tocca l'interfaccia se i dati sono buoni.
  - **Calcolo nell'host invece che nel driver:** l'host non vede righe né liste di poll, e duplicarle violerebbe US-120/ADR 0011.

  ---

  ## Strategia di test

  Test nativi (Unity, `pio test -e native`) su tre livelli. Niente UI, quindi niente e2e né video demo.

  - **`InputWatchdog` puro** (`test/test_link_monitor`):
    - con i valori coperti, nessuno stale e nessuna azione anche dopo ore di silenzio;
    - una sola notifica per silenzio, riarmata da un INPUT;
    - `reset()` riporta `values_polled` a falso;
    - con i valori non coperti, i test A2 esistenti restano verdi senza modifiche.
  - **Copertura nel driver**:
    - `test/test_generic_driver`, con descrittore sintetico nel `MockGenericHost`:
      - status solo INPUT con driver di prova `pollInputReports()` falso → non coperto;
      - stesso descrittore con FEATURE gemello → coperto;
      - prima del `loop()` → falso.
    - `test/test_record_replay`: su tutte le fixture (driver del registro e GenericDriver), dopo `completeInitialPoll()` e la ricostruzione potata, `inputValuesPolled()` è vero; la fixture MGE della #111 è citata esplicitamente.
  - **Export**: `test/test_usb_diag_json` controlla la nuova chiave `input_watchdog` nella sezione `link` (ordine, true/false). Gli altri test JSON restano verdi.
  - **Regressione**: suite nativa intera verde, build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1` ok (da PowerShell).
  - **Sul campo** (TASK-08, solo con un sì esplicito dell'utente): sull'Eaton 3S l'export mostra `"input_watchdog": false`, il contatore `[USB] Last 60 s` è invariato e non ci sono riavvii in 15 minuti.

  ---

