tasks:
  - id: TASK-01
    title: 'InputWatchdog: valori coperti dal poll (setValuesPolled, takeSilenceNotice)'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** con i valori coperti dal poll, il watchdog non rende stale i dati e non chiede né recovery né riavvio. Notifica una volta il silenzio.

      **Leggi:** `lib/USBHostUPS/src/LinkMonitor.h` (classe `InputWatchdog` e commento di classe).

      **Modifica:**
      - membro `bool _values_polled`, azzerato in `reset()`;
      - `void setValuesPolled(bool polled)` e `bool valuesPolled() const`;
      - `isStale()`: `return !_values_polled && isPeriodic() && ...`;
      - `tick()`: se `_values_polled`, `return Action::NONE` prima di ogni altra logica, senza toccare `_silent`, `_recoveries` o `_windowStartMs`;
      - `bool takeSilenceNotice(uint32_t now)`: vero una sola volta quando `_values_polled && isPeriodic() && (now - _lastInputMs) >= silenceThresholdMs()` e la notifica non è già stata data (membro `_noticed`); `onInput()` e `reset()` azzerano `_noticed`.

      **Passi:** aggiornare il commento di classe con la regola US-123: la copertura la decide il driver, e con i valori coperti il silenzio non è un guasto (NUT non ha watchdog degli INPUT).

      **Verifica:** compila nel target nativo (`pio test -e native -f test_link_monitor`, i test esistenti restano verdi).

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/LinkMonitor.h — nuova API di InputWatchdog e commento

      ## Criteri di Completamento
      - [ ] Con `setValuesPolled(true)` `isStale()` è sempre falso e `tick()` restituisce sempre NONE
      - [ ] `takeSilenceNotice()` è vero una sola volta per silenzio e si riarma con `onInput()` o `reset()`
      - [ ] `reset()` riporta `valuesPolled()` a falso
      - [ ] I test A2 esistenti di `test_link_monitor` passano senza modifiche
    ref: TASK-01
