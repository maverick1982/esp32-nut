      ## Descrizione
      **Obiettivo:** collegare driver e watchdog nel firmware e rendere visibile lo stato nell'export.

      **Leggi:**
      - `lib/USBHostUPS/src/USBHostUPS.cpp`: `service()` righe ~319-371, `isDataStale()` ~866-877, riempimento dello snapshot ~1515-1535;
      - `lib/USBHostUPS/src/UsbDiagSnapshot.h`;
      - `lib/WebApi/src/UsbDiagJson.cpp` (sezione `link`).

      **Modifica:**
      - In `service()`, subito prima di `switch (_in_wd.tick(now))`: `_in_wd.setValuesPolled(_driver->inputValuesPolled());`.
      - Dopo lo switch, prima di `logStats(now)`:
        ```
        if (_in_wd.takeSilenceNotice(now)) {
            log("INFO", "[USB] No INPUT report for %u s (period %u ms), values still read with GET_REPORT",
                (unsigned)(_in_wd.silenceThresholdMs() / 1000), (unsigned)_in_wd.periodMs());
        }
        ```
      - `isDataStale()` non cambia.
      - `UsbDiagSnapshot`: `bool input_watchdog = false;` con commento. È vero quando un silenzio degli INPUT porterebbe a stale, recovery e riavvio (US-123).
      - Snapshot: `s.input_watchdog = _driver && !(_quirks & QUIRK_NO_INTERRUPT_PIPE) && !_driver->inputValuesPolled();`.
      - `UsbDiagJson::write`: `key(w, 2, "input_watchdog", false); raw(w, s.input_watchdog ? "true" : "false");` subito dopo `input_recoveries`.

      **Verifica:** `pio test -e native` compila; build `esp32-s3-standard` da PowerShell.

      **Blocchi:** TASK-01, TASK-03.

