  # US-067: Modifica dei parametri dell'UPS via NUT (SET VAR / upsrw) — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-10-15 (rev. 2: numeri decimali accettati e troncati come `atol()`)

  ---

  ## Spec

  **Epic:** EP-003 — Server NUT
  **Priorità:** HIGH | **Punti:** 5 (probabile revisione a 8: conversioni inverse, persistenza NVS e TRACKING sono tre blocchi indipendenti)
  **Bloccato da:** US-066 (in REVIEW, codice sul branch `feature/ups-settings`, commit 3132480)

  **User Story**
  Come amministratore che usa upsrw o Home Assistant, voglio cambiare via NUT le soglie e i ritardi dell'UPS e sapere se la modifica è andata a buon fine, in modo da configurarlo senza il software del produttore e senza collegarlo a un PC.

  **Criteri di Accettazione (sintesi)**
  - `SET VAR` con valori tra virgolette, anche con spazi; senza TRACKING OK solo a scrittura riuscita.
  - Errori di upsd: ACCESS-DENIED, UNKNOWN-UPS, DRIVER-NOT-CONNECTED, VAR-NOT-SUPPORTED, READONLY, TOO-LONG, INVALID-VALUE, SET-FAILED; in caso di errore all'UPS non arriva nulla.
  - Variabili HID convertite come usbhid-ups (lookup, date, interi), scritte nel Feature report, report riletto, `LIST VAR` mostra il valore restituito dall'UPS.
  - Variabili lato driver (`ups.delay.*`, `outlet.*.desc`) in NVS, senza I/O USB; `ups.delay.*` solo interi >= 0; i comandi usano subito il nuovo ritardo.
  - TRACKING come upsd; tabella degli esiti a dimensione fissa.
  - Ogni SET nel System Log; test nativi su errori, scrittura/rilettura e sequenza di `upsrw -w`; il replay verifica l'elenco finale di `LIST RW`.

  ---

  ## Soluzione Tecnica

  In upstream il lavoro è diviso tra upsd (`set_var()` in `server/netset.c`: permessi, esistenza, RW, lunghezza, ENUM) e il driver (`setvar()` in `drivers/usbhid-ups.c`: conversione e scrittura). Qui server e driver sono lo stesso processo: il server NUT fa i controlli di upsd, il driver costruisce la scrittura, l'host la esegue. Ogni pezzo con logica è puro e testabile in nativo; `USBHostUPS.cpp`, che il nativo non compila, contiene solo l'orchestrazione.

  ### 1. Conversione inversa (`NutTable.h`)

  `NutTable::encode(const HidInfo&, const char* val, const Context&, const UPSData&, double& out)` restituisce `EncodeResult { OK, FAIL }`. È il porting di `hu_find_valinfo()` e delle funzioni `nuf` upstream:
  - `Number`: come `atol()` di `setvar()` (`usbhid-ups.c:1231`) per ogni testo che è un numero decimale. La sintassi accettata è: spazi iniziali, segno opzionale, almeno una cifra, parte decimale opzionale (`.` seguito da zero o più cifre), spazi finali. Il valore è la parte intera, troncata verso zero come fa `atol()`: `30.7` → 30, `-0.5` → 0. Tutto il resto è FAIL: testo che non è un numero, esponenti (`1e3`, che `atol()` leggerebbe come 1), esadecimale, caratteri dopo il numero, stringa vuota, parte intera fuori da `int32_t`. Il troncamento avviene prima della conversione in valore logico, come in upstream: `12.34` in un campo con esponente -2 diventa 1200.
  - `Lookup`, `NominalVoltage`, `PegasusThreshold`: `strcmp` sulla tabella `lkp`, come `hu_find_valinfo()` quando la prima voce non ha `nuf` (`nominal_output_voltage_info` e `pegasus_threshold_info` non ce l'hanno). Nessuna corrispondenza: FAIL.
  - `PegasusYesNo`: `pegasus_yes_no_info_nuf()` alla lettera (`mge-hid.c:877`): modello non Pegasus → 0; testo che inizia con `yes` → 1; altro → 0.
  - `BatteryDate`: `date_conversion_reverse()` (`usbhid-ups.c:561`): `YYYY/MM/DD` → `((y-1980)<<9) + (m<<5) + d`. Testo non analizzabile o fuori range (anno < 1980 o > 2107, mese > 12, giorno > 31) → FAIL.
  - `MgeDate` / `MgeTime`: `mge_date_conversion_nuf()` / `mge_time_conversion_nuf()` (`mge-hid.c:626-655`): il valore più l'altra metà presa dai valori correnti di `ups.time` / `ups.date`, formato `%Y/%m/%d %H:%M:%S`, convertito in secondi UTC con un `timegm` portabile (days-from-civil), simmetrico al `gmtime()` della lettura di US-066. Mai `mktime()`: in nativo dipende dal fuso dell'host. Analisi fallita → FAIL.

  ### 2. Valore logico (`HIDParser`)

  `static bool HIDParser::toLogical(const HIDUsageDef& def, double physical, int32_t& logical)`, inverso di `extractUsage()`: stesso esponente di unità, con la stessa correzione -7 per le unità in volt e solo per `bit_size > 1`, poi `lrint`. Restituisce false quando il valore è fuori dal range logico dichiarato (`logical_max > logical_min`) o non entra nei bit del campo (`CommandCatalog::fitsField`). Il parser non legge Physical Min/Max, né in lettura né in scrittura: comportamento simmetrico e preesistente.

  ### 3. Piano di scrittura nel driver

  In `NutTable.h`:
  - `enum class SetStatus { OK, UNKNOWN, CONVERSION_FAILED, FAILED, NOT_CONNECTED }`: gli esiti `STAT_SET_*` di upstream più il caso host scollegato;
  - `struct SetPlan { enum class Kind { HID, DRIVER_SIDE } kind; const char* name; HIDUsageDef def; int32_t raw; String value; }`.

  `IUPSDriver::planSet(const UPSData&, const std::vector<HIDUsageDef>&, const char* name, const char* value, NutTable::SetPlan&) const` restituisce `SetStatus` (default UNKNOWN). `GenericDriver` lo implementa:
  - cerca la riga `ACTIVE` con `ST_FLAG_RW` e nome uguale senza distinzione di maiuscole, come `find_nut_info()`; se non c'è → UNKNOWN;
  - riga `HU_FLAG_ABSENT` (`outlet.*.desc`) → DRIVER_SIDE con il valore così com'è, come `dstate_setinfo()` in `setvar()`;
  - `ups.delay.shutdown` / `ups.delay.start` (fuori dalla tabella, US-066), se presenti in `UPSData` → DRIVER_SIDE; accettati solo interi >= 0 (`CommandCatalog::parseDelayParam` e `v >= 0`), altrimenti CONVERSION_FAILED;
  - riga HID: `encode()` → FAIL diventa CONVERSION_FAILED. Si sceglie l'usage Feature tra `idx` e `twin_idx`; se nessuno dei due è Feature → FAILED. `toLogical()` false → CONVERSION_FAILED. Altrimenti piano HID con `def` (l'usage Feature) e `raw`.

  `IUPSDriver::setDriverSideValue(const char* name, const char* value)`: per le righe ABSENT `GenericDriver` tiene un override (`_absent_overrides`), lo applica subito alla riga legata e a ogni nuovo `bindNutTable()`. `setup()` lo azzera: l'host lo riapplica subito dopo.

  `GenericDriver::completeInitialPoll()` (pubblico, solo per il replay runner): imposta `_first_full_done` e applica `finishInit` come il ramo di `postDecode()`, così il replay simula la fine del primo poll completo.

  ### 4. Esecuzione nell'host

  `IUSBHostUPS::setVariable(const char* name, const char* value)` restituisce `NutTable::SetStatus` (default NOT_CONNECTED). `USBHostUPS` lo implementa:
  - host non connesso o driver assente → NOT_CONNECTED;
  - sotto `_mutex`: `_driver->planSet(_ups_data, usages, name, value, plan)`; un esito diverso da OK termina qui;
  - DRIVER_SIDE: prima il salvataggio nello store. Se fallisce → FAILED e nulla cambia. Poi la cache in memoria e il valore: `_ups_data.set()` per `ups.delay.*`, `_driver->setDriverSideValue()` per `outlet.*.desc`. Nessun I/O USB;
  - HID: `_op_mutex` con `OP_WAIT_MS`, come `setBeeper()` e `writeUsage()`, poi `writeUsageLocked(def, raw)`. Se riesce, `requestReport(def.report_id, FEATURE, lunghezza attesa)` rilegge il report e lo decodifica (`decodeReport` + `postDecode`, come il poll): `LIST VAR` mostra il valore restituito dall'UPS. Una rilettura fallita non cambia l'esito, perché la scrittura è riuscita: WARN nel log, e il prossimo poll completo aggiorna il valore. Prende il posto di `data_has_changed` di upstream, che rilegge le SEMI_STATIC al poll successivo;
  - System Log con lo stesso callback di `executeCommand()`: `Variable <var> = "<value>": OK` a livello INFO, e a livello WARN `failed`, `invalid value`, `not supported` o `UPS not connected`.

  I comandi di US-058 leggono `ups.delay.*` da `UPSData` a ogni esecuzione (`configuredDelay()`): il nuovo ritardo vale subito, senza riavvio.

  ### 5. Persistenza in NVS

  - `lib/USBHostUPS/src/DriverVarStore.h` (header-only): interfaccia `IDriverVarStore { virtual bool load(std::vector<std::pair<String, String>>&); virtual bool save(const char* name, const char* value); }` più `DriverVarStore::toJson()` / `fromJson()` (ArduinoJson, oggetto `{nome: valore}`), testabili in nativo.
  - `src/core/driver_var_store.cpp` / `.h`: implementazione con `Preferences`, namespace `nutrw`, una sola chiave `vars` con il JSON. Le chiavi NVS hanno al massimo 15 caratteri, quindi `ups.delay.shutdown` non può essere una chiave. Le variabili lato driver sono poche (2 ritardi, al massimo 4 descrizioni di prese): la dimensione è limitata.
  - `src/core/main.cpp` crea lo store e lo passa con `usb_ups.setDriverVarStore(&store)` prima di `begin()`; l'host carica la cache una volta.
  - Alla connessione `CommandCatalog::applyDefaultDelays()` riceve un parametro opzionale con i valori salvati. Dopo i default del driver, un valore salvato sostituisce `ups.delay.*` solo se la variabile esiste per questo driver e il valore è ancora un intero >= 0. È la funzione che l'host richiama dopo ogni string descriptor: un valore salvato non torna mai al default. Subito dopo `_driver->setup()` l'host chiama `setDriverSideValue()` per gli altri valori salvati (`outlet.*.desc`).
  - I valori valgono per qualunque UPS collegato, come `offdelay`/`ondelay` in `ups.conf`. NVS sopravvive a riavvio e OTA. Il reset ai default è in US-068.

  ### 6. Server NUT

  - **Parser.** `splitTokens()` si comporta come `pconf`: un backslash rende letterale il carattere successivo (upsrw codifica virgolette, backslash e `#` con `pconf_encode()`), e una coppia di virgolette vuota produce un token vuoto. Oggi il token vuoto viene scartato, e `SET VAR ups outlet.desc ""` darebbe ERR INVALID-ARGUMENT. Il limite di 256 caratteri per riga resta.
  - **`SET` (`net_set`).** Meno di 2 argomenti, sottocomando sconosciuto o `SET VAR` con meno di 4 argomenti → ERR INVALID-ARGUMENT.
  - **`SET VAR <ups> <var> <value>`**, controlli nell'ordine di `set_var()`:
    1. UNKNOWN-UPS;
    2. DRIVER-NOT-CONNECTED (nessun host o `!isConnected()`), poi DATA-STALE (`ups_available()`);
    3. ACCESS-DENIED, con la stessa regola di INSTCMD;
    4. VAR-NOT-SUPPORTED, con la stessa regola di presenza di `GET VAR`;
    5. READONLY, se la variabile non è in `getWritableVariables()`;
    6. `aux < 1` → ERR SET-FAILED con WARN `auxdata for <var> is invalid`. È il caso di `input.sensitivity` di cps-hid, che upstream dichiara con aux 0: come con upsd, non si può scrivere;
    7. TOO-LONG se `strlen(value) > aux`;
    8. INVALID-VALUE se la variabile ha un ENUM e il valore non c'è (`strcmp`). `LIST RANGE` è vuota, quindi non c'è controllo di range.
  - **Richiesta valida.** `setVariable(nome canonico, valore)`. Senza TRACKING: `OK` solo con `SetStatus::OK`, altrimenti `ERR SET-FAILED`. Con TRACKING: si genera l'id, si registra l'esito e si risponde `OK TRACKING <id>`.
  - **Log.** Un rifiuto di validazione va nel System Log tramite il nuovo `NUTServer::setLogCallback()` (WARN, `SET <var> "<value>" from <user>: ERR <code>`). Gli esiti delle richieste valide li registra l'host, così una richiesta non viene registrata due volte. `main.cpp` collega il callback ad `AppLogger`.
  - **`SET TRACKING ON|OFF`** (senza distinzione di maiuscole) → OK, con flag per slot (`_clientTracking`). Un altro valore → ERR INVALID-ARGUMENT. Nessun controllo di autenticazione, come `net_set`. `closeSession()` azzera il flag.
  - **`GET TRACKING`** → `ON` o `OFF`. `GET TRACKING <id>`: con il flag spento ERR FEATURE-NOT-CONFIGURED, altrimenti la risposta di `tracking_get()`.

  ### 7. Tabella di tracking (`lib/NUTServer/src/NutTracking.h`, header-only)

  - 16 voci fisse `{ char id[37]; status; uint32_t created_ms; bool used; }`. `add()` sostituisce la voce più vecchia; nessuna allocazione dinamica.
  - `get()` confronta l'id senza distinzione di maiuscole (`strcasecmp` in `tracking_get()`); una voce più vecchia di 3600 s (`tracking_delay` di upsd) vale come sconosciuta. Differenze di `millis()` sicure al wrap.
  - Id UUID v4 nel formato di `nut_uuid_v4()`: 36 caratteri, esadecimale maiuscolo, nibble di versione 4 e variante `10xx`. La sorgente casuale è iniettabile: `esp_random()` sul dispositivo, deterministica nei test.
  - Esiti: OK → `SUCCESS`; CONVERSION_FAILED → `ERR INVALID-ARGUMENT`; FAILED e NOT_CONNECTED → `ERR FAILED`; UNKNOWN, id sconosciuto o scaduto → `ERR UNKNOWN`. `PENDING` non compare mai, perché l'esito è noto prima della risposta.
  - La tabella è unica, il flag è per client, come in upsd: un client con TRACKING attivo può leggere l'esito di un id generato da un altro.

  ### Deviazioni da upstream

  Verificate sui sorgenti in `nut_repo/`. Le prime tre evitano che un errore di battitura arrivi all'UPS come un valore diverso:
  - **Numeri:** si rifiuta solo il testo che non è un numero, che `atol()` trasforma in 0 (`battery.charge.low=abc` scriverebbe una soglia di LB a 0%). Un numero, anche con decimali, si comporta come `atol()`, troncato verso zero. Le uniche altre differenze sono testi che `atol()` legge solo in parte: `1e3` (1 per `atol()`) e `30x` (30) vengono rifiutati.
  - **Range:** un valore fuori dal range logico dichiarato o dai bit del campo è una conversione fallita. Upstream lo satura (`physical_to_logical()`, solo con Physical Min/Max dichiarati) o ne tronca i bit (`SetValue()`): 300 in un campo da 8 bit diventerebbe 44.
  - **Date:** testo non valido o fuori range è una conversione fallita. Upstream scrive 0 (`date_conversion_reverse()`, `mge_*_conversion_nuf()`), cioè una data `not set` o il 1970.
  - **Arrotondamento:** `lrint` nella conversione fisico → logico invece del troncamento `(long)`. Il risultato è lo stesso sui valori esatti, e si evita che 12 con esponente -2 diventi 1199.
  - **Esito sincrono senza TRACKING:** OK solo a scrittura riuscita (upsd risponde OK appena inoltra). Deciso nella spec.
  - **Scrittura fallita con TRACKING:** `ERR FAILED`, come chiede la spec. usbhid-ups restituisce `STAT_SET_UNKNOWN` (FIXME in `setvar()`), quindi upsd risponderebbe `ERR UNKNOWN`.
  - **`ups.delay.*`:** solo interi >= 0; upstream accetta qualunque stringa. Deciso nella spec.
  - **Rilettura immediata** del report dopo la scrittura; upstream rilegge al poll successivo.
  - **Riga legata solo a un usage Input, senza Feature:** FAILED senza scrivere.
  - **Senza credenziali NUT configurate** SET è permesso, come INSTCMD oggi; upsd senza utenti lo nega sempre. Comportamento preesistente.
  - **Nessuna differenza** su `aux` 0 di cps `input.sensitivity` (SET-FAILED come upsd), sull'ordine dei controlli e sui testi di errore.

  ---

  ## Strategia di Test

  Test nativi Unity (`pio test -e native`, con il PATH del toolchain mingw). Gli attesi si ricavano dai sorgenti upstream e dai byte dei report delle fixture, mai dall'output del codice in prova.

  - **Conversioni (`test/test_rw_catalog`, `test/test_hid_parser`)**:
    - `encode()`, per ogni `Conv`: valori validi, testo non valido, fuori range, Pegasus/non Pegasus, `ups.date`/`ups.time` combinati con l'altra metà;
    - andata e ritorno `decode(encode(x)) == x` sui casi tabellari;
    - `toLogical()` con esponenti 0, -2 e unità volt (+7), range dichiarato e non dichiarato, campi con segno.
  - **Piano del driver (`test/test_rw_catalog`)**: `planSet()` per ogni `SetStatus`; scelta del gemello Feature; righe ABSENT; `ups.delay.*`; override di `outlet.*.desc` che sopravvive a un nuovo bind e si azzera con `setup()`.
  - **Persistenza (`test/test_command_catalog`)**: `toJson`/`fromJson`, JSON corrotto ignorato; `applyDefaultDelays()` con valori salvati: sostituzione, variabile assente per il driver, valore salvato non valido scartato, idempotenza alla seconda chiamata.
  - **Protocollo (`test/test_nut_server`)**:
    - ogni codice d'errore, nell'ordine di `set_var()`, controllando che il mock non riceva `setVariable()`;
    - valori con spazi, virgolette ed escape;
    - OK e SET-FAILED sincroni;
    - sequenza di `upsrw -w`: `SET TRACKING ON` → OK; `SET VAR` → `OK TRACKING <36 caratteri>`, lunghezza totale 48 come il controllo di `upsrw.c:149`; `GET TRACKING <id>` → SUCCESS;
    - esiti INVALID-ARGUMENT, FAILED e UNKNOWN; FEATURE-NOT-CONFIGURED; id sconosciuto e scaduto (orologio iniettato); 17 SET che scartano la voce più vecchia; flag azzerato a fine sessione;
    - una riga di log per ogni rifiuto.
  - **Replay (`test/test_record_replay`)**:
    - per ogni fixture, `LIST RW` finale (nome:aux, ordinata come upsd) dopo il replay e dopo `completeInitialPoll()`, con `ups.delay.*`;
    - ciclo scrittura/rilettura su Eaton 3S, APC e CyberPower: `planSet` → byte attesi del Feature report (l'ultimo della fixture con il campo riscritto) → `decodeReport`/`postDecode` → valore in `UPSData`.
  - **Regressione**: suite nativa completa verde e build `esp32-s3-standard`.
  - **Nessun test e2e**: la spec non ha superficie UI (la pagina Web è in US-068). Non è prevista una demo video: la dimostrazione è da terminale con `upsrw`.
  - **Verifica manuale sull'Eaton 3S** (riportata nel task finale):
    - `upsrw -s battery.charge.low=30` → OK, e `upsc` mostra 30;
    - `upsrw -w -s ...` → SUCCESS;
    - `upsrw -s ups.delay.shutdown=60`, riavvio, `upsc` mostra 60;
    - un valore ENUM non valido → INVALID-VALUE;
    - System Log con una riga per ogni SET.

  ---

  _Piano generato tramite ARchetipo Planning — 2026-10-15_
tasks:
  - id: TASK-01
    title: Conversione inversa dei valori NUT (NutTable::encode) e valore logico (HIDParser::toLogical)
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** trasformare il testo di un `SET VAR` nel valore HID da scrivere, come `hu_find_valinfo()` e le funzioni `nuf` upstream, con le deviazioni elencate nel piano.

      **Da leggere:**
      - `lib/USBHostUPS/src/NutTable.h`, righe 39-246 (`Conv`, `Lookup`, `decode()`, `pegasusValid()`);
      - `lib/USBHostUPS/src/HIDParser.cpp`, righe 242-289 (`extractUsage`);
      - `lib/USBHostUPS/src/CommandCatalog.h`, righe 256-287 (`parseDelayParam`, `fitsField`);
      - upstream: `nut_repo/drivers/usbhid-ups.c` righe 561-578 (`date_conversion_reverse`) e 3090-3120 (`hu_find_valinfo`); `nut_repo/drivers/mge-hid.c` righe 626-665 e 877-895.

      **Modifiche:**
      - In `NutTable.h`: `enum class EncodeResult { OK, FAIL }` e `inline EncodeResult encode(const HidInfo& info, const char* val, const Context& ctx, const UPSData& data, double& out)`.
        - `Number`: parser scritto a mano (niente `strtod`, che accetterebbe esponenti, esadecimale, `inf` e `nan`). Accetta spazi iniziali, segno opzionale, almeno una cifra, un `.` opzionale seguito da zero o più cifre e spazi finali. `out` è la parte intera troncata verso zero (`30.7` → 30, `-0.5` → 0, come `atol()`). FAIL per ogni altro testo, per la stringa vuota e per una parte intera fuori da `int32_t`.
        - `Lookup` / `NominalVoltage` / `PegasusThreshold`: `strcmp` sulla `lkp`.
        - `PegasusYesNo`: `pegasusValid(ctx)` falso → 0, altrimenti `strncmp(val, "yes", 3) == 0` → 1, altro → 0.
        - `BatteryDate`: formato `YYYY/MM/DD` esatto, range 1980-2107 / 1-12 / 1-31, altrimenti FAIL.
        - `MgeDate` / `MgeTime`: unisce `val` con `data.get("ups.time")` / `data.get("ups.date")`, analizza `%Y/%m/%d %H:%M:%S` a mano (niente `strptime`, che manca su mingw) e converte con un `timegmUtc()` days-from-civil.
        - Commento di riga con il riferimento upstream di ogni ramo.
      - Includere `UPSData.h` in `NutTable.h` se non è già raggiungibile, evitando include circolari: in alternativa passare a `encode()` le due stringhe `ups.date`/`ups.time` invece di `UPSData`.
      - In `HIDParser.h/.cpp`: `static bool toLogical(const HIDUsageDef& def, double physical, int32_t& logical)`. Per `bit_size > 1` applica l'esponente inverso di `extractUsage()` (stessa correzione -7 per le unità 0x00F0D121 / 0x0000D121), poi `lrint`. False se `logical_max > logical_min` e il valore è fuori range, oppure se `CommandCatalog::fitsField()` fallisce. Per non includere `CommandCatalog.h` nel parser si può replicare il controllo dei bit con un commento che rimandi a `fitsField`.

      **Passi:**
      1. Scrivere `timegmUtc()` e `encode()` vicino a `decode()`.
      2. Scrivere `toLogical()` accanto a `extractUsage()`.
      3. Compilare l'env `native` e `esp32-s3-standard`.

      **Verifica:** `pio test -e native -f test_rw_catalog -f test_hid_parser` resta verde; la build `esp32-s3-standard` compila.

      **Fatto quando:** le due funzioni esistono, sono pure (nessun I/O) e coprono tutti i valori di `Conv`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — `EncodeResult`, `encode()`, `timegmUtc()`
      - lib/USBHostUPS/src/HIDParser.h — dichiarazione di `toLogical()`
      - lib/USBHostUPS/src/HIDParser.cpp — implementazione di `toLogical()`

      ## Criteri di Completamento
      - [ ] `encode()` gestisce ogni `Conv` con il riferimento upstream in commento
      - [ ] nessun uso di `mktime`, `strptime` o `atol`
      - [ ] `toLogical()` è l'inverso di `extractUsage()` e rifiuta i valori fuori range o fuori dai bit
      - [ ] build native ed esp32-s3-standard ok
    ref: TASK-01
  - id: TASK-02
    title: Test delle conversioni inverse e di toLogical
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** fissare con test nativi il comportamento di `encode()` e `toLogical()`, compresi i casi di deviazione da upstream.

      **Da leggere:** `test/test_rw_catalog/test_main.cpp` (stile e helper degli usage sintetici), `test/test_hid_parser/test_main.cpp`.

      **Modifiche:**
      - `test/test_rw_catalog/test_main.cpp`:
        - `Number`: `30` → 30, `-5` → -5, `+7` → 7, ` 30 ` (spazi) → 30, `30.0` → 30, `30.7` → 30, `-0.5` → 0, `12.34` → 12, `30.` → 30; `abc`, `30x`, `1e3`, `0x10`, `.`, `-`, `.5`, stringa vuota e `99999999999` → FAIL;
        - `Lookup` APC sensitivity: `medium` → 1, `Medium` → FAIL (`strcmp`);
        - `NominalVoltage`: `230` → 230;
        - `PegasusThreshold`: `25` → 25, `30` → FAIL;
        - `PegasusYesNo`: con `mge_type` Pegasus `yes` → 1 e `nope` → 0; con modello non Pegasus → 0;
