  - id: TASK-07
    title: 'USBHostUPS::setVariable: scrittura, rilettura, valori lato driver e log'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** eseguire il piano del driver: scrittura HID con rilettura del report, oppure salvataggio lato driver, con una riga nel System Log.

      **Da leggere:**
      - `lib/USBHostUPS/src/USBHostUPS.h`;
      - `lib/USBHostUPS/src/USBHostUPS.cpp`, righe 386-405 (claim e `setup()` del driver), 593-631 (`requestReport`), 676-684 (string descriptor), 773-851 (`writeUsage`, `executeCommand`) e 883-908 (`applyDefaultDelays`, `getWritableVariables`).

      **Modifiche:**
      - `USBHostUPS.h`: `void setDriverVarStore(IDriverVarStore* store)`; membri `IDriverVarStore* _var_store` e `std::vector<std::pair<String, String>> _saved_vars` (cache); override di `setVariable`.
      - `setDriverVarStore`: salva il puntatore e carica la cache con `load()`.
      - `applyDefaultDelays()`: passa `&_saved_vars` a `CommandCatalog::applyDefaultDelays`.
      - Dopo `_driver->setup()` (riga ~400): per ogni valore salvato diverso da `ups.delay.*`, `_driver->setDriverSideValue(name, value)`.
      - `setVariable(name, value)`:
        1. `!isConnected()` o `!_driver` → NOT_CONNECTED;
        2. sotto `_mutex`: `planSet` con `_ups_data` e `_hid_parser.getUsages()`;
        3. DRIVER_SIDE: `_var_store` assente o `save()` false → FAILED; altrimenti `DriverVarStore::upsert` sulla cache, poi `_ups_data.set()` (`ups.delay.*`) o `_driver->setDriverSideValue()`, sotto `_mutex`;
        4. HID: `_op_mutex` con `OP_WAIT_MS` (timeout → FAILED), `writeUsageLocked(plan.def, (uint32_t)plan.raw)`. Se riesce, `requestReport(plan.def.report_id, HID_REPORT_TYPE_FEATURE, _hid_parser.getExpectedLength(...))`; se la rilettura fallisce, WARN `Variable %s written, read back failed` e l'esito resta OK. Rilasciare `_op_mutex`. Nessun `_mutex` tenuto durante i trasferimenti (ADR 0008);
        5. log: INFO `Variable %s = \"%s\": OK`; WARN `...: failed`, `...: invalid value`, `...: not supported`, `...: UPS not connected`.
      - `src/core/main.cpp`: attivare la riga `usb_ups.setDriverVarStore(&store)` se il TASK-05 l'ha lasciata commentata.

      **Passi:**
      1. Store e cache.
      2. Riapplicazione alla connessione.
      3. `setVariable`.
      4. Build.

      **Verifica:** build `esp32-s3-standard`; `pio test -e native` verde (`USBHostUPS.cpp` non è compilato in nativo: la logica è nei task 01-06).

      **Fatto quando:** `setVariable` copre i due tipi di piano, il log e l'ordine dei lock.

      **Blocchi:** se `requestReport` in fase di rilettura viene chiamato mentre `isPollingPaused()` o `!_link.canPoll()`, restituisce false: va bene, è il caso della rilettura fallita.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — store, cache, `setVariable`
      - lib/USBHostUPS/src/USBHostUPS.cpp — implementazione
      - src/core/main.cpp — cablaggio dello store

      ## Criteri di Completamento
      - [ ] scrittura HID sotto `_op_mutex`, seguita dalla rilettura e dalla decodifica del report
      - [ ] valori lato driver salvati prima di essere applicati; salvataggio fallito → FAILED
      - [ ] valori salvati riapplicati a ogni connessione e dopo ogni string descriptor
      - [ ] una riga di System Log per ogni chiamata
      - [ ] build ok
    ref: TASK-07
  - id: TASK-08
    title: Tabella di tracking a dimensione fissa con id UUID v4 (NutTracking.h)
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** conservare gli esiti delle richieste con TRACKING come `tracking_add()`/`tracking_get()` di upsd, con memoria fissa.

      **Da leggere:** `nut_repo/server/upsd.c` righe 1537-1596 (`tracking_cleanup`, `tracking_get`) e la funzione `nut_uuid_v4` (riga ~1628); `nut_repo/include/common.h:784` (`UUID4_LEN` 37).

      **Modifiche:** nuovo `lib/NUTServer/src/NutTracking.h` (header-only, perché l'env native compila solo i `.cpp` elencati):
      - `class NutTracking` con `static const size_t CAPACITY = 16` e `static const uint32_t MAX_AGE_MS = 3600000` (`tracking_delay`);
      - `struct Entry { char id[37]; NutTable::SetStatus status; uint32_t created_ms; bool used; }` in un array fisso;
      - `typedef uint32_t (*RandomFn)();` passato al costruttore;
      - `void newId(char out[37])`: 16 byte casuali (4 chiamate), `b[6] = (b[6] & 0x0F) | 0x40`, `b[8] = (b[8] & 0x3F) | 0x80`, formato `%02X` con trattini 8-4-4-4-12;
      - `void add(const char* id, NutTable::SetStatus st, uint32_t now)`: prima voce libera, altrimenti la più vecchia per `now - created_ms`;
      - `const char* get(const char* id, uint32_t now) const`: confronto senza distinzione di maiuscole; non trovato o `now - created_ms > MAX_AGE_MS` → `ERR UNKNOWN`. Mappatura: OK → `SUCCESS`; CONVERSION_FAILED → `ERR INVALID-ARGUMENT`; FAILED e NOT_CONNECTED → `ERR FAILED`; UNKNOWN → `ERR UNKNOWN`.

      **Passi:** scrivere l'header con i riferimenti upstream in commento.

      **Verifica:** compila nell'env native; i test sono nel TASK-10.

      **Fatto quando:** l'header non usa allocazioni dinamiche e non dipende da Arduino oltre a `NutTable.h`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/NUTServer/src/NutTracking.h — tabella e id (nuovo)

      ## Criteri di Completamento
      - [ ] capacità fissa di 16, sostituzione della voce più vecchia
      - [ ] scadenza di 3600 s sicura al wrap di `millis()`
      - [ ] id nel formato di `nut_uuid_v4`
      - [ ] mappatura degli esiti come `tracking_get()`
    ref: TASK-08
  - id: TASK-09
    title: 'Server NUT: parser pconf, SET VAR, SET/GET TRACKING e log dei rifiuti'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-08
    body: |-
      ## Descrizione
      **Obiettivo:** implementare `SET VAR`, `SET TRACKING` e `GET TRACKING` con i controlli e le risposte di upsd.

      **Da leggere:**
      - `lib/NUTServer/src/NUTServer.h/.cpp` (in particolare `splitTokens`, INSTCMD alle righe 441-476, GET alle righe 478-622);
      - `nut_repo/server/netset.c` righe 30-248;
      - `nut_repo/server/netget.c` righe 266-285;
      - `nut_repo/common/parseconf.c` (escape `#`, backslash, virgolette).

      **Modifiche:**
      - `splitTokens()`:
        - un backslash, dentro o fuori virgolette, aggiunge il carattere successivo letterale;
        - una coppia di virgolette chiude un token anche se è vuoto (`""` → token vuoto);
        - il comportamento sulle righe esistenti non cambia (test in TASK-10).
      - `NUTServer.h`:
        - `bool _clientTracking[NUT_MAX_CLIENTS]`, inizializzato nel costruttore e azzerato in `closeSession()` e alla nuova connessione;
        - `NutTracking _tracking`;
        - `typedef void (*LogFn)(const char* level, const char* msg); void setLogCallback(LogFn)`;
        - `void setClock(uint32_t (*now)())` e `void setRandom(uint32_t (*rnd)())` per i test, con default `millis` ed `esp_random`; in `PIO_UNIT_TESTING` il default casuale è `rand`.
      - `processCommand`, nuovo ramo `SET`:
        - argomenti come `net_set` (tutti gli errori di forma → `ERR INVALID-ARGUMENT`);
        - `TRACKING ON|OFF` → flag e `OK`;
        - `VAR`: controlli nell'ordine del piano (sezione 6); una funzione `setVarPresent()` condivisa con `GET VAR` per la presenza (stato, `device.type`, alias, chiave);
        - `aux < 1` → `ERR SET-FAILED` con WARN `auxdata for %s is invalid`;
        - richiesta valida → `_usb_ups->setVariable(v->name, value)`; risposta sincrona o con tracking (`newId`, `add`, `OK TRACKING <id>`).
      - `GET TRACKING`: gestito prima degli altri sottocomandi di `GET`; `tokens.size() == 2` → `ON`/`OFF`; altrimenti FEATURE-NOT-CONFIGURED o `_tracking.get(id, now)`.
      - Ogni rifiuto di `SET VAR` dopo il parsing: `log("WARN", "SET %s \"%s\" from %s: ERR %s")`, con utente `-` se manca.
      - `src/core/main.cpp`: `nut_server.setLogCallback(...)` verso `AppLogger::log`.

      **Passi:**
      1. Parser.
      2. Stato per slot e tracking.
      3. `SET`.
      4. `GET TRACKING`.
      5. Log e cablaggio.

      **Verifica:** `pio test -e native -f test_nut_server` (i test esistenti restano verdi) e build `esp32-s3-standard`.

      **Fatto quando:** il server risponde a tutte le forme di `SET` e `GET TRACKING` di `netset.c`/`netget.c`.

      **Blocchi:** il buffer di riga del client è di 256 caratteri e accetta solo ASCII stampabile (righe 188-191): valori più lunghi vengono troncati prima del parsing; non cambiare questo limite in questa spec.

      ## File Coinvolti
      - lib/NUTServer/src/NUTServer.h — stato TRACKING, callback di log, iniezioni per i test
      - lib/NUTServer/src/NUTServer.cpp — parser, `SET`, `GET TRACKING`
      - src/core/main.cpp — callback di log del server NUT

      ## Criteri di Completamento
      - [ ] escape pconf e token vuoti nel parser
      - [ ] ordine dei controlli identico a `set_var()`
      - [ ] risposta sincrona e con tracking come nel piano
      - [ ] `GET TRACKING` con e senza id
      - [ ] ogni rifiuto registrato nel System Log
      - [ ] build ok
    ref: TASK-09
