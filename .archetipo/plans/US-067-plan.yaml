        - nome con maiuscole diverse → `setVariable` riceve il nome canonico;
        - valore `"Rack A"` con spazio, valore con virgolette escapate e valore vuoto `""` arrivano intatti;
        - sincrono: OK → `OK`; FAILED e CONVERSION_FAILED → `ERR SET-FAILED`;
        - sequenza di `upsrw -w`: `SET TRACKING ON` → `OK`; `SET VAR ...` → riga `OK TRACKING ` più 36 caratteri (48 in totale senza newline, come `upsrw.c:149`), id con il formato UUID v4; `GET TRACKING <id>` → `SUCCESS`; id in minuscolo → `SUCCESS`;
        - esiti con tracking: CONVERSION_FAILED → `ERR INVALID-ARGUMENT`; FAILED → `ERR FAILED`; UNKNOWN → `ERR UNKNOWN`;
        - con TRACKING attivo, un errore di validazione resta immediato (`ERR READONLY`, nessun id);
        - `GET TRACKING` → `OFF`/`ON`; `GET TRACKING <id>` con TRACKING spento → `ERR FEATURE-NOT-CONFIGURED`; `SET TRACKING MAYBE` → INVALID-ARGUMENT;
        - id sconosciuto → `ERR UNKNOWN`; id più vecchio di 3600 s (orologio iniettato) → `ERR UNKNOWN`;
        - 17 SET con tracking: il primo id → `ERR UNKNOWN`, l'ultimo → `SUCCESS`;
        - TRACKING per slot: lo slot 1 resta OFF quando lo slot 0 è ON;
        - `splitTokens`: le righe dei test esistenti producono gli stessi token; escape del backslash; token vuoto.

      **Passi:** estendere il mock, scrivere i test e registrarli.

      **Verifica:** `pio test -e native -f test_nut_server`.

      **Fatto quando:** ogni codice d'errore della spec e ogni risposta di `GET TRACKING` hanno un test.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_nut_server/test_main.cpp — mock esteso e test di protocollo

      ## Criteri di Completamento
      - [ ] tutti i codici d'errore coperti, senza chiamate a `setVariable` in caso di errore
      - [ ] sequenza di `upsrw -w` riprodotta
      - [ ] tabella fissa e scadenza verificate
      - [ ] suite verde
    ref: TASK-10
  - id: TASK-11
    title: 'Replay: LIST RW finale per ogni fixture e ciclo scrittura/rilettura'
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** nel replay, verificare l'elenco finale di `LIST RW` di ogni fixture e il ciclo scrittura/rilettura sui byte reali dei report (miglioramento chiesto dalla code review di US-066).

      **Da leggere:** `test/test_record_replay/FixtureReplayRunner.h`, `test/test_record_replay/test_main.cpp`, le fixture in `test/fixtures/*/`.

      **Modifiche:**
      - `FixtureReplayRunner::runFixtureTest`: due parametri opzionali `expectedListRW` (dopo il replay) ed `expectedListRWFinal` (dopo `static_cast<GenericDriver*>(driver)->completeInitialPoll()`), entrambi `nome:aux` separati da spazi, nell'ordine di `writableVariables()` (`strcasecmp`).
      - Nuovo helper `runSetCycle(fixture, var, value, expectedRaw, expectedValue)`:
        - esegue il replay;
        - chiama `planSet`;
        - verifica `kind` HID e `raw`;
        - prende l'ultimo Feature report della fixture con quel report ID, scrive il campo con `BeeperLogic::writeField(def, raw, ...)`, lo passa a `decodeReport` + `postDecode` e controlla `UPSData[var] == expectedValue`.
      - `test_main.cpp`:
        - attesi di `LIST RW` per tutte le fixture (Eaton, APC, CyberPower, Powercom, OpenUPS, generic), compresi `ups.delay.*` con aux 10 (8 su Powercom);
        - cicli: Eaton 3S `battery.charge.low=30`; un APC `battery.charge.low=25`; CyberPower CP1600 `input.transfer.low` con un valore entro il range del descriptor; APC `input.sensitivity=high` dove il descriptor lo lega.

      **Passi:**
      1. Per ricavare gli attesi, decodificare a mano o con uno script indipendente (nella scratchpad, non nel repo) i byte dei report e il descriptor di ogni fixture, partendo dalle righe di `NutTable.h` e dai percorsi upstream. Mai copiare l'output del codice.
      2. Annotare in commento, accanto a ogni atteso, il report e i byte da cui viene.
      3. Se un atteso differisce dal risultato del codice, fermarsi e segnalarlo: non correggere l'atteso.

      **Verifica:** `pio test -e native -f test_record_replay`.

      **Fatto quando:** ogni fixture ha gli attesi di `LIST RW` prima e dopo `completeInitialPoll()`, e almeno quattro cicli scrittura/rilettura passano.

      **Blocchi:** se `completeInitialPoll()` cambia l'elenco in modo inatteso (righe DEFER su Eaton), riportarlo nella review invece di adattare il test.

      ## File Coinvolti
      - test/test_record_replay/FixtureReplayRunner.h — attesi di `LIST RW` e `runSetCycle`
      - test/test_record_replay/test_main.cpp — attesi per fixture e cicli

      ## Criteri di Completamento
      - [ ] `LIST RW` finale verificata per ogni fixture, con nomi, aux e `ups.delay.*`
      - [ ] almeno 4 cicli scrittura/rilettura su fixture reali
      - [ ] attesi ricavati dai byte, con la fonte in commento
      - [ ] suite verde
    ref: TASK-11
