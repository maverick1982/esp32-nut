  - id: TASK-03
    title: Piano di scrittura nel driver (planSet, setDriverSideValue) e interfaccia setVariable
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** il driver decide cosa scrivere per un `SET` (HID o lato driver), senza I/O, e l'interfaccia dell'host espone `setVariable()`.

      **Da leggere:**
      - `lib/USBHostUPS/src/IUPSDriver.h`;
      - `lib/USBHostUPS/src/GenericDriver.h/.cpp`, righe 519-590 (`bindNutTable`, `postDecode`, `writableVariables`);
      - `lib/USBHostUPS/src/NutTable.h`, righe 309-421 (`Bound`, `bind`, `finishInit`);
      - `lib/USBHostUPS/src/IUSBHostUPS.h`;
      - upstream `setvar()`, `nut_repo/drivers/usbhid-ups.c:1167-1245`.

      **Modifiche:**
      - `NutTable.h`: `enum class SetStatus { OK, UNKNOWN, CONVERSION_FAILED, FAILED, NOT_CONNECTED }`; `struct SetPlan { enum class Kind : uint8_t { HID, DRIVER_SIDE } kind; const char* name; HIDUsageDef def; int32_t raw; String value; }`.
      - `IUPSDriver.h`:
        - `virtual NutTable::SetStatus planSet(const UPSData& data, const std::vector<HIDUsageDef>& usages, const char* name, const char* value, NutTable::SetPlan& plan) const` (default UNKNOWN);
        - `virtual void setDriverSideValue(const char* name, const char* value) {}`.
      - `GenericDriver`:
        - `planSet` come descritto nel piano, sezione 3: riga ACTIVE e RW con `equalsIgnoreCase`; ABSENT → DRIVER_SIDE; `ups.delay.*` presenti → interi >= 0; riga HID → `encode()` con `_nut_ctx`, usage Feature tra `idx`/`twin_idx`, `HIDParser::toLogical()`;
        - `plan.name` punta sempre al nome canonico (`info_type` o la costante di `ups.delay.*`);
        - `setDriverSideValue`: salva in `std::vector<std::pair<String, String>> _absent_overrides` (sostituisce se presente) e aggiorna `value`/`has` della riga ABSENT legata con quel nome;
        - in `bindNutTable()`, dopo `NutTable::bind`, riapplica gli override; `setup()` svuota `_absent_overrides`;
        - `void completeInitialPoll()` pubblico: `_first_full_done = true`, poi `finishInit` se non ancora fatto (`_nut_init_done`), con un commento che lo dichiara hook del replay runner.
      - `IUSBHostUPS.h`: `virtual NutTable::SetStatus setVariable(const char* name, const char* value) { return NutTable::SetStatus::NOT_CONNECTED; }` con un commento sull'ordine dei lock (come `executeCommand`).

      **Passi:**
      1. Tipi in `NutTable.h`.
      2. Metodi virtuali nelle interfacce.
      3. Implementazione in `GenericDriver`.
      4. Build native ed esp32.

      **Verifica:** `pio test -e native` (suite esistenti verdi) e build `esp32-s3-standard`.

      **Fatto quando:** `planSet` copre tutti i rami senza toccare `UPSData` né l'USB.

      **Blocchi:** se un driver derivato sovrascrive `setup()` senza chiamare `GenericDriver::setup()`, gli override non si azzerano: controllare `EatonDriver`, `APCDriver`, `CyberPowerDriver`, `PowercomDriver`, `EcoFlowDriver` e `OpenUPSDriver`.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — `SetStatus`, `SetPlan`
      - lib/USBHostUPS/src/IUPSDriver.h — `planSet`, `setDriverSideValue`
      - lib/USBHostUPS/src/GenericDriver.h — dichiarazioni, `_absent_overrides`, `completeInitialPoll`
      - lib/USBHostUPS/src/GenericDriver.cpp — implementazione
      - lib/USBHostUPS/src/IUSBHostUPS.h — `setVariable` virtuale

      ## Criteri di Completamento
      - [ ] `planSet` restituisce UNKNOWN, CONVERSION_FAILED, FAILED o OK secondo le regole del piano
      - [ ] gli override ABSENT sopravvivono a un nuovo bind e si azzerano con `setup()`
      - [ ] `completeInitialPoll()` esiste e applica `finishInit`
      - [ ] build ok
    ref: TASK-03
