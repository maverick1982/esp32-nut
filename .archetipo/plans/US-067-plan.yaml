      ## Descrizione
      **Obiettivo:** coprire ogni codice d'errore, l'esito sincrono, la sequenza di TRACKING di `upsrw -w` e il parser.

      **Da leggere:** `test/test_nut_server/test_main.cpp` (`MockUSBHost`, `MemoryPrinter`), `nut_repo/clients/upsrw.c` righe 123-235 e 260-285.

      **Modifiche:**
      - `MockUSBHost`: override di `setVariable` che registra `{name, value}` e restituisce `setResult` (default OK); `rwVars` restituito da `getWritableVariables()`.
      - Test (uno per caso):
        - `SET`, `SET FOO`, `SET VAR ups var` → INVALID-ARGUMENT;
        - UNKNOWN-UPS; DRIVER-NOT-CONNECTED; DATA-STALE; ACCESS-DENIED con credenziali e sessione non autenticata;
        - VAR-NOT-SUPPORTED; READONLY (variabile presente ma non RW); aux 0 → SET-FAILED con una riga WARN; TOO-LONG (aux 5, valore di 6 caratteri); INVALID-VALUE fuori ENUM;
