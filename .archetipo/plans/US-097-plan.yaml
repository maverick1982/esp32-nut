    body: |-
      ## Descrizione
      **Obiettivo:** il replay del dump reale, con comandi e variabili scrivibili attesi.

      **Leggere:** `test/test_record_replay/test_main.cpp` (`test_replay_cyberpower_ut850eg_discussion95`, `test_replay_legrand_keor_pdu800_issue90`, macro `RW_DELAYS`), una fixture nel formato del dispositivo (es. `test/fixtures/cyberpower/cyberpower_ut850eg_vid0764_pid0501_discussion95.json`).

      **Passi:**
      1. Scaricare https://github.com/user-attachments/files/33862842/usb_diagnostics.json e creare `test/fixtures/phoenixtec/powerwalker_vi2200shl_vid06da_pidffff_issue96.json` nel formato delle altre fixture (descriptor 10 byte per riga, `data` su una riga): `notes` con origine (#96, v1.8.0, alimentatore al posto della batteria, descriptor identico alla #97); report Feature prima e Input dopo, come per l'UT850EG.
