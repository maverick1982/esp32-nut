  - id: TASK-08
    title: Prova sul campo su Eaton 3S (solo dopo un sì esplicito dell'utente)
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Descrizione
      **Obiettivo:** confermare sulla scheda reale che la potatura toglie dal full poll solo i report previsti dal golden `eaton_3s`, e che i valori NUT non cambiano.

      **Leggere:** `docs/test-results/US-120/full-poll-reports.md` (riga Eaton 3S), il golden `test/test_record_replay/golden/eaton_3s_vid0463_pidffff.registry.txt`, la procedura OTA già usata per US-119 (credenziali nel file JSON indicato in memoria, mai stamparle).

      **Modificare:** niente nei sorgenti. Il risultato va in `docs/test-results/US-120/field-eaton3s.md`.

      **Passi:**
      1) chiedere all'utente un sì esplicito: la prova va fatta solo dopo;
      2) flash OTA della build `esp32-s3-standard`;
      3) leggere nel System Log il log debug "Full poll: N FEATURE reports without NUT rows left out" e confrontarlo con il documento dei risultati;
      4) per almeno 10 minuti, nessun `requestReport FAILED` nuovo, e `upsc` con le stesse variabili di prima della prova (stesso insieme di chiavi);
      5) scrivere l'esito.

      **Verifica:** l'elenco dei report tolti coincide con il golden; nessuna variabile NUT sparita.

      **Fatto:** esito scritto in `docs/test-results/US-120/field-eaton3s.md`, oppure il task resta aperto con il motivo, se l'utente non dà il consenso.

      **Blocchi:** senza consenso esplicito non si fa. L'Eaton 3S alimenta anche la scheda: niente prove di blackout.

      ## File Coinvolti
      - docs/test-results/US-120/field-eaton3s.md — esito della prova sul campo

      ## Criteri di Completamento
      - [ ] Consenso esplicito dell'utente ottenuto prima della prova
      - [ ] Report tolti uguali a quelli del golden Eaton 3S
      - [ ] Variabili NUT invariate ed esito documentato
    ref: TASK-08
