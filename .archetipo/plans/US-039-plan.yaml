schema: archetipo/plan/v2
spec_code: US-039
body: |-
  ## Technical Solution

  **Rework**: Questa iterazione corregge i difetti di parsing segnalati dall'utente (Real Power errata, Battery Capacity in Ah errata, e voltaggio/frequenza nominali mancanti/errati).
  **Rework 2**: Correzione dell'errore sulla frequenza (che riporta 3 anzichè 60Hz per l'utente USA).

  1. **Real Power (Watt)**:
  Il report `0x18` restituisce il `Config Active Power` in Watt. Nel calcolo attuale (`(configApparentPower * 60 * load) / 10000`) si applica inavvertitamente un power factor dello 0.6 a un valore che è già in Watt, abbassando così il valore riportato di circa il 40% rispetto al reale (spiegando i ~100W in meno segnalati). La formula va corretta in `(ActivePower * load) / 100`.

  2. **Battery Ah Capacity**:
  Il report `0x07` (Capacity Info) mappa i valori di batteria in base alla percentuale, ma il driver sta scrivendo il valore `100` (100%) dentro `designCapacity` e `fullChargeCapacity`, che invece dovrebbero rappresentare gli Ampere-Ora (Ah). Questo porta l'interfaccia a mostrare '100 Ah'. Per i CyberPower via HID, se il valore reale in Ah non è esposto nei report standard o è incerto, è meglio non valorizzare `designCapacity` piuttosto che mostrare un 100 Ah fuorviante. Rimuoveremo il mapping su questi campi per il report `0x07`.

  3. **Input Frequency e Voltage Nominal**:
  Nel polling è presente `host->requestReport(0x0E, 0x03, 2);` per l'Input Config Voltage, ma manca la gestione del case `0x0E` nel metodo `decodeReport`. Inoltre, il case `0x09` (Config Voltage) sta catturando un valore che per l'utente USA risulta essere 240V (probabilmente una lettura errata, oppure un valore a 16-bit letto come 8-bit, o un report non standard per questo modello). Il report 0x0D usato in precedenza per la frequenza restituisce 3 perché, come analizzato dai dump HID, corrisponde a `UPS.PowerSummary.iManufacturer` (l'indice della stringa del produttore), non alla frequenza. Inoltre, i log di NUT confermano che l'UPS non trasmette la frequenza (`UPS.Input.Frequency` failed to locate). Occorre rimuovere l'assegnazione erronea della frequenza dal `case 0x0D` in modo da non mostrare '3 Hz' fittizi.
tasks:
  - id: TASK-01
    title: Implementare polling report in CyberPowerDriver::loop
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Aggiornare il metodo `loop()` per implementare una macchina a stati (polling lento/veloce) che inoltri periodicamente al `host` le richieste (`requestReport`, `requestStringDescriptor`) necessarie a interrogare i parametri del CyberPower, basandosi su quali report ID contengono i dati in `cps-hid.c`.

      ## File Coinvolti
      - `lib/USBHostUPS/src/CyberPowerDriver.h` — Aggiungere eventuali variabili di stato per il polling (es. step, timestamp).
      - `lib/USBHostUPS/src/CyberPowerDriver.cpp` — Implementare il polling nel metodo `loop()`.

      ## Criteri di Completamento
      - [ ] La logica di polling ciclico per i report CyberPower è implementata.
    ref: TASK-01
  - id: TASK-02
    title: Decodifica report HID e popolamento UPSData
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      Rimuovere il codice placeholder `ups_data.acPresent = true;`. Implementare in `decodeReport` lo switch sui `report_id` per mappare i byte estratti nei campi di `UPSData` (es. batteria, carico, voltaggi, stati operativi come OL/OB/Charging). Fare lo stesso per `parseStringDescriptor` se servono stringhe. Riferirsi ai mapping presenti in `cps-hid.c` di NUT.

      ## File Coinvolti
      - `lib/USBHostUPS/src/CyberPowerDriver.cpp` — Mappare i parametri ricevuti nella struct `ups_data` in base ai vari ID di report.

      ## Criteri di Completamento
      - [ ] Placeholder eliminato.
      - [ ] `decodeReport` estrapola la percentuale batteria, voltaggio, carico, runtime (ove disponibili) e gli stati AC/DC.
      - [ ] Tutti i parametri estratti da Eaton che esistono anche nel report CyberPower sono mappati (copertura paritaria).
    ref: TASK-02
  - id: TASK-03
    title: Test di Build e Nessuna Regressione
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      Verificare che i cambiamenti nel driver CyberPower non abbiano impattato il resto dell'architettura e che tutto compili con successo.

      ## File Coinvolti
      - Nessuno (solo compilazione)

      ## Criteri di Completamento
      - [ ] `pio run` (o task di build) termina senza errori.
      - [ ] I driver Eaton e APC continuano a compilare intatti.
    ref: TASK-03
  - id: TASK-04
    title: Fix calcolo Real Power (Watt)
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Il feedback segnala: "Il parametro Real Power (Watt) calcolato è errato, risulta più basso di circa 100W rispetto al display dell'UPS."
      Il report `0x18` è Config Active Power (in Watt). Nel `case 0x13:` si applica inavvertitamente un declassamento (`val * 60 / 10000`), trattandolo come VA.
      Occorre correggere il calcolo della `realPower` sostituendo la formula errata con `(ups_data.configApparentPower * ups_data.load) / 100;`.

      ## File Coinvolti
      - `lib/USBHostUPS/src/CyberPowerDriver.cpp`

      ## Criteri di Completamento
      - [ ] La formula nel `case 0x13` viene corretta in modo da non applicare il fattore di conversione VA->W (0.6), moltiplicando solo per la percentuale di carico e dividendo per 100.
    ref: TASK-04
  - id: TASK-05
    title: Fix mappatura Battery Ah capacity
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Il feedback segnala: "Il parametro Battery Ah capacity riporta 100, che non è un valore corretto per la capacità della batteria."
      Nel `case 0x07` di `decodeReport`, il valore estratto rappresenta molto probabilmente la percentuale (100) ma viene assegnato erroneamente a `designCapacity` e `fullChargeCapacity` che sono in Ah.
      Rimuovere le assegnazioni a `designCapacity` e `fullChargeCapacity` in modo da non riportare un falso valore di 100Ah alla Web UI.

      ## File Coinvolti
      - `lib/USBHostUPS/src/CyberPowerDriver.cpp`

      ## Criteri di Completamento
      - [ ] Il report `0x07` non valorizza più `ups_data.designCapacity` né `ups_data.fullChargeCapacity`.
    ref: TASK-05
  - id: TASK-06
    title: Fix frequenza e voltaggio nominale
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Il feedback segnala: "La frequenza nominale non viene trasmessa (riporta 0) e la tensione nominale è errata (riporta 240V, ma in USA dovrebbe essere 120V e 60Hz)."
      - Nel polling di `loop()` è richiesto `0x0E` (Input Config Voltage) ma manca in `decodeReport`.
      - Il `case 0x09` legge probabilmente un valore errato o 16-bit per il voltaggio.
      - Occorre identificare e richiedere il report per la frequenza nominale (es. aggiungendolo alla sequenza di polling lento o veloce) ed estrarlo in `decodeReport` valorizzando `ups_data.configFrequency`.
      - Occorre correggere il parsing di `0x0E` e `0x09` per catturare correttamente la tensione nominale (120V nei modelli USA).

      ## File Coinvolti
      - `lib/USBHostUPS/src/CyberPowerDriver.cpp`

      ## Criteri di Completamento
      - [ ] Il metodo `loop()` richiede il report corretto per la frequenza nominale (se supportato) e `decodeReport` lo estrae in `configFrequency`.
      - [ ] Il metodo `decodeReport` implementa il caso `0x0E` e converte correttamente i byte in `configVoltage` (gestendo correttamente l'offset se il valore fosse little-endian a 16 bit, es. 120).
    ref: TASK-06
  - id: TASK-07
    title: Rimozione parsing errato della frequenza su Report 0x0D
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Il feedback segnala: "Il valore della frequenza estrapolato è errato: riporta 3 invece di 60 Hz".
      L'analisi approfondita del dump HID ha rivelato che il report `0x0D` per i CyberPower corrisponde a `iManufacturer` (indice della stringa del produttore), il cui valore è 3. Inoltre, il dump conferma che l'UPS in questione non espone `UPS.Input.Frequency` né `UPS.Output.Frequency`.
      L'assegnazione di `configFrequency` all'interno del `case 0x0D` nel metodo `decodeReport` è quindi un residuo errato copiato dal driver Eaton e va rimosso.

      ## File Coinvolti
      - `lib/USBHostUPS/src/CyberPowerDriver.cpp`

      ## Criteri di Completamento
      - [ ] L'assegnazione di `ups_data.configFrequency = data[offset];` viene rimossa dal `case 0x0D`.
      - [ ] La Web UI smetterà di mostrare il valore fittizio '3 Hz'.
    ref: TASK-07
