      ## Descrizione
      **Obiettivo:** un solo punto, header-only e testabile in nativo, dove l'host raggiunge i metodi HID del driver con `hid()`, con i valori neutri quando `hid() == nullptr`.

      **Leggere:** sezione "DriverDispatch.h" del piano (tabella delle funzioni e dei valori neutri), `lib/USBHostUPS/src/NutTable.h:1660-1690` (`applyDefaultDelays`, `parseDelayParam`), `LinkMonitor.h:136-260` (`InputWatchdog`).

      **Modificare:**
      1. `NutTable.h`: estrarre `inline void applyDelayValues(UPSData& data, int32_t off_delay, int32_t on_delay, bool sd, bool st, const std::vector<std::pair<String, String>>* saved = nullptr)` con il ciclo dei valori salvati e le due `data.set`; `applyDefaultDelays()` mantiene firma e controllo `if (!delay_vars || !paths) return;`, calcola `sd`/`st` e chiama `applyDelayValues`. Risultato identico.
      2. Nuovo `lib/USBHostUPS/src/DriverDispatch.h`: include `IHidDriver.h`, `NutTable.h`, `UPSData.h`; `namespace DriverDispatch` con le funzioni `inline` della tabella del piano (`hidOf`, `attach`, `decode`, `parseString`, `inputValuesPolled`, `inputWatchdogActive`, `requestLength`, `acceptDiagReport`, `invalidateReport`, `planSet`, `commandTable`, `beeperFieldRead`, `beeperControllable`, `beeperMuteSupported`, `applyDefaultDelays`). Ogni funzione tollera `d == nullptr` restituendo lo stesso valore neutro. Nessun lock, nessun log. Commento in testa: è l'unico posto dell'host dove si chiama `hid()` (ADR 0013, sezione 1).

