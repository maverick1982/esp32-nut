  - id: TASK-04
    title: Test nativo test_driver_dispatch con driver finto senza estensione HID
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** dimostrare in nativo che con `hid() == nullptr` l'host non chiama mai un metodo HID e il watchdog degli INPUT non si attiva, e che con un driver HID ogni chiamata arriva invariata.

      **Leggere:** `DriverDispatch.h`, `IHidDriver.h`, `LinkMonitor.h` (`InputWatchdog`), `test/test_hid_control/test_main.cpp` (stile e driver istanziati), sezione "Strategia di test" del piano.

      **Modificare:** nuovo `test/test_driver_dispatch/test_main.cpp` (Unity), con:
      - `SpyHidDriver : public IHidDriver`: contatori per ogni metodo HID e del nucleo, ultimi argomenti ricevuti, `control()` che restituisce un `IUpsControl` finto statico; flag `neutral` che fa restituire `nullptr` a entrambi gli overload di `hid()`.
      - `FakeTransport : IHidTransport` minimo (stub).
      - `test_neutral_driver_never_reaches_hid`: sequenza dell'host (`attach`, `setup`, `applyDefaultDelays`, `formatDeviceStrings`, `poll` più volte, `initialPollDone`, `control()`) e poi ogni altra funzione di `DriverDispatch`; asserire zero chiamate HID e i valori neutri (`requestLength == expected`, `acceptDiagReport` falso, `planSet == UNKNOWN`, `commandTable` nullo con `n == 0`, `beeperFieldRead` falso, `beeperControllable` e `beeperMuteSupported` veri, `hidOf == nullptr`).
      - `test_neutral_driver_keeps_input_watchdog_inert`: `InputWatchdog` con 8 burst periodici, `setValuesPolled(DriverDispatch::inputValuesPolled(&neutral))`, silenzio oltre `silenceThresholdMs()`: `isStale()` falso e `tick()` sempre `NONE`; `inputWatchdogActive(&neutral, false)` falso.
      - `test_neutral_driver_delays`: `delayVariablesSupported()` vero → `ups.delay.shutdown`/`start` ai default; con valore salvato valido → quello; falso → assenti.
      - `test_hid_driver_forwards_every_call`: stesso spy con `hid() == this`: ogni funzione inoltra gli stessi argomenti una volta; `decode` chiama `decodeReport` prima di `postDecode`; `attach(d, &t)` e `poll()` arrivano a `loop(&t, ...)`; senza `attach` `poll()` non chiama `loop`.
      - `test_every_hid_driver_returns_its_extension`: Generic, APC, CyberPower, Eaton, EcoFlow, Legrand, Liebert, OpenUPS, Powercom: `d.hid() == &d` (come `IUPSDriver&`).

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_driver_dispatch`. Mutazione manuale (poi annullata): far chiamare `inputValuesPolled()` di HID anche con `hid() == nullptr` o restituire `false` → il test deve fallire.

      **Fatto quando:** suite verde e mutazione catturata.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_driver_dispatch/test_main.cpp — nuovo

      ## Criteri di Completamento
      - [ ] Con `hid() == nullptr` zero chiamate HID su tutta la sequenza e su ogni funzione di `DriverDispatch`
      - [ ] Watchdog degli INPUT inerte per il driver neutro
      - [ ] Con un driver HID ogni chiamata è inoltrata con gli stessi argomenti e nello stesso ordine
      - [ ] Tutti i 9 driver HID restituiscono la loro estensione
      - [ ] La mutazione descritta in Verifica fa fallire il test
    ref: TASK-04
  - id: TASK-05
    title: Instradare le chiamate HID di USBHostUPS attraverso DriverDispatch
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** `USBHostUPS` chiama i metodi HID del driver solo attraverso `DriverDispatch` (cioè `hid()`), con lo stesso comportamento per i driver HID.

      **Leggere:** `lib/USBHostUPS/src/USBHostUPS.cpp` ai punti elencati nella sezione "Punti di chiamata" del piano (righe 360, 385, 549, 655-657, 912-913, 961, 980, 1079, 1124, 1130, 1136, 1196, 1234, 1333, 1346, 1355-1357, 1398, 1436, 1443, 1536), `USBHostUPS.h`.

      **Modificare:**
      1. `#include "DriverDispatch.h"` in `USBHostUPS.cpp`.
      2. Sostituire ogni chiamata HID su `_driver`/`drv` con la funzione di `DriverDispatch` indicata nel piano, mantenendo lock, ordine e condizioni (`if (_driver)`, `_driver ? ... : ...`).
      3. In `claimInterface()` subito dopo `DriverRegistry::create()`: `DriverDispatch::attach(_driver, this);` prima di `_driver->setup();`.
      4. Poll: `_driver->loop(this, _ups_data, now)` → `_driver->poll(_ups_data, now)`.
      5. `setBeeperLocked`: `BeeperLogic::manipulateBeeperBuffer(..., DriverDispatch::hidOf(_driver))`.
      6. Nessun altro cambiamento: niente log nuovi, niente rami per famiglia, niente modifiche a task, lock o tempi.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`; `grep -nE "(_driver|drv)->(loop|decodeReport|postDecode|planSet|requestLength|acceptDiagReport|invalidateReport|inputValuesPolled|parseStringDescriptor|encodeBeeperValue|beeperControllable|beeperMuteSupported|beeperFieldRead|commandTable|delayPaths)\(" lib/USBHostUPS/src/USBHostUPS.cpp` non trova nulla.

      **Fatto quando:** la build S3 compila e il grep è vuoto.

      **Blocchi:** se un punto di chiamata richiede di cambiare l'ordine o un lock per compilare, fermarsi e segnalarlo.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.cpp — chiamate HID via `DriverDispatch`, `attach` e `poll()`
      - lib/USBHostUPS/src/USBHostUPS.h — solo se serve un include o una forward declaration

      ## Criteri di Completamento
      - [ ] Nessuna chiamata HID diretta su `_driver` o `drv` in `USBHostUPS.cpp`
      - [ ] Trasporto legato prima di `setup()`; poll con `_driver->poll()`
      - [ ] `pio run -e esp32-s3-standard` compila
    ref: TASK-05
  - id: TASK-06
    title: Controlli sui sorgenti del confine nucleo/estensione in test_hid_transport
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** rendere verificabili in nativo i criteri sul testo (nucleo senza tipi HID, host che non chiama HID fuori da `hid()`), dato che `USBHostUPS.cpp` non compila nell'env `native`.

      **Leggere:** `test/test_hid_transport/test_main.cpp` (funzioni `projectPath`, `readSource`, `test_driver_sources_include_no_usb_host`, `test_command_logic_left_the_usb_host_interface`).

      **Modificare:**
      1. Aggiungere `lib/USBHostUPS/src/IHidDriver.h` e `lib/USBHostUPS/src/DriverDispatch.h` all'elenco dei file di `test_driver_sources_include_no_usb_host`.
      2. Nuovo `test_driver_core_names_no_hid_type`: il testo di `IUPSDriver.h` non contiene `HIDUsageDef`, `HIDParser`, `IHidTransport`, `report_id`, `HidInfo` né i nomi dei metodi HID (`decodeReport`, `postDecode`, `planSet`, `requestLength`, `acceptDiagReport`, `invalidateReport`, `inputValuesPolled`, `parseStringDescriptor`, `encodeBeeperValue`, `beeperControllable`, `beeperMuteSupported`, `beeperFieldRead`, `commandTable`, `delayPaths`); contiene `hid()`.
      3. Nuovo `test_usb_host_reaches_hid_only_through_dispatch`: in `USBHostUPS.cpp` nessuna occorrenza di `_driver->X(` o `drv->X(` per X nell'elenco dei metodi HID più `loop`; `DriverDispatch::` presente.
      4. Registrare i test in `RUN_TEST`.

      **Verifica:** `pio test -e native -f test_hid_transport`; mutazione manuale (poi annullata): rimettere `_driver->inputValuesPolled()` in `USBHostUPS.cpp` → il test fallisce.

      **Fatto quando:** suite verde e mutazione catturata.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_hid_transport/test_main.cpp — due test nuovi ed elenco dei file esteso

      ## Criteri di Completamento
      - [ ] Il test fallisce se `IUPSDriver.h` nomina un tipo o un metodo HID
      - [ ] Il test fallisce se `USBHostUPS.cpp` chiama un metodo HID direttamente sul driver
      - [ ] `IHidDriver.h` e `DriverDispatch.h` non includono l'host USB
    ref: TASK-06
