  - id: TASK-08
    title: 'Regressione completa: suite nativa, replay, e2e e tutte le build'
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-06
      - TASK-07
    body: |-
      ## Descrizione
      **Obiettivo:** provare che il refactoring non cambia il comportamento.

      **Leggere:** `platformio.ini` (env `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`, `native`), `package.json` (`npm run e2e`).

      **Passi:**
      1. `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native` (rilanciare da sola con `-f` una suite ERRORED transitoria).
      2. `npm run e2e`.
      3. `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`, `-e esp32-p4-eth`, `-e esp32-p4-eth-v1`; annotare RAM e flash dell'S3 rispetto a `main` (atteso: differenza di pochi byte).
      4. `git diff --stat` e `git diff test/`: nei test esistenti solo adattamenti di tipo (TASK-02) e i test nuovi.

      **Verifica:** i quattro passi senza errori.

      **Fatto quando:** tutto verde e i numeri riportati nel riepilogo dell'implementazione.

      **Blocchi:** un fallimento di replay o e2e è un cambio di comportamento: correggere il codice, mai le attese. Nessuna prova sull'UPS reale in questa storia (non tocca l'aggancio né i tempi; la build di prova su hardware è prevista per US-132).

      ## File Coinvolti
      - platformio.ini — solo lettura (env da compilare)
      - package.json — solo lettura (`npm run e2e`)

      ## Criteri di Completamento
      - [ ] `pio test -e native` verde, compreso `test_record_replay`
      - [ ] `npm run e2e` verde
      - [ ] Le tre build di `platformio.ini` compilano; RAM/flash S3 annotate
      - [ ] Nessuna asserzione dei test esistenti cambiata
    ref: TASK-08
