    body: |-
      ## Descrizione
      **Obiettivo:** tutta la suite nativa compila e passa dopo TASK-01, con modifiche solo di tipo.

      **Leggere:** i punti dove un `IUPSDriver` chiama un metodo HID: `test/test_cyberpower_driver/test_main.cpp:565`, `test/test_eaton_driver/test_main.cpp:598`, `test/test_poll_cycle/test_main.cpp:25,95,456,465,541,732,752`, `test/test_record_replay/FixtureReplayRunner.h:67,98,141,247,360` e le chiamate `driver->decodeReport/postDecode/loop/parseStringDescriptor/commandTable/beeperFieldRead/beeperMuteSupported/delayPaths`.

      **Modificare:**
      1. Riferimenti locali usati per metodi HID: `const IUPSDriver& d` → `const IHidDriver& d` (cyberpower, eaton, poll_cycle), `IUPSDriver& d` → `IHidDriver& d`.
      2. `test_poll_cycle`: `IUPSDriver* _driver` di `MockPollHost` e `runLoop(IUPSDriver& drv, ...)` → `IHidDriver`.
      3. `FixtureReplayRunner.h`: `ReplaySession::driver` e `_answer_driver` → `IHidDriver*`; all'assegnazione da `DriverRegistry::create()` usare `->hid()` tenendo il puntatore originale per il `delete` (o un `TEST_ASSERT_NOT_NULL` sul risultato di `hid()`); `listRW()` può restare con `const IUPSDriver*`.
