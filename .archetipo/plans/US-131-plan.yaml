  ---
  # US-131: Nucleo neutro di IUPSDriver ed estensione HID raggiungibile solo da hid() — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-07

  ---

  ## Spec

  **Epic:** EP-007 — Supporto UPS Q* (nutdrv_qx)
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come sviluppatore che aggiunge i driver Q* (ADR 0013, sezione 1), voglio che `IUPSDriver` contenga solo ciò che l'host chiede a ogni driver e che i metodi HID stiano in un'estensione raggiungibile solo da `hid()`, in modo che un driver di un'altra famiglia non riceva mai chiamate HID per errore.

  **Criteri di Accettazione**
  - Nucleo con solo i metodi chiesti a ogni famiglia, più `hid()`.
  - Il nucleo non nomina tipi HID (`HIDUsageDef`, `HIDParser`, `IHidTransport`, report id, `HidInfo`).
  - Metodi HID nell'estensione; distribuzione dei casi di confine scritta qui sotto.
  - `USBHostUPS` chiama i metodi HID solo attraverso `hid()`; con `hid() == nullptr` mai (test nativo con driver finto).
  - `GenericDriver` e derivati restituiscono la loro estensione e non cambiano comportamento.
  - Regressione: test nativi, replay ed e2e verdi senza cambiare le asserzioni; tutte le build di `platformio.ini` compilano.

  ---

  ## Soluzione tecnica

  Stesso schema di `IUpsControlPort::hidPort()` (US-105): `IUPSDriver` diventa il nucleo neutro e una nuova interfaccia `IHidDriver : public IUPSDriver` (file `lib/USBHostUPS/src/IHidDriver.h`) raccoglie i metodi HID e implementa `hid()` restituendo `this`. `GenericDriver` passa da `IUPSDriver` a `IHidDriver`; i driver derivati non cambiano. L'host raggiunge i metodi HID solo attraverso un nuovo header `DriverDispatch.h`, l'unico punto in cui si scrive `hid()`, testabile in nativo (USBHostUPS.cpp non compila nell'env `native`: `lib_ignore = USBHostUPS`).

  ### Nucleo `IUPSDriver` (dopo la US)

  | Metodo | Perché nel nucleo |
  |---|---|
  | `getDriverName()` | export diagnostico, `driver.name` |
  | `setup()` | aggancio e riavvio del ciclo di poll |
  | `poll(UPSData&, uint32_t now)` **nuovo, puro** | poll periodico senza trasporto nella firma; ogni famiglia riceve il suo trasporto per altra via |
  | `initialPollDone()` | primo dato servito (#60) |
  | `formatDeviceStrings(UPSData&)` | stringhe del dispositivo |
  | `control()` | comandi e SET VAR (US-105) |
  | `shutdownCommandsSupported()` | letto dalla porta neutra `IUpsControlPort::shutdownCommandsSupported()` ed è il default di `delayVariablesSupported()` |
  | `defaultOffDelay()`, `defaultOnDelay()`, `delayVariablesSupported()` | ritardi predefiniti e presenza di `ups.delay.*` |
  | `writableVariables()` | LIST RW |
  | `setDriverSideValue()`, `resetDriverSideValue()`, `noteHostValue()` | valori lato driver |
  | `noteDataChanged()` | dopo una scrittura sull'UPS (US-072) |
  | `requestSpacingMs()` | distanza minima fra richieste |
  | `hid()` / `hid() const` **nuovi** | `nullptr` di default |

  ### Estensione `IHidDriver`

  `loop(IHidTransport*, UPSData&, now)`, `decodeReport`, `postDecode`, `parseStringDescriptor`, `planSet(..., const std::vector<HIDUsageDef>&, ...)`, `requestLength`, `acceptDiagReport`, `invalidateReport`, `inputValuesPolled`, `encodeBeeperValue`, `beeperControllable`, `beeperMuteSupported`, `beeperFieldRead(const IHidTransport*)`, `commandTable`, `delayPaths`, più `bindTransport(IHidTransport*)` (nuovo) e l'implementazione di `poll()` del nucleo.

  ### Casi di confine (regola: nel nucleo solo ciò che l'host usa per ogni famiglia)

  | Metodo | Dove | Motivo |
  |---|---|---|
  | `encodeBeeperValue` | HID | codifica di un campo HID (`bit_size`) |
  | `beeperControllable` | HID | l'host lo usa solo per il SET_REPORT del beeper HID e per `supportsBeeperToggle()`, che cerca il percorso `AudibleAlarmControl`; un driver Q* espone il beeper dal suo `IUpsControl` |
  | `beeperMuteSupported` | HID | letto solo da `HidControl` tramite la porta; con `hid() == nullptr` la porta restituisce `true` (default di `IUpsControlPort`) |
  | `beeperFieldRead` | HID | stato del report del campo beeper |
  | `commandTable` | HID | righe `HidInfo` |
  | `delayPaths` | HID | percorsi di usage HID |
  | `shutdownCommandsSupported` | **nucleo** | esposto dalla porta neutra a ogni `IUpsControl`; da esso dipende il default di `delayVariablesSupported()` |
  | `requestSpacingMs` | **nucleo** | richiesto dal criterio; vale per ogni trasporto a richiesta/risposta |
  | `delayAux` | **`GenericDriver`** (virtuale pubblica) | l'host non lo chiama mai: è l'`info_len` delle righe HID usato solo in `GenericDriver::writableVariables()`; `PowercomDriver` continua a sovrascriverlo |

  ### Poll e trasporto

  - `IHidDriver` tiene un `IHidTransport* _transport = nullptr` protetto; `bindTransport(t)` lo imposta; `poll(data, now)` chiama `loop(_transport, data, now)` solo se `_transport != nullptr`. `loop(IHidTransport*, ...)` resta nell'estensione con la firma di oggi, così i test che lo chiamano direttamente non cambiano.
  - L'host lega il trasporto subito dopo `DriverRegistry::create()` (`DriverDispatch::attach(_driver, this)`), prima di `setup()`. `USBHostUPS` è il trasporto e vive più a lungo del driver che possiede: nessun problema di durata.
  - Un driver Q* (US-136) riceverà il suo trasporto nel costruttore; il nucleo non nomina nessuno dei due.

  ### `DriverDispatch.h` (header-only, `lib/USBHostUPS/src/`)

  Funzioni `inline` in un `namespace DriverDispatch`, ognuna con `IUPSDriver*`/`const IUPSDriver*` che può essere `nullptr`. Con `hid() == nullptr` restituiscono il valore neutro senza chiamare nulla di HID:

  | Funzione | HID | `hid() == nullptr` |
  |---|---|---|
  | `hidOf(d)` | `d->hid()` | `nullptr` (anche con `d == nullptr`) |
  | `attach(d, IHidTransport*)` | `bindTransport` | niente |
  | `decode(d, t, id, type, data, len, ups)` | `decodeReport` poi `postDecode` | niente |
  | `parseString(d, t, idx, data, len, ups)` | `parseStringDescriptor` | niente |
  | `inputValuesPolled(d)` | `inputValuesPolled()` | `true`: il watchdog degli INPUT non rende stale e non chiede ripristini né riavvii (`InputWatchdog::setValuesPolled(true)`) |
  | `inputWatchdogActive(d, no_interrupt_pipe)` | `!quirk && !inputValuesPolled()` | `false` (export diagnostico) |
  | `requestLength(d, type, id, expected)` | `requestLength()` | `expected` |
  | `acceptDiagReport(d, type, id)` | `acceptDiagReport()` | `false` (nessuna richiesta) |
  | `invalidateReport(d, type, id)` | `invalidateReport()` | niente |
  | `planSet(d, data, usages, name, value, plan)` | `planSet()` | `SetStatus::UNKNOWN` |
  | `commandTable(d, n)` | `commandTable()` | `n = 0`, `nullptr` |
  | `beeperFieldRead(d, t)` | `beeperFieldRead()` | `false` |
  | `beeperControllable(d)` | `beeperControllable()` | `true` (come oggi con `_driver == nullptr`: il blocco resta solo per i driver che lo negano) |
  | `beeperMuteSupported(d)` | `beeperMuteSupported()` | `true` |
  | `applyDefaultDelays(d, ups, usages, saved)` | `NutTable::applyDefaultDelays(..., hid->delayPaths(), saved)` come oggi | `NutTable::applyDelayValues(ups, off, on, vars, vars, saved)` con `vars = delayVariablesSupported()` |

  `NutTable::applyDefaultDelays()` viene spezzata senza cambiare risultato: la parte che applica i valori salvati e scrive `ups.delay.shutdown`/`ups.delay.start` diventa `applyDelayValues(UPSData&, int32_t off, int32_t on, bool sd, bool st, const saved*)`; `applyDefaultDelays()` calcola `sd`/`st` dai percorsi e la chiama.

  ### Punti di chiamata in `USBHostUPS.cpp` (riferimenti alle righe attuali)

  - 360 `_in_wd.setValuesPolled(_driver->inputValuesPolled())` → `DriverDispatch::inputValuesPolled(_driver)`.
  - 385 `_driver->loop(this, _ups_data, now)` → `_driver->poll(_ups_data, now)`.
  - 549 dopo `DriverRegistry::create()` → `DriverDispatch::attach(_driver, this)` prima di `_driver->setup()`.
  - 655-657 e 912-913 → `DriverDispatch::decode(...)`.
  - 961 lambda della lettura diagnostica → `DriverDispatch::acceptDiagReport(drv, type, id)`.
  - 980, 1234, 1436 → `DriverDispatch::requestLength(...)`.
  - 1079 → `DriverDispatch::parseString(...)` (resta seguita da `_driver->formatDeviceStrings()`).
  - 1124, 1130, 1136, 1333, 1346 → `commandTable`, `beeperFieldRead`, `beeperControllable`, `beeperMuteSupported` di `DriverDispatch`.
  - 1196 `BeeperLogic::manipulateBeeperBuffer(..., _driver)` → `..., DriverDispatch::hidOf(_driver)`; il parametro di `manipulateBeeperBuffer` diventa `const IHidDriver*` (`test_beeper_logic` compila senza modifiche: passa `PowercomDriver*` e `nullptr`).
  - 1355-1357 → `DriverDispatch::applyDefaultDelays(_driver, _ups_data, _hid_parser.getUsages(), &_saved_vars)`.
  - 1398 → `DriverDispatch::planSet(...)`.
  - 1443 → `DriverDispatch::invalidateReport(...)`.
  - 1536 → `s.input_watchdog = DriverDispatch::inputWatchdogActive(_driver, _quirks & QUIRK_NO_INTERRUPT_PIPE)`.

  Restano dirette (nucleo): `setup`, `initialPollDone`, `formatDeviceStrings`, `requestSpacingMs`, `noteHostValue`, `noteDataChanged`, `control`, `shutdownCommandsSupported`, `setDriverSideValue`, `resetDriverSideValue`, `writableVariables`, `getDriverName`.

  ### Vincoli

  - Refactoring puro (ADR 0010): con un driver HID ogni chiamata arriva allo stesso metodo, con gli stessi argomenti e nello stesso ordine; nessun cambio di task, lock o tempi dello strato USB (ADR 0008). `DriverDispatch` non prende lock: i chiamanti mantengono quelli di oggi.
  - Nessun `if (qx)` né codice Q*; l'aggancio per famiglia è US-132.
  - `IUPSDriver.h` può continuare a includere `NutTable.h` (serve `NutTable::RWVariable`), ma il suo testo non nomina tipi HID: lo controlla un test sul sorgente.
  - Niente modifiche ai file con script Python inline: usare Edit/Write.

  ---

  ## Strategia di test

  Il comportamento HID è già coperto da test nativi, replay ed e2e: devono restare verdi con le stesse asserzioni. I test nuovi coprono il percorso senza estensione HID e il confine fra nucleo ed estensione.

  - **`test/test_driver_dispatch` (nuovo, nativo):** `SpyHidDriver : IHidDriver` registra ogni chiamata HID e del nucleo; una variante sovrascrive `hid()` per restituire `nullptr`. Con `hid() == nullptr`: sequenza dell'host (attach, `setup`, ritardi, `formatDeviceStrings`, `poll`, `initialPollDone`, `control()`) più tutte le funzioni di `DriverDispatch` → zero chiamate HID e i valori neutri della tabella; `InputWatchdog` con `setValuesPolled(DriverDispatch::inputValuesPolled(d))` dopo un periodo appreso e un silenzio lungo: `isStale()` falso e `tick()` sempre `NONE`. Con `hid() == this`: ogni funzione inoltra gli stessi argomenti; `attach` + `poll` arrivano a `loop()` con il trasporto legato; `decode` chiama `decodeReport` poi `postDecode`. Ritardi: driver neutro con `delayVariablesSupported()` vero → `ups.delay.*` ai default e al valore salvato; falso → assenti. Tutti i 9 driver HID: `d->hid() == d`.
  - **`test_hid_transport` (esteso, controllo dei sorgenti):** `IUPSDriver.h` non contiene `HIDUsageDef`, `HIDParser`, `IHidTransport`, `report_id`, `HidInfo` né i nomi dei metodi HID; `USBHostUPS.cpp` non contiene `_driver->` o `drv->` seguiti da un metodo HID; `IHidDriver.h` e `DriverDispatch.h` entrano nell'elenco dei file che non includono l'host USB.
  - **`test_nut_table`:** `applyDelayValues()` con e senza valori salvati e `applyDefaultDelays()` invariata.
  - **Regressione:** tutta la suite nativa (compresi `test_record_replay` e `test_poll_cycle`), `npm run e2e` (Playwright, nessuna modifica alla UI), build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`. Gli adattamenti consentiti nei test esistenti sono solo di tipo (`IUPSDriver&` → `IHidDriver&`, `->hid()->`), mai di asserzione.

  Nessuna superficie utente nuova: niente mockup, niente scenari e2e nuovi, niente video demo (la dimostrazione è il test nativo).

  ---

  _Piano generato con ARchetipo Planning — 2026-11-07_
tasks:
  - id: TASK-01
    title: Separare IUPSDriver nel nucleo neutro e creare l'estensione IHidDriver
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** `IUPSDriver` contiene solo il nucleo neutro più `poll()` e `hid()`; i metodi HID passano nella nuova `IHidDriver : public IUPSDriver`; `GenericDriver` eredita da `IHidDriver`.

      **Leggere:** `lib/USBHostUPS/src/IUPSDriver.h`, `IHidControlPort.h` (schema da imitare), `GenericDriver.h`/`.cpp`, `PowercomDriver.h`, `LegrandDriver.h`, `EcoFlowDriver.h`, `BeeperLogic.h`; sezioni "Nucleo", "Estensione", "Casi di confine" e "Poll e trasporto" del piano.

      **Modificare:**
      1. `IUPSDriver.h`: togliere `loop`, `decodeReport`, `postDecode`, `planSet`, `requestLength`, `acceptDiagReport`, `invalidateReport`, `inputValuesPolled`, `parseStringDescriptor`, `encodeBeeperValue`, `beeperControllable`, `beeperMuteSupported`, `beeperFieldRead`, `commandTable`, `delayPaths`, `delayAux` e la forward declaration `class IHidTransport;`. Aggiungere `virtual void poll(UPSData& data, uint32_t now) = 0;` e `class IHidDriver;` con `virtual IHidDriver* hid() { return nullptr; }` e `virtual const IHidDriver* hid() const { return nullptr; }`. Commenti e doc dei metodi rimasti invariati; nessun nome di tipo HID nel testo (anche nei commenti: per esempio il commento di `requestSpacingMs` non deve citare report).
      2. Nuovo `IHidDriver.h`: include `IUPSDriver.h`, `IHidTransport.h`, `HIDParser.h`, `NutTable.h`; dichiara i metodi tolti (stesse firme, default e commenti, `delayAux` escluso), `hid()` che restituisce `this` (due overload), `void bindTransport(IHidTransport* t) { _transport = t; }`, `void poll(UPSData& data, uint32_t now) override { if (_transport) loop(_transport, data, now); }`, membro protetto `IHidTransport* _transport = nullptr;`.
      3. `GenericDriver.h`: `class GenericDriver : public IHidDriver`, include `IHidDriver.h`; `delayAux()` diventa `virtual uint8_t delayAux() const { return 10; }` pubblica di `GenericDriver` (commento spostato). Gli `override` esistenti restano validi.
      4. `BeeperLogic.h`: include `IHidDriver.h` e il parametro di `manipulateBeeperBuffer` diventa `const IHidDriver* driver`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_generic_driver -f test_beeper_logic -f test_powercom_driver -f test_legrand_driver` (i test che usano `IUPSDriver&` per metodi HID si sistemano in TASK-02).

      **Fatto quando:** i driver compilano senza toccare i `.cpp` derivati, `IUPSDriver.h` non nomina tipi HID.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUPSDriver.h — nucleo neutro, `poll()`, `hid()`
      - lib/USBHostUPS/src/IHidDriver.h — nuovo, estensione HID con `bindTransport` e `poll()`
      - lib/USBHostUPS/src/GenericDriver.h — eredita da `IHidDriver`, ospita `delayAux()`
      - lib/USBHostUPS/src/BeeperLogic.h — parametro `const IHidDriver*`

      ## Criteri di Completamento
      - [ ] `IUPSDriver.h` contiene solo i metodi della tabella "Nucleo" del piano più `poll()` e `hid()`
      - [ ] `IHidDriver.h` contiene i metodi HID con firme e default di oggi, `bindTransport()` e `hid()` che restituisce `this`
      - [ ] `GenericDriver` eredita da `IHidDriver`; `PowercomDriver::delayAux()` sovrascrive ancora quello di `GenericDriver`
      - [ ] I test indicati in Verifica compilano e passano
    ref: TASK-01
  - id: TASK-02
    title: Adattare i tipi nei test nativi esistenti senza cambiare asserzioni
