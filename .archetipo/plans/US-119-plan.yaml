  - id: TASK-10
    title: Prova sul campo su ESP32-S3 + Eaton 3S (solo dopo un sì esplicito)
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Descrizione
      **Obiettivo:** verificare sul dispositivo reale che l'export contenga tutti i report FEATURE e che poll e NUT non ne risentano.

      **Leggere:** "Strategia di test" del piano; `docs/test-results/US-118/field.md` (procedura, script nello scratchpad `hw/`).

      **Modifiche:** nessuna nel codice. Evidenze in `docs/test-results/US-119/` (cartella ignorata da git).

      **Passi:** 1) chiedere il consenso esplicito prima di flashare o toccare la scheda; 2) export dalla pagina reale col firmware attuale (riferimento); 3) OTA del firmware US-119; 4) export dalla pagina reale: report FEATURE del descrittore tutti presenti tranne 254/255, `export_read` coerente, vuoti indicati; 5) durante la lettura `upsc` risponde; 6) System Log senza ERROR e con una sola riga `[USB] Export read`; 7) righe `[USB] Last 60 s` come prima.

      **Verifica:** evidenze salvate (due export, confronto dei report, output di `upsc`, System Log).

      **Blocchi:** senza consenso la prova non si fa e lo si riporta. Le credenziali della scheda non vanno mai stampate.

      ## File Coinvolti
      - docs/test-results/US-119/ — evidenze locali

      ## Criteri di Completamento
      - [ ] Consenso ottenuto prima della prova
      - [ ] Export con tutti i report FEATURE ammessi
      - [ ] NUT e poll non toccati, nessun ERROR
    ref: TASK-10
