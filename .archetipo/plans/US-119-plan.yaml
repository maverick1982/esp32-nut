      **Obiettivo:** chiudere la documentazione e verificare tutto prima della review.

      **Leggere:** sezione "Documentazione" del piano; `docs/adr/0008-non-blocking-hid-callbacks-and-control-pipe-recovery.md`.

      **Modifiche:** paragrafo in ADR 0008 sulla lettura su richiesta dell'export (task `ups_poll`, una richiesta alla volta con la spaziatura del poll, senza decodifica, ferma quando il collegamento non permette richieste). Niente note di rilascio.

      **Passi:** 1) ADR; 2) suite native complete a blocchi di circa 11 suite; 3) build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`; 4) dimensione di `firmware.bin` S3 contro 2.127.984 B di `main` e87bfe5, annotata per la PR; 5) e2e completa.

      **Verifica:** tutte le suite native verdi, tre build verdi, e2e completa verde.

      **Blocchi:** nessun commit o push senza conferma dell'utente; nella PR "Refs #123", mai "Closes".

