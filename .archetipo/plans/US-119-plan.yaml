  - id: TASK-04
    title: 'USBHostUPS: lettura su richiesta nel task di poll, con spaziatura e interruzione'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** eseguire la lettura su richiesta nel task `ups_poll`, intercalata al poll, senza toccare decodifica, cache e regole di ripristino.

      **Leggere:** sezione "Host `USBHostUPS`" del piano; in `lib/USBHostUPS/src/USBHostUPS.cpp` `service()` (~280), `requestReport()` (~726), `noteControlResult()` (~642), i punti dove si fa `_cached_reports.clear()` (~441, ~600); il commento sul modello dei thread in `USBHostUPS.h` (~34).

      **Modifiche:**
      - `USBHostUPS.h`: `bool requestDiagRead()`, `DiagReadStatus diagReadStatus() const` (stato e contatori), membri `DiagSweep _diag`, `std::atomic<bool> _diag_requested`, `uint32_t _last_ctrl_at`, `uint32_t _diag_last_at`; metodo privato `readReportRaw(...)`.
      - `noteControlResult()`: registra `_last_ctrl_at = now`.
      - `service()`: salto di `_driver->loop()` se `now - _diag_last_at < _driver->requestSpacingMs()` e la lettura è attiva; dopo `loop()`, avvio della lettura al flag (sotto `_mutex`) e un passo se `now - _last_ctrl_at >= requestSpacingMs()`; interruzione se `!_link.canPoll(now)`, `_restart_requested` o `_in_restart_pending`; una riga INFO finale.
      - `readReportRaw()`: trasferimento come `requestReport()`, statistiche GET e `noteControlResult()`, nessuna decodifica, nessuna cache, nessun log ERROR (vuoto → `Empty`, errore → `Failed` con al massimo `logDebug`).
      - `_diag.clear()` accanto ai due `_cached_reports.clear()`.

      **Passi:** 1) membri e firme; 2) `readReportRaw`; 3) integrazione in `service()`; 4) pulizia; 5) aggiornare il commento sul modello dei thread.

      **Verifica:** build `esp32-s3-standard`; suite native `test_usb_host`, `test_usb_host_interface`, `test_poll_cycle`, `test_link_monitor` verdi.

      **Blocchi:** nessun lock applicativo durante il trasferimento (ADR 0008); `_mutex` solo per leggere usages e cache e per scrivere i risultati. Se `service()` non permette di saltare `loop()` senza effetti sul primo full poll (`_first_data_ready`), fermarsi e segnalarlo.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — API, membri, commento sui thread
      - lib/USBHostUPS/src/USBHostUPS.cpp — `readReportRaw`, `service()`, `noteControlResult()`, pulizia

      ## Criteri di Completamento
      - [ ] La lettura gira solo nel task `ups_poll`, una richiesta per iterazione, con la spaziatura del driver rispetto a qualsiasi altra richiesta di controllo
      - [ ] Nessuna decodifica né scrittura in `_cached_reports` o `UPSData` per i report letti su richiesta
      - [ ] Report vuoto senza log ERROR; una sola riga INFO a fine lettura
      - [ ] Collegamento interrotto → stato `Interrupted` con i risultati già letti
      - [ ] Build S3 verde
    ref: TASK-04
