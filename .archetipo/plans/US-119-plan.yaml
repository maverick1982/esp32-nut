  - id: TASK-07
    title: API POST/GET /api/usb/dump/read e flusso dell'export nella pagina
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** permettere alla pagina di chiedere la lettura, seguirla e poi scaricare l'export.

      **Leggere:** sezioni "API web" e "Web UI" del piano; `src/network/web_config_server.cpp` (rotta `/api/usb/dump` ~124, `guarded()`); `lib/WebApi/src/WebApiJson.h/.cpp`; in `data/www/bundle.js` il gestore di `link-export-usb` (~746) e `apiFetch`.

      **Modifiche:**
      - `WebApiJson::diagReadJson(...)` pura, con un caso per stato in `test/test_web_api/test_main.cpp`.
      - Rotte `guarded()` `POST /api/usb/dump/read` (202 o 503 `{"error":"UPS not ready"}`) e `GET /api/usb/dump/read` (200, `Cache-Control: no-store`).
      - `bundle.js`: click con `preventDefault`, link disattivato durante la lettura, POST, GET ogni 500 ms fino a `done`/`interrupted` o 60 s, righe nel terminale, poi `window.location.href = '/api/usb/dump'`; con 503 o errore download immediato come oggi.
      - `python scripts/embed_web.py`.

      **Passi:** 1) JSON puro e test; 2) rotte; 3) pagina; 4) asset.

      **Verifica:** `pio test -e native -f test_web_api`; `npx playwright test e2e/logs-viewer.spec.ts` (i test esistenti restano verdi); build S3.

      **Blocchi:** `scripts/embed_web.py` va eseguito a mano. Le rotte nuove non vanno tra quelle pubbliche di `AuthPolicy`.

      ## File Coinvolti
      - lib/WebApi/src/WebApiJson.h — `diagReadJson`
      - lib/WebApi/src/WebApiJson.cpp — `diagReadJson`
      - test/test_web_api/test_main.cpp — casi nuovi
      - src/network/web_config_server.cpp — due rotte
      - data/www/bundle.js — flusso dell'export
      - data/www/index_inlined.html — rigenerato
      - include/network/web_assets.h — rigenerato
      - include/network/.web_assets.hash — rigenerato

      ## Criteri di Completamento
      - [ ] POST e GET di stato rispondono come nel piano, protette dal login
      - [ ] La pagina scarica l'export dopo la lettura, o subito senza UPS
      - [ ] Un secondo click durante la lettura non manda un'altra POST
    ref: TASK-07
