  # US-119: Export USB Diagnostics, leggere su richiesta tutti i report del descrittore — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-05
  **Branch:** `feature/us-119-us-120-report-reads` (da `main` e87bfe5), condiviso con US-120

  ---

  ## Spec

  **Epic:** EP-001 — Gestione USB Host
  **Priorità:** MEDIUM | **Punti:** 3 | **Bloccato da:** -

  **User Story**
  Come manutentore che riceve gli export degli utenti nelle issue di compatibilità, voglio che "Export USB Diagnostics" legga una volta, al momento dell'export, tutti i report Feature del descrittore, in modo che l'export contenga anche i report che il poll non chiede, e che continui a servire per trovare nuove mappature anche quando il poll leggerà solo quello che legge NUT (US-120).

  **Criteri di Accettazione**: vedi la spec US-119: lettura su richiesta dei report non in cache con la spaziatura del poll e senza bloccare NUT e web UI; esclusioni di `acceptPollReport()` mantenute; report vuoto indicato nell'export senza log ERROR; export parziale se il collegamento cade, ADR 0008 invariata; fixture e replay validi, suite nativa e tre build.

  Origine: issue #123 (APC BXR1200MI, report vendor 227 vuoto ogni 30 s). US-120 toglierà dal full poll i report senza righe; questa spec viene prima, perché gli export non perdano quei report.

  ---

  ## Soluzione tecnica

  Oggi `GET /api/usb/dump` scrive l'istantanea di `_cached_reports`, cioè solo quello che il poll ha letto. Le richieste USB sono bloccanti e girano nel task `ups_poll` (ADR 0008). Il loopTask serve sia NUT sia la web UI: una lettura di decine di report lì dentro (50 ms di spaziatura ciascuno, più eventuali timeout) li bloccherebbe per secondi. Per questo la lettura diventa **asincrona, in due tempi**: la pagina la chiede, il task di poll la esegue intercalata al poll, la pagina scarica l'export quando è finita.

  ### Core puro `lib/USBHostUPS/src/DiagSweep.h` (test nativi)

  Classe senza piattaforma che tiene lo stato della lettura su richiesta:
  - `start(const std::vector<HIDUsageDef>& usages, const std::set<uint16_t>& cached_keys, Accept accept)`: lista dei report **FEATURE** (`report_type == 3`) del descrittore, in ordine di prima comparsa e senza doppioni, compreso il report ID 0 per i dispositivi senza ID; esclude quelli già in cache (`(type << 8) | id`) e quelli che `accept(type, id)` rifiuta. Gli INPUT e gli OUTPUT non si leggono.
  - `next(PollItem& out)`: il prossimo report da chiedere; `record(uint8_t id, Result r, const uint8_t* data, size_t len)` con `Result { Read, Empty, Failed }`.
  - `interrupt()`: il collegamento non permette più richieste; `state()` → `Idle`, `Reading`, `Done`, `Interrupted`; contatori `total`, `done`, `read`, `empty`, `failed`.
  - `results()`: per ogni report letto i byte, per un report vuoto `data` vuoto e il flag `empty`, per un fallito nessun dato (viene solo contato).
  - `clear()`: nuovo dispositivo o disconnessione.

  ### Driver

  - `IUPSDriver::acceptDiagReport(uint8_t type, uint8_t id) const` (predefinito `true`) e `IUPSDriver::requestSpacingMs() const` (predefinito 50, come `GenericDriver::STEP_SPACING_MS`).
  - `GenericDriver` li implementa con `acceptPollReport()` e `stepSpacingMs()`. Così i report esclusi per sicurezza restano esclusi anche dall'export: CyberPower 6 e ≥ 130, Eaton 254 e 255. Nessuna modifica a `CyberPowerDriver` né a `EatonDriver`.

  ### Host `USBHostUPS`

  - **Richiesta (qualsiasi task):** `requestDiagRead()` alza un flag atomico. Restituisce false senza UPS pronto (`!_is_ready_to_poll` o nessun driver). Se una lettura è già in corso non la riavvia. `diagReadStatus()` copia stato e contatori sotto `_mutex`.
  - **Esecuzione (task `ups_poll`, in `service()`):**
    - Al flag: `DiagSweep::start()` sotto `_mutex` con `getUsages()`, le chiavi di `_cached_reports` e `_driver->acceptDiagReport`. I risultati della lettura precedente si cancellano.
    - Spaziatura: `noteControlResult()` registra `_last_ctrl_at` per ogni richiesta di controllo (poll, comandi, letture su richiesta). Un passo della lettura parte solo se `now - _last_ctrl_at >= _driver->requestSpacingMs()`. In più, se l'ultima richiesta è stata della lettura su richiesta (`_diag_last_at`) e non è passata la spaziatura, `_driver->loop()` salta quell'iterazione (≤ 50 ms di ritardo). Così fra due richieste c'è sempre la spaziatura del poll, e il poll ha la precedenza quando entrambi sono pronti: la lettura parte dopo `loop()`.
    - Un passo per iterazione con `readReportRaw()`. Se `!_link.canPoll(now)`, `_restart_requested` o `_in_restart_pending`, la lettura passa a `Interrupted` e si ferma. Le soglie e la scala di ripristino dell'ADR 0008 non cambiano, perché i risultati passano dallo stesso `noteControlResult()`.
    - Alla fine una sola riga INFO: `[USB] Export read: 41 reports, 39 read, 1 empty, 1 failed` (o `... interrupted after 12 of 41`).
  - **`readReportRaw(id, type, len, out)`:** `hid_class_request_get_report` come `requestReport()`, con `noteControlResult()` e le statistiche GET, ma **senza decodifica, senza `_cached_reports` e senza log ERROR**. Un report vuoto (0 byte) diventa `Empty` senza log; un errore diventa `Failed`, con al massimo un `logDebug`. Lunghezza: `_hid_parser.getExpectedLength(id, FEATURE)` passata da `_driver->requestLength()`, come il poll. Nessun lock applicativo durante il trasferimento (ADR 0008).
  - **Il poll normale non cambia:** i report letti su richiesta non vengono decodificati e non toccano `UPSData`, la cache del poll o le liste del driver.
  - **Pulizia:** `DiagSweep::clear()` dove oggi si svuota `_cached_reports` (claim e disconnessione).

  ### Export (`UsbDiagSnapshot`, `UsbDiagJson`)

  - `UsbDiagReport` riceve `bool on_demand` e `bool empty`. `snapshotUSBDiagnostics()` unisce `_cached_reports` e i risultati della lettura su richiesta (solo le chiavi assenti dalla cache) nell'ordine della chiave `(type << 8) | id`, che è l'ordine di oggi.
  - Formato di un report letto su richiesta: `{"id": 227, "type": 3, "data": [...], "on_demand": true}`; se vuoto `{"id": 227, "type": 3, "data": [], "on_demand": true, "empty": true}`. I report del poll restano byte per byte come oggi (nessuna chiave nuova). Il replay salta già i report con `data` vuoto (`FixtureReplayRunner.h`: `if (!rData.empty())`) e ignora le chiavi sconosciute: le fixture esistenti e i nuovi export restano compatibili.
  - Nuovo oggetto `"export_read"` dopo `"link"`: `{"state": "done", "requested": 41, "read": 39, "empty": 1, "failed": 1}`. `state` vale `done`, `interrupted`, `reading` (export scaricato prima della fine) o `not_requested` (export senza lettura, ad esempio da un client che chiama solo `GET /api/usb/dump`).

  ### API web (`WebConfigServer`, rotte `guarded()`)

  - `POST /api/usb/dump/read` → 202 `{"state":"reading","total":41,"done":0}`; 503 `{"error":"UPS not ready"}` senza UPS pronto. Body vuoto, nessun parametro.
  - `GET /api/usb/dump/read` → 200 `{"state":"idle|reading|done|interrupted","total","done","read","empty","failed"}` con `Cache-Control: no-store`.
  - `GET /api/usb/dump` invariato come rotta e come scrittura a pezzi (US-096); aggiunge solo i campi sopra.
  - Il JSON di stato si costruisce in una funzione pura di `WebApiJson` (`diagReadJson`), testata in nativo.

  ### Web UI (`data/www/bundle.js`, senza mockup)

  Il link `#link-export-usb` resta dov'è, con lo stesso testo. Al click (`preventDefault`):
  1. riga nel terminale `Reading USB reports for the export...`;
  2. `POST /api/usb/dump/read`;
  3. `GET /api/usb/dump/read` ogni 500 ms, finché lo stato è `done` o `interrupted`, oppure fino a un tetto di 60 s;
  4. riga di esito (`Read 41 USB reports (1 empty, 1 failed)` o `USB link interrupted: export with the reports read so far`), poi `Downloading USB diagnostics...` e `window.location.href = '/api/usb/dump'`.

  Se la POST risponde 503 o fallisce, si scarica subito come oggi. Un 401 segue il percorso di `apiFetch` (login). Il link è disattivato durante la lettura, così un secondo click non parte.

  ### Documentazione

  ADR 0008, sezione sul task di poll: la lettura su richiesta dell'export gira nel task `ups_poll`, una richiesta alla volta con la spaziatura del poll, senza decodifica, e si ferma quando il collegamento non permette richieste. ADR 0006 la aggiorna US-120. Le note di rilascio non fanno parte di questa spec.

  ### Assunzioni

  - "Il firmware legge i report che non ha in cache o che il poll non legge": si leggono i report FEATURE assenti dalla cache. Un report in cache viene dal poll e c'è già; dopo US-120 resteranno in cache solo quelli che il poll legge.
  - Gli INPUT senza gemello FEATURE non si leggono su richiesta: arrivano dall'endpoint interrupt e, se il poll li chiede, sono già in cache.
  - La lettura su richiesta non usa `_op_mutex` dall'esterno: gira dentro `service()`, che lo tiene già.

  ---

  ## Strategia di test

  La logica (lista, esclusioni, stati, contatori, formato) sta in codice puro, coperto da Unity nativi. L'integrazione con il trasferimento USB e la spaziatura si verificano con le build e con la prova sul campo; la pagina con Playwright e i mock di `e2e/support/webui.ts`.

  - `test/test_diag_sweep` (nuova): solo FEATURE, ordine di prima comparsa, nessun doppione, report ID 0 incluso; esclusione delle chiavi in cache; esclusione da `accept` (predicato con le regole CyberPower 6 e ≥ 130, Eaton 254/255); risultati `Read`/`Empty`/`Failed` e contatori; `interrupt()` a metà che lascia i letti; `start()` di nuovo che cancella i risultati; `clear()`; descrittore senza FEATURE → `Done` subito con `total` 0.
  - `test/test_usb_diag_json` (casi nuovi): istantanea senza lettura uguale byte per byte a oggi, a parte `"export_read": {"state": "not_requested", ...}`; report su richiesta con `on_demand`; report vuoto con `data: []` ed `empty`; ordine unito per chiave; stato `interrupted`.
  - `test/test_web_api` (casi nuovi): `diagReadJson` per ogni stato.
  - `test/test_record_replay` (caso nuovo): una fixture minima con un report `"data": [], "empty": true, "on_demand": true` passa dal runner senza errori e senza decodifica di quel report. Tutte le fixture esistenti restano verdi.
  - Driver: `acceptDiagReport` di `CyberPowerDriver` ed `EatonDriver` uguale a `acceptPollReport` (in `test_cyberpower_driver` e `test_eaton_driver`).
  - Comando nativo: `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_diag_sweep -f test_usb_diag_json -f test_web_api -f test_record_replay`, poi la suite completa a blocchi di circa 11 suite (limite 600 s).
  - Build: `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`; dimensione di `firmware.bin` S3 confrontata con `main` e87bfe5 (2.127.984 B).
  - Prova sul campo su ESP32-S3 + Eaton 3S, **solo dopo un sì esplicito dell'utente**: export dalla pagina reale prima e dopo; tutti i report FEATURE del descrittore presenti tranne 254/255; NUT che risponde durante la lettura; nessun ERROR nel System Log; il poll come prima (righe `[USB] Last 60 s`).

  ### Test E2E — Simulazione utente

  **Framework:** Playwright (`e2e/logs-viewer.spec.ts`, mock con `serveIndex` di `e2e/support/webui.ts` e `page.route` per `**/api/usb/dump/read` e `**/api/usb/dump`)
  **Video demo:** non previsto (la registrazione è disattivata in configurazione; la `Dimostrazione` è filmabile ma l'esito sta nel file scaricato)

  | Scenario | Flusso utente |
  |---|---|
  | Lettura e download | L'utente apre System Logs e clicca "Export USB Diagnostics": parte la POST, le GET di stato passano da `reading` (`done` 10 di 41) a `done`, il terminale mostra la riga di lettura e l'esito con vuoti e falliti, poi parte la richiesta di `/api/usb/dump` |
  | Collegamento interrotto | Lo stato finisce `interrupted`: il terminale lo dice e il download parte lo stesso |
  | Senza UPS | La POST risponde 503: il download parte subito, come oggi |
  | Doppio click | Durante la lettura un secondo click non manda un'altra POST |
  | Sessione scaduta | La POST risponde 401: la pagina va al login |
  | Regressione | Il test esistente "should trigger USB diagnostics download" e il resto di `e2e/logs-viewer.spec.ts` restano verdi |

  ---

  _Piano generato con ARchetipo Planning — 2026-11-05_
tasks:
