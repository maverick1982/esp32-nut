    title: 'Core puro DiagSweep: lista dei report FEATURE, stati e risultati della lettura su richiesta'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** avere lo stato della lettura su richiesta in codice puro, testabile in nativo.

      **Leggere:** sezione "Core puro `lib/USBHostUPS/src/DiagSweep.h`" del piano; `GenericDriver::buildPollLists` in `lib/USBHostUPS/src/GenericDriver.cpp` (ordine di prima comparsa, report ID 0); `PollItem` e `HIDUsageDef` (header già inclusi da GenericDriver).

      **Modifiche:** creare `lib/USBHostUPS/src/DiagSweep.h` (eventuale `.cpp`) con `start(usages, cached_keys, accept)`, `next()`, `record()`, `interrupt()`, `clear()`, `state()`, contatori e `results()` come descritto nel piano. `Accept` è una `std::function<bool(uint8_t, uint8_t)>` o un template: nessuna dipendenza da `IUPSDriver`.

      **Passi:** 1) tipi `State` e `Result`; 2) `start()` con filtro FEATURE, cache e `accept`; 3) passi e risultati; 4) commenti in inglese che citano US-119 e #123.

      **Verifica:** compila con la suite del TASK-02.

      **Blocchi:** niente `Arduino.h` oltre a quanto già usano gli header puri della libreria; niente chiamate USB.

      ## File Coinvolti
      - lib/USBHostUPS/src/DiagSweep.h — nuovo

      ## Criteri di Completamento
      - [ ] La lista contiene solo i report FEATURE non in cache e accettati, senza doppioni, nell'ordine del descrittore
      - [ ] Stati e contatori coerenti anche dopo `interrupt()` e un nuovo `start()`
      - [ ] Nessuna dipendenza di piattaforma
