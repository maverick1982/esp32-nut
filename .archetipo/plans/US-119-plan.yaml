      **Modifiche:** in `IUPSDriver` aggiungere `virtual bool acceptDiagReport(uint8_t report_type, uint8_t report_id) const { return true; }` e `virtual uint32_t requestSpacingMs() const { return 50; }` con commento; in `GenericDriver` le due override pubbliche che restituiscono `acceptPollReport()` e `stepSpacingMs()`. Aggiungere a `test/test_cyberpower_driver` e `test/test_eaton_driver` un caso che confronta `acceptDiagReport` con le esclusioni note (CyberPower 6 e 130, Eaton 254 e 255, un ID ammesso).

      **Passi:** 1) interfaccia; 2) GenericDriver; 3) test dei driver.

      **Verifica:** `pio test -e native -f test_cyberpower_driver -f test_eaton_driver -f test_generic_driver` (con il PATH di mingw).

      **Blocchi:** non cambiare `acceptPollReport` né i driver concreti.

      ## File Coinvolti
