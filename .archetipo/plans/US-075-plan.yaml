      **Verifica:** i passi 1-3 verdi; il passo 4 fatto o esplicitamente saltato dall'utente.

      **Fatto:** numeri annotati nella review, bozza pronta.

      **Blocchi:** una regressione Eaton blocca la chiusura: torna al TASK-05.

      ## File Coinvolti
