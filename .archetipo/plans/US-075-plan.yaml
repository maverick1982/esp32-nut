      3. **`setup()`:** solo `GenericDriver::setup()`, che azzera già `_nut_ctx` (e quindi `_nut_ctx.cps`) con `_nut_ctx = NutTable::Context()`.
      4. **`kSupersededGenericPaths`:** l'elenco della sezione 4 del piano, copiato carattere per carattere da `GenericDriver::decodeReport()`, raggruppato per chiave come in Eaton. In fondo un commento con le estensioni che restano: `ups.mfr.date`, `battery.capacity`, `battery.temperature`.
      5. **Commento in testa:** tutto da `cpsHid2Nut()` (US-075, ADR 0011). Restano qui quirk, ritardi, scala PID 0501 e layout vendor; `cps_fix_report_desc` non serve (motivo di oggi).
