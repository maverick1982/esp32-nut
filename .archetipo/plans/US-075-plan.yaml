  - id: TASK-05
    title: 'GenericDriver: stima di ups.realpower solo con riga leggibile, ricalcolo sul nominale, hook requestTableStrings'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** adattare la base ai driver la cui tabella lega righe che il driver non legge mai.

      **Leggi:** `lib/USBHostUPS/src/GenericDriver.h` / `.cpp`: `bindNutTable`, `publishRow`, `collectStringRequests`, `readsActivePower`, `acceptPollReport`.

      **Modifica:**
      1. `bindNutTable()`: `_nut_has_realpower` vale vero solo se una riga `ups.realpower` legata ha l'usage (`b.idx`) o il gemello (`b.twin_idx`) con `report_type == 1`, oppure `report_type == 3 && acceptPollReport(3, report_id)`. Commento: le righe legate in report mai letti (CyberPower, issue #40) lasciano la stima.
      2. `publishRow()`: senza `_nut_has_realpower`, chiama `ups_data.updateRealPower()` dopo aver scritto `ups.load`, `ups.power.nominal` o `ups.realpower.nominal` (oggi solo `ups.load`). Il ramo Eaton (`EatonComputeRealpower`) resta identico.
      3. `virtual bool requestTableStrings(IHidTransport* host) const { return true; }` nella sezione protetta, con commento. In `collectStringRequests()` il ciclo sulle righe `StringId` gira solo se `requestTableStrings(host)`.
      4. Se `readsActivePower()` non ha più chiamanti dopo il TASK-06, toglilo lì; per ora resta.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_generic_driver -f test_eaton_driver -f test_poll_cycle -f test_nut_table` verde. Il replay Eaton 3S/5P non deve cambiare: `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_record_replay` può fallire solo sui casi CyberPower.

      **Fatto:** Eaton e Generic invariati, nuovo hook disponibile.

      **Blocchi:** se un test Eaton cambia, fermati: la regola di `_nut_has_realpower` deve dare vero per la riga 2087.

      ## File Coinvolti
      - lib/USBHostUPS/src/GenericDriver.h — hook `requestTableStrings`
      - lib/USBHostUPS/src/GenericDriver.cpp — `bindNutTable`, `publishRow`, `collectStringRequests`

      ## Criteri di Completamento
      - [ ] Le quattro suite indicate verdi
      - [ ] Replay Eaton invariato
