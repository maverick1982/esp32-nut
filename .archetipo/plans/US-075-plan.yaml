    body: |-
      ## Descrizione
      **Obiettivo:** dimostrare che i comandi CyberPower dalla tabella coincidono con quelli di oggi.

      **Leggi:**
      - `test/test_command_catalog/test_main.cpp` (i test US-074 con `mgeHid2Nut()` come modello);
      - `lib/USBHostUPS/src/CommandCatalog.h` (`cmdField`, `buildFromTable`, `resolveShutdownSteps`).

      **Modifica:** test nuovi:
      1. Per CP1350C, CP1500EPFCLCD, CP1600EPFCLCD e UT850EG: `build(..., cpsHid2Nut)` dà gli stessi nomi di `build(...)` senza tabella, con `beeper_available` vero e poi falso.
      2. `resolveShutdownSteps` con la tabella su CP1500EPFCLCD per `load.off`, `load.on`, `load.off.delay` (con e senza parametro), `load.on.delay`, `shutdown.stop`, `shutdown.return`, `shutdown.stayoff`: stessi campi e valori del ramo senza tabella, con ritardi 60/120.
      3. `resolveWrite` di `beeper.mute` → `UPS.PowerSummary.AudibleAlarmControl` con valore 3; `test.battery.start.deep` → `UPS.Output.Test` con valore 2.
      4. Un descriptor sintetico con `UPS.PowerSummary.AudibleAlarmControl` FEATURE non elenca `beeper.on` né `beeper.off`.
      5. `shutdown.reboot` è elencato con `UPS.Output.DelayBeforeReboot` FEATURE (valore 10 dalla riga 432) e non lo è con il solo `UPS.PowerSummary.DelayBeforeReboot`. Quest'ultima è una differenza dal ramo senza tabella: scrivila nel commento con la riga upstream.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_command_catalog` verde.

      **Fatto:** casi 1-5 verdi.

