      ## Descrizione
      **Obiettivo:** chiudere con suite completa, build e verifica che l'Eaton non cambi.

      **Leggi:** `scripts/nut_snapshot.py`; la memoria del progetto per i gotcha (suite nativa a blocchi, build da PowerShell).

