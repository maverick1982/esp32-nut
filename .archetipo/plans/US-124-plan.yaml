  - id: TASK-08
    title: Suite completa e prova sull'Eaton 3S (con consenso)
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
      - TASK-04
      - TASK-05
      - TASK-06
      - TASK-07
    body: |-
      ## Descrizione
      **Obiettivo:** regressione completa e dimostrazione della spec sull'hardware.

      **Passi:**
      1. `pio test -e native` completo (su Windows rilanciare da sole le suite ERRORED transitorie), build degli env S3 e P4, suite e2e completa. Salvare gli esiti in `docs/test-results/US-124/`.
      2. **Prova sul campo, solo dopo un sì esplicito dell'utente** (le prove sull'UPS reale le fa Claude): OTA della build sulla scheda di test (credenziali dal file JSON della scheda, mai stampato). Annotare l'uptime (`/api/system-status`). Avviare un `upsc` in loop o un client connesso. Cambiare la password NUT dalla pagina e premere Save Credentials. Verificare che la pagina resti collegata e l'uptime non si azzeri; il client viene scollegato e si ricollega; `upscmd` con la vecchia password → `ERR ACCESS-DENIED`, con la nuova esegue (per esempio `beeper.disable`/`beeper.enable`). Cambiare il nome UPS e verificare `upsc <nuovo>@host` e l'errore sul vecchio. Un secondo salvataggio con gli stessi valori non scollega il client. Controllare nel System Log la riga `[NUT] Settings applied ...` col conteggio e l'assenza della password. Riavviare la scheda e verificare che resti la configurazione salvata. Rimettere la password originale alla fine.
      3. Riportare l'esito in `docs/test-results/US-124/field.md`.

      **Blocchi:** senza il consenso alla prova sul campo il punto 2 resta da fare e va segnalato in review.

      ## File Coinvolti
      - docs/test-results/US-124/ — esiti di nativi, build, e2e e prova sul campo

      ## Criteri di Completamento
      - [ ] Nativi, build S3/P4 ed e2e verdi
      - [ ] Prova sull'Eaton 3S fatta dopo il consenso, oppure segnalata come mancante
      - [ ] Uptime invariato dopo il salvataggio, vecchia password rifiutata, nuova accettata
    ref: TASK-08
