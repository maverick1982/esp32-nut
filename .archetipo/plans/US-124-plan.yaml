schema: archetipo/plan/v2
spec_code: US-124
body: |-
  ## Soluzione Tecnica

  Oggi `handleNutConfig()` salva e imposta `should_restart` perché `NUTServer` legge `NUTServerConfig` solo in `begin()`. La soluzione aggiunge al server un'applicazione a caldo, chiamata dalla Web UI nello stesso task del loop principale (server NUT e web server girano entrambi in `loop()`, quindi niente lock).

  - **`NUTServer::applyConfig(const NUTServerConfig&)`** (`lib/NUTServer`): normalizza il nome UPS con `normalizeUpsName()` come `begin()`, confronta username, password e nome normalizzato con `_config`. Senza differenze non tocca niente e restituisce `changed=false, closed=0`. Con differenze sostituisce `_config` e chiude tutte le sessioni con `closeAllSessions(CloseReason::ConfigChanged)`, così nessun client resta autenticato (o in `LOGIN`) con le credenziali precedenti. Il risultato è una struct `NutApplyResult { bool changed; unsigned closed; }`.
  - **Log**: una sola riga del server NUT via `_log_cb`: con cambi `INFO [NUT] Settings applied (UPS name "<nome>"): N NUT clients disconnected`, senza cambi `INFO [NUT] Settings unchanged: NUT clients stay connected`. Username e password non compaiono mai. `closeAllSessions()` con `ConfigChanged` non scrive la propria riga (come oggi fa solo `LinkChanged`) e restituisce il numero di sessioni chiuse (`unsigned`); il chiamante US-127 in `main.cpp` ignora il valore.
  - **Prima di `begin()`** (AP senza configurazione valida, server non avviato): `applyConfig()` aggiorna solo `_config` (nessuna sessione aperta). Il `begin()` successivo rilegge comunque la configurazione salvata.
  - **Web**: `WebConfigServer::setNutServer(NUTServer*)`, chiamato in `setup()` accanto a `setNutOverrides()`. `handleNutConfig()` mantiene identiche validazione e 400 (US-082, `checkNutConfigBody`). Salva, e solo se `config_mgr.save()` riesce chiama `applyConfig()` e risponde 200 con `WebApiJson::nutConfigAppliedJson(result)` = `{"success":true,"applied":true,"restart":false,"changed":bool,"sessions_closed":N}`. Niente più `should_restart`/`restart_request_time` per questa rotta. Su errore di salvataggio resta il 500 e non si applica niente. Con `nut_server` nullo (non dovrebbe capitare) si risponde comunque `applied:false, restart:false` e vale la config salvata al prossimo avvio. La riga `[WEB] NUT configuration updated` diventa `[WEB] NUT configuration saved`.
  - **Pagina NUT Server** (`data/www`): dopo `Saved!` un paragrafo di stato `#nut-status` (aria-live) dice `Applied now, no restart. N NUT clients disconnected: they reconnect with the new settings.` oppure, con `changed:false`, `No changes: NUT clients stay connected.`. Sotto il form una nota fissa nello stile di `#hostname-help` spiega che le modifiche valgono subito senza riavvio. Solo testo, nessun nuovo layout: niente mockup. Asset rigenerati con `python scripts/embed_web.py`.
  - **Documentazione**: README EN/IT (riga "saving restarts the board" / "il salvataggio riavvia la scheda") e una frase in `docs/concepts/architecture.md`. Il manuale utente non si modifica (decisione dell'utente, 2026-11-13). Le note di rilascio non fanno parte del piano: si scrivono prima della release.

  **Fuori ambito:** Wi-Fi (riavvio necessario), hostname (DHCP), campi facoltativi e password conservata (US-125).

  ---

  ## Strategia di Test

  Il comportamento sta quasi tutto in `NUTServer`, che è già testabile in nativo con `processCommand()` e `openSession()`. La rotta web non gira in nativo: si testa l'helper della risposta in `test_web_api` e il comportamento della pagina con Playwright. Chiude una prova sull'Eaton 3S.

  - **Nativi `test_nut_server`**: stessi valori → `changed=false`, sessioni intatte, riga "unchanged". Password cambiata → tutte le sessioni chiuse, slot liberi, riga con il conteggio. Un client autenticato col vecchio login, dopo la riconnessione, riceve `ERR ACCESS-DENIED` alla vecchia password e `OK` alla nuova, poi `INSTCMD` passa solo con la nuova. Nome UPS cambiato → `LIST UPS` e `GET VAR` col nuovo nome, il vecchio dà `ERR UNKNOWN-UPS`. Nome vuoto → normalizzato a `ups` e uguale a `ups` salvato (nessun cambio). Nessuna riga di log contiene la password. `applyConfig()` prima di `begin()`. `LinkChanged` continua a loggare come prima.
  - **Nativi `test_web_api`**: `nutConfigAppliedJson()` per `changed` vero/falso e conteggi 0/N. `test_nut_config_body_check` resta verde (400 invariati).
  - **Build** dei due env firmware (S3 e P4) e suite nativa completa.
  - **Prova sul campo** sull'Eaton 3S, solo dopo un sì esplicito dell'utente: la dimostrazione della spec.

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (`playwright.config.ts`, `e2e/support/webui.ts`, API simulate con `page.route`)
  **Video demo:** in parte filmabile (la pagina che resta collegata e il messaggio "applied, no restart"); la parte `upsc`/`upscmd` è da terminale. Decide `archetipo-review`.

  | Scenario | Flusso utente |
  |---|---|
  | Cambio password applicato | L'utente apre NUT Server, cambia la password, preme Save Credentials. L'API risponde `changed:true, sessions_closed:2`: vede `Saved!` e il messaggio "Applied now, no restart. 2 NUT clients disconnected...". Nessun "Restarting", nessun alert di riavvio. |
  | Salvataggio senza cambi | Stessi valori, risposta `changed:false, sessions_closed:0`: vede "No changes: NUT clients stay connected." |
  | Nome UPS non valido | Un 400 `Invalid UPS name` dell'API (validazione invariata) mostra l'errore e nessun messaggio di applicazione. |
  | Nota della pagina | La nota sotto il form dice che le modifiche valgono subito senza riavvio e non contiene "restart" come azione futura. |

  _Piano generato con ARchetipo Planning — 2026-11-13_
tasks:
  - id: TASK-01
    title: NUTServer::applyConfig() con chiusura delle sessioni
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** applicare a caldo nome UPS e credenziali NUT, chiudendo tutte le sessioni solo se qualcosa cambia.

      **Leggere:** `lib/NUTServer/src/NUTServer.h` (begin, CloseReason, closeAllSessions, setLogCallback), `lib/NUTServer/src/NUTServer.cpp` righe ~265-390 (begin, openSession, closeSession, closeAllSessions) e il comando PASSWORD (~560).

      **Modifiche:**
      1. In `NUTServer.h` aggiungere `struct NutApplyResult { bool changed; unsigned closed; };` e il metodo pubblico `NutApplyResult applyConfig(const NUTServerConfig& config);` con un commento (US-124).
      2. Aggiungere `ConfigChanged` a `enum class CloseReason` con il commento: una riga di riepilogo la scrive `applyConfig()`.
      3. Cambiare `void closeAllSessions(CloseReason)` in `unsigned closeAllSessions(CloseReason)` che restituisce le sessioni chiuse. Il log resta solo per `LinkChanged`.
      4. In `NUTServer.cpp` implementare `applyConfig()`: `String name = normalizeUpsName(config.ups_name)`. Se `config.username == _config.username && config.password == _config.password && name == _config.ups_name`, scrivere `log("INFO", "[NUT] Settings unchanged: NUT clients stay connected")` e restituire `{false, 0}`. Altrimenti assegnare `_config = config; _config.ups_name = name;`, `unsigned closed = closeAllSessions(CloseReason::ConfigChanged);`, `log("INFO", "[NUT] Settings applied (UPS name \"%s\"): %u NUT clients disconnected", name.c_str(), closed)` e restituire `{true, closed}`.
      5. Non loggare mai username o password. Non toccare la tabella TRACKING (è condivisa, come in upsd).

      **Verifica:** `pio test -e native -f test_nut_server` compila (i test nuovi arrivano in TASK-02).

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/NUTServer/src/NUTServer.h — NutApplyResult, applyConfig(), CloseReason::ConfigChanged, closeAllSessions() unsigned
      - lib/NUTServer/src/NUTServer.cpp — implementazione di applyConfig() e del valore di ritorno di closeAllSessions()

      ## Criteri di Completamento
      - [ ] applyConfig() normalizza il nome UPS come begin()
      - [ ] Con gli stessi valori non chiude sessioni e restituisce changed=false
      - [ ] Con un valore diverso sostituisce la config e chiude tutte le sessioni, una sola riga di log col conteggio
      - [ ] Nessuna riga di log contiene username o password
      - [ ] closeAllSessions() restituisce il numero di sessioni chiuse e logga ancora solo per LinkChanged
    ref: TASK-01
  - id: TASK-02
    title: Test nativi dell'applicazione a caldo nel server NUT
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** coprire in nativo tutti i casi di `applyConfig()`.

      **Leggere:** `test/test_nut_server/test_main.cpp`: setUp (~135), test_auth_flow (~196), openClients/request/logLines e i test US-127 `test_link_change_*` (~2056).

      **Test da aggiungere (con RUN_TEST in main):**
      1. `test_apply_same_config_keeps_sessions`: 2 client aperti e autenticati, applyConfig con gli stessi valori → changed=false, closed=0, gli slot restano attivi (un comando su ciascuno risponde), log `INFO [NUT] Settings unchanged: NUT clients stay connected`.
      2. `test_apply_new_password_closes_all_sessions`: 3 client → changed=true, closed=3, tutti gli slot liberi (openSession restituisce 0..7), log `INFO [NUT] Settings applied (UPS name "testups"): 3 NUT clients disconnected`.
      3. `test_old_password_denied_after_apply`: client autenticato con `admin/secret`, apply con password `newpass`, riapertura della sessione: `USERNAME admin` + `PASSWORD secret` → `ERR ACCESS-DENIED`; `PASSWORD newpass` → `OK`; un `INSTCMD` passa solo dopo la nuova password.
      4. `test_apply_new_ups_name`: apply con nome `newups` → `LIST UPS` mostra `UPS newups`, `GET VAR newups battery.charge` risponde, `GET VAR testups ...` → `ERR UNKNOWN-UPS`.
      5. `test_apply_normalizes_ups_name`: con il nome salvato `ups`, apply con nome vuoto → changed=false (normalizzato a `ups`).
      6. `test_apply_log_never_contains_password`: nessuna riga di logLines contiene la vecchia o la nuova password.
      7. `test_apply_before_begin`: su un NUTServer non avviato applyConfig non va in crash e restituisce closed=0.
      8. Verificare che `test_link_change_*` restino invariati (closeAllSessions ora restituisce il conteggio: aggiungere un assert sul valore).

      **Verifica:** `pio test -e native -f test_nut_server`, tutti verdi. Mutazione rapida: togliere la chiusura delle sessioni in applyConfig deve far fallire i test 2-3.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_nut_server/test_main.cpp — nuovi test di applyConfig() e assert sul ritorno di closeAllSessions()

      ## Criteri di Completamento
      - [ ] I 7 test nuovi passano e sono registrati con RUN_TEST
      - [ ] Il caso vecchia password dopo l'applicazione restituisce ERR ACCESS-DENIED
      - [ ] Il cambio nome dà ERR UNKNOWN-UPS sul nome vecchio
      - [ ] I test US-127 sul cambio di link passano ancora
    ref: TASK-02
