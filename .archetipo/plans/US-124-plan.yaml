  - id: TASK-04
    title: handleNutConfig applica la configurazione senza riavvio
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** la rotta salva e applica subito, senza `should_restart`.

      **Leggere:** `src/network/web_config_server.cpp` handleNutConfig (~661-702) e setNutOverrides; `include/network/web_config_server.h` (setter e membri ~50-100); `src/core/main.cpp` (~242 setNutOverrides, ~318-331 begin del server NUT).

      **Modifiche:**
      1. `web_config_server.h`: includere `NUTServer.h`, aggiungere `void setNutServer(NUTServer* server);` con il commento (US-124: stesso task del loop, nessun lock) e il membro `NUTServer* nut_server = nullptr;`.
      2. `web_config_server.cpp`: implementare il setter. In handleNutConfig lasciare identici il controllo JSON, `checkNutConfigBody` e l'aggiornamento di `nc`. Se `config_mgr.save()` riesce: se `nut_server` è valido, `NutApplyResult r = nut_server->applyConfig({nc.username, nc.password, nc.ups_name});` e rispondere 200 con `WebApiJson::nutConfigAppliedJson(true, r.changed, r.closed)`; altrimenti `nutConfigAppliedJson(false, false, 0)`. Log `AppLogger::log("INFO", "[WEB] NUT configuration saved")` prima della chiamata ad applyConfig, così il riepilogo [NUT] lo segue. Togliere `should_restart = true` e `restart_request_time = millis()` da questa rotta (le altre rotte non cambiano). Se il salvataggio fallisce resta il 500 e non si applica niente.
      3. `main.cpp`: `web_server.setNutServer(&nut_server);` accanto a `setNutOverrides()`.

      **Verifica:** `pio run -e esp32-s3-devkitc-1` (oppure l'env S3 di platformio.ini) e l'env P4 compilano; `grep should_restart` mostra che handleNutConfig non lo usa più.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - include/network/web_config_server.h — setNutServer() e membro nut_server
      - src/network/web_config_server.cpp — handleNutConfig senza riavvio, applicazione e nuova risposta
      - src/core/main.cpp — collegamento web_server.setNutServer(&nut_server)

      ## Criteri di Completamento
      - [ ] POST /api/nut/config non imposta più should_restart
      - [ ] La risposta 200 è quella di nutConfigAppliedJson()
      - [ ] Validazione e 400 invariati; con salvataggio fallito 500 e nessuna applicazione
      - [ ] Build S3 e P4 ok
    ref: TASK-04
  - id: TASK-05
    title: 'Pagina NUT Server: messaggio di applicazione senza riavvio'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** la pagina dice che le impostazioni sono applicate subito, senza riavvio.

      **Leggere:** `data/www/index.html` (~507-545, form `#nut-form` e la nota `#hostname-help` come stile), `data/www/bundle.js` (~324-375, submit del form NUT).

      **Modifiche:**
      1. `index.html`: sotto `#nut-form` aggiungere `<p class="auth-fineprint" id="nut-status" aria-live="polite" hidden></p>` e una nota fissa `<p class="auth-fineprint" id="nut-help">Changes apply at once, with no restart. Connected NUT clients are disconnected and reconnect with the new settings.</p>`.
      2. `bundle.js`: alla risposta ok leggere il JSON. Con `changed` vero mostrare in `#nut-status` `Applied now, no restart. N NUT clients disconnected: they reconnect with the new settings.` (singolare per 1, frase senza conteggio per 0). Con `changed` falso: `No changes: NUT clients stay connected.`. Con `applied` falso: `Saved. The NUT server uses these settings at the next start.`. Nascondere `#nut-status` a ogni nuovo invio e in caso di errore. Il comportamento di `Saved!` sul pulsante resta.
      3. Rigenerare gli asset: `python scripts/embed_web.py` (index_inlined.html e gli header embedded).

      **Verifica:** gli e2e esistenti di `e2e/nut_config.spec.ts` passano ancora; controllo visivo con serveIndex.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - data/www/index.html — #nut-status e nota #nut-help
      - data/www/bundle.js — gestione della risposta applied/changed/sessions_closed
      - data/www/index_inlined.html e asset embedded — rigenerati con scripts/embed_web.py

      ## Criteri di Completamento
      - [ ] Dopo il salvataggio la pagina mostra il messaggio di applicazione senza riavvio
      - [ ] Con changed:false mostra che i client restano collegati
      - [ ] Nessun testo della pagina NUT annuncia un riavvio
      - [ ] Asset rigenerati
    ref: TASK-05
  - id: TASK-06
