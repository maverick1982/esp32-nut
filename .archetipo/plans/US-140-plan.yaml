  - id: TASK-03
    title: 'USBHostUPS: identità al claim, valori conservati al distacco, esito del claim'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** collegare la finestra al ciclo di vita dell'interfaccia: identità dell'UPS, distacco senza azzerare i valori, claim che li tiene o li scarta.

      **Leggere:** sezione 2 della soluzione tecnica; in `lib/USBHostUPS/src/USBHostUPS.cpp` `handleEvent()`, `claimInterface()`, `handleDisconnected()`, `releaseBoundState()`, `claimQxInterface()`, `attachQxDriver()`, `populateStringsFromDeviceInfo()`; `lib/USBHostUPS/src/USBHostUPS.h` (membri e dichiarazioni).

      **Modificare:**
      - `USBHostUPS.h`: `#include "ReconnectBridge.h"`, membri `_bridge` e `_bound_id` con commento (US-140, sotto `_mutex`), firma `releaseBoundState(bool keep_values = false)`, parametro `const UpsIdentity& id` per `claimQxInterface()` e `attachQxDriver()`.
      - `USBHostUPS.cpp`:
        - helper statico `identityOf()`;
        - `claimInterface()` calcola `id` con `have_info`;
        - percorso HID: `onClaim()` dentro il lock prima di `populateStringsFromDeviceInfo`, con `_ups_data = UPSData()` su `DROP_VALUES` e le due righe INFO del piano, poi `_bound_id = id`;
        - stessa gestione in `attachQxDriver()`;
        - reset e svuotamento nel ramo "not supported yet";
        - `onEnumerated()` sul `CONNECTED`;
        - `handleDisconnected()` con `fresh = _first_data_ready && !isDataStale()`, `onDisconnected()` e la riga INFO;
        - `releaseBoundState(keep)`.

      **Passi:** 1) header; 2) identità e claim; 3) distacco e release; 4) build S3.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` ok.

      **Fatto:** senza finestra attiva (avvio, primo collegamento, distacco con dati stale) il percorso di codice dà gli stessi risultati di oggi.

      **Blocchi:** se `isDataStale()` chiamata in `handleDisconnected()` sotto `_mutex` crea problemi di lock (è ricorsivo, non dovrebbe), calcolare `fresh` prima di prendere il lock.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — include, membri, firme
      - lib/USBHostUPS/src/USBHostUPS.cpp — identità, claim HID e Q*, `CONNECTED`, distacco, release

      ## Criteri di Completamento
      - [ ] Con lo stesso UPS di ritorno `_ups_data` non viene azzerato e il driver nuovo ci scrive sopra
      - [ ] Con un UPS diverso, senza `dev_info` o a finestra scaduta `_ups_data` viene azzerato prima delle stringhe
      - [ ] Il ramo Q* "not supported yet" lascia `_ups_data` vuoto come oggi
      - [ ] Build S3 ok
    ref: TASK-03
  - id: TASK-04
    title: 'USBHostUPS: isDataStale con la finestra, scadenze, fine al primo poll e riavvio'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** fare servire i valori conservati ai consumatori e chiudere la finestra nei tempi giusti.

      **Leggere:** sezione 3 della soluzione tecnica; in `USBHostUPS.cpp` `isDataStale()`, `service()` (fino al blocco `_first_data_ready`), `requestRestart()`.

      **Modificare:** `lib/USBHostUPS/src/USBHostUPS.cpp` (e la dichiarazione in `USBHostUPS.h`):
      - `isDataStale()`: `_restart_requested` per primo; con `!_is_ready_to_poll || !_first_data_ready`, sotto `_mutex`:
        - `!_bridge.serving(now)` → true;
        - con l'UPS agganciato, stale solo con link, INPUT, silenzio o `dataStale()` del driver;
        - prima del claim false;
        - commento che rimanda all'addendum US-140 dell'ADR 0008;
      - nuovo `serviceReconnectBridge(uint32_t now)` chiamato dopo `serviceEnumWatchdog(now)`: `tick()` sotto `_mutex`, svuotamento di `_ups_data` su `DROP_VALUES` senza claim, le due righe INFO fuori dal lock;
      - nel blocco `_first_data_ready = true`: `onFirstData()` e la riga INFO `UPS back: last values served for %u ms, all refreshed now`;
      - `requestRestart()`: reset della finestra e svuotamento di `_ups_data` se non agganciato.

      **Passi:** 1) `isDataStale()`; 2) `serviceReconnectBridge()`; 3) primo poll; 4) riavvio; 5) build S3.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` ok; rilettura dei consumatori (`NUTServer`, `WebApiJson`, `main.cpp`) senza modifiche necessarie.

      **Fatto:** senza finestra attiva `isDataStale()` dà gli stessi risultati di oggi in ogni ramo.

      **Blocchi:** nessuno previsto.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.cpp — `isDataStale()`, `serviceReconnectBridge()`, primo poll, `requestRestart()`
      - lib/USBHostUPS/src/USBHostUPS.h — dichiarazione di `serviceReconnectBridge()`

      ## Criteri di Completamento
      - [ ] Durante la finestra `isDataStale()` è falso prima del claim e dopo il claim, salvo link, INPUT o driver già stale
      - [ ] Alla scadenza i dati sono stale subito (da `serving()`), e il `tick()` svuota i valori se l'UPS non è tornato
      - [ ] Un riavvio richiesto rende sempre i dati stale e chiude la finestra
      - [ ] Righe INFO di fine finestra presenti per i tre esiti
    ref: TASK-04
  - id: TASK-05
    title: Build di prova NUT_TEST_RECONNECT_BRIDGE (=1 distacco breve, =2 porta spenta 7 s)
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** poter provare la finestra sull'Eaton senza staccare il cavo.

      **Leggere:** sezione 4 della soluzione tecnica; in `USBHostUPS.cpp` il blocco `NUT_TEST_STUCK_CYCLE` di `service()` e `cycleRootPort()`; in `USBHostUPS.h` `TEST_STUCK_EVERY_MS` e i membri di prova.

      **Modificare:**
      - `cycleRootPort()` diviso in `rootPortOff()`/`rootPortOn()` con gli stessi log; `cycleRootPort()` = off, 500 ms, on (invariato);
      - sotto `#if defined(NUT_TEST_RECONNECT_BRIDGE) && NUT_TEST_RECONNECT_BRIDGE`:
        - `TEST_BRIDGE_EVERY_MS = 120000`, `_test_bridge_at`, `_test_port_on_at`;
        - in `service()`, dopo `serviceReconnectBridge(now)`: se `_test_port_on_at` è scaduto → `rootPortOn()`;
        - con `_first_data_ready`, `!isDataStale()` e `!_bridge.active()` da almeno 120 s → WARN `[TEST] Simulated UPS drop-off (NUT_TEST_RECONNECT_BRIDGE=N)`; `=1` chiama `cycleRootPort()`, `=2` chiama `rootPortOff()` e fissa `_test_port_on_at = now + 7000`;
        - mai toccare `_is_ready_to_poll`.

      **Passi:** 1) divisione di `cycleRootPort()`; 2) blocco di prova; 3) build con i due valori.

      **Verifica:** `PLATFORMIO_BUILD_FLAGS=-DNUT_TEST_RECONNECT_BRIDGE=1 ~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` e lo stesso con `=2`, entrambi ok; build normale invariata.

      **Fatto:** senza la macro il binario non contiene codice di prova.

      **Blocchi:** dopo una build con `PLATFORMIO_BUILD_FLAGS` i test native ricompilano tutto (gotcha noto): impacchettare eventuali zip prima dei test.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.cpp — `rootPortOff()`/`rootPortOn()`, blocco di prova
      - lib/USBHostUPS/src/USBHostUPS.h — dichiarazioni e membri di prova

      ## Criteri di Completamento
      - [ ] `=1` stacca l'UPS con dati freschi ogni 120 s senza marcarli stale
      - [ ] `=2` tiene la porta spenta 7 s senza bloccare il poll task
      - [ ] Le due build di prova e la build normale compilano
    ref: TASK-05
  - id: TASK-06
    title: 'ADR 0008: addendum US-140 e rimando dalla regola di #60'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** documentare la decisione e restringere la regola di #60.

      **Leggere:** `docs/adr/0008-non-blocking-hid-callbacks-and-control-pipe-recovery.md` (addendum #60 terzo giro, addendum US-122, addendum #138 e la struttura degli altri addendum); sezione 5 della soluzione tecnica.

      **Modificare:** lo stesso ADR, in inglese come il resto:
      - nuovo `### Addendum: last values across a short drop-off of the same UPS (US-140, issue #36, 2026-11-16)` prima di `### Positive`:
        - prova della #36 (dmesg con 5 distacchi in circa 21 h ricollegati in 0,3 s, Home Assistant "unavailable", primo poll del Powercom circa 18 s);
        - `usbhid-ups.c:1392-1424`;
        - regole: 5 s, 30 s, identità VID/PID+seriale o prodotto, valori sovrascritti nello stesso `UPSData`, secondo distacco senza allungare il tetto;
        - perché a 30 s non si scartano i valori non riletti (i driver saltano `set()` sui valori uguali);
        - cosa non cambia (ciclo della porta US-122 già stale, riavvii, web UI, comandi);
        - build di prova `=1`/`=2`;
      - nell'addendum #60, alla riga su `isDataStale()` fino al primo poll completo, un rimando: "except across a short drop-off of the same UPS, see the US-140 addendum".

      **Passi:** 1) addendum; 2) rimando; 3) rilettura.

      **Verifica:** solo documentazione.

      **Fatto:** niente codici US nel testo destinato alle note di rilascio; nell'ADR i codici sono ammessi come negli altri addendum.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - docs/adr/0008-non-blocking-hid-callbacks-and-control-pipe-recovery.md — addendum US-140 e rimando nell'addendum #60

      ## Criteri di Completamento
      - [ ] Addendum con prova, regole, eccezioni e build di prova
      - [ ] Rimando dalla regola di #60 presente
    ref: TASK-06
  - id: TASK-07
    title: 'Regressione: suite nativa completa, tre build e due build di prova'
    type: Test
    status: DONE
    dependencies:
