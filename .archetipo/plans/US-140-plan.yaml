      - TASK-05
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** provare che il resto del firmware non cambia e che tutto compila.

      **Leggere:** nessun file nuovo; comandi del progetto in memoria (`pio.exe`, toolchain mingw per native).

      **Modificare:** niente, salvo correzioni dei task precedenti se qualcosa fallisce.

      **Passi:**
      1) build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`;
      2) build S3 con `-DNUT_TEST_RECONNECT_BRIDGE=1` e `=2` (prima di eseguire i native, che ricompilano);
      3) `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native` completa.

      **Verifica:** tutte le build ok; suite nativa verde con il conteggio dei test (oggi 1608 più i nuovi).

