    ref: TASK-07
  - id: TASK-08
    title: Prova sull'Eaton 3S con le build di prova (solo dopo un sì esplicito)
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Descrizione
      **Obiettivo:** dimostrare la riga "Sulla scheda" della Dimostrazione.

      **Leggere:** memoria del progetto (credenziali OTA nel file JSON indicato, mai stampate; procedura OTA delle prove precedenti); `docs/test-results/US-139/` come modello di cartella dei risultati, se presente.

      **Modificare:** nuova cartella `docs/test-results/US-140/field/` con log e riepilogo.

      **Passi:**
      1) chiedere all'utente il permesso per la prova sull'UPS reale e aspettare un sì esplicito;
      2) OTA della build `=1`; script nello scratchpad che ogni secondo fa `GET VAR <ups> ups.status` e `GET VAR <ups> battery.charge` sulla porta 3493 e registra ogni risposta con l'ora; System Log scaricato da `/api/logs`; almeno 10 min (4 distacchi);
      3) OTA della build `=2` per circa 5 min (2 distacchi);
      4) OTA della build normale di questo branch.

      **Verifica:**
      - `=1`: zero `ERR DATA-STALE`; per ogni distacco le righe `Last values served while the same UPS comes back`, `Same UPS back after` e `UPS back: last values served for`; nessun riavvio;
      - `=2`: `ERR DATA-STALE` da circa 5 s dopo il distacco fino al primo poll completo dopo il ritorno, riga `UPS not back`.

      **Fatto:** riepilogo con numeri (distacchi, durata delle finestre, risposte stale) in `docs/test-results/US-140/field/`.

      **Blocchi:** senza il sì dell'utente il task resta aperto e la revisione lo segnala. L'Eaton alimenta la scheda dalla USB-A: il ciclo della porta non spegne VBUS sulle schede supportate, quindi la scheda resta accesa.

      ## File Coinvolti
      - docs/test-results/US-140/field/ — log del client NUT, System Log, riepilogo

      ## Criteri di Completamento
      - [ ] Sì esplicito dell'utente prima della prima OTA
      - [ ] `=1`: zero `ERR DATA-STALE` su almeno 4 distacchi
      - [ ] `=2`: dati stale dopo 5 s e righe di scadenza nel System Log
      - [ ] Scheda lasciata sulla build normale del branch
    ref: TASK-08
