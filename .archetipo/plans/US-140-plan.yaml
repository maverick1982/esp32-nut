      **Leggere:** `test/test_input_error_backoff/test_main.cpp` (struttura Unity e `main` del progetto), sezione "Strategia di test" del piano.

      **Modificare:** nuovo `test/test_reconnect_bridge/test_main.cpp` con almeno questi casi:
      - identità: stesso seriale; seriale diverso; seriale da una parte sola; senza seriale con prodotto uguale e diverso; PID diverso; identità non valida; "Blank";
      - percorso felice: distacco a 0, enumerazione a 1000, claim dello stesso UPS → `KEEP_VALUES`, `serving(20000)` vero, `onFirstData(19000)` vero con `bridgedMs = 19000`, poi `IDLE`;
