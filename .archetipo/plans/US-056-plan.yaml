  - id: TASK-06
    title: Catalogo atteso per ogni fixture di replay
    type: Test
    status: TODO
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** fissare, sui descriptor reali delle fixture, quali comandi espone ogni UPS supportato.

      **Da leggere:** `test/test_record_replay/FixtureReplayRunner.h` (`ReplayMockHost`, parsing del descriptor), `test/test_record_replay/test_main.cpp` (struttura dei test per fixture), i JSON in `test/fixtures/*/`.

      **Passi:**
      1. Per ogni fixture già caricata dai test di replay, dopo il replay calcolare `CommandCatalog::build(host._parser.getUsages(), host.supportsBeeperToggle() && host._data.hasKey("ups.beeper.status"))` e confrontare i nomi con un elenco atteso scritto nel test.
      2. Ricavare ogni elenco atteso dagli usage FEATURE del descriptor della fixture (per esempio stampandoli una volta con un test temporaneo e confrontandoli con la tabella del piano), NON copiando l'output di `build()`. Annotare nel commento del test i path che giustificano ogni comando non ovvio.
      3. Per l'Eaton 3S l'elenco atteso deve coincidere con quanto si vedrà con `upscmd -l` sull'UPS reale (Dimostrazione della spec).
      4. Non esiste una fixture EcoFlow (US-054 è TODO): non crearne una qui.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_record_replay`

      **Blocchi:** se una fixture mostra un comando che la tabella del piano non prevede, o ne manca uno atteso, fermarsi e segnalarlo invece di adattare il test.

      ## File Coinvolti
      - `test/test_record_replay/test_main.cpp` — asserzioni sul catalogo per fixture

      ## Criteri di Completamento
      - [ ] Ogni fixture esistente ha un elenco di comandi atteso con almeno un commento di giustificazione
      - [ ] `test_record_replay` è verde
