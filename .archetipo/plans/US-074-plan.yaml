    body: |-
      ## Descrizione
      **Obiettivo:** `build()`, `resolveWrite()` e `resolveShutdownSteps()` funzionano anche con una tabella di righe `HU_TYPE_CMD`; senza tabella resta il comportamento di oggi.

      **Leggi:**
      - `lib/USBHostUPS/src/CommandCatalog.h` (tutto);
      - `nut_repo/drivers/usbhid-ups.c:1640-1656` (`initinfo`), `instcmd` (circa 1300) e `find_nut_info`.

      **Modifica:**
      1. `inline const HIDUsageDef* cmdField(const NutTable::HidInfo* t, size_t n, const std::vector<HIDUsageDef>& usages, const char* name, const char** dfl)`: la prima riga con `info_type == name` e `HU_TYPE_CMD` per cui esiste un usage FEATURE con `NutTable::pathMatches(u, row.hidpath)`. Restituisce l'usage e il dfl della riga.
      2. `build(..., const NutTable::HidInfo* table = nullptr, size_t n_table = 0)`. Con una tabella:
         - `test.battery.start.quick/deep/stop`, `load.off.delay`, `load.on.delay`, `shutdown.stop`, `shutdown.reboot`: riga presente;
         - `load.off`/`load.on`: righe `.delay`;
         - `shutdown.return`/`stayoff`: entrambe;
         - `beeper.enable`/`disable`: riga presente e `beeper_available`;
         - `beeper.toggle`: entrambe e `beeper_available`;
         - `beeper.mute`: riga presente, `fitsField(field,3)`, `mute_allowed` e `beeper_available`;
         - `test.battery.start` e `test.panel.*`: riga presente;
         - `shutdown.default`: `reboot || shutdown`;
         - `shutdown_cmds` e `allow` come oggi.

         Solo nomi del catalogo `UpsCommands.h`, nel suo ordine.
      3. `resolveWrite(..., table, n)`: con una tabella, per `test.*` e `beeper.mute` usa `cmdField` e `atol(dfl)`.
      4. `resolveShutdownSteps(..., table, n)`: con una tabella:
         - `sd = cmdField("load.off.delay")`, `st = cmdField("load.on.delay")`;
         - `shutdown.stop` scrive il `dfl` di `cmdField("shutdown.stop")`;
         - `shutdown.reboot` usa il campo della sua riga, default `atol(dfl)`;
         - nessun caso APC CS.

         Il resto (parametri, `fitsField`, `kNoDelay`, sequenze, ritardi configurati) non cambia.
      5. Commenti: il nuovo ramo segue `find_nut_info`/`instcmd`; le deviazioni dei comandi elencate nel piano.

      **Verifica:** `pio test -e native -f test_command_catalog -f test_hid_control -f test_record_replay` verde, perché nessun chiamante passa ancora una tabella.

      **Fatto:** nuovo ramo presente, vecchio invariato.

      **Blocchi:** nessuno.

