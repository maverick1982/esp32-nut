schema: archetipo/plan/v2
spec_code: US-074
body: |-
  # US-074: Tabella unica Eaton (mge-hid), parte 2 — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-10-29

  ---

  ## Spec

  **Epic:** EP-001 — Gestione USB Host
  **Priorità:** MEDIUM | **Punti:** 8 | **Bloccato da:** US-073 (DONE, commit 3e28944)

  `mgeHid2Nut()` riceve tutte le righe di `mge_hid2nut` che US-073 ha lasciato (UPS page su PowerConverter/Flow, beeper, Input, Bypass, Output, Outlet), compresi i comandi `HU_TYPE_CMD`. Per gli Eaton, `HidControl` prende elenco e passi dei comandi da quelle righe. `EatonDriver` resta senza mappature scritte a mano. Si applicano le regole dell'ADR 0011.

  ---

  ## Decisioni prese in pianificazione (2026-10-29)

  - **`ups.alarm` fuori da US-074 (decisione dell'utente).** Le sei righe `ups.alarm` (`mge-hid.c:2155-2160`) restano commentate. Una spec nuova costruirà `ups.alarm` (righe vendor più bit di stato, come `ups_alarm_set()`) e i token OFF/TRIM/BOOST/BYPASS di `ups.status`, per tutti i driver.
  - **`ups.start.auto` come upstream (decisione dell'utente).**
    - `shutdown.return` imposta `ups.start.auto=yes` e `shutdown.stayoff` imposta `ups.start.auto=no` prima della sequenza, solo quando la variabile esiste; il risultato si ignora, come fa upstream.
    - È una scrittura permanente sull'UPS, da citare nelle note. Sul 3S non cambia nulla, perché non ha la variabile.
  - **`UpsCommands.h` invariato (criterio della spec).**
    - Le righe comando senza nome nel catalogo si copiano nella tabella ma non entrano in LIST CMD: `beeper.on`/`beeper.off` (alias upstream di `beeper.enable`/`disable`), `outlet.N.load.on/off`, `bypass.start/stop`, `experimental.ecomode.*`, `experimental.essmode.*`.
    - Le due righe `experimental.bypass.ecomode.*` usano la funzione con stato `eaton_input_eco_mode_auto_on_off_info` di US-070: restano commentate insieme alle tre variabili bypass/ECO.
  - **Deviazioni dei comandi che restano:**
    - `beeper.toggle` (estensione del progetto);
    - `shutdown.default` (sequenza di `upsdrv_shutdown()`);
    - default di `load.off.delay`/`load.on.delay` uguale a `ups.delay.*` configurato (US-058) invece del `dfl` della riga (20/30): oggi coincidono, ma un `SET VAR` dell'utente vince;
    - LIST CMD con i comandi beeper solo se `ups.beeper.status` è noto e il beeper è controllabile;
    - `beeper.mute` solo se 3 sta nel campo (`fitsField`).
  - **`ups.realpower`.** La stima di `UPSData::updateRealPower()` (60% della potenza apparente) non vale più per i driver che legano una riga `ups.realpower`. Sugli Eaton senza ActivePower la sostituisce `eaton_compute_realpower_info` (`mge-hid.c:1404-1431`): `round(load × 0,01 × nominal × powerfactor)`, con powerfactor da `output.powerfactor` o 0,80. Sul 3S passa da 21 a 28 W.

  ---

  ## Soluzione Tecnica

  ### 1. Conversioni e righe comando (`NutTable.h`)

  - **Lookup verbatim:**
    - `kUpsType` (`mge_upstype_conversion`), `kOnOff` (`on_off_info`, `usbhid-ups.c:525`);
    - `kOutletProtection` (`eaton_outlet_protection_status_info`) e `kOutletEco` (`outlet_eco_yes_no_info`, `mge-hid.c:903`);
    - `kBeeperInfo` (`beeper_info`, `usbhid-ups.c:512`: 1 disabled, 2 enabled, 3 muted).
  - **Conversioni:**
    - `Conv::MgePowerFactor`: `%.2f` di v/100;
    - `Conv::EatonComputeRealpower`: legge `ups.load`, `ups.power.nominal` e `output.powerfactor` da `UPSData` senza allocare (`find()`); DEFER se mancano i primi due; `lround`, `%.0f`;
    - entrambe con `staticText` o con il confronto prima di assegnare, come stabilito nel rework di US-073.
  - **Righe comando (`HU_TYPE_CMD`):** `isCommandRow(info)`.
    - `bind()` le lega come le altre ma le lascia fuori da `resolve()`, cioè non entrano nella regola INIT.
    - `onValue()` le ignora, e non vengono mai pubblicate.
    - `writableVariables()` e `planSet()` non le vedono, perché `info_flags` è 0 e i nomi non sono variabili.
  - **`GenericDriver::publishNutRows()`:** chiama `updateRealPower()` solo se la tabella non lega una riga `ups.realpower`.

  ### 2. Righe di `mgeHid2Nut()`

  Nell'ordine upstream, al posto dei commenti "row of US-074":
  - **UPS page:** 2062 `ups.efficiency`, 2075-2077 `ups.beeper.status`, 2079-2091 potenze (`ups.power*`, `ups.L*`, `ups.realpower*`, compresa la 2087 con `EatonComputeRealpower` e dfl "-1"), 2103 `ups.type`.
  - **Input page:** 2163-2177, più le RW che ci sono già, 2179-2198.
  - **Bypass page:** 2201-2215 e 2222 (RW, già presente); 2218-2219 restano escluse per US-070.
  - **Output page:** 2225-2241, con la 2232 RW già presente.
  - **Outlet page:** 2246-2320, dove i RW e gli HU_FLAG_ABSENT ci sono già.
  - **Comandi:** 2326-2367; 2361-2363 escluse per US-070.
  - **Commenti:** `ups.alarm` (2155-2160) come "row of the ups.alarm spec"; 2373 resta esclusa (US-070).

  I percorsi vendor si traducono con `mge_usage_lkp`, per esempio Efficiency `0xFFFF0086`, ConverterType `0xFFFF0041`, OutletID e Status `0xFFFF00E9`, iDesignator, ECOControl, SwitchOnControl/SwitchOffControl, Inverter `0xFFFF0014`. I nomi standard vengono da `NUTUsages.h`. Gli indici `[N]` sono quelli upstream.

  ### 3. Comandi dalla tabella

  - **Driver.** `IUPSDriver::commandTable(size_t& n)`, con default `nullptr`. `EatonDriver` restituisce `mgeHid2Nut()`. Le tabelle sono dati statici, quindi il puntatore resta valido anche dopo che il driver è stato cancellato.
  - **Porta.** `IHidControlPort::commandTable(size_t& n)`, con default `nullptr`; `USBHostUPS` lo implementa sotto `_mutex`, come `commandAllowList()`.
  - **`CommandCatalog`:** le funzioni `build()`, `resolveWrite()` e `resolveShutdownSteps()` ricevono `(const NutTable::HidInfo* table, size_t n)`. Con `nullptr` il comportamento è quello di oggi (gruppi e codici APC). Con una tabella:
    - `cmdField(table, n, usages, name, dfl)` restituisce la prima riga `HU_TYPE_CMD` con quel nome il cui percorso (`pathMatches`, con gli indici) ha un usage FEATURE, cioè `find_nut_info` con `hiddata` scrivibile;
    - **disponibilità:**
      - righe dirette per `test.battery.*`, `load.off.delay`, `load.on.delay`, `shutdown.stop`, `shutdown.reboot` e `beeper.enable/disable/mute`;
      - comandi derivati come `upsdrv_initinfo()` (`usbhid-ups.c:1642-1656`): `load.off` da `load.off.delay`, `load.on` da `load.on.delay`, `shutdown.return`/`stayoff` da entrambi;
      - `beeper.toggle` con `beeper.enable` e `beeper.disable`, più `beeper_available`;
      - `shutdown.default` come oggi; `shutdown_cmds`, `mute_allowed` e la lista consentita come oggi;
    - **valori:**
      - `test.*` e `beeper.mute` prendono `atol(dfl)` della riga;
      - `shutdown.stop` prende -1 dal dfl, `shutdown.reboot` il dfl 10 oppure il parametro;
      - `load.*.delay` prendono il ritardo configurato (deviazione US-058); i campi delle sequenze sono quelli delle righe `load.off.delay` e `load.on.delay`;
      - il caso APC CS resta solo nel ramo senza tabella.
  - **`HidControl`:**
    - prende la tabella dalla porta e la passa a `CommandCatalog`;
    - per `beeper.enable`, `beeper.disable` e `beeper.toggle` scrive il campo della riga (`IHidControlPort::setBeeperField(field, enable)`, che `USBHostUPS` implementa come `setBeeperLocked` con il campo dato al posto di `activeBeeper()`: stesse righe di log, stesso aggiornamento di `ups.beeper.status`); senza tabella si usa `setBeeper(enable)` come oggi;
    - per `shutdown.return` e `shutdown.stayoff`, se `upsData()` ha `ups.start.auto`, chiama prima `setVariable(port, "ups.start.auto", "yes"/"no")` e ne ignora l'esito;
    - ordine dei lock e pausa di 125 ms invariati.

  ### 4. `EatonDriver`

  - **Override:** `commandTable()`.
  - **Mappature tolte:** outlet switch, `Flow.ConfigFrequency`, `ConverterType`.
  - **Hook che restano:** gli ingressi del contesto (`iModel` e `Flow.[4].ConfigApparentPower`, nessuna pubblicazione), stringhe, quirk.
  - **Percorsi generici superati:** si aggiungono tutte le mappature di `GenericDriver::decodeReport()` le cui chiavi sono ora righe: input/output voltage e frequency, le nominali, potenze e potenze nominali, `ups.beeper.status`, `input.transfer.*`. Restano solo le estensioni della regola 2: `ups.mfr.date` (ManufacturerDate, due percorsi) e `battery.mfr.date` (`Battery.ManufacturerDate`, `BatterySystem.Battery.Date`, `Battery.Date`).

  ### 5. Differenze attese sul 3S (da confermare nel replay e sull'hardware)

  - **Prese:** `outlet.1.switch` e `outlet.2.switch` diventano `outlet.1.status=on` (Outlet.[2] SwitchOn/Off). Il 3S non ha Outlet.[3], quindi non c'è `outlet.2.status`.
  - **Nominali d'ingresso:** spariscono `input.voltage.nominal` e `input.frequency.nominal`, perché upstream le legge da Flow.[1], che il 3S non ha; i valori di oggi venivano da Flow.[4], cioè dall'uscita (regola 2). `output.frequency.nominal` resta.
  - **Potenza:** `ups.realpower` passa da 21 a 28.
  - **Nuove variabili** se legate: `outlet.id`, `outlet.switchable`, `outlet.1.id`, `outlet.1.switchable`, `outlet.1.protect.status`.
  - **Invariati:** `ups.type`, `output.voltage`, `ups.power.nominal`, `ups.beeper.status`, `input.transfer.*`, LIST CMD e LIST RW.
  - La Web UI ha già le descrizioni di `outlet.N.status`.

  ---

  ## Strategia di Test

  Nessuna superficie UI nuova: niente mockup né video. La pagina UPS Telemetry usa `ups.realpower`, `ups.load`, `ups.type`, `ups.test.result`, `battery.charge`, `ups.beeper.status` e `ups.status`, che restano tutte. Gli e2e Playwright girano come regressione, e la prova finale sul 3S comprende la pagina.

  - **`test_nut_table`:**
    - le nuove conversioni, con valori upstream;
    - `EatonComputeRealpower`: 5% × 700 VA × 0,8 = 28, `output.powerfactor` usato quando c'è, DEFER senza nominale;
    - righe comando legate ma mai pubblicate né risolte;
    - controllo strutturale esteso: nessuna riga `mge-hid.c` fra 2002 e 2375 senza riga o commento.
  - **`test_command_catalog`:**
    - con `mgeHid2Nut()` sui descriptor 3S e 5P l'elenco coincide con quello senza tabella di oggi;
    - passi e valori uguali;
    - `beeper.mute` su un campo a 1 bit non disponibile;
    - `outlet.*` ed `experimental.*` mai elencati;
    - `shutdown.reboot` dalla riga.
  - **`test_hid_control`:**
    - porta finta con tabella: `beeper.enable` scrive il campo della riga e non `activeBeeper()`;
    - `shutdown.return` con `ups.start.auto` presente fa prima `planSet` di `ups.start.auto=yes`, poi i due passi con 125 ms in mezzo; con `stayoff` vale `no`; senza la variabile non c'è nessun `planSet`; un fallimento del set non blocca la sequenza;
    - nessun lock tenuto durante le scritture.
  - **`test_eaton_driver`:**
    - `outlet.1.status` on/off;
    - `ups.realpower` calcolato;
    - `input.voltage.nominal` assente con il solo Flow.[4];
    - `ups.type`;
    - `ups.beeper.status` dalla tabella;
    - nessuna chiave scritta da mappature generiche superate.
  - **`test_record_replay`:**
    - elenco delle righe legate su 3S e 5P, ricavato a mano dai descriptor (dumper delle usage come in US-073) e da `mge-hid.c`;
    - valori e differenze nel commento;
    - LIST CMD e LIST RW invariati;
    - `expected_ups_data` della fixture 3S aggiornata (`outlet.1.status`, niente `outlet.N.switch`, niente `input.*.nominal`, `ups.realpower` 28).
  - **Mutazioni:**
    - togliere un comando derivato;
    - far scrivere il beeper su `activeBeeper()`;
    - togliere `ups.start.auto`.

    Ciascuna mutazione deve far fallire almeno un test.
  - **Regressione e hardware:** suite completa, e2e, build. Poi OTA sul 3S:
    - `nut_snapshot.py` con il diff dalla prova di US-073;
    - `beeper.toggle` due volte, `shutdown.stop`, SET VAR `battery.charge.low` andata e ritorno;
    - System Log invariato;
    - pagina Telemetry controllata dall'utente.

  ---

  ## Rischi e note

  - **Fixture 5P solo descriptor:** l'elenco dei comandi senza `ups.beeper.status` resta senza beeper, come oggi.
  - **Righe comando duplicate:** `beeper.mute`, `beeper.disable` e `beeper.enable` hanno due o tre righe; vince la prima con un usage FEATURE, in ordine di tabella (`find_nut_info`).
  - **Non-Eaton:** senza tabella dei comandi, `HidControl` e `CommandCatalog` fanno esattamente quello di oggi; lo verificano `test_command_catalog` e il replay delle 21 fixture non Eaton.
  - **Note di rilascio v1.11.1:** vanno aggiunte le differenze del 3S, `ups.start.auto` e `ups.realpower` con powerfactor 0,8.
    - Aggiornamento 2026-10-29: per decisione dell'utente la release è diventata **v1.12.0**, perché US-107 aggiunge funzionalità (`ups.alarm`, `input.transfer.reason`, token di `ups.status`). `docs/releases/v1.11.1.md` è stato rinominato in `docs/releases/v1.12.0.md`, che contiene anche le note di US-107; la v1.11.1 non esce.

  ---

  _Piano generato con ARchetipo Planning — 2026-10-29_

  ---

  ## Rework (review del 2026-10-29)

  La review ha accettato il comportamento, provato sull'Eaton 3S: diff `upsc` atteso, comandi, SET VAR e pagina Telemetry. Ha chiesto il test di copertura che la strategia di test prevedeva ("controllo strutturale esteso: nessuna riga `mge-hid.c` fra 2002 e 2375 senza riga o commento") e che non era stato scritto: la copertura era verificata solo con uno script fuori dal repo.

  **Correzione.** Un test nativo in `test/test_nut_table`:
  - legge `nut_repo/drivers/mge-hid.c` e `lib/USBHostUPS/src/NutTable.h` (i test nativi girano dalla radice del progetto, come per le fixture);
  - ricava le righe di `mge_hid2nut` senza numeri fissi: dalla riga dopo `static hid_info_t mge_hid2nut[]` fino al terminatore `{ NULL, 0, 0, NULL...`, conta ogni riga che comincia con `{ "`, anche dentro `/* */` o `#if 0`;
  - raccoglie da `mgeHid2Nut()` (dal suo `inline const HidInfo* mgeHid2Nut` al successivo `inline const HidInfo* apcHid2Nut`) tutti i riferimenti `mge-hid.c:N` e gli intervalli `mge-hid.c:N-M`.

  Due controlli:
  1. ogni riga upstream è citata almeno una volta; il messaggio indica le righe mancanti;
  2. ogni numero citato corrisponde a una riga upstream, così una citazione rimasta indietro dopo un aggiornamento di `mge-hid.c` fa fallire il test.

  Il test è scritto come helper riusabile (`checkTableCoverage(file, table_name, function_name, next_function)`), così le prossime migrazioni (US-075, US-076, US-106) potranno chiamarlo sulle loro tabelle.

  **Mutazioni:** togliere da `mgeHid2Nut()` il commento di una riga esclusa (per esempio `ups.alarm` 2155) e cambiare un numero citato in uno che non è una riga upstream: devono far fallire il test.
tasks:
  - id: TASK-01
    title: 'NutTable: conversioni UPS/Output/Outlet, righe comando, stima di ups.realpower'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** dare al motore ciò che serve alle righe restanti di mge-hid.

      **Leggi:**
      - `lib/USBHostUPS/src/NutTable.h`: `Conv`, `staticText`, `decode`, `isInternalRow`, `bind`, `resolve`, `onValue`, `finishInit`;
      - `lib/USBHostUPS/src/GenericDriver.cpp`: `publishNutRows`;
      - `nut_repo/drivers/usbhid-ups.c:512-529` (`beeper_info`, `on_off_info`);
      - `nut_repo/drivers/mge-hid.c`: 737-741 (powerfactor), 765-771 (`upstype`), 903-907 (`outlet_eco`), 1398-1431 (`compute_realpower`), 1560 (`outlet_protection`).

      **Modifica:**
      1. Lookup verbatim: `kUpsType`, `kOnOff`, `kOutletProtection`, `kOutletEco`, `kBeeperInfo`, ciascuna con il nome upstream nel commento.
      2. Nuove voci di `Conv`:
         - `MgePowerFactor`: `%.2f` di v/100;
         - `EatonComputeRealpower`: con `data` nullo, o senza `ups.load` o `ups.power.nominal` in `data->find()`, DEFER, come il NULL upstream; altrimenti `pf = output.powerfactor` (`strtod`) oppure 0.80, poi `lround(load*0.01*nominal*pf)` formattato `%.0f`. Commento con la riga upstream.
      3. `inline bool isCommandRow(const HidInfo& i) { return i.hidflags & HU_TYPE_CMD; }`:
         - in `resolve()` saltale come le righe interne;
         - in `bind()` lasciale PENDING (non servono ruoli);
         - in `onValue()` `return` subito;
         - in `finishInit()` saltale;
         - `GenericDriver::publishNutRows()` le salta.
      4. In `GenericDriver::publishNutRows()`, `updateRealPower()` solo se nessuna riga legata ha nome `ups.realpower` (calcolalo una volta in `bindNutTable()` in un bool `_nut_has_realpower`).

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_table -f test_rw_catalog -f test_generic_driver -f test_eaton_driver` verde.

      **Fatto:** API pronta, nessuna riga nuova in tabella.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — lookup, conversioni, `isCommandRow`
      - lib/USBHostUPS/src/GenericDriver.h / .cpp — righe comando in `publishNutRows`, `_nut_has_realpower`

      ## Criteri di Completamento
      - [ ] Le quattro suite indicate verdi
      - [ ] Nessuna String costruita da `EatonComputeRealpower` senza dati (DEFER prima di formattare)
    ref: TASK-01
  - id: TASK-02
    title: Test delle nuove conversioni e delle righe comando
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** coprire TASK-01 con attese ricavate da upstream.

      **Leggi:** `test/test_nut_table/test_main.cpp`.

      **Modifica:** test nuovi:
      - `kUpsType` (1 → `offline / line interactive`, 5);
      - `kOnOff`, `kOutletProtection`, `kOutletEco`, `kBeeperInfo` (3 → `muted`);
      - `MgePowerFactor` (95 → `0.95`);
      - `EatonComputeRealpower`:
        - `ups.load=5`, `ups.power.nominal=700` → `28`;
        - con `output.powerfactor=0.60` → `21`;
        - senza nominale → DEFER;
        - con `data` nullo → DEFER;
      - una riga `HU_TYPE_CMD` legata resta PENDING dopo `onValue` e `finishInit` e non diventa mai ACTIVE con un valore; `resolve` non la mette in gruppo con una variabile omonima.

      Registra i test in `main()`.

      **Verifica:** `pio test -e native -f test_nut_table` verde.

      **Fatto:** test verdi.

      **Blocchi:** se un'attesa differisce dal codice upstream, vale upstream: correggi TASK-01.

      ## File Coinvolti
      - test/test_nut_table/test_main.cpp — test nuovi

      ## Criteri di Completamento
      - [ ] Suite verde con i casi elencati
    ref: TASK-02
  - id: TASK-03
    title: 'Righe restanti di mge_hid2nut: UPS page, Input, Bypass, Output, Outlet, comandi'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** `mgeHid2Nut()` con tutte le righe di `mge_hid2nut` da 2006 a 2373, nell'ordine upstream. Le uniche escluse, con un commento, sono `ups.alarm` (spec a parte), le righe US-070 (2218, 2219, 2361-2363, 2373), i blocchi `#if 0` e i commenti upstream.

      **Leggi:**
      - `nut_repo/drivers/mge-hid.c` righe 2062-2103 e 2155-2373, con la tabella dei nomi alle righe 1570-1730;
      - `lib/USBHostUPS/src/NUTUsages.h`;
      - le righe esistenti di `mgeHid2Nut()`.

      **Modifica:**
      1. Sostituisci i commenti "row of US-074" (2062, 2075-2077, 2079-2091, 2103) con le righe. Conversioni:
         - `beeper_info` → `Lookup kBeeperInfo`;
         - `eaton_compute_realpower_info` → `Conv::EatonComputeRealpower`, dfl `"-1"`;
         - `mge_upstype_conversion` → `Lookup kUpsType`.
      2. Sostituisci `// ups.alarm (mge-hid.c:2155-2160): rows of US-074...` con `// ups.alarm (mge-hid.c:2155-2160): rows of the ups.alarm spec, the firmware does not build ups.alarm yet`.
      3. Input page 2163-2177 e Bypass page 2201-2215: le RO nuove, nell'ordine, accanto alle RW che ci sono già (2179-2198, 2222). `input.bypass.switch.on/off` restano commentate.
      4. Output page 2225-2241: `mge_powerfactor_conversion` → `Conv::MgePowerFactor`; la 2232 resta.
      5. Outlet page 2246-2320: RO nuove, con le RW e ABSENT che ci sono già. Conversioni:
         - `on_off_info` → `kOnOff`;
         - `eaton_outlet_protection_status_info` → `kOutletProtection`;
         - `outlet_eco_yes_no_info` → `kOutletEco`;
         - `stringid_conversion` → `StringId`;
         - `yes_no_info` → `kYesNo`;
         - `pegasus_yes_no_info` → `PegasusYesNo`.
      6. Comandi 2326-2367: `{ name, 0, 0, path, "<dfl>", HU_TYPE_CMD, Conv::Number, nullptr, 0 }`. `DEFAULT_OFFDELAY`/`DEFAULT_ONDELAY` diventano `"20"`/`"30"`, con il commento "usbhid-ups.h". Le 2361-2363 restano commentate (US-070).
      7. Traduzioni dei percorsi da verificare una per una: Efficiency `0xFFFF0086`; ConverterType `0xFFFF0041`; Outlet Status `0xFFFF00E9`; ECOControl, iDesignator, SwitchOnControl, SwitchOffControl, LowVoltageTransfer… (quelle che `NUTUsages.h` non nomina, prese da `mge_usage_lkp`); `Phase.[12]` e simili come indice 12; Inverter `0xFFFF0014`.

      **Verifica:** `pio test -e native -f test_nut_table -f test_rw_catalog` verde. Controllo con `grep -o 'mge-hid.c:2[0-3][0-9][0-9]'`: ogni riga upstream da 2006 a 2373 compare come riga o come commento.

      **Fatto:** tabella completa.

      **Blocchi:** un percorso non traducibile resta commentato con il motivo, da segnalare nella review.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — righe di `mgeHid2Nut()`

      ## Criteri di Completamento
      - [ ] Ogni riga upstream 2006-2373 presente come riga o come commento
      - [ ] `test_rw_catalog` verde: le RW restano 55
    ref: TASK-03
  - id: TASK-04
    title: 'CommandCatalog: elenco e passi dei comandi da una tabella'
    type: Impl
    status: DONE
    dependencies:
