      2. Helper `static void checkTableCoverage(const char* upstream_file, const char* upstream_table, const char* source_file, const char* function_start, const char* function_end)`:
         - **righe upstream:** trova la riga che contiene `upstream_table`; da lì, fino alla prima riga che contiene `{ NULL, 0, 0, NULL`, raccoglie i numeri (base 1) delle righe il cui testo, tolti spazi e un eventuale `/*`, comincia con `{ "`;
