  - id: TASK-06
    title: 'Porta e HidControl: tabella dei comandi, campo del beeper, ups.start.auto'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** per i driver con tabella, `HidControl` usa le righe; beeper e `shutdown.return`/`stayoff` si comportano come upstream.

      **Leggi:**
      - `lib/USBHostUPS/src/HidControl.h`, `IHidControlPort.h`, `IUPSDriver.h` (`commandAllowList`);
      - `lib/USBHostUPS/src/USBHostUPS.h` e `.cpp` (`commandAllowList`, `setBeeper`, `setBeeperLocked` alle righe 800-860);
      - `nut_repo/drivers/usbhid-ups.c`, `instcmd`: rami `shutdown.return`/`stayoff`.

      **Modifica:**
      1. `IUPSDriver`: `virtual const NutTable::HidInfo* commandTable(size_t& n) const { n = 0; return nullptr; }`. Commento: tabella statica, valida anche dopo la cancellazione del driver.
      2. `IHidControlPort`:
         - `virtual const NutTable::HidInfo* commandTable(size_t& n) const { n = 0; return nullptr; }`;
         - `virtual bool setBeeperField(const HIDUsageDef& field, bool enable) { return false; }`.
      3. `USBHostUPS`:
         - `commandTable()` sotto `_mutex`, come `commandAllowList()`;
         - `setBeeperField()` usa lo stesso `_op_mutex` di `setBeeper()` e chiama `setBeeperLocked(enable, &field)`;
         - `setBeeperLocked(bool enable, const HIDUsageDef* field = nullptr)` usa `field` al posto di `CommandCatalog::activeBeeper()` quando è dato, cercando l'item Feature/Output dello stesso percorso come fa `activeBeeper()`;
         - log e aggiornamento di `ups.beeper.status` invariati.
      4. `HidControl`:
         - `supportedCommands` passa `hid->commandTable(n)` a `build`;
         - `executeCommand` la passa a `resolveWrite` e `resolveShutdownSteps`;
         - beeper: con la tabella, `enable`/`disable`/`toggle` prendono il campo con `cmdField("beeper.enable"/"beeper.disable")` sotto `PortLock` e poi chiamano `hid->setBeeperField(field, enable)` senza lock; senza tabella `port.setBeeper()` come oggi;
         - `shutdown.return`/`stayoff`: prima dei passi, se `port.upsData().hasKey("ups.start.auto")` letto sotto `PortLock`, chiama `setVariable(port, "ups.start.auto", return ? "yes" : "no")` e ignora il risultato. Commento con `usbhid-ups.c instcmd` e la decisione del 2026-10-29.
      5. Ordine dei lock (`_op_mutex` poi `_mutex`, ADR 0008), pausa di 125 ms e messaggi invariati.

      **Verifica:** `pio test -e native -f test_hid_control -f test_nut_server -f test_web_api -f test_usb_host_interface -f test_ups_control_port` verde senza modifiche.

      **Fatto:** con `commandTable` nullo non cambia nulla.

      **Blocchi:** se `setBeeperLocked` con un campo dato non trova l'item scrivibile, restituisci false senza scrivere.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUPSDriver.h — `commandTable`
      - lib/USBHostUPS/src/IHidControlPort.h — `commandTable`, `setBeeperField`
      - lib/USBHostUPS/src/USBHostUPS.h / .cpp — implementazioni
      - lib/USBHostUPS/src/HidControl.h — uso della tabella, beeper, `ups.start.auto`

      ## Criteri di Completamento
      - [ ] Suite indicate verdi senza modifiche
      - [ ] Nessun lock tenuto attorno a `setBeeperField`, `writeUsage` e `setVariable`
