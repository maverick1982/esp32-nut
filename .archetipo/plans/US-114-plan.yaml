  - id: TASK-10
    title: Prova sul campo sull'Eaton 3S con scheda e router sull'UPS (solo con consenso esplicito)
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Descrizione
      **Obiettivo:** verificare sull'Eaton 3S reale, con scheda e router alimentati dallo stesso UPS, che lo spegnimento automatico mandi `shutdown.default` una volta sola in `OB LB` e che tutto riparta al ritorno della rete.

      **Consenso (bloccante):** prima di qualsiasi azione di questo task (OTA, modifica di impostazioni, raccolta, richiesta di staccare la rete) chiedere all'utente il consenso esplicito a iniziare la prova e aspettare la risposta. Senza un sì esplicito nel turno corrente, fermarsi. Un consenso dato per altre prove o in sessioni precedenti non vale.

      **Leggere:** la sezione "Prova sul campo sull'Eaton 3S" del piano; `scripts/nut_snapshot.py`; `docs/test-results/US-072/field/` (formato dei risultati); `scripts/serial_log.py` (solo variante B).

      **Passi:** eseguire la variante A del piano, passi 1-9. Le azioni fisiche (staccare e riattaccare la rete) le fa l'utente quando Claude glielo chiede; Claude prepara tutto il resto, avvia la raccolta in background e dice all'utente cosa sta aspettando. La variante B solo se l'utente la chiede.

      **Verifica:** i file in `docs/test-results/US-114/field/` mostrano: una sola riga `[CMD] Automatic shutdown`, `Command shutdown.default: OK via shutdown.return`, la scheda di nuovo raggiungibile in `OL` senza nuovi comandi, `battery.charge.low` ripristinato.

      **Fatto quando:** l'esito è scritto in `docs/test-results/US-114/field/README.md` e riportato all'utente, anche se negativo.

      **Blocchi:** consenso assente; UPS non in `OL` o batteria non carica all'inizio; PC della raccolta alimentato dall'UPS; `battery.charge.low` non ripristinabile (avvisare subito l'utente). Le credenziali della scheda non vanno mai stampate.

      ## File Coinvolti
      - docs/test-results/US-114/field/before-upsc.txt, before-upscmd.txt, before-upsrw.txt — snapshot iniziali
      - docs/test-results/US-114/field/events.jsonl — log e variabili raccolti ogni 2 s
      - docs/test-results/US-114/field/after-upsc.txt, after-upscmd.txt, after-upsrw.txt — snapshot finali
      - docs/test-results/US-114/field/README.md — procedura seguita, tempi ed esito

      ## Criteri di Completamento
      - [ ] Consenso esplicito dell'utente ottenuto prima di iniziare
      - [ ] Una sola riga `[CMD] Automatic shutdown` e `shutdown.default` eseguito via `shutdown.return`
      - [ ] Prese spente e riaccese al ritorno della rete; scheda di nuovo in rete in `OL`, nessun nuovo comando, opzione ancora attiva
      - [ ] `battery.charge.low` riportato al valore originale e riletto
      - [ ] Esito documentato in `docs/test-results/US-114/field/README.md`
    ref: TASK-10
