  - id: TASK-06
    title: 'Collegamento nel firmware: loop, web server e System Log'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** mandare `shutdown.default` una volta per evento con l'opzione attiva e registrarlo (criteri 3 e 4).

      **Leggere:** `src/core/main.cpp` (setup e loop), `src/network/web_config_server.cpp:216-260` e `:471-495`, `include/network/web_config_server.h`, `lib/USBHostUPS/src/USBHostUPS.cpp:1004-1035` (log dell'esito dei comandi).

      **Modifiche:**
      - `main.cpp`: `static AutoShutdown auto_shutdown;` con commento US-114; in `setup()` `auto_shutdown.setEnabled(board_settings.auto_shutdown)` e `web_server.setAutoShutdown(&auto_shutdown)` accanto a `setStatusLed`.
      - `main.cpp` `loop()`: blocco ogni 1000 ms, subito dopo il blocco di `restart_policy` e prima di `if (!config_mgr.isValid())`. Legge `String st = usb_ups.getUPSStatusString()`; `available = AutoShutdown::onBatteryLow(st.c_str()) && <getSupportedCommands() contiene shutdown.default>`; se `auto_shutdown.update(usb_ups.isConnected(), usb_ups.isDataStale(), st.c_str(), available)`: log `WARN [CMD] Automatic shutdown: UPS status '%s', sending shutdown.default`, `CommandResult r = usb_ups.executeCommand("shutdown.default")`; se `NOT_CONNECTED` → `restoreArm()` e `WARN [CMD] Automatic shutdown: shutdown.default not run, will retry`; altro esito non OK → `WARN [CMD] Automatic shutdown: shutdown.default not run, no new attempt until the UPS is back on line`.
      - `web_config_server.h/.cpp`: `void setAutoShutdown(AutoShutdown*)`, membro `AutoShutdown* auto_shutdown = nullptr`; helper privato `AutoShutdownAvailability autoShutdownAvailability() const` (da `ups_source`: connesso e `getSupportedCommands()` con `shutdown.default`). `handleGetBoard()` e `handleSetBoard()` passano la disponibilità; in `handleSetBoard()`, se `next.auto_shutdown != board_settings.auto_shutdown`: `auto_shutdown->setEnabled(next.auto_shutdown)` e `INFO [BOARD] Automatic shutdown enabled|disabled`.
      - Nessuna modifica a `NUTServer`, `UpsVariables`, `DriverVarStore`, `HidControl`.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`; suite nativa completa invariata.

      **Fatto quando:** la build S3 passa e il codice segue le regole del piano.

      **Blocchi:** se `getUPSStatusString()` o `getSupportedCommands()` non sono sicuri dal loopTask, fermarsi e segnalarlo (oggi li usano già il log `[DIAG]` e `/api/ups/commands` dallo stesso task).

      ## File Coinvolti
      - src/core/main.cpp — oggetto globale, setup, valutazione nel loop e log
      - include/network/web_config_server.h — `setAutoShutdown`, membro, helper
      - src/network/web_config_server.cpp — disponibilità in GET/POST, applicazione e log

      ## Criteri di Completamento
      - [ ] Valutazione ogni secondo, anche con configurazione non valida o in AP
      - [ ] Una riga `[CMD] Automatic shutdown` prima del comando, l'esito dall'host
      - [ ] `NOT_CONNECTED` riarma, ogni altro esito no
      - [ ] Attivazione dalla pagina applicata senza riavvio e registrata con `[BOARD]`
      - [ ] Build `esp32-s3-standard` ok
    ref: TASK-06
