      - `src/core/main.cpp`: togliere `upsOffersShutdownDefault()`; in `checkAutoShutdown()` usare `AutoShutdown::offersShutdownDefault(usb_ups.getSupportedCommands())`, dopo `onBatteryLow()` come oggi.

