      ## Descrizione
      **Obiettivo:** le tre risposte HTTP della pagina come funzioni pure, con la mappatura degli stati della spec.

      **Da leggere:**
      - `lib/WebApi/src/WebApiJson.h/.cpp` (`generateUpsCommands`, `runUpsCommand`, `MAX_COMMAND_BODY_LENGTH`);
      - `lib/USBHostUPS/src/NutTable.h` (`describe()`, `checkSetValue()`, `RWVariable`);
      - piano, sezione 3.

      **Modifiche in `WebApiJson`:**
      - `static bool needsConfirmation(const char* name)`:
        - true per `ups.shutdown`, `outlet.switchable` e `outlet.<cifre>.switchable`, il prefisso `input.bypass.`, `input.eco.switchable` e `input.transfer.bypass.forced`;
        - false per il resto (per esempio `outlet.1.desc`).
      - `static String generateUpsVariables(IUSBHostUPS* usb_ups)`:
        - risponde `{"connected","variables":[{"name","description","value","max_length","enum","driver_side","confirm"}]}`;
        - `description` viene da `NutTable::describe()`, altrimenti `"Description unavailable"`;
        - `value` viene da `getUPSData()`, stringa vuota se la chiave manca;
        - senza host o con UPS scollegato: `connected:false`, `variables:[]`.
      - `static int runUpsVariable(IUSBHostUPS* usb_ups, const String& body, String& response)`:
        - ordine e messaggi esatti della sezione 3 del piano;
        - successo: `{"success":true,"value":"<valore in UPSData dopo la scrittura>"}`;
        - errori: `{"error":"..."}`.
      - `static int resetUpsVariable(IUSBHostUPS* usb_ups, const String& body, String& response)`: come da piano.
      - Parsing con ArduinoJson e filtro, come `runUpsCommand`. `value` deve essere una stringa JSON: un numero dà 400.

      **Passi:** funzioni e dichiarazioni; build native ed esp32.

      **Verifica:** `pio test -e native -f test_web_api` verde e build `esp32-s3-standard`.

      **Fatto quando:** le tre funzioni coprono 200/400/500/503 senza toccare l'host nei 400 di forma.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/WebApi/src/WebApiJson.h — dichiarazioni
      - lib/WebApi/src/WebApiJson.cpp — implementazione

      ## Criteri di Completamento
      - [ ] payload GET con tutti i campi della spec più `confirm`
      - [ ] mappatura `SetStatus` → HTTP come da piano
      - [ ] nessuna chiamata all'host nei 400 di forma
      - [ ] build ok
