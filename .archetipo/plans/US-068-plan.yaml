         - Apply `battery.charge.low=30` mostra l'esito e il valore 30, che compare anche in `upsc`;
         - `ups.delay.shutdown=60` mostra 60; "Reset to default" lo riporta a 20, e dopo un riavvio resta 20;
         - `outlet.desc` impostato a "Rack A", poi "Reset to default" lo riporta a `Main Outlet`;
         - un valore troppo lungo dà il messaggio 400;
         - in AP (doppio reset) la pagina modifica i valori e un comando di spegnimento chiede conferma e parte. Da provare senza carichi importanti collegati;
         - il System Log ha una riga per ogni Apply e Reset.

