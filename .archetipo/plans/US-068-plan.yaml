    body: |-
      ## Descrizione
      **Obiettivo:** documentare la decisione del 2026-10-16 sulla modalità AP e la pagina UPS Settings (piano, sezione 7).

      **Da leggere:**
      - `docs/pdr/0001-autenticazione-web.md`: D5, D6, D7, Limiti accettati;
      - `docs/adr/0009-web-ui-authentication.md`: contesto (~22), guard (~99), "Destructive commands" (~129-132);
      - `README.md` e `README.it.md`: righe ~140-170;
      - `src/core/main.cpp`, righe ~150-170: il server NUT parte con `config_ok` anche in AP.

      **Modifiche:**
      - PDR 0001:
        - D7: togliere "In AP i comandi di spegnimento restano bloccati…" e scrivere la motivazione:
          - chi entra in AP ha accesso totale: reset delle credenziali, configurazione NUT, OTA;
          - la protezione è l'ingresso in AP (doppio reset fisico, timeout);
          - le conferme evitano gli errori;
          - comandi e parametri dell'UPS funzionano come in STA;
        - D6: il server NUT resta attivo in AP manuale con configurazione valida, raggiungibile solo dai dispositivi collegati all'AP;
        - una riga di revisione datata 2026-10-16 (US-068);
        - nei "Limiti accettati", sotto "Accesso fisico": chi è collegato all'AP con la password `12345678` ha lo stesso accesso totale, e una password dell'AP diversa resta un lavoro futuro.
      - ADR 0009: aggiornare contesto, guard e la sezione "Destructive commands" con il rimando al PDR. Il blocco è stato rimosso: `runUpsCommand()` non ha più `allow_destructive`.
      - README.md / README.it.md:
        - riga dei comandi di spegnimento senza "In Access Point mode they stay locked (NUT only)";
        - nuova riga sulla pagina **UPS Settings**: parametri modificabili dell'UPS, conferma per quelli che commutano prese/bypass/ECO, reset ai default per i valori salvati sull'ESP32;
        - nella sezione Access Point, una frase esplicita: in AP l'interfaccia dà accesso completo (credenziali, NUT, OTA, comandi e parametri), quindi la finestra AP va tenuta breve.
      - Stessi contenuti in inglese e in italiano.

      **Passi:** PDR, ADR, README.

      **Verifica:** rilettura; `grep -rn "stay locked\|restano bloccati\|server NUT non è attivo" docs/pdr docs/adr README.md README.it.md` non trova nulla.

      **Fatto quando:** documenti e codice dicono la stessa cosa su AP, comandi e server NUT.

      **Blocchi:** nessuno.

