schema: archetipo/plan/v2
spec_code: US-068
body: "---\ntype: plan\ntitle: \"US-068: Pagina \\\"UPS Settings\\\" nella Web UI — Piano di Implementazione\"\ndescription: \"Piano di Implementazione per US-068\"\ntags: [plan, implementation, US-068]\n---\n# US-068: Pagina \"UPS Settings\" nella Web UI — Piano di Implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-10-16\n\n---\n\n## Spec\n\n**Epic:** EP-003 — Server NUT\n**Priorità:** HIGH | **Punti:** 8 (rivisti da 5: oltre alla pagina ci sono il reset delle variabili lato driver, la validazione condivisa con `SET VAR` e la rimozione del blocco in AP dei comandi)\n**Bloccato da:** US-066 e US-067 (in REVIEW, codice su `feature/ups-settings`, commit 3132480 e 9f9b169)\n\n**User Story**\nCome utente autenticato della Web UI, voglio una pagina con i parametri modificabili dell'UPS e i loro valori attuali, in modo da cambiarli dal browser senza un client NUT.\n\n**Criteri di Accettazione (sintesi)**\n- \"UPS Settings\" è la terza voce del menu, dopo \"UPS Commands\"; titolo e layout responsive come gli altri tab.\n- `GET /api/ups/variables`: nome, descrizione, valore, lunghezza massima, valori ENUM, flag lato driver; catalogo vuoto o UPS scollegato → \"No settings available\".\n- `POST /api/ups/variable` con la logica di `SET VAR`: 200 / 400 / 500 / 503, esito mostrato in pagina.\n- Conferma prima di applicare `ups.shutdown`, `outlet.N.switchable`, `input.bypass.*`, `input.eco.switchable`, `input.transfer.bypass.forced`.\n- \"Reset to default\" per le variabili lato driver: cancella il valore in NVS e torna al default del driver.\n- In AP nessun blocco: \"UPS Settings\" e i comandi di spegnimento di \"UPS Commands\" funzionano come in STA, con le conferme (decisione del 2026-10-16).\n- PDR 0001 (D6, D7), ADR 0009 e README spiegano perché; D6 dice che in AP manuale il server NUT resta attivo.\n- Caricamento all'apertura e dopo ogni \"Apply\", senza richieste periodiche.\n\n---\n\n## Soluzione Tecnica\n\nLa pagina riusa lo schema del tab \"UPS Commands\" (US-059/US-062). La logica HTTP sta in funzioni pure di `WebApiJson` (testabili in nativo, perché `web_config_server.cpp` non è compilato nell'env native). Il server web registra solo le route. Nelle API dell'UPS non c'è più distinzione STA/AP: il blocco in AP dei comandi di spegnimento viene rimosso nella stessa spec. La validazione di `SET VAR` viene estratta in una funzione pura condivisa con il server NUT, così le due strade non possono divergere.\n\n### 1. Validazione condivisa (`NutTable.h`)\n- `enum class SetCheck { OK, NOT_WRITABLE, INVALID_AUX, TOO_LONG, INVALID_VALUE }` e `inline SetCheck checkSetValue(const std::vector<RWVariable>& rw, const char* name, const char* value, const RWVariable*& var)`. Sono i passi 5-8 di `set_var()` (`nut_repo/server/netset.c`): ricerca senza distinzione di maiuscole (READONLY se assente), `aux < 1`, `strlen(value) > aux`, ENUM con `strcmp`.\n- `NUTServer::setVar()` usa `checkSetValue()` al posto del codice inline (stesso ordine, stessi errori, stesso WARN `auxdata for %s is invalid`). La presenza (`VAR-NOT-SUPPORTED`, `isVarPresent`) resta nel server NUT: la Web UI lavora solo sul catalogo `LIST RW`, dove una variabile assente è \"non scrivibile\".\n- `RWVariable` ottiene un quarto campo `bool driver_side`. `GenericDriver::writableVariables()` lo imposta per le righe `HU_FLAG_ABSENT` (`outlet.*.desc`) e per `ups.delay.*`. Gli inizializzatori aggregati vanno aggiornati ovunque, senza default member initializer: l'env native usa GCC 5.1.\n\n### 2. Reset delle variabili lato driver\n- `IDriverVarStore::erase(const char* name)` (virtuale pura), `DriverVarStore::remove(vars, name)` (helper puro). `NvsDriverVarStore::erase()` legge il JSON, rimuove la voce e lo riscrive; se la lista resta vuota rimuove la chiave `vars`. Una voce assente non è un errore (true).\n- `IUPSDriver::resetDriverSideValue(const char* name, String& value)` restituisce false per default. `GenericDriver` lo implementa per le righe ABSENT legate con quel nome: toglie l'override da `_absent_overrides`, riporta `value` della riga al `dfl` della tabella e lo restituisce. `ups.delay.*` non passa da qui.\n- `IUSBHostUPS::resetVariable(const char* name)` restituisce `NutTable::SetStatus` (NOT_CONNECTED per default). `USBHostUPS::resetVariable`:\n  - NOT_CONNECTED se l'host o il driver non c'è;\n  - UNKNOWN se la variabile non è nel catalogo con `driver_side`;\n  - prima `erase()` nello store (store assente o erase fallito → FAILED, nulla cambia), poi rimozione dalla cache `_saved_vars`;\n  - `ups.delay.*` → `applyDefaultDelays()`, che senza valore salvato riscrive il default del driver;\n  - `outlet.*.desc` → `resetDriverSideValue()` + `_ups_data.set(name, default)`;\n  - INFO nel System Log `Variable %s reset to default \"%s\"`. Il default è sempre quello del driver collegato, come `offdelay`/`ondelay` senza `ups.conf`.\n\n### 3. API (`WebApiJson`)\n- `generateUpsVariables(IUSBHostUPS*)` → `{\"connected\":bool,\"variables\":[{\"name\",\"description\",\"value\",\"max_length\",\"enum\":[...],\"driver_side\",\"confirm\"}]}`.\n  - Variabili nell'ordine di `getWritableVariables()`. `description` da `NutTable::describe()`, altrimenti `\"Description unavailable\"` come il server NUT. `value` da `getUPSData()`.\n  - Senza host o con UPS scollegato: `connected:false` e lista vuota.\n- `needsConfirmation(const char* name)`: `ups.shutdown`, `outlet.switchable` e `outlet.<N>.switchable`, prefisso `input.bypass.`, `input.eco.switchable`, `input.transfer.bypass.forced`. È un flag `confirm` nel payload; la conferma la chiede la pagina (`window.confirm`, come i comandi).\n- `runUpsVariable(IUSBHostUPS*, const String& body, String& response)`, body `{\"name\",\"value\"}` di al massimo `MAX_COMMAND_BODY_LENGTH`, in quest'ordine:\n  1. JSON non valido, `name` mancante o vuoto, `value` mancante o non stringa → 400 `Invalid request`;\n  2. host assente o `!isConnected()` → 503 `UPS not connected`; `isDataStale()` → 503 `UPS data stale`;\n  3. `checkSetValue()` su `getWritableVariables()`: NOT_WRITABLE e INVALID_AUX → 400 `Variable not writable`; TOO_LONG → 400 `Value too long (max N)`; INVALID_VALUE → 400 `Invalid value`;\n  4. `setVariable(nome canonico, value)`. OK → 200 `{\"success\":true,\"value\":<valore riletto da UPSData>}`. CONVERSION_FAILED → 400 `Invalid value`. UNKNOWN → 400 `Variable not supported`. FAILED → 500 `Rejected by the UPS`. NOT_CONNECTED → 503.\n- `resetUpsVariable(IUSBHostUPS*, const String& body, String& response)`, body `{\"name\"}`. Stessi passi 1-2, poi la variabile deve essere nel catalogo con `driver_side`, altrimenti 400 `Not a driver-side variable`. `resetVariable()`: OK → 200 `{\"success\":true,\"value\":...}`; UNKNOWN → 400; FAILED → 500 `Could not save the setting`; NOT_CONNECTED → 503.\n\n### 4. Server web (`web_config_server.cpp`)\n- Route `GET /api/ups/variables`, `POST /api/ups/variable`, `POST /api/ups/variable/reset`, tutte con `guarded()` (sessione in STA, aperte in AP come tutte le altre API). Le POST chiamano prima `requireJson()` (415, anti-CSRF).\n- Esito di una scrittura: lo registra già l'host (`Variable ... : OK|failed|...`). Il server web registra solo i rifiuti che non arrivano all'host (400/503 prima di `setVariable`), con un WARN `Variable %s = \"%s\" from the Web UI by '%s': %s`, così il System Log ha una riga per ogni tentativo, come per `SET VAR`. In AP, dove non c'è sessione, l'utente è `(AP mode)`. Lo stesso vale per il WARN dei comandi distruttivi, che oggi in AP riporta l'utente configurato.\n\n### 5. Pagina \"UPS Settings\"\n- Il mockup `docs/mockups/US-068/` è la fonte di verità per layout, classi e stati.\n- Nuovo tab `data-target=\"settings\"` subito dopo `commands`, con il titolo della pagina dalla voce del menu.\n- `loadSettings()`:\n  - parte all'apertura del tab e dopo ogni Apply o Reset, con la stessa guardia di sequenza di `loadCommands`;\n  - nessun `setInterval`; il tab non entra in `UPS_POLL_TABS`.\n- Una riga per variabile, costruita con DOM e `textContent` (mai `innerHTML` con dati dell'API):\n  - nome e descrizione;\n  - valore attuale;\n  - input: `<select>` con i valori ENUM, oppure `<input type=\"text\" maxlength=max_length>`;\n  - pulsanti: \"Apply\", più \"Reset to default\" se `driver_side`.\n- Apply:\n  - con `confirm`, chiede `window.confirm` e Annulla non invia nulla;\n  - POST JSON, poi risultato `.cmd-result` success/error con i messaggi per 400/500/503 e \"Network error\";\n  - quindi `loadSettings()`.\n- `connected:false` o lista vuota: \"No settings available\". Nessuno stato di sola lettura.\n- Dopo le modifiche a `data/www/*` si esegue a mano `python scripts/embed_web.py`, che rigenera `index_inlined.html` e `include/network/web_assets.h`.\n\n### 6. Nessun blocco in AP (decisione del 2026-10-16)\nChi entra in AP ha già accesso totale:\n- reset delle credenziali web senza la vecchia password (PDR D5);\n- tutte le API senza login (guard in AP, ADR 0009);\n- `POST /api/nut/config`;\n- OTA senza login.\n\nLa protezione è l'ingresso in AP (doppio reset fisico, timeout di 10 minuti), non i singoli controlli. Le conferme restano, contro gli errori. Si rimuovono:\n- in `WebApiJson`: il parametro `allow_destructive` di `generateUpsCommands` e `runUpsCommand`, il campo `locked` del payload e il 403 `Available via NUT only in Access Point mode`;\n- in `web_config_server.cpp`: gli argomenti `!is_ap_mode` e i commenti relativi;\n- in `bundle.js`/`index.html`/`bundle.css`: `isCommandLocked`, `CMD_LOCK_NOTE`, l'icona lucchetto sui pulsanti, `#cmd-note-power`, `.cmd-group.locked`. Oggi un campo `locked` mancante vale \"bloccato\", quindi frontend e backend cambiano insieme;\n- nei test:\n  - in `test_web_api` i test del 403 e di `locked` diventano test dei distruttivi eseguiti senza blocco;\n  - in `e2e/ups-commands.spec.ts` i due test del lucchetto diventano \"in AP un comando distruttivo chiede conferma e viene eseguito\".\n  È un cambiamento semantico di test esistenti, deciso con l'utente.\n\n### 7. Documentazione\n- **PDR 0001:**\n  - D7: tolto \"In AP i comandi di spegnimento restano bloccati\", aggiunta la motivazione (accesso all'AP = accesso totale; protezione = ingresso in AP; conferme contro gli errori);\n  - D6: \"Durante la modalità AP il server NUT non è attivo\" diventa \"in AP manuale con configurazione valida il server NUT resta attivo, raggiungibile solo dai dispositivi collegati all'AP\", come `src/core/main.cpp`;\n  - una nota di revisione con la data.\n- **ADR 0009:** contesto (riga ~22), sezione \"Destructive commands\" (riga ~129) e guard in AP: il blocco non esiste più, con la motivazione.\n- **README.md / README.it.md:**\n  - la riga dei comandi di spegnimento (~159) perde \"In Access Point mode they stay locked\";\n  - nuova riga sulla pagina **UPS Settings**;\n  - nella sezione Access Point (~161-170), una frase esplicita: in AP l'interfaccia dà accesso completo (credenziali, NUT, OTA, comandi e parametri), quindi la finestra AP va tenuta breve.\n\n### Scelte e deviazioni\n- La Web UI non ha TRACKING: la risposta è sincrona, come `SET VAR` senza TRACKING (US-067).\n- `aux < 1` dà 400 e non 500: la variabile non è scrivibile, e all'UPS non arriva nulla. Il server NUT continua a rispondere `SET-FAILED` come upsd.\n- Data stale → 503, come `DATA-STALE` di upsd. La spec chiede 503 per \"UPS non connesso\".\n- Fuori ambito: una password dell'AP diversa da `12345678`, l'unica modifica che renderebbe la modalità AP davvero più sicura.\n- La conferma è solo lato pagina, come per i comandi: le API non la impongono.\n\n---\n\n## Strategia di Test\n\nTest nativi Unity (`pio test -e native`, con il PATH del toolchain mingw) per tutta la logica, e Playwright per la pagina. Gli attesi si ricavano dalla spec, da `netset.c` e dalle tabelle, mai dall'output del codice.\n\n- **Validazione (`test/test_rw_catalog`):**\n  - `checkSetValue()` per ogni esito, nome con maiuscole diverse → variabile canonica, valore di lunghezza esattamente `aux` accettato;\n  - `driver_side` vero per `outlet.desc`/`outlet.1.desc` e `ups.delay.*`, falso per `battery.charge.low`;\n  - `test_nut_server` resta verde senza modifiche.\n- **Reset:**\n  - `DriverVarStore::remove()` (`test/test_command_catalog`);\n  - `GenericDriver::resetDriverSideValue()` (`test/test_rw_catalog`): override tolto, valore tornato a `Main Outlet`, nome non ABSENT → false;\n  - `applyDefaultDelays()` senza il valore rimosso → default.\n- **API (`test/test_web_api`):** il mock implementa `getWritableVariables`, `setVariable` e `resetVariable`.\n  - Payload GET con descrizione, fallback `Description unavailable`, ENUM, `driver_side`, `confirm`, UPS scollegato.\n  - Ogni ramo di `runUpsVariable`/`resetUpsVariable`, con lo stato HTTP e il messaggio.\n  - 503; nome canonico passato a `setVariable`; nessuna chiamata all'host per i 400 di forma.\n  - Comandi: un distruttivo viene eseguito senza parametri di modalità e il payload non ha più `locked`.\n  - `needsConfirmation()` sui nomi della spec e su un nome simile che non deve chiedere conferma (`outlet.1.desc`).\n- **Regressione:** suite nativa completa e build `esp32-s3-standard`.\n\n### Test E2E — Simulazione Utente\n\n**Framework:** Playwright (`playwright.config.ts`, `e2e/support/webui.ts` → `serveIndex`), API simulate con `page.route` come in `e2e/ups-commands.spec.ts`.\n**Video demo:** previsto (la Dimostrazione è filmabile). Lo registra `archetipo-review`, non l'implementazione.\n\n| Scenario | Flusso utente |\n|---|---|\n| Apertura del tab | L'utente apre \"UPS Settings\", terza voce del menu. Il titolo della pagina cambia e le righe mostrano nome, descrizione e valore. Le variabili ENUM hanno una select, le altre un input con `maxlength`. |\n| Apply riuscito | Imposta `battery.charge.low` a 30 e preme Apply. La POST ha corpo JSON `{name,value}`. Compaiono l'esito \"Applied\" e il valore aggiornato, ricaricato con una nuova GET. |\n| Errori | Le risposte 400, 500 e 503 mostrano ciascuna il proprio messaggio, e il valore resta quello precedente. |\n| Conferma | Su `ups.shutdown` compare il dialog con il nome. Annulla non invia nulla, OK invia. |\n| Reset to default | Su `ups.delay.shutdown` \"Reset to default\" invia la POST di reset e mostra il nuovo valore. Le variabili non lato driver non hanno il pulsante. |\n| Modalità AP | Con `/api/auth/status` in `ap_mode`, \"UPS Settings\" funziona come in STA e Apply invia la POST. In \"UPS Commands\" un comando distruttivo chiede conferma e viene eseguito, senza lucchetto né nota. |\n| Vuoto | Con `connected:false` o lista vuota compare \"No settings available\". |\n| Nessun polling | Dopo il caricamento, in 6 s non partono altre GET di `/api/ups/variables`. |\n| Mobile | A 375x812 non c'è scroll orizzontale. |\n\n---\n\n> \U0001F3A8 Mockup della spec disponibili in `docs/mockups/US-068/`\n\n_Piano generato tramite ARchetipo Planning — 2026-10-16_\n"
tasks:
  - id: TASK-01
    title: Validazione condivisa di SET VAR (checkSetValue) e flag driver_side nel catalogo
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** una sola funzione pura decide se un valore può essere scritto (passi 5-8 di `set_var()`), usata dal server NUT e poi dalla Web UI. Inoltre il catalogo `LIST RW` dice quali variabili sono lato driver.

      **Da leggere:**
      - `lib/USBHostUPS/src/NutTable.h`, intorno a `struct RWVariable` (riga ~578) e `SetStatus`;
      - `lib/NUTServer/src/NUTServer.cpp`: `setVar()`, `findWritable()` (statica, righe ~42-55), passi READONLY / aux / TOO-LONG / INVALID-VALUE;
      - `lib/USBHostUPS/src/GenericDriver.cpp`: `writableVariables()` (riga ~608);
      - `nut_repo/server/netset.c`: `set_var()`.

      **Modifiche:**
      - `NutTable.h`:
        - `enum class SetCheck { OK, NOT_WRITABLE, INVALID_AUX, TOO_LONG, INVALID_VALUE };`
        - `inline SetCheck checkSetValue(const std::vector<RWVariable>& rw, const char* name, const char* value, const RWVariable*& var)`:
          - ricerca con `equalsIgnoreCase` → NOT_WRITABLE se assente;
          - `aux < 1` → INVALID_AUX;
          - `strlen(value) > aux` → TOO_LONG;
          - `enums` non vuoto e nessun `strcmp` uguale → INVALID_VALUE;
          - `var` punta alla voce trovata anche negli esiti di errore successivi alla ricerca.
        - Commento con il riferimento a `netset.c`.
      - `RWVariable`: quarto campo `bool driver_side`. Aggiorna ogni inizializzatore aggregato (cerca `RWVariable` e `rw = {` in `lib/` e `test/`) senza default member initializer. `GenericDriver::writableVariables()` lo imposta a true per le righe con `HU_FLAG_ABSENT` e per `ups.delay.*`.
      - `NUTServer::setVar()`:
        - sostituisce i passi READONLY → INVALID-VALUE con `checkSetValue()`, mappando NOT_WRITABLE → READONLY, INVALID_AUX → SET-FAILED con il WARN `auxdata for %s is invalid` (invariato), TOO_LONG → TOO-LONG, INVALID_VALUE → INVALID-VALUE;
        - rimuove `findWritable()` se non serve più.

      **Passi:** tipi e funzione; campo `driver_side`; refactoring di `setVar()`; build.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_server -f test_rw_catalog -f test_record_replay` verde senza modificare i test esistenti, e build `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`.

      **Fatto quando:** il server NUT risponde come prima a ogni `SET VAR` e la logica dei passi 5-8 esiste in un solo punto.

      **Blocchi:** se un test esistente di `test_nut_server` cambia esito, fermarsi: il refactoring deve essere a comportamento invariato.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — `SetCheck`, `checkSetValue()`, campo `driver_side`
      - lib/USBHostUPS/src/GenericDriver.cpp — `driver_side` in `writableVariables()`
      - lib/NUTServer/src/NUTServer.cpp — `setVar()` usa `checkSetValue()`

      ## Criteri di Completamento
      - [ ] `checkSetValue()` pura, con riferimento a `set_var()`
      - [ ] `driver_side` vero solo per righe ABSENT e `ups.delay.*`
      - [ ] `test_nut_server` e `test_record_replay` verdi senza modifiche
      - [ ] build ok
    ref: TASK-01
  - id: TASK-02
    title: Test di checkSetValue e del flag driver_side
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** fissare con test nativi la validazione condivisa e il flag lato driver.

      **Da leggere:** `test/test_rw_catalog/test_main.cpp` (driver e usage sintetici di US-066/067).

      **Modifiche:** in `test/test_rw_catalog/test_main.cpp`:
      - `checkSetValue()`:
        - OK con nome canonico, e con maiuscole diverse (`var->name` è il canonico);
        - NOT_WRITABLE per un nome assente;
        - INVALID_AUX con aux 0;
        - TOO_LONG con `aux + 1` caratteri, OK con esattamente `aux`;
        - INVALID_VALUE fuori ENUM e per `Medium` contro `medium` (`strcmp`);
        - valore vuoto con ENUM → INVALID_VALUE;
      - `writableVariables()` con un descriptor Eaton sintetico:
        - `outlet.desc` e `ups.delay.shutdown` con `driver_side` vero;
        - `battery.charge.low` con `driver_side` falso.

      **Passi:** scrivere i test e registrarli in tutte le liste `RUN_TEST` del file.

      **Verifica:** `pio test -e native -f test_rw_catalog` (con il PATH mingw).

      **Fatto quando:** ogni valore di `SetCheck` ha almeno un test.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_rw_catalog/test_main.cpp — test di `checkSetValue()` e `driver_side`

      ## Criteri di Completamento
      - [ ] tutti gli esiti di `SetCheck` coperti, compreso il limite esatto di lunghezza
      - [ ] `driver_side` verificato su righe ABSENT, `ups.delay.*` e righe HID
      - [ ] suite verde
    ref: TASK-02
  - id: TASK-03
    title: Reset ai default delle variabili lato driver (store, driver, host)
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** cancellare un valore salvato in NVS e tornare al default del driver collegato, senza riavvio.

      **Da leggere:**
      - `lib/USBHostUPS/src/DriverVarStore.h`;
      - `src/core/driver_var_store.h/.cpp`;
      - `lib/USBHostUPS/src/IUPSDriver.h` (`setDriverSideValue`);
      - `lib/USBHostUPS/src/GenericDriver.h/.cpp` (`_absent_overrides`, `setDriverSideValue`, `bindNutTable`);
      - `lib/USBHostUPS/src/NutTable.h` (`bind`, `Bound`, `dfl` delle righe ABSENT);
      - `lib/USBHostUPS/src/IUSBHostUPS.h` (`setVariable`);
      - `lib/USBHostUPS/src/USBHostUPS.cpp` (`runSetVariable`, `applyDefaultDelays`, `applySavedDriverValues`, `setVariable`).

      **Modifiche:**
      - `DriverVarStore.h`:
        - `virtual bool erase(const char* name) = 0;` in `IDriverVarStore`;
        - `inline bool DriverVarStore::remove(std::vector<std::pair<String, String>>& vars, const char* name)`, che restituisce true se ha tolto qualcosa.
      - `NvsDriverVarStore::erase`:
        - legge, chiama `remove()` e riscrive;
        - se la lista resta vuota, rimuove la chiave `vars`;
        - una voce assente restituisce true;
        - un errore di scrittura restituisce false;
        - JSON corrotto: lo scarta, come in `save()`.
      - `IUPSDriver`: `virtual bool resetDriverSideValue(const char* name, String& value) { return false; }`.
      - `GenericDriver::resetDriverSideValue`:
        - toglie l'override con quel nome;
        - per ogni riga ABSENT legata con quel nome riporta `value` al `dfl` della tabella e `has` a true;
        - restituisce il default in `value`; false se nessuna riga ABSENT ha quel nome.
      - `IUSBHostUPS`: `virtual NutTable::SetStatus resetVariable(const char* name) { return NutTable::SetStatus::NOT_CONNECTED; }`, con il commento sull'ordine dei lock come `setVariable`.
      - `USBHostUPS::resetVariable`:
        - NOT_CONNECTED se `!isConnected()` o `!_driver`;
        - UNKNOWN se `name` non è in `getWritableVariables()` con `driver_side`;
        - `_var_store` assente o `erase()` false → FAILED, nulla cambia. L'erase avviene fuori da `_mutex`, perché scrive in flash, come `save()` in `runSetVariable`;
        - poi sotto `_mutex`: `DriverVarStore::remove(_saved_vars, canonico)`;
        - per `ups.delay.*` → `applyDefaultDelays()`, che riscrive il default perché il valore salvato non c'è più;
        - per gli altri nomi → `_driver->resetDriverSideValue()` + `_ups_data.set(nome, default)`;
        - log INFO `Variable %s reset to default "%s"` oppure WARN `Variable %s: reset failed` / `not supported` / `UPS not connected`.

      **Passi:** store; driver; host; build.

      **Verifica:** `pio test -e native` verde (store e driver compilano in nativo) e build `esp32-s3-standard`.

      **Fatto quando:** un reset riporta `ups.delay.*` e `outlet.*.desc` al default del driver e il valore non viene più riapplicato alla connessione successiva.

      **Blocchi:** se `applyDefaultDelays()` non riscrive il default dopo la rimozione (per esempio perché lo salta quando la chiave esiste), fermarsi e riportarlo invece di cambiare la semantica di US-067.

      ## File Coinvolti
      - lib/USBHostUPS/src/DriverVarStore.h — `erase()`, `DriverVarStore::remove()`
      - src/core/driver_var_store.h — dichiarazione di `erase()`
      - src/core/driver_var_store.cpp — `erase()` su NVS
      - lib/USBHostUPS/src/IUPSDriver.h — `resetDriverSideValue()`
