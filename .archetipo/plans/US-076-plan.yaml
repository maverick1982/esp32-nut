schema: archetipo/plan/v2
spec_code: US-076
body: |-
  # US-076: Tabella unica APC (apc-hid) — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-10-29

  ---

  ## Spec

  **Epic:** EP-001 — Gestione USB Host
  **Priorità:** MEDIUM | **Punti:** 5 | **Bloccato da:** US-073 (DONE). Anche US-074 (comandi da tabella), US-107 (`ups.alarm`, token di stato, `input.transfer.reason`) e US-075 (CyberPower, 308e95a) sono DONE: il motore e il modello da seguire ci sono già.

  `apcHid2Nut()` riceve tutte le righe di `apc_hid2nut` (`nut_repo/drivers/apc-hid.c:332-470`) nell'ordine upstream. `APCDriver` perde le mappature scritte a mano e tiene solo gli hook non tabellari: `splitProduct`/`formatDeviceStrings` (#76), il poll ridotto e `requestLength` dei Back-UPS BX (#60). Si applicano le regole dell'ADR 0011, come per Eaton e CyberPower.

  ---

  ## Cosa dice il dump delle 13 fixture (pianificazione, 2026-10-29)

  Dal dump dei descriptor (lo stesso metodo di US-075, da rifare nel TASK-01) risulta:

  - **Percorsi vendor APC.** `HIDParser` dà un nome solo a `APCBattReplaceDate` (`NUTUsages.h`). Tutti gli altri usage `0xFF86xxxx` hanno percorsi esadecimali, per esempio `UPS.0xFF860005.0xFF86007C` per `APCGeneralCollection.APCDelayBeforeReboot`. Le mappature di oggi su `UPS.APCGeneralCollection.*` e `UPS.APCEnvironment.*` non scattano quindi mai. Con la tabella tradotta in esadecimale, come per `APCSensitivity` in US-066, `ups.timer.reboot` (riga 371) compare su BGM2200, BX750MI, BX1500G, CS750RS, ES700G e RS900MI, e `ups.timer.shutdown` (370) sull'ES700G.
  - **`APCStatusFlag`** (`UPS.PowerSummary.0xFF860060`, riga 399, BOOL con `HU_FLAG_QUICK_POLL`) c'è su BX1500G, CS750RS, ES700G, RS900MI e XS700U. Con il valore 0 dà il token `OFF` (US-107), con 8 o 16 lo toglie. Entra anche nel quick poll se il suo report non c'è già.
  - **`APCLineFailCause`** (`UPS.Input.0xFF860052`, righe 403-404) c'è su 9 fixture. Con i valori 1/2/4/8/9 o 7 dà `vrange`/`frange` e quindi `input.transfer.reason` (US-107), anche con l'UPS da rete, come upstream.
  - **Formati upstream diversi da quelli di oggi** (differenze visibili):
    - `battery.voltage` `%.1f` (oggi due decimali, per esempio `27.90` → `27.9`);
    - `ups.load` `%.1f` dalla riga 352 `UPS.Output.PercentLoad` (Smart-UPS 750 #78, CS500: `40` → `40.0`), `%.0f` dalla riga 353 `PowerConverter.PercentLoad` (Back-UPS: invariato);
    - `output.voltage.nominal` `%.1f` (`230` → `230.0`);
    - `output.current` `%.2f`, nuova (Smart-UPS #78).
  - **Date.**
    - `PowerSummary.APCBattReplaceDate` è la seconda riga di `battery.mfr.date` (348), mentre oggi APCDriver la scrive in `battery.date`. `Battery.APCBattReplaceDate` resta `battery.date` (349, CS750RS).
    - `date_conversion` e `apc_date_conversion` danno `not set` per 0: oggi la mappatura generica salta lo 0.
  - **Comandi.**
    - Il Back-UPS CS (CS500) ha la riga diretta `shutdown.return` (461, `UPS.Output.0xFF86007C`, valore 1), che il ramo con tabella di `CommandCatalog` oggi non gestisce: con tabella ignora apposta il caso APC CS.
    - `test.panel.*` stanno su `UPS.0xFF860072` e `UPS.PowerSummary.0xFF860072` (440-443); `shutdown.reboot` su `APCGeneralCollection` (459).
  - **BX750MI.** Non ha `APCStatusFlag`: il suo quick poll non cambia. Il BX1500G sì (vedi decisioni).

  ---

  ## Decisioni prese in pianificazione (da confermare in review)

  Seguono la fedeltà a upstream già applicata a Eaton e CyberPower.

  1. **Formati come upstream.** `battery.voltage`, `ups.load` dalla riga 352, `output.voltage.nominal` e `output.current` prendono il formato della riga. Le differenze vanno nelle note: per Home Assistant `40.0` e `40` sono lo stesso numero.
  2. **Righe vendor tradotte in esadecimale** (`apc_usage_lkp` → `0xFF86xxxx`), con il nome upstream nel commento. Chiavi nuove dove legano: `ups.timer.*` da `APCGeneralCollection`, `ambient.*` da `APCEnvironment`, `output.current`.
  3. **Stato e allarmi dalle sole righe BOOL di apc-hid** (384-404), come per CPS ed Eaton: tutti i percorsi di stato generici si superano.
     - `APCStatusFlag` → `OFF` e `APCLineFailCause` → `input.transfer.reason` arrivano dalla tabella.
     - `FullyCharged`, `FullyDischarged` e `CommunicationLost` non sono letti da apc-hid; oggi `ups.status.comm_lost` è una chiave interna, mai mostrata.
  4. **Quick poll come upstream.** La riga 399 ha `HU_FLAG_QUICK_POLL`: il report di `APCStatusFlag` entra nel quick poll dove non c'era. Sul BX1500G il quick poll resta a 10 s e i report statici si leggono una volta sola (#60). Se la baseline mostra un report in più su un BX, la differenza va nel test e nelle note.
  5. **`shutdown.return` diretto.** Nel ramo con tabella di `CommandCatalog`, una riga `HU_TYPE_CMD` `shutdown.return` legata vale come in `instcmd()` (`usbhid-ups.c:1112`).
     - Si scrive il suo campo con il parametro, se c'è, altrimenti con `dfl`.
     - Il comando compare in LIST CMD se la riga è legata oppure se ci sono entrambi i ritardi.
     - È il caso APC CS di US-058, ora preso dalla tabella.
  6. **Estensioni (regola 2).**
     - Restano: `input.frequency` (apc-hid non ha la riga), `ups.realpower` misurato da ActivePower e la stima quando manca, `ups.power`, `ups.power.nominal` (`Flow.ConfigApparentPower`), `ups.temperature`, `battery.capacity`.
     - Sparisce `battery.capacity.full`.
  7. **`apc_fix_report_desc` non serve.** Corregge LogMin/LogMax di `UPS.Input.Voltage` sul Back-UPS XS 1400U, ma `extractUsage()` non taglia al Logical Maximum, come per CPS. Va solo verificato e scritto nel commento del driver.
  8. **Fuori scope**, hook upstream che il firmware non replica oggi e che questa spec non cambia:
     - `general_apc_check` (`max_report_size` per "Back-UPS ES 525"/"CS"), oltre a quello che già fa `requestLength` sui BX;
     - `disable_interrupt_pipe` per i PID 0x0003/0x0004.

  ---

  ## Soluzione Tecnica

  ### 1. Motore (`NutTable.h`)
  - **`Conv::ApcDate`** (`apc_date_conversion_fun`, `apc-hid.c:114-139`): `not set` per 0; altrimenti anno, mese e giorno in BCD (anno ≥ 70 → 1900+, altrimenti 2000+) e `%04d/%02d/%02d`. Solo decode: le righe 348-349 sono RO.
  - **Lookup verbatim:**
    - `kApcStatusFlag` (`apcstatusflag_info`: 8 `!off`, 16 `!off`, 0 `off`);
    - `kApcLineFailCauseVrange` (1, 2, 4, 8, 9 `vrange`; 0 `!vrange`);
    - `kApcLineFailCauseFrange` (7 `frange`; 0 `!frange`).

    `kNobatteryInfo`, `kShutdownimmInfo`, `kTimelimitexpiredInfo`, `kTestRead`, `kBeeperInfo` e `kApcSensitivity` ci sono già.

  ### 2. `apcHid2Nut()`
  - Tutte le righe 334-467 in ordine, con il commento `// apc-hid.c:N <path upstream>`.
  - **Percorsi:** `APCGeneralCollection` `0xFF860005`, `APCEnvironment` `0xFF860006`, `APCProbe1` `0xFF860007`, `APCLineFailCause` `0xFF860052`, `APCStatusFlag` `0xFF860060`, `APCSensitivity` `0xFF860061`, `APCPanelTest` `0xFF860072`, `APCDelayBeforeReboot/Shutdown/Startup` `0xFF86007C/7D/7E`. `APCBattReplaceDate` resta col nome, perché il parser lo nomina.
  - **Conversioni:** `ApcDate` (348-349), `BatteryDate` (347, 374-375), `KelvinCelsius` (345, 423), `StringId` (346), `Lookup` per test, beeper e stati.
  - **Righe escluse o commentate:**
    - `ups.delay.*` (355-356, 361-362, 367-368) restano escluse come oggi;
    - le due righe commentate `APCProbe2` (426-427) si citano come commento.
  - **Comandi 434-467**, con `DEFAULT_OFFDELAY`/`DEFAULT_ONDELAY` `"20"`/`"30"` (`usbhid-ups.h`).
  - **Test:** `checkTableCoverage("nut_repo/drivers/apc-hid.c", "static hid_info_t apc_hid2nut[]", ..., "inline const HidInfo* apcHid2Nut", "inline const HidInfo* cpsHid2Nut")` e il test dei formati.

  ### 3. `CommandCatalog` (ramo con tabella)
  - **`shutdown.return` diretto**, come descritto nella decisione 5.
  - Il ramo senza tabella (`apcCsReturnField`) resta per gli altri driver fino a US-079.

  ### 4. `APCDriver`
  - **Override:** `commandTable()` (`apcHid2Nut`) e `supersededGenericPaths()`.
  - **Percorsi superati**, copiati carattere per carattere da `GenericDriver::decodeReport()`, per le chiavi che la tabella possiede:
    - stato, tutti come in CPS;
    - `battery.charge`/`.low`, `battery.runtime` (2), `battery.voltage` (3), `battery.voltage.nominal` (2), `battery.temperature`, `battery.mfr.date` (`Battery.ManufacturerDate`, `BatterySystem.Battery.Date`, `Battery.Date`);
    - `ups.load` (3), `ups.timer.shutdown`, `ups.test.result` (3), `ups.beeper.status` (3), `ups.mfr.date` (2), `ups.realpower.nominal` (3);
    - `input.voltage` (3), `input.voltage.nominal` (2), `input.transfer.*` (6), `output.voltage` (2), `output.voltage.nominal` (2), `output.frequency` (2);
    - `battery.capacity.full`.
  - **Restano:** le estensioni della decisione 6.
  - **Si tolgono:** `decodeReport`, `_map`, `setup` (se resta solo la base), le mappature.
  - **Non cambiano:** `onLoop` (BX), `quickPollMs`, `maxReportAgeMs`, `pollStaticReportsOnce`, `requestLength`, `splitProduct`, `formatDeviceStrings`.

  ---

  ## Strategia di Test

  Nessuna superficie UI: niente mockup, e2e o video. Prova sul campo affidata a un tester APC (assunzione della spec).

  - **Baseline prima del codice** (TASK-01):
    - snapshot completo delle 13 fixture APC, con lo stesso `FixtureReplayRunner::snapshot()` di US-075;
    - liste quick/full del poll di ognuna, da `buildPollLists()` attraverso una sonda di test che deriva da `APCDriver`.

    Dopo la migrazione ogni differenza va commentata con la riga upstream o con la decisione del piano.
  - **`test_nut_table`:**
    - `ApcDate`: `0x102202` → `2002/10/22`, `0x102270` → `1970/10/22`, 0 → `not set`;
    - i tre lookup nuovi;
    - copertura di `apc-hid.c` e formati.
  - **`test_command_catalog`:**
    - sulle 13 fixture, i comandi con `apcHid2Nut()` confrontati col ramo senza tabella; le differenze vanno motivate;
    - CS500: `shutdown.return` è una scrittura di 1 su `UPS.Output.0xFF86007C`, mai `shutdown.reboot` su quel campo;
    - `test.panel.*` su `UPS.0xFF860072`.
  - **`test_apc_driver`:**
    - i test di oggi con decode + postDecode;
    - nuovi casi: `ups.load` `%.1f` contro `%.0f` secondo la riga; `battery.voltage` con un decimale; `APCStatusFlag` 0 → `OFF` e 8 → nessun token; `APCLineFailCause` 8 → `input.transfer.reason`; timer di `APCGeneralCollection`; estensioni mantenute; `battery.capacity.full` assente.
    - I test BX restano invariati.
  - **`test_record_replay`:**
    - righe legate per ogni fixture, ricavate a mano;
    - LIST CMD/RW;
    - BGM2200 (tre fixture: `OL DISCHRG` e valori senza zeri, #98);
    - BX750MI (poll e set);
    - baseline `ups.status` (con `OFF`/`ALARM` motivati se compaiono);
    - snapshot e liste di poll con le differenze commentate.
  - **Mutazioni** (ognuna deve far fallire almeno un test): togliere un percorso superato; togliere `shutdown.return` diretto; togliere una citazione da `apcHid2Nut()`; invertire il lookup `kApcStatusFlag`.
  - **Regressione:** suite nativa completa a blocchi, build `esp32-s3-standard` da PowerShell. Con l'ok dell'utente, OTA sull'Eaton 3S con `nut_snapshot.py` prima e dopo (`GenericDriver` e `CommandCatalog` cambiano).

  ---

  ## Rischi e note

  - **#60.** Un report in più nel quick poll di un BX è il rischio maggiore. La baseline del poll lo rende visibile; se capita va segnalato all'utente prima di accettarlo.
  - **#98.** BGM2200: i campi ripetuti letti dalla prima occorrenza (parser, US-098) e `OL DISCHRG` (US-101, `computeUPSStatusString`) non stanno nella tabella. `bind()` lega il primo usage del percorso, in ordine di descriptor, quindi la scelta del campo è coerente.
  - **Tester.** Smart-UPS (miskor-bgd, Sr-psycho) e Back-UPS XS 1500M (JSylvia007). Testo come bozza, pubblicazione solo su richiesta dell'utente.
  - **Note di rilascio** in `docs/releases/v1.12.0.md`.

  ---

  _Piano generato con ARchetipo Planning — 2026-10-29_
tasks:
  - id: TASK-01
    title: 'Baseline: snapshot e liste di poll delle 13 fixture APC'
    type: Test
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** fissare, prima del codice, quello che il firmware pubblica e chiede oggi su ogni fixture APC.

      **Leggi:**
      - `test/test_record_replay/FixtureReplayRunner.h` (`snapshot()`, `replay()`);
      - `test/test_record_replay/test_main.cpp` (`test_cyberpower_snapshot_baseline`);
      - `lib/USBHostUPS/src/GenericDriver.h` (`buildPollLists`, `PollItem`).

      **Modifica:**
      1. Generalizza il test di US-075: un helper `checkSnapshots(const SnapshotCase*, size_t)` usato da `test_cyberpower_snapshot_baseline` e da un nuovo `test_apc_snapshot_baseline`, con 13 costanti `kApcSnapshot_<fixture>` prese dal codice di oggi.
      2. Liste di poll: in `FixtureReplayRunner.h` una sonda di test `struct ApcPollProbe : APCDriver { using GenericDriver::buildPollLists; };`.
         - Per ogni fixture: `replay()`, poi `ApcPollProbe` con `setup()`, `onLoop` equivalente (il flag BX viene da `ups.model`: chiama `loop()` una volta, oppure esponi `onLoop` con `using`), poi `buildPollLists(&host, quick, full)`.
         - Il risultato è una stringa `quick: 1/3 8/1 ... | full: ...` (`id/tipo`).
         - Costanti `kApcPoll_<fixture>` nel nuovo test `test_apc_poll_baseline`.
      3. Commento sopra le costanti con le usage rilevanti di ogni fixture (dump temporaneo, NON committato):
         - percorsi `0xFF86xxxx`, `Output.PercentLoad` / `PowerConverter.PercentLoad`, `Output.Current`, `Output.APCDelayBeforeReboot`;
         - presenza di `APCStatusFlag` e `APCLineFailCause`, con il report in cui stanno.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_record_replay` verde sul codice di oggi.

      **Fatto:** baseline deterministica, nessun file di produzione modificato.

      **Blocchi:** se `buildPollLists` non è raggiungibile senza toccare la produzione, fermati e proponi l'alternativa: richieste registrate dal mock host durante `loop()`.

      ## File Coinvolti
      - test/test_record_replay/FixtureReplayRunner.h — sonda del poll
      - test/test_record_replay/test_main.cpp — helper degli snapshot, baseline APC e poll

      ## Criteri di Completamento
      - [ ] 13 snapshot e 13 liste di poll verdi sul codice attuale
      - [ ] Il test CPS usa lo stesso helper ed è ancora verde
    ref: TASK-01
  - id: TASK-02
    title: 'NutTable: apc_date_conversion e lookup di stato APC'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** dare al motore le conversioni di apc-hid.

      **Leggi:**
      - `lib/USBHostUPS/src/NutTable.h` (`Conv`, `decode`, i lookup di stato, `Conv::BatteryDate`);
      - `nut_repo/drivers/apc-hid.c:113-205`.

      **Modifica:**
      1. `Conv::ApcDate` con il commento `apc_date_conversion (apc-hid.c)`. In `decode()`:
         - `(long)v == 0` → `not set`;
         - poi `year = (v & 0xf) + 10*((v>>4) & 0xf)`, `month = ((v>>16) & 0xf) + 10*((v>>20) & 0xf)`, `day = ((v>>8) & 0xf) + 10*((v>>12) & 0xf)`, anno +1900 se ≥ 70, altrimenti +2000; `snprintf("%04d/%02d/%02d")`.
      2. Lookup verbatim con il nome upstream:
         - `kApcStatusFlag` `{ {8,"!off"}, {16,"!off"}, {0,"off"} }`;
         - `kApcLineFailCauseVrange` `{ {1,"vrange"}, {2,"vrange"}, {4,"vrange"}, {8,"vrange"}, {9,"vrange"}, {0,"!vrange"} }`;
         - `kApcLineFailCauseFrange` `{ {7,"frange"}, {0,"!frange"} }`.
      3. Nessuna modifica a `encode()`: le righe con `ApcDate` sono RO.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_table -f test_apc_driver` verde.

      **Fatto:** API pronta, compilata con GCC 5.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — `Conv::ApcDate`, tre lookup

      ## Criteri di Completamento
      - [ ] Suite indicate verdi
    ref: TASK-02
  - id: TASK-03
    title: Test di apc_date_conversion e dei lookup APC
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** coprire il TASK-02 con attese da `apc-hid.c`.

      **Leggi:** `test/test_nut_table/test_main.cpp` (`conv()`, `statusToken`, i test CPS come modello).

      **Modifica:** test nuovi, registrati in `main()`:
      - `test_apc_date`: `0x102202` → `2002/10/22` (l'esempio del commento upstream); `0x102270` → `1970/10/22`; `0x092569` → `2069/09/25` (anno 69 < 70: +2000, regola upstream); 0 → `not set`;
      - `test_apc_status_lookups`:
        - `kApcStatusFlag`: 0 → `off` (bit OFF), 8 e 16 → `!off`, 4 → nessun token;
        - `kApcLineFailCauseVrange`: 8 → `vrange`, 0 → `!vrange`, 7 → nessun token;
        - `kApcLineFailCauseFrange`: 7 → `frange`, 0 → `!frange`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_table` verde. Mutazione: invertire `off`/`!off` in `kApcStatusFlag` deve far fallire il test.

      **Fatto:** test verdi, mutazione colta.

      **Blocchi:** se un'attesa differisce da upstream, vale upstream.

      ## File Coinvolti
      - test/test_nut_table/test_main.cpp — test nuovi

      ## Criteri di Completamento
      - [ ] Casi elencati verdi
      - [ ] Mutazione colta
    ref: TASK-03
  - id: TASK-04
    title: 'apcHid2Nut(): tutte le righe di apc_hid2nut, copertura e formati'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** `apcHid2Nut()` con tutte le righe 334-467 nell'ordine upstream.

      **Leggi:**
      - `nut_repo/drivers/apc-hid.c:211-286` (`apc_usage_lkp`) e 332-470;
      - `lib/USBHostUPS/src/NutTable.h` (`apcHid2Nut()` di oggi e `cpsHid2Nut()` come modello);
      - `lib/USBHostUPS/src/NUTUsages.h` (nomi standard; `APCBattReplaceDate` è l'unico nome APC);
      - `test/test_nut_table/test_main.cpp` (`checkTableCoverage`, `checkSupportedFormats`);
      - `test/test_rw_catalog/test_main.cpp` (`full_table`).

      **Modifica:**
      1. Riscrivi `apcHid2Nut()`, ogni riga preceduta da `// apc-hid.c:N <path upstream>`. Un commento in testa elenca le traduzioni dei nomi vendor:
         - `APCGeneralCollection` `0xFF860005`, `APCEnvironment` `0xFF860006`, `APCProbe1` `0xFF860007`;
         - `APCLineFailCause` `0xFF860052`, `APCStatusFlag` `0xFF860060`, `APCSensitivity` `0xFF860061`, `APCPanelTest` `0xFF860072`;
         - `APCDelayBeforeReboot` `0xFF86007C`, `APCDelayBeforeShutdown` `0xFF86007D`, `APCDelayBeforeStartup` `0xFF86007E`.
      2. Righe e conversioni:
         - 345 e 423 `KelvinCelsius`; 346 `StringId`; 347 RW di oggi; 348-349 `ApcDate`;
         - 352 `%.1f`; 353 `%.0f`;
         - 357-359, 363-365 e 369-371 timer con `HU_FLAG_QUICK_POLL`; le esclusioni `ups.delay.*` di oggi restano;
         - 372 `kTestRead`, 373 `kBeeperInfo`, 374-375 `BatteryDate`;
         - BOOL 384-399 e 403-404 con i lookup e i flag upstream;
         - 418 `%.1f`, 419 `%.2f`, 424 `%.1f`;
         - righe RW di oggi al loro posto.
      3. Commenti per le righe senza riga attiva:
         - 426-427 (`APCProbe2`, commentate upstream con `/* */`): `// ambient.* (apc-hid.c:426-427) commented out upstream`;
         - le esclusioni `ups.delay.*` restano.
      4. Comandi 434-467, `HU_TYPE_CMD`, dfl `"20"`/`"30"` per `DEFAULT_OFFDELAY`/`DEFAULT_ONDELAY` (`usbhid-ups.h`).
      5. Test in `test_nut_table`:
         - `test_apc_table_covers_every_upstream_row`: `checkTableCoverage(... "inline const HidInfo* apcHid2Nut", "inline const HidInfo* cpsHid2Nut")`;
         - `test_apc_rows_have_supported_formats`.
      6. In `test_rw_catalog`, `full_table` vale vero anche per apc. Il numero di righe RW resta 9.

      **Verifica:**
      - `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_table -f test_rw_catalog` verde.
      - Mutazione: togliere il commento della 426-427 fa fallire la copertura.

      **Fatto:** tabella completa.

      **Blocchi:** `test_apc_driver` e `test_record_replay` possono fallire fino al TASK-07: non correggerli qui.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — `apcHid2Nut()`
      - test/test_nut_table/test_main.cpp — copertura e formati
      - test/test_rw_catalog/test_main.cpp — `full_table`

      ## Criteri di Completamento
      - [ ] Copertura di `apc-hid.c` verde
      - [ ] Le RW APC restano 9
    ref: TASK-04
  - id: TASK-05
    title: 'CommandCatalog: riga diretta shutdown.return nel ramo con tabella'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** una riga `HU_TYPE_CMD` `shutdown.return` legata vale come in `instcmd()` (`usbhid-ups.c:1112`). È il caso Back-UPS CS di `apc-hid.c:461`.

      **Leggi:**
      - `lib/USBHostUPS/src/CommandCatalog.h` (`buildFromTable`, `resolveShutdownSteps`, `apcCsReturnField`, `single`);
      - `nut_repo/drivers/usbhid-ups.c:1030-1120` e 1640-1656.

      **Modifica:**
