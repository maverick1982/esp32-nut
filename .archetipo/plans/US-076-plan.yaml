    title: Regressione completa, build, mutazioni, OTA sul 3S e bozza per i tester
    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Descrizione
      **Obiettivo:** chiudere con suite completa, build e verifica che l'Eaton non cambi.

      **Leggi:** `scripts/nut_snapshot.py`; gli script OTA e log di US-075 (scratchpad della sessione, `hw/ota_upload.py`, `hw/fetch_logs.py`).

      **Passi:**
      1. Suite nativa completa in blocchi da circa 11 suite in foreground (`PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f ...`, limite 600 s). Annota il totale.
      2. Build da PowerShell: `~\.platformio\penv\Scripts\pio.exe run -e esp32-s3-standard`. Annota flash e RAM (US-075: 49,1 %, 16,7 %).
      3. Mutazioni del piano non già provate: togliere una citazione da `apcHid2Nut()`; togliere un percorso superato. Ognuna deve far fallire un test; poi ripristina.
      4. Solo con l'ok esplicito dell'utente: OTA sull'Eaton 3S (192.168.1.126, UPS `eaton-3s-700`, credenziali lette da script, mai stampate). `nut_snapshot.py` prima e dopo; System Log senza errori USB.
      5. Bozza del messaggio ai tester APC (miskor-bgd e Sr-psycho Smart-UPS, JSylvia007 Back-UPS XS 1500M): cosa confrontare (`upsc`, `upscmd -l` prima/dopo, rete staccata, comandi beeper e test), cosa allegare. Niente zip né pubblicazione senza richiesta.

      **Verifica:** passi 1-3 verdi; il passo 4 fatto o saltato su decisione dell'utente.

      **Fatto:** numeri annotati per la review, bozza pronta.

      **Blocchi:** una regressione Eaton blocca la chiusura.

      ## File Coinvolti
      - nessun file di produzione (esecuzione); bozza nello scratchpad

      ## Criteri di Completamento
      - [ ] Suite nativa completa verde con totale annotato
      - [ ] Build ok con flash/RAM annotati
      - [ ] Mutazioni colte
      - [ ] OTA fatta o saltata su decisione dell'utente
    ref: TASK-11
