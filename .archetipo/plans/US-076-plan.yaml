  - id: TASK-09
    title: 'Replay delle 13 fixture APC: righe legate, snapshot, poll, LIST CMD/RW, #60 e #98'
    type: Test
    status: DONE
    dependencies:
      - TASK-06
      - TASK-08
    body: |-
      ## Descrizione
      **Obiettivo:** chiudere i criteri 3, 4 e 5 della spec.

      **Leggi:**
      - `test/test_record_replay/test_main.cpp` (i casi APC, `NUT_ROWS_CPS_*` di US-075 come modello, `test_status_baseline_all_fixtures`, le baseline del TASK-01);
      - l'appunto delle usage del TASK-01.

      **Modifica:**
      1. Per ogni fixture APC una macro `NUT_ROWS_APC_<fixture>` (BOOL, RO, RW, comandi, ordinati), ricavata a mano dalle usage e da `apc-hid.c`, non dal firmware. Commento con riga upstream e report. Può servire una base comune per le fixture che condividono il layout (BGM2200 ×3, BX750MI; BX1500G, CS750RS, RS900MI).
      2. LIST CMD e LIST RW: le attese di oggi; una differenza solo con la riga upstream.
      3. Snapshot e liste di poll del TASK-01 aggiornati al risultato nuovo. Sopra ogni costante va ogni differenza (chiave, prima → dopo, riga `apc-hid.c:N` o decisione del piano).
         - Attese: `battery.voltage` con un decimale; `ups.load` `%.1f` su CS500 e Smart-UPS #78; `output.voltage.nominal` `230.0`; `output.current`; `ups.timer.reboot` e `ups.timer.shutdown` da `APCGeneralCollection`; `input.transfer.reason` dove `APCLineFailCause` vale 1/2/4/8/9/7; `OFF` dove `APCStatusFlag` vale 0; `not set` per date a 0.
      4. **#98:** le tre fixture BGM2200 danno ancora `OL DISCHRG` (dump e da rete) e `OB DISCHRG` (batteria), senza valori a zero nuovi rispetto alla baseline, salvo i cambi di formato.
      5. **#60:** i test del BX750MI (set cycle, `requestLength`) e la sua lista di poll restano identici.
      6. `test_status_baseline_all_fixtures`: righe APC invariate, oppure con il motivo (`OFF`, `ALARM`) nel commento.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_record_replay -f test_rw_catalog` verde.

      **Fatto:** replay verde, ogni differenza elencata e motivata.

      **Blocchi:** una differenza che cambia un valore che l'utente vede oggi, oltre ai formati e alle chiavi nuove previste, va segnalata all'utente prima di accettarla. Vale in particolare per un `OFF` o un `ALARM` nuovo con l'UPS da rete.

      ## File Coinvolti
      - test/test_record_replay/test_main.cpp — macro delle righe, baseline aggiornate, commenti
      - test/fixtures/apc/*.json — solo se un `expected_ups_data` va corretto (con motivo)

      ## Criteri di Completamento
      - [ ] 13 fixture verdi con righe legate ricavate a mano
      - [ ] LIST CMD/RW invariate o con differenze motivate
      - [ ] BGM2200 e BX750MI come prima, salvo i formati
