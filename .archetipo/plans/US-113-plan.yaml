  - id: TASK-06
    title: Sezione Hostname nella pagina Network, dal mockup US-113
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Objective:** la pagina Network mostra sempre una sezione Hostname con il nome in uso e un campo per cambiarlo (criteri 1 e 3), come nel mockup `docs/mockups/US-113/`.

      **Read:** `docs/mockups/US-113/index.html` (sezione `#sec-hostname`), `docs/mockups/US-113/hostname.css`, `docs/mockups/US-113/app.js` (flusso: validazione, Saving, No changes, Saved, conto alla rovescia; i dati finti e la barra degli scenari NON vanno copiati), `data/www/index.html:161-273` (sezioni di US-112), `data/www/bundle.js` (submit di `wifi-form` 283-320, `/api/config` 745-765, flusso di riavvio di Board Settings › USB port ~2239-2270 con `BOARD_RESTART_S`), `data/www/bundle.css`, `scripts/embed_web.py`.

      **Change:**
      1. `index.html`, dopo la sezione Ethernet dentro `#content-network`: la sezione `<section class="net-section" data-section="hostname">` del mockup (senza `data-link`, senza `hidden`), con gli stessi id: `#hostname-origin`, `#hostname-form`, `#hostname`, `#btn-hostname`, `#hostname-error`, `#hostname-success`, `#hostname-help`, `#hostname-default`, e il blocco "In use". Togliere ciò che nel mockup è solo dimostrativo. Aggiornare il commento di US-112 sopra il contenitore.
      2. `bundle.css`: aggiungere le regole di `docs/mockups/US-113/hostname.css` (non `mock.css`), riusando le variabili esistenti; aggiornare i commenti che citano Hostname come sezione futura.
      3. `bundle.js`: `const HOSTNAME_ERROR = 'Invalid hostname: use only letters, digits and hyphens, no hyphen at the start or end, at most 32 characters';`, `HOSTNAME_RESTART_S = 15` (o riusare `BOARD_RESTART_S` se è nello stesso scope) e `function validateHostname(v)` (`v === ''` → ok; altrimenti `/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,30}[A-Za-z0-9])?$/`). Submit: `v = input.value.trim()`; non valido → `#hostname-error` visibile, classe `invalid` e `aria-invalid` sul campo, nessuna richiesta; uguale al nome scelto salvato → pulsante "No changes" per 2 s, nessuna richiesta; altrimenti pulsante "Saving..." con spinner e campo bloccato, `apiFetch('/api/network/hostname', {method:'POST', headers JSON, body: JSON.stringify({hostname: v})})`. Risposta non ok → testo di `error` (fallback "Could not save the hostname.") in `#hostname-error`, pulsante e campo di nuovo attivi. `restart:false` → "No changes" per 2 s. `restart:true` → pulsante `.is-saved` "Saved", campo bloccato, riga della rete nella barra laterale a "Restarting..." con spia gialla, `#hostname-success` col nome e il conto alla rovescia (`.countdown`), allo zero `location.reload()`. Evento `input` sul campo: nasconde l'errore e toglie `invalid`/`aria-invalid`. Niente `alert()`.
      4. Nel `.then` di `/api/config`: se `data.network && data.network.hostname`: "In use" = `name` (o `—`), `#hostname-origin` = "Custom" con classe `custom` se `custom` non è vuoto, altrimenti "Default"; `#hostname.placeholder` e `#hostname-default` = `default`; `#hostname.value` = `custom` se il campo è vuoto. Conservare il nome scelto salvato per il confronto "No changes".
      5. `python scripts/embed_web.py` per rigenerare `data/www/index_inlined.html`, `include/network/web_assets.h`, `.web_assets.hash`.

      **Steps:** markup → stili → JS → embed → confronto a occhio con il mockup (desktop e 375 px) → test e2e esistenti.

      **Verify:** `npm run e2e -- network-page wifi-config ethernet` verde; `git status` mostra gli asset rigenerati; la pagina servita dagli e2e assomiglia al mockup negli stati default, invalid e restarting.

      **Done:** i criteri sotto sono spuntati.

      **Blockers:** se un test e2e esistente conta le `.net-section` visibili e fallisce per la sezione nuova, aggiornare il selettore a `[data-link]` in quel test (è il comportamento voluto), senza cambiare cosa verifica. Se il flusso di riavvio di Board Settings non si può riusare senza toccarlo, duplicare la parte minima e segnalarlo.

      ## File Coinvolti
      - data/www/index.html — sezione Hostname dal mockup
      - data/www/bundle.js — validazione, invio, riavvio con conto alla rovescia, precompilazione
      - data/www/bundle.css — stili da docs/mockups/US-113/hostname.css
      - data/www/index_inlined.html, include/network/web_assets.h, .web_assets.hash — rigenerati
      - docs/mockups/US-113/ — riferimento, da non modificare

      ## Criteri di Completamento
      - [ ] Sezione visibile su schede Wi-Fi ed Ethernet, senza codice per scheda, uguale al mockup
      - [ ] Nome in uso con etichetta Default/Custom, campo precompilato col nome scelto, placeholder e nota col predefinito
      - [ ] Nome non valido rifiutato nella UI con lo stesso messaggio dell'API; errore dell'API mostrato
      - [ ] Stati Saving, No changes, Saved con avviso e conto alla rovescia; layout a una colonna sotto 768 px
      - [ ] Asset rigenerati e test e2e esistenti verdi
    ref: TASK-06
  - id: TASK-07
    title: E2E del campo Hostname e screenshot della pagina Network
    type: Test
    status: DONE
