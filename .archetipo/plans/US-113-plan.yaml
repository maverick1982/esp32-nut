    body: |-
      ## Descrizione
      **Objective:** il campo Hostname è coperto da test e2e (criterio 5) e lo screenshot del README lo mostra con un valore.

      **Read:** `e2e/network-page.spec.ts` e `e2e/support/webui.ts` (`serveIndex`, mock di `/api/config` e `/api/system-status`), `e2e/screenshot.spec.ts`, `e2e/README.md`.

      **Change:**
      1. Nuovo `e2e/hostname.spec.ts` con `serveIndex` + `page.route`; mock di `/api/config` con `network: { type, links, hostname: { name, custom, default } }`. Scenari:
         - scheda solo Wi-Fi: sezione visibile, "In use" = `esp32-nut-56d784` con etichetta "Default", placeholder uguale, campo vuoto; scrivere `espnut-network`, salvare → la route intercetta una POST con body `{"hostname":"espnut-network"}` e risponde `{"success":true,"restart":true}`; pulsante "Saved", `#hostname-success` visibile con il nome, barra laterale `Restarting...` (con `page.clock` per non attendere il conto alla rovescia e intercettare il reload);
