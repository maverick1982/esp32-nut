      ## Descrizione
      **Objective:** chiudere il criterio 5 (test e tre build) e verificare i criteri 1, 2 e 4 su hardware, con il consenso dell'utente.

      **Read:** `docs/test-results/` (formato dei risultati di US-112 o US-110), memoria del progetto per scheda di test, COM5 e OTA.

      **Change:**
      1. Suite nativa completa: `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native`.
      2. `npm run e2e` completa.
      3. Da PowerShell: `& "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e esp32-s3-standard`, `-e esp32-p4-eth`, `-e esp32-p4-eth-v1`.
      4. **Solo con il consenso dell'utente**, sulla S3 di test (OTA): prima dell'aggiornamento annotare il nome nella tabella DHCP del router (lo controlla l'utente); dopo l'OTA verificare nel System Log `Wi-Fi hostname esp32-nut-xxxxxx`; salvare `espnut-network` dalla pagina Network, attendere il riavvio, verificare log e `/api/config` e chiedere all'utente la tabella DHCP; provare un nome non valido dalla UI e con `curl` sull'API (400); un secondo OTA conserva il nome; svuotare il campo riporta al predefinito. La P4 la provano i tester, se l'utente non ne ha una.
