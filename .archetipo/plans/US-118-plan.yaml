      ## Descrizione
      **Obiettivo:** chiudere la documentazione e verificare tutto prima della review.

      **Leggere:** sezioni "Documentazione" e "Flash" del piano; `docs/adr/0012-remote-log-outputs.md` (sezione sull'ora di US-117).

      **Modifiche:** una riga in ADR 0012 su `board_time` in `GET /api/logs` e sul terminale che lo mostra; niente note di rilascio.

      **Passi:** 1) ADR; 2) suite native complete a blocchi di circa 8 suite; 3) build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`; 4) dimensione di `firmware.bin` S3 contro 2.126.736 B di US-117 e margine rispetto ai 2.031.616 B dello slot della 4 MB (#93), da annotare per la PR.

      **Verifica:** tutte le suite native verdi, tre build verdi, e2e del TASK-06 verde.

      **Blocchi:** nessun commit o push senza conferma dell'utente; nella PR "Refs", mai "Closes".

