  - id: TASK-08
    title: Prova sul campo su ESP32-S3 (solo dopo un sì esplicito)
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Descrizione
      **Obiettivo:** verificare sulla scheda reale che terminale, export e server syslog mostrino la stessa ora della scheda.

      **Leggere:** "Strategia di test" del piano; `docs/test-results/US-117/` (procedura di US-117, ricevitore UDP sul PC).

      **Modifiche:** nessuna nel codice. Evidenze in `docs/test-results/US-118/` (cartella in `.gitignore`, resta in locale).

      **Passi:** 1) chiedere il consenso esplicito all'utente prima di flashare o toccare la scheda; 2) OTA del firmware; 3) NTP spento: `curl` di `/api/logs` senza `board_time`; 4) NTP acceso con Europe/Rome: tutte le righe con `board_time`, comprese quelle dell'avvio; 5) syslog RFC 3164 verso il PC: `hh:mm:ss` uguale tra terminale e ricevitore; 6) browser con fuso diverso; 7) riavvio della scheda dalla pagina.

      **Verifica:** evidenze salvate (output di `curl`, righe del ricevitore, screenshot del terminale).

      **Blocchi:** senza consenso esplicito la prova non si fa: lo si riporta come non eseguita. Le credenziali della scheda non vanno mai stampate.

      ## File Coinvolti
      - docs/test-results/US-118/ — evidenze locali

      ## Criteri di Completamento
      - [ ] Consenso dell'utente ottenuto prima della prova
      - [ ] `board_time` assente senza ora e presente con l'ora, anche per le righe dell'avvio
      - [ ] Stessa ora tra terminale e server syslog
    ref: TASK-08
