  - id: TASK-03
    title: Stesso uptime per il buffer del System Log e per il syslog
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** far sì che la riga del terminale e quella del server syslog partano dallo stesso `millis()`, così il secondo mostrato coincide sempre.

      **Leggere:** sezione "Stesso uptime per il buffer e per il syslog" del piano; `include/core/app_logger.h`, `src/core/app_logger.cpp` (`write`), `src/core/log_dispatcher.h/.cpp` (`submit`, `forward`).

      **Modifiche:** `AppLogger::Forwarder` riceve un ultimo parametro `uint32_t uptime_ms`; `AppLogger::write` legge `millis()` una volta, lo usa per `logBuffer[head].time`, per il `Serial.printf` e per il forwarder; `LogDispatcher::submit(level, msg, notice, uptime_ms)` lo copia in `r.uptime_ms` al posto di `millis()`; `LogDispatcher::forward` passa il parametro.

      **Passi:** 1) cercare con Grep tutti i chiamanti di `setForwarder`, `submit(` e `Forwarder` in `src`, `include`, `lib`, `test`; 2) aggiornare firme e chiamanti; 3) aggiornare il commento di `submit`.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` compila; le suite native che toccano LogCore restano verdi.

      **Blocchi:** se un test nativo usa un forwarder finto, aggiornarlo alla nuova firma senza cambiarne le asserzioni.

      ## File Coinvolti
      - include/core/app_logger.h — firma di `Forwarder`
      - src/core/app_logger.cpp — un solo `millis()` in `write`
      - src/core/log_dispatcher.h — firma di `submit` e `forward`
      - src/core/log_dispatcher.cpp — `r.uptime_ms` dal parametro

      ## Criteri di Completamento
      - [ ] `write` legge `millis()` una sola volta e lo stesso valore arriva in `LogRecord::uptime_ms`
      - [ ] Nessun altro cambiamento di comportamento del logger o del syslog
      - [ ] Build S3 verde
    ref: TASK-03
  - id: TASK-04
    title: Campo board_time in GET /api/logs
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** ogni riga di `GET /api/logs` ha `board_time` quando la scheda ha l'ora; senza ora la risposta resta quella di oggi.

      **Leggere:** sezioni "Costruzione della lista" e "Riferimento dell'ora senza lock annidati" del piano; `src/core/app_logger.cpp` (`getLogsJSON`); `src/network/ntp_clock.h/.cpp` (`epochMsAt`, `localTm`, `utcTm`); `src/network/web_config_server.cpp` (`handleLogs`).

      **Modifiche:**
      - `AppLogger`: `typedef bool (*BoardTimeFn)(void* ctx, uint32_t row_uptime_ms, uint32_t list_uptime_ms, char* out, size_t len)` e `getLogsJSON(BoardTimeFn fn = nullptr, void* ctx = nullptr)`; `list_uptime_ms = millis()` letto dopo aver preso il mutex; `obj["board_time"]` aggiunto come copia (`String(buf)`) solo se `fn` restituisce true.
      - `NtpClock`: `bool reference(WallClock& out) const`, copia di `_clock` sotto `_mutex`.
      - `WebConfigServer::handleLogs`: se `ntp_clock && ntp_clock->reference(ref)`, callback statica con `ctx = &ref` che chiama `ref.epochMsAt(list_uptime)`, `boardEpochMs`, `NtpClock::localTm`, `NtpClock::utcTm`, `formatBoardTime` (ms = `epoch % 1000`). Aggiornare il commento "issue 60".

      **Passi:** 1) `reference()`; 2) `getLogsJSON` con la callback; 3) `handleLogs`; 4) controllare che la callback non prenda il mutex di `NtpClock` né chiami `AppLogger`.

      **Verifica:** build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1` da PowerShell.

      **Blocchi:** se `ArduinoJson` in uso memorizza il `char[]` per puntatore, usare la copia esplicita; se il `JsonDocument` cresce troppo, segnalarlo invece di ridurre `MAX_LOGS`.

      ## File Coinvolti
      - include/core/app_logger.h — `BoardTimeFn`, nuova firma
      - src/core/app_logger.cpp — `board_time` per riga
      - src/network/ntp_clock.h — `reference()`
      - src/network/ntp_clock.cpp — `reference()`
      - src/network/web_config_server.cpp — `handleLogs` con la callback

      ## Criteri di Completamento
      - [ ] Con l'ora, ogni riga ha `board_time` nel formato del piano, anche quelle scritte prima della sincronizzazione
      - [ ] Senza ora (NTP spento, prima della sincronizzazione) la risposta non contiene `board_time`
      - [ ] `id`, `time`, `level`, `msg` e `X-Uptime-Ms` invariati
      - [ ] Nessun lock di `NtpClock` preso sotto il mutex del logger
      - [ ] Tre build verdi
    ref: TASK-04
  - id: TASK-05
    title: Terminale del System Log con l'ora della scheda
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** il terminale mostra `hh:mm:ss` di `board_time` quando c'è, altrimenti l'ora ricostruita dal browser come oggi.

      **Leggere:** sezione "Terminale" del piano; `data/www/bundle.js` (`addLogEntry` e `fetchLogs`, circa righe 754-825).

      **Modifiche:** `addLogEntry(level, msg, when, timeText)` con `timeText` facoltativo che ha la precedenza; in `fetchLogs`, per le righe nuove, estrarre `hh:mm:ss` da `board_time` con `/T(\d{2}):(\d{2}):(\d{2})/` senza passare da `Date`; se il campo manca o non corrisponde, il calcolo di oggi da `X-Uptime-Ms`. Commento che cita US-118 e issue #60. Poi `python scripts/embed_web.py`.

      **Passi:** 1) `addLogEntry`; 2) `fetchLogs`; 3) rigenerare gli asset; 4) controllare che rilevamento del riavvio e `lastLogId` siano intatti.

      **Verifica:** `npx playwright test e2e/logs-viewer.spec.ts` verde (test esistenti); build S3 con gli asset rigenerati.

      **Blocchi:** `scripts/embed_web.py` va eseguito a mano: il pre-script di PlatformIO non rigenera nulla.

      ## File Coinvolti
      - data/www/bundle.js — `addLogEntry`, `fetchLogs`
      - data/www/index_inlined.html — rigenerato
      - include/network/web_assets.h — rigenerato
      - include/network/.web_assets.hash — rigenerato

      ## Criteri di Completamento
      - [ ] Le righe con `board_time` mostrano la sua ora, qualunque sia il fuso del browser
      - [ ] Le righe senza `board_time` mostrano l'ora come oggi
      - [ ] `Device restarted` e ID dopo un riavvio come oggi
      - [ ] Asset rigenerati e committabili insieme al sorgente
    ref: TASK-05
  - id: TASK-06
    title: e2e del terminale con e senza ora della scheda e dell'export
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** coprire con Playwright gli scenari della tabella "Test E2E" del piano.

      **Leggere:** tabella "Test E2E — Simulazione utente" del piano; `e2e/logs-viewer.spec.ts`; `e2e/support/webui.ts`; `e2e/time-settings.spec.ts` (mock dell'ora di US-117).

      **Modifiche:** in `e2e/logs-viewer.spec.ts`, nuovo `test.describe` per US-118 con: ora della scheda con `test.use({ timezoneId: 'America/New_York' })` e atteso `[09:12:03]`; senza ora con l'orologio del browser fissato (`page.clock` se la versione di Playwright lo supporta, altrimenti valore atteso calcolato con `page.evaluate`); ora che arriva alla seconda risposta; riavvio con uptime minore e ID da 1; export che apre `/api/logs` con i cinque campi. I mock rispondono con l'intestazione `X-Uptime-Ms`.

      **Passi:** 1) helper di mock con risposte in sequenza; 2) scenari; 3) eseguire anche `e2e/remote-logging.spec.ts`.

      **Verifica:** `npx playwright test e2e/logs-viewer.spec.ts e2e/remote-logging.spec.ts` verde.

      **Blocchi:** un test che fallisce si risolve correggendo il codice, non il test; se Export mostra il JSON invece di scaricarlo, è il comportamento di oggi: si verifica la risposta di `/api/logs`, non il download.

      ## File Coinvolti
      - e2e/logs-viewer.spec.ts — scenari US-118

      ## Criteri di Completamento
      - [ ] Cinque scenari del piano presenti e verdi
      - [ ] Test esistenti di `logs-viewer.spec.ts` e `remote-logging.spec.ts` verdi
    ref: TASK-06
