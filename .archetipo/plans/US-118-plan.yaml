      **Modifiche:** aggiungere a `test/test_time_core/test_main.cpp` i casi di `boardEpochMs`, `utcOffsetSeconds` e `formatBoardTime` elencati nel piano, costruendo i `struct tm` a mano, e registrarli in `main` con `RUN_TEST`.

