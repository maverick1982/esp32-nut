  ---
  # US-118: Ora della scheda nel terminale e nell'export del System Log — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-05
  **Branch:** `feature/us-118-board-time-logs`, da creare a partire da `feature/us-117-ntp-time` (1df42c5), perché US-117 è DONE ma non ancora in `main`. Se US-117 viene unita prima, si parte da `main`.

  ---

  ## Spec

  **Epic:** EP-002 — Connettività di Rete e Configurazione
  **Priorità:** LOW | **Punti:** 3 | **Bloccato da:** US-117 (DONE)

  **User Story**
  Come utente che legge o esporta il System Log, voglio vedere l'ora della scheda nel fuso scelto in Board Settings, in modo che le righe coincidano con quelle del server syslog e con gli eventi dell'UPS, anche se apro la pagina da un dispositivo con l'orologio sbagliato.

  **Criteri di Accettazione**: vedi la spec US-118: ora della scheda nel terminale (anche per le righe scritte prima della sincronizzazione), ricostruzione con l'orologio del browser senza ora (issue #60), export con l'ora della scheda e campi `id`, `time`, `level`, `msg` invariati, riavvio come oggi, e2e.

  ---

  ## Soluzione tecnica

  Oggi `GET /api/logs` restituisce `[{id, time, level, msg}]`, dove `time` è il `millis()` della riga, più l'intestazione `X-Uptime-Ms`. Il terminale (`fetchLogs` in `data/www/bundle.js`) converte `time` nell'ora del browser. Export (`#btn-download`) apre semplicemente `/api/logs`. **L'ora della scheda la calcola il firmware**, riga per riga, e la mette in un campo nuovo della stessa risposta: così terminale ed export hanno la stessa fonte, e il browser non deve convertire fusi POSIX (non può: conosce solo i nomi IANA, e la stringa POSIX della tabella di US-117 è la regola che usa la scheda).

  - **Campo nuovo `board_time`** in ogni riga di `GET /api/logs`, solo quando la scheda ha l'ora (`NtpClock::epochMsAt` valido): ISO 8601 con millisecondi e offset del fuso di Board Settings, ad esempio `"board_time":"2026-11-05T09:12:03.007+01:00"` (UTC → `+00:00`). L'offset rende l'export leggibile da solo. Senza ora il campo manca: la risposta è byte per byte quella di oggi. `id`, `time`, `level`, `msg` e `X-Uptime-Ms` restano invariati.
  - **Core puro `lib/TimeCore/src/BoardTime.h/.cpp`** (test nativi, niente piattaforma):
    - `int64_t boardEpochMs(int64_t list_epoch_ms, uint32_t list_uptime_ms, uint32_t row_uptime_ms)` = `list_epoch_ms - (uint32_t)(list_uptime_ms - row_uptime_ms)`. Si conta all'indietro dall'istante in cui si costruisce la lista, con la differenza **senza segno**, come fa oggi il browser. Così vale per qualsiasi riga del buffer: scritta prima della sincronizzazione, oltre il wrap di `millis()`, e anche più vecchia di 24,8 giorni (limite di `WallClock::epochMsAt` con la differenza `int32_t`). Precondizione: `row_uptime_ms <= list_uptime_ms` (vero, vedi sotto).
    - `int32_t utcOffsetSeconds(const struct tm& local, const struct tm& utc)`: differenza in secondi tra i due istanti scomposti, con un `daysFromCivil(y, m, d)` interno, senza `mktime`/`timegm`, così i test nativi non dipendono dal TZ di Windows. Gestisce il cambio di giorno, di mese e di anno tra locale e UTC.
    - `size_t formatBoardTime(const struct tm& local, const struct tm& utc, uint16_t ms, char* out, size_t len)`: scrive `YYYY-MM-DDThh:mm:ss.mmm+hh:mm` (29 caratteri) con `snprintf`, segno `-` per gli offset negativi, minuti dell'offset per i fusi a mezz'ora (`+05:30`, `-03:30`). Restituisce 0 se `len < 30`.
  - **Stesso uptime per il buffer e per il syslog**: oggi `AppLogger::write` scrive `millis()` nel buffer e `LogDispatcher::submit` legge di nuovo `millis()`. Raramente i due valori cadono in secondi diversi, e allora il terminale e il server syslog mostrerebbero ore diverse. `AppLogger::write` legge `millis()` una volta e lo passa al forwarder: `Forwarder` diventa `void (*)(void* ctx, const char* level, const char* msg, bool notice, uint32_t uptime_ms)`, `LogDispatcher::submit(level, msg, notice, uptime_ms)` lo copia in `LogRecord::uptime_ms`. Nessun altro cambiamento di comportamento.
  - **Costruzione della lista** (`include/core/app_logger.h`, `src/core/app_logger.cpp`): `getLogsJSON(BoardTimeFn fn = nullptr, void* ctx = nullptr)` con `typedef bool (*BoardTimeFn)(void* ctx, uint32_t row_uptime_ms, uint32_t list_uptime_ms, char* out, size_t len)`. Dentro il lock, `list_uptime_ms = millis()` letto **dopo** aver preso il mutex: nessuna riga può essere più recente, perché ogni scrittura prende lo stesso mutex. Per ogni riga, se `fn` restituisce true, si aggiunge `board_time` **come copia** (`String(buf)` o equivalente: un `char[]` locale passato a ArduinoJson potrebbe essere memorizzato come puntatore). Senza `fn` l'uscita è quella di oggi. `AppLogger` resta senza dipendenze da `NtpClock`.
  - **Riferimento dell'ora senza lock annidati** (`src/network/ntp_clock.h/.cpp`): nuovo `bool NtpClock::reference(WallClock& out) const` che copia `_clock` sotto `_mutex` e restituisce `out.valid()`. In `WebConfigServer::handleLogs()`: se `ntp_clock && ntp_clock->reference(ref)`, si passa a `getLogsJSON` una callback statica con `ctx = &ref` che fa: `ref.epochMsAt(list_uptime, list_epoch)` → `boardEpochMs(...)` → `NtpClock::localTm` / `NtpClock::utcTm` → `formatBoardTime(..., epoch % 1000, ...)`. Nella callback, eseguita sotto il mutex del logger, non si prende mai il mutex di `NtpClock` (copiato prima) e non si chiama `AppLogger`: solo `localtime_r` e `gmtime_r`, che newlib protegge con il suo lock. Così niente deadlock con `NtpClock::poll()`, che scrive righe con `AppLogger::log`.
  - **Coerenza con il syslog**: il syslog (US-117) formatta con `SyslogOutput::timeOf(record.uptime_ms)` e il riferimento del momento dell'invio. `/api/logs` usa il riferimento del momento della lettura. I due istanti differiscono solo per la correzione dell'orologio a una nuova sincronizzazione (ogni 3 h, millisecondi): nel caso peggiore il secondo mostrato può cambiare di uno, solo per righe a cavallo di una sincronizzazione. Il terminale tronca ai secondi come RFC 3164 (`localTm` tronca i ms), quindi `hh:mm:ss` coincide con il TIMESTAMP 3164 e, in RFC 5424, con l'ora UTC convertita.
  - **Terminale** (`data/www/bundle.js`, poi `python scripts/embed_web.py`): in `fetchLogs`, per ogni riga nuova, se `typeof logs[i].board_time === 'string'` e `/T(\d{2}):(\d{2}):(\d{2})/` lo riconosce, l'ora mostrata è quella `hh:mm:ss` così com'è (nessuna conversione `Date`, che la riporterebbe al fuso del browser). Altrimenti resta la ricostruzione di oggi da `X-Uptime-Ms` (issue #60). `addLogEntry(level, msg, when, timeText)` accetta un quarto parametro facoltativo, il testo `hh:mm:ss` già pronto, che ha la precedenza su `when`. Il rilevamento del riavvio (`Device restarted`, ID e uptime che calano) e `lastLogId` non cambiano. Le righe scritte dalla pagina stessa (`Downloading logs...`, `Auto-refresh enabled`) restano con l'ora del browser come oggi: non vengono dalla scheda.
  - **Export**: invariato lato UI (`window.location.href = '/api/logs'`): scarica la stessa lista, che ora contiene `board_time` quando c'è l'ora. Nessun nuovo endpoint né `Content-Disposition` (fuori scope).
  - **Prima della sincronizzazione / NTP spento / dopo un riavvio**: `reference()` restituisce false (US-117: `WallClock::clear()` con NTP spento, nessun riferimento dopo l'avvio), quindi niente `board_time` e il terminale si comporta come oggi. Alla prima sincronizzazione tutte le righe del buffer, comprese quelle scritte prima, ricevono `board_time`; nel terminale quelle già mostrate non vengono ridisegnate (lo sono una volta sola, per ID).
  - **Documentazione**: ADR 0012, nella sezione sull'ora di US-117, una riga: `GET /api/logs` aggiunge `board_time` (ISO 8601 con offset) per ogni riga quando la scheda ha l'ora; il terminale la mostra, senza ora usa l'orologio del browser. Le note di rilascio non fanno parte di questa spec.
  - **Flash**: aumento di poche centinaia di byte. Si riporta nella PR la dimensione di `esp32-s3-standard` rispetto a US-117 (2.126.736 B), con il margine rispetto allo slot della 4 MB (#93, già superato da US-117).

  ### Assunzioni

  - Il formato di `board_time` (ISO 8601 con ms e offset) non è chiesto dalla spec: è scelto perché un export letto da solo, senza Board Settings, resta univoco.
  - Il riferimento di `WallClock` invecchiato di più di 24,8 giorni senza nuova sincronizzazione (rete persa per settimane) è un limite di US-117 per `epochMsAt(list_uptime)`: non si corregge qui.

  ---

  ## Strategia di test

  La parte nuova di logica (conto all'indietro, offset, formato) sta in `lib/TimeCore`, coperta da Unity nativi. `AppLogger` e `handleLogs` usano la piattaforma: si verificano con le build e con la prova sul campo (`curl` su `/api/logs`). Il terminale e l'export con Playwright e i mock di `e2e/support/webui.ts`.

  - `test/test_time_core` (casi nuovi): `boardEpochMs` per riga uguale alla lista, riga 5 s prima, riga prima della sincronizzazione, wrap di `millis()` (lista a 1000, riga a `0xFFFFFC18`), riga di 30 giorni prima; `utcOffsetSeconds` per UTC (0), Europe/Rome inverno (+3600) ed estate (+7200), America/New_York (−18000), India (+19800), Newfoundland (−12600), cambio di giorno (locale 00:30 del 1 gennaio contro UTC 23:30 del 31 dicembre); `formatBoardTime`: `2026-11-05T09:12:03.007+01:00`, `+00:00`, `-05:00`, `+05:30`, millisecondi `000` e `999`, buffer troppo corto → 0.
  - Comando nativo: `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_time_core -f test_log_core -f test_web_api`, poi la suite completa a blocchi di circa 8 suite (limite 600 s).
  - Build: `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1` (controlla anche che i chiamanti del forwarder compilino).
  - Prova sul campo su ESP32-S3 + Eaton 3S, **solo dopo un sì esplicito dell'utente**: `curl` di `/api/logs` con NTP spento (nessun `board_time`) e acceso (tutte le righe con `board_time`, anche quelle dell'avvio), confronto `hh:mm:ss` tra terminale e ricevitore syslog RFC 3164 sul PC, browser con il fuso diverso da Europe/Rome.

  ### Test E2E — Simulazione utente

  **Framework:** Playwright (`e2e/logs-viewer.spec.ts`, mock con `serveIndex` di `e2e/support/webui.ts` e `page.route('**/api/logs', ...)` con l'intestazione `X-Uptime-Ms`)
  **Video demo:** previsto (la `Dimostrazione` è filmabile; lo registra `archetipo-review`, non l'implementazione)

  | Scenario | Flusso utente |
  |---|---|
  | Ora della scheda | Browser con `timezoneId` `America/New_York` (`test.use`), l'utente apre System Logs: le righe con `board_time` `2026-11-05T09:12:03.007+01:00` mostrano `[09:12:03]`, non l'ora del browser |
  | Senza ora della scheda | Righe senza `board_time`, orologio del browser fissato (`page.clock`, o valore atteso calcolato con `page.evaluate`), `X-Uptime-Ms` 10000 e `time` 4000: la riga mostra l'ora del browser meno 6 s, come oggi |
  | Ora che arriva dopo | Prima risposta senza `board_time`, seconda con una riga nuova con `board_time`: la prima riga resta com'era, la nuova mostra l'ora della scheda |
  | Riavvio | Seconda risposta con `X-Uptime-Ms` minore e ID che ripartono da 1: compare `Device restarted` e le righe nuove sono mostrate (con o senza `board_time`) |
  | Export | Click su Export: il browser apre `/api/logs` e la risposta contiene per ogni riga `id`, `time`, `level`, `msg` e `board_time` |
  | Regressione | I test esistenti di `e2e/logs-viewer.spec.ts` e `e2e/remote-logging.spec.ts` restano verdi |

  ---

  _Piano generato con ARchetipo Planning — 2026-11-05_
tasks:
  - id: TASK-01
    title: 'Core puro lib/TimeCore/BoardTime: ora di una riga, offset del fuso, formato ISO 8601'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** avere il calcolo e il formato dell'ora di una riga del System Log senza dipendenze di piattaforma.

      **Leggere:** sezione "Core puro `lib/TimeCore/src/BoardTime.h/.cpp`" del piano; `lib/TimeCore/src/WallClock.h` (stile e commenti); `lib/LogCore/src/SyslogFormat.cpp` (formato da `struct tm` senza `localtime`).

      **Modifiche:** creare `lib/TimeCore/src/BoardTime.h` e `BoardTime.cpp` con `boardEpochMs(list_epoch_ms, list_uptime_ms, row_uptime_ms)` (differenza `uint32_t`), `utcOffsetSeconds(local, utc)` con `daysFromCivil` interno, `formatBoardTime(local, utc, ms, out, len)` → `YYYY-MM-DDThh:mm:ss.mmm+hh:mm`, 0 se `len < 30`.

      **Passi:** 1) `boardEpochMs`; 2) `daysFromCivil` e `utcOffsetSeconds`; 3) `formatBoardTime` con `snprintf`, segno e minuti dell'offset; 4) commenti in inglese come gli altri file di TimeCore, che spiegano perché la differenza è senza segno.

      **Verifica:** compila con la suite del TASK-02.

      **Blocchi:** nessuno. Non usare `mktime`, `timegm`, `localtime` né `strftime("%z")`.

      ## File Coinvolti
      - lib/TimeCore/src/BoardTime.h — nuovo
      - lib/TimeCore/src/BoardTime.cpp — nuovo

      ## Criteri di Completamento
      - [ ] `boardEpochMs` dà l'ora giusta per righe precedenti alla sincronizzazione, oltre il wrap di `millis()` e più vecchie di 24,8 giorni
      - [ ] `formatBoardTime` scrive `2026-11-05T09:12:03.007+01:00` per Europe/Rome in inverno e gestisce offset negativi e a mezz'ora
      - [ ] Nessuna chiamata di piattaforma né dipendenza dal TZ del processo
    ref: TASK-01
