schema: archetipo/plan/v2
spec_code: US-109
body: |
  # US-109: Correzioni dalla prova rc1: report OUTPUT, valori mancanti e comandi del cicalino (#100, #36) — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-01

  ---

  ## Spec

  **Epic:** EP-001 — Gestione USB Host
  **Priorità:** HIGH | **Punti:** 3 | Branch: `feature/us-072-us-108-poll` (US-072 e US-108 DONE). Blocca il rilascio della v1.12.0.

  Tre correzioni emerse dalla v1.12.0-rc1:
  - **#100** (Smart-UPS 750L, 051d:0003): `HIDParser.cpp:103` assegna `(bTag == 8) ? 0x01 : 0x03`, quindi gli item Output diventano FEATURE. Il report OUTPUT 0x90 (144) finisce nel full poll come 144/3 e ogni GET_REPORT fallisce con `ESP_ERR_INVALID_RESPONSE`, 2 righe ERROR al minuto.
  - **#100**: il riquadro UPS LOAD mostra `0 %` senza `ups.load` (`data/www/bundle.js:571`, `|| 0`), e la riga `[DIAG] UPS Info` mostra `Input = 0.0 V` senza tensioni (`src/core/main.cpp:300-307`).
  - **#36** (Powercom SPD-750U): dopo `beeper.toggle` l'UPS riporta `AudibleAlarmControl = 3`, valore che `powercom_beeper_info` (powercom-hid.c:291-295) non conosce. `ups.beeper.status` sparisce, come in NUT, ma `HidControl::supportedCommands()` (`HidControl.h:53`) nasconde allora tutti i comandi `beeper.*`, mentre NUT li elenca in base alle righe. La situazione resta anche dopo un riavvio, perché l'UPS resta a 3.

  ---

  ## Soluzione Tecnica

  ### 1. Tipo degli item Output (parser)
  - `HIDParser.cpp:103`: tipo per item. bTag 8 → 0x01, 9 → 0x02, 11 → 0x03. Offset e lunghezze usano già le mappe separate (`_input_lengths`, `_output_lengths`, `_feature_lengths`), quindi l'offset di un campo Output non cambia; cambia solo il tipo.
  - Effetti già previsti nel codice: `GenericDriver::buildPollLists()` salta i report che non sono INPUT o FEATURE ("OUTPUT reports are not read"); `USBHostUPS.cpp:877, 882` usa `HID_REPORT_TYPE_OUTPUT` quando `report_type == 2`; `hasFeatureBeeperControl()` e `activeBeeper()` accettano già 0x02.
  - `HidControl::cmdField()`: oggi accetta 0x02 solo per i comandi del cicalino, un ramo mai usato finché il parser non produceva 0x02. Diventa: FEATURE o OUTPUT per ogni riga comando, come `find_nut_info()` + `HIDSetDataValue()` di NUT, che scrivono l'item con il suo tipo. Così nessun comando sparisce per il cambio di tipo.
  - Impatto sulle fixture: tre descriptor hanno item Output, tutti con usage vendor:
    - #22 report 0x90, solo OUTPUT: esce dal poll;
    - CP1600 #48 report 41 e Keor #90 report 55, FEATURE + OUTPUT: il report FEATURE resta letto, i campi Output non vengono più decodificati dalla risposta FEATURE.

    Le golden attese cambiano solo in `[requests]` della #22. Si verifica che nessuna riga delle tabelle sia legata a usage OUTPUT; se lo fosse, va riportato in review.
  - SET VAR: se `planSet()` / `writableVariables()` considerano solo il tipo 0x03, si lascia così e lo si annota. Nessuna fixture ha righe RW su usage OUTPUT.

  ### 2. Comandi del cicalino con stato sconosciuto
  - Nuovo hook `IUPSDriver::beeperFieldRead(IHidTransport*) const`, che per default restituisce `false`. `GenericDriver` lo implementa: vale `true` se un report (INPUT o FEATURE) che contiene il percorso del cicalino attivo (`host->getActiveBeeperPath()`) risulta già decodificato (`_decoded_report`). Si azzera a ogni `setup()`, cioè a ogni nuovo dispositivo.
  - `IHidControlPort::beeperFieldRead()`, che per default restituisce `false`. `USBHostUPS` lo implementa sotto `_mutex` delegando al driver; il mock di replay delega al driver della sessione.
  - `HidControl::buildCommands()` riceve un parametro in più, `beeper_state_known`, in fondo con default `true` così le chiamate esistenti dei test restano valide:
    - `beeper.enable` e `beeper.disable`: disponibili se `beeper_available` (`supportsBeeperToggle()` e `ups.beeper.status` presente oppure `beeperFieldRead()`) e se la riga esiste;
    - `beeper.toggle` e `beeper.mute`: anche `beeper_state_known` (`ups.beeper.status` presente), perché il toggle calcola il valore da scrivere dallo stato attuale (`HidControl.h:88`).
  - `supportedCommands()` calcola i due flag. `FixtureReplayRunner::listCmd()` fa lo stesso.
  - **Decisione su `QUIRK_NO_BEEPER_CONTROL`: si toglie** da `Quirks.h`, da `ReplayMockHost::supportsBeeperToggle()` e dalla verifica del runner (`FixtureReplayRunner.h:255-260`).
    - `USBHostUPS` non lo usa più dalla e14b3d2: sul campo l'SPD-750U offre già i comandi del cicalino, sia con la v1.11.0 sia con la rc1 (#36).
    - NUT non ha un quirk così e offre `beeper.enable`/`disable`/`toggle` su Powercom.
    - Rimetterlo in uso toglierebbe ai possessori di SPD-750U comandi che oggi usano.

    I commenti dei test che lo citano (`test_hid_commands` ~1115, `test_record_replay` ~535) si correggono. Il replay della fixture SPD-750U, che contiene solo il descriptor, resta con il solo `test.battery.start.quick`, perché il report del cicalino non viene mai letto.

  ### 3. Valori mancanti mostrati come assenti
  - `bundle.js` (`renderTelemetry`, ~571): senza `ups.load` il riquadro mostra `--` e la barra resta a larghezza 0, come REAL POWER (`??`). Il valore `0` resta `0`. Poi `python scripts/embed_web.py`.
  - `main.cpp:300-307`: se non esistono né `output.voltage` né `input.voltage`, la riga termina con `Voltage = --` invece di `Input = 0.0 V`. Commento in italiano, come il codice intorno.

  ### Fuori scope
  - Limitare il poll ai report delle righe legate, come upstream; `battery.charge` mostrato come 0 quando manca (non segnalato).
  - La disconnessione USB dell'SPD-750U a batteria e il riavvio "INPUT transfer keeps failing" (#36): in attesa di dati.
  - La nota nel README su hub e cavi con amplificatore (#113).

  ---

  ## Strategia di Test

  - **`test_hid_parser`**:
    - un descriptor sintetico con un item Output dà `report_type == 2`, `getExpectedLength(id, 2)` corretto e nessun FEATURE con quell'ID;
    - un report con FEATURE e OUTPUT sullo stesso ID mantiene i campi FEATURE con offset e lunghezza invariati;
    - fixture #22: 0x90 (144) è OUTPUT.
  - **`test_record_replay`**:
    - baseline delle liste di poll della #22 senza `144/3`, con `test_apc_5g_reads_feature_reports_issue22` aggiornato;
    - golden rigenerate e confrontate per sezione: `[requests]` della #22 senza 144; ogni altra differenza si spiega o ci si ferma;
    - CP1600 #48 e Keor #90: liste di poll e snapshot invariati;
    - SPD-750U: replay più un report sintetico 19 (AudibleAlarmControl) a 3 → `ups.beeper.status` assente, LIST CMD con `beeper.enable beeper.disable` e senza `beeper.toggle`; con il valore 2 → `disabled` e anche `beeper.toggle`.
  - **`test_hid_commands`**:
    - `buildCommands` con `beeper_available` vero e `beeper_state_known` falso → enable e disable sì, toggle e mute no;
    - una riga comando la cui usage è solo OUTPUT è disponibile;
    - SPD-750U senza quirk.
  - **`test_generic_driver`** (o `test_poll_cycle`): `beeperFieldRead()` è falso prima della lettura, vero dopo il decode del report del cicalino, di nuovo falso dopo `setup()`.
  - **`test_hid_control` / `test_ups_control_port`**: i mock implementano `beeperFieldRead()`; un comando `beeper.enable` con stato sconosciuto viene eseguito.
  - **Mutazioni**:
    - parser con `(bTag == 8) ? 1 : 3` → fallisce il test del parser e la baseline della #22;
    - `beeper_available` di nuovo legato a `ups.beeper.status` → fallisce il test SPD-750U a 3.
  - Suite nativa completa ed e2e completi, più le build `esp32-s3-standard`, `esp32-p4-eth` ed `esp32-p4-eth-v1`.

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (`playwright.config.ts`, `e2e/`, API simulate con `page.route`)
  **Video demo:** no. Il cambiamento visibile è un `--` in un riquadro, verificato dall'e2e; `archetipo-review` decide.

  | Scenario | Flusso utente |
  |---|---|
  | UPS senza carico | L'utente apre UPS Telemetry con dati senza `ups.load` (come lo Smart-UPS 750L della #100): il riquadro UPS LOAD mostra `--`, REAL POWER `--` |
  | UPS con carico 0 | Con `ups.load: "0"` il riquadro mostra `0`, perché il valore esiste |

  ---

  _Piano generato con ARchetipo Planning — 2026-11-01_
tasks:
  - id: TASK-01
    title: 'Parser: item Output con tipo 0x02; cmdField accetta OUTPUT per ogni riga comando'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** il parser tipizza gli item per quello che sono e i report solo OUTPUT escono dal poll (AC 1-3).

      **Leggi:** `lib/USBHostUPS/src/HIDParser.cpp:74-115` (main item), `:198-216` (`getExpectedLength`), `lib/USBHostUPS/src/HidControl.h:180-205` (`cmdField`), `lib/USBHostUPS/src/USBHostUPS.cpp:855-890` (scrittura con `HID_REPORT_TYPE_OUTPUT`), `lib/USBHostUPS/src/GenericDriver.cpp:182-225` (`buildPollLists`), `nut_repo/drivers/libhid.c` (tipo dell'item in `HIDSetDataValue`).

      **Modifica:**
      1. `HIDParser.cpp:103`: `def.report_type = (bTag == 8) ? 0x01 : (bTag == 9) ? 0x02 : 0x03;`. Commento: Output items are type 2 (US-109); they used to be FEATURE, so the APC 5G OUTPUT report 0x90 was polled.
      2. `HidControl::cmdField()`: accetta `u.report_type == 0x03 || u.report_type == 0x02` per ogni comando. Togliere `output_ok` e aggiornare il commento: come NUT, che scrive l'item con il suo tipo; la deviazione resta solo per le usage solo INPUT.
      3. Cercare altri punti che assumono "non INPUT = FEATURE" (`grep -rn "report_type" lib/USBHostUPS/src`). Lasciare invariati i controlli `!= 1 && != 3` già presenti. Se `planSet()` o `writableVariables()` accettano solo 0x03, non toccarli e annotarlo nel commit.

      **Verifica:** `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_hid_parser -f test_hid_commands -f test_poll_cycle` verde. `test_record_replay` può fallire solo su `test_apc_poll_baseline`, sui test della #22 e sulle golden della #22, che TASK-02 aggiorna.

      **Fatto:** item Output a 0x02; un report solo OUTPUT non entra nelle liste di poll.

      **Blocchi:** se cambiano liste di poll o snapshot di fixture diverse dalla #22, fermati e riporta.

      ## File Coinvolti
      - lib/USBHostUPS/src/HIDParser.cpp — tipo dell'item Output
      - lib/USBHostUPS/src/HidControl.h — cmdField con OUTPUT per ogni comando

      ## Criteri di Completamento
      - [ ] Item Output con report_type 0x02
      - [ ] cmdField accetta FEATURE e OUTPUT per tutte le righe comando
      - [ ] Nessuna lista di poll cambiata fuori dalla #22
    ref: TASK-01
  - id: TASK-02
    title: 'Test del parser e replay della #22 senza report 144; golden'
    type: Test
    status: DONE
    dependencies:
