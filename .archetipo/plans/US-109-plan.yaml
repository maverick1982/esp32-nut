  - id: TASK-03
    title: 'Cicalino: enable/disable con stato sconosciuto (beeperFieldRead); via QUIRK_NO_BEEPER_CONTROL'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** AC 5-6. Comandi del cicalino offerti come in NUT quando il valore non è nella tabella; il quirk inutilizzato viene tolto.

      **Leggi:** `lib/USBHostUPS/src/HidControl.h:47-100` (`supportedCommands`, `executeCommand` per i beeper), `:236-285` (`buildCommands`), `lib/USBHostUPS/src/IHidControlPort.h`, `lib/USBHostUPS/src/IUPSDriver.h`, `lib/USBHostUPS/src/GenericDriver.h/.cpp` (`_decoded_report`, `typeSlot`), `lib/USBHostUPS/src/USBHostUPS.cpp:1027-1050` (`getActiveBeeperPath`, `supportsBeeperToggle`), `lib/USBHostUPS/src/Quirks.h`, `test/test_record_replay/FixtureReplayRunner.h:55-70, 120-130, 250-262`, `nut_repo/drivers/powercom-hid.c:291-295, 658-660`.

      **Modifica:**
      1. `IUPSDriver`: `virtual bool beeperFieldRead(IHidTransport* host) const { return false; }`, con commento: the beeper report has been decoded at least once, even if its value is not in the table (US-109).
      2. `GenericDriver::beeperFieldRead()`: per ogni usage di tipo 1 o 3 con il percorso `host->getActiveBeeperPath()`, `true` se il report è in `_decoded_report`.
      3. `IHidControlPort`: `virtual bool beeperFieldRead() const { return false; }`. `USBHostUPS` lo implementa sotto `_mutex` con `_driver && _driver->beeperFieldRead(this)`.
      4. `HidControl`:
         - `buildCommands(..., size_t n_cmd_table, bool beeper_state_known = true)`: `beeper.toggle` e `beeper.mute` richiedono anche `beeper_state_known`; `beeper.enable` e `beeper.disable` solo `beeper_available`. Aggiornare il commento "Project rules kept";
         - `supportedCommands()`: `bool known = hasKey("ups.beeper.status"); bool beeper = port.supportsBeeperToggle() && (known || hid->beeperFieldRead());`, e passare `known`.
      5. `QUIRK_NO_BEEPER_CONTROL`: togliere la define e il flag della riga 0x0D9F/0x0004 da `Quirks.h`. La riga resta nella tabella con 0 e un commento: the SPD-750U offers the beeper commands as NUT does (US-109; the quirk was unused since e14b3d2).
      6. `FixtureReplayRunner.h`:
         - `ReplayMockHost::supportsBeeperToggle()` → `_parser.hasFeatureBeeperControl()`;
         - togliere il ramo Powercom della verifica (`:255-258`), lasciando solo l'asserzione generale;
         - `listCmd()` replica `supportedCommands()` usando `s.driver->beeperFieldRead(&s.host)`.
      7. Correggere i commenti che citano il quirk: `test/test_hid_commands/test_main.cpp` ~1115, `test/test_record_replay/test_main.cpp` ~535. Il risultato atteso del replay SPD-750U resta `test.battery.start.quick`, perché il report del cicalino non viene letto.

      **Verifica:** `grep -rn QUIRK_NO_BEEPER_CONTROL lib src test` vuoto. `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_hid_commands -f test_hid_control -f test_ups_control_port -f test_record_replay -f test_nut_server` verde, salvo i test che TASK-04 aggiunge.

      **Fatto:** comandi `beeper.enable` e `beeper.disable` disponibili a stato sconosciuto, toggle no; quirk rimosso.

      **Blocchi:**
      - se le golden `[cmd]` cambiano in fixture dove il report del cicalino è letto con un valore fuori tabella, è atteso: elencale nel commit;
      - se cambiano in altre fixture, fermati.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUPSDriver.h — hook beeperFieldRead
      - lib/USBHostUPS/src/GenericDriver.h, GenericDriver.cpp — implementazione
      - lib/USBHostUPS/src/IHidControlPort.h, USBHostUPS.h, USBHostUPS.cpp — port
      - lib/USBHostUPS/src/HidControl.h — regole dei comandi del cicalino
      - lib/USBHostUPS/src/Quirks.h — via il quirk
      - test/test_record_replay/FixtureReplayRunner.h — mock e listCmd

      ## Criteri di Completamento
      - [ ] enable/disable con il report letto anche senza ups.beeper.status
      - [ ] toggle/mute solo con stato noto
      - [ ] QUIRK_NO_BEEPER_CONTROL rimosso ovunque
    ref: TASK-03
