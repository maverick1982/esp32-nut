  - id: TASK-05
    title: 'Web UI: UPS LOAD a -- senza ups.load; riga DIAG senza tensione'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** AC 7-8. I valori assenti non compaiono come 0.

      **Leggi:** `data/www/bundle.js:555-590` (`renderTelemetry`: `elLoad`, `barLoad`, `elRealPower`), `src/core/main.cpp:296-308`, `scripts/embed_web.py` (si lancia a mano: il pre-script PlatformIO non rigenera).

      **Modifica:**
      1. `bundle.js`: `const load = data['ups.load'];`. Se `load === undefined`, il testo è `'--'` e la barra ha `width = '0%'` con il colore normale; altrimenti si comporta come oggi. Commento come quello di REAL POWER: a missing ups.load is not 0 % (US-109, #100).
      2. `python scripts/embed_web.py` → rigenera `data/www/index_inlined.html` e `include/network/web_assets.h`.
      3. `main.cpp`: se `usb_ups.getUPSData()` non ha né `output.voltage` né `input.voltage`, la riga termina con `| Voltage = --`; altrimenti resta com'è. Commento in italiano, come quello delle righe precedenti.

      **Verifica:** `npx playwright test e2e/ups-parameters.spec.ts` verde (i test esistenti con `ups.load` restano invariati); build `esp32-s3-standard` (da PowerShell: `& "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e esp32-s3-standard`) ok.

      **Fatto:** riquadro a `--` senza `ups.load`; riga DIAG senza `0.0 V` inventato.

      **Blocchi:** se `embed_web.py` cambia `web_assets.h` oltre al contenuto modificato (gzip diverso), è atteso; il contenuto decompresso deve differire solo nella modifica.

      ## File Coinvolti
      - data/www/bundle.js — riquadro UPS LOAD
      - data/www/index_inlined.html, include/network/web_assets.h — rigenerati
      - src/core/main.cpp — riga [DIAG]

      ## Criteri di Completamento
      - [ ] UPS LOAD a -- senza ups.load, 0 resta 0
      - [ ] Asset incorporati rigenerati
      - [ ] Riga DIAG senza tensione inventata
    ref: TASK-05
  - id: TASK-06
    title: 'E2E: riquadro UPS LOAD senza ups.load e con carico 0'
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** coprire AC 7 con la web UI vera.

