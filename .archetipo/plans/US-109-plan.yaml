      **Leggi:** `test/test_hid_parser/test_main.cpp` (stile dei descriptor sintetici), `test/test_record_replay/test_main.cpp` (`kApcPollSmartups750Pid0003Issue22`, `test_apc_5g_reads_feature_reports_issue22`, `test_apc_poll_baseline`), `test/test_record_replay/FixtureReplayRunner.h` (`checkGolden`, `ESP32NUT_WRITE_GOLDEN`), `test/test_hid_commands/test_main.cpp`.

      **Modifica:**
      1. `test_hid_parser`:
         - `test_output_items_are_output_reports`: descriptor sintetico con un Feature (ID 1) e un Output (ID 2) → tipi 3 e 2, `getExpectedLength(2, 2)` corretto, nessuna usage FEATURE con ID 2;
