  - id: TASK-07
    title: Prova sul campo con la build NUT_TEST_STUCK_CYCLE sull'Eaton 3S (solo dopo un sì esplicito)
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** vedere sulla scheda reale 12 cicli senza riavvio, il ritorno dell'UPS ogni volta, la rete di sicurezza al tredicesimo e l'heap stabile.

      **Leggere:** `docs/test-results/US-121/field-eaton3s.md` (formato e script), sezione Strategia di test del piano. Le credenziali della scheda sono nel file JSON indicato in memoria: non stamparle mai. Lo script `collect.py` (raccolta continua di `/api/logs` e `/api/system-status`) è nello scratchpad della sessione di US-121: copiarlo.

      **Modificare:** niente codice. Risultati in `docs/test-results/US-122/field-eaton3s.md` e `field/`.

      **Passi (solo dopo il sì esplicito dell'utente, chiesto al momento):**
      1) snapshot prima (status, NUT);
