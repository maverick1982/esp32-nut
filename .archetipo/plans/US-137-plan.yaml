  - id: TASK-10
    title: Estrarre la casella dei comandi Q* in QxRequestBox e farla usare dall'host
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** spostare la logica di `postQxRequest()`/`serviceQxRequest()`/`answerQxRequest()` in una classe pura, con attese e semafori dietro interfacce, senza cambiare comportamento (revisione di US-136, punto 1).

      **Leggere:** `lib/USBHostUPS/src/USBHostUPS.h` (struct `QxRequest`, righe ~230-238; membri `_qx_req*`, ~332-337; `QxUsbPort` come modello di classe interna), `lib/USBHostUPS/src/USBHostUPS.cpp:70-85` (creazione dei semafori), `318-390` (chiamate a `serviceQxRequest`), `745-752` (risposta allo stacco), `1882-2020`, `lib/USBHostUPS/src/EventBacklog.h` (stile di un header puro), sezione 6 del piano.

      **Modificare:**
      1. Nuovo `lib/USBHostUPS/src/QxRequestBox.h`, solo header, include `UpsCommands.h`/`NutTable.h` (quelli che oggi danno `CommandResult` e `NutTable::SetStatus`):
         - `struct QxRequest` spostata qui, identica;
         - `class IQxRequestSync { lock(); unlock(); bool ready(); bool takeCaller(uint32_t ms); void giveCaller(); bool waitDone(uint32_t ms); void signalDone(); void drainDone(); bool inPollTask(); }`;
         - `class IQxRequestTarget { bool hasDriver(); bool readyToPoll(); uint32_t waitMs(); CommandResult runCommand(const char* name, const char* param); NutTable::SetStatus runSetVariable(const char* name, const char* value); }`;
         - `class QxRequestBox` con `explicit QxRequestBox(IQxRequestSync&)`, `post()`, `service()`, `answer()`, `abandon(uint32_t gen)`, stato privato `QxRequest _req; uint32_t _gen = 0;` e un accessor `const QxRequest& current() const` per i test. Corpi = quelli di oggi con: `_mutex` → `lock()/unlock()` (RAII locale), `q` → target, `wait_ms` → `target.waitMs()`, `xTaskGetCurrentTaskHandle() == _poll_task_handle` → `inPollTask()`, semafori → metodi di sync; la coda di `post()` a tempo scaduto chiama `abandon(gen)`.
      2. `USBHostUPS.h`: rimuovere `QxRequest`, `_qx_req`, `_qx_req_gen`; aggiungere `class QxRequestPort : public IQxRequestSync, public IQxRequestTarget` interna (riferimento all'host, come `QxUsbPort`), membri `QxRequestPort _qx_req_port{*this}; QxRequestBox _qx_box{_qx_req_port};`; i semafori restano nell'host.
      3. `USBHostUPS.cpp`: `serviceQxRequest(can_run)` → `return _qx_box.service(can_run, _qx_req_port);`; `answerQxRequest(...)` → `_qx_box.answer(...)`; `postQxRequest(req)` → `return _qx_box.post(req, _qx_req_port);`; `runDriverCommand`/`runDriverSetVariable` invariati salvo il tipo spostato; implementazione di `QxRequestPort` con `takeFeedingWdt()` per `takeCaller`/`waitDone`, `std::recursive_mutex` dell'host per `lock`/`unlock`, `_driver ? _driver->qx() : nullptr` per i metodi del target (commento: chiamati solo dal task di poll o sotto il lock, solo il task di poll cancella `_driver`).

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` (da PowerShell) compila; `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native` verde.

      **Fatto quando:** l'host delega alla classe pura e il comportamento della casella è identico, riga per riga.

      **Blocchi:** se un passo di oggi non si esprime con le due interfacce senza cambiare l'ordine di lock e semafori, fermarsi e segnalarlo invece di cambiare l'ordine.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxRequestBox.h — nuovo: QxRequest, interfacce, QxRequestBox
      - lib/USBHostUPS/src/USBHostUPS.h — QxRequestPort, membri, rimozioni
      - lib/USBHostUPS/src/USBHostUPS.cpp — deleghe e implementazione di QxRequestPort

      ## Criteri di Completamento
      - [ ] `QxRequestBox.h` compila in nativo senza FreeRTOS
      - [ ] i tre metodi dell'host sono deleghe
      - [ ] ordine di lock, semafori e generazioni invariato
