    body: |-
      ## Descrizione
      **Obiettivo:** dopo un ripristino o uno stato Held, le chiavi del protocollo precedente non restano pubblicate se il nuovo protocollo è diverso (revisione di US-136, punto 2).

      **Leggere:** `lib/USBHostUPS/src/QxDriver.h`, `lib/USBHostUPS/src/QxDriver.cpp` (`setup()`, `poll()` caso `Probing`, `publish()`), `lib/USBHostUPS/src/UPSData.h` (`remove()`, `writes()`, `getAll()`), `lib/USBHostUPS/src/QxProbe.h` (`claimed()`), sezione 7 del piano.

      **Modificare:**
      1. `QxDriver.h`: `const char* _lastProtocol = nullptr;` con commento (nome statico del QxSubdriver dell'ultimo riconoscimento; non azzerato da `setup()`); metodo privato `void dropProtocolValues(const char* from, const char* to);`.
      2. `QxDriver.cpp`, caso `Probing` quando `step()` dà `Claimed`: prima di `takeEngine()`, `const QxSubdriver* c = _prober.claimed();`; se `c && _lastProtocol && strcmp(_lastProtocol, c->name) != 0` → `dropProtocolValues(_lastProtocol, c->name)`; poi `if (c) _lastProtocol = c->name;`.
      3. `dropProtocolValues()`: raccoglie in un vettore le chiavi di `_shadow.getAll()` diverse da `driver.name`, `ups.vendorid`, `ups.productid` e le toglie con `_shadow.remove()` (non ricreare `UPSData`: azzererebbe `writes()` e `publish()` potrebbe saltare); log `INFO` `[Q*] Protocol changed from <from> to <to>: previous values dropped`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_driver` verde senza toccare i test esistenti.

