  - id: TASK-11
    title: Test nativi della casella dei comandi Q* (test_qx_request_box)
    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Descrizione
      **Obiettivo:** coprire i casi che in US-136 erano rimasti senza test: generazione, abbandono, risposta allo stacco, link in pausa, richiesta dal task di poll.

      **Leggere:** `lib/USBHostUPS/src/QxRequestBox.h` (TASK-10), `test/test_qx_driver/test_main.cpp` (stile Unity).

      **Modificare:** nuova suite `test/test_qx_request_box/test_main.cpp` con:
      - `FakeSync`: contatori di `takeCaller/giveCaller/drainDone/signalDone`, flag `pollTask`, semaforo `done` simulato (bool), `std::function<void()> onWait` eseguita dentro `waitDone()` prima di leggere `done` (simula il task di poll), `waitResult` forzabile;
      - `FakeTarget`: flag `driver`, `ready`, `waitMs` fisso, risultati scelti, `std::function<void()> onRun` dentro `runCommand`/`runSetVariable`, contatore delle esecuzioni.

      Casi:
      1. comando risposto: `onWait` chiama `box.service(true, target)` → `post()` vero, `req.cmd` = risultato del target, una sola esecuzione, `giveCaller` chiamato una volta.
      2. SET VAR risposto: idem con `setvar = true` e `req.set`.
      3. nessun driver o non pronto: `post()` vero con NOT_CONNECTED, nessun `takeCaller`.
      4. abbandono: `onWait` non fa nulla e `waitDone` falso → `post()` falso, `current().pending` falso; un `service()` dopo ritorna falso senza eseguire.
      5. risposta tardiva: `onWait` chiama `service()` e `onRun` chiama `box.abandon(gen)` (il chiamante scaduto) → il risultato non viene scritto, `post()` falso.
      6. generazione: una `answer(..., genVecchia)` non tocca la richiesta corrente.
      7. stacco: con una richiesta pendente, `answer(NOT_CONNECTED, NOT_CONNECTED)` (gen 0) la chiude con NOT_CONNECTED e chiama `signalDone()`.
      8. link in pausa: `service(false, target)` → FAILED/FAILED, nessuna esecuzione, ritorna falso.
      9. driver sparito durante l'attesa: `service()` con `hasDriver()` falso → NOT_CONNECTED.
      10. dal task di poll: `pollTask = true` → esecuzione diretta, nessun `takeCaller`, `waitDone` o `drainDone`.
      11. `takeCaller` falso (un'altra richiesta non finisce) → `post()` falso senza toccare lo stato.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_request_box` verde.

      **Fatto quando:** gli 11 casi passano.

      **Blocchi:** se un caso rivela un comportamento diverso dall'host di oggi (`USBHostUPS.cpp:1882-1990` prima di TASK-10), correggere `QxRequestBox`, non il test.

      ## File Coinvolti
      - test/test_qx_request_box/test_main.cpp — nuova suite

      ## Criteri di Completamento
      - [ ] generazione, abbandono e risposta tardiva provati
      - [ ] NOT_CONNECTED allo stacco e FAILED con il link in pausa provati
      - [ ] richiesta dal task di poll senza semafori provata
    ref: TASK-11
