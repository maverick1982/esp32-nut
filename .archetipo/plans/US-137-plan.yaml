  - id: TASK-03
    title: Test nativi di qxGetStringAscii() e del trasporto krauler (test_qx_usb_transports)
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** provare la lettura ASCII e krauler con primitive finte, compresi errori e risposte vuote.

      **Leggere:** `test/test_qx_driver/test_main.cpp` (struttura Unity), `test/mocks/FakeQxUsbPrimitives.h` (TASK-01), `lib/USBHostUPS/src/QxUsbKrauler.h`.

      **Modificare:** nuova suite `test/test_qx_usb_transports/test_main.cpp` con almeno:
      1. `qxGetStringAscii`: due chiamate registrate `(0, 0x0000, 255)` e `(3, 0x0409, 255)`; con `langidList = 0x0407` la seconda usa 0x0407; carattere con byte alto o con `0x80` → `'?'`; troncamento a `buflen - 1` con NUL; indice 0 → -2 senza `stringCalls`; stringa 0 di 2 byte → -1 e una sola chiamata; tipo 0x02 → -1; bLength maggiore dei byte ricevuti → -1; timeout sulla stringa 0 → -7; descriptor vuoto `{2, 3}` → 0.
      2. krauler: `Q1\r` → indice 0x03, risposta con il primo byte sostituito da `(` e `\r` aggiunto se manca; `F\r` → `#`; `T\r` → 0x04 e primo byte `\r`; `C\r` e `CT\r` → 0x0b.
      3. krauler, tentativi: 3 risposte `UPS No Ack` poi una valida → 4 coppie di letture e risposta valida; 10 No Ack → ritorna 0 dopo 20 GET_DESCRIPTOR; risposta vuota → 0 al primo tentativo; STALL → -9 al primo tentativo.
      4. krauler, comando sconosciuto (`QS\r`, `T05\r`): ritorna la sua lunghezza, `buf` = il comando, `stringCalls` vuoto.
      5. krauler, budget: dispositivo muto → `command()` dura al massimo 3000 + `QX_CTRL_TIMEOUT_MS` ms sul clock e ritorna un errore.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_usb_transports` verde.

      **Fatto quando:** tutti i casi elencati passano.

      **Blocchi:** se un caso mostra una differenza dal codice di NUT, correggere il trasporto, non il test.

      ## File Coinvolti
      - test/test_qx_usb_transports/test_main.cpp — nuova suite

      ## Criteri di Completamento
      - [ ] indici, langid e wLength controllati per ogni lettura
      - [ ] tentativi, No Ack, risposte vuote ed errori di krauler provati
      - [ ] eco senza trasferimenti provata
      - [ ] budget con dispositivo muto provato
    ref: TASK-03
  - id: TASK-04
    title: QxFabulaTransport e QxHunnoxTransport con la sequenza preliminare di hunnox_protocol()
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** portare `fabula_command()`, `hunnox_command()` e `hunnox_protocol()` così come sono in NUT.

      **Leggere:** `nut_repo/drivers/nutdrv_qx.c:1240-1291` e `1427-1711`, `lib/USBHostUPS/src/QxUsbKrauler.cpp` (TASK-02), sezione 2 del piano.

      **Modificare:** in `QxUsbKrauler.h/.cpp`:
      1. Helper locale `int fabulaIndex(const char* cmd, size_t cmdlen, const Cmd* table)`: ricerca con `strncmp(cmd, str, cmdlen)`; se 0, spegnimenti con i due `sscanf` di `1474-1477` (`double val1 = -1; int val2 = -1;`), `delay` limitato a [.5, 10], `index = 16 + round((delay - .5) * 10) * 16` sotto 1, altrimenti `96 + (delay - 1) * 16` (assegnazioni a `int` come in C), `+8` se `val2 != 0`; ritorna 0 se il comando non è codificabile.
      2. `QxFabulaTransport` ("fabula", 3000): tabella `Q1` 0x03, `F` 0x0d, `I` 0x0c, `Q` 0x07, `C` 0x0a; indice 0 → eco; `ret = qxGetStringAscii(_usb, index, buf, buflen)`; `ret <= 0` → `return ret`; `\r` aggiunto se manca e c'è spazio; No Ack → `memset(buf, 0, buflen); return 0;`; altrimenti `return ret`.
      3. `QxHunnoxTransport` ("hunnox", 4500): tabella di fabula + `BL` 0xf3; membro `int _step = 0;`; indice 0 → eco (prima della sequenza); `hunnoxProtocol(index)` privato, copia dello switch di `1250-1290` con `HUNNOX_LANGID = 0x0409`, buffer locale `uint8_t tmp[255]`, `_usb.getStringDescriptor(i, 0x0409, tmp, 1026 o 102)` (la primitiva limita a 255: commento con il riferimento a hid_host.c:2098 e al fatto che un descriptor non supera 255 byte), esiti ignorati, `_usb.sleepMs(10)` dopo lo step 0, `novendor` non portato (commento), avanzamento `_step++; if (_step > 3) _step = 1;` e `default: _step = 0` come upstream; poi `if (buflen > 102) buflen = 102;`, `qxGetStringAscii`, `ret <= 0` → `return ret`; nessun `\r` aggiunto; No Ack → azzerato e 0.
      4. Commento sui rami `langid_fix` omessi (`1649-1655`, `1664-1690`) e sullo step che vive quanto il trasporto (un aggancio), come lo static di NUT.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_usb_transports` compila e resta verde.

      **Fatto quando:** i due trasporti compilano con la logica riga per riga di NUT.

      **Blocchi:** se `round()` o `sscanf` con `%lf` non compilano in nativo, includere `<math.h>`/`<stdio.h>`; non sostituire la formula.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxUsbKrauler.h — QxFabulaTransport, QxHunnoxTransport
      - lib/USBHostUPS/src/QxUsbKrauler.cpp — implementazioni e hunnoxProtocol()

      ## Criteri di Completamento
      - [ ] formula degli spegnimenti identica a upstream
      - [ ] sequenza preliminare di hunnox con langid 0x0409 e step come lo static di NUT
      - [ ] buffer di hunnox limitato a 102, nessun CR aggiunto
      - [ ] No Ack → buffer azzerato e 0 per fabula e hunnox
    ref: TASK-04
