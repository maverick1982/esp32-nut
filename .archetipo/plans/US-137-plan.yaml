  # US-137: Trasporti USB krauler, fabula e hunnox copiati da nutdrv_qx — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-07

  ---

  ## Spec

  **Epic:** EP-007 — Supporto UPS Q* (nutdrv_qx)
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come utente con un UPS Q* dietro un bridge della famiglia krauler (0001:0000, come quelli di #91 e #28), voglio che la scheda parli con il mio UPS come fa NUT, mandando i comandi come indici di string descriptor, in modo che il mio UPS passi da "non ancora supportato" al riconoscimento del protocollo.

  **Criteri di Accettazione**
  - `krauler_command()`, `fabula_command()` e `hunnox_command()` (`nut_repo/drivers/nutdrv_qx.c:1294`, `1427`, `1546`) e la sequenza di `hunnox_protocol()` (`nutdrv_qx.c:1240-1291`) portati fedelmente: tabelle comando → indice, langid (0x0409 per hunnox quando `langid_fix` non è impostato), tentativi, buffer da 102 byte di hunnox, ricostruzione della risposta.
  - Le righe Q* krauler, fabula e fabula_hunnox di US-132 usano questi trasporti; le altre righe restano "non ancora supportato".
  - Un comando che il trasporto non sa codificare fallisce subito, senza trasferimenti USB, come in NUT.
  - Il limite di attesa di ogni trasporto rispetta il criterio di US-136.
  - Gli scambi compaiono nella sezione Q* dell'export diagnostico.
  - Test nativi per i tre trasporti con primitive finte, compresi errori e risposte vuote.
  - Dalla revisione di US-136: test nativi della casella dei comandi Q* (logica estratta in una classe pura) e svuotamento dei dati ombra quando viene riconosciuto un protocollo diverso dal precedente.

  ---

  ## Soluzione tecnica

  Le tre funzioni di NUT diventano tre classi su `QxUsbTransport` (US-136) in un file nuovo, puro e compilato anche in nativo. L'host cambia solo per una primitiva in più (`sleepMs()`, l'`usleep(10000)` di hunnox) e per la casella dei comandi Q*, che passa in una classe pura senza cambiare comportamento. Motore, protocolli e riconoscimento non si toccano: con un trasporto registrato, `claimQxInterface()` crea già il driver Q* (US-136).

  ### 1. La lettura di NUT senza `langid_fix`: `usb_get_string_simple()`

  - Senza `langid_fix` i tre trasporti leggono la risposta con `usb_get_string_simple()`, cioè `libusb_get_string_descriptor_ascii()` (`nut_repo/drivers/usb-common.h:352-371`). Si porta come funzione libera `int qxGetStringAscii(IQxUsbPrimitives& usb, uint8_t index, char* buf, size_t buflen)`:
    1. `index == 0` → `QX_USB_ERR_INVALID_PARAM` (-2, LIBUSB_ERROR_INVALID_PARAM) senza traffico;
    2. GET_DESCRIPTOR(stringa 0, langid 0, 255 byte) in un buffer locale `uint8_t tbuf[255]`: errore < 0 → ritornato; meno di 4 byte → `QX_USB_ERR_IO`; `langid = tbuf[2] | (tbuf[3] << 8)`;
    3. GET_DESCRIPTOR(index, langid, 255 byte) in `tbuf`: errore < 0 → ritornato; `tbuf[1] != 0x03` o `tbuf[0] > ricevuti` → `QX_USB_ERR_IO`;
    4. da `si = 2` a `si < tbuf[0]` a passi di 2: se `di >= buflen - 1` stop; `(tbuf[si] & 0x80) || tbuf[si + 1]` → `'?'`, altrimenti `tbuf[si]`; `buf[di] = 0`; ritorna `di`.
  - Come libusb, la lista dei langid si rilegge a ogni comando: due GET_DESCRIPTOR per comando, nessuna cache.
  - Scelta registrata nel commento: si copia la forma con il buffer da 255 byte anche per la stringa 0 (libusb 1.0.2x). Le versioni più recenti di libusb chiedono solo 4 byte per la stringa 0: se un tester mostra un errore su quella lettura si passa a 4.
  - Il `buflen` dei trasporti limita solo i caratteri ASCII copiati, non il wLength (sempre 255): è così anche in NUT senza `langid_fix`. Il "buffer da 102 byte" di hunnox vuol dire quindi una risposta di al massimo 101 caratteri; le letture della sequenza preliminare invece chiedono davvero 102 byte (`usb_get_string()` diretto).

  ### 2. I trasporti: `lib/USBHostUPS/src/QxUsbKrauler.h/.cpp`

  - **`QxKraulerTransport`** ("krauler", 3000 ms), copia di `nutdrv_qx.c:1294-1424`: tabella comando → (indice, prefisso) di `1300-1317` (`Q1\r` 0x03 `(`, `F\r` 0x0d `#`, `I\r` 0x0c `#`, `T\r` 0x04 `\r`, `TL\r` 0x05 `\r`, `Q\r` 0x07 `\r`, `C\r` 0x0b `\r`, `CT\r` 0x0b `\r`); confronto `strncmp(cmd, str, cmdlen)` identico (è un confronto di prefisso, va lasciato così); fino a 10 tentativi; `ret <= 0` → ritorna `ret`; `\r` aggiunto se manca e se `ret < buflen - 1`; `"UPS No Ack"` (10 caratteri prima del `\r`, senza maiuscole/minuscole) → tentativo successivo; poi `buf[0] = prefisso` e ritorna `ret`; dopo 10 No Ack ritorna 0.
  - **`QxFabulaTransport`** ("fabula", 3000 ms), copia di `1427-1541`: tabella `Q1` 0x03, `F` 0x0d, `I` 0x0c, `Q` 0x07, `C` 0x0a; spegnimenti con `sscanf(cmd, "S%lfR%d\r", ...) == 2 || sscanf(cmd, "S%lf\r", ...) == 1` e la formula di `1474-1491` (`round()` di `math.h`, conversioni double → int come in C, `val2` iniziale -1 quindi `S<n>` senza R dà +8); lettura con `qxGetStringAscii`; `\r` aggiunto se manca; `"UPS No Ack"` → `memset(buf, 0, buflen)` e ritorna 0.
  - **`QxHunnoxTransport`** ("hunnox", 4500 ms), copia di `1546-1711`: tabella di fabula più `BL` 0xf3; un comando sconosciuto fa l'eco **prima** della sequenza preliminare (lo step non avanza); poi `hunnoxProtocol(index)` = `hunnox_protocol()` di `1240-1291` con langid 0x0409 costante, letture con `getStringDescriptor()` diretto ed esiti ignorati: step 0 legge stringa 0, stringa 0, stringa 1 con 1026 byte (la primitiva chiede 255, limite di `lib/usb_host_hid/hid_host.c:2098`: un string descriptor non supera mai 255 byte) e poi `sleepMs(10)`; step 1 legge 0x0d se l'indice non è 0x0d, step 2 legge 0x03 se l'indice non è 0x03, step 3 legge 0x0c se l'indice non è 0x0c (`novendor` considerato non impostato), tutte con 102 byte; poi `step++`, oltre 3 torna a 1. Quindi `buflen = min(buflen, 102)`, `qxGetStringAscii`, **nessun** `\r` aggiunto (hunnox non lo fa), `"UPS No Ack"` → buffer azzerato e ritorna 0.
  - Un comando che il trasporto non sa codificare restituisce l'eco `snprintf(buf, buflen, "%s", cmd)` senza trasferimenti, come NUT; è il motore a trattarlo come fallimento (risposta non valida per le interrogazioni, eco = comando rifiutato per `instcmd()`, `nutdrv_qx.c:2920-2923`).
  - Lo step di hunnox è un membro inizializzato a 0, come lo `static` di NUT: vive quanto il trasporto, cioè un aggancio. `recoverInterface()` richiama `setup()` sullo stesso trasporto e non lo azzera, come in NUT una ripresa della comunicazione non azzera lo static.
  - `langid_fix`, `noscanlangid` e `novendor` non portati (assunzione della storia): i rami `langid_fix != -1` sono omessi con un commento che indica le righe upstream da cui ripartire.
  - Niente `upsdebugx`: comandi, risposte ed errori sono già registrati da `QxDriver::Recorder` nell'export.

  ### 3. Primitive

  - `IQxUsbPrimitives::sleepMs(uint32_t ms)` (l'`usleep()` di hunnox). Host: `vTaskDelay(pdMS_TO_TICKS(ms))` nel task di poll, senza lock (ADR 0008). Fake: `clock += ms` e registro delle attese.
  - `QX_USB_ERR_INVALID_PARAM = -2` accanto agli altri codici di `IQxUsbPrimitives.h`.
  - `QxUsbPort::getStringDescriptor()` dell'host non cambia.

  ### 4. Registrazione e limiti di attesa

  - `QxUsbTransports.cpp`, tabella `ROWS`: `krauler` 3000, `fabula` 3000, `hunnox` 4500. Sono i nomi di `usbsubdriver[]` (`nutdrv_qx.c:3376-3392`) e delle righe di `DriverRegistry.cpp:84-106`: `fabula` (MEC/MEC0003), `hunnox` (la fabula_hunnox della storia, prodotto MEC0003), `krauler` sia per 0001:0000 senza stringhe sia per 1CB0:0035 (Legrand Daker), come in NUT. Le altre righe restano "non ancora supportato".
  - Limiti (criterio di US-136): `qxStepBoundMs(3000)` = 7,5 s, `qxStepBoundMs(4500)` = 10,5 s, entrambi ≤ `QX_STEP_BOUND_MAX_MS` (12 s). La scadenza del comando ferma i 10 tentativi di krauler e le letture preliminari di hunnox (le primitive rifiutano i trasferimenti oltre la scadenza). Il commento della tabella in `QxUsbTransport.h` diventa: krauler e fabula 2 GET_DESCRIPTOR per comando (langid + indice); hunnox fino a 3 letture preliminari + 2.

  ### 5. Export diagnostico

  - Nessun cambio di formato: `QxDriver::Recorder` registra già ogni comando, compresa l'eco (durata 0) e gli errori con `lastError()` della primitiva. Un test con il trasporto krauler lo verifica.

  ### 6. Revisione di US-136, punto 1: la casella dei comandi in `QxRequestBox`

  - Nuovo header puro `lib/USBHostUPS/src/QxRequestBox.h` (come `EventBacklog.h`): `struct QxRequest` si sposta qui da `USBHostUPS.h`; due interfacce:
    - `IQxRequestSync`: `lock()`/`unlock()` (il `_mutex` ricorsivo dell'host), `takeCaller(ms)`/`giveCaller()` (`_qx_req_mutex` con `takeFeedingWdt`), `waitDone(ms)` (`_qx_req_done` con `takeFeedingWdt`), `signalDone()`, `drainDone()` (`xSemaphoreTake(done, 0)`), `inPollTask()`, `ready()` (i semafori esistono);
    - `IQxRequestTarget`: `hasDriver()` (c'è un driver Q*), `readyToPoll()`, `waitMs()` (la formula di oggi con `qxStepBoundMs(transportBudgetMs())`), `runCommand(name, param)`, `runSetVariable(name, value)`.
  - `class QxRequestBox`: `bool post(QxRequest&, IQxRequestTarget&)`, `bool service(bool canRun, IQxRequestTarget&)`, `void answer(CommandResult, NutTable::SetStatus, uint32_t gen = 0)`, `void abandon(uint32_t gen)` (la coda di `post()` quando l'attesa scade: pubblica per poter simulare nei test l'intreccio con il task di poll). Logica identica a `postQxRequest()`/`serviceQxRequest()`/`answerQxRequest()` di oggi: generazione, abbandono, NOT_CONNECTED senza driver, FAILED con il link in pausa, esecuzione diretta dal task di poll.
  - `USBHostUPS`: membro `QxRequestBox` e classe interna `QxRequestPort` che implementa le due interfacce (come `QxUsbPort`); i tre metodi diventano deleghe di una riga, `takeFeedingWdt()` resta nell'host. I `run*()` del target leggono `_driver->qx()` senza lock: solo il task di poll cancella `_driver` e solo lui li chiama (come oggi).

  ### 7. Revisione di US-136, punto 2: dati del protocollo precedente

  - `QxDriver`: membro `const char* _lastProtocol = nullptr` (il nome statico di `QxSubdriver`). Al passaggio Probing → claim, prima di `initUps()`: se `_lastProtocol` non è nullo e `strcmp(_lastProtocol, claimed->name) != 0`, `dropProtocolValues()` toglie con `_shadow.remove()` ogni chiave tranne `driver.name`, `ups.vendorid`, `ups.productid` e scrive nel log INFO `[Q*] Protocol changed from <vecchio> to <nuovo>: previous values dropped`; poi `_lastProtocol = claimed->name`.
  - Si usa `remove()` e non un nuovo `UPSData`: `remove()` incrementa `writes()`, quindi `publish()` toglie le chiavi anche ai client NUT; un oggetto nuovo azzererebbe `writes()` e `publish()` potrebbe saltare il giro.
  - Stesso protocollo: comportamento invariato (i dati ombra restano, test esistente `test_setup_after_a_recovery_probes_again_and_keeps_the_values`). Il primo giro completo ripopola le chiavi prima che il dato sia servito (`isWaitingFirstData()`).

  ---

  ## Strategia di test

  Tutto in nativo: i trasporti sono puri e la casella dei comandi lo diventa. Nessuna superficie utente nuova, quindi niente e2e né video dimostrativo; la prova sull'UPS reale arriva con la build di test di US-138 (assunzione della storia: non abbiamo un UPS della famiglia krauler).

  - **`test/test_qx_usb_transports`** (suite nuova), con `FakeQxUsbPrimitives` in modalità script: per ogni trasporto indice, langid e wLength di ogni GET_DESCRIPTOR, numero di tentativi, risposta ricostruita (prefisso krauler, `\r` aggiunto o no, conversione UTF-16 con `'?'`), eco senza trasferimenti, errori (timeout, STALL, stringa 0 corta, tipo sbagliato, bLength oltre i byte ricevuti, indice 0), risposte vuote, `UPS No Ack`, formula degli spegnimenti di fabula/hunnox, sequenza preliminare di hunnox su più comandi con langid 0x0409, 1026 → 255 e 102 byte, attesa di 10 ms, limite di 101 caratteri, scadenza del budget con il dispositivo muto.
  - **`test/test_qx_driver`**: tre rig completi (krauler, fabula, hunnox su un dispositivo finto a string descriptor con le risposte di `MEGATEC_TESTING`) arrivano al protocollo riconosciuto e al primo giro; l'export contiene gli scambi; ogni passo resta entro `qxStepBoundMs()` con l'UPS muto; cambio di protocollo Megatec → Q1 dopo un ripristino.
  - **`test/test_qx_request_box`** (suite nuova): generazione, abbandono, risposta tardiva scartata, NOT_CONNECTED allo stacco, FAILED con il link in pausa, richiesta dal task di poll senza semafori.
  - **Regressione:** suite nativa completa senza cambiare asserzioni esistenti (tranne `test_no_transport_ported_yet`, che per definizione cambia), build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`, dimensione del firmware S3 confrontata con `130dfe0` e con lo slot da 4 MB di #93 (0x1F0000 = 2 031 616 byte).

  ---

  _Piano generato via ARchetipo Planning — 2026-11-07_
tasks:
  - id: TASK-01
    title: 'Primitive Q*: sleepMs() e QX_USB_ERR_INVALID_PARAM; FakeQxUsbPrimitives con un dispositivo a string descriptor'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** dare ai trasporti della famiglia krauler l'attesa di hunnox e ai test un dispositivo finto che risponde ai GET_DESCRIPTOR, senza cambiare il comportamento dei test esistenti.

      **Leggere:** `lib/USBHostUPS/src/IQxUsbPrimitives.h`, `lib/USBHostUPS/src/USBHostUPS.h` (classe `QxUsbPort`, righe ~204-227), `lib/USBHostUPS/src/USBHostUPS.cpp:1780-1880` (primitive dell'host), `test/mocks/FakeQxUsbPrimitives.h`, `test/mocks/QxTestingTransport.h`, sezione 3 del piano.

      **Modificare:**
      1. `IQxUsbPrimitives.h`: `static const int QX_USB_ERR_INVALID_PARAM = -2;` (commento: LIBUSB_ERROR_INVALID_PARAM, indice 0 di `qxGetStringAscii`); metodo virtuale puro `virtual void sleepMs(uint32_t ms) = 0;` con commento (usleep() dei trasporti, hunnox; nel task di poll, senza lock).
      2. `USBHostUPS.h`/`.cpp`: `QxUsbPort::sleepMs()` = `vTaskDelay(pdMS_TO_TICKS(ms))`.
      3. `FakeQxUsbPrimitives.h`:
         - `struct StringCall { uint8_t index; uint16_t langid; size_t buflen; uint32_t atMs; }; std::vector<StringCall> stringCalls;` (solo i trasferimenti partiti, non i rifiuti per scadenza);
         - `struct StringReply { int ret; std::vector<uint8_t> bytes; }; std::deque<StringReply> stringScript;`: se non vuota, `getStringDescriptor` prende la testa: `ret < 0` → errore (con `QX_USB_ERR_TIMEOUT` il clock avanza di `QX_CTRL_TIMEOUT_MS`), altrimenti copia `min(bytes.size(), buflen)` byte e ritorna quel numero;
         - `bool stringDevice = false; uint16_t langidList = 0x0409;`: con la coda vuota e `stringDevice` vero, indice 0 → `{4, 0x03, lo, hi}` di `langidList`; altri indici → comando dalla mappa propria del fake (0x03 `Q1\r`, 0x0d `F\r`, 0x0c `I\r`, 0x07 `Q\r`, 0x0a e 0x0b `C\r`, 0x04 `T\r`, 0x05 `TL\r`, 0xf3 `BL\r`), risposta da `device.command()` codificata come string descriptor (al massimo 126 caratteri); indice fuori mappa → `QX_USB_ERR_PIPE`;
         - `muted` vale anche qui (timeout di `QX_CTRL_TIMEOUT_MS` sul clock), la scadenza pure (`"budget"`, nessun `StringCall`); ogni trasferimento riuscito fa avanzare il clock di 2 ms;
         - helper statici `std::vector<uint8_t> stringDescriptor(const char* ascii)` e `langidDescriptor(uint16_t)` per gli script dei test;
         - `sleepMs()`: `clock += ms; sleeps.push_back(ms);`;
         - con coda vuota e `stringDevice` falso resta `QX_USB_ERR_PIPE` come oggi.
      4. Ogni altra implementazione di `IQxUsbPrimitives` nei test (cercare con grep `IQxUsbPrimitives` in `test/`) riceve `sleepMs()`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_driver -f test_qx_interrupt_read` verde senza cambiare i test.

      **Fatto quando:** l'interfaccia ha `sleepMs()`, l'host la implementa e il fake risponde ai string descriptor in modalità script e dispositivo.

      **Blocchi:** se un'altra classe di produzione implementa `IQxUsbPrimitives` oltre a `QxUsbPort`, aggiungere `sleepMs()` anche lì e segnalarlo.

      ## File Coinvolti
      - lib/USBHostUPS/src/IQxUsbPrimitives.h — sleepMs(), QX_USB_ERR_INVALID_PARAM
      - lib/USBHostUPS/src/USBHostUPS.h — dichiarazione di QxUsbPort::sleepMs()
      - lib/USBHostUPS/src/USBHostUPS.cpp — QxUsbPort::sleepMs()
      - test/mocks/FakeQxUsbPrimitives.h — script, dispositivo a string descriptor, registri

      ## Criteri di Completamento
      - [ ] `sleepMs()` nell'interfaccia, nell'host e nel fake
      - [ ] il fake registra indice, langid e buflen di ogni GET_DESCRIPTOR partito
      - [ ] modalità script e modalità dispositivo funzionanti, PIPE di default
      - [ ] test_qx_driver e test_qx_interrupt_read verdi senza modifiche
    ref: TASK-01
  - id: TASK-02
    title: qxGetStringAscii() e QxKraulerTransport in QxUsbKrauler.h/.cpp
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** portare `usb_get_string_simple()` e `krauler_command()` così come sono in NUT.

      **Leggere:** `nut_repo/drivers/usb-common.h:325-371`, `nut_repo/drivers/nutdrv_qx.c:1294-1424`, `lib/USBHostUPS/src/QxUsbTransport.h`, sezioni 1 e 2 del piano.

      **Modificare:**
      1. Nuovo `lib/USBHostUPS/src/QxUsbKrauler.h`: commento di testa (trasporti della famiglia krauler, ADR 0013 sezione 3, comando = indice di string descriptor); dichiarazione di `int qxGetStringAscii(IQxUsbPrimitives& usb, uint8_t index, char* buf, size_t buflen);`; `class QxKraulerTransport : public QxUsbTransport` con `name()` "krauler", `commandBudgetMs()` 3000, `doCommand()`.
      2. Nuovo `lib/USBHostUPS/src/QxUsbKrauler.cpp`:
         - `qxGetStringAscii()` come nella sezione 1 del piano (passi 1-4), con il commento sulla scelta dei 255 byte per la stringa 0 (libusb 1.0.2x; le versioni recenti chiedono 4 byte);
         - helper locale `bool isUpsNoAck(const char* buf)` = `strcspn(buf, "\r") == 10 && strncasecmp(buf, "UPS No Ack", 10) == 0` (scrivere un confronto ASCII senza maiuscole se `strncasecmp` non è disponibile in nativo con mingw: `_strnicmp`, oppure un ciclo locale come `equalsIgnoreCase` di `DriverRegistry.cpp`);
         - `QxKraulerTransport::doCommand()`: tabella di `nutdrv_qx.c:1300-1317` in un array locale `static const`; cap di `buflen` a `INT_MAX - 1`; ciclo con `strncmp(cmd, str, cmdlen)`; 10 tentativi; `ret = qxGetStringAscii(_usb, index, buf, buflen)`; `ret <= 0` → `return ret`; `\r` aggiunto se `memchr(buf, '\r', ret) == NULL` e `(size_t)ret < buflen - 1`; No Ack → `continue`; `buf[0] = prefix; return ret;`; dopo il ciclo `return 0`; nessuna riga → `return snprintf(buf, buflen, "%s", cmd);`.
         - Commento dove NUT ha i rami `langid_fix != -1` (`nutdrv_qx.c:1338-1342`, `1358-1382`): non portati, assunzione di US-137 / ADR 0013.
      3. `platformio.ini`, `[env:native]` `build_src_filter`: `+<../lib/USBHostUPS/src/QxUsbKrauler.cpp>` accanto a `QxUsbTransports.cpp`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_driver` compila e passa.

      **Fatto quando:** helper e trasporto krauler compilano in nativo con la logica riga per riga di NUT.

      **Blocchi:** nessuno noto.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxUsbKrauler.h — nuovo: qxGetStringAscii, QxKraulerTransport
      - lib/USBHostUPS/src/QxUsbKrauler.cpp — nuovo: implementazioni
      - platformio.ini — sorgente nel filtro nativo

      ## Criteri di Completamento
      - [ ] `qxGetStringAscii()` segue i 4 passi di libusb_get_string_descriptor_ascii()
      - [ ] tabella, tentativi, CR, No Ack e prefisso di krauler come upstream
      - [ ] eco senza trasferimenti per i comandi fuori tabella
      - [ ] il nuovo file compila in nativo
