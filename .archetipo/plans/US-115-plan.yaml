    body: |-
      ## Descrizione
      **Obiettivo:** verificare sulla scheda reale (COM5, 192.168.1.126, UPS `eaton-3s-700`) persistenza e protocollo. Da eseguire solo dopo un sì esplicito dell'utente: la scheda alimenta la rete di casa dall'Eaton 3S.

      **Leggere:** memoria del progetto sulle credenziali OTA (file JSON, mai stamparlo) e sul flash senza erase.

      **Passi:** 1) flash della build `esp32-s3-standard` senza erase (conserva NVS); 2) dal tab NUT Server aggiungere `battery.date = 2025-03-01` ("Battery replaced") e `ups.model = Eaton 3S 700 studio`; 3) `upsc eaton-3s-700@192.168.1.126`: `battery.date`, `ups.model`, `device.model` e i due `driver.parameter.override.*`; dashboard con il modello reale; 4) override di `battery.charge.low`: `upsrw` non la elenca, `upsrw -s` risponde READONLY, UPS Settings la mostra bloccata; 5) riavvio della scheda: override ancora presenti; 6) eliminazione dei record: tornano i valori reali; 7) System Log con le righe `[NUT]`.

      **Verifica:** output di `upsc`/`upsrw` e screenshot salvati in `docs/test-results/US-115/`.

      **Blocchi:** senza consenso esplicito il task resta TODO e lo si segnala in review.

