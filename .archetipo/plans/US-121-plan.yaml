    ref: TASK-06
  - id: TASK-07
    title: 'ADR 0008: UPS che non torna dopo un riavvio automatico'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** documentare la decisione, i limiti dell'API e i rischi aperti.

      **Leggere:** `docs/adr/0008-non-blocking-hid-callbacks-and-control-pipe-recovery.md` (parti su `RestartPolicy` e degraded mode), sezioni Contesto verificato e Soluzione tecnica del piano.

      **Modificare:** nuova sezione `UPS not enumerated after an automatic restart (US-121, 2026-11-xx)` nella lingua dell'ADR. Contenuto:
      - causa in IDF (`ENUM_EVENT_CANCELED` → porta disabilitata, nessun nuovo tentativo);
      - ciclo logico della porta root (la VBUS non viene tolta), tempi 1/2/3 min, `MAX_PORT_CYCLES`;
      - integrazione con `RestartPolicy` e motivo `UPS not enumerated after the automatic restart`;
      - campo `ups_not_enumerated` e banner;
      - perché un'enumerazione fallita non va nel System Log (nessun evento pubblico, hook di `esp_log` scartato);
      - rischi: efficacia del solo ciclo non dimostrata sul banco, nodo del device tree se lo spegnimento non generasse la disconnessione, device non HID contato come enumerato tramite `num_devices`;
      - build di prova `NUT_TEST_ENUM_WATCHDOG`.

      **Passi:** 1) scrivere la sezione; 2) aggiornare l'indice dell'ADR se elenca le sezioni.

      **Verifica:** rilettura; i riferimenti `file:riga` di IDF sono corretti per 5.5.5.

      **Fatto:** il criterio 4 della spec (spiegazione del perché il fallimento non si vede) è coperto.

      **Blocchi:** nessuno previsto.

      ## File Coinvolti
      - docs/adr/0008-non-blocking-hid-callbacks-and-control-pipe-recovery.md — nuova sezione US-121

      ## Criteri di Completamento
      - [ ] Meccanismo, tempi e integrazione descritti
      - [ ] Spiegato perché l'enumerazione fallita non si può scrivere nel System Log
      - [ ] Rischi aperti elencati
    ref: TASK-07
