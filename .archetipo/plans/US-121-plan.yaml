    body: |-
      ## Descrizione
      **Obiettivo:** quando i tentativi sono esauriti perché l'UPS non si è mai enumerato, il banner lo dice e chiede di staccare e riattaccare il cavo USB.

      **Leggere:** `data/www/bundle.js` (`renderDiagnostics`, ~riga 2388), `scripts/embed_web.py`, sezione 4 del piano.

      **Modificare:** `data/www/bundle.js`: se `diag.degraded && diag.ups_not_enumerated`, `addLine('The UPS did not come back after the automatic restart: the board restarted ' + diag.consecutive_restarts + ' times in a row and power-cycled its USB port, and the UPS never enumerated. Automatic restarts are suspended and NUT clients get ERR DATA-STALE. Unplug and replug the UPS USB cable.')`; altrimenti, se `diag.degraded`, la riga di oggi.

      **Passi:** 1) modifica; 2) build S3 (rigenera `index_inlined.html`, `include/network/web_assets.h` e il suo hash).

      **Verifica:** la build rigenera gli asset senza errori; la stringa è presente in `data/www/index_inlined.html`.

      **Fatto:** nessun altro cambiamento al banner.

      **Blocchi:** nessuno previsto.

