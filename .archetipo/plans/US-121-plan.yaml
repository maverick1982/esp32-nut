  - id: TASK-09
    title: Prova sul campo con la build NUT_TEST_ENUM_WATCHDOG sull'Eaton 3S (solo dopo un sì esplicito)
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Descrizione
      **Obiettivo:** vedere sulla scheda reale i WARN, lo stacco e il ritorno dell'UPS con il ciclo della porta root, la richiesta di riavvio e la chiusura del ciclo.

      **Leggere:** sezione Strategia di test del piano, `docs/test-results/US-120/field-eaton3s.md` (formato), `scripts/nut_snapshot.py`. Le credenziali della scheda sono nel file JSON indicato in memoria: non stamparle mai.

      **Modificare:** niente codice. Risultati in `docs/test-results/US-121/field-eaton3s.md` e `field/`.

      **Passi (solo dopo il sì esplicito dell'utente, chiesto al momento):**
      1) build S3 con `PLATFORMIO_BUILD_FLAGS=-DNUT_TEST_ENUM_WATCHDOG=1`, OTA sulla scheda di test;
      2) leggere il System Log a 1, 2 e 3 min: due WARN `UPS not enumerated ... power-cycling the USB port`, `HID Device Connected event` e interfaccia ripresa dopo ogni ciclo, poi `Recovery exhausted (UPS not enumerated after the automatic restart)` e `Controlled restart`;
      3) dopo il riavvio: `Last automatic restart: UPS not enumerated after the automatic restart` nel banner/diagnostica, `Automatic restart #1: waiting for the UPS to enumerate`, UPS enumerato senza cicli, contatore azzerato dopo i dati freschi; `upsc` con le stesse chiavi;
      4) OTA della build normale e controllo finale.

      **Verifica:** i passi 2-4 come descritti; nessun panic, nessun `abort` nello stack USB.

      **Fatto:** file dei risultati scritto; sulla scheda resta la build normale.

      **Blocchi:** senza il sì dell'utente non si fa. Se dopo un ciclo l'UPS non torna, fermarsi, raccogliere il System Log e riportare (non insistere con altri riavvii).

      ## File Coinvolti
      - docs/test-results/US-121/field-eaton3s.md — esito della prova
      - docs/test-results/US-121/field/ — log, snapshot NUT, diagnostica

      ## Criteri di Completamento
      - [ ] Due cicli della porta visti nel System Log, UPS tornato dopo ciascuno
      - [ ] Riavvio controllato con il nuovo motivo, poi ritorno normale e contatore azzerato
      - [ ] Build normale di nuovo sulla scheda
    ref: TASK-09
