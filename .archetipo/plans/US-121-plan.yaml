      ## Descrizione
      **Obiettivo:** verificare nel browser le tre varianti del banner.

      **Leggere:** `e2e/system-status.spec.js` (`serveIndex`, mock di `/api/system-status`), `e2e/support/webui.*`, `data/www/bundle.js` (`renderDiagnostics`, `#diag-banner`).

      **Modificare:** nuovo `e2e/diag-banner.spec.ts` (o un `describe` in `e2e/system-status.spec.js`, seguendo lo stile del file scelto) con:
      - `degraded` + `ups_not_enumerated` + `consecutive_restarts: 4` → `#diag-banner` visibile con `Unplug and replug the UPS USB cable` e `did not come back after the automatic restart`, senza la riga generica `Degraded mode:`;
      - solo `degraded` → riga generica `Degraded mode:`, senza la nuova;
      - nessun `degraded` → nessuna delle due righe.

      **Passi:** 1) scrivere i test; 2) eseguirli; 3) eseguire tutta la suite e2e.

      **Verifica:** `npx playwright test e2e/diag-banner.spec.ts` verde, poi `npx playwright test` verde.

