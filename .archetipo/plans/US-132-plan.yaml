      - lib/WebApi/src/WebApiJson.cpp — `_unsupported` e `upsStatusJson()`
      - src/network/web_config_server.cpp — usa `upsStatusJson()`

      ## Criteri di Completamento
      - [ ] `IUpsSource` ha `unsupportedDevice()` con default vuoto
      - [ ] `/api/ups-vars` aggiunge `_unsupported` solo con UPS non connesso e testo non vuoto
      - [ ] `/api/system-status` è identico a prima nei casi esistenti e dà "Not supported yet" + `unsupported` per l'UPS Q*
