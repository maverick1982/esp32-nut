    body: |-
      ## Descrizione
      **Obiettivo:** il comportamento dei consumatori con un UPS Q* è fissato da test.

      **Leggere:** `test/test_web_api/test_main.cpp:11-170` (`APIMockUSBHost`, test di `generateUpsVars`), `test/test_nut_server/test_main.cpp` (sorgente finta e casi "nessun UPS"), `lib/WebApi/src/WebApiJson.h` dopo TASK-03.

      **Modificare:**
      1. `test_web_api`: nel mock un campo `unsupported` restituito da `unsupportedDevice()`. Test: scollegato senza testo → JSON di oggi senza `_unsupported`; scollegato con testo → `_disconnected` + `_unsupported`; connesso con testo (caso impossibile ma difensivo) → nessun `_unsupported`.
      2. `test_web_api`: `upsStatusJson()` per scollegato ("Disconnected"), Q* ("Not supported yet" + `unsupported`), connesso con modello, connesso senza modello ("Unknown Model"), dati vecchi (`stale`), attesa del primo dato (niente `stale`).
      3. `test_nut_server`: con la sorgente finta non connessa e `unsupportedDevice()` non vuoto, `LIST VAR`, `GET VAR ups.status` e `LIST CMD` rispondono come nel test "nessun UPS" esistente (stesse stringhe attese).

      Nessuna asserzione esistente cambia.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_web_api -f test_nut_server`.

      **Fatto quando:** i test nuovi passano insieme ai vecchi.

      **Blocchi:** se il server NUT risponde diversamente con il testo non vuoto, fermarsi: significa che qualcosa legge `unsupportedDevice()` dove non deve.

      ## File Coinvolti
      - test/test_web_api/test_main.cpp — casi `_unsupported` e `upsStatusJson()`
      - test/test_nut_server/test_main.cpp — caso UPS non supportato = nessun UPS

      ## Criteri di Completamento
      - [ ] Tre casi `generateUpsVars` e sei casi `upsStatusJson` aggiunti
      - [ ] Un caso NUT server con UPS non supportato con le stesse risposte di "nessun UPS"
      - [ ] Suite verdi con il comando di Verifica
    ref: TASK-04
  - id: TASK-05
    title: 'claimInterface(): famiglia prima del descrittore e percorso Q* senza supervisione HID'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** l'aggancio sceglie la famiglia con `DriverRegistry::match()` prima del report descriptor; il percorso HID resta identico, quello Q* tiene l'interfaccia, scrive una riga INFO ed espone `unsupportedDevice()`.

      **Leggere:** `lib/USBHostUPS/src/USBHostUPS.cpp:300-420` (`service()`), `:430-475` (`processEvents`), `:473-610` (`claimInterface`), `:640-680` (`handleDisconnected`), `:711-719` (`closeInterface`), `lib/USBHostUPS/src/USBHostUPS.h`, `lib/usb_host_hid/include/usb/hid_host.h:80-90,221` (`iface_num`, `hid_host_device_get_params`), `nut_repo/drivers/libusb1.c:630-645`, sezione "Aggancio" del piano.

      **Modificare:**
      1. `USBHostUPS.h`: membri `const char* _qx_transport = nullptr;`, `String _unsupported_device;`, dichiarazioni di `claimQxInterface(hid_host_device_handle_t, const DriverRegistry::Match&)`, `releaseBoundState()`, override di `unsupportedDevice()` (sotto `_mutex`).
      2. `claimInterface()`: in testa `hid_host_get_device_info()`, quirk e stringhe come oggi; se ok, `match()`; `QX` → `claimQxInterface()` e `return`. Il resto è il percorso HID di oggi nello stesso ordine di chiamate a `hid_host`, con il controllo pagine via `DriverRegistry::hasUpsPages()` e riusando VID/PID/quirk/stringhe già letti (stesso risultato: stessi valori). Nel percorso HID azzerare `_qx_transport` e `_unsupported_device` dove oggi si azzera lo stato del dispositivo.
      3. `releaseBoundState()`: il corpo di reset di `handleDisconnected()` (righe dopo il `log("INFO", "HID Device Disconnected")`) più l'azzeramento dello stato Q*; `handleDisconnected()` lo chiama, senza altre differenze.
      4. `claimQxInterface()`: come nel piano: solo `iface_num == 0` (altrimenti `closeInterface()` + `logDebug`); se `_hid_dev_handle` è un'altra interfaccia, `closeInterface()` e `releaseBoundState()`; `clearDeferredClaim(handle)`; `_hid_dev_handle = handle`, `_qx_transport`, `_unsupported_device` sotto `_mutex`; annullamento di `_restart_requested` con la riga di oggi; **niente** `hid_host_device_start()`, `_link`, `_in_wd`, cache, `_diag`. Infine `log("INFO", "Q* UPS recognized (USB transport: %s), not supported yet", _qx_transport)`.
      5. `docs/concepts/architecture.md`: una o due righe sull'ordine di scelta della famiglia (ADR 0013, sezione 2).

      Non aggiungere rami `if (qx)` dentro il percorso HID o in `service()`: la protezione viene da `_is_ready_to_poll=false` e `_driver=nullptr`.

      **Verifica:** build `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` da PowerShell; rileggere a mano che con un UPS Q* legato `service()` esca a `:320`, `processInputReport()` su `!_driver`, `TRANSFER_ERROR` su `_is_ready_to_poll`, e che la richiesta dell'export USB dia l'export di "nessun UPS" (seguire il codice di `requestDiag`/`snapshot`).

      **Fatto quando:** la build compila; `git diff` del percorso HID mostra solo lo spostamento della lettura di device info e `hasUpsPages()`.

      **Blocchi:** se `hid_host_get_device_info()` dipende dal report descriptor o non è disponibile prima di esso, fermarsi e segnalarlo: cambia l'architettura del piano.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — stato Q*, `claimQxInterface`, `releaseBoundState`, `unsupportedDevice()`
      - lib/USBHostUPS/src/USBHostUPS.cpp — `claimInterface`, `claimQxInterface`, `handleDisconnected`
      - docs/concepts/architecture.md — ordine di scelta della famiglia

      ## Criteri di Completamento
      - [ ] La famiglia si decide prima di `hid_host_get_report_descriptor()`
      - [ ] Il percorso HID ha le stesse chiamate a `hid_host` nello stesso ordine di prima
      - [ ] Un UPS Q* produce una sola riga INFO "Q* UPS recognized (USB transport: <nome>), not supported yet" per aggancio e nessun avvio della pipe IN
      - [ ] Al distacco lo stato Q* torna vuoto
      - [ ] La build `esp32-s3-standard` compila
    ref: TASK-05
  - id: TASK-06
    title: 'Web UI: indicatore "Not supported yet" e banner Q* nella pagina UPS'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** l'utente vede che l'UPS è stato riconosciuto ma non è ancora supportato, invece di "Disconnected".

      **Leggere:** `data/www/bundle.js:1660-1700` (`fetchUpsVars`, banner generico) e `:2437-2480` (`fetchSystemStatus`), `data/www/index.html:865-876` (`#generic-ups-banner`), `scripts/inline_web.py`, `scripts/embed_web.py`, sezione "Consumatori" del piano.

      **Modificare:**
      1. `index.html`: subito dopo `#generic-ups-banner` un `<div id="unsupported-ups-banner">` con lo stesso stile inline ma `background: var(--warning)` (se la variabile non esiste usare quella usata da `.status-indicator.warning`), nascosto di default, con uno `<span id="unsupported-ups-text">`.
      2. `bundle.js` in `fetchUpsVars()`: se `data._unsupported` mostra il banner con testo `data._unsupported + ': not supported yet. Support for Q* UPS units is in progress (GitHub issues #91, #28).'` (testo via `textContent`, mai `innerHTML`), altrimenti lo nasconde.
      3. `bundle.js` in `fetchSystemStatus()`: prima del confronto con `'Disconnected'`, se `data.ups.unsupported` → classe `status-indicator warning`; l'etichetta resta `'UPS: ' + data.ups.status`.
      4. Rigenerare le pagine: `python scripts/inline_web.py` e poi `python scripts/embed_web.py` (il pre-script di PlatformIO non lo fa).

      **Verifica:** `npx playwright test e2e/system-status.spec.js`; build `esp32-s3-standard` da PowerShell.

      **Fatto quando:** i file generati sono aggiornati e i test e2e esistenti passano.

      **Blocchi:** nessuno.

