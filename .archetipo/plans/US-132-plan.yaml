  - id: TASK-03
    title: IUpsSource::unsupportedDevice() e JSON della Web UI per l'UPS non supportato
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** i consumatori possono sapere che c'è un UPS riconosciuto ma non supportato, senza che `isConnected()` cambi significato.

      **Leggere:** `lib/USBHostUPS/src/IUpsSource.h`, `lib/WebApi/src/WebApiJson.h`, `lib/WebApi/src/WebApiJson.cpp:1-60`, `src/network/web_config_server.cpp:640-670`, sezione "Consumatori" del piano.

      **Modificare:**
      1. `IUpsSource`: `virtual String unsupportedDevice() const { return String(); }` con commento (testo come "Q* UPS (USB transport: hunnox)", vuoto quando non c'è; con un testo non vuoto `isConnected()` resta falso).
      2. `WebApiJson::generateUpsVars()`: nel ramo `!isConnected()`, se `unsupportedDevice()` non è vuoto aggiungere `doc["_unsupported"]`; nient'altro cambia.
      3. Nuovo `WebApiJson::upsStatusJson(JsonObject ups, IUpsSource* src)`: sposta qui la logica di `web_config_server.cpp:649-663` con la stessa uscita (modello o "Unknown Model", "Disconnected", `stale` con le stesse condizioni); se non connesso e `unsupportedDevice()` non vuoto: `status = "Not supported yet"`, `unsupported = <testo>`.
      4. `WebConfigServer`: sostituire il blocco con `WebApiJson::upsStatusJson(doc["ups"].to<JsonObject>(), ups_source)`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_web_api -f test_nut_server -f test_ups_source`.

      **Fatto quando:** compila, i test esistenti passano senza modifiche.

      **Blocchi:** se `web_config_server.cpp` non può chiamare il nuovo helper per dipendenze di libreria, segnalarlo invece di duplicare la logica.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUpsSource.h — `unsupportedDevice()`
