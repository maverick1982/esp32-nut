    body: |-
      ## Descrizione
      **Obiettivo:** confermare su hardware che l'aggancio HID, i dati e i comandi sono come prima (ADR 0013 sezione 2, ADR 0010 passo 4).

      **Leggere:** memoria del progetto sulla scheda di test e sulle credenziali OTA (mai stamparle), `docs/test-results/` per il formato dei risultati.

      **Passi:**
      1. **Chiedere all'utente un sì esplicito** prima di toccare la scheda del banco con l'Eaton 3S.
      2. Con il consenso: OTA della build `esp32-s3-standard`, poi verificare nel System Log l'aggancio ("UPS interface claimed and ready", nessuna riga Q*), i dati in `/api/ups-vars`, `upsc` dal server NUT e un comando innocuo (per esempio `beeper.disable`/`beeper.enable` se offerto); scollegare e ricollegare l'USB e ripetere.
      3. Salvare i risultati in `docs/test-results/US-132/`.
      4. Preparare lo zip di prova per i tester HID (procedura della RC) e annotare che la release aspetta i loro riscontri.

      **Verifica:** log e risultati salvati.

      **Fatto quando:** la prova sull'Eaton 3S è passata (o l'utente ha scelto di saltarla) e la build per i tester è pronta.

      **Blocchi:** senza consenso dell'utente non si tocca la scheda; il task resta aperto e lo si dice nel riepilogo. Non rilasciare prima dei riscontri.

