  # US-132: Aggancio guidato dalla famiglia: righe Q* prima del fallback HID generico, UPS Q* segnalato come non ancora supportato — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-07

  ---

  ## Spec

  **Epic:** EP-007 — Supporto UPS Q* (nutdrv_qx)
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come utente con un UPS Q* (per esempio il VIDA Armour 1200VA di #91, 0001:0000 "MEC0003"), voglio che la scheda riconosca il mio UPS come Q* invece di agganciarlo con il driver HID generico che non riceve dati, in modo da sapere subito che l'UPS è stato riconosciuto e che il supporto non c'è ancora, invece di vedere "Not Detected".

  **Criteri di Accettazione**
  - Ordine di scelta: (1) righe HID esplicite di oggi; (2) righe Q*, copia fedele di `qx_usb_id[]` (`nut_repo/drivers/nutdrv_qx.c:2704-2727`) con stringhe e ordine di NUT, senza 1a86:7523; (3) fallback HID generico solo con pagine UPS (0x84) o Battery (0x85).
  - Un'interfaccia che corrisponde a una riga Q* viene tenuta anche senza pagine UPS/Battery; il percorso HID mantiene il controllo delle pagine com'è oggi.
  - Un UPS Q* agganciato produce una sola riga INFO "Q* UPS recognized (USB transport: <nome>), not supported yet" per aggancio; la Web UI mostra "non ancora supportato"; il server NUT risponde come senza UPS.
  - Cache dei report, watchdog degli INPUT, ritentativi del descrittore e lettura diagnostica (US-119) solo sul percorso HID; un UPS Q* agganciato non provoca ripristini della porta né riavvii.
  - Test nativi del registro per #91, #28, APC, Phoenixtec 06da:ffff, VID sconosciuto con e senza pagine.
  - Regressione: test nativi, replay ed e2e verdi senza cambiare le asserzioni.
  - Build di prova su UPS HID reali prima della release.

  ---

  ## Soluzione tecnica

  La famiglia si decide **prima** di leggere il report descriptor, con i soli dati che `hid_host_get_device_info()` dà già oggi (VID, PID, stringhe). `DriverRegistry` riceve una funzione pura `match()` che applica l'ordine dell'ADR 0013, sezione 2; `USBHostUPS::claimInterface()` legge prima le informazioni del dispositivo e poi prende uno di due percorsi: quello HID, identico a oggi, o un nuovo percorso Q* corto che in questa storia si limita a tenere l'interfaccia, scrivere la riga INFO ed esporre lo stato "non ancora supportato". Nessun comando Q* parte verso l'UPS (arriva con US-136).

  ### Registro: `DriverRegistry::match()`

  ```cpp
  namespace DriverRegistry {
      enum class Family : uint8_t { HID, QX };
      struct Match {
          Family family;
          bool explicit_hid;        // riga HID esplicita (false: candidato al fallback generico)
          const char* qx_transport; // nome del sottodriver USB di NUT ("hunnox"), nullptr per HID
      };
      Match match(uint16_t vid, uint16_t pid, const char* mfr = "", const char* product = "");
      bool hasUpsPages(const std::vector<HIDUsageDef>& usages); // pagina 0x84 o 0x85
      IUPSDriver* create(...);  // invariato: solo HID, usato anche dai replay
  }
  ```

  - **Ordine:** (1) righe HID esplicite: la tabella `DRIVERS[]` e il caso Phoenixtec 06da:ffff, con la stessa ricerca di `create()` (estratta in un helper comune, così `create()` non cambia comportamento); (2) tabella `QX_USB_ID[]`; (3) `{HID, false, nullptr}`.
  - **`QX_USB_ID[]`:** copia riga per riga di `qx_usb_id[]` (`nutdrv_qx.c:2704-2727`), stesso ordine e stesse stringhe, ogni riga con il commento di NUT. Il campo trasporto è il nome della tabella `usbsubdriver[]` di NUT (`nutdrv_qx.c:3376-3390`): `cypress_subdriver`→`cypress`, `ablerex_subdriver_fun`→`ablerex`, `krauler_subdriver`→`krauler`, `phoenixtec_subdriver`→`phoenixtec`, `ippon_subdriver`→`ippon`, `phoenix_subdriver`→`phoenix`, `sgs_subdriver`→`sgs`, `omron_usb_subdriver`→`omron`, `fabula_subdriver`→`fabula`, `fabula_hunnox_subdriver`→`hunnox`, `fuji_subdriver`→`fuji`, `snr_subdriver`→`snr`, `armac_subdriver`→`armac`. La riga 1a86:7523 (handler `NULL`) non si copia; un commento lo dice. La riga `snr` resta anche se irraggiungibile (la precede `krauler` con stringhe `NULL`), come in NUT.
  - **Confronto delle stringhe come `qx_is_usb_device_supported()`** (`nutdrv_qx.c:2740-2768`): stringa `nullptr` nella riga = qualsiasi; altrimenti `strcasecmp` con la stringa del dispositivo, che se manca (`nullptr` o `""`) non corrisponde. Quindi "MEC"/"MEC0003" → `fabula` (#28), ""/"MEC0003" → `hunnox` (#91), 0001:0000 qualsiasi altro → `krauler`.
  - **`hasUpsPages()`** è il ciclo di oggi su `getUsages()` (`USBHostUPS.cpp:487-495`) spostato nel registro, così il terzo passo è testabile in nativo.
  - **Sovrapposizioni:** oggi nessuna riga HID esplicita coincide con una riga Q* (06da:ffff contro 06da:0002…0601; 1cb0:0032/0038 contro 1cb0:0035). Un test lo verifica riga per riga, così una nuova riga HID che ne nasconde una Q* rompe la build dei test.
  - **Effetto voluto, da scrivere nel commento:** un dispositivo che oggi finisce su `GenericDriver` perché ha pagine UPS ma VID/PID di una riga Q* (#91) passa al percorso Q*. È la correzione dell'ADR, non una regressione.

  ### Aggancio: `USBHostUPS::claimInterface()`

  Nuovo ordine dentro `claimInterface(handle)`:

  1. `hid_host_get_device_info()`, poi quirk e stringhe ASCII esattamente come oggi (`USBHostUPS.cpp:532-547`), spostati in testa.
  2. Se le informazioni ci sono, `DriverRegistry::match()`. Se `family == QX` → `claimQxInterface(handle, match)` e `return`. Se le informazioni mancano, percorso HID come oggi (oggi l'interfaccia viene comunque presa senza driver: il comportamento resta quello).
  3. Percorso HID: il codice di oggi, nello stesso ordine (descrittore, `deferClaim`, controllo delle pagine con `DriverRegistry::hasUpsPages()`, sostituzione dell'interfaccia, `DriverRegistry::create()`, avvio della pipe IN). Riusa VID/PID/quirk/stringhe del passo 1 invece di rileggerli; deve azzerare lo stato Q* (`_qx_transport`, `_unsupported_device`).

  `claimQxInterface()` (percorso Q*, poll task, nessun lock applicativo durante chiamate a `hid_host`):

  - **Solo l'interfaccia 0:** NUT apre `usb_subdriver.hid_rep_index`, che per `nutdrv_qx` resta 0 (`nut_repo/drivers/libusb1.c:640`; verificare il default e citarlo). Con `hid_host_device_get_params()` si legge `iface_num`; un'interfaccia diversa da 0 si chiude con `closeInterface()` e una riga `logDebug`.
  - **Interfaccia già legata ad altro:** come il percorso HID, `closeInterface()` della precedente; in più si azzera lo stato HID con un helper `releaseBoundState()` estratto da `handleDisconnected()` (stesso corpo di oggi: `_is_ready_to_poll=false`, `_ups_data`, `_device_product`, `delete _driver`, parser, cache, `_diag`, `_ol_dischrg_log`). `handleDisconnected()` lo chiama al posto delle righe di oggi, senza cambiare comportamento.
  - **Stato:** `_hid_dev_handle = handle` (è l'interfaccia legata, per entrambe le famiglie: così `handleDisconnected()` la riconosce e la rilascia come oggi); `_driver = nullptr`; `_is_ready_to_poll = false`; `_qx_transport = match.qx_transport`; `_unsupported_device = "Q* UPS (USB transport: <nome>)"` sotto `_mutex`; `clearDeferredClaim(handle)`; se c'era `_restart_requested`, si annulla con la stessa riga di oggi ("UPS enumerated again"): il dispositivo si è enumerato.
  - **Niente** `hid_host_device_start()`, niente `_link.reset()`/`_in_wd.reset()`, niente cache dei report o lettura diagnostica: con `_is_ready_to_poll=false` e `_driver=nullptr` `service()` esce prima del link monitor e del watchdog degli INPUT (`USBHostUPS.cpp:320`), `processInputReport()` esce su `!_driver` e `TRANSFER_ERROR` è ignorato perché richiede `_is_ready_to_poll`. Il watchdog dell'enumerazione è soddisfatto da `_enum_seen` (evento CONNECTED). Quindi nessun ripristino della porta e nessun riavvio, per costruzione.
  - **Log:** una sola riga `log("INFO", "Q* UPS recognized (USB transport: %s), not supported yet", transport)` per aggancio (solo per l'interfaccia tenuta).
  - **Distacco:** `handleDisconnected()` azzera anche `_qx_transport` e `_unsupported_device` (dentro `releaseBoundState()`).

  ### Consumatori: `IUpsSource` e Web UI

  - `IUpsSource` riceve `virtual String unsupportedDevice() const { return String(); }`: testo del dispositivo riconosciuto ma non supportato, vuoto altrimenti. `USBHostUPS` lo restituisce sotto `_mutex`. `isConnected()` resta `false` per un UPS Q*: server NUT, spegnimento automatico, LED e politica dei riavvii vedono "nessun UPS" senza modifiche.
  - `WebApiJson::generateUpsVars()`: nel ramo `!isConnected()` aggiunge `"_unsupported": "Q* UPS (USB transport: hunnox)"` quando il testo non è vuoto; il resto del JSON identico.
  - `/api/system-status`: la logica UPS di `WebConfigServer` (`src/network/web_config_server.cpp:649-663`) passa in un helper `WebApiJson::upsStatusJson(JsonObject ups, IUpsSource*)` testabile in nativo, con uscita identica per i casi di oggi; con UPS Q* scrive `status: "Not supported yet"` e `unsupported: "Q* UPS (USB transport: hunnox)"`.
  - `data/www/bundle.js`: indicatore "UPS: Not supported yet" in giallo (`warning`) quando `data.ups.unsupported` c'è; nella pagina UPS un banner `#unsupported-ups-banner` con lo stile del `#generic-ups-banner` esistente (`data/www/index.html:869`) ma colore `warning`: "Q* UPS recognized (USB transport: hunnox): not supported yet. Support for Q* UPS units is in progress (GitHub issues #91, #28)." La Web UI è in inglese: "non ancora supportato" della storia diventa "not supported yet". Nessun mockup: è un banner gemello di uno esistente e un'etichetta, non un nuovo layout.

  ### Fuori ambito

  - Comandi Q*, primitive di trasporto, motore e protocolli: US-133…US-136.
  - Sezione Q* dell'export diagnostico: con un UPS Q* agganciato l'export resta quello di "nessun UPS" (da verificare, non da estendere).
  - Dispositivi Q* il cui report descriptor fa fallire `hid_host_device_open()` (OPEN_FAILED): restano invisibili come oggi; li tratterà la storia del primo trasporto.

  ### Rischi

  - `claimInterface()` è il cuore dell'aggancio (ADR 0008): il percorso HID deve restare byte per byte nello stesso ordine di chiamate a `hid_host`. Per questo la build di prova su UPS HID reali (ADR 0010, passo 4) è un passo del piano.
  - Un dispositivo HID vero con VID/PID di una riga Q* passerebbe al percorso Q*: è la scelta dell'ADR (NUT lo assegna a `nutdrv_qx`), ma va scritta nelle note di rilascio.
  - Commit separato e senza funzioni Q* (ADR 0013, "Impact on Agent Implementation").

  ---

  ## Strategia di test

  La logica nuova è pura e si prova in nativo; il codice di `USBHostUPS.cpp` (non compilato in nativo) si prova con regressione completa, build e prova su UPS HID reali.

  - **Nuova suite `test/test_driver_registry`:** i casi della storia (0001:0000 ""/"MEC0003" → QX `hunnox`; "MEC"/"MEC0003" → QX `fabula`; 051d → HID esplicito, `create()` = APC; 06da:ffff → HID esplicito, `create()` = Liebert; VID sconosciuto → HID non esplicito, con pagina UPS `hasUpsPages()` vero e `create()` = `GenericDriver`; senza pagine `hasUpsPages()` falso), più: ogni riga di `QX_USB_ID[]` dà il trasporto atteso; confronto senza maiuscole/minuscole ("mec"/"mec0003" → `fabula`); "ATCL FOR UPS" → `fuji`; 0001:0000 senza stringhe → `krauler`; 1a86:7523 → HID non esplicito; 1cb0:0035 → QX `krauler` mentre 1cb0:0032/0038 restano Legrand; nessuna riga HID esplicita coincide con una riga Q*; pagina Battery da sola basta.
  - **`test_web_api`:** `_unsupported` in `/api/ups-vars` e `upsStatusJson()` per scollegato, Q*, collegato, dati vecchi, attesa del primo dato (uscita identica a oggi nei casi esistenti).
  - **`test_nut_server`:** con una sorgente finta non connessa e `unsupportedDevice()` non vuoto le risposte sono quelle di "nessun UPS".
  - **Regressione:** suite nativa completa (replay inclusi), e2e completa, le tre build di `platformio.ini`; nessuna asserzione esistente cambia. Flash misurata sulla build classica (#93).
  - **Prova su UPS HID reali:** build di prova sull'Eaton 3S del banco solo dopo un sì esplicito dell'utente, e build per i tester; aggancio, dati e comandi come prima.

  ### Test E2E — Simulazione utente

  **Framework:** Playwright (`e2e/`, `npx playwright test`, API simulate con `page.route` e `serveIndex`)
  **Video demo:** previsto (indicatore e banner con API simulate; lo registra `archetipo-review`, non l'implementazione)

  | Scenario | Flusso utente |
  |---|---|
  | UPS Q* collegato | L'utente apre la Web UI con `/api/system-status` che risponde `ups: {status: 'Not supported yet', unsupported: 'Q* UPS (USB transport: hunnox)'}`: l'indicatore dice "UPS: Not supported yet" in giallo |
  | Pagina UPS con UPS Q* | `/api/ups-vars` risponde `{_disconnected: true, 'ups.status': 'Disconnected', _unsupported: 'Q* UPS (USB transport: hunnox)'}`: il banner "Q* UPS recognized (USB transport: hunnox): not supported yet" è visibile e il banner generico no |
  | UPS scollegato (regressione) | Senza `_unsupported` il banner Q* resta nascosto e l'indicatore resta "UPS: Disconnected" in rosso |

  ---

  _Piano generato con ARchetipo Planning — 2026-11-07_
tasks:
  - id: TASK-01
    title: DriverRegistry::match() con le righe Q* di qx_usb_id[] e hasUpsPages()
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** il registro sa dire la famiglia di un dispositivo da VID, PID e stringhe, nell'ordine HID esplicito → Q* → fallback HID, senza cambiare `create()`.

      **Leggere:** `lib/USBHostUPS/src/DriverRegistry.h`, `lib/USBHostUPS/src/DriverRegistry.cpp`, `nut_repo/drivers/nutdrv_qx.c:2655-2768` (tabella e confronto) e `:3370-3393` (nomi dei trasporti), `lib/USBHostUPS/src/USBHostUPS.cpp:484-495` (controllo delle pagine di oggi), sezione "Registro" del piano.

      **Modificare:**
      1. In `DriverRegistry.h`: `enum class Family`, `struct Match`, `match()` e `hasUpsPages(const std::vector<HIDUsageDef>&)` come nel piano, con commento sull'ordine e citazione dell'ADR 0013 sezione 2. Includere `HIDParser.h` (o la dichiarazione di `HIDUsageDef`) solo dove serve.
      2. In `DriverRegistry.cpp`: estrarre la ricerca HID esplicita (Phoenixtec 06da:ffff + `DRIVERS[]`) in un helper usato da `create()` e da `match()`; `create()` deve restituire esattamente gli stessi driver di oggi.
      3. Aggiungere `QX_USB_ID[]` (`static const`): una riga per ogni riga di `qx_usb_id[]` tranne 1a86:7523, stesso ordine, stesse stringhe (`nullptr` dove NUT ha `NULL`), nome del trasporto secondo la mappa del piano, commento di NUT su ogni riga e riferimento a `nutdrv_qx.c:2704-2727`. Un commento spiega perché 1a86:7523 manca e perché `snr` resta.
      4. Confronto stringhe come `qx_is_usb_device_supported()`: riga `nullptr` = qualsiasi; altrimenti dispositivo `nullptr`/`""` → non corrisponde, poi `strcasecmp` (in nativo MinGW c'è; se serve, un piccolo confronto locale senza dipendenze).
      5. `hasUpsPages()`: lo stesso ciclo di `USBHostUPS.cpp:487-495`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_liebert_driver -f test_legrand_driver -f test_record_replay`.

      **Fatto quando:** `match()` e `hasUpsPages()` compilano, i test esistenti del registro passano senza modifiche.

      **Blocchi:** se una riga Q* coincide con una riga HID esplicita, fermarsi e segnalarlo (contraddice l'assunzione della storia).

      ## File Coinvolti
      - lib/USBHostUPS/src/DriverRegistry.h — `Family`, `Match`, `match()`, `hasUpsPages()`
      - lib/USBHostUPS/src/DriverRegistry.cpp — helper HID esplicito, `QX_USB_ID[]`, confronto stringhe

      ## Criteri di Completamento
      - [ ] `QX_USB_ID[]` ha 21 righe nell'ordine di NUT, senza 1a86:7523, con commenti e riferimento alle righe di `nutdrv_qx.c`
      - [ ] `match()` applica HID esplicito → Q* → fallback e restituisce il nome del trasporto di NUT
      - [ ] `create()` restituisce gli stessi driver di prima per ogni VID/PID/stringhe
      - [ ] I test indicati in Verifica passano senza modifiche
    ref: TASK-01
