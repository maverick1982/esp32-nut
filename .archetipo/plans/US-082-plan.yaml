  - id: TASK-06
    title: Regressione completa, build e verifica manuale con Home Assistant
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** confermare che nulla si è rotto e preparare la verifica sull'hardware richiesta dalla spec prima del merge.

      **Da leggere:** il piano (Strategia di Test, Scelte e deviazioni).

      **Modifiche:** nessuna, salvo correzioni di regressioni trovate qui.

      **Passi:**
      1. `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native`: tutte le suite verdi; riportare il numero di test. Un ERRORED transitorio su Windows va rilanciato da solo.
      2. `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`: build ok; riportare RAM e flash.
      3. `npx playwright test`: suite verde.
      4. `python scripts/embed_web.py` non produce differenze.
      5. `grep -n "_config.ups_name;" lib/NUTServer/src/NUTServer.cpp`: nessun fallback rimasto nei rami dei comandi (restano solo i confronti e `LIST UPS`).
      6. Checklist manuale da preparare per la review:
         - scheda azzerata, configurata solo con il Wi-Fi dall'AP: `LIST UPS` con `nc` dà `UPS ups "ESP32-S3 UPS Bridge"`, la Web UI mostra `ups` nel campo UPS Name, Home Assistant aggiunge l'integrazione NUT e legge le variabili;
         - scheda con `ups_name` vuoto già in NVS (firmware precedente, solo Wi-Fi configurato), aggiornata via OTA: al riavvio `LIST UPS` dà `ups` e l'integrazione Home Assistant esistente continua a funzionare;
         - `nc`: `LIST VAR`, `GET VAR battery.charge` e `LIST FOO ups` danno `ERR INVALID-ARGUMENT`; `LIST VAR ups` funziona;
         - `upsc ups@<ip>` funziona;
         - salvare dal form NUT un nome con spazio è bloccato dal browser.

      **Verifica:** output dei comandi riportato nella review.

      **Fatto quando:** suite native ed e2e e build sono verdi e la checklist è pronta.

      **Blocchi:** nessuno.

      ## File Coinvolti
