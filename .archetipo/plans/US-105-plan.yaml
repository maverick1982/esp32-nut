    body: |-
      ## Descrizione
      **Obiettivo:** togliere la logica HID da `IUSBHostUPS.h` lasciando rinvii di una riga a `activeControl()`, così i mock dei test restano invariati.

      **Leggi:** `lib/USBHostUPS/src/IUSBHostUPS.h` (intero), `lib/USBHostUPS/src/IUpsSource.h` (commenti di `setVariable` e `resetVariable`), i mock `MockUSBHost` (`test/test_nut_server/test_main.cpp` righe 34-108), `APIMockUSBHost` (`test/test_web_api/test_main.cpp` righe 11-90), `PlanHost` (`test/test_rw_catalog/test_main.cpp` riga 531) e `test/test_usb_host_interface/test_main.cpp`.

      **Modifica:**
      1. Includi `HidControl.h`; togli gli include che non servono più (`CommandCatalog.h` arriva da `HidControl.h`).
      2. Scrivi `class IUSBHostUPS : public IUpsSource, public IHidControlPort` e togli i membri ora in `IHidControlPort`: `setBeeper`, `supportsBeeperToggle`, `shutdownCommandsSupported`, `beeperMuteSupported`, `commandAllowList`.
      3. Ridichiara puri `lock`, `unlock` e `isConnected` con `override = 0` e il commento: dichiarati da entrambe le basi, un solo override li implementa.
      4. Aggiungi `virtual const IUpsControl& activeControl() const { return HidControl::instance(); }`, con il commento: controllo del driver collegato; l'host USB lo legge dal driver.
      5. Aggiungi `const UPSData& upsData() const override { return getUPSData().get(); }`, con il commento: riferimento ai dati dell'host, valido dopo il rilascio del lock temporaneo; leggerlo con `lock()` tenuto.
      6. Rinvii:
         - `getSupportedCommands() const override` → `activeControl().supportedCommands(*this)`;
         - `executeCommand(const char* name, const char* param = nullptr) override` → `activeControl().executeCommand(*this, name, param)` (sostituisce la versione di entrambe le basi);
         - `setVariable` → `activeControl().setVariable(*this, name, value)`;
         - `resetVariable(name)` → `String value; return activeControl().resetVariable(*this, name, value);`.
      7. `noteDefaultShutdown(const char* via) override { _last_default_shutdown = via ? via : ""; }`. Restano `lastDefaultShutdown()` e `_last_default_shutdown`; `configuredDelay` va tolto (ora è in `HidControl`).
      8. Aggiorna il commento di classe (comandi e variabili passano per il controllo del driver, US-105) e, in `IUpsSource.h`, i commenti di `setVariable` e `resetVariable`, senza cambiare le firme.

      **Verifica:** compilano e passano, senza modifiche, `test_nut_server`, `test_web_api`, `test_rw_catalog`, `test_usb_host_interface`, `test_ups_source` e `test_hid_control`.

      **Fatto:** `IUSBHostUPS.h` senza `resolveShutdownSteps`, `resolveWrite`, `kFallback` e `delay(125)`.

      **Blocchi:** se un mock non compila per un nome ambiguo, risolvi ridichiarando il metodo in `IUSBHostUPS`, non nel mock. Se serve davvero modificare un mock, fermati e segnalalo: il criterio è che i test restino invariati.

      ## File Coinvolti
