    body: |-
      > **Rework (2026-10-26):** la build `ups-control-v1` è stata verificata sull'Eaton 3S (baseline da `v1.10.0`, tutto identico, sia dalla Web UI sia via NUT) ma non è stata distribuita. Dopo TASK-08..10 ripeti questo task con `FIRMWARE_VERSION` = `ups-control-v2` e lo zip `test_ups_control_v2.zip`; la baseline di `v1.10.0` resta valida. Ai tester va solo la v2.

      ## Descrizione
      **Obiettivo:** provare su un UPS reale che comandi e SET VAR si comportano come prima, poi preparare la build per i tester (ADR 0010).

      **Leggi:** il task di validazione hardware del piano US-089 (`.archetipo/plans/US-089-plan.yaml`) per il formato della build di test e del resoconto.

      **Passi:**
      1. Baseline sul firmware ora sulla scheda, prima del flash: salva `upscmd -l <ups>`, `upsrw <ups>`, l'elenco dei comandi della pagina UPS Commands e le variabili di UPS Settings.
      2. Build con `FIRMWARE_VERSION` = `ups-control-v1` passato in `PLATFORMIO_BUILD_FLAGS` (come in US-089, da PowerShell). Crea lo zip `test_ups_control_v1.zip` nella root del repo con firmware, bootloader, partitions, boot_app0 e un README.txt (commit, istruzioni di flash e OTA), come gli zip di test precedenti.
