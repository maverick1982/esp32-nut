  - id: TASK-09
    title: Test della porta neutrale e controlli strutturali
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Descrizione
      **Obiettivo:** dimostrare che un driver di un altro protocollo può fornire il proprio controllo senza vedere nulla di HID, e bloccare il ritorno di dipendenze HID nell'aggancio.

      **Leggi:** `test/test_hid_control/test_main.cpp` (porta finta, `RecordingControl`), `test/test_hid_transport/test_main.cpp` (`readSource`, `projectPath`, controlli sugli include), `platformio.ini` (ambiente `native`).

      **Modifica:**
      1. Nuova suite `test/test_ups_control_port/test_main.cpp`. Include `<unity.h>` e, dagli header del progetto, solo `"IUpsControl.h"`. Subito dopo gli include, un `#error` se è definita una delle guardie `I_HID_TRANSPORT_H`, `I_HID_CONTROL_PORT_H`, `HID_CONTROL_H`, `HID_USAGES_H`, `HID_PARSER_H`, `NUT_TABLE_H`, `COMMAND_CATALOG_H` (stesso schema delle guardie di `test_hid_transport`). Definisci `NeutralPort : public IUpsControlPort`, con stato registrato (connesso, chiamate a `resetDriverSideValue`, comandi ricevuti), e `QxLikeControl : public IUpsControl`, con un proprio elenco di comandi (per esempio `beeper.toggle` e `test.battery.start.quick` presi dal catalogo di `UpsCommands.h`). Casi:
         - `hidPort()` di una porta neutrale è `nullptr` (const e non const);
         - `QxLikeControl` elenca ed esegue i propri comandi attraverso la porta neutrale;
         - il `resetVariable` di default di `IUpsControl` restituisce `NOT_CONNECTED` con la porta scollegata, `UNKNOWN` con nome nullo, e altrimenti delega a `resetDriverSideValue` propagando valore e stato.
      2. `test/test_hid_control/test_main.cpp`: aggiungi una porta solo neutrale (`NeutralOnlyPort : public IUpsControlPort`) e i casi per `HidControl::instance()`:
         - scollegata: elenco vuoto, `NOT_CONNECTED`, `NOT_CONNECTED`;
         - collegata senza parte HID: elenco vuoto, `executeCommand` `NOT_SUPPORTED`, `setVariable` `UNKNOWN`, nessuna chiamata a `setBeeper`;
         - `FakePort.hidPort()` restituisce la porta stessa.
         Non modificare i test esistenti.
      3. `test/test_hid_transport/test_main.cpp`: nuovo test `test_control_hook_is_protocol_neutral`. `IUpsControl.h` e `IUpsControlPort.h` non devono contenere `#include` di `IHidTransport.h`, `IHidControlPort.h`, `HidControl.h`, `HIDUsages.h`, `HIDParser.h`, `NutTable.h`, `CommandCatalog.h`, `IUSBHostUPS.h`, `USBHostUPS.h`, `IUpsSource.h`. Nessun file in `lib/USBHostUPS/src` deve contenere `dynamic_cast`. Registralo in `main` dopo i test esistenti.
      4. **Prova delle mutazioni** (da annullare dopo): (a) aggiungere `#include "IHidTransport.h"` a `IUpsControlPort.h`; (b) togliere il controllo su `hidPort()` nullo in `HidControl::executeCommand` (crash o test rosso); (c) far restituire `this` al `hidPort()` di `IUpsControlPort`. Ognuna deve far fallire almeno un test o la compilazione della nuova suite.
         **Nota (implementazione):** la mutazione (b) così com'è non è osservabile, perché senza parte HID `supportedCommands()` restituisce già un elenco vuoto ed `executeCommand` risponde `NOT_SUPPORTED` prima di usare `hid`; il controllo in `executeCommand` resta come difesa. È stata eseguita invece sul controllo in `supportedCommands` (dereferenziazione di null, `test_hid_control` va in crash). Per (c) `this` non compila senza cast: è stato usato `reinterpret_cast`, intercettato da `test_neutral_port_has_no_hid_part`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_ups_control_port -f test_hid_control -f test_hid_transport`.

      **Fatto:** le tre suite sono verdi e ogni mutazione è stata intercettata e poi annullata.

      **Blocchi:** se `UpsCommands.h` non espone un elenco di comandi da cui `QxLikeControl` possa prendere dei `UPSCommandInfo` senza `CommandCatalog.h`, definisci nel test due `UPSCommandInfo` statici invece di includere il catalogo HID.

      ## File Coinvolti
      - test/test_ups_control_port/test_main.cpp — nuova suite: controllo e porta senza HID
      - test/test_hid_control/test_main.cpp — casi con porta solo neutrale (aggiunti, nessun test esistente modificato)
      - test/test_hid_transport/test_main.cpp — nuovo controllo strutturale sugli include e su dynamic_cast

      ## Criteri di Completamento
      - [ ] `pio test -e native -f test_ups_control_port -f test_hid_control -f test_hid_transport` verde
      - [ ] La nuova suite non compila se un header HID entra in `IUpsControl.h` o `IUpsControlPort.h`
      - [ ] Ognuna delle tre mutazioni fa fallire almeno un test o la compilazione
      - [ ] Nessuna asserzione dei test esistenti modificata
