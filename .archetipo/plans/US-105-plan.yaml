schema: archetipo/plan/v2
spec_code: US-105
body: |-
  # US-105: Comandi e variabili scrivibili dietro il modello UPS — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-10-26

  ---

  ## Spec

  **Epic:** EP-006 — Architettura modulare: sorgente UPS e trasporto
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come sviluppatore che aggiunge un protocollo UPS non HID, voglio che comandi e variabili scrivibili passino per il driver invece di essere costruiti sugli usage HID dentro l'interfaccia, in modo che un driver Q* possa offrire i suoi comandi (beeper, test, spegnimento) senza riscrivere la logica HID.

  **Criteri di Accettazione**
  - [ ] La logica HID dei comandi esce da `IUSBHostUPS.h` e diventa una parte del lato HID usata dai driver HID: catalogo, passi di spegnimento con la pausa di 125 ms, sequenza di `shutdown.default`, beeper e scritture.
  - [ ] `IUpsSource` esegue comandi, `SET VAR` e reset tramite il driver: un driver non HID può fornire i propri con lo stesso aggancio.
  - [ ] Nessun cambio di comportamento: stessi elenchi di comandi e variabili, stessi valori scritti nello stesso ordine, stesso ordine dei lock (`_op_mutex` poi `_mutex`, ADR 0008), stessi messaggi nel System Log.
  - [ ] Una build di test viene distribuita ai tester prima della release (ADR 0010).
  - [ ] Regressione: test nativi, replay ed e2e verdi; build `esp32-s3-standard` OK.

  ---

  ## Soluzione Tecnica

  Oggi `IUSBHostUPS.h` contiene l'implementazione HID di `getSupportedCommands()` e `executeCommand()` (catalogo, comandi beeper, `shutdown.default`, passi load/shutdown con la pausa di 125 ms, scritture dei test e di `beeper.mute`, `configuredDelay`), mentre `USBHostUPS::runSetVariable()` e `runResetVariable()` eseguono SET VAR e reset. Il piano sposta questa logica in un controllo HID senza stato che il driver espone, e lascia all'host solo le primitive (trasferimenti USB, archivio delle variabili lato driver, righe di log). Nessun cambio di comportamento: è il terzo pezzo del passo 4 dell'ADR 0010.

  - **`IUpsControl` (nuovo, `lib/USBHostUPS/src/IUpsControl.h`): l'aggancio.** Metodi const: `supportedCommands(port)`, `executeCommand(port, name, param)`, `setVariable(port, name, value)` puri; `resetVariable(port, name, value)` con un default neutro (stessi controlli di `runResetVariable`, poi `port.resetDriverSideValue`). Le implementazioni sono **senza stato e a vita statica**: l'host chiama il controllo senza tenere `_mutex`, mentre il poll task può cancellare `_driver` (`handleDisconnected()`). Il driver quindi restituisce un riferimento a un'istanza statica, mai a sé stesso.
  - **`IUPSDriver::control()`** (puro; in `IUPSDriver.h` solo la forward declaration di `IUpsControl`). `GenericDriver`, e con lui tutti i driver HID, restituisce `HidControl::instance()` nel `.cpp`. Un driver Q* che implementa `IUPSDriver` direttamente (ADR 0004, emendato dall'ADR 0010) fornisce il proprio controllo con lo stesso aggancio.
  - **`IHidControlPort` (nuovo, `IHidControlPort.h`, estende `IHidTransport`): l'host come lo vede il controllo.** Spostati da `IUSBHostUPS` con gli stessi default: `setBeeper`, `supportsBeeperToggle`, `shutdownCommandsSupported`, `beeperMuteSupported`, `commandAllowList`. Nuovi: `isConnected()`; `upsData()`, da leggere con `lock()` tenuto; `executeCommand(name, param)`, cioè il comando con la sua riga di System Log, usato per i tentativi di `shutdown.default`; `noteDefaultShutdown(via)`. Poi le primitive di SET VAR, estratte tali e quali da `USBHostUPS`: `planSet` (`_driver->planSet` sotto `_mutex`), `saveDriverSideValue` (ramo DRIVER_SIDE), `writePlannedValue` (`_op_mutex`, `writeUsageLocked`, rilettura, `invalidateReport`, WARN) e `resetDriverSideValue` (corpo di `runResetVariable` dopo i controlli). Non include `IUpsSource.h`, `IUSBHostUPS.h` né `USBHostUPS.h`.
  - **`HidControl` (nuovo, `HidControl.h`, header-only come `CommandCatalog.h` e con la stessa intestazione GPL).** Contiene il corpo attuale di `IUSBHostUPS::getSupportedCommands/executeCommand/configuredDelay`, spostato senza cambiare l'ordine delle operazioni, più `setVariable` (controlli di `runSetVariable`, `planSet`, poi `saveDriverSideValue` oppure `writePlannedValue`). Dove oggi si chiama `getUPSData()` si usa un guard su `port.lock()`/`unlock()` con `port.upsData()`: è lo stesso `_mutex` ricorsivo, rilasciato prima di `setBeeper()` e `writeUsage()`. `shutdown.default` richiama `port.executeCommand(sub)`, quindi ogni tentativo resta loggato come un INSTCMD diretto.
  - **`IUSBHostUPS : public IUpsSource, public IHidControlPort`.** Ridichiara puri `lock`, `unlock` e `isConnected`, presenti in entrambe le basi. Aggiunge `activeControl()` virtuale, con default `HidControl::instance()`. `getSupportedCommands`, `executeCommand`, `setVariable` e `resetVariable` diventano rinvii di una riga a `activeControl()`. `upsData()` ha come default `getUPSData().get()`, il riferimento al dato dell'host. `noteDefaultShutdown` scrive `_last_default_shutdown` e `lastDefaultShutdown()` resta. Così i mock di `test_nut_server`, `test_web_api`, `test_rw_catalog` e `test_usb_host_interface` compilano e passano senza modifiche.
  - **`USBHostUPS`.** `activeControl()` legge `_driver->control()` sotto `_mutex` e usa `HidControl` quando non c'è un driver. `upsData()` restituisce `_ups_data`. Le quattro primitive di SET VAR sono i blocchi di `runSetVariable`/`runResetVariable` spostati senza modifiche. `setVariable`, `resetVariable` ed `executeCommand` restano i wrapper che scrivono le stesse righe di System Log. Scompaiono `runSetVariable`, `runResetVariable` e l'override di `getSupportedCommands` (ora il lock lo prende `HidControl`). `setBeeperLocked` e `writeUsageLocked` restano primitive del trasporto: task, timeout e ordine dei lock (`_op_mutex` poi `_mutex`, ADR 0008) non cambiano.
  - **Fuori ambito:** `nutdrv_qx`, MQTT, le primitive Q* (SET_REPORT grezzo) e lo spostamento di `applyDefaultDelays` e `writableVariables` (già sul driver).

  ---

  ## Strategia di Test

  È un refactoring senza comportamento nuovo. Le suite che oggi provano comandi e SET VAR attraverso i default di `IUSBHostUPS` restano identiche e da ora passano per `HidControl`. Una suite nuova prova il controllo su una porta finta, compreso il fatto che nessun lock sia tenuto durante le scritture. Non c'è superficie UI: niente mockup né demo video, e Playwright gira solo come regressione.

  - **Suite invariate:** `test_nut_server` (LIST CMD, INSTCMD, `shutdown.default`, beeper, SET VAR), `test_web_api` (comandi e variabili), `test_rw_catalog` e `test_usb_host_interface`, senza modifiche a mock o asserzioni.
  - **Nuova `test/test_hid_control`.** Usa una porta finta `IHidControlPort` che registra la profondità del lock e, per ogni scrittura e chiamata al beeper, la profondità al momento della chiamata. Casi: elenco uguale a `CommandCatalog::build`; elenco vuoto da scollegato; `beeper.toggle` da `disabled`, `muted` ed `enabled`; beeper che fallisce → FAILED; passi di `shutdown.return` nell'ordine giusto, con 125 ms tra un passo e l'altro (contatore di `delay()` nel mock Arduino); `shutdown.default` che passa per `port.executeCommand` e annota il comando riuscito; `INVALID_ARGUMENT` e `NOT_SUPPORTED`; `setVariable` che smista tra DRIVER_SIDE e HID e propaga gli stati di `planSet`; `resetVariable` di default; `GenericDriver` e gli 8 driver derivati che restituiscono `HidControl::instance()`; lock a profondità 0 durante `setBeeper` e `writeUsage`.
  - **`test_hid_transport` e `test_ups_source` estesi.** Gli header dei driver insieme a `HidControl.h`, `IUpsControl.h` e `IHidControlPort.h` non devono definire le guardie di `IUSBHostUPS.h`, `USBHostUPS.h` e `IUpsSource.h`. `IUSBHostUPS.h` non deve più contenere `resolveShutdownSteps`, `resolveWrite`, `kFallback` e `delay(125)`. I consumatori (NUT server e Web API) non devono includere `HidControl.h` né `IHidControlPort.h`.
  - **Prova delle mutazioni:** se si toglie la pausa, si inverte l'ordine dei tentativi di `shutdown.default` o si tiene il lock attorno a `writeUsage`, deve fallire almeno un test per ciascuna modifica.
  - **Regressione:** suite nativa completa (replay compreso), `npm run e2e` completo e build `esp32-s3-standard`, con RAM e flash annotate.
  - **Hardware (ADR 0010):** build di test sull'Eaton 3S. `upscmd -l` e `upsrw` devono risultare uguali alla baseline; vanno provati `beeper.toggle`, `shutdown.stop`, un SET VAR e il reset dalla Web UI, con le stesse righe di System Log. Poi la build va ai tester, dopo la conferma dell'utente.

  ---

  _Piano generato con ARchetipo Planning — 2026-10-26_

  ---

  ## Rework (review del 2026-10-26)

  La review ha accettato il comportamento (verificato sull'Eaton 3S con la build `ups-control-v1`, identico a `v1.10.0`) ma non la forma dell'aggancio del criterio 2: `IUpsControl` riceve `IHidControlPort`, che eredita `IHidTransport`, quindi un driver Q* che fornisce il proprio controllo riceverebbe comunque il trasporto HID e un tipo con un nome HID.

  **Correzione.**
  - **`IUpsControlPort` (nuovo, `lib/USBHostUPS/src/IUpsControlPort.h`): la porta neutrale.** Contiene la parte della porta che non dipende dal protocollo, spostata da `IHidControlPort` con gli stessi default: `lock`/`unlock`, `isConnected`, `upsData`, `setBeeper`, i flag del driver (`supportsBeeperToggle`, `shutdownCommandsSupported`, `beeperMuteSupported`, `commandAllowList`), `executeCommand(name, param)`, `noteDefaultShutdown` e `resetDriverSideValue`. In più `hidPort()` (const e non const), che restituisce `nullptr`. Include solo `Arduino.h`, `UPSData.h`, `UpsCommands.h` e `UpsVariables.h`, cioè gli stessi header di `IUpsSource.h`; `IHidControlPort` è solo una forward declaration.
  - **`IHidControlPort : public IUpsControlPort, public IHidTransport`.** Restano qui soltanto le primitive di SET VAR legate al piano HID (`planSet`, `saveDriverSideValue`, `writePlannedValue`, che usano `NutTable::SetPlan` con il suo `HIDUsageDef`). Ridichiara puri `lock` e `unlock`, presenti in entrambe le basi, e sovrascrive `hidPort()` restituendo `this`. Niente `dynamic_cast`: il trasporto HID si raggiunge solo da `hidPort()`.
  - **`IUpsControl`** include solo `IUpsControlPort.h` e usa `IUpsControlPort&` nelle quattro firme. Il default di `resetVariable` resta identico, perché `resetDriverSideValue` è sulla porta neutrale.
  - **`HidControl`** include `IHidControlPort.h` e riceve `IUpsControlPort&`. Dopo i controlli che esistono già (nome, `isConnected`), prende `port.hidPort()`. Se è `nullptr` (una porta non HID abbinata per errore al controllo HID) restituisce: elenco vuoto, `NOT_SUPPORTED` per i comandi, `UNKNOWN` per SET VAR. Con `USBHostUPS` la porta è sempre HID, quindi il percorso reale non cambia: stesso ordine delle operazioni, pausa di 125 ms, nessun lock tenuto durante `setBeeper` e `writeUsage`, `_op_mutex` poi `_mutex` (ADR 0008), stesse righe di System Log.
  - **`IUSBHostUPS`/`USBHostUPS`** non cambiano struttura: derivano già da `IHidControlPort`, quindi `hidPort()` restituisce l'host stesso. Si aggiornano solo i commenti che nominano la porta.

  **Test del rework.** Una suite nuova, `test_ups_control_port`, compila un controllo e una porta "alla Q*" includendo solo `IUpsControl.h`, con `#error` se entra un header HID. Si aggiunge un controllo strutturale sugli include di `IUpsControl.h` e `IUpsControlPort.h`, e in `test_hid_control` vanno i casi con `hidPort()` nullo. I test esistenti cambiano solo nei nomi dei tipi (`IHidControlPort&` diventa `IUpsControlPort&` nelle firme di `IUpsControl`). Poi la regressione completa e una nuova build di test, `ups-control-v2`, sull'Eaton 3S prima della distribuzione ai tester.
tasks:
  - id: TASK-01
    title: Interfacce IHidControlPort e IUpsControl
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** creare l'aggancio di comandi e variabili e la porta che il controllo usa verso l'host, senza ancora cambiare comportamento.

      **Leggi:** `lib/USBHostUPS/src/IUSBHostUPS.h` (membri beeper e flag, righe 22-29), `lib/USBHostUPS/src/IHidTransport.h` (stile dei commenti), `lib/USBHostUPS/src/NutTable.h` (`SetPlan`, `SetStatus`), `lib/USBHostUPS/src/USBHostUPS.cpp` righe 1036-1153 (`runSetVariable`, `runResetVariable`).

      **Modifica:**
      1. Crea `lib/USBHostUPS/src/IHidControlPort.h` (guardia `I_HID_CONTROL_PORT_H`) con gli include `IHidTransport.h`, `UPSData.h`, `UpsCommands.h`, `NutTable.h`. Dichiara `class IHidControlPort : public IHidTransport`, con il commento: l'host USB come lo vede il controllo dei comandi dei driver HID (US-105).
      2. Membri di `IHidControlPort`:
         - `bool isConnected() const`, puro.
         - `const UPSData& upsData() const`, puro. Commento: dati dell'host, da leggere solo con `lock()` tenuto.
         - Spostati da `IUSBHostUPS`, copiati con commenti e default: `setBeeper` (puro), `supportsBeeperToggle`, `shutdownCommandsSupported`, `beeperMuteSupported`, `commandAllowList`. In questo task restano anche in `IUSBHostUPS`: li toglie TASK-04.
         - `CommandResult executeCommand(const char* name, const char* param = nullptr)`, puro. Commento: esegue il comando come un INSTCMD, con la sua riga di System Log.
         - `void noteDefaultShutdown(const char* via)`, vuoto.
         - Primitive di SET VAR con i loro default: `planSet(const char* name, const char* value, NutTable::SetPlan& plan) const` → `NOT_CONNECTED`; `saveDriverSideValue(const NutTable::SetPlan&)` → `FAILED`; `writePlannedValue(const NutTable::SetPlan&)` → `FAILED`; `resetDriverSideValue(const char* name, String& value)` → `NOT_CONNECTED`. Ognuna con un commento che rimanda al blocco di `USBHostUPS` da cui viene.
      3. Crea `lib/USBHostUPS/src/IUpsControl.h` (guardia `I_UPS_CONTROL_H`) con gli include `IHidControlPort.h` e `<vector>`. `class IUpsControl` ha un distruttore virtuale e questi metodi const:
         - Puri: `supportedCommands(const IHidControlPort&)`, `executeCommand(IHidControlPort&, const char* name, const char* param)`, `setVariable(IHidControlPort&, const char* name, const char* value)`.
         - Virtuale con default inline: `resetVariable(IHidControlPort& port, const char* name, String& value)`. Ordine dei passi: `value = String()`; da scollegato `NOT_CONNECTED`; con `name` nullo `UNKNOWN`; altrimenti `port.resetDriverSideValue(name, value)`. Sono gli stessi passi, nello stesso ordine, dell'inizio di `runResetVariable`.
         - Commento di classe: aggancio di comandi e variabili scrivibili del driver (ADR 0010 passo 4, US-105). Le implementazioni sono senza stato e a vita statica, perché l'host le chiama senza `_mutex` mentre il poll task può cancellare il driver.
      4. Nessuno dei due header include `IUpsSource.h`, `IUSBHostUPS.h` o `USBHostUPS.h`.

      **Verifica:** i due header compilano quando vengono inclusi da `test_hid_transport` (aggiungili in testa al file di test e lancia la suite).

      **Fatto:** header creati e compilati, nessun file esistente modificato oltre all'include di prova.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/IHidControlPort.h — nuovo
      - lib/USBHostUPS/src/IUpsControl.h — nuovo
      - test/test_hid_transport/test_main.cpp — include dei nuovi header prima dei controlli `#error`

      ## Criteri di Completamento
      - [ ] `IHidControlPort.h` e `IUpsControl.h` non includono `IUpsSource.h`, `IUSBHostUPS.h`, `USBHostUPS.h`
      - [ ] `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_hid_transport` verde (nessuna guardia `#error` scatta)
    ref: TASK-01
  - id: TASK-02
    title: HidControl con la logica HID e IUPSDriver::control()
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** il lato HID dei comandi e di SET VAR diventa `HidControl`, che i driver HID espongono con `control()`.

      **Leggi:** `lib/USBHostUPS/src/IUSBHostUPS.h` righe 31-128 (`getSupportedCommands`, `executeCommand`, `configuredDelay`); `lib/USBHostUPS/src/CommandCatalog.h` (intestazione SPDX e copyright in testa, `build`, `resolveWrite`, `resolveShutdownSteps`, `parseDelayParam`, `kNoDelay`); `lib/USBHostUPS/src/USBHostUPS.cpp` righe 1036-1064 (controlli e commenti di `runSetVariable`); `lib/USBHostUPS/src/IUPSDriver.h` (forward declaration in testa); `lib/USBHostUPS/src/GenericDriver.h/.cpp`.

      **Modifica:**
      1. Crea `lib/USBHostUPS/src/HidControl.h` (guardia `HID_CONTROL_H`) con l'intestazione SPDX e copyright copiata da `CommandCatalog.h` e gli include `<Arduino.h>`, `IUpsControl.h`, `CommandCatalog.h`. Dichiara `class HidControl : public IUpsControl` con `static const HidControl& instance()`, che usa uno statico locale.
      2. Aggiungi un guard RAII privato (per esempio `struct PortLock`) che chiama `port.lock()` nel costruttore e `port.unlock()` nel distruttore.
      3. `supportedCommands(port)`: da scollegato restituisce un elenco vuoto. Altrimenti, sotto il guard: `beeper = port.supportsBeeperToggle() && port.upsData().hasKey(...)` con la chiave `ups.beeper.status`, poi `CommandCatalog::build(port.getUsages(), beeper, port.shutdownCommandsSupported(), port.beeperMuteSupported(), port.commandAllowList())`.
      4. `executeCommand(port, name, param)`: sposta il corpo di `IUSBHostUPS::executeCommand` nello stesso ordine, con i commenti, applicando queste sostituzioni:
         - `isConnected()` → `port.isConnected()`; `getSupportedCommands()` → `supportedCommands(port)`.
         - `setBeeper` → `port.setBeeper`. La lettura di `ups.beeper.status` per `beeper.toggle` va in un blocco con il guard e `port.upsData()`, chiuso prima di `port.setBeeper`.
         - `_last_default_shutdown = ...` → `port.noteDefaultShutdown(...)`: stringa vuota all'inizio, il comando riuscito alla fine. I tentativi diventano `port.executeCommand(sub)`.
         - I blocchi con `UPSDataLock lk = getUPSData()` diventano guard + `port.upsData()` + `port.getUsages()`; `writeUsage` → `port.writeUsage`.
         - `delay(125)` e il suo commento restano identici.
      5. `configuredDelay` diventa una funzione `static` privata di `HidControl`, identica all'originale.
      6. `setVariable(port, name, value)`, nell'ordine:
         - da scollegato `NOT_CONNECTED`; con `name` nullo `UNKNOWN`; con `value` nullo `CONVERSION_FAILED`;
         - `NutTable::SetPlan plan; st = port.planSet(name, value, plan)`; se `st` non è OK lo restituisce;
         - con `plan.kind == NutTable::SetPlan::Kind::DRIVER_SIDE` → `port.saveDriverSideValue(plan)`, altrimenti `port.writePlannedValue(plan)`.
         Porta qui i commenti di `runSetVariable` che descrivono la decisione.
      7. In `IUPSDriver.h` aggiungi `class IUpsControl;` accanto a `class IHidTransport;` e `virtual const IUpsControl& control() const = 0;`. Commento: controllo statico del protocollo; i driver HID restituiscono `HidControl`, un driver Q* il proprio (US-105).
      8. In `GenericDriver.h` dichiara `const IUpsControl& control() const override;`. In `GenericDriver.cpp` includi `HidControl.h` e scrivi `return HidControl::instance();`. Nessun header dei driver deve includere `HidControl.h`.
      9. Non toccare ancora `IUSBHostUPS.h`: fino a TASK-04 la logica resta duplicata.

      **Verifica:** con `git diff`, confronta riga per riga il corpo di `HidControl::executeCommand` con l'originale: devono cambiare solo le sostituzioni elencate.

      **Fatto:** `HidControl` compila ed è restituito da tutti i driver.

      **Blocchi:** se un test definisce una classe che implementa `IUPSDriver` direttamente e smette di compilare, segnalalo prima di modificarlo (oggi `grep` non ne trova).

      ## File Coinvolti
      - lib/USBHostUPS/src/HidControl.h — nuovo
      - lib/USBHostUPS/src/IUPSDriver.h — forward declaration e `control()`
      - lib/USBHostUPS/src/GenericDriver.h — dichiarazione di `control()`
      - lib/USBHostUPS/src/GenericDriver.cpp — `control()` restituisce `HidControl::instance()`

      ## Criteri di Completamento
      - [ ] `HidControl.h` non include `IUpsSource.h`, `IUSBHostUPS.h`, `USBHostUPS.h`
      - [ ] Ordine delle operazioni di `executeCommand` identico all'originale, a parte le sostituzioni previste
      - [ ] `pio test -e native -f test_hid_transport -f test_generic_driver -f test_nut_server` verde
    ref: TASK-02
  - id: TASK-03
    title: Suite test_hid_control su una porta finta
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** verificare `HidControl` in isolamento, compreso il fatto che nessun lock sia tenuto durante le scritture (ADR 0008).

      **Leggi:** `test/test_nut_server/test_main.cpp` (usages finti dei comandi, casi di `shutdown.default` intorno alle righe 760-810, beeper intorno alla riga 840), `test/test_hid_transport/test_main.cpp` (`MinimalTransport`), `test/mocks/Arduino.h` (`delay`, riga 187).

      **Modifica:**
      1. In `test/mocks/Arduino.h`, `delay()` somma i ms in `inline uint32_t mock_delay_total_ms = 0;` (gnu++17). Le altre suite non cambiano comportamento.
      2. Crea `test/test_hid_control/test_main.cpp` con `FakePort : public IHidControlPort`, che offre:
         - profondità e conteggio del lock;
         - `data`, `usages` e flag configurabili;
         - `setBeeper` e `writeUsage` che registrano {enable oppure path, valore, profondità del lock}, con esito configurabile;
         - `executeCommand` che registra il nome e chiama `HidControl::instance().executeCommand(*this, name, param)`;
         - `noteDefaultShutdown` che memorizza `via`;
         - primitive di SET VAR che registrano la chiamata e restituiscono un esito configurabile.
      3. Costruisci gli usages come in `test_nut_server`: Feature `UPS.PowerSummary.DelayBeforeShutdown`, `DelayBeforeStartup`, `Test` e il beeper.
      4. Casi:
         - elenco uguale a `CommandCatalog::build` con gli stessi flag; elenco vuoto da scollegato;
         - `beeper.toggle` con stato `disabled` → `setBeeper(true)`, con `muted` o `enabled` → `setBeeper(false)`; `setBeeper` che fallisce → FAILED;
         - `shutdown.return`: scritture nell'ordine di `resolveShutdownSteps` e `mock_delay_total_ms` = 125 × (passi − 1);
         - `shutdown.default`: passa per `port.executeCommand` nell'ordine dei tentativi, si ferma al primo OK, annota il comando con `noteDefaultShutdown` e restituisce FAILED se tutti falliscono;
         - `load.off.delay` con un parametro non valido → `INVALID_ARGUMENT`; comando non offerto → `NOT_SUPPORTED`; `name` nullo → `NOT_SUPPORTED`;
         - `setVariable`: piano DRIVER_SIDE → `saveDriverSideValue`, piano HID → `writePlannedValue`; uno stato di `planSet` diverso da OK viene restituito senza scritture; `value` nullo → `CONVERSION_FAILED`;
         - `resetVariable` di default: scollegato, `name` nullo, rinvio a `resetDriverSideValue`;
         - `GenericDriver` e gli 8 derivati (APC, CyberPower, Eaton, EcoFlow, Legrand, Liebert, OpenUPS, Powercom) restituiscono `&HidControl::instance()`;
         - in ogni scrittura e chiamata al beeper registrata, la profondità del lock è 0.
      5. Prova delle mutazioni, ognuna ripristinata subito dopo: togliere `delay(125)`; invertire l'ordine dei tentativi; tenere il guard attorno a `port.writeUsage`. Per ciascuna deve fallire almeno un test. Riporta l'esito nel resoconto del task.

      **Verifica:** `pio test -e native -f test_hid_control`.

      **Fatto:** suite verde e le tre mutazioni rilevate.

