  - id: TASK-08
    title: Porta neutrale IUpsControlPort sotto IHidControlPort
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** rendere neutrale rispetto al protocollo l'aggancio di comandi e variabili (feedback di review su `lib/USBHostUPS/src/IHidControlPort.h:19` e `lib/USBHostUPS/src/IUpsControl.h:6`). Oggi `IUpsControl` riceve `IHidControlPort`, che eredita `IHidTransport`: un driver Q* che fornisce il proprio controllo riceverebbe il trasporto HID. Nessun cambio di comportamento.

      **Leggi:** `lib/USBHostUPS/src/IHidControlPort.h`, `IUpsControl.h`, `HidControl.h`, `IUSBHostUPS.h`, `IHidTransport.h`, `IUpsSource.h` (gli include da copiare), `UpsVariables.h` (dove sta `NutTable::SetStatus`), la sezione Rework del piano.

      **Modifica:**
      1. Crea `lib/USBHostUPS/src/IUpsControlPort.h` (guardia `I_UPS_CONTROL_PORT_H`) con `#include <Arduino.h>`, `"UPSData.h"`, `"UpsCommands.h"`, `"UpsVariables.h"` e la forward declaration `class IHidControlPort;`. Sposta qui da `IHidControlPort`, con gli stessi default e commenti: `lock`/`unlock` (puri, const), `isConnected`, `upsData`, `setBeeper`, `supportsBeeperToggle`, `shutdownCommandsSupported`, `beeperMuteSupported`, `commandAllowList`, `executeCommand(name, param)`, `noteDefaultShutdown`, `resetDriverSideValue`. Aggiungi `virtual IHidControlPort* hidPort() { return nullptr; }` e la versione const. Commento di classe: l'host come lo vede il controllo di un driver, qualunque sia il protocollo (US-105); la parte HID si raggiunge solo da `hidPort()`.
      2. `IHidControlPort.h`: `class IHidControlPort : public IUpsControlPort, public IHidTransport`; include `IUpsControlPort.h`, `IHidTransport.h`, `NutTable.h`. Restano `planSet`, `saveDriverSideValue`, `writePlannedValue` con i loro commenti. Ridichiara `void lock() const override = 0;` e `void unlock() const override = 0;` (stesso schema di `IUSBHostUPS.h`) e sovrascrivi `hidPort()` (le due versioni) con `return this;`.
      3. `IUpsControl.h`: includi `"IUpsControlPort.h"` al posto di `"IHidControlPort.h"` e usa `IUpsControlPort&` (`const` per `supportedCommands`) nelle quattro firme. Il corpo del default di `resetVariable` non cambia. Aggiorna il commento: le implementazioni ricevono la porta neutrale; `HidControl` ne prende la parte HID con `hidPort()`.
      4. `HidControl.h`: aggiungi `#include "IHidControlPort.h"` e usa `IUpsControlPort&` nelle firme. `PortLock` resta sulla porta neutrale. Subito dopo i controlli esistenti, nello stesso ordine di oggi, ricava `hid = port.hidPort()`: se è nullo, `supportedCommands` restituisce `{}`, `executeCommand` restituisce `NOT_SUPPORTED` e `setVariable` restituisce `UNKNOWN`. Le chiamate HID (`getUsages`, `writeUsage`, `planSet`, `saveDriverSideValue`, `writePlannedValue`) passano per `hid->`. Tutto il resto (`isConnected`, `upsData`, flag, `setBeeper`, `executeCommand` dei tentativi, `noteDefaultShutdown`, `lock`) resta su `port`. `executeCommand` chiama già `supportedCommands(port)`, quindi il controllo su `hid` del ramo comandi arriva dopo `isConnected` e prima di `supportedCommands`.
      5. `IUSBHostUPS.h` e `USBHostUPS.h`: nessun cambio di struttura, aggiorna solo i commenti che descrivono la porta ("la porta del controllo, `IUpsControlPort`, con la sua parte HID `IHidControlPort`").
      6. `test/test_hid_control/test_main.cpp`: solo i nomi dei tipi. Le firme di `RecordingControl` passano da `IHidControlPort&` a `IUpsControlPort&`. `FakePort` resta `IHidControlPort`.

      **Non fare:** niente `dynamic_cast` o RTTI; non cambiare l'ordine dei controlli, delle scritture, dei lock o i testi di log; non spostare `planSet`/`writePlannedValue`/`saveDriverSideValue` nella porta neutrale (usano `SetPlan`, che contiene `HIDUsageDef`).

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_hid_control -f test_hid_transport -f test_ups_source -f test_nut_server -f test_web_api -f test_rw_catalog -f test_usb_host_interface`, poi `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`.

      **Fatto:** suite indicate verdi, build OK, `git diff` delle asserzioni dei test esistenti vuoto (cambiano solo i tipi nelle firme).

      **Blocchi:** se l'ereditarietà da due basi con `lock`/`unlock` provoca ambiguità che la ridichiarazione non risolve, fermati e riporta l'errore del compilatore invece di introdurre `dynamic_cast` o ereditarietà virtuale.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUpsControlPort.h — nuovo: porta neutrale
      - lib/USBHostUPS/src/IHidControlPort.h — estende la porta neutrale e IHidTransport, solo primitive HID di SET VAR e hidPort()
      - lib/USBHostUPS/src/IUpsControl.h — dipende solo dalla porta neutrale
      - lib/USBHostUPS/src/HidControl.h — firme neutrali, parte HID da hidPort()
      - lib/USBHostUPS/src/IUSBHostUPS.h — solo commenti
      - lib/USBHostUPS/src/USBHostUPS.h — solo commenti
      - test/test_hid_control/test_main.cpp — solo nomi dei tipi nelle firme di RecordingControl

      ## Criteri di Completamento
      - [ ] `IUpsControl.h` e `IUpsControlPort.h` non includono `IHidTransport.h`, `IHidControlPort.h`, `HidControl.h`, `HIDUsages.h`, `HIDParser.h`, `NutTable.h`, `CommandCatalog.h`
      - [ ] Nessun `dynamic_cast` in `lib/USBHostUPS/src`
      - [ ] Suite native indicate in Verifica verdi e build `esp32-s3-standard` OK
      - [ ] Ordine delle operazioni di `HidControl::executeCommand` e `setVariable` identico a prima, salvo il controllo su `hidPort()`
