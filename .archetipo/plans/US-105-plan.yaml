  - id: TASK-05
    title: 'USBHostUPS: controllo del driver e primitive di SET VAR'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** l'host USB prende il controllo dal driver e offre a `HidControl` le primitive di SET VAR, spostando i blocchi di codice esistenti senza modificarli.

      **Leggi:** `lib/USBHostUPS/src/USBHostUPS.h` (dichiarazioni pubbliche e private), `lib/USBHostUPS/src/USBHostUPS.cpp` righe 922-947 (`executeCommand`), 1022-1169 (`setVariable`, `runSetVariable`, `resetVariable`, `runResetVariable`, `getSupportedCommands`, `getWritableVariables`).

      **Modifica:**
      1. In `USBHostUPS.h` dichiara gli override `activeControl() const`, `upsData() const`, `planSet`, `saveDriverSideValue`, `writePlannedValue` e `resetDriverSideValue`. Togli `runSetVariable`, `runResetVariable` e l'override di `getSupportedCommands`.
      2. `activeControl()`: `std::lock_guard` su `_mutex`, poi `return _driver ? _driver->control() : HidControl::instance();`. Commento: istanza statica, valida dopo il rilascio del lock anche se il poll task cancella `_driver`.
      3. `upsData()`: `return _ups_data;`.
      4. `planSet(name, value, plan)`: il blocco delle righe 1043-1048 (lock, `!_driver` → `NOT_CONNECTED`, `_driver->planSet(_ups_data, _hid_parser.getUsages(), name, value, plan)`).
      5. `saveDriverSideValue(plan)`: il corpo del ramo DRIVER_SIDE, righe 1051-1063, identico.
      6. `writePlannedValue(plan)`: le righe 1066-1092, identiche (`_op_mutex` con `OP_WAIT_MS`, `writeUsageLocked`, rilettura con `requestLength`, `invalidateReport`, WARN `Variable %s written, read back failed`).
      7. `resetDriverSideValue(name, value)`: le righe 1117-1152 (da `String canonical` in poi), identiche.
      8. `setVariable`: `NutTable::SetStatus st = IUSBHostUPS::setVariable(name, value);` seguito dallo stesso switch di log. `resetVariable`: `String value; st = activeControl().resetVariable(*this, name, value);` seguito dallo stesso switch.
      9. `executeCommand` (wrapper con log) resta invariato. Togli la definizione di `getSupportedCommands`, ora coperta dal rinvio di `IUSBHostUPS`, dove il lock lo prende `HidControl`.
      10. Non toccare `setBeeper`, `setBeeperLocked`, `writeUsage`, `writeUsageLocked`, i task, i timeout e `getWritableVariables`.

      **Verifica:**
      - `git diff --color-moved=zebra lib/USBHostUPS/src/USBHostUPS.cpp`: i blocchi delle primitive risultano spostati, non modificati.
      - Build da PowerShell: `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`.

      **Fatto:** build OK, RAM e flash annotate e confrontate con il commit di partenza.

      **Blocchi:** un errore di build legato ai nomi ereditati da due basi si risolve in `IUSBHostUPS`, non qui.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — override nuovi, metodi privati tolti
      - lib/USBHostUPS/src/USBHostUPS.cpp — primitive estratte, wrapper di log, `activeControl()`

      ## Criteri di Completamento
      - [ ] Build `esp32-s3-standard` OK
      - [ ] Nessun `_mutex` tenuto quando si prende `_op_mutex` nelle nuove primitive (stessa struttura di prima)
      - [ ] Testi del System Log invariati (`git diff` non mostra cambi nelle stringhe di `log(...)`)
    ref: TASK-05
