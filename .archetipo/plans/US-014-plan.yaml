  - id: TASK-07
    title: Implement fallback variables for HA compatibility
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      Esporre valori testuali di fallback per `ups.mfr` e `ups.model` nel caso in cui i *String Descriptors* dell'UPS non siano stati letti (stringhe vuote). Non verranno introdotte variabili di voltage fittizie.

      ## File Coinvolti
      - `lib/NUTServer/src/NUTServer.cpp`

      ## Criteri di Completamento
      - [ ] `ups.mfr` espone sempre un valore (es. "Eaton") se `data.manufacturer` è vuoto.
      - [ ] `ups.model` espone sempre un valore (es. "3S UPS") se `data.product` è vuoto.
    ref: TASK-07
