schema: archetipo/plan/v2
spec_code: US-014
body: |-
  ### Technical Solution for Rework 4

  **Analisi del Problema con Home Assistant:**
  Home Assistant, tramite la sua integrazione NUT, effettua il discovery del dispositivo. Se i campi identificativi fondamentali come `ups.mfr` e `ups.model` risultano vuoti, l'integrazione fallisce la creazione del dispositivo nel registro (Device Registry) e non mostra le entità.

  Attualmente `ups.mfr` e `ups.model` dipendono dalla lettura asincrona dei *String Descriptors* USB. Se questa lettura fallisce, le stringhe risultano vuote.

  **Soluzione Proposta:**
  1. Aggiungere dei valori di *fallback* per le stringhe descrittive (es. `"Eaton"` per manufacturer e `"3S UPS"` per product) se risultano vuote, garantendo così che HA riesca sempre a instanziare il dispositivo.
  *(Nota: Su richiesta dell'utente non verrà effettuato alcun mock o copia per la variabile `input.voltage`.)*

  ### Test Strategy
  Verificare con i test in `test_comprehensive_variables` che le variabili di fallback per il produttore e il modello vengano correttamente esposte da `GET VAR` e `LIST VAR` se i descrittori originali mancano.
