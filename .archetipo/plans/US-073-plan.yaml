  - id: TASK-13
    title: 'Fix: onValue senza copia di String quando il testo non cambia'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** review del 2026-10-29, `lib/USBHostUPS/src/NutTable.h:1061`. `onValue()` non deve allocare né copiare `b.value` quando il testo convertito è uguale a quello già memorizzato. È l'obiettivo di ADR 0007 e del piano di US-073.

      **Leggi:** `lib/USBHostUPS/src/NutTable.h`: `decode()` (case `Conv::Lookup` e `Conv::AbmStatus`) e `onValue()`.

      **Modifica:**
      1. Aggiungi `inline const char* staticText(const HidInfo& info, double v, const Context& ctx)` subito prima di `decode()`. Restituisce:
         - per `Conv::Lookup`, il `nut` della voce con `hid == (long)v`, altrimenti `nullptr`;
         - per `Conv::AbmStatus` con `ctx.abm == ABM_ENABLED`, il testo delle due tabelle oggi dentro `decode()` (spostale qui), altrimenti `nullptr`;
         - per le altre conversioni, `nullptr`.

         Commento: "texts of static tables, returned without building a String (US-073 rework, ADR 0007)".
      2. `decode()`:
         - case `Lookup`: `const char* t = staticText(...)`; se `t` → `out = t`, OK, altrimenti FAIL, come oggi;
         - case `AbmStatus`: CLEAR se l'ABM non è attivo, poi `staticText`; DEFER se `nullptr`, altrimenti OK. Comportamento invariato.
      3. `onValue()`:
         - dopo la gestione delle righe interne, di DEAD e di `string_index`, se `b.info->conv == Conv::Lookup` oppure (`Conv::AbmStatus` con ABM attivo), calcola `text = staticText(...)`:
           - con `text`: `if (!b.has || !(b.value == text)) b.value = text;`, poi `has`, `deferred=false` e `first` come nel ramo OK, poi `resolve`, poi `return`;
           - senza `text`: si continua con `decode()`, che dà FAIL, DEFER o CLEAR come oggi;
         - nel ramo OK generico, `b.value = out;` diventa `if (!b.has || !(b.value == out)) b.value = out;`.
      4. Non toccare `statusToken()`, che già restituisce `const char*`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_table -f test_rw_catalog -f test_eaton_driver -f test_generic_driver` verde senza modifiche alle asserzioni esistenti.

      **Fatto:** nessun `b.value = out;` senza confronto in `NutTable.h`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — `staticText`, `decode` (Lookup, AbmStatus), `onValue`

      ## Criteri di Completamento
      - [ ] `staticText` usata da `decode()` e da `onValue()`, nessuna tabella duplicata
      - [ ] Le quattro suite indicate restano verdi
    ref: TASK-13
  - id: TASK-14
    title: 'Test: nessuna allocazione a valore invariato'
    type: Test
    status: DONE
    dependencies:
      - TASK-13
    body: |-
      ## Descrizione
      **Obiettivo:** provare il criterio di TASK-13 con un conteggio reale delle allocazioni.

      **Leggi:** `test/test_nut_table/test_main.cpp` (helper `mgeRow`, `mk`), `test/mocks/Arduino.h` (String = `std::string`; la SSO di libstdc++ arriva a 15 caratteri).

      **Modifica:**
      1. In testa a `test/test_nut_table/test_main.cpp` aggiungi un contatore globale: `static size_t g_allocs = 0;`, più `void* operator new(size_t n)` che incrementa e chiama `malloc` (con `std::bad_alloc` su NULL) e `void operator delete(void* p) noexcept { free(p); }`, con la variante sized `operator delete(void*, size_t) noexcept`. Commento: conta le allocazioni di questa suite (US-073 rework).
      2. Test `test_lookup_same_value_does_not_allocate`:
         - bind di `UPS.BatterySystem.Charger.0xFFFF006B` (riga `battery.charger.type`, `mge-hid.c:2059`) con `mk(...)`;
         - `onValue(b, i, 5, ctx)`: atteso `"Constant Charge (CC)"`, 20 caratteri;
         - poi `size_t before = g_allocs; onValue(b, i, 5, ctx); TEST_ASSERT_EQUAL(before, g_allocs);`;
         - poi `onValue(b, i, 4, ctx)` → `"ABM"`, valore aggiornato.
      3. Test `test_abm_status_same_value_does_not_allocate`: Context con `abm = ABM_ENABLED` e `abm_path = ABM_PATH_STATUS`, riga `battery.charger.status` su `0xFFFF00E9`, valore 4 (`"discharging"`) due volte, nessuna allocazione alla seconda.
      4. Registra i due test in `main()`.

      **Verifica:** `pio test -e native -f test_nut_table` verde. Mutazione: in `onValue()` rimetti `b.value = text;` / `b.value = out;` senza confronto e rimuovi il ramo `staticText`. Il primo test deve fallire; poi ripristina.

      **Fatto:** test verdi, mutazione colta.

      **Blocchi:** se `operator new` globale confligge con Unity o con il mock, sposta il contatore in un header locale della suite; non toccare `test/mocks`.

      ## File Coinvolti
      - test/test_nut_table/test_main.cpp — contatore di allocazioni e 2 test

