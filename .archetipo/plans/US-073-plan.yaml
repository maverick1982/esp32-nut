schema: archetipo/plan/v2
spec_code: US-073
body: |-
  # US-073: Tabella unica Eaton (mge-hid), parte 1 — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-10-29

  ---

  ## Spec

  **Epic:** EP-001 — Gestione USB Host
  **Priorità:** MEDIUM | **Punti:** 8

  Il motore della tabella di US-066 impara le righe in sola lettura e le righe `BOOL`. `mgeHid2Nut()` riceve le righe upstream dei gruppi Device, Battery, UPS (PowerSummary/BatterySystem) e stato. Per gli Eaton, le mappature scritte a mano delle variabili coperte smettono di scrivere. `postDecode()` scrive in `UPSData` solo i valori cambiati. Le decisioni (regole 2, 3 e 4) sono nell'ADR 0011 e non vanno ridiscusse.

  ---

  ## Confine con US-074 (deciso in pianificazione)

  Le righe vengono dal blocco `mge_hid2nut` che va da `mge-hid.c:2004` a `mge-hid.c:2160`, cioè le sezioni Device collection, Battery page, UPS page, BOOL e `ups.alarm`. US-073 prende:

  - **Device:** 2006 `device.country`, una riga interna che non pubblica nulla e sostituisce la mappatura a mano del paese in `EatonDriver`, e 2007 `device.usb.version`.
  - **Battery page:** tutte le righe da 2012 a 2059, comprese le righe ABM.
  - **UPS page:** le righe con un percorso `UPS.PowerSummary.*` o `UPS.BatterySystem.*`: 2063 `ups.firmware`, 2064 `ups.load`, 2068-2070 `ups.timer.*`, 2071 `ups.test.result` e 2078 `ups.temperature`. Le righe RW di questo blocco sono già nella tabella.
  - **BOOL:** tutte le righe da 2106 a 2152, qualunque sia il percorso, perché formano il gruppo di stato.

  Restano a US-074, ciascuna con un commento `// <nome> (mge-hid.c:NNNN): row of US-074, <motivo>` nella posizione upstream:

  - le righe UPS page su `UPS.PowerConverter`/`UPS.Flow`: 2062 `ups.efficiency`, 2079-2091 `ups.power*`, `ups.L*`, `ups.realpower*` (compresa `eaton_compute_realpower_info`) e 2103 `ups.type`;
  - le tre righe `ups.beeper.status` (2075-2077). Vanno decise insieme ai comandi beeper e al percorso del beeper attivo usato da `HidControl`; oggi `USBHostUPS::getActiveBeeperPath()` e la riga upstream che vince potrebbero indicare usage diversi;
  - le sei righe `ups.alarm` (2155-2160): il firmware non costruisce ancora `ups.alarm`;
  - la sostituzione di `outlet.N.switch` con `outlet.N.status` (ADR 0011, regola 2), che appartiene alle righe Outlet.

  Le righe `#if 0` (2108-2111) restano come commento. Il ramo `HAVE_STRPTIME` è quello già scelto da US-066.

  ---

  ## Soluzione Tecnica

  ### 1. Conversioni nuove in `NutTable.h`

  `enum class Conv` cresce, sempre con una voce per ogni `info_lkp_t` upstream:

  - **`Number` segue il formato `dfl`** della riga (`%.0f`, `%.1f`, `%.2f`). Oggi arrotonda sempre a intero. `formatRounded()` resta per `%.0f` (lrint, pari sui .5 come printf). Gli altri due formati usano `snprintf(dfl)`. Un formato diverso fa fallire la conversione (FAIL) e un test lo controlla su tutte le righe.
  - **`StringId`** (`stringid_conversion`): il valore HID è un indice di stringa. Un indice ≤ 0 dà FAIL. Altrimenti la riga memorizza l'indice in `Bound::string_index` e resta in attesa (DEFER) finché arriva il descrittore. Vedi il punto 3.
  - **`KelvinCelsius`** (`kelvin_celsius_conversion_fun`): `%.1f`, sottraendo 273.15 solo se 273 ≤ v ≤ 373.
  - **`MgeBatteryCapacity`**: `%.2f` di v/3600.
  - **`MgeBatteryVoltage` e `MgeBatteryVoltageNominal`** (`mge-hid.c:690-745`): DEFER finché `ctx.ready` è falso. Pubblicano solo se `mge_type & 0xFF00` vale MGE_EVOLUTION, MGE_PULSAR_M, EATON_5P o EATON_9E; nominale 12 per MGE_EVOLUTION_650. Altrimenti FAIL, come il NULL upstream.
  - **Lookup nuove, copiate alla lettera:** `kTestRead` (`test_read_info`), `kEatonChargerType` (`eaton_charger_type_info`), `kMgeOnBatt` (`mge_onbatt_info`) e le tabelle di stato comuni (`online_info`, `discharging_info`, `lowbatt_info`, `overload_info`, `replacebatt_info`, `trim_info`, `boost_info`, `vrange_info`, `frange_info`, `off_info`, `bypass_auto_info`, `bypass_manual_info`, `eco_mode_info`, `fanfail_info`, `nobattery_info`, `chargerfail_info`, `battvolthi_info`, `battvoltlo_info`, `commfault_info`, `overheat_info`, `shutdownimm_info`).
  - **Conversioni con stato:**
    - `MgeCountry` (`eaton_check_country_fun`): scrive `ctx.country` e `ctx.country_seen`.
    - `AbmEnabled`, `AbmPathMode`, `AbmPathStatus`: scrivono `ctx.abm` e `ctx.abm_path` come le funzioni upstream.
    - `AbmStatus` (`eaton_abm_status_fun`): CLEAR se l'ABM è sconosciuto o disattivo, DEFER per i valori senza testo, altrimenti il testo secondo il percorso.
    - Conversioni di stato `AbmChrgDischrg`, `EatonDischarging`, `EatonCharging` e `EatonConverterOnline`: producono un token, oppure DEFER al posto del NULL upstream. `EatonCharging` legge `battery.charge` da `UPSData`, come `dstate_getinfo`, quindi `decode()` riceve un `const UPSData*` opzionale (default `nullptr`: i test esistenti compilano senza modifiche). `EatonConverterOnline` legge il bit OFF dallo stato corrente.
  - **`DecodeResult::CLEAR`:** la riga toglie la sua chiave da `UPSData` (`dstate_delinfo`), azzera `has` e resta indecisa come con DEFER.
  - **`mgeModelType()`** porta tutte le righe di `mge_model_names` (`mge-hid.c:1760-1990`), solo prodotto, modello e tipo, comprese le righe con spazi finali e quelle `"unknown"`. Prima si fermava ai tipi sotto MGE_DEFAULT; ora servono anche Evolution, Pulsar M, 5P e 9E. `pegasusValid()` e `nominalVoltageValid()` non cambiano risultato: per loro ogni tipo ≥ MGE_DEFAULT valeva già come MGE_DEFAULT.

  ### 2. Righe BOOL e interne

  - **Righe interne:** le righe con `info_type` `"BOOL"` e le righe con conversione `MgeCountry`, `AbmEnabled`, `AbmPathMode` o `AbmPathStatus` (`device.country`, `battery.charger.abm.status`, `battery.charger.mode.status`, `battery.charger.type.status`). Upstream non le pubblica mai, quindi la regola INIT non le scarta. `bind()` le rende ACTIVE, `resolve()` le salta e `onValue()` non le rende mai DEAD. Non scrivono mai la propria `info_type` in `UPSData`.
  - **`StatusBits`** (`NutTable.h`): due `uint32_t`, `set` e `known`, con le maschere di `status_info` di `usbhid-ups.c`. `applyStatusToken(bits, token)` porta `process_boolean_info()` alla lettera: `!` per cancellare, online e offline si neutralizzano a vicenda, così come fullycharged e notfullycharged, `strcasecmp`, e i token sconosciuti vengono ignorati. Ogni token toccato entra in `known`. I bit vivono in `Context`, insieme ad `abm`, `abm_path` e `country_seen`.
  - **Chiavi interne (`statusKeys`)**, scritte solo per i token in `known`:
    - online/offline → `ups.status.ac_present`: `1` con ONLINE, `0` con OFFLINE, chiave tolta se nessuno dei due. Con la chiave tolta, `computeUPSStatusString` non dà OL e dà OB solo con DISCHRG, come `ups_status_set()` quando manca uno stato di alimentazione;
    - dischrg → `discharging`, chrg → `charging`, lowbatt → `battery_low`, overload → `overload`, replacebatt → `replace_battery`, shutdownimm → `shutdown_imminent`, nobattery → `no_battery`, depleted → `depleted`, timelimitexp → `remaining_time_limit_expired`;
    - fullycharged/notfullycharged → `fully_charged` (`1`, `0` oppure tolta);
    - tutti gli altri → `ups.status.<token>` (`off`, `commfault`, `trim`, `boost`, `bypassauto`, `bypassman`, `ecomode`, `essmode`, `cal`, `overheat`, `awaitingpower`, `fanfail`, `battvoltlo`, `battvolthi`, `chargerfail`, `vrange`, `frange`).
  - **`computeUPSStatusString` non cambia.** I token che oggi non rende (OFF, TRIM, BOOST, BYPASS, CAL, ALARM) restano chiavi interne, come già per Liebert. Renderli, insieme a `ups.alarm` e `input.transfer.reason`, è un lavoro a parte da proporre come spec. I driver senza righe BOOL (tutti tranne Eaton) non toccano queste chiavi.

  ### 3. Motore in `GenericDriver`

  - **`postDecode()`:** elabora le righe del report nell'ordine della tabella, come oggi; le righe BOOL applicano il token a `_nut_ctx.status`. Poi pubblica:
    - per ogni riga ACTIVE con `has`, `if (!ups_data.valueEquals(name, value)) ups_data.set(name, value)`. È lo stesso test per "valore cambiato" e per "una mappatura a mano l'ha sovrascritto", senza allocazioni quando il valore è uguale;
    - le righe CLEAR tolgono la chiave;
    - le chiavi di stato si sincronizzano con lo stesso confronto;
    - se `ups.load` è stato scritto chiama `ups_data.updateRealPower()`, come la mappatura `PercentLoad` di oggi (resta fino alla riga `eaton_compute_realpower_info` di US-074).
  - **`UPSData`:** `bool valueEquals(const char* key, const String& value) const` (confronto senza String temporanee) e un contatore `writes()`, incrementato da `set()` e `remove()` e usato dai test.
  - **Stringhe:** `GenericDriver::collectStringRequests()` aggiunge gli indici delle righe `StringId` non ancora risolte. `GenericDriver::parseStringDescriptor()` assegna il testo, già decodificato da `decodeStringDescriptor()` con inversione e trim, alle righe con quell'indice, poi chiama `resolve()` e pubblica. `finishInit()` tratta una riga `StringId` con indice noto e senza testo come differita, non come fallita.
  - **Mappature superate:** `UsageMapIndex::apply()` riceve un elenco opzionale di percorsi da saltare, applicato una volta in `build()`, quindi nessun costo per report. `GenericDriver` espone `virtual const char* const* supersededGenericPaths(size_t& n) const` (vuoto di default) e lo passa a `_generic_map.apply`. Solo `EatonDriver` lo riempie.

  ### 4. `EatonDriver`

  - **Percorsi generici saltati (40),** cioè tutte le mappature di `GenericDriver` che scrivono una chiave coperta dalle righe di US-073:
    - stato, 20 percorsi: `PresentStatus.*` e `PowerSummary.*` di ACPresent, Discharging, Charging, BelowRemainingCapacityLimit, NeedReplacement, Overload, ShutdownImminent e CommunicationLost, più PresentStatus.BatteryPresent, RemainingTimeLimitExpired, FullyCharged e FullyDischarged. `mge_hid2nut` legge solo le sue righe BOOL;
    - `battery.voltage`: PowerSummary, BatterySystem e Battery `.Voltage`;
    - `battery.charge`: `RemainingCapacity`;
    - `battery.charge.low`: `PowerSummary.RemainingCapacityLimit`;
    - `battery.runtime`: `PowerSummary` e `Battery` `.RunTimeToEmpty`;
    - `ups.load`: `PowerSummary`, `PowerConverter.Output` e `Output` `.PercentLoad`;
    - `ups.temperature` e `battery.temperature`;
    - `battery.capacity` (`BatterySystem.Battery.DesignCapacity`);
    - `battery.capacity.full` (`BatterySystem.Battery.FullChargeCapacity`): nome non standard, si toglie (ADR 0011, regola 2);
    - `battery.voltage.nominal`: `PowerSummary` e `Battery` `.ConfigVoltage`;
    - `ups.test.result`: `BatterySystem.Battery.Test`, `Battery.Test`, `Output.Test`;
    - `ups.timer.shutdown`: `PowerSummary.DelayBeforeShutdown`.
  - **Restano (regola 2 o US-074):**
    - `ups.mfr.date` e `battery.mfr.date`, estensioni documentate;
    - `ups.beeper.status`;
    - tutte le mappature di Input, Output, Flow e PowerConverter;
    - `input.transfer.*`.
  - **Mappature a mano di `EatonDriver` tolte:** `PresentStatus.Good`, `PresentStatus.InternalFailure`, `PowerSummary.Voltage`, `iDeviceChemistry` (con `_chemStrIdx` e la sua richiesta di stringa) e `Country` (con `_countrySeen`). Al loro posto: righe BOOL `off_info` e `commfault_info`, riga `mge_battery_voltage`, riga `StringId` di `battery.type`, riga interna `device.country`. `updateNutContext()` legge `_nut_ctx.country_seen`.
  - **Restano fino a US-074:** `outlet.N.switch`, `Flow.ConfigFrequency`, `ConverterType`, e gli ingressi del contesto `iModel` e `Flow.[4].ConfigApparentPower`.

  ### 5. Differenze attese (da confermare nel replay e sull'Eaton 3S)

  - **Eaton 3S, fixture:**
    - nuova `ups.timer.start` (`-1`);
    - con le stringhe, sul dispositivo, nuove `ups.firmware` (indice 6) e `device.usb.version` (indice 8). `battery.type` arriva dalla riga `StringId` (indice 5) invece che dalla mappatura a mano;
    - chiavi interne: `ups.status.good` diventa `ups.status.off` (invertito, `0`), `ups.status.internal_failure` diventa `ups.status.commfault`, `ups.status.comm_lost` sparisce (mge-hid non legge CommunicationLost), si aggiungono `ups.status.battvolthi` e `ups.status.battvoltlo`;
    - `ups.status` resta `OL`.
  - **Eaton 5P** (solo descriptor):
    - legano anche `battery.capacity` (`%.2f`), `battery.voltage` e `battery.voltage.nominal` (solo con tipo 5P), le righe ABM, `battery.charger.status` e `battery.charger.type`, `ups.test.result`, e le righe BOOL `nobattery`, `chargerfail`, `fanfail` e `overheat`;
    - `RB` quando `BatterySystem.Battery.PresentStatus.Present` vale 0;
    - `battery.capacity.full` non viene più pubblicata.

  ---

  ## Strategia di Test

  Nessuna superficie UI nuova: niente mockup né video. Le descrizioni Web di `ups.firmware`, `device.usb.version`, `battery.charger.*` e `ups.timer.start` esistono già in `data/www/bundle.js`. Playwright gira solo come regressione.

  - **Unità, nuova suite `test/test_nut_table`:**
    - ogni conversione nuova, valori limite compresi;
    - `Number` con i tre formati e FAIL su un formato ignoto;
    - `applyStatusToken` con neutralizzazioni e `!`;
    - sequenze ABM con il percorso Mode e con il percorso Status;
    - `EatonCharging` al 100%;
    - `EatonConverterOnline` con OFF;
    - righe interne e BOOL sempre ACTIVE;
    - `StringId`;
    - `statusKeys`, compresa la chiave `ac_present` tolta;
    - `mgeModelType` per 3S, 5P, 9E ed Evolution 650;
    - un controllo strutturale su `mgeHid2Nut()`: ogni riga ha un formato fra quelli supportati e una conversione che lo accetta.
  - **Unità, `test_generic_driver`:**
    - un report senza righe legate lascia `UPSData::writes()` invariato (criterio della spec);
    - un valore uguale non riscrive;
    - una mappatura che sovrascrive viene corretta;
    - CLEAR toglie la chiave;
    - il percorso saltato non scrive;
    - flusso `StringId` fino alla pubblicazione;
    - `updateRealPower` dopo `ups.load`.
  - **Unità, `test_eaton_driver`:**
    - OB (`ACPresent=0`, `Discharging=1` → `OB DISCHRG`), ritorno a OL, LB e RB;
    - `battery.capacity.full` mai scritta;
    - `battery.mfr.date` e `ups.mfr.date` ancora pubblicate;
    - `battery.voltage` assente su un 3S e `%.1f` su un 5P.
  - **Replay, `test_record_replay`:**
    - per le due fixture Eaton, elenco delle righe legate ricavato a mano dal descriptor e da `mge-hid.c`, con un commento che cita usage e riga;
    - valori pubblicati e differenze rispetto a prima elencati nel commento;
    - aggiornate le chiavi interne attese nella fixture 3S;
    - LIST RW e LIST CMD invariati;
    - tutte le altre fixture invariate.
  - **Prova delle mutazioni:** se si inverte `off_info`, si toglie la neutralizzazione online/offline o si rimette la riscrittura di tutte le righe, deve fallire almeno un test per ciascuna modifica.
  - **Regressione:** suite nativa completa a blocchi, `npm run e2e` e build `esp32-s3-standard`, con RAM e flash annotate.
  - **Hardware:**
    - sull'Eaton 3S via OTA, `scripts/nut_snapshot.py` prima e dopo, con `diff`: devono comparire solo le differenze elencate;
    - mains staccata (`OB DISCHRG`) e riattaccata (`OL`);
    - `battery.type` invariata.

  ---

  ## Rischi e note

  - **Ordine dei report (corretto dopo la code review):** i report delle righe BOOL arrivano uno alla volta. Dopo ogni report `walkInternalRows()` riapplica, in ordine di tabella, l'ultimo valore di ogni riga interna e BOOL, come il walk upstream. Senza, con ABM attivo, `!dischrg` del report di stato annullava `dischrg` di Charger.Mode. I report delle righe di stato `HU_FLAG_QUICK_POLL` (ABM) entrano nel quick poll. Nel replay del 3S `ups.status.charging` diventa `0` (Charging=1, ma con `battery.charge` a 100 `eaton_abm_check_chrg_fun` dà `!chrg`); `ups.status` resta `OL`.
  - **Regola INIT semplificata di US-066:** vince la prima riga il cui primo valore converte. Si applica anche alle righe RO. Le righe che upstream tiene vive pur restituendo NULL (interne, BOOL, ABM) sono gestite come interne o con DEFER.
  - **Contatore `writes()` in `UPSData`:** un `uint32_t` in più per istanza, accettabile.
  - **Note di rilascio:** la versione la sceglie l'utente (TASK-12). Le differenze vanno anche nel test di replay.

  ---

  _Piano generato con ARchetipo Planning — 2026-10-29_

  ---

  ## Rework (review del 2026-10-29)

  La review ha accettato il comportamento, provato sull'Eaton 3S: `OB DISCHRG` → `OL CHRG`, diff `upsc` con solo le tre variabili attese. Ha chiesto due correzioni, che erano i miglioramenti lasciati aperti dalla code review.

  - **Nessuna copia di String quando il testo non cambia** (`NutTable.h`, `onValue()`). Oggi `decode()` costruisce `out` e `onValue()` lo copia in `b.value` a ogni lettura. I testi che superano la SSO allocano e liberano a ogni full poll, per esempio `"Constant Charge (CC)"` di `eaton_charger_type_info`, contro ADR 0007 e il piano.
    - Correzione: una funzione `staticText(info, v, ctx)` restituisce il `const char*` delle conversioni che pescano da tabelle statiche (`Conv::Lookup` e `Conv::AbmStatus`), oppure `nullptr`.
    - `onValue()` la usa al posto di `decode()` per queste conversioni e assegna `b.value` solo se `!b.has || !(b.value == text)`.
    - Per le altre conversioni (numeri, date, stringhe brevi) assegna `out` solo se è diverso.
    - `decode()` resta il punto unico per i test e chiama `staticText()` per non duplicare le tabelle.
  - **Troncamento a 19 caratteri delle righe `StringId`** (`GenericDriver::parseStringDescriptor`). `stringid_conversion_fun` (`usbhid-ups.c:598-603`) usa `static char buf[20]` con `HIDGetIndexString(..., sizeof(buf))`, quindi upstream `ups.firmware`, `battery.type` e `device.usb.version` hanno al massimo 19 caratteri.
    - Correzione: il testo passato a `NutTable::onString()` per le righe `StringId` viene troncato a 19 caratteri, con il commento che cita la riga upstream.
    - Le altre stringhe (`ups.mfr`, `ups.model`, `ups.serial`, `battery.mfr.date`) non cambiano: non sono righe della tabella.
    - Deviazione minima: il trim finale dei `\r\n` di `decodeStringDescriptor()` avviene prima del troncamento, mentre upstream fa `str_rtrim` dopo `libusb`. Conta solo se un a capo cade attorno al diciannovesimo carattere.

  **Test del rework.**
  - `test_nut_table`: un contatore di `operator new` locale alla suite verifica che una seconda lettura con lo stesso valore di `battery.charger.type` (5, `"Constant Charge (CC)"`, 20 caratteri, oltre la SSO di libstdc++) non allochi. La prima lettura e un valore diverso continuano ad aggiornare `b.value`.
  - `test_generic_driver`: una stringa di 25 caratteri su una riga `StringId` viene pubblicata con 19 caratteri, una di 10 resta intera.
  - Mutazioni: rimettere `b.value = out` senza confronto e togliere il troncamento devono far fallire i test nuovi.
  - Regressione completa, build e una verifica OTA rapida sull'Eaton 3S: `ups.firmware` (10 caratteri) e `battery.type` devono restare uguali.
tasks:
  - id: TASK-01
    title: Conversioni RO, formati e tipi di modello mge in NutTable.h
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** dare a `NutTable.h` le conversioni in sola lettura delle righe Battery/UPS di mge-hid, senza ancora toccare la tabella né il driver.

      **Leggi:**
      - `lib/USBHostUPS/src/NutTable.h` (`Conv`, `decode`, `mgeModelType`, `Context`);
      - `nut_repo/drivers/usbhid-ups.c` righe 501-520 (`test_read_info`, `beeper_info`), 598-608 (`stringid_conversion`) e 644-666 (`kelvin_celsius_conversion`);
      - `nut_repo/drivers/mge-hid.c` righe 120-150 (enum dei tipi), 448-456 (`eaton_charger_type_info`), 680-760 (tensione e capacità batteria) e 1760-1995 (`mge_model_names`).

      **Modifica:**
      1. `Conv::Number` formatta secondo `info.dfl`:
         - `"%.0f"` → `formatRounded()` come oggi;
         - `"%.1f"` e `"%.2f"` → `snprintf(buf, sizeof(buf), info.dfl, v)`;
         - altro → FAIL.
      2. Nuove voci di `Conv`, ciascuna con il commento della funzione upstream:
         - `StringId`: DEFER con indice > 0 e FAIL con indice ≤ 0. L'indice passa al chiamante in un parametro di uscita o in un campo che `onValue` scrive in `Bound::string_index`; il campo nuovo `uint8_t string_index = 0` va in `Bound`;
         - `KelvinCelsius`;
         - `MgeBatteryCapacity`;
         - `MgeBatteryVoltage` e `MgeBatteryVoltageNominal`: DEFER se `!ctx.ready`; tipi ammessi `mge_type & 0xFF00` in {0x300, 0x400, 0x500, 0x900}; 12 per MGE_EVOLUTION_650 = 0x301.
      3. Costanti: `MGE_EVOLUTION=0x300`, `MGE_EVOLUTION_650=0x301` e le altre Evolution in sequenza come l'enum upstream, `MGE_PULSAR_M=0x400` e le sue, `EATON_5P=0x500`, `EATON_9E=0x900`.
      4. Lookup verbatim: `kTestRead`, `kEatonChargerType`.
      5. `mgeModelType()` contiene tutte le righe di `mge_model_names` (prodotto, modello, tipo; la colonna nome non serve), nell'ordine upstream, spazi finali compresi. Togli la restrizione ai tipi sotto MGE_DEFAULT e aggiorna il commento.
      6. `decode()` riceve un quinto parametro `const UPSData* data = nullptr` (usato da TASK-03); `onValue()` lo inoltra con lo stesso default.

      **Verifica:** `test_rw_catalog` e `test_eaton_driver` verdi senza modifiche alle asserzioni.

      **Fatto:** conversioni presenti, nessuna riga nuova in `mgeHid2Nut()`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — conversioni, costanti, lookup, `mgeModelType`, firma di `decode`/`onValue`

      ## Criteri di Completamento
      - [ ] `Number` rispetta `%.0f`/`%.1f`/`%.2f` e dà FAIL sugli altri formati
      - [ ] `mgeModelType("Eaton 5P","1550")` = 0x500, `("Eaton 9E","1000i")` = 0x900, `("Evolution","650")` = 0x301, `("3S","700")` = 0x110
      - [ ] `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_rw_catalog -f test_eaton_driver` verde
    ref: TASK-01
  - id: TASK-02
    title: Stato BOOL, righe interne e ABM in NutTable.h
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** portare la raccolta dei bit di stato di usbhid-ups e le funzioni mge con stato (paese, ABM, charging/discharging), più la regola per cui le righe interne e BOOL restano sempre attive.

      **Leggi:**
      - `nut_repo/drivers/usbhid-ups.c` righe 280-500 (`status_info`, tabelle `*_info`) e 2030-2070 (`process_boolean_info`);
      - `nut_repo/drivers/mge-hid.c` righe 240-600 (ABM, `eaton_abm_*`, `eaton_abm_check_*`), 811-815 (`mge_onbatt_info`), 1385-1396 (`eaton_check_country_fun`) e 1555-1567 (`eaton_converter_online_fun`);
      - `lib/USBHostUPS/src/UPSData.h` (`computeUPSStatusString`).

      **Modifica:**
      1. `struct StatusBits { uint32_t set = 0; uint32_t known = 0; }`, una costante per bit nell'ordine di `status_info`. `applyStatusToken(StatusBits&, const char* token)` è il port letterale di `process_boolean_info`:
         - online → `!offline`, offline → `!online`, fullycharged ↔ notfullycharged;
         - `!` per cancellare, `strcasecmp`, token ignoti ignorati;
         - ogni bit toccato entra in `known`.
      2. `Context` riceve `StatusBits status`, `int abm = ABM_UNKNOWN`, `int abm_path = ABM_PATH_UNKNOWN` e `bool country_seen = false` (valori ABM come upstream).
      3. Lookup di stato verbatim: tutte le tabelle comuni elencate nel piano e `kMgeOnBatt`. Usano `Conv::Lookup`: il testo è il token.
      4. Conversioni nuove:
         - `MgeCountry`: scrive `ctx.country = (int)v` e `country_seen = true`, poi DEFER;
         - `AbmEnabled`, `AbmPathMode`, `AbmPathStatus`: stato come upstream, sempre DEFER;
         - `AbmStatus`: CLEAR con ABM sconosciuto o disattivo, DEFER sui valori senza testo, altrimenti il testo secondo `abm_path`;
         - `AbmChrgDischrg`, `EatonDischarging`, `EatonCharging` (con `data` nullo o `battery.charge` assente: nessun controllo del 100%) e `EatonConverterOnline` (DEFER se il bit OFF è impostato): producono il token oppure DEFER.
         - Aggiungi `DecodeResult::CLEAR`.
      5. `inline bool isInternalRow(const HidInfo&)`: `info_type` uguale a `"BOOL"`, oppure conversione MgeCountry, AbmEnabled, AbmPathMode o AbmPathStatus.
         - `bind()` rende ACTIVE le righe interne;
         - `resolve()` le esclude dai gruppi;
         - `onValue()`: sulle righe BOOL, se il risultato è OK applica il token a `ctx.status`, e su una riga interna non tocca mai `first` né `role`. Sulle righe non interne, CLEAR mette `has=false`, imposta un flag `b.cleared=true` (campo nuovo di `Bound`) e lascia la riga indecisa come DEFER;
         - `finishInit()` non rende FAIL le righe interne né le righe CLEAR o DEFER.
      6. `statusKeys(const StatusBits&, callback)` (oppure un array `{key, value|nullptr}`) produce la mappatura del piano. `ac_present` e `fully_charged` sono a tre stati: `"1"`, `"0"` oppure "togli". Solo per i token in `known`.

      **Verifica:** compila; suite esistenti verdi.

      **Fatto:** API pronta per TASK-03/04; `computeUPSStatusString` invariato.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — `StatusBits`, lookup di stato, conversioni ABM/paese/stato, righe interne in `bind`/`resolve`/`onValue`/`finishInit`, `statusKeys`

      ## Criteri di Completamento
      - [ ] `UPSData.h::computeUPSStatusString` non modificato
      - [ ] Le suite native esistenti restano verdi
    ref: TASK-02
