      - [ ] 2 test nuovi verdi
      - [ ] La mutazione indicata fa fallire `test_lookup_same_value_does_not_allocate`
    ref: TASK-14
  - id: TASK-15
    title: 'Fix: righe StringId troncate a 19 caratteri come stringid_conversion'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** review del 2026-10-29, `lib/USBHostUPS/src/GenericDriver.cpp:580`. Il testo di una riga `Conv::StringId` ha al massimo 19 caratteri, come `stringid_conversion_fun` (`usbhid-ups.c:598-603`, `static char buf[20]` passato a `HIDGetIndexString`).

      **Leggi:** `lib/USBHostUPS/src/GenericDriver.cpp`, `parseStringDescriptor()` (blocco "Table rows whose value is this string"); `nut_repo/drivers/usbhid-ups.c:598-603`.

      **Modifica:**
      1. Nel blocco delle righe di tabella di `parseStringDescriptor()`, prima del ciclo, prepara `String text = str;` e `if (text.length() > 19) text = text.substring(0, 19);`, con il commento: `stringid_conversion_fun (usbhid-ups.c:598-603) reads the string into static char buf[20]: at most 19 characters`. Poi passa `text` a `NutTable::onString`.
      2. Il troncamento si fa solo quando almeno una riga ha quell'indice, così da non creare una String in più per le altre stringhe. Va bene anche calcolarlo dentro il ciclo alla prima riga trovata.
      3. `ups.mfr`, `ups.model`, `ups.serial` e `battery.mfr.date` restano invariati.

      **Verifica:** `pio test -e native -f test_generic_driver -f test_eaton_driver` verde.

      **Fatto:** il testo pubblicato da una riga `StringId` non supera 19 caratteri.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/GenericDriver.cpp — `parseStringDescriptor`

      ## Criteri di Completamento
      - [ ] Commento con la riga upstream presente
      - [ ] Le due suite indicate verdi
    ref: TASK-15
