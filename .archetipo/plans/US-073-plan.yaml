    body: |-
      ## Descrizione
      **Obiettivo:** coprire con test unitari conversioni e stato di TASK-01/02, indipendentemente dai driver.

      **Leggi:** `test/test_rw_catalog/test_main.cpp` (helper `mk`, `conv`, stile), `lib/USBHostUPS/src/NutTable.h`.

      **Modifica:** crea `test/test_nut_table/test_main.cpp` con `setUp`/`tearDown` vuoti e un `main` che esegue i casi seguenti.
      - Conversioni:
        - `Number`: 12.34 dà `12`, `12.3` e `12.34` nei tre formati; `"%d"` dà FAIL;
        - `KelvinCelsius`: 298.15 → `25.0`, 25 → `25.0`, 373 → `99.9`;
        - `MgeBatteryCapacity`: 25200 → `7.00`;
        - `MgeBatteryVoltage(Nominal)`: DEFER con ready=false, FAIL con mge_type 0x110, `%.1f` con 0x500, 12 con 0x301;
        - `StringId`: DEFER con l'indice e FAIL con 0;
        - `kTestRead`, `kEatonChargerType`.
      - `applyStatusToken`: online poi offline; `!online` lascia OFFLINE invariato; fullycharged ↔ notfullycharged; token ignoto; maiuscole.
      - `statusKeys`:
        - ONLINE → `ac_present=1`; OFFLINE → `0`; dopo `!online` senza OFFLINE la chiave va tolta;
        - `off` → `ups.status.off`;
        - nulla per i token non `known`.
      - ABM:
        - percorso Mode: enabled=1, poi Mode=1 → `battery.charger.status` `charging` e BOOL `chrg`, Mode=2 → `discharging`/`dischrg`;
        - percorso Status: 4 → `discharging`/`dischrg`;
        - ABM disabilitato → CLEAR;
        - con ABM attivo `EatonCharging(1)` dà `!chrg`.
      - `EatonCharging`: con `battery.charge=100` in `UPSData` dà `!chrg`, con 80 dà `chrg`, con data nullo dà `chrg`.
      - `EatonConverterOnline`: con OFF impostato DEFER, altrimenti `online`/`!online`.
      - `mgeModelType`: 3S 700, 3S 550, 5P 1550, 9E 1000i, Evolution 650, `Ellipse PRO` `"1200 "`, sconosciuto → MGE_DEFAULT.
      - Righe interne: due righe BOOL e una `device.country` legate sono ACTIVE e restano ACTIVE dopo FAIL, DEFER e `finishInit()`; una riga normale con lo stesso nome di un'altra segue la regola INIT di sempre.
      - Strutturale su `mgeHid2Nut()`: ogni riga ha `dfl` fra `%.0f`, `%.1f`, `%.2f`, `%s` oppure è una riga HU_FLAG_ABSENT/BOOL; le righe `%s` hanno una conversione diversa da `Number`.

