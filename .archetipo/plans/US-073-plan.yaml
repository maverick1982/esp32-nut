    title: Righe mge_hid2nut dei gruppi Device, Battery, UPS (PowerSummary/BatterySystem) e BOOL
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** copiare in `mgeHid2Nut()` le righe di US-073 nell'ordine upstream, lasciando le righe RW già presenti dove sono.

      **Leggi:**
      - `nut_repo/drivers/mge-hid.c` righe 2002-2160, con la tabella dei nomi alle righe 1570-1730 per tradurre gli usage vendor in `0xFFFFxxxx`;
      - `lib/USBHostUPS/src/NUTUsages.h` (nomi standard);
      - il piano, sezione "Confine con US-074".

      **Modifica:**
      1. Per ogni riga upstream dalla 2006 alla 2152, nell'ordine:
         - **in ambito** (piano): `// mge-hid.c:NNNN <percorso upstream>` più la riga `HidInfo`. Percorso con nomi di `NUTUsages.h`, usage vendor come `0xFFFF00xx` maiuscolo, indici `[N]` come nelle righe esistenti. Flag, `info_len` e `dfl` copiati, `hidflags` copiati;
         - **RW già presente:** resta;
         - **di US-074:** commento `// <info_type> (mge-hid.c:NNNN): row of US-074, <motivo>`;
         - **`#if 0`:** commento con il motivo upstream.
      2. Conversioni:
         - `NULL` → `Conv::Number` (formato da `dfl`);
         - `stringid_conversion` → `StringId`;
         - `kelvin_celsius_conversion` → `KelvinCelsius`;
         - `mge_battery_capacity` → `MgeBatteryCapacity`;
         - `mge_battery_voltage(_nominal)` → le due conversioni dedicate;
         - `eaton_check_country_info` → `MgeCountry`;
         - le righe ABM → `AbmEnabled`, `AbmPathMode`, `AbmPathStatus`, `AbmStatus`;
         - `eaton_charger_type_info` e `test_read_info` → `Lookup`;
         - le righe BOOL → `Lookup` con la tabella del token, oppure le conversioni `EatonDischarging`, `EatonCharging`, `AbmChrgDischrg`, `EatonConverterOnline`.
      3. Percorsi tradotti, da ricontrollare uno per uno:
         - Country `UPS.PowerSummary.0xFFFF0095`;
         - System.USB.iVersion `UPS.0xFFFF00E5.0xFFFF0005.0xFFFF00F1`;
         - RestartLevel `0xFFFF005F`;
         - `UPS.StatisticSystem.Input.[1].Statistic.[1].Time` → `UPS.0xFFFF0004.Input.[1].0xFFFF0003.[1].0xFFFF0097`;
         - Charger ABMEnable `0xFFFF0087`, Mode `0xFFFF0094`, Status `0xFFFF00E9`, ChargerType `0xFFFF006B`;
         - iVersion `UPS.PowerSummary.0xFFFF00F1`;
         - `UPS.PowerConverter.Output.Overload.[1].PresentStatus.OverThreshold` → `...0xFFFF007E`;
         - LCMSystem/LCMAlarm/TimerExpired → `UPS.0xFFFF0018.0xFFFF001A.[2].PresentStatus.0xFFFF0093`;
         - FanFailure `0xFFFF0077`, VoltageTooHigh `0xFFFF0074`, VoltageTooLow `0xFFFF0075`.
      4. Aggiorna il commento di testa di `NutTable.h` e quello sopra le tabelle ("Partial on purpose (US-066)..."): mgeHid2Nut ha le righe RO e BOOL di US-073; le altre arrivano con US-074.

      **Verifica:** `pio test -e native -f test_nut_table -f test_rw_catalog`. Il test `test_mge_first_row_wins_battery_charge_low` va aggiornato: ora legano due righe, la RW (indice 1) ACTIVE dopo il primo valore e la RO DEAD. Aggiorna anche il commento "the read-only row is not in the table yet".

      **Fatto:** ogni riga upstream 2006-2152 compare una volta, come riga o come commento, con il numero di riga.

      **Blocchi:** se un percorso upstream non si traduce (nome mancante in NUTUsages e in mge_usage_lkp), lascia la riga come commento con il motivo e segnalalo nella review.

      ## File Coinvolti
