  - id: TASK-05
    title: 'Motore in GenericDriver: scritture solo se cambiate, stato, stringhe, mappature superate'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** collegare il motore nuovo a `GenericDriver`, chiudendo il punto di `postDecode()` della code review di US-066.

      **Leggi:**
      - `lib/USBHostUPS/src/GenericDriver.cpp`: `postDecode`, `bindNutTable`, `collectStringRequests`, `parseStringDescriptor`, `decodeReport`, `completeInitialPoll`;
      - `lib/USBHostUPS/src/GenericDriver.h`;
      - `lib/USBHostUPS/src/UsageMapIndex.h`.

      **Modifica:**
      1. `UsageMapIndex::apply(...)` riceve due parametri opzionali `const char* const* skip = nullptr, size_t n_skip = 0`, passati a `build()`, che non indicizza le mappature il cui `path` è nell'elenco (strcmp). Il fingerprint resta com'è: l'elenco è fisso per classe di driver.
      2. In `GenericDriver.h`: `virtual const char* const* supersededGenericPaths(size_t& n) const { n = 0; return nullptr; }`, con un commento che rimanda all'ADR 0011 e a US-073. In `decodeReport()`, `_generic_map.apply(..., skip, n_skip)`.
      3. `postDecode()`:
         - le righe del report passano per `onValue(_nut_rows, i, v, _nut_ctx, &ups_data)`;
         - poi la pubblicazione. Per ogni riga non interna:
           - se `role == ACTIVE && has` e `!ups_data.valueEquals(name, value)` → `set`, e se `name` è `ups.load` → `updateRealPower()` dopo il ciclo;
           - se `cleared` → `remove(name)` quando la chiave c'è, poi `cleared=false`;
         - infine sincronizza le chiavi di `statusKeys(_nut_ctx.status)` con `valueEquals`/`set`/`remove`;
         - il commento "The table owns its variables: written last" diventa: la tabella ha l'ultima parola, ma scrive solo ciò che differisce da `UPSData`.
      4. Stringhe:
         - `collectStringRequests()` aggiunge `b.string_index` delle righe `Conv::StringId` con `string_index > 0`, `!has` e ruolo diverso da DEAD;
         - `parseStringDescriptor()`: dopo il codice di oggi, se una riga `StringId` ha `string_index == index`, assegna `decodeStringDescriptor(host, data, length)` alla riga con una funzione nuova `NutTable::onString(binds, i, text)` (OK: value, has, first OK, `resolve`), poi pubblica le righe toccate con lo stesso confronto del punto 3. Estrai la pubblicazione in un metodo privato `publishNutRows(UPSData&)` usato in entrambi i punti.
      5. `completeInitialPoll()` e il ramo di `finishInit` in `postDecode()` non cambiano.

      **Verifica:** tutte le suite dei driver e il replay verdi, salvo le asserzioni Eaton che TASK-08/09 aggiornano. Gli altri driver non hanno righe BOOL né percorsi superati, quindi le loro chiavi non cambiano.

      **Fatto:** nessuna riscrittura di righe con valore invariato; `writes()` invariato per i report senza righe legate.

      **Blocchi:** se un test non Eaton cambia valore, fermati e verifica. Non deve succedere, perché senza percorsi superati e senza righe BOOL l'unico effetto è il confronto prima della scrittura.

      ## File Coinvolti
      - lib/USBHostUPS/src/UsageMapIndex.h — elenco di percorsi da saltare
      - lib/USBHostUPS/src/GenericDriver.h — `supersededGenericPaths`, `publishNutRows`
      - lib/USBHostUPS/src/GenericDriver.cpp — `postDecode`, stringhe, `decodeReport`
      - lib/USBHostUPS/src/NutTable.h — `onString`

      ## Criteri di Completamento
      - [ ] `postDecode()` chiama `set()` solo quando `valueEquals` è falso
      - [ ] `pio test -e native -f test_apc_driver -f test_cyberpower_driver -f test_generic_driver -f test_legrand_driver -f test_liebert_driver -f test_ecoflow_driver -f test_rw_catalog` verde
    ref: TASK-05
