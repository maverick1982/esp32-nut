    title: 'QxEngine: visita delle tabelle, initInfo, updateInfo, scrittura di stato e allarmi'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** il motore fa il giro delle tabelle con le classi di poll di NUT e pubblica lo stato in `UPSData` come `upsdrv_updateinfo()`.

      **Leggere:** `nut_repo/drivers/nutdrv_qx.c:3525-3680` (`upsdrv_updateinfo`, `upsdrv_initinfo`), `:4489-4700` (`qx_ups_walk` fino alla stima della batteria esclusa), `:4786-4838`, sezioni "Visita delle tabelle", "initInfo() e updateInfo()" e "Bit di stato -> flag di UPSData" del piano, `lib/USBHostUPS/src/UPSData.h:220-235`.

      **Modificare (`QxEngine.cpp`):**
      1. `walk(mode)` privato con le tre modalità, il riuso di `previous_item`, le regole di errore e `QX_FLAG_SKIP` in INIT, esattamente come nel piano e in `qx_ups_walk()`. Lasciare due punti di aggancio vuoti per la stima della batteria (azzeramento all'inizio del FULL, `qx_battery()` alla fine) che TASK-07 riempie.
      2. `claim(UPSData&)`: lega i dati e chiama `sub.claim(*this)` (false se `claim` è nullo). `initUps()`: `sub.initups(*this)` se c'è.
      3. `initInfo(data, nowMs)`: `setinfo("driver.version.data", sub.name)`, `walk(INIT)`, punto di aggancio per `qx_initbattery()`, `sub.initinfo`, `_lastPollMs = nowMs`; commento con le parti di NUT non portate.
      4. `updateInfo(data, nowMs)`: scelta FULL/QUICK con `(uint32_t)(nowMs - _lastPollMs) > DEFAULT_POLLFREQ_S * 1000UL || _dataChanged`; FULL azzera `_status` e gli allarmi; retry / `Failed` / `Stale` / `reestablished` come nel piano; su successo FULL applica `data.applyAlarmVariables(allarmi)`; poi `commitStatus()`.
      5. `commitStatus()`: i 12 bit nelle chiavi della tabella del piano, valore `1`/`0`, scritti solo se diversi dal valore attuale.
      6. `noteDataChanged()`, `reestablished()`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_engine`.

      **Fatto quando:** compila e i test di TASK-04 restano verdi; i test della visita arrivano con TASK-06.

      **Blocchi:** se `applyAlarmVariables` non basta a riprodurre l'ordine di `ups_alarm_set()`, fermarsi e segnalarlo invece di duplicare la logica degli allarmi.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxEngine.cpp — walk, claim, initUps, initInfo, updateInfo, commitStatus
      - lib/USBHostUPS/src/QxEngine.h — eventuali membri privati aggiunti

      ## Criteri di Completamento
      - [ ] INIT/QUICK/FULL filtrano le righe come `qx_ups_walk()`
      - [ ] Un solo comando per gruppo di righe consecutive con lo stesso comando
      - [ ] `Stale` solo dal quinto fallimento consecutivo; dati non toccati sui fallimenti
      - [ ] Allarmi azzerati e applicati solo nel FULL; stato scritto solo su visita riuscita
    ref: TASK-05
