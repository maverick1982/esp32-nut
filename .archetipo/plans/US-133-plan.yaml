      - TASK-06
      - TASK-10
    body: |-
      ## Descrizione
      **Obiettivo:** il codice nuovo non rompe nulla e compila anche per le schede.

      **Leggere:** `platformio.ini` (env), memoria del progetto sui comandi di build (le build ESP32 vanno lanciate da PowerShell).

      **Modificare:** niente codice, salvo correzioni di compilazione emerse dalle build ESP32 (per esempio avvisi `-Wformat-nonliteral` sui `dfl`: silenziarli localmente con un commento, non disattivarli globalmente).
      1. Bash: `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native`.
      2. PowerShell: `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`, poi `-e esp32-p4-eth` e `-e esp32-p4-eth-v1`.
      3. Annotare nel resoconto il numero di test nativi e la flash dell'S3 (attesa invariata: il motore non è ancora referenziato dall'host, il linker lo scarta; la misura vera è di US-136).

      **Verifica:** i comandi sopra.

      **Fatto quando:** tutti i test nativi passano (i vecchi senza modifiche alle asserzioni, salvo i casi aggiunti in `test_ups_status`) e le tre build riescono.

      **Blocchi:** un test esistente che fallisce va capito, non adattato.

