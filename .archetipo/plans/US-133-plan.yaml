    body: |-
      ## Descrizione
      **Obiettivo:** la semantica di `process()`/`infovalSet()` è fissata su una tabella sintetica, compresi i casi in cui NUT scarta la riga.

      **Leggere:** `lib/USBHostUPS/src/QxEngine.h`, `test/mocks/QxTestingTransport.h`, `test/test_driver_registry/test_main.cpp` (stile Unity), `nut_repo/drivers/nutdrv_qx.c:4869-5072`.

      **Modificare:** creare `test/test_qx_engine/test_main.cpp` con una tabella sintetica `static const QxItem` (comando `X1\r`, risposta di riferimento `(123.4 05 ABC  #\r`, righe numeriche `%.1f`/`%.0f`, una stringa `%s` con `QX_FLAG_TRIM`, una riga `to = 0`, una riga `QX_FLAG_NONUT`, una riga `ups.status` con un preprocess di test che restituisce `OL`/`!OL`, una riga `ups.alarm`) e un `QxSubdriver` con `rejected = "NAK\r"`. Casi:
      1. Risposta valida: valori formattati con `dfl` in `UPSData`, trim, `to = 0` fino a `\r`.
      2. Risposta corta (meno di `answer_len`): `process()` -1, nessuna chiave scritta.
      3. Carattere iniziale sbagliato: -1, nessuna chiave scritta.
      4. Risposta `NAK\r` (anche in minuscolo): -1.
      5. Valore non numerico per `dfl` `%.1f`: `infovalSet` -1, chiave non scritta.
      6. Preprocess che fallisce: -1, chiave non scritta.
      7. `NONUT`: ritorna 1, nessuna chiave.
      8. Trasporto in errore (`failNext`): -1.
      9. `updateStatus("OL")` poi `updateStatus("!OL")` e `"ol"`: bit come in `update_status()`; valore sconosciuto ignorato.
      10. `findNutInfo` con `flag`/`noflag` e nome inesistente (-1).
      11. `setinfo` con lo stesso valore non aumenta `UPSData::writes()`.

