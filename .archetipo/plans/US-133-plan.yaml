  - id: TASK-09
    title: 'Protocolli megatec e q1: tabelle qx2nut costanti e subdriver'
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
      - TASK-08
    body: |-
      ## Descrizione
      **Obiettivo:** `megatec` e `q1` sono le tabelle di NUT riga per riga, con i loro nomi, versioni, claim e initups.

      **Leggere:** `nut_repo/drivers/nutdrv_qx_megatec.c:28-173`, `nut_repo/drivers/nutdrv_qx_q1.c:30-123`, `nut_repo/drivers/nutdrv_qx.h:43-47` (`DEFAULT_ONDELAY` 180, `DEFAULT_OFFDELAY` 30), sezione "Tabelle costanti, stato nell'istanza" del piano.

      **Modificare:**
      1. Creare `lib/USBHostUPS/src/QxProtocols.h` con `extern const QxSubdriver QX_MEGATEC;` e `extern const QxSubdriver QX_Q1;` e un commento: i protocolli successivi (US-134, US-138) si aggiungono qui, uno per file.
      2. Creare `lib/USBHostUPS/src/QxMegatec.cpp`: `static const QxItem MEGATEC_QX2NUT[]` con tutte le righe di `megatec_qx2nut[]` nello stesso ordine e con gli stessi commenti (inclusi gli esempi di risposta e le note su `I\r` e `ups.firmware`), colonne senza `answer`/`value`; funzioni: `blazerProcessStatusBits`, `qxMultiplyBattvolt`, `blazerProcessCommand`, `blazerProcessSetvar`; range `BLAZER_R_ONDELAY`/`OFFDELAY`; `dfl` `"180"`/`"30"` per le righe `ups.delay.*`; riga terminale nulla. `megatec_initups` -> `blazerInitups`. `QX_MEGATEC = { "Megatec 0.10", blazerClaim, MEGATEC_QX2NUT, megatecInitups, nullptr, "ACK", nullptr }`. Riferimento al file e alle righe di NUT in testa.
      3. Creare `lib/USBHostUPS/src/QxQ1.cpp` allo stesso modo da `q1_qx2nut[]`: `QX_Q1 = { "Q1 0.08", blazerClaimLight, Q1_QX2NUT, q1Initups (-> blazerInitupsLight), nullptr, "ACK", nullptr }`.
      4. Aggiungere i due `.cpp` al `build_src_filter` nativo.

      Non copiare le tabelle `testing_t` nel firmware: stanno nel test (TASK-10).

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_engine`; confronto visivo riga per riga con i file di NUT (stesso numero di righe: megatec 36 righe dati, q1 27, più la riga terminale).

      **Fatto quando:** le due tabelle compilano come `static const` e corrispondono riga per riga a NUT.

      **Blocchi:** se il conteggio delle righe non coincide con NUT, ricontare prima di andare avanti.

