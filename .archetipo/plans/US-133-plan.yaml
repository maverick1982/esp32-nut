  - id: TASK-10
    title: 'Test nativi test_qx_protocols: testing_t di megatec e q1, stati, batteria, blazer-common e risposte non valide'
    type: Test
    status: DONE
    dependencies:
      - TASK-09
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** rigiocando le tabelle `testing_t` di NUT, i valori in `UPSData` e `ups.status` sono quelli di NUT; i casi non validi non inventano valori.

      **Leggere:** `nut_repo/drivers/nutdrv_qx_megatec.c:118-133`, `nut_repo/drivers/nutdrv_qx_q1.c:93-106`, `test/mocks/QxTestingTransport.h`, `lib/USBHostUPS/src/QxProtocols.h`, `QxBlazerCommon.h`, `QxEngine.h`, sezione "Strategia di test" del piano.

      **Modificare:** creare `test/test_qx_protocols/test_main.cpp`; copiare `megatec_testing[]` e `q1_testing[]` riga per riga con citazione. Sequenza NUT: `claim(data)` -> `initUps()` -> `initInfo(data, 0)` -> `updateInfo(data, 2000)`. Valori attesi (dalle posizioni di NUT):
      1. **megatec:** claim vero; `input.voltage` `215.0`, `input.voltage.fault` `195.0`, `output.voltage` `230.0`, `ups.load` `14`, `input.frequency` `49.0`, `battery.voltage` `22.7` (passa da `qxMultiplyBattvolt` invariato), `ups.temperature` `30.0`, `ups.type` `online`, `ups.beeper.status` `disabled`, `input.voltage.nominal` `230`, `input.current.nominal` `0.0`, `battery.voltage.nominal` `24.0`, `input.frequency.nominal` `50`, `device.mfr` `NOT_A_L`, `ups.serial` `IVE_UPS ` (spazio finale, nessun trim), `device.model` `TESTI`, `battery.runtime` `NG` (formato `%s`, comportamento di NUT), `ups.firmware` `TESTING`, `ups.delay.start` `180`, `ups.delay.shutdown` `30`, `driver.version.data` `Megatec 0.10`; stima: `battery.voltage.low` `20.80`, `battery.voltage.high` `26.00`, `battery.charge` `37`; `ups.status` = `OL`, nessun `ups.alarm`. Commento accanto a ogni gruppo con la stringa e le posizioni.
      2. **q1:** claim (light) vero; stessi valori di `Q1`; nessuna variabile da `F`/`I`; nessuna `battery.charge` (manca il nominale); `driver.version.data` `Q1 0.08`; `ups.status` `OL`.
      3. **Stati** (risposta `Q1` sostituita con `override`, poi `updateInfo` FULL): bit `10000000` -> `OB`; `11000000` -> `OB LB`; `00100000` con 215/230 -> `OL BOOST`; con 230/230 -> `OL BYPASS`; con 240/220 -> `OL TRIM`; con output < metà dell'input -> visita fallita (`Failed`); `00000100` -> `CAL OL` (commento: in NUT `OL CAL`, differenza d'ordine nota); `00000010` -> `ALARM OL FSD` con `ups.alarm` `Shutdown imminent!`; `00010000` -> `ups.alarm` `UPS selftest failed!` e `ALARM OL`; `00000001` -> `ups.beeper.status` `enabled`; `00001000` -> `ups.type` `offline / line interactive` solo in INIT (riga STATIC).
      4. **Risposte non valide:** `Q1` corta -> claim falso e nessuna `input.voltage`; carattere iniziale `#` -> claim falso; bit di stato `x` -> `updateInfo` `Failed` e `ups.status.*` invariati; `I` assente (eco del comando) -> `blazerClaim` falso e `input.voltage` cancellata (`delinfo`); con `novendor` lo stesso claim è vero e le righe `I\r` hanno `QX_FLAG_SKIP` dopo `initUps()`; `ignoresab` -> la riga del bit 44 saltata.
      5. **blazer-common, stringhe di `testing_t`:** `blazerProcessCommand` con `ups.delay.shutdown` `180` e `ups.delay.start` `0` per `shutdown.return` -> `S03\r`; con `120`/`300` -> `S02R0005\r`; `shutdown.stayoff` con `30` -> `S.5R0000\r`; `test.battery.start` con valore `240` -> `T04\r`, con `30` -> -1, vuoto -> `T10\r`; con i valori predefiniti 30/180 `shutdown.return` -> `S.5R0003\r`.
      6. **`blazerProcessSetvar`:** `ups.delay.start` `250` -> `240`; `ups.delay.shutdown` `59` -> `54`, `125` -> `120`; `-1` e vuoto -> -1.
      7. **Guardia dei `dfl`:** per ogni riga delle due tabelle, `dfl` nullo, `%s`, un solo `%.Nf`, oppure (righe `ABSENT`) senza `%`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_protocols`.

      **Fatto quando:** tutti i casi passano; nessun valore atteso è stato adattato al codice senza ricontarlo sulla stringa di NUT.

      **Blocchi:** se un valore atteso non torna, ricontare le posizioni sulla stringa di `testing_t`; se il conto è giusto il difetto è nel motore o nella tabella.

      ## File Coinvolti
      - test/test_qx_protocols/test_main.cpp — nuovo: replay di testing_t, stati, batteria, blazer-common, casi non validi

      ## Criteri di Completamento
      - [ ] `megatec_testing[]` e `q1_testing[]` copiate riga per riga e rigiocate
      - [ ] Valori del punto 1 e 2 verificati uno per uno
      - [ ] Stati OL, OB, LB, BOOST, BYPASS, TRIM, CAL, FSD e allarmi verificati
      - [ ] Stringhe `S03`, `S02R0005`, `S.5R0000`, `T04` riprodotte da `blazerProcessCommand`
      - [ ] Casi non validi senza valori inventati
    ref: TASK-10
