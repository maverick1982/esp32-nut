    body: |-
      ## Descrizione
      **Obiettivo:** la visita e il ciclo `initInfo`/`updateInfo` sono fissati da test, con i valori predefiniti di NUT.

      **Leggere:** `test/test_qx_engine/test_main.cpp` (TASK-04), `lib/USBHostUPS/src/QxEngine.h`, sezioni "Visita delle tabelle" e "initInfo() e updateInfo()" del piano.

      **Modificare:** estendere `test/test_qx_engine/test_main.cpp` con una seconda tabella sintetica che abbia righe `STATIC`, `SEMI_STATIC`, `QUICK_POLL` (stato), normali, `ABSENT` con `dfl` e `CMD`, su due comandi diversi. Casi:
      1. `initInfo`: scrive `driver.version.data`; riga `ABSENT` col `dfl` solo se la chiave manca; righe già presenti in `UPSData` saltate (nessun comando mandato per loro); riga `CMD` senza I/O.
      2. Riuso: un giro manda un solo comando per gruppo (controllo su `transport.sent`).
      3. Riga non QUICK fallita in INIT -> mai più richiesta nei giri successivi (`QX_FLAG_SKIP`).
      4. `updateInfo` subito dopo `initInfo` è QUICK (solo righe QUICK_POLL); a +30 000 ms ancora QUICK; a +30 001 ms FULL; STATIC mai nel FULL; SEMI_STATIC solo dopo `noteDataChanged()`, che forza anche il FULL.
