  # US-133: Motore Q*: tabelle qx2nut, blazer-common e protocolli megatec e q1 con i test di NUT — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-07

  ---

  ## Spec

  **Epic:** EP-007 — Supporto UPS Q* (nutdrv_qx)
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come sviluppatore che porta `nutdrv_qx` (ADR 0013, sezione 4), voglio il motore che esegue le tabelle `qx2nut` come `nutdrv_qx.c`, con `blazer-common` e i protocolli `megatec` e `q1` copiati riga per riga, in modo che i valori ricavati dalle risposte di un UPS Q* siano quelli che darebbe NUT, e che i protocolli successivi costino solo una tabella.

  **Criteri di Accettazione**
  - Tabelle `static const`, copia riga per riga dei `qx2nut` di NUT; i valori letti stanno nell'istanza, indicizzati per riga.
  - Il motore porta `qx_process()`, `ups_infoval_set()` e la visita delle tabelle con le classi di poll di NUT e i valori predefiniti di NUT.
  - Risposta troppo corta, carattere iniziale sbagliato o preprocess fallito: riga scartata come in NUT, senza valori inventati.
  - `blazer-common` portato una volta sola e condiviso; i bit di stato finiscono nei flag `ups.status.*`, così `UPSData::computeUPSStatusString()` dà lo stesso `ups.status` di upsd.
  - Protocolli `megatec` e `q1` con i nomi e le chiavi di NUT.
  - Test nativi da `testing_t` per entrambi i protocolli, più i casi di risposta non valida.

  ---

  ## Soluzione tecnica

  Tutto è logica pura nel modulo `ups-protocol` (`lib/USBHostUPS/src`), compilata anche in nativo. Nessun file USB, nessun cambiamento all'host: il motore viene creato dall'host solo con US-136; il riconoscimento per tentativi (`subdriver_matcher()`) è US-134; `instcmd()`/`setvar()` e l'elenco dei comandi sono US-135. In questa storia ogni file nuovo è raggiungibile solo dai test, quindi sulle immagini ESP32 il linker lo scarta: la misura della flash vera si fa con US-136.

  ### File nuovi

  | File | Contenuto | Origine NUT |
  |---|---|---|
  | `QxTypes.h` | flag `QX_FLAG_*`, `MAXTRIES`, bit di stato, `QxInfoRw`, `QxItem`, `QxSubdriver`, `QxOptions`, `QX_SMALLBUF` | `nutdrv_qx.h` |
  | `IQxTransport.h` | un comando, una risposta: `int command(const char* cmd, size_t cmdlen, char* buf, size_t buflen)`, -1 su errore, altrimenti i byte letti | firma dei `*_command()` / `qx_command()` |
  | `QxEngine.h/.cpp` | motore: `find_nut_info`, `qx_process`, `qx_process_answer`, `ups_infoval_set`, `update_status`, `qx_ups_walk`, `upsdrv_initinfo`/`upsdrv_updateinfo` (parte dati), `ups_status_set`/`ups_alarm_set`, stima della batteria, `qx_multiply_*` | `nutdrv_qx.c` |
  | `QxBlazerCommon.h/.cpp` | `blazer_r_ondelay/offdelay`, `blazer_claim`, `blazer_claim_light`, `blazer_initups(_light)`, `blazer_process_setvar`, `blazer_process_command`, `blazer_process_status_bits` | `nutdrv_qx_blazer-common.c` |
  | `QxProtocols.h`, `QxMegatec.cpp`, `QxQ1.cpp` | `extern const QxSubdriver QX_MEGATEC, QX_Q1;` con le tabelle | `nutdrv_qx_megatec.c`, `nutdrv_qx_q1.c` |
  | `test/mocks/QxTestingTransport.h` | trasporto finto che porta il ramo `TESTING` di `qx_command()` | `nutdrv_qx.c:4240-4285` |

  I nomi seguono i file esistenti (cartella piatta, prefisso `Qx`). Commenti in inglese come il resto di `lib/USBHostUPS`, con citazione delle righe di NUT quando il comportamento non è ovvio.

  ### Tabelle costanti, stato nell'istanza

  ```cpp
  struct QxInfoRw { const char* value; int (*preprocess)(char* value, size_t len); };
  class QxEngine;
  struct QxItem {
      const char* info_type; int info_flags; const QxInfoRw* info_rw; const char* command;
      size_t answer_len; char leading; int from; int to; const char* dfl; uint32_t qxflags;
      int (*preprocess_command)(QxEngine& qx, const QxItem& item, char* command, size_t commandlen);
      int (*preprocess_answer)(QxEngine& qx, const QxItem& item, int len);
      int (*preprocess)(QxEngine& qx, const QxItem& item, char* value, size_t valuelen);
  };
  struct QxSubdriver {
      const char* name;                    // MEGATEC_VERSION = `Megatec 0.10`, Q1_VERSION = `Q1 0.08`
      bool (*claim)(QxEngine& qx);
      const QxItem* qx2nut;                // terminata da una riga con info_type nullptr, come in NUT
      void (*initups)(QxEngine& qx);
      void (*initinfo)(QxEngine& qx);      // nullptr per megatec e q1
      const char* accepted;                // ACK
      const char* rejected;                // nullptr
  };
  struct QxOptions { bool novendor = false; bool norating = false; bool ignoresab = false; };
  ```

  - **Riga per riga:** le righe hanno le colonne di `item_t` nello stesso ordine, **senza** le due colonne di runtime `answer` e `value` (in NUT sempre `""` nelle tabelle). Un commento in testa a ogni tabella lo dice, così un diff con il file di NUT resta leggibile. `makevartable` non si porta (le opzioni arrivano da `QxOptions`, US-138).
  - **Stato per riga:** `std::vector<uint32_t> _flags`, copia dei `qxflags` della tabella fatta nel costruttore. Tutta la logica legge e scrive `_flags[row]` (in NUT `item->qxflags |= QX_FLAG_SKIP`, `QX_FLAG_MAPPING_HANDLED`; i protocolli voltronic tolgono anche `QX_FLAG_SKIP`), mai `item.qxflags`.
  - **`answer` e `value`:** in NUT `qx_ups_walk()` li azzera dopo ogni riga e nessuna funzione dei protocolli portati (né di quelli previsti da US-134/138) legge `answer`/`value` di un'altra riga. Si tiene quindi **una sola coppia di buffer di lavoro** nell'istanza (`_answer[QX_SMALLBUF]`, `_value[QX_SMALLBUF]`, la riga corrente), più `previous_item` (`command`, `answer`) e i buffer temporanei di `qx_process()` (comando e ricezione), tutti membri e non sullo stack del task di poll. `QX_SMALLBUF = 512` come `SMALLBUF` di NUT (`include/common.h:780`), per avere gli stessi troncamenti. Circa 2,5 KB per istanza, allocati solo quando c'è un UPS Q*. Un protocollo futuro che legga il `value` di un'altra riga (per esempio `voltronic`, `nutdrv_qx_voltronic.c:2692`) richiederà buffer per riga: lo dice un commento.
  - `IUpsControl` può girare dopo la cancellazione del driver (US-105): le tabelle e le funzioni dei protocolli sono dati statici, nessuna di esse tiene puntatori all'istanza.

  ### API del motore

  ```cpp
  class QxEngine {
  public:
      static const uint32_t DEFAULT_POLLFREQ_S = 30;    // DEFAULT_POLLFREQ, nutdrv_qx.h
      static const uint32_t DEFAULT_POLLINTERVAL_S = 2; // poll_interval, main.c:102 (cadenza dell'host, US-136)
      enum class Update : uint8_t { Ok, Failed, Stale };

      QxEngine(const QxSubdriver& sub, IQxTransport& transport, const QxOptions& opt = QxOptions());

      // Fasi di NUT, nell'ordine in cui le usa l'host: claim -> initUps -> initInfo -> updateInfo...
      bool claim(UPSData& data);                        // sub.claim (US-134 la chiama per tentativi)
      void initUps();                                   // sub.initups, fine di upsdrv_initups()
      bool initInfo(UPSData& data, uint32_t nowMs);     // false = fatalx di upsdrv_initinfo()
      Update updateInfo(UPSData& data, uint32_t nowMs); // upsdrv_updateinfo()
      void noteDataChanged();                           // data_has_changed = TRUE (US-135)
      bool reestablished() const;                       // ultimo Ok dopo retry > MAXTRIES (log in US-136)

      // Funzioni esportate da nutdrv_qx.h, per blazer-common e i protocolli
      int findNutInfo(const char* name, uint32_t flag, uint32_t noflag) const; // riga o -1
      int process(int row, const char* command = nullptr);                    // qx_process()
      int infovalSet(int row);                                                // ups_infoval_set()
      void updateStatus(const char* nutvalue);                                // update_status()
      void alarmSet(const char* text);                                        // alarm_set()
      unsigned int status() const;                                            // qx_status()

      // Accesso per i preprocess (al posto di item->value, dstate_*, testvar)
      const QxSubdriver& subdriver() const; size_t rowCount() const; const QxItem& item(int row) const;
      uint32_t flags(int row) const; void addFlags(int row, uint32_t f); void clearFlags(int row, uint32_t f);
      const char* value() const; char* answer();
      const char* getinfo(const char* name) const; // nullptr se manca (dstate_getinfo)
      void setinfo(const char* name, const char* value); void delinfo(const char* name);
      const QxOptions& options() const;
  };
  ```

  `claim()`, `initInfo()` e `updateInfo()` legano `UPSData` per la durata della chiamata (puntatore membro azzerato all'uscita); `getinfo/setinfo/delinfo` fuori da una di queste chiamate non fanno nulla. Il lock dei dati resta all'host (US-136). `setinfo` scrive solo se il valore cambia (`valueEquals`), come il resto del codice (ADR 0007). Il confronto senza maiuscole è ASCII, come `equalsIgnoreCase()` di `DriverRegistry.cpp:111` (in un header comune o una copia locale `qxEqualsIgnoreCase`).

  ### Elaborazione di una riga (`nutdrv_qx.c:4869-5072`)

  - `process(row, cmd)`: copia il comando (o `item.command`), chiama `preprocess_command` se c'è (-1 = errore), azzera il buffer di ricezione, `transport.command()`, `len < 0` = errore; copia in `_answer`; `preprocess_answer` se c'è (su errore azzera `_answer`); poi `qx_process_answer()`.
  - `qx_process_answer()`: risposta uguale a `rejected` (strcasecmp) = errore; `answer_len && len < answer_len` = risposta corta; `leading && _answer[0] != leading` = carattere sbagliato; `to && to < from` = errore; `_value` = `answer[from..to]`, oppure fino a `\r` quando `to == 0`; risposta vuota = `_value` vuoto. `errno` non si porta (in NUT serve solo ai messaggi di debug).
  - `infovalSet(row)`: con `preprocess`: errore -> -1; `ups.status*` -> `updateStatus(value)` se non vuoto, ritorna 0; `ups.alarm*` -> `alarmSet(value)` se non vuoto, ritorna 0. Senza: copia `_value`, `QX_FLAG_TRIM` toglie `#` e spazi ai due lati (`str_trim_m(value, "# ")`), se `dfl` non è `%s` il valore deve contenere solo `0123456789 .` e viene riformattato con `dfl` su `strtod()`. `QX_FLAG_NONUT` -> 1 senza scrivere; valore vuoto -> -1; altrimenti `addFlags(QX_FLAG_MAPPING_HANDLED)`, `setinfo()`, e `battery.charge`/`battery.runtime` aggiornano lo stato della stima batteria; ritorna 1.
  - Il `dfl` è un formato preso dalla tabella costante: `snprintf(value, size, dfl, strtod(...))`. Un test controlla che ogni `dfl` delle tabelle portate sia `%s`, un solo `%.Nf`/`%f`, oppure (righe `QX_FLAG_ABSENT`) un valore predefinito senza `%`.

  ### Visita delle tabelle (`qx_ups_walk()`, `nutdrv_qx.c:4489-4783`)

  Porting fedele delle tre modalità:
  - **INIT:** righe `QX_FLAG_ABSENT` -> se la variabile manca la si scrive con `dfl` (le range/enum di `qx_set_var()` sono US-135) e si passa oltre; righe `ups.status`/`ups.alarm` sempre; le altre solo se la variabile non esiste ancora (quelle già lette dal claim si saltano).
  - **QUICK:** solo `QX_FLAG_QUICK_POLL`.
  - **FULL:** salta `ABSENT | CMD | SETVAR | STATIC`; `SEMI_STATIC` solo se `data_has_changed`.
  - Righe `CMD` e `SETVAR`: nessun I/O (l'elenco comandi è US-135; il ramo `SETVAR | NONUT` con `setvar(NULL)` non serve ai protocolli portati: commento e niente codice).
  - **Riuso della risposta:** se la riga precedente aveva lo stesso comando (strcasecmp) e una risposta non vuota, si riusa `previous_item.answer` senza mandare il comando. Una risposta `Q1\r` vale per tutte le sue righe: un solo comando per giro.
  - **Errori:** `process()` fallito -> si azzerano i buffer; riga `QUICK_POLL` -> la visita ritorna false; in INIT la riga prende `QX_FLAG_SKIP` per sempre; altrimenti si continua. `infovalSet() == -1` -> `QUICK_POLL` ritorna false, altrimenti si continua.
  - In FULL la visita azzera prima la stima della batteria e alla fine chiama `qx_battery()` (ramo senza `runtimecal`).

  ### `initInfo()` e `updateInfo()` (`nutdrv_qx.c:3525-3680`)

  - `initInfo`: `setinfo(driver.version.data, sub.name)`, visita INIT (false -> ritorna false), `qx_initbattery()`, `sub.initinfo` se c'è, `lastpoll = now`. Le parti che dipendono da `ups.conf` (`ondelay`, `offdelay`, `pollfreq`, `runtimecal`, `battery_voltage_reports_one_pack`) e l'aggiunta di `load.off`/`load.on` (US-135) non si portano: un commento le elenca. `driver.name` e `driver.parameter.*` restano all'host (US-136).
  - `updateInfo`: FULL se `(now - lastpoll) > pollfreq * 1000` (ms, sicuro rispetto al giro di `millis()`; NUT confronta secondi interi con `>`) oppure `data_has_changed`; FULL azzera `ups_status` e il buffer degli allarmi; QUICK no (un bit come `TRIM` resta fino al FULL successivo, come in NUT). Su visita fallita: `retry <= MAXTRIES` -> `retry++`, `Update::Failed`; altrimenti `Update::Stale` (cioè dal quinto fallimento consecutivo, come `dstate_datastale()`), senza toccare i dati. Su visita riuscita: FULL -> `lastpoll = now`, `data_has_changed = false`, allarmi applicati; poi stato scritto in `UPSData`; `reestablished` vero se `retry > MAXTRIES`; `retry = 0`; `Update::Ok`.

  ### Bit di stato -> flag di `UPSData`

  `ups_status_set()` diventa la scrittura dei 12 bit nei flag che `computeUPSStatusString()` già legge, sempre `1` o `0` e solo quando cambiano:

  | Bit Q* | Chiave | Token |
  |---|---|---|
  | OL | `ups.status.ac_present` | OL, altrimenti OB |
  | LB | `ups.status.battery_low` | LB |
  | RB | `ups.status.replace_battery` | RB + allarme `Replace battery!` |
  | CHRG | `ups.status.charging` | CHRG (vedi nota) |
  | DISCHRG | `ups.status.discharging` | DISCHRG |
  | BYPASS | `ups.status.bypass` (**nuova**) | BYPASS, senza allarme |
  | CALIB | `ups.status.cal` | CAL |
  | OFF | `ups.status.off` | OFF |
  | OVER | `ups.status.overload` | OVER |
  | TRIM | `ups.status.trim` | TRIM |
  | BOOST | `ups.status.boost` | BOOST |
  | FSD | `ups.status.fsd` (**nuova**) | FSD + allarme `Shutdown imminent!` |

  - **Due chiavi nuove in `UPSData`:** i flag HID più vicini hanno un'altra semantica. `bypassauto`/`bypassman` aggiungono l'allarme `Automatic/Manual bypass mode!`, che `ups_alarm_set()` di nutdrv_qx non ha; `shutdown_imminent` dà LB e mai FSD (issue #65), mentre nutdrv_qx scrive il token `FSD` (`nutdrv_qx.c:4835`). Quindi `computeUPSStatusString()` aggiunge `ups.status.bypass` alla condizione di BYPASS e `FSD ` in coda dopo OFF; `alarmText()` aggiunge `{ ups.status.fsd, Shutdown imminent! }` subito dopo `shutdown_imminent`. Nessuna tabella HID scrive queste chiavi (da verificare con grep): per gli HID nulla cambia.
  - **Allarmi:** come in NUT si azzerano e si applicano solo nel FULL: `alarmSet()` accumula i testi del protocollo (es. `UPS selftest failed!` del bit 41) separati da spazio, poi `data.applyAlarmVariables(vendor)`; RB e FSD li aggiunge `alarmText()` nello stesso ordine di `ups_alarm_set()`. Il prefisso `ALARM` di `ups.status` segue.
  - **Differenze note, scritte nei commenti e nei test:** (1) `CAL`: nutdrv_qx lo scrive dopo `OFF`, la funzione comune (ordine di usbhid-ups) lo mette per primo: stesso insieme di token, ordine diverso solo con CAL; (2) `CHRG`: nutdrv_qx lo scrive senza condizioni, `computeUPSStatusString()` lo qualifica con `fully_charged`/`battery.charge`; nessun protocollo di questa storia (né di US-134/138) imposta CHRG, si sistemerà con il primo protocollo che lo fa.

  ### Stima della batteria (`nutdrv_qx.c:446-680`, `4694-4781`)

  `megatec` non dà `battery.charge`: NUT la stima dalla tensione e la pubblica. Si porta `qx_initbattery()` e `qx_battery()` senza i rami delle opzioni di `ups.conf` (`runtimecal`, `battery_voltage_reports_one_pack`; `battery.packs` letto da `UPSData` se c'è, come `dstate_getinfo`): se mancano `battery.voltage.low/high` ma c'è `battery.voltage.nominal`, `low = 104*nom/120`, `high = 130*nom/120` pubblicati con `%.2f`; autodetect dei pacchi con l'elenco `{120, 100, …, 0.5}`; `battery.charge` = `100*(act-low)/(high-low)` limitata a 0..100, `%.0f`. Le righe `LOG_INFO` di NUT diventano commenti (i log del driver arrivano con US-136). `qx_multiply_battvolt`, `qx_multiply_x1000`, `qx_multiply_m2s` sono funzioni pubbliche del motore con la firma dei preprocess.

  ### blazer-common (`nutdrv_qx_blazer-common.c`)

  Portato tutto, una volta, perché le righe delle tabelle puntano alle sue funzioni: range `blazer_r_ondelay` (0..599940) e `blazer_r_offdelay` (12..600); `blazer_claim` (stato con `input.voltage`, poi `ups.firmware` salvo `novendor`, con `delinfo(input.voltage)` sui fallimenti); `blazer_claim_light`; `blazer_initups`/`_light` (`norating`, `novendor`, `ignoresab` da `QxOptions` -> `addFlags(QX_FLAG_SKIP)`); `blazer_process_setvar` (troncamento al minuto, o a 6 s sotto i 60 s); `blazer_process_command` (`shutdown.return`, `shutdown.stayoff`, `test.battery.start`, letture di `ups.delay.*` con `getinfo`, formato del comando di riga: `%s` con `snprintf`, `%d`/`%02d` con un `int`, comando senza conversioni copiato così com'è); `blazer_process_status_bits` (bit 38-45, soglie 0.5/0.95/1.05/1.5 su `output.voltage`/`input.voltage`; una `getinfo` mancante vale `0`, dove NUT andrebbe in crash con `strtod(NULL)`). L'uso di claim nel riconoscimento è US-134, quello dei comandi e del setvar in `instcmd()`/`setvar()` è US-135.

  ### Build nativa

  `platformio.ini`, `[env:native]`, `build_src_filter`: aggiungere `QxEngine.cpp`, `QxBlazerCommon.cpp`, `QxMegatec.cpp`, `QxQ1.cpp`. Le immagini ESP32 compilano la libreria intera: le tre build devono restare verdi.

  ---

  ## Strategia di test

  Solo test nativi Unity (nessuna UI, nessun e2e: la storia non tocca Web UI, server NUT né host USB).

  - **`test/mocks/QxTestingTransport.h`:** porta il ramo `TESTING` di `qx_command()` (`nutdrv_qx.c:4240-4285`): cerca il comando nella tabella `testing_t` senza maiuscole; trovato -> la risposta (con `answer_len` per le risposte con `\0` interni); non trovato -> la stringa `rejected` del protocollo, altrimenti l'eco del comando. In più registra i comandi ricevuti e può essere messo in errore (-1) o caricato con risposte di sostituzione per i casi non validi.
  - **`test/test_qx_engine`:** tabella sintetica nel test (pochi `QxItem` scritti a mano, un protocollo finto con `rejected`) per la semantica del motore: risposta corta, carattere iniziale sbagliato, `to < from`, risposta uguale a `rejected`, preprocess fallito, valore non numerico, trim, `to == 0`, `NONUT`; classi di poll (STATIC solo in INIT, SEMI_STATIC solo dopo `noteDataChanged()`, QUICK a ogni chiamata, FULL dopo più di 30 s); riuso di `previous_item` (un solo comando per giro); `QX_FLAG_SKIP` in INIT per righe non QUICK; QUICK fallita -> `Failed` senza scrivere; `Stale` al quinto fallimento consecutivo, `reestablished()` al ritorno; persistenza di un bit fino al FULL; allarmi applicati solo nel FULL.
  - **`test/test_qx_protocols`:** le tabelle `testing_t` di `nutdrv_qx_megatec.c:118-133` e `nutdrv_qx_q1.c:93-106` copiate riga per riga nel test, rigiocate in sequenza claim -> initUps -> initInfo -> updateInfo; valori attesi ricavati dalle posizioni `from`/`to` di NUT (sono nel task); stati OL, OB, OB LB, TRIM, BYPASS, BOOST, CAL, FSD con allarme, `ups.alarm`; stima della batteria; stringhe di `blazer_process_command` che riproducono i comandi di `testing_t` (`S03`, `S02R0005`, `S.5R0000`, `T04`); troncamenti di `blazer_process_setvar`; claim fallito con risposte non valide; `novendor`/`ignoresab`; controllo dei `dfl`.
  - **`test/test_ups_status`:** casi nuovi per `ups.status.bypass` e `ups.status.fsd`; i casi esistenti invariati.
  - **Regressione:** suite nativa completa e le tre build ESP32 (`esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`).

  ### Demo

  La `Dimostrazione` della storia è l'esecuzione dei test nativi: nessun video da registrare in review.

  ---

  ## Note e assunzioni

  - Le due chiavi nuove `ups.status.bypass` e `ups.status.fsd` sono l'unico cambiamento fuori dai file Q*; motivo nella sezione dei bit di stato.
  - `answer`/`value` in una sola coppia di buffer di lavoro invece che per riga: lettura del criterio sull'istanza giustificata dalla RAM (circa 2,5 KB contro circa 35 KB per protocollo) e dal fatto che NUT li azzera dopo ogni riga; i flag di runtime sono invece per riga.
  - Le opzioni di `ups.conf` non portate (`pollfreq`, `ondelay`, `offdelay`, `runtimecal`, `battery_voltage_reports_one_pack`, `norating`, `ignoresab` come impostazioni) restano ai valori predefiniti di NUT; `novendor` diventa un'impostazione con US-138.
tasks:
  - id: TASK-01
    title: Tipi Q* (QxTypes.h), IQxTransport e trasporto finto QxTestingTransport
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** esistono i tipi che descrivono una tabella `qx2nut` costante, l'interfaccia di trasporto un comando / una risposta e il trasporto finto che i test di US-133, US-134 e US-135 useranno.

      **Leggere:** `nut_repo/drivers/nutdrv_qx.h` (tutto: `item_t`, `subdriver_t`, flag, `MAXTRIES`, `status_bit_t`, `testing_t`), `nut_repo/drivers/nutdrv_qx.c:4240-4285` (ramo `TESTING` di `qx_command()`), sezioni "Tabelle costanti, stato nell'istanza" e "Strategia di test" del piano, `test/mocks/Arduino.h`.

      **Modificare:**
