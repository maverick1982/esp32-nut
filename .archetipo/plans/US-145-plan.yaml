  ---
  # US-145: Server NTP annunciato dal DHCP (option 42), con ritorno al server configurato — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-22

  ---

  ## Storia

  **Epic:** EP-002 — Connettività di Rete e Configurazione
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come utente che ha in rete un server NTP locale annunciato dal router,
  voglio che la scheda possa usare il server NTP ricevuto dal DHCP,
  in modo da avere l'ora anche su una LAN senza Internet, senza scrivere a mano l'indirizzo del server su ogni scheda (#135).

  **Criteri di Accettazione**
  Vedi la storia US-145 nel backlog (interruttore, salvataggio, lease con option 42, NoAnswer e ripiego, nessun server dal DHCP, rinnovi del lease, server in uso in pagina/API/log, Wi-Fi ed Ethernet senza `#if`, test e build, fuori ambito).

  ---

  ## Soluzione tecnica

  Il server del lease viene catturato con un wrap del linker su `dhcp_set_ntp_servers`, la funzione con cui il DHCP di lwIP passa l'option 42 all'SNTP. Così lwIP non tocca mai i server dell'SNTP, e la scelta tra server del DHCP e server configurato passa tutta per una politica pura con test nativi. `NtpClock` resta l'unico codice che chiama `esp_sntp_*`.

  - **Fattibilità verificata (2026-11-22).** In `liblwip.a` precompilata di esp32s3, esp32p4 ed esp32p4_es il simbolo `dhcp_set_ntp_servers` è definito in `sntp.c.obj` e solo referenziato (`U`) da `dhcp.c.obj`: `-Wl,--wrap=dhcp_set_ntp_servers` intercetta la chiamata. Il progetto usa già lo stesso meccanismo per `esp_core_dump_write` (ADR 0008). I sdkconfig del core hanno `CONFIG_LWIP_DHCP_GET_NTP_SRV 1`, `CONFIG_LWIP_DHCP_MAX_NTP_SERVERS 1` (dal lease arriva un solo server) e `CONFIG_LWIP_SNTP_MAX_SERVERS 3`. sdkconfig non si tocca.
  - **Perché non `esp_sntp_servermode_dhcp(true)`.** lwIP scriverebbe il server del DHCP all'indice 0, cancellerebbe gli altri e lo farebbe a ogni rinnovo, in corsa con `apply()`. Inoltre lwIP non conserva l'option 42: un lease ricevuto prima dell'attivazione dell'opzione andrebbe perso fino al rinnovo successivo. Il wrap invece cattura sempre l'ultimo server, anche con l'opzione spenta, quindi accenderla a scheda avviata funziona subito. `esp_sntp_servermode_dhcp(false)` resta in `apply()` come difesa.
  - **Cattura (`src/network/dhcp_ntp_capture.{h,cpp}`).** `__wrap_dhcp_set_ntp_servers(u8_t num, const ip4_addr_t* servers)` gira nel task tcpip: salva `servers[0].addr` (0 se `num == 0` o `servers == nullptr`) in un `std::atomic<uint32_t>` statico e non chiama `__real_` (con servermode spento sarebbe un no-op). Nessun log in quel task. `DhcpNtpCapture::server()` legge il valore, `DhcpNtpCapture::clear()` lo azzera. lwIP chiama la funzione solo per un ACK che contiene l'option 42, prima di assegnare l'IP: quando `networkUp()` diventa vero, il lease è già noto. Un lease senza option 42 non la chiama: per questo `NtpClock` azzera la cattura alla caduta della rete. È un solo valore per tutta la scheda: funziona con Wi-Fi ed Ethernet senza `#if` (ADR 0010); in modalità AP la scheda fa da server DHCP e la cattura resta 0.
  - **Politica pura (`lib/TimeCore/src/NtpSource.h`).** `NtpSourcePolicy` con `reset(bool use_dhcp)` (avvio o nuove impostazioni: dimentica il server fallito, tiene il lease), `onLinkDown()` (lease perso: azzera server e fallito), `onDhcpServer(uint32_t addr)` (server del lease corrente, 0 = nessuno; restituisce true se cambia il server in uso), `onNoAnswer()` (true se passa dal server del DHCP a quello configurato; registra il server fallito), `origin()` (`NtpOrigin::Dhcp` solo se l'opzione è accesa, il server è diverso da 0 e non è quello fallito, altrimenti `Configured`), `state()` (`DhcpNtpState`: `Off`, `None`, `Used`, `NoAnswer`) e `dhcpServer()`. Un server del lease diverso da quello fallito azzera il fallito, quindi si riprova. Lo stesso server non cambia nulla. Nessun ritentativo a tempo. Nello stesso file: `formatIpv4()` (ordine di `ip4_addr_t.addr`: primo ottetto nel byte basso) e i nomi per l'API `ntpOriginName()` (`configured` / `dhcp`) e `dhcpNtpStateName()` (`off` / `none` / `used` / `no_answer`).
  - **Impostazioni.** `TimeSettings` ottiene `bool dhcp`, spento in `timeDefaults()`. Va nella chiave NVS `dhcp` del namespace `time` (`TimeSettingsStore`): una chiave mancante (impostazioni salvate prima) vale false. `sanitize()` non lo tocca. Con NTP spento il valore resta salvato ma non ha effetto.
  - **`NtpClock`.** `apply()` chiama `_source.reset(s.dhcp)`, non imposta più il server (lo fa l'avvio dell'SNTP) e, se l'opzione è accesa, aggiunge `, server from DHCP` alla riga "Settings changed". `poll()` segue la caduta della rete (`_was_up && !up` → `_source.onLinkDown()` e `DhcpNtpCapture::clear()`) e passa a ogni giro `DhcpNtpCapture::server()` a `_source.onDhcpServer()`. All'avvio dell'SNTP e a ogni cambio del server in uso (con l'SNTP già avviato), `startSntp(now)` ferma l'SNTP se gira, copia in `_server` il server in uso (IP del DHCP formattato o server configurato), chiama `esp_sntp_setservername(0, _server)` e `esp_sntp_init()`, poi `_policy.restart(now)`. lwIP tiene il puntatore: si cambia `_server` solo con l'SNTP fermo.
  - **Righe del System Log.**
    - `[TIME] Synchronized with <server> (from DHCP): …`, con il suffisso solo per il server del DHCP. Con l'opzione spenta la riga è identica a US-117.
    - Su NoAnswer con il server del DHCP: una sola riga WARN `[TIME] No answer from <dhcp> (from DHCP) for 60 s, using <configurato>`, poi `startSntp()` con il server configurato. Su NoAnswer con il server configurato resta la riga attuale `No answer from <server> for 60 s, retrying`.
    - All'avvio dell'SNTP con l'opzione accesa e nessun server dal DHCP: una riga INFO `[TIME] DHCP gave no NTP server, using <configurato>`.
    - Al cambio di server del lease: una riga INFO `[TIME] NTP server from DHCP: <ip>`.
    - Un rinnovo con lo stesso server non scrive nulla.
  - **Stato e API.** `NtpClock::Status` ottiene `origin`, `dhcp` (`DhcpNtpState`) e `dhcp_addr`. `TimeStatusView` ottiene `server` (in uso), `origin`, `dhcp`, `dhcp_server` (stringa vuota senza server). `handleGetTime()` formatta l'IP. Con stato diverso da `disabled`, `GET /api/time` aggiunge in `status`: `server`, `origin`, `dhcp`, più `dhcp_server` quando c'è. In `time` aggiunge `dhcp` (bool). `POST /api/time` accetta `time.dhcp` booleano. Un valore non booleano dà 400 `Invalid DHCP option`.
  - **Web UI (Board Settings → Time).** Sotto l'interruttore NTP c'è una nuova riga con l'interruttore `time-dhcp` **Use the NTP server from DHCP**, disabilitato quando `time-ntp` è spento. Hint: `Option 42 of the router. The server below is used when DHCP gives none or it does not answer.` Nel riquadro di stato c'è una riga `Server` (`time-source`) con `192.168.1.1 (from DHCP)` o `pool.ntp.org (configured)`, più una nota con `dhcp`: `none` → `DHCP gave no server`, `no_answer` → `DHCP server <ip> did not answer`. Con NTP spento mostra `—`. Il POST invia anche `dhcp`. È un campo in più in un form esistente, quindi niente mockup. `index_inlined.html` si rigenera con la build (`scripts/inline_web.py`) e va committato.
  - **Sicurezza.** Il server del DHCP non è autenticato, come quello configurato: l'ora serve solo da mostrare e per i log (ADR 0009), quindi un server falso non apre nulla. La riga di ADR 0009 su SNTP cita anche l'option 42.
  - **Router di prova.** Non si sa se il router dell'utente annunci l'option 42. La scheda stessa fa da sonda: con la build nuova, la pagina Time mostra `dhcp: none` oppure l'IP ricevuto. Se il router non la annuncia, la prova sul campo va fatta attivando l'option 42 nel router (se lo consente) o con dnsmasq su una rete di prova separata. Comunque solo dopo un sì esplicito.

  ---

  ## Strategia di test

  La logica di scelta sta tutta in codice puro con test nativi (Unity, `pio test -e native`). Il wrap e `NtpClock` si verificano con la build di tutte le schede e con la prova sul campo.

  - **`test_time_core`:**
    - default di `TimeSettings.dhcp` e `sanitize()` che lo lascia invariato;
    - `formatIpv4`;
    - `NtpSourcePolicy`: opzione spenta, lease con server, lease senza server, NoAnswer con ripiego, NoAnswer con server configurato (nessun cambio), rinnovo con lo stesso server, rinnovo con un server diverso, caduta della rete, `reset()` dopo un fallimento, accensione dell'opzione con un lease già noto;
    - nomi di `ntpOriginName` e `dhcpNtpStateName`.
  - **`test_web_api`:**
    - `timeJson` con `time.dhcp` e con i campi `server`, `origin`, `dhcp` e `dhcp_server` in `status`, assenti con stato `disabled`;
    - `checkTimeBody` con `dhcp` true/false, assente (resta il valore corrente) e non booleano (400 `Invalid DHCP option`).
  - **Regressione:** tutta la suite nativa resta verde e `e2e/time-settings.spec.ts` passa senza cambiare i test esistenti.
  - **Build:** `esp32-s3-standard`, `arduino-nano-esp32`, `esp32-p4-eth`, `esp32-p4-eth-v1` compilano e linkano con il wrap. Dimensione dell'immagine esp32-s3-standard prima e dopo, riportata nella PR (#93).
  - **Prova sul campo**, solo dopo un sì esplicito: la scheda di test con la build della storia, l'opzione accesa e il System Log letto.

  ### Test E2E — Simulazione utente

  **Framework:** Playwright (`e2e/`, API simulate con `page.route`, `serveIndex` di `e2e/support/webui.ts`)
  **Video demo:** previsto (registrato poi da `archetipo-review`, non durante l'implementazione)

  | Scenario | Flusso utente |
  |---|---|
  | Accende l'opzione e salva | Apre Board Settings → Time con NTP acceso, accende **Use the NTP server from DHCP**, salva: il POST contiene `dhcp: true`, il messaggio di conferma compare, la riga Server mostra `192.168.1.1 (from DHCP)` dopo il GET successivo |
  | Ripiego dopo NoAnswer | GET con `dhcp: no_answer`, `origin: configured`, `dhcp_server: 192.168.1.1`: la riga Server mostra `pool.ntp.org (configured)` e la nota `DHCP server 192.168.1.1 did not answer` |
  | DHCP senza server | GET con `dhcp: none`: la riga mostra il server configurato e `DHCP gave no server` |
  | NTP spento | Spegnendo NTP l'interruttore DHCP si disabilita e la riga Server mostra `—`; il POST conserva il valore di `dhcp` |
  | Errore del server | Un 400 `Invalid DHCP option` viene mostrato così com'è |

  ---

  _Piano generato con ARchetipo Planning — 2026-11-22_
tasks:
  - id: TASK-01
    title: Opzione dhcp in TimeSettings e nel namespace NVS time
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** aggiungere l'impostazione "server NTP dal DHCP", spenta di default e conservata in NVS.

      **Da leggere:** `lib/TimeCore/src/TimeSettings.h`, `src/core/time_settings_store.h`, `src/core/time_settings_store.cpp`.

      **Passi:**
      1. In `TimeSettings` aggiungi `bool dhcp;` dopo `zone`, con il commento: server NTP dell'option 42 del DHCP, prima di `server` che resta il ripiego (US-145).
      2. In `timeDefaults()` imposta `dhcp = false` (aggiorna l'inizializzatore aggregato).
      3. `sanitize()` non cambia `dhcp`; aggiorna solo il commento se serve.
      4. In `time_settings_store.cpp` aggiungi `kKeyDhcp = "dhcp"`: `load()` legge `prefs.getBool(kKeyDhcp, s.dhcp)`; `save()` scrive `putBool(kKeyDhcp, s.dhcp)` e include il risultato (> 0) in `ok`.
      5. Cerca tutti gli inizializzatori aggregati di `TimeSettings` (`grep -rn "TimeSettings s = {" src lib test`) e aggiungi il quarto campo.

      **Bloccanti:** nessuno.

      ## File Coinvolti
      - lib/TimeCore/src/TimeSettings.h — campo `dhcp`, default false
      - src/core/time_settings_store.cpp — chiave NVS `dhcp` in load/save
      - src/core/time_settings_store.h — commento del namespace

      ## Verifica
      `pio test -e native -f test_time_core` compila e passa.

      ## Criteri di Completamento
      - [ ] `timeDefaults().dhcp` è false
      - [ ] `TimeSettingsStore::load()` restituisce false se la chiave `dhcp` manca
      - [ ] `save()` restituisce false se la scrittura di `dhcp` fallisce
      - [ ] Tutti gli inizializzatori aggregati di `TimeSettings` hanno il nuovo campo
    ref: TASK-01
  - id: TASK-02
    title: Politica pura NtpSourcePolicy e formatIpv4 in TimeCore
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** scrivere la scelta del server (DHCP o configurato) come codice puro, testabile in nativo.

      **Da leggere:** `lib/TimeCore/src/TimeStatus.h` (stile di `TimeLogPolicy`), sezione Soluzione tecnica del piano.

      **Passi:** crea `lib/TimeCore/src/NtpSource.h` (header-only, solo `<stdint.h>`, `<stdio.h>`) con:
      1. `enum class NtpOrigin : uint8_t { Configured, Dhcp };` e `ntpOriginName()` → `"configured"` / `"dhcp"`.
      2. `enum class DhcpNtpState : uint8_t { Off, None, Used, NoAnswer };` e `dhcpNtpStateName()` → `"off"`, `"none"`, `"used"`, `"no_answer"`.
      3. `inline void formatIpv4(uint32_t lwip_addr, char out[16])`: ordine di `ip4_addr_t.addr` di lwIP, primo ottetto nel byte basso (`addr & 0xFF`), formato `a.b.c.d`.
      4. `class NtpSourcePolicy` con campi privati `bool _use = false; uint32_t _dhcp = 0; uint32_t _failed = 0;` e:
         - `void reset(bool use_dhcp)` → `_use = use_dhcp; _failed = 0;` (tiene `_dhcp`)
         - `void onLinkDown()` → `_dhcp = 0; _failed = 0;`
         - `bool onDhcpServer(uint32_t addr)`: se `addr == _dhcp` restituisce false; altrimenti salva origine e server in uso prima, imposta `_dhcp = addr`, azzera `_failed` se `addr != _failed`, restituisce true se l'origine o il server in uso sono cambiati
         - `bool onNoAnswer()`: se `origin() != Dhcp` restituisce false; altrimenti `_failed = _dhcp` e true
         - `NtpOrigin origin() const`: `Dhcp` se `_use && _dhcp != 0 && _dhcp != _failed`, altrimenti `Configured`
         - `DhcpNtpState state() const`: `!_use` → Off; `_dhcp == 0` → None; `_dhcp == _failed` → NoAnswer; altrimenti Used
         - `uint32_t dhcpServer() const`
      5. Commento della classe: niente ritentativi a tempo; il server del DHCP si riprova a una nuova connessione (`onLinkDown`), con un lease che porta un server diverso o con nuove impostazioni (`reset`).

      **Bloccanti:** nessuno.

      ## File Coinvolti
      - lib/TimeCore/src/NtpSource.h — nuovo, header-only

      ## Verifica
      `pio test -e native -f test_time_core` compila (il file è incluso dai test di TASK-03).

      ## Criteri di Completamento
      - [ ] Il file non dipende da Arduino né da lwIP
      - [ ] `onDhcpServer` con lo stesso server restituisce false
      - [ ] Con l'opzione spenta `origin()` è sempre `Configured` e `state()` è `Off`
    ref: TASK-02
  - id: TASK-03
    title: Test nativi di TimeSettings.dhcp e NtpSourcePolicy
    type: Test
    status: DONE
    dependencies:
