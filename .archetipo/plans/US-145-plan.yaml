  - id: TASK-11
    title: Prova sul campo con il DHCP reale (solo dopo un sì esplicito)
    type: Test
    status: TODO
    dependencies:
      - TASK-10
    body: |-
      ## Descrizione
      **Obiettivo:** verificare sulla scheda di test che il server del DHCP venga catturato e usato, e che il ripiego funzioni.

      **Da leggere:** memoria del progetto sulla scheda di test e le credenziali OTA (mai stampate).

      **Passi:**
      1. Chiedi all'utente un sì esplicito prima di installare la build sulla scheda. Senza sì il task resta TODO e lo si segnala nella review.
      2. Installa la build con l'OTA, apri Board Settings → Time e accendi **Use the NTP server from DHCP**.
      3. Leggi `GET /api/time`:
         - con `status.dhcp` `used`, verifica la riga `Synchronized with <ip> (from DHCP)` nel System Log;
         - con `none`, il router non annuncia l'option 42: la scheda usa il server configurato e scrive `DHCP gave no NTP server`. Riporta il risultato all'utente e proponi di attivare l'option 42 nel router o di provare con dnsmasq su una rete separata.
      4. Se c'è un server del DHCP, prova il ripiego solo se l'utente lo consente, per esempio con un server dell'option 42 che non risponde: la riga WARN passa al server configurato.
      5. Spegni l'opzione e verifica che le righe tornino quelle di US-117.
      6. Salva le note in `docs/test-results/US-145/`.

      **Bloccanti:** consenso esplicito dell'utente; router con l'option 42 (non noto).

      ## File Coinvolti
      - docs/test-results/US-145/ — note della prova

      ## Verifica
      Righe del System Log e risposta di `GET /api/time` salvate nelle note.

      ## Criteri di Completamento
      - [ ] Prova fatta dopo il sì dell'utente, oppure rinviata e segnalata
      - [ ] Esito (used/none, ripiego) annotato in docs/test-results/US-145/
    ref: TASK-11
