    body: |-
      ## Descrizione
      **Obiettivo:** coprire con Unity la politica di scelta del server e il nuovo default.

      **Da leggere:** `test/test_time_core/test_main.cpp` (stile e `RUN_TEST`), `lib/TimeCore/src/NtpSource.h`.

      **Passi:** in `test/test_time_core/test_main.cpp` aggiungi `#include "NtpSource.h"` e i test, registrandoli in `main`:
      1. `test_time_defaults`: aggiungi l'asserzione `dhcp == false`; `test_sanitize_stored_values`: `dhcp` true resta true.
      2. `test_format_ipv4`: `0x0101A8C0` → `"192.168.1.1"`, `0` → `"0.0.0.0"`, `0xFFFFFFFF` → `"255.255.255.255"`.
      3. `test_ntp_source_names`: tutti i valori di `ntpOriginName` e `dhcpNtpStateName`.
      4. `test_ntp_source_option_off_ignores_dhcp`: `reset(false)`, `onDhcpServer(X)` → origine Configured, stato Off.
      5. `test_ntp_source_uses_the_lease_server`: `reset(true)`, `onDhcpServer(X)` true → Dhcp, Used, `dhcpServer() == X`.
      6. `test_ntp_source_no_server_from_dhcp`: `reset(true)`, nessun server → Configured, None.
      7. `test_ntp_source_no_answer_falls_back_once`: Used → `onNoAnswer()` true → Configured, NoAnswer; secondo `onNoAnswer()` false.
      8. `test_ntp_source_no_answer_with_configured_server`: stato None → `onNoAnswer()` false.
      9. `test_ntp_source_renewal_same_server`: dopo il ripiego `onDhcpServer(X)` false e resta NoAnswer; da Used, stesso X → false.
      10. `test_ntp_source_renewal_new_server_retries`: dopo il ripiego `onDhcpServer(Y)` true → Dhcp, Used.
      11. `test_ntp_source_link_down_retries`: dopo il ripiego `onLinkDown()`, poi `onDhcpServer(X)` true → Used.
      12. `test_ntp_source_reset_retries`: dopo il ripiego `reset(true)` → Used con lo stesso X.
      13. `test_ntp_source_option_on_with_known_lease`: `reset(false)`, `onDhcpServer(X)`, poi `reset(true)` → Dhcp.

      **Bloccanti:** nessuno.

      ## File Coinvolti
