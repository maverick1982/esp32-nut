  - id: TASK-08
    title: 'Web UI: interruttore DHCP e riga del server in uso nella sezione Time'
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** permettere all'utente di accendere l'opzione e vedere quale server viene usato.

      **Da leggere:**
      - `data/www/index.html`, sezione `time-section`, circa righe 960-1040;
      - `data/www/bundle.js`, blocco `US-117: Time section`, circa righe 4242-4470.

      **Passi:**
      1. In `index.html`, nel riquadro `time-status`, dopo `Board time`, aggiungi:
         `<div class="link-kv wide"><dt>Server</dt><dd id="time-source" class="na">—</dd></div>`.
      2. In `index.html`, dopo la `board-row` dell'interruttore NTP, aggiungi una `board-row` uguale per stile:
         - nome `Use the NTP server from DHCP`;
         - hint `Option 42 of the router. The server below is used when DHCP gives none or it does not answer.`;
         - checkbox `time-dhcp` con `aria-label="NTP server from DHCP"` e stato `time-dhcp-state`.
      3. In `bundle.js`:
         - `setDhcpSwitch(on, enabled)` imposta `checked`, `disabled` e il testo On/Off;
         - `renderForm()` usa `s.dhcp === true`;
         - il cambio di `time-ntp` abilita o disabilita `time-dhcp` (senza cambiarne il valore) e marca il form come modificato come gli altri campi;
         - `saveTime()` aggiunge `dhcp: T('time-dhcp').checked` a `v`;
         - `TIME_ERROR_FIELD` gestisce `Invalid DHCP option` (nessun campo, `null`).
      4. In `renderStatus()`:
         - con `st.server` stringa non vuota scrivi `<server> (from DHCP)` se `st.origin === 'dhcp'`, altrimenti `<server> (configured)`;
         - aggiungi una nota piccola: `dhcp === 'none'` → `DHCP gave no server`, `dhcp === 'no_answer'` → `DHCP server <dhcp_server> did not answer`;
         - senza `st.server` scrivi `—` con classe `na`;
         - usa `textContent`, mai `innerHTML`, per i valori del server.
      5. Lancia una build (`pio run -e esp32-s3-standard`) per rigenerare `data/www/index_inlined.html` con `scripts/inline_web.py`, poi includi il file nel commit.

      **Bloccanti:** nessuno. Non serve un mockup: è un campo in più in un form esistente.

      ## File Coinvolti
      - data/www/index.html — riga Server e interruttore DHCP
      - data/www/bundle.js — form, stato, POST
      - data/www/index_inlined.html — rigenerato dalla build

      ## Verifica
      `npx playwright test e2e/time-settings.spec.ts` (i test esistenti restano verdi).

      ## Criteri di Completamento
      - [ ] Con NTP spento l'interruttore DHCP è disabilitato ma conserva il valore
      - [ ] Il POST contiene `dhcp`
      - [ ] La riga Server mostra server e origine, oppure `—` con NTP spento
      - [ ] Nessuno scroll orizzontale alla larghezza del telefono
    ref: TASK-08
