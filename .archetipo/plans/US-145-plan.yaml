    ref: TASK-03
  - id: TASK-04
    title: Cattura dell'option 42 con il wrap di dhcp_set_ntp_servers
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** catturare il server NTP del lease DHCP senza che lwIP tocchi i server dell'SNTP.

      **Da leggere:** `platformio.ini` (sezioni `[esp32s3_common]` e `[p4_eth]`, flag `-Wl,--wrap=esp_core_dump_write` e il suo commento), il wrap esistente di `esp_core_dump_write` (`grep -rn "__wrap_esp_core_dump_write" src`) come modello.

      **Passi:**
      1. Crea `src/network/dhcp_ntp_capture.h` con `namespace DhcpNtpCapture { uint32_t server(); void clear(); }` e un commento: server dell'option 42 dell'ultimo lease (ordine di `ip4_addr_t.addr`), 0 senza; scritto dal task tcpip, letto da `NtpClock::poll()`; US-145.
      2. Crea `src/network/dhcp_ntp_capture.cpp`: `static std::atomic<uint32_t> s_server{0};` e `extern "C" void __wrap_dhcp_set_ntp_servers(u8_t num, const ip4_addr_t* servers)`, che salva `servers[0].addr` se `num > 0 && servers`, altrimenti 0. Non chiama `__real_dhcp_set_ntp_servers`, non scrive log e non alloca. Includi `lwip/ip4_addr.h`. Commento: lwIP la chiama solo per un ACK con l'option 42, prima di assegnare l'IP; non chiamare la funzione reale tiene i server dell'SNTP sotto il controllo di `NtpClock`; il simbolo è definito in `sntp.c.obj` e referenziato da `dhcp.c.obj` di liblwip.a (esp32s3, esp32p4, esp32p4_es), quindi il wrap funziona.
      3. In `platformio.ini` aggiungi `-Wl,--wrap=dhcp_set_ntp_servers` sotto il wrap esistente, sia in `[esp32s3_common]` sia in `[p4_eth]`, con una riga di commento (US-145, issue #135).
      4. L'env `native` non compila `src/network`: nessuna modifica lì.

      **Bloccanti:** se il link fallisce per un `__wrap_` non definito, controlla che il file sia incluso da `build_src_filter` (`+<*>`).

      ## File Coinvolti
      - src/network/dhcp_ntp_capture.h — nuovo
      - src/network/dhcp_ntp_capture.cpp — nuovo, funzione `__wrap_`
      - platformio.ini — flag del wrap in `[esp32s3_common]` e `[p4_eth]`

      ## Verifica
      `pio run -e esp32-s3-standard` e `pio run -e esp32-p4-eth-v1` linkano senza errori.

      ## Criteri di Completamento
      - [ ] Le due build linkano con il wrap
      - [ ] `DhcpNtpCapture::server()` e `clear()` sono atomici e non bloccano
      - [ ] sdkconfig e sorgenti di lwIP non sono toccati
    ref: TASK-04
  - id: TASK-05
    title: 'NtpClock: scelta del server, ripiego dopo NoAnswer, righe del System Log e stato'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** usare il server del DHCP quando l'opzione è accesa, con ripiego sul server configurato. Log e stato nominano il server in uso.

      **Da leggere:** `src/network/ntp_clock.h`, `src/network/ntp_clock.cpp`, `lib/TimeCore/src/NtpSource.h`, `src/network/dhcp_ntp_capture.h`, la sezione Soluzione tecnica del piano (righe del System Log).

      **Passi:**
      1. In `ntp_clock.h`:
         - aggiungi `#include "NtpSource.h"`;
         - aggiungi i membri `NtpSourcePolicy _source;` e `bool _was_up = false;` (solo loopTask);
         - aggiungi il metodo privato `void startSntp(uint32_t now);`;
         - in `Status` aggiungi `NtpOrigin origin; DhcpNtpState dhcp; uint32_t dhcp_addr;`, inizializzati a `Configured, Off, 0`;
         - sostituisci il paragrafo "DHCP option 42 stays off" con la descrizione di US-145 (cattura via wrap, ripiego, nessun ritentativo a tempo);
         - `_server` contiene il server in uso.
      2. `apply()`:
         - ferma l'SNTP come oggi;
         - con NTP acceso lascia `esp_sntp_setoperatingmode`, `esp_sntp_servermode_dhcp(false)` e la callback, ma togli `strncpy` e `setservername` (li fa `startSntp`);
         - chiama `_source.reset(s.dhcp)` in entrambi i rami;
         - nella riga "Settings changed" con NTP acceso aggiungi `, server from DHCP` quando `s.dhcp`.
      3. `startSntp(now)`:
         - se `_sntp_running`, chiama `esp_sntp_stop()`;
         - se `_source.origin() == NtpOrigin::Dhcp` copia in `_server` l'IP con `formatIpv4(_source.dhcpServer(), …)`, altrimenti `_active.server`;
         - chiama `esp_sntp_setservername(0, _server)`, poi `esp_sntp_init()`;
         - `_sntp_running = true; _policy.restart(now);`;
         - se l'opzione è accesa e `_source.state() == DhcpNtpState::None`, scrive INFO `[TIME] DHCP gave no NTP server, using %s`.
      4. `poll()`, dopo l'applicazione delle impostazioni:
         - `bool up = networkUp();` e `if (_was_up && !up) { _source.onLinkDown(); DhcpNtpCapture::clear(); } _was_up = up;`;
         - `bool changed = _source.onDhcpServer(DhcpNtpCapture::server());`;
         - se `_active.ntp && up && !_sntp_running` chiama `startSntp(now)`;
         - altrimenti, se `_active.ntp && _sntp_running && changed`: se l'origine è Dhcp scrive INFO `[TIME] NTP server from DHCP: <ip>`, poi chiama `startSntp(now)`.
      5. Riga Synchronized: `"[TIME] Synchronized with %s%s: %s"` con `_server` e il suffisso ` (from DHCP)` solo se l'origine è Dhcp. Con l'opzione spenta il testo resta identico a oggi.
      6. NoAnswer: quando `_policy.tick()` restituisce `NoAnswer`:
         - se l'origine è Dhcp, salva l'IP fallito, chiama `_source.onNoAnswer()`, scrive WARN `[TIME] No answer from <ip> (from DHCP) for 60 s, using <configurato>` e chiama `startSntp(now)`;
         - altrimenti resta la riga attuale, con `_server` al posto di `_active.server`.
      7. `publishState()`: riempi `_status.origin`, `_status.dhcp` e `_status.dhcp_addr` da `_source`.
      8. In `docs/adr/0009-web-ui-authentication.md`, nella riga "No wall clock", aggiungi che il server può venire anche dall'option 42 del DHCP (US-145). Resta comunque solo per mostrare l'ora e per i log.

      **Bloccanti:** nessuno. Non chiamare `AppLogger` dalla callback `onSync` né dal wrap.

      ## File Coinvolti
      - src/network/ntp_clock.h — membri, Status, commento della classe
      - src/network/ntp_clock.cpp — apply, startSntp, poll, righe del log, publishState
      - docs/adr/0009-web-ui-authentication.md — una frase sull'option 42

      ## Verifica
      `pio run -e esp32-s3-standard` compila; `pio test -e native` resta verde.

      ## Criteri di Completamento
      - [ ] Con l'opzione spenta, i server, le righe e il comportamento sono uguali a US-117
      - [ ] `_server` cambia solo con l'SNTP fermo
      - [ ] Un rinnovo con lo stesso server non riavvia l'SNTP e non scrive righe
      - [ ] NoAnswer sul server del DHCP produce una sola riga WARN con i due server e passa al server configurato
      - [ ] La caduta della rete azzera la cattura e il server fallito
    ref: TASK-05
  - id: TASK-06
    title: 'API /api/time: campo dhcp e server in uso nello stato'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** esporre l'opzione e il server in uso in `GET /api/time` e accettare `dhcp` in `POST /api/time`.

      **Da leggere:** `lib/WebApi/src/WebApiJson.h` (struct `TimeStatusView`, commenti di `timeJson` e `checkTimeBody`), `lib/WebApi/src/WebApiJson.cpp` (`timeJson`, `checkTimeBody`), `src/network/web_config_server.cpp` (`handleGetTime`).

      **Passi:**
      1. In `WebApiJson.h`:
         - includi `NtpSource.h`;
         - aggiungi a `TimeStatusView` `String server; NtpOrigin origin; DhcpNtpState dhcp; String dhcp_server;` (`dhcp_server` vuoto senza server);
         - aggiorna i commenti: `time` ha anche `dhcp`; `status` ha `server`, `origin`, `dhcp` e `dhcp_server` quando lo stato non è `disabled`; nuovo errore `Invalid DHCP option`.
      2. `timeJson`: `t["dhcp"] = time.dhcp;`. Se `status.state != TimeState::Disabled` scrivi `st["server"]`, `st["origin"] = ntpOriginName(...)`, `st["dhcp"] = dhcpNtpStateName(...)` e `st["dhcp_server"]`, quest'ultimo solo se non è vuoto.
      3. `checkTimeBody`: se `obj["dhcp"]` è presente e non è bool → `sendError(response, 400, "Invalid DHCP option")`, altrimenti `next.dhcp = v.as<bool>()`. Se manca, resta il valore corrente.
      4. `handleGetTime()`:
         - copia `s.origin` e `s.dhcp` nella view;
         - se `s.dhcp_addr != 0`, formatta `dhcp_server` con `formatIpv4`;
         - `server` = `dhcp_server` se l'origine è Dhcp, altrimenti `s.settings.server`;
         - aggiorna l'inizializzatore aggregato della view.

      **Bloccanti:** nessuno.

      ## File Coinvolti
      - lib/WebApi/src/WebApiJson.h — TimeStatusView, commenti
      - lib/WebApi/src/WebApiJson.cpp — timeJson, checkTimeBody
      - src/network/web_config_server.cpp — handleGetTime

      ## Verifica
      `pio test -e native -f test_web_api` compila; `pio run -e esp32-s3-standard` compila.

      ## Criteri di Completamento
      - [ ] `GET /api/time` riporta `time.dhcp` e, con NTP acceso, `status.server`, `status.origin` e `status.dhcp`
      - [ ] `POST /api/time` con `dhcp` non booleano risponde 400 `Invalid DHCP option`
      - [ ] Le rotte restano registrate con `guarded()`
    ref: TASK-06
