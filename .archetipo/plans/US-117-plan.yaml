  - id: TASK-03
    title: SyslogFormat con timestamp opzionale (RFC 3164 e RFC 5424)
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** il formatter scrive l'ora e l'hostname quando li riceve, e resta identico a US-116 senza.

      **Leggere:** sezione "Formato syslog con l'ora" del piano; `lib/LogCore/src/SyslogFormat.h/.cpp`; RFC 3164 §4.1.2 e RFC 5424 §6.2.3.

      **Modifiche:** in `SyslogFormat.h` aggiungere `struct SyslogTime { struct tm local; struct tm utc; uint16_t ms; }` (include `<time.h>`) e il parametro finale `const SyslogTime* time = nullptr` a `formatSyslog` e `formatSyslogSeverity`. In `.cpp`: con l'ora, RFC 3164 `<PRI>Mmm dd hh:mm:ss HOSTNAME TAG: ` (mesi in inglese da una tabella costante, giorno `%2d`), RFC 5424 `<PRI>1 YYYY-MM-DDThh:mm:ss.mmmZ HOSTNAME APP - - - `. Aggiornare il commento di testa ("no RTC, no SNTP" non è più vero).

      **Passi:** 1) struct e firme; 2) intestazioni; 3) controllare che i chiamanti esistenti compilino senza modifiche.

      **Verifica:** suite del TASK-04.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/LogCore/src/SyslogFormat.h — `SyslogTime`, parametro opzionale, commento
      - lib/LogCore/src/SyslogFormat.cpp — intestazioni con l'ora

      ## Criteri di Completamento
      - [ ] Con `time == nullptr` l'uscita è byte per byte quella attuale
      - [ ] RFC 3164 usa l'ora locale e il formato `Nov  4`, RFC 5424 l'ora UTC con millisecondi e `Z`
      - [ ] Nessun `localtime`/`gmtime` dentro `LogCore`
    ref: TASK-03
