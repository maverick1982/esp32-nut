      **Modifiche:** nuova `test/test_time_core/test_main.cpp` con i casi elencati nel piano per fusi, `validNtpServer`, `sanitize`, `WallClock` e `TimeLogPolicy`.

      **Passi:** 1) scheletro con `setUp`/`tearDown` e `main`; 2) casi; 3) eseguire.

