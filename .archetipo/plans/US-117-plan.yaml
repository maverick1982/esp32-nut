      **Modifiche:** in `WebApiJson` aggiungere `struct TimeStatusView` (stato, `local`, `abbr`, `utc`, `since_sync_s`, `has_time`), `timeJson(settings, view)` e `checkTimeBody(body, current, next, response)` con i messaggi del piano. In `WebConfigServer`: `setTime(TimeSettingsStore*, NtpClock*)`, `handleGetTime`, `handleSetTime` (salva, poi `ntp_clock->configure(next, who)`), rotte `/api/time` GET e POST con `guarded()`, non pubbliche. L'handler costruisce `TimeStatusView` da `NtpClock::status()`. In `main.cpp`: `web_server.setTime(&time_settings_store, &ntp_clock)`.

      **Passi:** 1) funzioni pure; 2) handler e rotte; 3) collegamento in main.

