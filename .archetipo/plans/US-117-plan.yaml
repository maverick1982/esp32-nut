  - id: TASK-05
    title: TimeSettingsStore (NVS "time") e adattatore NtpClock
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** salvare le impostazioni e far girare SNTP con il fuso scelto, applicando le modifiche senza riavvio.

      **Leggere:** sezioni "Persistenza" e "Adattatore `NtpClock`" del piano; `src/core/log_settings_store.h/.cpp` (schema NVS); `src/network/syslog_output.h/.cpp` (configure/poll sotto mutex, `networkUp()`); `esp_sntp.h` del core.

      **Modifiche:** creare `src/core/time_settings_store.h/.cpp` (namespace `time`, chiavi `ntp`, `server`, `zone`, `load()` con `sanitize`). Creare `src/network/ntp_clock.h/.cpp`: `begin`, `configure(settings, who)`, `poll(now)`, `epochMsAt`, `status()` (struct con stato, server, zona, ora valida, secondi dall'ultima sincronizzazione), `localTime`/`utcTime` con `localtime_r`/`gmtime_r`. In `poll`: applicare le impostazioni in sospeso (`esp_sntp_stop`, `ESP_SNTP_OPMODE_POLL`, `esp_sntp_servermode_dhcp(false)`, `esp_sntp_setservername(0, ...)`, `setenv("TZ")` + `tzset()`, `esp_sntp_init()` solo con NTP acceso e rete su; avviarlo quando la rete arriva dopo), trasformare il flag della callback nelle righe di `TimeLogPolicy`, scrivere la riga "Settings changed by ...". Callback di sincronizzazione: `gettimeofday` + `millis()` → `WallClock::setSynced` sotto `std::mutex`, flag atomico, nessun `AppLogger`.

      **Passi:** 1) store; 2) NtpClock senza log; 3) righe del System Log; 4) rileggere che nessun percorso di NtpClock blocchi il `loop()`.

      **Verifica:** compila con `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` (da PowerShell) dopo il TASK-06.

      **Blocchi:** se `esp_sntp_servermode_dhcp` o `sntp_set_time_sync_notification_cb` non sono esportati dal core precompilato, fermarsi e riportarlo con l'errore del linker.

      ## File Coinvolti
      - src/core/time_settings_store.h — nuovo
      - src/core/time_settings_store.cpp — nuovo
      - src/network/ntp_clock.h — nuovo
      - src/network/ntp_clock.cpp — nuovo

      ## Criteri di Completamento
      - [ ] Le impostazioni si applicano in `poll()` senza riavvio
