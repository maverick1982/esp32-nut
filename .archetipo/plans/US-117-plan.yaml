  - id: TASK-06
    title: Ora nei messaggi syslog e collegamento in main.cpp
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** le righe syslog portano l'ora della scrittura quando la scheda ha l'ora.

      **Leggere:** sezioni "Syslog con l'ora" e "Avvio" del piano; `src/network/syslog_output.cpp` (`deliver`, `sendNow`); `src/core/main.cpp` righe 120-230 e `loop()`.

      **Modifiche:** in `SyslogOutput` aggiungere `setClock(const NtpClock*)` e un helper che, dato un uptime, riempie `SyslogTime` (locale, UTC, millisecondi) se `epochMsAt` riesce. Usarlo in `deliver()` con `record.uptime_ms` e in `sendNow()` con `millis()`; passare `nullptr` senza ora. In `main.cpp`: istanze statiche `time_settings_store` e `ntp_clock`; dopo il blocco AP/STA `ntp_clock.begin(&network_mgr); ntp_clock.configure(time_settings_store.load());`; `syslog_output.setClock(&ntp_clock)` prima di `log_dispatcher.start()`; `ntp_clock.poll(millis())` nel `loop()`.

      **Passi:** 1) SyslogOutput; 2) main; 3) build S3.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` da PowerShell.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - src/network/syslog_output.h — `setClock`
      - src/network/syslog_output.cpp — ora in `deliver` e `sendNow`
      - src/core/main.cpp — istanze, avvio, `poll` nel loop

      ## Criteri di Completamento
      - [ ] Senza ora valida i datagrammi sono identici a quelli di US-116
      - [ ] Una riga scritta prima della sincronizzazione e consegnata dopo usa il suo `uptime_ms`
      - [ ] La build S3 compila
