  - id: TASK-06
    title: EthLink con W5500 e prova bloccante nel gestore di rete
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** avviare davvero il W5500 con i pin dell'utente e decidere all'avvio se tenerlo.

      **Leggere:** `src/network/eth_link.h/.cpp`, `src/network/network_manager.cpp`, `include/network/network_manager.h`, `lib/NetCore/src/NetLinkSelector.h`; API in `~/.platformio/packages/framework-arduinoespressif32/libraries/Ethernet/src/ETH.h` (`begin(type, addr, cs, irq, rst, spi_host_device_t, sck, miso, mosi)`, `setPollPeriod`).

      **Modifiche:**
      1. `EthLink::begin()`: ramo per `EthType::SPI` con `phy_type == EthPhy::W5500`: se `irq < 0` → `ETH.setPollPeriod(10)`; `m_started = ETH.begin(ETH_PHY_W5500, m_cfg.phy_addr, m_cfg.cs, m_cfg.irq, m_cfg.rst, SPI2_HOST, m_cfg.sck, m_cfg.miso, m_cfg.mosi)`; se fallisce `AppLogger::log("ERROR", "[NETWORK] W5500 not responding: check the pins in the Network page")`; se riesce log INFO con i pin e il modo (interrupt o polling), poi `setHostname` come nel ramo RMII. Il ramo RMII resta identico; l'errore "not supported yet" resta solo per tipi sconosciuti. Aggiornare il commento di testata (RMII o SPI). Aggiungere `bool started() const`.
      2. `AppNetworkManager`: `void setEthernetConfig(const EthConfig&)` (membro `m_ethCfg` + `m_hasEthCfg`); `begin()` nel caso `ETHERNET` usa `m_ethCfg` se impostato, altrimenti `board.eth`. Nuovo `EthProbeOutcome probeEthernet(const String& saved_hostname)`: crea `m_eth` se manca, `m_selector.activate(m_eth)`, `EthBootProbe` con `millis()`, ciclo `while (WAITING) { m_selector.loop(now); esp_task_wdt_reset(); delay(50); }`; se l'esito non è `CONNECTED` → log WARN `"[NETWORK] Ethernet (W5500) not available (%s): falling back to Wi-Fi"` con il motivo, poi `m_selector.activate(nullptr)`; salva l'esito in `m_ethProbe` e lo espone con `EthProbeOutcome ethProbe() const`. Se poi `begin()` riceve `ETHERNET` con `m_eth` già attivo, `activate()` non fa nulla (stesso link).

      **Passi:** implementare, compilare S3 e P4.

      **Blocchi:** se `ETH.end()` non libera il bus SPI e il ripiego al Wi-Fi fallisce sulla scheda, segnalarlo nel riepilogo (prova su hardware dei tester).

      ## File Coinvolti
      - src/network/eth_link.h — `started()`
      - src/network/eth_link.cpp — ramo SPI/W5500
      - include/network/network_manager.h — `setEthernetConfig`, `probeEthernet`, `ethProbe`
      - src/network/network_manager.cpp — implementazione

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio run -e esp32-s3-standard` e `pio run -e esp32-p4-eth` compilano (PowerShell)
      - [ ] Il percorso RMII del P4 non cambia
      - [ ] Il ciclo di prova resetta il watchdog e non supera 5 s senza link o 20 s con link senza DHCP
  - id: TASK-07
    title: API GET/POST /api/network/eth e network.links
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
      - TASK-03
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** leggere e salvare le impostazioni del W5500 dalla web UI.

      **Leggere:** `lib/WebApi/src/WebApiJson.h/.cpp` (`checkHostnameBody`, `boardSettingsJson`, `checkBoardSettingsBody`, `networkLinksJson`, `sendError`), `src/network/web_config_server.cpp` (`handleSetHostname`, registrazione rotte, `handleGetConfig`), `include/network/web_config_server.h`.

      **Modifiche:**
      1. `WebApiJson`: `static String ethSpiJson(const BoardConfig&, const EthSpiSettings&, const char* state, const char* reason)` → `{"available":true,"enabled":bool,"pins":{"sck":n|null,...},"strapping":[...],"status":{"state":"off|active|fallback","reason":"..."}}` (pin -1 come null, `reason` omesso se vuoto). `static int checkEthSpiBody(JsonVariantConst body, const BoardConfig&, const EthSpiSettings& current, EthSpiSettings& next, bool& restart, String& response)`: `enabled` bool obbligatorio; `pins` oggetto con chiavi facoltative, ognuna intero, null o assente (= -1); altri tipi → 400 `"Invalid request"`; poi `checkEthSpiSettings` → 400 col messaggio; `restart = next != current`; 200 con `{"success":true,"restart":bool,"warnings":["GPIO 3 is a strapping pin: the board may not boot if the module pulls it at power-on"]}` scritto in `response`. Overload `networkLinksJson(JsonArray, const BoardConfig&, bool spi_eth_enabled)` che aggiunge `"ethernet"` dopo `"wifi"`; la firma vecchia chiama la nuova con false.
      2. `WebConfigServer`: `setEthSpi(EthSpiStore*, const EthSpiSettings&)`; rotte `GET`/`POST /api/network/eth` registrate solo se `board().spi_eth.available`, in AP e in stazione, con `guarded` come l'hostname. Lo stato: `off` se spento, `active` se il link attivo è Ethernet, `fallback` + `ethProbeReason(network->ethProbe())` altrimenti. POST: salva con lo store (500 `"Failed to save the W5500 settings"` se fallisce), log INFO `"[NETWORK] W5500 settings saved (enabled|disabled): restarting"`, `should_restart` come `handleSetHostname` solo se `restart`. `handleGetConfig` usa l'overload con `saved.enabled`.

      **Passi:** prima `WebApiJson` (puro), poi il server.

      **Blocchi:** se `AuthPolicy` richiede di elencare le rotte protette, seguire lo schema di `/api/network/hostname`.

      ## File Coinvolti
      - lib/WebApi/src/WebApiJson.h — dichiarazioni e documentazione
      - lib/WebApi/src/WebApiJson.cpp — implementazione
      - include/network/web_config_server.h — `setEthSpi`, membri
      - src/network/web_config_server.cpp — rotte e handler

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio run -e esp32-s3-standard` e `pio run -e esp32-p4-eth` compilano
      - [ ] Sul P4 le rotte non esistono (404)
      - [ ] Salvare gli stessi valori risponde `restart:false` e non riavvia
