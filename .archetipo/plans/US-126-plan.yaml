    body: |-
      ## Descrizione
      **Obiettivo:** permettere all'utente di attivare il W5500 e impostarne i pin dalla pagina Network.

      **Leggere:** `data/www/index.html` (sezioni `data-section="ethernet"` e `data-section="hostname"`, interruttore LED di Board Settings), `data/www/bundle.js` (righe ~1200-1230 sezioni, ~1420-1540 hostname: errore, successo, conto alla rovescia), `data/www/bundle.css`; **mockup di riferimento `docs/mockups/US-126/`** (fonte di verità per markup e stili della sezione: `index.html` sezione `#sec-w5500`, `w5500.css` con classi `.pin-grid`, `.pin-cell[data-wire]`, `.pin-input`, `.auth-alert.warning`, `.w5500-badge`; `app.js` per testi di fallback e strapping e comportamento del form). Le classi di `w5500.css` vanno copiate in `data/www/bundle.css`.

      **Modifiche:**
      1. `index.html`: nuova `<section class="net-section" id="sec-w5500" data-section="w5500" hidden>` tra Ethernet e Hostname, titolo "Ethernet module (W5500)" con icona, pannello `config-panel net-panel`: interruttore "Use a W5500 module" (`#w5500-enabled`, stesso markup dell'interruttore LED), riga di stato `#w5500-status` (nascosta salvo fallback), griglia di sei `input type="number" min="0" max="48"` con id `w5500-sck`, `w5500-mosi`, `w5500-miso`, `w5500-cs`, `w5500-int`, `w5500-rst`, etichette SCK, MOSI, MISO, CS, INT (optional), RST (optional) e placeholder 12, 11, 13, 10, 9, 14; avviso `#w5500-strapping` (classe `auth-alert`, nascosto); errore `#w5500-error` con `#w5500-error-text`; successo `#w5500-success` con conto alla rovescia `#w5500-countdown` 15 s come l'hostname; pulsante "Save W5500 settings" `#btn-w5500`; testo d'aiuto: "Enter the GPIOs your W5500 is wired to. The example values are a common wiring for an external module; boards with a built-in W5500 use their own pins, see the documentation. If the W5500 does not answer, the board falls back to Wi-Fi. Saving restarts the board."
      2. `bundle.js`: all'apertura della pagina Network `GET /api/network/eth`; con 200 mostra la sezione e compila interruttore e campi (null → vuoto); con errore la lascia nascosta. Stato fallback: `no_chip` → "The W5500 did not answer at startup: check the wiring and the pins. The board is using Wi-Fi."; `no_link` → "No Ethernet cable link at startup. The board is using Wi-Fi."; `no_ip` → "The router gave no address over Ethernet (DHCP). The board is using Wi-Fi.". Avviso strapping mentre si scrive, dai valori `strapping` della GET. Submit: POST `{enabled, pins:{sck,...}}` con campi vuoti come null; 400 → mostra `error`; 200 `restart:true` → disabilita il form e avvia il conto alla rovescia con ricarica, `restart:false` → feedback "No changes" come l'hostname. L'input nasconde l'errore.
      3. CSS minimo in `bundle.css` per la griglia dei pin (2 colonne su telefono, 3 su desktop), riusando le classi esistenti.
      4. Rigenerare le pagine inline: `python scripts/embed_web.py`.

      **Passi:** markup, logica, stile, rigenerazione, controllo manuale con `npx playwright test e2e/network-page.spec.ts`.

      **Blocchi:** nessuno.

