  # US-126: Ethernet W5500 sulla ESP32-S3 con pin impostati dall'utente (#64) — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-06

  ---

  ## Spec

  **Epic:** EP-005 — Supporto multi-scheda (ESP32-P4, Ethernet)
  **Priorità:** MEDIUM | **Punti:** 5

  Vedi `.archetipo/specs/US-126.yaml` per user story e criteri di accettazione completi.

  ---

  ## Soluzione tecnica

  Il W5500 entra nell'immagine `esp32-s3-standard` esistente, senza una nuova immagine né `#if`: le librerie precompilate della S3 hanno già `CONFIG_ETH_SPI_ETHERNET_W5500=1` e la libreria `ETH` di Arduino 3.3.12 accetta tipo e pin a runtime (`ETH.begin(ETH_PHY_W5500, addr, cs, irq, rst, SPI2_HOST, sck, miso, mosi)`). `ETH_SPI_SUPPORTS_NO_IRQ` è definito: senza INT il driver legge il chip ogni `setPollPeriod()` ms (10 ms di default), quindi INT e RST sono davvero facoltativi. Se i pin sono sbagliati il driver non legge l'ID del W5500 e `ETH.begin()` restituisce false: è il segnale per tornare al Wi-Fi.

  - **Profilo della scheda (ADR 0010 §3, PDR 0002 D4).** `BoardConfig` riceve un campo `spi_eth` con: disponibilità (true solo sulla S3), GPIO massimo, intervalli riservati con il motivo (`{22,25,"not present on the ESP32-S3"}`, `{26,32,"flash and PSRAM"}`, `{33,37,"octal PSRAM"}`, `{19,20,"USB port of the UPS"}`, `{43,44,"serial console"}`) e pin di strapping (0, 3, 45, 46). I pin del LED (`led.pin`, `led.power_pin`) sono riservati automaticamente dal validatore con motivo "status LED". `EthConfig` riceve `rst` e `EthPhy::W5500`. Il profilo S3 resta `EthType::NONE`, `has_ethernet false`: l'Ethernet SPI è un'impostazione utente, non un dato della scheda.
  - **Impostazioni pure (`include/board/eth_spi_settings.h`).** `EthSpiSettings {enabled, sck, mosi, miso, cs, irq, rst}` (-1 = non impostato), `checkEthSpiSettings()` che restituisce il primo errore con campo, GPIO e motivo, `strappingWarnings()`, `toEthConfig()` e `sanitizeEthSpi()` (impostazioni attive ma non valide → spente). Regole: ogni pin impostato è controllato anche con il modulo spento; SCK, MOSI, MISO e CS sono obbligatori solo per attivare; nessun GPIO in due campi. Testato in nativo.
  - **Archivio NVS `eth`** (`src/core/eth_spi_store.*`), come `HostnameStore` e `TimeSettingsStore`: namespace proprio, quindi sopravvive all'OTA e non tocca `config_json`. `load()` applica `sanitizeEthSpi()` e scrive un WARN se spegne il modulo.
  - **Avvio (`NetBootPlan`).** Nuovo ingresso `NetBootInput {has_wifi, has_ethernet, spi_eth, config_valid, wifi_ssid_set, manual_trigger}` e campo `fallback` nel piano. Con W5500 attivo, Wi-Fi presente e senza doppio reset: `link = ETHERNET`, `fallback = WIFI_STATION` se la configurazione è valida con SSID, altrimenti `WIFI_ACCESS_POINT` (captive portal, senza timeout). Il doppio reset avvia sempre l'AP. La stazione richiede ora anche un SSID non vuoto: dopo una configurazione NUT di default salvata in Ethernet, spegnere il W5500 porta all'AP e non a una stazione senza rete. La firma a 3 argomenti resta come wrapper, così i test esistenti non cambiano.
  - **Prova dell'Ethernet all'avvio (`EthBootProbe`, puro).** Macchina a stati con tempi fissi: chip non risponde → fallimento immediato (`no_chip`); nessun link entro `ETH_LINK_TIMEOUT_MS = 5000` → `no_link`; link senza IP entro `ETH_DHCP_TIMEOUT_MS = 15000` dal link → `no_ip`; IP → `connected`. `AppNetworkManager::probeEthernet()` la esegue in modo bloccante in `setup()`, prima della scelta AP/stazione, chiamando `esp_task_wdt_reset()` e `delay(50)` a ogni giro. In questo modo `is_ap_mode`, l'avvio del server web e del server NUT in `main.cpp` restano invariati. Il caso peggiore (cavo staccato) ritarda l'avvio di circa 5 s, con link senza DHCP di circa 20 s. Dopo il ritorno al Wi-Fi la scheda resta sul Wi-Fi fino al riavvio; il passaggio a caldo è in US-127.
  - **Configurazione di default in Ethernet.** Se la prova riesce e la configurazione non è valida (scheda integrata mai configurata in Wi-Fi), si salva la configurazione NUT di default come sull'ESP32-P4 (US-092), così il server NUT parte. Solo se il link finale è l'Ethernet.
  - **`EthLink`.** Nuovo ramo `EthType::SPI` con `EthPhy::W5500`: `ETH.setPollPeriod(10)` se `irq < 0`, poi `ETH.begin(...)` su `SPI2_HOST`. Errore chiaro nel log: "W5500 not responding: check the pins in the Network page". Nuovo `started()` per la prova.
  - **API.** `GET /api/network/eth` → `{"available":true,"enabled","pins":{sck,mosi,miso,cs,irq,rst},"strapping":[0,3,45,46],"status":{"state":"off|active|fallback","reason":"no_chip|no_link|no_ip"}}`. `POST /api/network/eth` con lo stesso `enabled` e `pins` (null o -1 = non impostato) → 400 `{"error":"GPIO 19 cannot be used for SCK: USB port of the UPS"}`, `{"error":"GPIO 10 is used for both CS and SCK"}`, `{"error":"SCK is required to enable the W5500"}`, oppure 200 `{"success":true,"restart":true|false,"warnings":[...]}` (riavvio solo se cambia qualcosa). Le rotte esistono in AP e in stazione, protette dal login come `/api/network/hostname`, e non sono registrate se `board().spi_eth.available` è false (404 sul P4). `GET /api/config` aggiunge `"ethernet"` a `network.links` quando il W5500 è attivo, così la sezione Ethernet di US-112 compare e la barra laterale mostra già "Ethernet" (bundle.js gestisce `network.type`).
  - **Web UI.** Nuova sezione `data-section="w5500"` nella pagina Network, tra Ethernet e Hostname, secondo il mockup `docs/mockups/US-126/` e dell'interruttore di Board Settings. Sei campi numerici con i pin di esempio nel testo grigio (SCK 12, MOSI 11, MISO 13, CS 10, INT 9, RST 14: sei pin adiacenti sul connettore della DevKitC-1, nessuno di strapping, quindi l'esempio non fa scattare l'avviso), INT e RST marcati "optional", avviso per i pin di strapping, riga di stato del ritorno al Wi-Fi e conto alla rovescia di 15 s dopo il salvataggio. La sezione compare solo se `GET /api/network/eth` risponde 200.
  - **Fuori dal codice.** La build di prova nella #64 e la conferma di Mickel4711 e judahrand avvengono dopo la review, con il consenso dell'utente: non fanno parte dell'implementazione. Il manuale utente vive sul branch `feature/user-manual`: l'aggiornamento va fatto lì dopo il merge, e va segnalato nel riepilogo di completamento.
  - **Spazio flash.** Il codice SPI/W5500 entra nell'immagine S3; la partizione app è di 0x3F0000 byte. La verifica finale registra la dimensione prima e dopo.

  ---

  ## Strategia di test

  La logica sta in header puri testati in nativo (validazione dei pin, piano di avvio, prova dell'Ethernet, JSON dell'API); le parti con piattaforma (NVS, `ETH.*`, `main.cpp`) sono sottili e coperte dalle tre build e dalla prova su hardware dei tester.

  - `test_eth_spi_settings` (nuovo): pin vietati per intervallo e LED con il motivo, GPIO inesistenti, duplicati, obbligatori solo con `enabled`, INT/RST facoltativi, strapping come avviso, `sanitizeEthSpi`, `toEthConfig`.
  - `test_net_boot_plan`: casi esistenti invariati; nuovi casi W5500 (stazione o AP come ripiego, doppio reset → AP, SSID vuoto → AP, P4 invariato, configurazione di default solo per l'Ethernet).
  - `test_eth_boot_probe` (nuovo): chip assente, nessun link a 5 s, nessun IP a 15 s dal link, successo, link che arriva al limite.
  - `test_web_api`: `ethSpiJson`, `checkEthSpiBody` (errori 400 col testo esatto, `restart` false senza cambiamenti, warnings), `networkLinksJson` con W5500 attivo.
  - `test_board_profile`: `spi_eth` della S3.
  - Regressione: tutta la suite nativa, la suite e2e completa, build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`.

  ### Test E2E — simulazione utente

  **Framework:** Playwright (`playwright.config.ts`, helper `e2e/support/webui.ts`, API simulate con `page.route`)
  **Video demo:** previsto (la Dimostrazione è una sequenza visibile nella pagina Network); lo registra `archetipo-review`, non l'implementazione.

  | Scenario | Flusso utente |
  |---|---|
  | Attivazione con i pin di esempio | Su una S3 l'utente apre Network, vede la sezione W5500 spenta con i pin di esempio nel testo grigio, la attiva, inserisce SCK 12, MOSI 11, MISO 13, CS 10, INT 9, RST 14, salva: nessun avviso di strapping, la POST contiene esattamente quei pin e compare il conto alla rovescia del riavvio |
  | Pin vietato | L'utente inserisce SCK 19 e salva: il server risponde 400 e la pagina mostra "GPIO 19 cannot be used for SCK: USB port of the UPS"; correggendo il campo il messaggio sparisce |
  | Pin di strapping | L'utente inserisce RST 3: compare l'avviso sui pin di strapping, il salvataggio resta possibile |
  | INT e RST vuoti | L'utente lascia vuoti INT e RST: la POST li invia come non impostati e il salvataggio riesce |
  | Ritorno al Wi-Fi | Con `status.state = fallback` e `reason = no_chip` la sezione spiega che il W5500 non risponde e che la scheda usa il Wi-Fi |
  | ESP32-P4 | `GET /api/network/eth` risponde 404: la sezione W5500 non compare, il resto della pagina Network è invariato |
  | Nessuna modifica | Salvando gli stessi valori la risposta `restart:false` non avvia il conto alla rovescia |

  ---

  > 🎨 Mockup per questa spec in `docs/mockups/US-126/`

  _Piano generato con ARchetipo Planning — 2026-11-06_
tasks:
  - id: TASK-01
    title: Profilo della scheda e logica pura delle impostazioni W5500
    type: Impl
    status: TODO
    body: |-
      ## Descrizione
      **Obiettivo:** descrivere nel profilo quali GPIO la S3 può dare al W5500 e scrivere la validazione pura dei pin.

      **Leggere:** `include/board/board.h`, `include/board/board_settings.h` (stile di `sanitize`), `src/board/esp32s3_devkit.cpp`, `src/board/esp32p4_eth.cpp`.

      **Modifiche:**
      1. `board.h`: `EthPhy::W5500 = 2`; `int8_t rst` in fondo a `EthConfig`; `struct ReservedGpio { uint8_t first; uint8_t last; const char* reason; }`; `struct SpiEthOption { bool available; uint8_t gpio_max; uint8_t reserved_count; ReservedGpio reserved[6]; uint8_t strapping_count; uint8_t strapping[4]; }`; campo `SpiEthOption spi_eth` in `BoardConfig` dopo `eth`.
      2. Profilo S3: `eth` con `rst = -1`; `spi_eth = { true, 48, 5, { {19,20,"USB port of the UPS"}, {22,25,"not present on the ESP32-S3"}, {26,32,"flash and PSRAM"}, {33,37,"octal PSRAM"}, {43,44,"serial console"} }, 4, {0,3,45,46} }`. Profilo P4: `rst = -1`, `spi_eth = { false, 0, 0, {}, 0, {} }`.
      3. Nuovo `include/board/eth_spi_settings.h` (puro, solo `<stdint.h>`, `<stdio.h>`/`<string.h>` e `board.h`; niente variabili inline: toolchain nativa GCC 5.1):
         - `struct EthSpiSettings { bool enabled; int8_t sck, mosi, miso, cs, irq, rst; }`, `ethSpiDefaults()` = spento e tutti -1.
         - `struct EthPinCheck { bool ok; char message[96]; }` e `bool checkEthSpiSettings(const BoardConfig&, const EthSpiSettings&, EthPinCheck& out)`: ordine dei campi SCK, MOSI, MISO, CS, INT, RST. Per ogni pin impostato (≥ 0): GPIO > `gpio_max` o < -1 → `"GPIO %d does not exist on this board"`; dentro un intervallo riservato → `"GPIO %d cannot be used for %s: %s"`; uguale a `led.pin` o `led.power_pin` → motivo `"status LED"`; già usato da un campo precedente → `"GPIO %d is used for both %s and %s"`. Se `enabled` e manca uno tra SCK, MOSI, MISO, CS → `"%s is required to enable the W5500"`. Con `!b.spi_eth.available` e `enabled` → `"No W5500 support on this board"`.
         - `uint8_t strappingWarnings(const BoardConfig&, const EthSpiSettings&, int8_t out[6])`: GPIO impostati che sono di strapping, senza duplicati.
         - `EthConfig toEthConfig(const EthSpiSettings&)`: `{EthType::SPI, EthPhy::W5500, 1, -1,-1,-1,-1, cs, irq, sck, miso, mosi, rst}`.
         - `EthSpiSettings sanitizeEthSpi(const BoardConfig&, EthSpiSettings)`: se `enabled` e il controllo fallisce → `enabled = false` (pin conservati).

      **Passi:** modificare `board.h`, aggiornare i due profili, scrivere l'header, compilare la suite nativa esistente.

      **Blocchi:** se un altro inizializzatore aggregato di `BoardConfig`/`EthConfig` esiste nei test o nei mock, aggiornarlo allo stesso modo.

      ## File Coinvolti
      - include/board/board.h — `EthPhy::W5500`, `EthConfig::rst`, `ReservedGpio`, `SpiEthOption`, `BoardConfig::spi_eth`
      - include/board/eth_spi_settings.h — nuovo, logica pura
      - src/board/esp32s3_devkit.cpp — `spi_eth` della S3
      - src/board/esp32p4_eth.cpp — `spi_eth` non disponibile, `rst = -1`

      ## Criteri di Completamento
      - [ ] **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native` passa senza modifiche ai test esistenti
      - [ ] I messaggi d'errore sono esattamente quelli elencati sopra
      - [ ] Nessun `#if` sul target: la differenza S3/P4 sta solo nei profili
  - id: TASK-02
    title: Test nativi della validazione dei pin e del profilo
    type: Test
    status: TODO
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** fissare con test nativi le regole dei pin del W5500.

      **Leggere:** `test/test_board_profile/test_main.cpp`, `test/test_board_settings/test_main.cpp` (stile Unity), `include/board/eth_spi_settings.h`.

      **Modifiche:** nuovo `test/test_eth_spi_settings/test_main.cpp` con casi: pin di esempio (12,11,13,10,9,14) validi e senza avvisi; cablaggio di Mickel4711 con RST 3 valido con un avviso di strapping; GPIO 19 su SCK → messaggio con "USB port of the UPS"; 23 → "not present"; 30 → "flash and PSRAM"; 35 → "octal PSRAM"; 43 → "serial console"; 48 e 38 → "status LED"; 49 → "does not exist"; stesso GPIO in CS e SCK → "is used for both"; `enabled` senza MISO → "MISO is required to enable the W5500"; spento con campi vuoti → ok; spento con un pin vietato → errore; INT e RST a -1 → ok; strapping 0/3/45/46 → avvisi e nessun errore; `sanitizeEthSpi` spegne impostazioni non valide e conserva quelle valide; `toEthConfig` copia i pin e imposta SPI/W5500; profilo P4 (costruito nel test con `available=false`) rifiuta `enabled`. In `test_board_profile` aggiungere `test_spi_eth_option` per la S3 (available, gpio_max 48, 5 intervalli, 4 strapping).

      **Passi:** scrivere i test, eseguirli, correggere TASK-01 solo se un test rivela un errore della logica.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_eth_spi_settings/test_main.cpp — nuovo
      - test/test_board_profile/test_main.cpp — test di `spi_eth`

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio test -e native -f test_eth_spi_settings -f test_board_profile` passa (con il PATH del toolchain mingw)
      - [ ] Ogni intervallo riservato, il LED, i duplicati, gli obbligatori e lo strapping hanno almeno un test
  - id: TASK-03
    title: Archivio NVS delle impostazioni W5500
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** salvare le impostazioni del W5500 in NVS, fuori da `config_json`, così restano dopo riavvio e OTA.

      **Leggere:** `src/core/hostname_store.h/.cpp`, `src/core/board_settings_store.h/.cpp`, `src/core/time_settings_store.h`.

      **Modifiche:** nuovo `src/core/eth_spi_store.h/.cpp`, classe `EthSpiStore`:
      - namespace `"eth"`, chiavi `on` (bool), `sck`, `mosi`, `miso`, `cs`, `irq`, `rst` (`putChar`/`getChar`, -1 = non impostato);
      - `EthSpiSettings load(const BoardConfig&)`: parte da `ethSpiDefaults()`, `prefs.begin(ns, true)` che fallisce = niente salvato; poi `sanitizeEthSpi()`; se ha spento il modulo, `AppLogger::log("WARN", "[NETWORK] Saved W5500 pins not valid: W5500 disabled (%s)", check.message)`;
      - `bool save(const EthSpiSettings&)`.

      **Passi:** copiare la struttura di `BoardSettingsStore`, aggiungere il commento di testata con namespace, chiavi e motivo (PDR 0002 D4).

      **Blocchi:** nessuno. Non testabile in nativo (Preferences), come gli altri store.

      ## File Coinvolti
      - src/core/eth_spi_store.h — nuovo
      - src/core/eth_spi_store.cpp — nuovo

      ## Criteri di Completamento
      - [ ] **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` da PowerShell compila
      - [ ] Impostazioni salvate non valide vengono spente al caricamento con una riga WARN
      - [ ] Il namespace `eth` non è usato da altri store
  - id: TASK-04
    title: Piano di avvio con W5500 e prova dell'Ethernet (logica pura)
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** decidere in logica pura quale link provare all'avvio e quando tornare al Wi-Fi o all'AP.

      **Leggere:** `lib/NetCore/src/NetBootPlan.h`, `test/test_net_boot_plan/test_main.cpp`.

      **Modifiche:**
      1. `NetBootPlan.h`: campo `BootLink fallback` (default `NONE`) in `NetBootPlan`; `struct NetBootInput { bool has_wifi; bool has_ethernet; bool spi_eth; bool config_valid; bool wifi_ssid_set; bool manual_trigger; }`; `NetBootPlan planNetwork(const NetBootInput&)` con queste regole:
         - Wi-Fi presente e (`manual_trigger` o non `config_valid`): AP come oggi (captive portal, `ap_idle_timeout = manual_trigger && config_valid`), anche con `spi_eth`. Eccezione: non `config_valid`, `spi_eth` e non `manual_trigger` → regola W5500 sotto.
         - Wi-Fi presente, `spi_eth`, non `manual_trigger`: `link = ETHERNET`; `fallback = WIFI_STATION` se `config_valid && wifi_ssid_set`, altrimenti `WIFI_ACCESS_POINT`; `default_config = !config_valid`.
         - Wi-Fi presente, senza `spi_eth`, `config_valid` ma `!wifi_ssid_set` → AP con captive portal, senza timeout (niente stazione senza SSID).
         - Altrimenti stazione come oggi. Schede senza Wi-Fi: comportamento attuale invariato.
         - Il wrapper esistente `planNetwork(BoardCaps, bool config_valid, bool manual_trigger)` chiama la nuova con `spi_eth=false`, `wifi_ssid_set=config_valid`.
         - `NetBootPlan fallbackPlan(const NetBootPlan&)`: `link = fallback`, `fallback = NONE`, `default_config = false`; se il ripiego è l'AP `captive_portal = true`, `ap_idle_timeout = false`.
      2. Nuovo `lib/NetCore/src/EthBootProbe.h`: `enum class EthProbeOutcome : uint8_t { WAITING, CONNECTED, NO_CHIP, NO_LINK, NO_IP }`; costanti `ETH_LINK_TIMEOUT_MS = 5000`, `ETH_DHCP_TIMEOUT_MS = 15000` (come `static const uint32_t` in classe o enum, niente inline variables); classe `EthBootProbe` con `void begin(uint32_t now, bool started)` e `EthProbeOutcome step(uint32_t now, bool link_up, bool has_ip)`: non avviato → `NO_CHIP`; IP con link → `CONNECTED`; senza link oltre 5 s dall'inizio → `NO_LINK`; link senza IP oltre 15 s dal primo link → `NO_IP`; il link che cade azzera l'attesa del DHCP ma non quella del link già scaduta. `const char* ethProbeReason(EthProbeOutcome)` → `"no_chip"`, `"no_link"`, `"no_ip"`, `""`. Aritmetica di `millis()` con sottrazione unsigned (overflow sicuro).

      **Passi:** estendere l'header mantenendo i commenti di testata (aggiungere US-126), scrivere `EthBootProbe.h`, compilare la suite nativa.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/NetCore/src/NetBootPlan.h — `NetBootInput`, `fallback`, `fallbackPlan`
      - lib/NetCore/src/EthBootProbe.h — nuovo

      ## Criteri di Completamento
      - [ ] **Verifica:** i test esistenti di `test_net_boot_plan` passano senza modifiche
      - [ ] Nessuna chiamata di piattaforma negli header (solo `<stdint.h>`)
  - id: TASK-05
    title: Test nativi del piano di avvio e della prova dell'Ethernet
    type: Test
    status: TODO
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** coprire le nuove regole di avvio e la macchina a stati della prova.

      **Leggere:** `test/test_net_boot_plan/test_main.cpp`, `lib/NetCore/src/NetBootPlan.h`, `lib/NetCore/src/EthBootProbe.h`.

      **Modifiche:**
      - `test_net_boot_plan`: W5500 con configurazione valida e SSID → `ETHERNET` con ripiego `WIFI_STATION`, `default_config` false; W5500 senza configurazione → `ETHERNET`, ripiego AP, `default_config` true; doppio reset con W5500 → AP; configurazione valida con SSID vuoto e senza W5500 → AP senza timeout; `fallbackPlan` verso AP imposta captive portal e niente timeout; verso stazione niente portal; schede senza Wi-Fi invariate con il nuovo ingresso.
      - Nuovo `test/test_eth_boot_probe/test_main.cpp`: non avviato → `NO_CHIP` subito; link e IP a 2 s → `CONNECTED`; nessun link a 4,9 s → `WAITING`, a 5,1 s → `NO_LINK`; link a 1 s e nessun IP a 15,9 s → `WAITING`, a 16,1 s → `NO_IP`; `now` vicino a `UINT32_MAX` che si azzera durante l'attesa; testi di `ethProbeReason`.

      **Passi:** scrivere i test ed eseguirli.

      **Blocchi:** nessuno.

      ## File Coinvolti
