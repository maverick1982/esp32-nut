    body: |-
      ## Descrizione
      **Obiettivo:** chiudere il criterio 5 della spec.

      **Leggere:** `platformio.ini` (ambienti `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`, `native`).

      **Modificare:** niente, salvo correzioni a errori trovati.

