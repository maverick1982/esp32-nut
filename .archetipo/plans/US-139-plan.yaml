  - id: TASK-06
    title: Prova sulla scheda con l'Eaton 3S (solo con un sì esplicito)
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** confermare sulla scheda la riga "Sulla scheda" della Dimostrazione: cicli su porta reale, nessun riavvio, nessun banner.

      **Leggere:** memoria sulle credenziali OTA (file JSON, mai stamparlo), stato attuale della scheda di test (oggi su enum-delay-v1), sezione Strategia di test del piano.

      **Modificare:** nuovo `docs/test-results/US-139/` con il System Log esportato e un breve esito.

      **Passi:**
      1) chiedere all'utente un sì esplicito prima di toccare la scheda;
      2) build `esp32-s3-standard` con `PLATFORMIO_BUILD_FLAGS=-DNUT_TEST_ENUM_WATCHDOG=2`, caricarla via OTA (riavvio software, contatore 0);
      3) dopo ~3 min esportare il System Log: due righe INFO "No UPS enumerated 1/2 min after boot ... (1/2)" e "(2/2)", l'UPS che si stacca e torna ogni volta, nessun riavvio, nessun banner, nessun WARN "power off/on failed";
      4) caricare la build normale via OTA: con l'UPS collegato nessuna riga dei cicli;
      5) lasciare sulla scheda la build che l'utente indica.

      **Verifica:** log salvati in `docs/test-results/US-139/`.

      **Fatto:** esito riportato all'utente; se la porta non si comporta come atteso, fermarsi e segnalarlo prima della review.

      **Blocchi:** serve il consenso dell'utente; un blackout lascia Claude senza rete (l'Eaton alimenta scheda e router). Il caso della porta vuota senza cavo USB non si può provare da remoto: resta coperto dalla build `=2` e dal reporter della #78.

      ## File Coinvolti
      - docs/test-results/US-139/ — log ed esito della prova

      ## Criteri di Completamento
      - [ ] Sì esplicito dell'utente prima della prova
      - [ ] Due righe INFO, nessun riavvio e nessun banner con la build `=2`
      - [ ] Nessuna riga dei cicli con la build normale e l'UPS collegato
    ref: TASK-06
