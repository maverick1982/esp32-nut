  - id: TASK-05
    title: Metodi neutri di IUpsControlPort e QxControl con shutdown.default
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** il controllo Q* implementa `IUpsControl` passando solo da `IUpsControlPort`, con l'elenco dei comandi del protocollo e `shutdown.default` come `upsdrv_shutdown()`.

      **Leggere:** `lib/USBHostUPS/src/IUpsControl.h`, `IUpsControlPort.h`, `HidControl.h` (struttura, `instance()`, `PortLock`, ramo `shutdown.default`), `UpsCommands.h`, `UpsVariables.h`; `nut_repo/drivers/nutdrv_qx.c` righe 3259-3369; sezioni "Metodi nuovi di IUpsControlPort", "QxControl" e "shutdown.default" del piano; `test/test_hid_transport/test_main.cpp` righe 140-200.

      **Modificare:**
      1. `IUpsControlPort.h`: aggiungere `driverCommands()`, `runDriverCommand()`, `runDriverSetVariable()` con i default e i commenti del piano; nessun include nuovo.
      2. Creare `QxControl.h` (dichiarazione del piano, commento di classe: stateless, static lifetime, mai `hidPort()`, le funzioni statiche girano nel task di poll in US-136) e `QxControl.cpp` (intestazione di licenza/derivazione NUT): `instance()`, `supportedCommands`, `executeCommand` (controlli, `shutdown.default`, inoltro), `setVariable`, `commandsOf` (catalogo + `commandOffered()` + le due aggiunte del progetto con commento di deviazione), `runCommand`, `runSetVariable` (mappature del piano).
      3. `shutdown.default`: `noteDefaultShutdown("")`; `shutdown.stop` fino a `QX_MAXTRIES` volte se offerto; `shutdown.return` fino a `QX_MAXTRIES` volte; al primo OK `noteDefaultShutdown("shutdown.return")`. Commento con le due deviazioni (ritardi in vigore, niente `stayoff`).
      4. Include consentiti in `QxControl.*`: `IUpsControl.h`, `UpsCommands.h`, `UpsVariables.h`, `QxEngine.h`, `QxTypes.h`, `UPSData.h`; vietati `IHidControlPort.h`, `HidControl.h`, `IHidTransport.h`, `HIDUsages.h`, `HIDParser.h`, `NutTable.h`, `IUSBHostUPS.h`, `USBHostUPS.h`, `IUpsSource.h`. Mai la stringa `hidPort(`.
      5. `platformio.ini` `[env:native]`: aggiungere `+<../lib/USBHostUPS/src/QxControl.cpp>`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_hid_transport -f test_hid_control -f test_ups_control_port -f test_driver_dispatch` verde (i default della porta non cambiano nulla per gli HID).

      **Fatto quando:** `QxControl` compila in nativo, la porta ha i tre metodi con default, nessuna suite HID cambia.

      **Blocchi:** se `NutTable::SetStatus` in `IUpsControlPort.h` richiede `NutTable.h` (vietato dallo scan), fermarsi: deve bastare `UpsVariables.h`.

      ## File Coinvolti
      - lib/USBHostUPS/src/IUpsControlPort.h — tre metodi neutri con default
      - lib/USBHostUPS/src/QxControl.h — nuovo: classe QxControl
      - lib/USBHostUPS/src/QxControl.cpp — nuovo: implementazione e shutdown.default
      - platformio.ini — QxControl.cpp nel build nativo

      ## Criteri di Completamento
      - [ ] QxControl usa solo IUpsControlPort, nessun include HID, nessun hidPort(
      - [ ] commandsOf in ordine di catalogo, con le due aggiunte documentate
      - [ ] shutdown.default come upsdrv_shutdown(), un tentativo per riga di log tramite port.executeCommand()
      - [ ] Suite HID indicate verdi senza modifiche
    ref: TASK-05
  - id: TASK-06
    title: 'Porta finta e test del controllo Q*: elenco per protocollo, non offerto, shutdown.default, niente hidPort()'
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** `test_qx_control` prova `QxControl` attraverso una porta finta che fa da host, e lo scan dei sorgenti copre i file nuovi.

      **Leggere:** `test/test_ups_control_port/test_main.cpp` e `test/test_hid_control/test_main.cpp` (porte finte esistenti); `QxControl.h`; `QxProtocols.h` (`QX_SUBDRIVER_LIST`); `test/mocks/QxTestingTables.h`; sezione "Strategia di test", parte controllo e sorgenti, del piano.

      **Modificare:**
      1. Creare `test/mocks/QxFakeControlPort.h`: `IUpsControlPort` con riferimento a `QxEngine` e a `UPSData`, flag `connected` e `recognised`; `lock/unlock` vuoti; `driverCommands()` → `recognised ? QxControl::commandsOf(engine) : {}`; `runDriverCommand`/`runDriverSetVariable` → funzioni statiche di `QxControl`; `executeCommand(name, param)` registra la chiamata e richiama `QxControl::instance().executeCommand(*this, ...)` come l'host; `noteDefaultShutdown` registra `via`; override di `hidPort()` (entrambe le versioni) e `setBeeper()` che incrementano contatori. Il file non contiene la stringa `hidPort(` fuori dagli override necessari: è sotto `test/`, fuori dallo scan della libreria.
      2. Test in `test_qx_control`: per ogni protocollo di `QX_SUBDRIVER_LIST` (con la sua tabella testing) l'elenco esatto di 11 nomi in ordine di catalogo (vedi piano); riga di comando SKIP sparisce; `recognised = false` → elenco vuoto, `executeCommand` NOT_SUPPORTED, `sent` invariato; `connected = false` → elenco vuoto, NOT_CONNECTED; `beeper.enable` e `load.off.delay` → NOT_SUPPORTED senza invio; `beeper.toggle` → OK e `Q\r`; `shutdown.default` nei tre scenari del piano (sequenza esatta di `sent`, `via` registrato, numero di tentativi); `setVariable` OK, UNKNOWN fuori intervallo, NOT_CONNECTED, valore nullo CONVERSION_FAILED. In `tearDown` (o alla fine di ogni test) contatori `hidPort()` e `setBeeper()` a 0.
      3. `test/test_hid_transport/test_main.cpp`: aggiungere `lib/USBHostUPS/src/QxControl.h` e `QxControl.cpp` a un controllo sugli include vietati (stessa lista di `test_control_hook_is_protocol_neutral`) e controllare l'assenza di `hidPort(`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_control -f test_hid_transport` verde.

      **Fatto quando:** sono provati l'elenco per ogni protocollo portato, il caso senza protocollo, il comando non offerto, `shutdown.default` e l'assenza di chiamate a `hidPort()`.

      **Blocchi:** se l'elenco di un protocollo non è quello atteso perché la sua tabella non ha uno dei dieci comandi, verificare la tabella upstream e correggere l'atteso solo se upstream conferma.

      ## File Coinvolti
      - test/mocks/QxFakeControlPort.h — nuovo: porta finta che fa da host
      - test/test_qx_control/test_main.cpp — test di QxControl
      - test/test_hid_transport/test_main.cpp — QxControl tra i file senza include HID

      ## Criteri di Completamento
      - [ ] Elenco esatto per i sei protocolli portati
      - [ ] Senza protocollo: elenco vuoto; non connesso: NOT_CONNECTED
      - [ ] Comando non offerto senza invio
      - [ ] shutdown.default nei tre scenari
      - [ ] hidPort() e setBeeper() mai chiamati; scan dei sorgenti verde
    ref: TASK-06
