      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** `test_qx_control` prova `QxEngine::setvar()` sulle righe vere di megatec e sul sottodriver di prova.

      **Leggere:** `test/test_qx_control/test_main.cpp` (helper e sottodriver di prova di TASK-02); sezione "Strategia di test", parte setvar, del piano.

      **Modificare:**
      1. Megatec: `ups.delay.start` `600` → Handled e `data.get("ups.delay.start") == "600"`; `90` → `60`; `600000` → Unknown, valore invariato, `sent` invariato; `abc` e `-5` → Unknown; stesso valore → Handled senza invio; `ups.delay.shutdown` `45` → `42`, `11` → Unknown, `600` → Handled; `ups.beeper.status` → Unknown; `val` vuoto → Unknown.
      2. `shutdown.return` dopo `ups.delay.shutdown=120` e `ups.delay.start=60` manda `S02R0001\r`.
      3. Sottodriver di prova: riga ENUM sul dispositivo accettata (`ACK`, Handled, poll completo dopo), rifiutata per eco (Unknown), valore fuori enumerazione (Unknown senza invio); riga STRING con lunghezza massima 4: `"abcde"` → Unknown; riga RANGE con due coppie (es. 1-5 e 10-20): `7` → Unknown, `12` → Handled.
      4. Un SET VAR ABSENT non rende completo il poll successivo (niente `_dataChanged`).

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_control` verde.

