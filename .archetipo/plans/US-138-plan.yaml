  # US-138: Protocollo hunnox e impostazioni protocol e novendor in Board Settings, con build di test per #91 e #28 — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-07

  ---

  ## Spec

  **Epic:** EP-007 — Supporto UPS Q* (nutdrv_qx)
  **Priorità:** MEDIUM | **Punti:** 3

  **User Story**
  Come utente con un UPS Q* che NUT fa funzionare solo con `protocol` e `novendor` in `ups.conf` (come tda2806 con il VIDA Armour 1200VA di #91), voglio scegliere il protocollo e attivare `novendor` nella pagina Board Settings, in modo che la scheda parli con il mio UPS come NUT, e che i reporter di #91 e #28 possano provarlo con una build di test.

  **Criteri di Accettazione**
  - Protocollo `hunnox` portato da `nutdrv_qx_hunnox.c` come in US-133, con i test della sua tabella `testing_t` (compreso `BL` per la carica della batteria).
  - Board Settings mostra la sezione del driver Q* solo quando è agganciato un UPS Q*; con un UPS HID o senza UPS non compare.
  - `protocol`: "Automatico" (predefinito) o uno dei protocolli portati, con i nomi di NUT; `novendor` spento per default; valori in NVS, validi dopo un riavvio.
  - Il salvataggio applica i valori senza riavviare la scheda: il riconoscimento riparte con il protocollo forzato e con `novendor` (niente domanda sul firmware nel claim, niente indice 0x0c nella sequenza di hunnox). Il System Log scrive la modifica e chi l'ha fatta.
  - Protocollo e opzioni attive nella sezione Q* dell'export diagnostico.
  - e2e della sezione Board Settings.
  - Build di test (zip OTA) per #91 e #28 con le istruzioni; "Refs #N"; il supporto Q* va in release solo dopo la conferma di almeno uno dei due.

  ---

  ## Soluzione tecnica

  Tutti i pezzi esistono già (US-133…137): motore, prober con `configure(protocol, options)`, trasporto hunnox, export Q*. US-138 porta l'ultimo protocollo e collega le due impostazioni dalla NVS fino al prober e al trasporto, passando per il task di poll, senza riavvio.

  - **Protocollo hunnox.** `lib/USBHostUPS/src/QxHunnox.cpp` copia riga per riga `nut_repo/drivers/nutdrv_qx_hunnox.c` ("Hunnox 0.03", `blazerClaim`, risposta accettata "UPS No Ack", ritardi `ups.delay.start` "0" e `ups.delay.shutdown` "60" come nella tabella upstream, non i DEFAULT_*), con `hunnoxBatteryCharge()` che legge `qx.answer()` come `hunnox_battery_charge()` legge `item->answer`. In `QX_SUBDRIVER_LIST` prende il posto del commento `// &hunnox_subdriver, (US-138)`, dopo zinto: in automatico non viene mai scelto perché zinto (stesso claim) viene prima, come upstream (ADR 0013).
  - **Perché serve `novendor` per #91.** `blazerClaim` chiede `FW?` dopo `Q1`, ma la tabella dei comandi del trasporto hunnox non codifica `FW?` (solo Q1, F, I, Q, C, BL): il comando viene restituito come eco e il claim fallisce. Con `novendor` il claim si ferma a `Q1`. È lo stesso motivo per cui tda2806 usa `novendor` con NUT.
  - **`novendor` nel trasporto.** `QxUsbTransport` riceve `virtual void setOptions(const QxOptions&) {}`; `QxHunnoxTransport` lo ridefinisce e nel passo 3 del preambolo salta l'indice 0x0c con `novendor`, come `hunnox_protocol()` (`nutdrv_qx.c:1276`: `if (asking_for != 0x0c && !testvar("novendor"))`). Il commento "novendor option is not ported" va aggiornato.
  - **Nomi dei protocolli.** In `QxProtocols.h/.cpp` due funzioni pure: `qxProtocolName(sub, out, outlen)` (nome prima dello spazio, minuscolo: "mustek", "megatec/old", "megatec", "zinto", "hunnox", "innovatae", "q1") e `qxFindProtocol(name, list = QX_SUBDRIVER_LIST)` (via `qxProtocolMatches`, nullptr per null, "" o nome sconosciuto). Costante `QX_PROTOCOL_NAME_MAX = 16`. La lista che vede l'utente segue l'ordine di `QX_SUBDRIVER_LIST`.
  - **Modello e NVS.** `BoardSettings` (`include/board/board_settings.h`) riceve `char qx_protocol[QX_PROTOCOL_NAME_MAX]` ("" = automatico) e `bool qx_novendor` (false), in fondo alla struct. `sanitize()` riporta a "" un nome che `qxFindProtocol` non conosce (NVS corrotta, protocollo tolto in futuro) e lo riscrive col nome canonico minuscolo: un valore sbagliato non blocca nulla (ADR 0010, PDR 0002 D4). `BoardSettingsStore` usa le chiavi `qx_proto` (stringa) e `qx_novendor` (bool) nel namespace "board".
  - **Applicazione senza riavvio.** `USBHostUPS::setQxSettings(protocol, novendor)` (qualsiasi task) copia i valori sotto `_mutex` e incrementa una generazione. Il task di poll, prima del passo del driver, confronta la generazione con quella applicata; se cambia e c'è un `QxDriver`, copia i valori sotto lock e chiama `QxDriver::configure()` **senza lock** (ADR 0008). `attachQxDriver()` configura il driver nuovo con i valori correnti prima di `setup()`, così anche un aggancio dopo il riavvio usa la NVS. `main.cpp` chiama `setQxSettings()` con i valori caricati prima di `usb_ups.begin()`.
  - **`QxDriver::configure(protocol, options)`.** Salva le opzioni, chiama `_prober.configure()` e `_transport->setOptions()`. Se il driver era già partito (stato diverso dal primo Probing dopo `setup()`): butta il motore, torna in Probing, azzera `_firstWalkDone`, `_stale`, `_walkStarted`, `_lastProtocol`, svuota `_commands` sotto lock e toglie dall'ombra tutte le chiavi tranne `driver.name`, `ups.vendorid`, `ups.productid` (come `dropProtocolValues`, con `remove()` così `publish()` le toglie anche dai dati dell'host). Scrive `[Q*] Settings changed (protocol: <nome|auto>, novendor: on|off): detecting the protocol again`. Lato host, `applyQxSettings` rimette `_first_data_ready = false` e `_claimed_at = millis()` come `attachQxDriver()`, così Web UI e server NUT tornano ad "attesa dei primi dati" fino al primo walk del nuovo protocollo (`firstDataWaitBounded()` è false sul Q*: nessun timeout).
  - **API.** `GET /api/board` aggiunge `"qx":{"protocol":"","novendor":false,"protocols":[...],"detected":"Megatec 0.10"}` **solo** quando è agganciato un `QxDriver` (`detected` vuoto finché nessun protocollo ha fatto il claim). Un UPS Q* con trasporto non ancora portato ("Not supported yet") non ha `QxDriver`: la sezione non compare, perché le impostazioni non avrebbero effetto. `POST /api/board` accetta `qx_protocol` (stringa: "" oppure un nome noto, senza distinzione di maiuscole, salvato in minuscolo; altrimenti 400 "Invalid protocol") e `qx_novendor` (bool, altrimenti 400 "Invalid request"); sono accettati anche senza UPS Q* (sono configurazione della scheda, valgono al prossimo aggancio). La risposta resta `{"success":true,"restart":false}`.
  - **Log.** `WebConfigServer::handleSetBoard` scrive, solo se i valori Q* cambiano, `[BOARD] Q* driver settings: protocol <nome|auto>, novendor on|off (by '<utente>')` con `webUiUser()`, poi chiama `usb_ups->setQxSettings()` (con `usb_ups` nullo salva soltanto).
  - **Export.** `UsbDiagQx` riceve `bool novendor`, che `fillDiagnostics()` riempie dalle opzioni del driver; `UsbDiagJson::qxSection` scrive `"novendor"` subito dopo `"forced_protocol"`. Con `qx.present` falso l'export HID non cambia.
  - **Web UI.** Nuova `section.board-section#qx-section` in `data/www/index.html`, subito dopo `#usb-section`, con lo stile delle sezioni esistenti (`cred-section`, `board-row`, `switch`, `form-actions`, `auth-alert`): titolo "Q* UPS driver", riga "Detected protocol" (`#qx-detected`, "Not detected yet" se vuoto), `select#qx-protocol` ("Automatic" con valore "", poi i nomi di `protocols`), switch `#qx-novendor` con lo stato `#qx-novendor-state`, pulsante `#btn-save-qx` "Save" abilitato solo con modifiche, esito `#qx-result` ("Saved · detecting the protocol again"), errore `#qx-error`/`#qx-error-text`, nota fine che un valore sbagliato lascia l'UPS senza dati ma non blocca la scheda. `renderBoard()` mostra la sezione solo se `board.qx` è un oggetto. Dopo la modifica: `python scripts/inline_web.py` e `python scripts/embed_web.py`.
  - **Niente mockup:** è una sezione in più dentro una pagina esistente, fatta coi componenti già presenti (select + switch + salva, come la sezione Time).
  - **Fuori dallo scope:** `langid_fix`, `noscanlangid`, `subdriver`, `norating`, `ignoresab` (ADR 0013: si aggiungono quando servono a un tester); catalogo RW Q*; pubblicazione della release.

  ---

  ## Strategia di test

  Test nativi Unity per ogni pezzo puro, e2e Playwright per la sezione della pagina, build e misura della flash, poi la build di test per i reporter.

  - `test_qx_protocols`: valori della tabella `hunnox_testing` (copiata in `test/mocks/QxTestingTables.h`) con il motore, compreso `BL100` → `battery.charge` 100; risposte `BL101`, `BL-1` e `XX100` → nessun valore (preprocess -1); claim che manda `Q1` e `FW?`, e solo `Q1` con `novendor`; ordine di `QX_SUBDRIVER_LIST` con "Hunnox 0.03" dopo zinto; `qxProtocolMatches(QX_HUNNOX, "HUNNOX")`; `qxProtocolName` e `qxFindProtocol`.
  - `test_qx_probe`: `test_forced_unknown_protocol` passa a un nome non portato ("voltronic"); `protocol = hunnox` prova solo hunnox.
  - `test_qx_usb_transports`: con `novendor` il passo 3 del preambolo non legge 0x0c in un intero giro di lock-step; senza, la sequenza resta quella di US-137.
  - `test_board_settings`: default ("" e false), `sanitize()` di un nome sconosciuto e della forma canonica.
  - `test_qx_driver`: `configure()` a driver avviato fa ripartire il riconoscimento, toglie le chiavi del protocollo precedente tenendo le tre di identità, scrive la riga di log; `configure()` prima di `setup()` non toglie nulla; `fillDiagnostics()` riporta `forced_protocol` e `novendor`.
  - `test_usb_diag_json`: chiave `novendor` nell'oggetto `qx`; export HID invariato.
  - `test_web_api`: `boardSettingsJson` con e senza oggetto `qx`; `checkBoardSettingsBody` per `qx_protocol` ("", "hunnox", "HUNNOX" → "hunnox", "megatec/old", "megatec-old" → 400, numero → 400) e `qx_novendor` (bool, non bool → 400).
  - Regressione: suite nativa completa (1403 test prima di US-138), suite e2e completa (199), 3 build.

  ### Test E2E — Simulazione utente

  **Framework:** Playwright (`playwright.config.ts`, `e2e/support/webui.ts` con `serveIndex`, mock delle API con `page.route`, come `e2e/board-settings.spec.ts`).
  **Video demo:** previsto (la sezione Q* in Board Settings è filmabile con le API simulate); lo registra `archetipo-review`, non l'implementazione.

  | Scenario | Flusso utente |
  |---|---|
  | Nessuna sezione senza UPS Q* | L'utente apre la scheda Board con un UPS HID (risposta senza `qx`) e poi senza UPS: la sezione "Q* UPS driver" non c'è, le altre sezioni sì. |
  | Scelta di hunnox con novendor | Con `qx` nella risposta (protocollo automatico, `detected` vuoto) l'utente vede "Not detected yet", Automatic selezionato, novendor spento e Save disabilitato; sceglie `hunnox`, accende novendor, salva: la POST contiene `{"qx_protocol":"hunnox","qx_novendor":true}`, compare l'esito, nessun conto alla rovescia di riavvio. |
  | Valori ricaricati | L'utente cambia scheda e torna su Board: la nuova GET restituisce i valori salvati, select e switch li mostrano e Save è disabilitato. |
  | Errore di salvataggio | La POST risponde 400 "Invalid protocol": compare l'errore e i controlli tornano ai valori salvati. |

  ---

  ## Note e rischi

  - Flash: la S3 di #93 è già fuori dallo slot da 4 MB; si misura e si annota la crescita (attesa ~2-3 KB) in `docs/test-results/US-138/flash.md`, come US-137.
  - Nessuno dei nostri UPS è Q*: la prova vera la fanno i reporter. La pubblicazione dei commenti e degli zip richiede il sì esplicito dell'utente (lo zip lo allega l'utente modificando il commento); nelle issue "Refs #N", nessuna chiusura.
  - Il reporter di #28 (fabula) tace da agosto: la conferma potrebbe arrivare solo da tda2806.
  - L'ADR 0013 parla di "UPS settings": una nota aggiunta registra la scelta di Board Settings (decisione dell'utente del 2026-11-07).

  _Piano generato con ARchetipo Planning — 2026-11-07_
tasks:
  - id: TASK-01
    title: Portare il protocollo hunnox (QxHunnox.cpp) e inserirlo in QX_SUBDRIVER_LIST
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** aggiungere `QX_HUNNOX`, copia riga per riga di `nut_repo/drivers/nutdrv_qx_hunnox.c`, nella posizione upstream della lista dei protocolli.

      **Leggere:** `nut_repo/drivers/nutdrv_qx_hunnox.c` (tabella `hunnox_qx2nut`, `hunnox_battery_charge`, `hunnox_subdriver`); `lib/USBHostUPS/src/QxZinto.cpp` come modello (stessa struttura, stesse colonne di `QxItem`); `lib/USBHostUPS/src/QxTypes.h`; `lib/USBHostUPS/src/QxProtocols.h/.cpp`; la sezione `[env:native]` di `platformio.ini`.

      **Modificare:**
      - Creare `lib/USBHostUPS/src/QxHunnox.cpp` con `static const QxItem HUNNOX_QX2NUT[]` (stessi flag upstream: qui le righe di Q1 hanno `QX_FLAG_QUICK_POLL`, diversamente da zinto), `hunnoxBatteryCharge(QxEngine& qx, const QxItem& item, char* value, size_t valuelen)` che legge `qx.answer()` (controllo del prefisso "BL", `atoi`, intervallo 0-100, altrimenti -1), riga `battery.charge` con `"BL\r"`, answer_len 6, leading 'B', from 0, to 0, `"%.0f"`, `QX_FLAG_QUICK_POLL`; ritardi `ups.delay.start` "0" e `ups.delay.shutdown` "60" come upstream; `const QxSubdriver QX_HUNNOX = { "Hunnox 0.03", blazerClaim, HUNNOX_QX2NUT, hunnoxInitups, nullptr, "UPS No Ack", nullptr };`.
      - `QxProtocols.h`: `extern const QxSubdriver QX_HUNNOX; // nutdrv_qx_hunnox.c, "Hunnox 0.03"` e commento di testa aggiornato.
      - `QxProtocols.cpp`: sostituire `// &hunnox_subdriver, (US-138)` con `&QX_HUNNOX,` (dopo `&QX_ZINTO`, prima di innovatae).
      - `platformio.ini` `[env:native]`: `+<../lib/USBHostUPS/src/QxHunnox.cpp>` accanto a QxZinto.

      **Passi:** 1) creare il file copiando l'ordine delle righe upstream e i commenti delle risposte; 2) aggiornare lista e header; 3) aggiungere il file alla build nativa; 4) compilare i test Q*.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_protocols -f test_qx_probe -f test_qx_control` compila; i test che controllano l'ordine della lista e `test_forced_unknown_protocol` falliscono finché non arriva TASK-02 (atteso).

      **Fatto quando:** il protocollo è nella lista, compila in nativo, la tabella coincide con quella upstream colonna per colonna.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxHunnox.cpp — nuovo, porting di nutdrv_qx_hunnox.c
      - lib/USBHostUPS/src/QxProtocols.h — extern QX_HUNNOX
      - lib/USBHostUPS/src/QxProtocols.cpp — &QX_HUNNOX nella posizione upstream
      - platformio.ini — QxHunnox.cpp nella build nativa

      ## Criteri di Completamento
      - [ ] `QX_HUNNOX` ha nome "Hunnox 0.03", `blazerClaim`, accepted "UPS No Ack"
      - [ ] La tabella ha le stesse righe, nello stesso ordine e con gli stessi flag di `hunnox_qx2nut`
      - [ ] `hunnoxBatteryCharge` restituisce -1 per prefisso diverso da "BL" e per valori fuori da 0-100
      - [ ] `QX_SUBDRIVER_LIST` ha hunnox dopo zinto e prima di innovatae
      - [ ] La build nativa compila QxHunnox.cpp
    ref: TASK-01
  - id: TASK-02
    title: 'Test del protocollo hunnox: tabella testing_t, BL, claim con e senza novendor, ordine della lista'
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** provare hunnox come gli altri protocolli di US-133/134, con la tabella `hunnox_testing` upstream.

      **Leggere:** `test/mocks/QxTestingTables.h` (forma di `ZINTO_TESTING`); `test/test_qx_protocols/test_main.cpp` (`assertBlazerTestingValues`, `assertClaimSends`, test dell'ordine della lista intorno alla riga 260, test di `qxProtocolMatches`); `test/test_qx_probe/test_main.cpp` (`test_forced_unknown_protocol`, riga ~272); `lib/USBHostUPS/src/QxEngine.cpp` `qx_battery` (riga ~588) per capire quale `battery.charge` resta.

      **Modificare:**
      - `QxTestingTables.h`: `HUNNOX_TESTING[]`, copia di `hunnox_testing[]` (`nutdrv_qx_hunnox.c`), compreso `{ "BL\r", "BL100\r", -1 }`.
      - `test_qx_protocols`: `test_hunnox_testing_values` (valori di Q1, F, FW? come zinto, più `battery.charge` = "100" da BL: controllare con upstream, `nutdrv_qx.c:446-477` e `:585`, che il valore di BL prevalga sulla stima; se il port del motore desse un altro risultato, fermarsi e segnalarlo invece di adattare l'asserzione); `test_hunnox_battery_charge_invalid` (BL101, BL-1, XX100 → nessun `battery.charge` dalla riga BL); `test_hunnox_claim_sends_q1_and_fw` (`assertClaimSends(QX_HUNNOX, HUNNOX_TESTING, "Q1\r", "FW?\r")`); `test_hunnox_claim_novendor_sends_only_q1` (`QxOptions` con `novendor = true`); ordine atteso della lista con "Hunnox 0.03" dopo "Zinto 0.07"; `qxProtocolMatches(QX_HUNNOX, "HUNNOX")` vero; comandi istantanei e ritardi "0"/"60" come gli altri test dei comandi, se esiste un test che scorre la lista (`test_qx_control` riga ~526) verificare che passi.
      - `test_qx_probe`: `test_forced_unknown_protocol` usa "voltronic" (non portato) al posto di "hunnox", stesso messaggio con il nuovo nome; nuovo `test_forced_hunnox_tries_only_hunnox` (con `HUNNOX_TESTING` e `novendor`: il prober manda solo `Q1` e fa il claim di "Hunnox 0.03").

      **Passi:** aggiungere la tabella, poi i test, registrarli in `main()` con `RUN_TEST`.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_protocols -f test_qx_probe -f test_qx_control -f test_qx_engine` tutti verdi.

      **Fatto quando:** i quattro gruppi di test passano.

      **Blocchi:** se `battery.charge` non risulta 100 con la tabella upstream, è un caso da discutere con l'utente.

      ## File Coinvolti
      - test/mocks/QxTestingTables.h — HUNNOX_TESTING
      - test/test_qx_protocols/test_main.cpp — test di hunnox, ordine della lista
      - test/test_qx_probe/test_main.cpp — protocollo sconosciuto e protocollo hunnox forzato

      ## Criteri di Completamento
      - [ ] `HUNNOX_TESTING` coincide con `hunnox_testing[]` upstream
      - [ ] `BL100` dà `battery.charge` 100; le risposte non valide non danno valore
      - [ ] Il claim manda Q1 e FW?, e con novendor solo Q1
      - [ ] Il test dell'ordine di `QX_SUBDRIVER_LIST` include hunnox
      - [ ] `test_forced_unknown_protocol` usa un nome non portato; hunnox forzato prova solo hunnox
      - [ ] test_qx_protocols, test_qx_probe, test_qx_control, test_qx_engine verdi
    ref: TASK-02
  - id: TASK-03
    title: 'novendor nel trasporto hunnox: setOptions() e passo 3 del preambolo senza 0x0c, con i test'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** il trasporto hunnox salta la lettura dell'indice 0x0c nel passo 3 del preambolo quando `novendor` è attivo, come `hunnox_protocol()` (`nut_repo/drivers/nutdrv_qx.c:1275-1280`).

      **Leggere:** `lib/USBHostUPS/src/QxUsbTransport.h`; `lib/USBHostUPS/src/QxUsbKrauler.h/.cpp` (`QxHunnoxTransport::preamble`, riga ~236); `test/test_qx_usb_transports/test_main.cpp` (test hunnox dalla riga 387); `test/mocks/FakeQxUsbPrimitives.h`.

      **Modificare:**
      - `QxUsbTransport.h`: `virtual void setOptions(const QxOptions& options) { (void)options; }` con commento "le opzioni di ups.conf che il sottodriver USB legge con testvar(); di base nessuna"; includere `QxTypes.h`.
      - `QxUsbKrauler.h`: `QxHunnoxTransport` ridefinisce `setOptions()` e salva `bool _novendor = false`; commento di testa: novendor ora portato, langid_fix e noscanlangid no.
      - `QxUsbKrauler.cpp`: caso 3 `if (askingFor != 0x0c && !_novendor)`; aggiornare il commento "The novendor option is not ported".
      - `test_qx_usb_transports`: `test_hunnox_novendor_skips_0x0c_in_the_preamble` (cinque comandi Q1 con `novendor`: nessuna GET_DESCRIPTOR su 0x0c nel passo 3, gli altri passi invariati); `test_hunnox_options_default_reads_0x0c` (senza `setOptions`, la sequenza di `test_hunnox_preamble_lock_step_over_five_commands` resta uguale).

      **Passi:** interfaccia, override, condizione, test.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_usb_transports` verde.

      **Fatto quando:** krauler e fabula ignorano le opzioni, hunnox rispetta `novendor`, i test di US-137 restano verdi.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxUsbTransport.h — setOptions() virtuale
      - lib/USBHostUPS/src/QxUsbKrauler.h — override in QxHunnoxTransport, commento
      - lib/USBHostUPS/src/QxUsbKrauler.cpp — passo 3 condizionato a novendor
      - test/test_qx_usb_transports/test_main.cpp — due test nuovi

      ## Criteri di Completamento
      - [ ] Con novendor il passo 3 non legge 0x0c; senza, la sequenza è quella di US-137
      - [ ] krauler e fabula non cambiano comportamento
      - [ ] Il commento sulle opzioni non portate è aggiornato
      - [ ] test_qx_usb_transports verde
    ref: TASK-03
  - id: TASK-04
    title: Nomi dei protocolli (qxProtocolName, qxFindProtocol) e impostazioni qx_protocol/qx_novendor in BoardSettings e NVS
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** il modello delle due impostazioni nuove, salvate in NVS e ripulite da `sanitize()`.

      **Leggere:** `lib/USBHostUPS/src/QxProtocols.h/.cpp`; `include/board/board_settings.h`; `src/core/board_settings_store.h/.cpp`; `test/test_board_settings/test_main.cpp`.

      **Modificare:**
      - `QxProtocols.h/.cpp`: `static const size_t QX_PROTOCOL_NAME_MAX = 16;`; `size_t qxProtocolName(const QxSubdriver& sub, char* out, size_t outlen)` (parte di `sub.name` prima del primo spazio, in minuscolo, troncata a outlen-1; restituisce la lunghezza); `const QxSubdriver* qxFindProtocol(const char* name, const QxSubdriver* const* list = QX_SUBDRIVER_LIST)` (primo `sub` con `qxProtocolMatches(*sub, name)`; nullptr se name è null o "").
