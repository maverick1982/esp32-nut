      - src/core/board_settings_store.cpp — chiavi qx_proto e qx_novendor

      ## Criteri di Completamento
      - [ ] `qxProtocolName` dà "megatec/old", "innovatae", "hunnox", "q1" dai nomi con versione
      - [ ] `qxFindProtocol` non distingue maiuscole e dà nullptr per null, "" e nomi sconosciuti
