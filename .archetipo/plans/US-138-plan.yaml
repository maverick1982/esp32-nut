    body: |-
      ## Descrizione
      **Obiettivo:** la sezione che l'utente usa per scegliere protocollo e novendor, visibile solo con un UPS Q*.

      **Leggere:** `data/www/index.html` (scheda Board dalla riga 490: `#usb-section`, `#autosd-section`, `#time-section` con select e salvataggio); `data/www/bundle.js` (Board dalla riga ~2949: `postBoard`, `renderAutoShutdown`, `renderBoard`, `loadBoard`, `BOARD_RESULT_MS`, `BOARD_SPINNER`); `scripts/inline_web.py`, `scripts/embed_web.py`.

      **Modificare:**
      - `index.html`: dopo `#usb-section`, `<section class="board-section" id="qx-section" hidden>` con `cred-section` "Q* UPS driver"; testo `board-hint` "Options of the NUT nutdrv_qx driver, as protocol and novendor in ups.conf. Change them only if the UPS is not detected, or as NUT needs for your model."; riga "Detected protocol" con `<span id="qx-detected">`; riga "Protocol" con `<select id="qx-protocol" aria-label="Q* protocol">`; riga "novendor" (hint "Do not ask the UPS for vendor information (FW? / I), as novendor in ups.conf.") con switch `#qx-novendor` e `#qx-novendor-state`; `form-actions` con `button#btn-save-qx` "Save" (disabilitato); `cmd-result#qx-result`; `auth-alert#qx-error` con `#qx-error-text`; `auth-fineprint` "A wrong value leaves the UPS without data, but does not lock you out of the board: set Automatic again here.". Solo classi già esistenti.
      - `bundle.js`: `renderQx()` (sezione nascosta se `board.qx` non è un oggetto; opzioni del select: "Automatic" con valore "" più `board.qx.protocols` filtrati a stringhe non vuote; valore e switch da `board.qx`; `#qx-detected` = `detected` oppure "Not detected yet"; Save abilitato solo se select o switch differiscono dai valori salvati e nessun salvataggio è in corso); `change` di select e switch → aggiorna Save e lo stato On/Off; click di Save → `postBoard({ qx_protocol, qx_novendor })`; ok: aggiorna `board.qx`, esito "✓ Saved · detecting the protocol again" che sfuma come gli altri (`BOARD_RESULT_MS`); errore: `r.message` in `#qx-error` e controlli riportati ai valori salvati. `renderBoard()` chiama `renderQx()`. Nessun conto alla rovescia di riavvio.
      - Rigenerare: `python scripts/inline_web.py` poi `python scripts/embed_web.py`.

      **Passi:** markup, logica, rigenerazione, prova manuale con l'e2e di TASK-12.

      **Verifica:** `npx playwright test e2e/board-settings.spec.ts` resta verde; i file inlined e `web_assets.h` (o equivalente generato da embed_web.py) sono aggiornati.

