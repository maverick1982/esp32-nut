  - id: TASK-08
    title: 'USBHostUPS: setQxSettings() applicato nel task di poll, informazioni Q* per la Web UI, avvio da NVS'
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** portare le impostazioni dalla Web UI al driver Q* senza riavvio e senza tenere lock durante i trasferimenti (ADR 0008).

      **Leggere:** `lib/USBHostUPS/src/USBHostUPS.h/.cpp` (`attachQxDriver` riga ~809, passo di poll intorno alle righe 385-420 con `serviceQxRequest(true)` e `_driver->poll`, `_first_data_ready`, `_claimed_at`, `fillUsbDiag` riga ~1750); `src/core/main.cpp` (righe 148-260: caricamento di `board_settings`, `usb_ups.begin()`).

      **Modificare:**
      - `USBHostUPS.h`: `void setQxSettings(const char* protocol, bool novendor);` (qualsiasi task); `bool qxDriverInfo(String& detected) const;` (vero se `_driver` e `_driver->qx()` esistono; `detected` = nome del protocollo riconosciuto, vuoto prima del claim; sotto `_mutex`); membri `char _qx_protocol[QX_PROTOCOL_NAME_MAX] = ""`, `bool _qx_novendor = false`, `uint32_t _qx_settings_gen = 0`, `uint32_t _qx_settings_applied = 0`. Se `QxDriver` non espone il protocollo riconosciuto, aggiungere `const char* claimedProtocol() const` (nome del `QxSubdriver` di `_prober.claimed()`, "" se nessuno).
      - `USBHostUPS.cpp`: `setQxSettings` copia sotto `_mutex` e incrementa `_qx_settings_gen`. Nuova `applyQxSettings(uint32_t now)` chiamata nel passo di poll subito prima di `serviceQxRequest(true)`: se `_driver && _driver->qx() && _qx_settings_applied != _qx_settings_gen`, copia protocollo/novendor/gen sotto `_mutex`, chiama `q->configure(...)` fuori dal lock, poi sotto `_mutex` mette `_first_data_ready = false`, `_claimed_at = millis()`, `_qx_settings_applied = gen`. In `attachQxDriver()`, dopo `new QxDriver(...)` e prima di `setup()`, `configure()` con i valori correnti e `_qx_settings_applied = _qx_settings_gen` (siamo già sotto `_mutex`: configure prima di setup non prende lock dell'host? verificare: `configure` prende `HostLock` solo se `_started`, quindi qui no; `_mutex` è ricorsivo comunque).
      - `main.cpp`: subito dopo `setPeripheralMap(...)`, `usb_ups.setQxSettings(board_settings.qx_protocol, board_settings.qx_novendor);`.

      **Passi:** API e membri, applicazione nel poll, aggancio, main.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` da PowerShell compila; suite nativa completa verde (USBHostUPS.cpp non compila in nativo: rileggere a mano il percorso lock/no-lock).

      **Fatto quando:** le impostazioni salvate valgono all'aggancio e una modifica arriva al driver al passo di poll successivo, senza lock durante configure().

      **Blocchi:** se `_first_data_ready = false` facesse scattare un timeout dei primi dati sul percorso Q*, fermarsi e segnalarlo (atteso: nessun timeout, `firstDataWaitBounded()` falso).

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.h — setQxSettings, qxDriverInfo, membri
      - lib/USBHostUPS/src/USBHostUPS.cpp — applyQxSettings nel poll, configure in attachQxDriver
      - lib/USBHostUPS/src/QxDriver.h — claimedProtocol() se serve
      - src/core/main.cpp — setQxSettings dai valori in NVS prima di begin()

      ## Criteri di Completamento
      - [ ] Le impostazioni da NVS arrivano al driver al primo aggancio
      - [ ] Una modifica a caldo viene applicata nel task di poll, mai sotto `_mutex` durante configure()
      - [ ] `qxDriverInfo()` è vero solo con un `QxDriver` agganciato
      - [ ] Dopo la modifica host e Web UI tornano ad attendere i primi dati
      - [ ] Build S3 ok, suite nativa verde
    ref: TASK-08
