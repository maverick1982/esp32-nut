  - id: TASK-06
    title: QxDriver::configure() che fa ripartire il riconoscimento, novendor nell'export diagnostico
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** il driver Q* riceve protocollo e opzioni in qualsiasi momento e, se era già partito, ricomincia il riconoscimento con i valori nuovi; l'export riporta le opzioni attive.

      **Leggere:** `lib/USBHostUPS/src/QxDriver.h/.cpp` (`setup`, `poll`, `dropProtocolValues`, `fillDiagnostics`); `lib/USBHostUPS/src/QxProbe.h/.cpp` (`configure`, `restart`); `lib/USBHostUPS/src/UsbDiagSnapshot.h` (`UsbDiagQx`); `lib/WebApi/src/UsbDiagJson.cpp` (`qxSection`, riga ~130).

      **Modificare:**
      - `QxDriver.h/.cpp`: `void configure(const char* protocol, const QxOptions& options);` (thread: task di poll, o prima di `setup()`) e membro `QxOptions _options`. Implementazione: `_options = options; _prober.configure(protocol, options); _transport->setOptions(options);`; se `_started` (nuovo bool messo a true dal primo `poll()` dopo `setup()`, a false in `setup()`): `_engine.reset(); _state = State::Probing; _firstWalkDone = false; _stale = false; _walkStarted = false; _lastProtocol = nullptr;` `_commands.clear()` sotto `HostLock`; togliere dall'ombra con `remove()` tutte le chiavi tranne `driver.name`, `ups.vendorid`, `ups.productid` (estrarre da `dropProtocolValues` una funzione privata `dropValuesExceptIdentity()` usata da entrambe); log INFO `[Q*] Settings changed (protocol: <nome o auto>, novendor: on|off): detecting the protocol again`. Il `publish()` del passo successivo propaga la rimozione.
      - `UsbDiagSnapshot.h`: `bool novendor = false; // the novendor setting (US-138)` in `UsbDiagQx`, dopo `forced_protocol`.
      - `QxDriver::fillDiagnostics`: `out.novendor = _options.novendor;`.
      - `UsbDiagJson.cpp` `qxSection`: `key(w, 2, "novendor", false); raw(w, q.novendor ? "true" : "false");` (o l'helper booleano già usato nel file) subito dopo `forced_protocol`.

      **Passi:** configure e stato, funzione comune di pulizia, export.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_qx_driver -f test_usb_diag_json` compila (le attese nuove arrivano in TASK-07).

      **Fatto quando:** configure applica i valori al prober e al trasporto, ricomincia se serve, e l'export scrive `novendor`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/QxDriver.h — configure(), _options, _started
      - lib/USBHostUPS/src/QxDriver.cpp — implementazione, pulizia comune, fillDiagnostics
      - lib/USBHostUPS/src/UsbDiagSnapshot.h — UsbDiagQx::novendor
      - lib/WebApi/src/UsbDiagJson.cpp — chiave novendor nell'oggetto qx

      ## Criteri di Completamento
      - [ ] `configure()` prima di `setup()` o prima del primo poll non toglie dati e non scrive log
      - [ ] `configure()` a driver avviato riporta lo stato a Probing e toglie le chiavi tranne le tre di identità
      - [ ] Il log della modifica scrive protocollo (o auto) e novendor
      - [ ] Le opzioni arrivano a prober e trasporto
      - [ ] L'export Q* contiene `novendor`
    ref: TASK-06
