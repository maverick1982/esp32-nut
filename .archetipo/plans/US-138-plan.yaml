  - id: TASK-12
    title: e2e Playwright della sezione Q* della pagina Board
    type: Test
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Descrizione
      **Obiettivo:** simulare i flussi utente della sezione Q* con le API finte.

      **Leggere:** `e2e/board-settings.spec.ts` (mock di `/api/board`, `openBoardTab`, `serveIndex`); `e2e/support/webui.ts`; `playwright.config.ts`.

      **Modificare:** nuovo `e2e/board-qx.spec.ts` con mock di GET/POST `/api/board` che conserva i valori salvati:
      - `no Q* section with a HID UPS or without UPS` (risposta senza `qx`: `#qx-section` nascosta, `#autosd-section` visibile);
      - `pick hunnox with novendor and save` (risposta con `qx: {protocol: '', novendor: false, protocols: ['mustek','megatec/old','megatec','zinto','hunnox','innovatae','q1'], detected: ''}`: "Not detected yet", Automatic selezionato, switch spento, Save disabilitato; scelta di hunnox e switch acceso; Save → una POST con body `{qx_protocol: 'hunnox', qx_novendor: true}` e content-type JSON; esito con "detecting the protocol again"; nessun `#board-success` di riavvio);
      - `saved values are loaded again` (cambio scheda e ritorno su Board: seconda GET, select su hunnox, switch acceso, Save disabilitato; con `detected: 'Hunnox 0.03'` il testo lo mostra);
      - `save error restores the saved values` (POST 400 `{error: 'Invalid protocol'}`: `#qx-error` visibile con il testo, select e switch di nuovo ai valori salvati).

      **Verifica:** `npx playwright test e2e/board-qx.spec.ts` verde, poi la suite completa `npx playwright test` (199 test prima di US-138) verde.

      **Fatto quando:** i quattro scenari passano insieme a tutta la suite.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - e2e/board-qx.spec.ts — nuovo, quattro scenari

      ## Criteri di Completamento
      - [ ] Sezione assente senza `qx`
      - [ ] Salvataggio di hunnox + novendor con il body atteso e senza riavvio
      - [ ] Valori ricaricati alla riapertura della scheda
      - [ ] Errore mostrato e valori ripristinati
      - [ ] Suite e2e completa verde
    ref: TASK-12
  - id: TASK-13
    title: Documentazione, suite complete, 3 build e misura della flash
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
      - TASK-05
      - TASK-07
      - TASK-10
      - TASK-12
    body: |-
      ## Descrizione
      **Obiettivo:** chiudere la parte di codice: documenti, regressione completa, build e flash.

      **Leggere:** `docs/concepts/architecture.md` (paragrafi Motore Q* e Riconoscimento); `docs/adr/0013-qx-ups-support.md` (riga 84 "Upstream options as UPS settings"); `docs/test-results/US-137/flash.md` come modello.

      **Modificare:**
      - `architecture.md`: protocollo hunnox nella lista, impostazioni `protocol`/`novendor` in Board Settings, percorso NVS → `setQxSettings` → task di poll → `QxDriver::configure()`, riconoscimento che riparte senza riavvio.
      - ADR 0013: nota breve sotto la decisione "Upstream options": con US-138 `protocol` e `novendor` stanno in Board Settings (configurazione della scheda come ups.conf, decisione dell'utente del 2026-11-07); `langid_fix`, `noscanlangid`, `subdriver` restano da fare quando servono.
      - `docs/test-results/US-138/flash.md`: dimensione di firmware.bin S3 rispetto a d8d0430 (2 192 816 B).

      **Passi:** 1) suite nativa completa `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native`; 2) `npx playwright test`; 3) da PowerShell le 3 build usate da US-137 (`esp32-s3-standard` e le due P4); 4) misura e annotazione della flash; 5) documenti.

      **Verifica:** tutti i test verdi, 3 build ok, file dei risultati scritto.

      **Fatto quando:** regressione completa verde e documenti aggiornati.

      **Blocchi:** un test esistente che fallisce per un motivo estraneo a US-138 va segnalato, non disattivato.

      ## File Coinvolti
      - docs/concepts/architecture.md — hunnox e impostazioni Q*
      - docs/adr/0013-qx-ups-support.md — nota su Board Settings
      - docs/test-results/US-138/flash.md — nuovo, misura della flash

      ## Criteri di Completamento
      - [ ] Suite nativa completa verde (più dei 1403 test di prima)
      - [ ] Suite e2e completa verde
      - [ ] 3 build ok
      - [ ] Crescita della flash S3 annotata
      - [ ] architecture.md e ADR 0013 aggiornati
    ref: TASK-13
  - id: TASK-14
    title: 'Build di test (zip OTA ESP32-S3) e bozze dei commenti per #91 e #28, da pubblicare solo col sì dell''utente'
    type: Impl
    status: DONE
    dependencies:
      - TASK-13
    body: |-
      ## Descrizione
      **Obiettivo:** preparare la consegna ai reporter di #91 (tda2806, VIDA Armour 1200VA, hunnox) e #28 (Safire 1500VA, fabula), senza release.

      **Leggere:** la procedura degli zip di prova già usata per `esp32-nut-qx-claim-v1.zip` (README da build di prova nella root); `docs/adr/0013-qx-ups-support.md` sezione 6.

      **Modificare / produrre:**
      - Build `esp32-s3-standard` con `FIRMWARE_VERSION` `qx-hunnox-v1` e zip OTA `esp32-nut-qx-hunnox-v1.zip` nella root (non tracciato), con README da build di prova.
      - Bozze in inglese, da mostrare all'utente in chat: per #91: Board → "Q* UPS driver" → Protocol `hunnox`, `novendor` on, Save (nessun riavvio); dopo 10-15 minuti allegare l'export diagnostico USB (contiene la sezione `qx` con scambi, protocollo e opzioni) e il System Log; cosa controllare (battery.charge, input/output voltage, ups.status). Per #28: prima Protocol Automatic, poi se non riconosciuto `megatec` con novendor on, stesso export. Entrambe con "Refs #91" / "Refs #28", nessuna chiusura, distinguere "ESP32-NUT firmware version" dal firmware dell'UPS, avvertenza che un valore sbagliato lascia solo l'UPS senza dati.
      - Pubblicazione dei commenti solo dopo un sì esplicito dell'utente; lo zip lo allega l'utente modificando il commento.
      - Facoltativo, solo con il consenso esplicito dell'utente: OTA della build sull'Eaton 3S e controllo che la pagina Board non mostri la sezione Q* e che i dati HID non cambino (risultati in `docs/test-results/US-138/`).

      **Verifica:** zip presente e installabile via OTA (struttura come qx-claim-v1); bozze approvate dall'utente.

      **Fatto quando:** zip pronto e bozze consegnate all'utente (o pubblicate, se l'ha chiesto).

      **Blocchi:** nessun commento, push o prova sull'UPS reale senza il sì dell'utente.

      ## File Coinvolti
      - esp32-nut-qx-hunnox-v1.zip — nuovo, non tracciato, nella root
      - docs/test-results/US-138/ — risultati dell'eventuale prova sull'Eaton 3S

      ## Criteri di Completamento
      - [ ] Zip OTA S3 con FIRMWARE_VERSION qx-hunnox-v1 e README da build di prova
      - [ ] Bozze per #91 e #28 con impostazioni, export da allegare e "Refs #N"
      - [ ] Nessuna pubblicazione senza il sì dell'utente
      - [ ] Supporto Q* fuori dalle release finché un reporter non conferma
    ref: TASK-14
