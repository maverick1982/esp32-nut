      **Passi:** helpers puri, poi struct e sanitize, poi store.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_board_settings -f test_web_api -f test_qx_protocols` compila e resta verde; `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` (da PowerShell) compila.

      **Fatto quando:** default ""/false, nome sconosciuto ripulito, valori salvati e riletti dallo store.

      **Blocchi:** nessuno.

      ## File Coinvolti
