schema: archetipo/plan/v2
spec_code: US-028
body: |-
  ## Rework Feedback

  1. Aggiungere in alto un nuovo blocco vicino ai 3 già presenti, con la Potenza reale (W) come già modificato nel mockup
  2. **data/www/ups.css** — Eliminare l'effetto lampeggiante (flash) durante l'aggiornamento dei dati perché è troppo invasivo e fastidioso
  3. **data/www/app.js** — Ad ogni aggiornamento dei dati lo scroll della tabella viene riportato in alto rendendo impossibile leggere i dati nella parte bassa. Modificare la logica di aggiornamento (es. DOM diffing o riutilizzo delle righe esistenti anziché innerHTML='') affinché la posizione dello scroll rimanga fissa dopo gli aggiornamenti

  ## Soluzione Tecnica

  - **Inclusione metrica 'Real Power'**: Aggiungeremo la card in `index.html` e l'aggiornamento dinamico in `app.js` per il campo `ups.realpower`.
  - **Rimozione animazione Flash**: Rimuoveremo il codice in `app.js` che applica la classe `.flash` e il relativo CSS in `ups.css` per evitare fastidi visivi.
  - **Fix Scroll**: Modificheremo `app.js` affinché, invece di svuotare la tabella con `innerHTML = ''`, verifichi se la riga esiste già e ne aggiorni solo il testo, oppure ne crei una nuova se non presente.

  ## Test Strategy
  - Verrà aggiunto un controllo in Playwright per validare la presenza di `ups-realpower`.
