    title: 'GenericDriver filterStatus e OpenUPSDriver: solo hook non tabellari'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** passare OpenUPS alla tabella, con i due hook decisi con l'utente.

      **Leggi:** `lib/USBHostUPS/src/OpenUPSDriver.{h,cpp}`; `GenericDriver::postDecode`/`publishNutRows` (`GenericDriver.cpp`); `CyberPowerDriver.cpp:112` (scale dal PID).

      **Modifica:**
      1. `GenericDriver.h`: `virtual void filterStatus(NutTable::StatusBits& s) const {}` col commento. In `publishNutRows()` passa a `statusKeys()` una copia dei bit filtrata, mai `_nut_ctx.status` modificato.
      2. `OpenUPSDriver`:
         - override `hid2nut()`/`commandTable()` → `NutTable::openupsHid2Nut`, `supersededGenericPaths()`, `formatDeviceStrings()` (`openUPS` senza produttore);
         - `decodeReport`: prima del report, se le scale non sono decise, `get_voltage_multiplier` da `host->getPID()` in `_nut_ctx.openups`; poi `GenericDriver::decodeReport`;
         - `filterStatus`: azzera `nobattery` in `set` e `known` (decisione 1, #26);
         - `postDecode`: base, poi l'hook di oggi per `ups.realpower.nominal`, `ups.load` e `updateRealPower()`, scrivendo solo se il valore cambia (ADR 0007);
         - `kSupersededGenericPaths`: i percorsi generici delle chiavi della tabella, più `UPS.PowerSummary.Temperature` e `battery.capacity.full`;
         - via: mappature, `_map`, `calculateTemperature`, `therm_tbl`, la rimozione di `ups.status.no_battery`, `setup` se resta vuoto.

      **Verifica:** `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_generic_driver -f test_record_replay` compila; le differenze si allineano nel TASK-10.

      **Fatto:** nessuna mappatura scritta a mano in OpenUPSDriver; gli altri driver non cambiano.

      **Blocchi:** se `ups.alarm` legge il bit dal contesto e non dalle chiavi, filtra anche lì.

      ## File Coinvolti
      - lib/USBHostUPS/src/GenericDriver.h — hook filterStatus
      - lib/USBHostUPS/src/GenericDriver.cpp — publishNutRows con i bit filtrati
      - lib/USBHostUPS/src/OpenUPSDriver.h — override
      - lib/USBHostUPS/src/OpenUPSDriver.cpp — scale, filterStatus, postDecode, percorsi superati

      ## Criteri di Completamento
      - [ ] Nessuna mappatura scritta a mano
      - [ ] ups.status della W150 resta OL
      - [ ] Comportamento degli altri driver invariato
