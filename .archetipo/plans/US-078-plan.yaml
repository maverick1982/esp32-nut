    body: |-
      ## Descrizione
      **Obiettivo:** chiudere con suite completa, build e verifica che l'Eaton non cambi (`GenericDriver` è cambiato).

      **Leggi:** `scripts/nut_snapshot.py`; gli script OTA e log di US-076/US-077.

