      1. Suite nativa completa in blocchi da circa 11 suite in foreground (`PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f ...`, limite 600 s). Annota il totale.
      2. Build da PowerShell: `~\.platformio\penv\Scripts\pio.exe run -e esp32-s3-standard`. Annota flash e RAM.
      3. Mutazioni del piano: togliere una citazione da una tabella; invertire `OpenupsOff`; togliere `UPS.PowerSummary.Temperature` dai percorsi superati OpenUPS; togliere `filterStatus`. Ognuna deve far fallire un test; poi ripristina.
      4. Solo con l'ok esplicito dell'utente: OTA sull'Eaton 3S, `nut_snapshot.py` prima e dopo, System Log senza errori USB. Credenziali lette da script, mai stampate.
      5. Bozze dei messaggi ai tester: EcoFlow (PR #66) e W150 (#26), con cosa confrontare (`upsc` prima/dopo), cosa allegare (`usb_diagnostics.json`, System Log). Niente zip né pubblicazione senza richiesta.

      **Verifica:** passi 1-3 verdi; il passo 4 fatto o saltato su decisione dell'utente.

      **Fatto:** numeri annotati per la review, bozze pronte.

