    body: |-
      ## Descrizione
      **Obiettivo:** chiudere la spec con tutte le suite e, con il consenso dell'utente, la dimostrazione sulla scheda.

      **Passi:**
      1. `pio test -e native` completo. Su Windows, rilanciare da sole le suite ERRORED transitorie.
      2. Build di `esp32-s3-standard`, `esp32-p4-eth` ed `esp32-p4-eth-v1`.
      3. `npx playwright test`, suite e2e completa.
      4. Salvare gli esiti in `docs/test-results/US-142/`.
      5. **Solo dopo un sì esplicito dell'utente**, sulla scheda di test con l'Eaton 3S:
         - flash della build S3 via OTA;
         - l'uptime cresce nella barra laterale;
         - Board Settings, Restart con conferma: la pagina si ricarica, l'uptime riparte da pochi secondi, il title dice `SOFTWARE` e la causa manuale, il banner non dice "Last automatic restart" e il System Log ha la riga `[WEB] Restart requested ...` prima del riavvio e `[DIAG] Last controlled restart: Manual restart from the Web UI` dopo;
         - `curl` senza sessione (401), con `Content-Type: text/plain` (415) e tre riavvii di seguito, verificando che `consecutive_restarts` non cambi;
         - l'UPS torna connesso dopo ogni riavvio.

      **Blocchi:** la prova sul campo richiede il consenso esplicito dell'utente.

