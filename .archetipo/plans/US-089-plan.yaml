  - id: TASK-05
    title: Verifica dei vincoli dell'ADR 0008 sui sorgenti USB di ESP-IDF 5.5.5 e annotazione nel piano
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Objective:** Confermare che le protezioni di `hid_host.c` (ADR 0008 e review del layer USB) siano ancora necessarie e corrette sulla 5.5.5, e lasciarne traccia scritta.

      **Read:**
      - `docs/adr/0008-non-blocking-hid-callbacks-and-control-pipe-recovery.md`, `docs/plans/platform-upgrade-idf55.md` §4-§5, `docs/plans/usb-layer-review.md` (A3, A4).
      - Sorgenti di ESP-IDF al tag `v5.5.5` (non la 5.5.2 locale): `components/usb/usb_host.c`, `usbh.c`, `hcd_dwc.c`, `hub.c`, `include/usb/usb_types_stack.h`, da GitHub (`espressif/esp-idf`, tag v5.5.5). Verificare la versione IDF esatta nel `versions.txt` di `framework-arduinoespressif32-libs` della nuova piattaforma.
      - `lib/usb_host_hid/hid_host.c`: tutte le righe marcate `[esp32-nut, ADR 0008]` e `[esp32-nut, review A3/A4]`.

      **Change:**
      - `docs/plans/platform-upgrade-idf55.md`: nuova sezione "Verifica sulla 5.5.5 (US-089)" con, per ciascun vincolo, la conferma e il riferimento file:riga della 5.5.5:
        - EP0 non annullabile/halt/flush da un client (`check_ep_addr()`);
        - `usb_transfer_t::timeout_ms` non supportato;
        - `usb_host_transfer_free()` senza controllo di trasferimento in volo;
        - data toggle in `_pipe_cmd_clear` (review A3);
        - interrupt IN multi-pacchetto che termina solo con pacchetto corto o buffer pieno (review A4);
        - assert `root_dev_uid` del Powercom assente (§3.1).
      - Aggiornare lo **Stato** del piano: "in corso (US-089)".
      - Nessuna modifica a `hid_host.c`.

      **Steps:**
      1. Scaricare solo i file necessari del tag v5.5.5 in una cartella temporanea fuori dal repository.
      2. Verificare i vincoli uno per uno e scrivere la sezione.

      **Verify:**
      - La sezione esiste e cita file e righe della 5.5.5 per ogni vincolo.

      **Done:**
      - Tutti i vincoli confermati, oppure differenze segnalate.

      **Blockers:**
      - Se un vincolo è cambiato in modo che una deviazione di `hid_host.c` diventi sbagliata o inutile, fermarsi e chiedere all'utente prima di procedere con i task hardware.

      ## File Coinvolti
      - docs/plans/platform-upgrade-idf55.md — sezione "Verifica sulla 5.5.5 (US-089)" e stato del piano

      ## Criteri di Completamento
      - [ ] Sei vincoli verificati con riferimento file:riga della 5.5.5
      - [ ] Stato del piano aggiornato
      - [ ] `hid_host.c` invariato, oppure differenze segnalate all'utente
    ref: TASK-05
  - id: TASK-06
    title: Verifica di CI e release con la nuova piattaforma (boot_app0.bin, zip, manifest)
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Objective:** Garantire che la release produca lo stesso pacchetto di oggi con la nuova piattaforma.

      **Read:**
      - `.github/workflows/release.yml` (passi "Build firmware" e "Prepare Artifacts").

      **Change:**
      - Nessuna modifica attesa. Solo se il percorso di `boot_app0.bin` non esiste più nel nuovo pacchetto: aggiornare la ricerca in `release.yml` con il minimo indispensabile.

      **Steps:**
      1. Dopo la build di TASK-02, cercare `boot_app0.bin` con lo stesso comando della CI: `find ~/.platformio/packages -path "*/tools/partitions/boot_app0.bin"`, e verificare che quello trovato per primo appartenga al pacchetto della nuova piattaforma (o che sia identico byte per byte a quello vecchio).
      2. Ricostruire a mano lo zip come la CI (firmware, bootloader, partitions, boot_app0, manifest) e controllare gli offset del manifest (0x0, 0x8000, 0xe000, 0x10000).

      **Verify:**
      - Confronto `cmp` tra il `boot_app0.bin` vecchio e quello nuovo, oppure percorso corretto.

      **Done:**
      - La CI troverebbe un `boot_app0.bin` valido; struttura e nome dello zip invariati.

      **Blockers:**
      - Nessuno previsto.

      ## File Coinvolti
      - .github/workflows/release.yml — solo se il percorso di `boot_app0.bin` è cambiato

      ## Criteri di Completamento
      - [ ] `boot_app0.bin` trovato e corretto con la nuova piattaforma
      - [ ] Zip ricostruito con gli stessi file e gli stessi offset del manifest
    ref: TASK-06
  - id: TASK-07
    title: Prove sull'Eaton 3S - OTA da v1.8.0, flash completo, NVS, Web UI, AP, confronto con la baseline
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-04
      - TASK-05
    body: |-
      ## Descrizione
      **Objective:** Verificare sull'hardware che il comportamento sia quello della v1.8.0 e che l'aggiornamento OTA (bootloader 5.1 + app 5.5) funzioni conservando le impostazioni.

      **Read:**
      - `docs/plans/idf55-baseline/` (TASK-01).
      - README, sezione OTA e flash completo (offset).

      **Change:**
      - Annotare i risultati in `docs/plans/platform-upgrade-idf55.md`, sezione "Validazione sull'Eaton 3S (US-089)". Nessuna modifica al codice.

      **Steps:**
      1. Build con `PLATFORMIO_BUILD_FLAGS='-DFIRMWARE_VERSION=\"idf55-v1\"'`.
      2. Sulla scheda con la v1.8.0 e le impostazioni dell'utente: aggiornamento via OTA dalla Web UI. Verificare che riparta, che Wi-Fi, credenziali NUT, credenziali web (login senza ricrearle), nome UPS e variabili salvate con SET VAR siano conservati.
      3. Confrontare `upsc`, `upscmd -l`, `upsrw` con la baseline: unica differenza ammessa la versione del firmware.
      4. Web UI: login, telemetria, UPS Commands (beeper), UPS Settings, System Log, export diagnostica USB.
      5. Staccare e riattaccare il cavo USB dell'UPS: riconnessione senza riavvio.
      6. Doppio reset: AP `NUT_ESP32_Config`, Web UI raggiungibile; uscita dall'AP.
      7. Dopo almeno 10 minuti, heap `[DIAG]` confrontato con la baseline.
      8. Flash completo con esptool (bootloader 5.5) dallo zip del TASK-06, senza cancellare la flash: riparte con le impostazioni.

      **Verify:**
      - Esito di ogni punto annotato nel piano IDF 5.5.

      **Done:**
      - Tutti i punti verdi, oppure differenze segnalate all'utente con i log.

      **Blockers:**
      - Richiede la scheda e l'Eaton 3S dell'utente. Se l'OTA da v1.8.0 non riparte, fermarsi: va deciso se richiedere il flash completo per questa versione.

      ## File Coinvolti
      - docs/plans/platform-upgrade-idf55.md — sezione "Validazione sull'Eaton 3S (US-089)"

      ## Criteri di Completamento
      - [ ] OTA da v1.8.0 riuscito con NVS conservato (nutos, web_auth, nutrw)
      - [ ] Flash completo riuscito
      - [ ] `upsc`/`upscmd -l`/`upsrw` uguali alla baseline, versione a parte
      - [ ] Web UI, riconnessione USB e AP con doppio reset funzionanti
      - [ ] Heap confrontato con la baseline
    ref: TASK-07
  - id: TASK-08
    title: Prova di core dump e Task WDT con una build temporanea non committata
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Descrizione
      **Objective:** Verificare che la rete di sicurezza dell'ADR 0008 (core dump con `--wrap`, Task WDT a 30 s) funzioni sulla 5.5.

      **Read:**
      - `src/core/crash_diag.cpp` (`__wrap_esp_core_dump_write`, riepilogo del core dump), `src/core/main.cpp` (`setupLoopWatchdog()`).

      **Change:**
      - Solo in una copia di lavoro temporanea, **mai committata**: in `loop()`, dopo 90 s dall'avvio, provocare un panic (`abort()`); in una seconda build, un ciclo bloccante oltre 30 s nel loopTask.
      - Annotare i risultati nel piano IDF 5.5.

      **Steps:**
      1. Build con il panic, flash, attendere il riavvio: verificare nel System Log e nella diagnostica le righe del riavvio (reset reason) e il riepilogo del core dump (task, PC, backtrace).
      2. Build con il blocco: verificare il panic del Task WDT e il riavvio.
      3. Ripristinare il codice (`git diff` vuoto) e riflashare la build di TASK-07.

      **Verify:**
      - `git status` e `git diff` senza modifiche ai sorgenti dopo la prova.

      **Done:**
      - Core dump e Task WDT verificati; nessuna traccia delle modifiche temporanee nel repository.

      **Blockers:**
      - Se il core dump non viene salvato o il riepilogo non si legge, fermarsi: la funzione intercettata dal `--wrap` potrebbe avere cambiato nome (piano IDF 5.5 §5).

      ## File Coinvolti
      - docs/plans/platform-upgrade-idf55.md — risultati della prova (nessun sorgente modificato in modo permanente)

      ## Criteri di Completamento
      - [ ] Panic: core dump salvato e riepilogo visibile dopo il riavvio
      - [ ] Blocco del loopTask: panic del Task WDT e riavvio
      - [ ] Nessuna modifica temporanea rimasta nei sorgenti
    ref: TASK-08
  - id: TASK-09
    title: Build di test idf55-v1 per i tester e bozze dei messaggi (#36 Powercom, CyberPower, APC)
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
      - TASK-08
    body: |-
      ## Descrizione
      **Objective:** Preparare la verifica sul campo con gli UPS che non abbiamo, a partire dal Powercom della #36, dove deve sparire l'assert `root_port_handle_events`.

      **Read:**
      - Zip di test precedenti in `firmware-to-test/` (struttura e README.txt), ad esempio `test_fix_issue_43_v1.zip`.
      - `docs/plans/platform-upgrade-idf55.md` §3.1 e §7.

      **Change:**
      - `firmware-to-test/test_idf55_v1.zip` (cartella ignorata da git): firmware, bootloader, partitions, boot_app0 e `README.txt` in inglese (cosa cambia, OTA, flash completo, cosa riportare, versione `idf55-v1` della scheda distinta dal firmware dell'UPS).
      - Bozze dei messaggi in inglese, da far approvare all'utente prima della pubblicazione: Powercom (#36, fox1047: assert e riavvii dopo la disconnessione), CyberPower e APC (nessuna regressione nelle 24 h, `upsc` prima/dopo).

      **Steps:**
      1. Build con `FIRMWARE_VERSION` `idf55-v1` e preparazione dello zip.
      2. Scrittura delle bozze; nessuna pubblicazione senza conferma dell'utente.

      **Verify:**
      - `unzip -l firmware-to-test/test_idf55_v1.zip` mostra i 5 file; la stringa `idf55-v1` è nel firmware.

      **Done:**
      - Zip e bozze pronti; spec pronta per la review. Il rilascio attende i riscontri dei tester, fuori da questa spec.

      **Blockers:**
      - Nessuno.

      ## File Coinvolti
      - firmware-to-test/test_idf55_v1.zip — zip di test (non versionato)

      ## Criteri di Completamento
      - [ ] Zip con firmware, bootloader, partitions, boot_app0 e README.txt
      - [ ] `idf55-v1` presente nel firmware
      - [ ] Bozze dei messaggi per Powercom, CyberPower e APC pronte per l'approvazione
    ref: TASK-09
