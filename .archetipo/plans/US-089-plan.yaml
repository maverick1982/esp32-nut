body: |
  ---
  type: plan
  title: "US-089: Piattaforma ESP-IDF 5.5 (pioarduino 55.03.312-1) senza cambi di comportamento — Piano di implementazione"
  description: "Piano di implementazione per US-089"
  tags: [plan, implementation, US-089]
  ---
  # US-089: Piattaforma ESP-IDF 5.5 (pioarduino 55.03.312-1) senza cambi di comportamento — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-10-21

  ---

  ## Soluzione tecnica

  L'ambiente `esp32-s3-standard` passa da pioarduino `51.03.04` (ESP-IDF 5.1, Arduino 3.0.4) a `55.03.312-1` (ESP-IDF 5.5.5, Arduino 3.3.12), la stessa piattaforma usata dal fork ESP32-P4 di #94. È un cambio di sola piattaforma (ADR 0010, passo 1 della migrazione): nessun refactoring e nessuna funzionalità nuova, così una regressione si attribuisce alla piattaforma. La decisione è già nell'ADR 0010, quindi non serve un nuovo ADR; i risultati delle verifiche vanno in `docs/plans/platform-upgrade-idf55.md`.

  - **`platformio.ini`:** cambia solo la riga `platform` di `[env:esp32-s3-standard]`. `partitions.csv`, flash mode DIO, `-Wl,--wrap=esp_core_dump_write`, `ARDUINO_LOOP_STACK_SIZE` e `lib_deps` restano uguali. L'ambiente `native` non dipende dalla piattaforma.
  - **Filtro di enumerazione USB:** con IDF 5.5.5 il core Arduino abilita `CONFIG_USB_HOST_ENABLE_ENUM_FILTER_CALLBACK`, e senza callback nessun dispositivo si enumera ("Root port reset failed", arduino-esp32 #12783). In `USBHostUPS::begin()` si assegna `host_config.enum_filter_cb` a una lambda che accetta ogni dispositivo, dentro `#if CONFIG_USB_HOST_ENABLE_ENUM_FILTER_CALLBACK`. È la soluzione del fork di rtadams89 (#94, commit ee1e319): il commit lo cita con `Co-authored-by`.
  - **`hid_host.c` vendorizzato:** nessuna modifica attesa. Il fork lo compila e lo usa sulla 5.5 senza cambiamenti. Le deviazioni `[esp32-nut, ...]` restano tutte.
  - **Vincoli dell'ADR 0008 sulla 5.5:** si rileggono i sorgenti di `components/usb` di ESP-IDF v5.5.5 (la versione del core, non la 5.5.2 installata in `framework-espidf`) per confermare: EP0 non annullabile da un client, `timeout_ms` degli URB non supportato, `usb_host_transfer_free()` senza controllo di trasferimento in volo, gestione del data toggle in `_pipe_cmd_clear` (review A3), fine dei transfer interrupt IN multi-pacchetto (review A4). L'esito va in una nuova sezione del piano IDF 5.5; se un vincolo è cambiato, ci si ferma e si discute prima di toccare `hid_host.c`.
  - **API di Arduino 3.3:** il fork non ha mai compilato Wi-Fi, AP, `DNSServer` e NeoPixel sulla 3.3, perché sul P4 non ci sono. Gli errori o gli avvisi di compilazione si correggono con il minimo indispensabile, senza cambiare il comportamento.
  - **Bootloader e OTA:** l'aggiornamento OTA da v1.8.0 lascia il bootloader 5.1 e scrive un'app 5.5. Va provato sull'Eaton 3S, insieme al flash completo (bootloader 5.5) e alla conservazione di NVS: `nutos` (Wi-Fi, NUT), `web_auth` (credenziali e sessioni), `nutrw` (variabili scritte con SET VAR), `boot_state`.
  - **CI e release:** `release.yml` cerca `boot_app0.bin` con `find` e non dipende dalla versione della piattaforma; va solo verificato che il percorso esista anche nel nuovo pacchetto. Nome e struttura dello zip non cambiano.

  ---

  ## Strategia di test

  Il cambio è di piattaforma, quindi la strategia è di regressione: tutto ciò che oggi è verde deve restarlo senza modificare i test, e il comportamento sull'hardware deve essere lo stesso della v1.8.0.

  - **Automatici:** suite nativa completa (`pio test -e native`, incluso il replay delle fixture) ed e2e Playwright (`npx playwright test`), senza modifiche ai test.
  - **Build:** `esp32-s3-standard` compila senza nuovi avvisi nei nostri sorgenti; dimensione del firmware annotata e dentro lo slot OTA (`0x3F0000`).
  - **Istantanea di riferimento:** prima del cambio, sull'Eaton 3S con la v1.8.0, si salva l'uscita di `upsc`, `upscmd -l` e `upsrw`; dopo il cambio si confrontano: l'unica differenza ammessa è la versione del firmware.
  - **Manuali sull'Eaton 3S:** OTA da v1.8.0 e flash completo; NVS conservato; Web UI (login, telemetria, comandi, impostazioni UPS, log, OTA); AP con doppio reset e timeout dell'AP; riconnessione dopo aver staccato e riattaccato l'UPS; heap minimo dal log `[DIAG]`, confrontato con la v1.8.0.
  - **Rete di sicurezza:** con una build temporanea non committata si provocano un panic (core dump salvato e riepilogo visibile dopo il riavvio) e un blocco del loopTask oltre 30 s (Task WDT, panic e riavvio).
  - **Tester:** build di test `idf55-v1` per Powercom (#36, deve sparire l'assert `root_port_handle_events`), CyberPower e APC. Il rilascio della versione attende i loro riscontri e non fa parte di questa spec.
  - Nessun nuovo test e2e e nessun video demo: la spec non ha superfici utente nuove.

  ---

  ## Fuori ambito

  - Reset della porta USB senza riavvio (`usb_host_lib_set_root_port_power`), `custom_sdkconfig`, uso delle novità del WebServer 3.3 (risposte chunked).
  - Qualsiasi refactoring (profili delle schede e link di rete sono US-090).
  - Ambienti ESP32-P4 (US-092).

  _Piano generato dal team ARchetipo Planning — 2026-10-21_
tasks:
  - id: TASK-01
    title: Istantanea di riferimento della v1.8.0 sull'Eaton 3S (upsc, comandi, variabili, heap)
    type: Test
    status: DONE
    body: |-
      ## Descrizione
      **Objective:** Salvare il comportamento della v1.8.0 prima del cambio di piattaforma, per poterlo confrontare dopo (criterio di regressione della spec).

      **Read:**
      - `docs/plans/platform-upgrade-idf55.md` §6-§7 (validazione e criteri di accettazione).

      **Change:**
      - Nessun file di codice. Creare `docs/plans/idf55-baseline/` con i file di testo raccolti.

      **Steps:**
      1. Sull'Eaton 3S con la v1.8.0 (scheda dell'utente, richiede la sua presenza) salvare `upsc <ups>@<ip>` in `upsc-v1.8.0.txt`, `upscmd -l <ups>@<ip>` in `upscmd-v1.8.0.txt`, `upsrw <ups>@<ip>` in `upsrw-v1.8.0.txt`.
      2. Dal System Log della Web UI annotare le righe `[DIAG] Heap` (free, min free, largest block) dopo almeno 10 minuti di funzionamento, in `heap-v1.8.0.txt`.
      3. Annotare la dimensione di `firmware.bin` della v1.8.0.

      **Verify:**
      - I file esistono e non contengono credenziali (password NUT o web): verificarlo prima del commit.

      **Done:**
      - Riferimento completo, salvato nel repository.

      **Blockers:**
      - Serve la scheda fisica con l'Eaton 3S: se l'utente non è disponibile, rimandare questo task e i task hardware; i task 02-05 possono procedere.

      ## File Coinvolti
      - docs/plans/idf55-baseline/ — nuovi file di testo con upsc, upscmd, upsrw, heap e dimensione del firmware della v1.8.0

      ## Criteri di Completamento
      - [ ] `upsc`, `upscmd -l` e `upsrw` della v1.8.0 salvati
      - [ ] Heap della v1.8.0 annotato dopo almeno 10 minuti
      - [ ] Nessuna credenziale nei file salvati
    ref: TASK-01
  - id: TASK-02
    title: platformio.ini su pioarduino 55.03.312-1 e compilazione dell'ESP32-S3 senza errori
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Objective:** Compilare `esp32-s3-standard` sulla piattaforma `55.03.312-1` (IDF 5.5.5, Arduino 3.3.12) senza cambiare il comportamento.

      **Read:**
      - `platformio.ini` (`[env:esp32-s3-standard]`).
      - `docs/plans/platform-upgrade-idf55.md` §5 (rischi: Task WDT, core dump, API Arduino 3.3).
      - In caso di errori: `src/network/network_manager.cpp`, `src/network/web_config_server.cpp`, `src/core/main.cpp`, `src/core/crash_diag.cpp`, `lib/DiagnosticLED/src/DiagnosticLED.cpp`.

      **Change:**
      - `platformio.ini`: in `[env:esp32-s3-standard]` sostituire `platform = https://github.com/pioarduino/platform-espressif32.git#51.03.04` con `#55.03.312-1`. Aggiornare il commento sopra l'ambiente (ESP-IDF 5.5). Nient'altro.
      - Solo se la build fallisce: correggere le chiamate cambiate nel core 3.3 con la modifica minima equivalente, con un commento di una riga che cita il cambio di API. Non cambiare la logica.

      **Steps:**
      1. Cambiare la piattaforma e lanciare la build (la prima scarica i pacchetti).
      2. Correggere eventuali errori; elencare gli avvisi nuovi nei nostri sorgenti (non in quelli del framework) e correggere solo quelli che segnalano un cambio di comportamento.
      3. Annotare RAM e flash usate dal riepilogo della build.

      **Verify:**
      - `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` (bash; `pio` non è nel PATH)

      **Done:**
      - Build verde sulla nuova piattaforma; firmware entro lo slot OTA (`0x3F0000`); `partitions.csv` invariata.

      **Blockers:**
      - Se un errore richiede di cambiare `lib/usb_host_hid/hid_host.c` o il comportamento di un modulo, fermarsi e chiedere: non fa parte di questa spec.

      ## File Coinvolti
      - platformio.ini — piattaforma di `esp32-s3-standard`
      - src/ e lib/ — solo se servono adattamenti minimi alle API del core 3.3

      ## Criteri di Completamento
      - [ ] `esp32-s3-standard` usa `55.03.312-1`
      - [ ] La build compila; RAM e flash annotate
      - [ ] `partitions.csv` e le altre opzioni dell'ambiente invariate
    ref: TASK-02
  - id: TASK-03
    title: Callback del filtro di enumerazione USB in USBHostUPS::begin() (dal fork
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Objective:** Far enumerare gli UPS con IDF 5.5.5, dove il filtro di enumerazione è abilitato e senza callback nessun dispositivo si enumera.

      **Read:**
      - `lib/USBHostUPS/src/USBHostUPS.cpp`, `USBHostUPS::begin()` (costruzione di `host_config`, righe ~53-57).
      - Il commit ee1e319 del fork `rtadams89/esp32-nut` ("Fixed issue with USB enumeration"), già recuperato in `refs/remotes/rtadams89/main`: `git show ee1e319 -- lib/USBHostUPS/src/USBHostUPS.cpp`.

      **Change:**
      - `lib/USBHostUPS/src/USBHostUPS.cpp`: dopo l'inizializzazione di `host_config` aggiungere, dentro `#if CONFIG_USB_HOST_ENABLE_ENUM_FILTER_CALLBACK`, `host_config.enum_filter_cb = [](const usb_device_desc_t*, uint8_t*) { return true; };` con il commento del fork (filtro abilitato da IDF 5.5.5, con NULL nessun dispositivo si enumera, arduino-esp32 #12783; accetta ogni dispositivo e ne mantiene la configurazione).
      - Non portare `NUT_USB_PERIPHERAL_MAP` (solo P4, US-092).

      **Steps:**
      1. Aggiungere il blocco e ricompilare.
      2. Nel messaggio di commit aggiungere `Co-authored-by: rtadams89 <43024360+rtadams89@users.noreply.github.com>`.

      **Verify:**
      - `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard`
      - Sulla scheda (TASK-07): l'Eaton 3S si enumera e compare "UPS interface claimed and ready" nel System Log.

      **Done:**
      - Callback presente solo quando la piattaforma lo richiede; build verde.

      **Blockers:**
      - Se la macro non esiste nel `sdkconfig` del core 3.3.12 per esp32s3 (`framework-arduinoespressif32-libs/esp32s3/sdkconfig`), annotarlo: il blocco resta innocuo ma va verificato che l'enumerazione funzioni comunque.

      ## File Coinvolti
      - lib/USBHostUPS/src/USBHostUPS.cpp — `enum_filter_cb` in `begin()` dentro `#if CONFIG_USB_HOST_ENABLE_ENUM_FILTER_CALLBACK`

      ## Criteri di Completamento
      - [ ] `enum_filter_cb` assegnato quando `CONFIG_USB_HOST_ENABLE_ENUM_FILTER_CALLBACK` è attivo
      - [ ] Stato della macro nel `sdkconfig` esp32s3 annotato nel piano IDF 5.5
      - [ ] Commit con `Co-authored-by` di rtadams89
    ref: TASK-03
