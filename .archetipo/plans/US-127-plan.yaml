      **Modifiche:** in `EthSpiStore`: `NetworkMode loadMode()` (namespace `eth`, chiave `mode`, stringa; assente, namespace inesistente o testo non valido → `NetworkMode::AUTO`, con WARN se il testo c'è ma non è valido) e `bool saveMode(NetworkMode)` con `networkModeName()`. Aggiornare il commento di testata (chiave `mode`, US-127).

