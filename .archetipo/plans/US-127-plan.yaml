      **Obiettivo:** coprire i tempi del passaggio e il link in attesa.

      **Leggere:** `lib/NetCore/src/NetAutoSwitch.h`, `test/test_eth_boot_probe/test_main.cpp` (stile), `test/test_net_link_selector/test_main.cpp`.

      **Modifiche:**
      - Nuovo `test/test_net_auto_switch/test_main.cpp`: sull'Ethernet senza cavo da t=20 s → `NONE` a 29,9 s e `TO_WIFI` a 30,1 s; Wi-Fi non configurato → mai `TO_WIFI`; sul Wi-Fi Ethernet pronta da t=40 s → `NONE` a 44,9 s, `TO_ETHERNET` a 45,1 s; subito dopo `switched()` nessun passaggio prima di 15 s anche con la condizione già vera; un'interruzione breve (pronta, non pronta 3 s, pronta) azzera l'attesa; caso peggiore (cavo staccato 1 s dopo un passaggio) entro 30 s; `now` vicino a `UINT32_MAX`; `step()` non cambia `active()`.
      - `test_net_link_selector`: `activate(&b, true)` non chiama `end()` su `a`; riattivare `a` dopo non chiama `begin()` due volte se il mock lo conta (seguire il mock esistente) e ferma `b`.

