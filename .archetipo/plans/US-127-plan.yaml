  - id: TASK-06
    title: 'Gestore di rete: W5500 in attesa, passaggio a caldo, nome host unico'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** eseguire il passaggio a caldo in Automatico tenendo un solo link attivo, e dare lo stesso nome host predefinito su cavo e Wi-Fi.

      **Leggere:** `include/network/network_manager.h`, `src/network/network_manager.cpp`, `src/network/eth_link.h/.cpp`, `src/network/wifi_links.h/.cpp`, `lib/NetCore/src/NetHostname.h`.

      **Modifiche:**
      1. `EthLink::begin()`: se `m_started` è già true non fa nulla (il W5500 in attesa torna attivo senza riavviarsi).
      2. `WifiStaLink::end()`: `WiFi.disconnect(true)` (spegne la radio; oggi la riconnessione automatica la riaccenderebbe).
      3. `AppNetworkManager`:
         - `begin()` conserva `ssid` e `password` (`m_ssid`, `m_password`) per creare la stazione a un passaggio successivo.
         - `probeEthernet()` non ferma più il W5500 se la prova fallisce (lo decide `main.cpp`); il WARN "not available" resta.
         - `void leaveEthernet(bool standby)`: con `standby` il W5500 resta avviato fuori dal selettore (`m_ethStandby = true`, `m_selector` senza link attivo); altrimenti `m_selector.activate(nullptr)` come oggi.
         - `void setAutoSwitch(bool on)`; in `begin()` con piano `WIFI_STATION` e `m_ethStandby` usa `m_selector.activate(m_sta, true)`.
         - `loop()`: se `m_autoSwitch` e `m_eth && m_eth->started()`, chiama `NetAutoSwitch::step(millis(), m_eth->linkUp() && m_eth->hasIP())` (begin del NetAutoSwitch con il link attivo e `wifi_available = m_ssid.length() > 0` alla prima chiamata o in `begin()`). `TO_WIFI`: WARN `"[NETWORK] Ethernet lost: switching to Wi-Fi"`, crea `m_sta` se manca, `m_selector.activate(m_sta, true)`, `m_ethStandby = true`. `TO_ETHERNET`: INFO `"[NETWORK] Ethernet back: switching from Wi-Fi to Ethernet"`, `m_selector.activate(m_eth)` (ferma il Wi-Fi), `m_ethStandby = false`. Dopo ogni passaggio `switched()` e `++m_linkChanges`.
         - `bool ethStandby() const`, `uint32_t linkChanges() const`.
      4. Nome host: un helper privato `ethHostnameSeed(board)`: se `board.has_wifi` e il nome salvato è vuoto, passa a `EthLink` come nome il default `NetHostname::defaultFor()` del MAC `ESP_MAC_WIFI_STA` (eFuse); altrimenti il nome salvato. `defaultHostname()` sulle schede con Wi-Fi usa sempre il MAC della stazione. P4 invariato.

      **Passi:** link, poi gestore, poi compilare S3 e P4.

      **Blocchi:** se il W5500 in attesa e il Wi-Fi attivo insieme danno problemi di percorso che non si possono verificare senza hardware, segnalarlo nel riepilogo per i tester della #64.

      ## File Coinvolti
      - src/network/eth_link.cpp — `begin()` idempotente
      - src/network/wifi_links.cpp — `end()` spegne il Wi-Fi
      - include/network/network_manager.h — nuove API e membri
      - src/network/network_manager.cpp — attesa, passaggio, nome host

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio run -e esp32-s3-standard` e `pio run -e esp32-p4-eth` compilano (PowerShell)
      - [ ] Con passaggio a caldo spento il comportamento è quello di US-126
      - [ ] Un solo link nel selettore in ogni momento
    ref: TASK-06
  - id: TASK-07
    title: Chiusura delle sessioni NUT al cambio di link
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** dopo un passaggio i client NUT si ricollegano subito al nuovo indirizzo invece di aspettare il timeout.

      **Leggere:** `lib/NUTServer/src/NUTServer.h/.cpp` (`closeSession`, `CloseReason`, `resetSessions`), `test/test_nut_server/test_main.cpp`.

      **Modifiche:** `CloseReason::LinkChanged`; `void closeAllSessions(CloseReason reason)` chiude ogni slot occupato (socket compreso) con una sola riga di log `"Network link changed: %u NUT clients disconnected"` se ce n'erano. Nuovo test in `test_nut_server`: due sessioni aperte con `openSession()`, `closeAllSessions(LinkChanged)` → slot liberi e una riga di log.

      **Passi:** implementare seguendo `closeSession`, test, eseguire.

      **Blocchi:** se il log per sessione di `closeSession` produce una riga per client, adattare in modo da avere una sola riga riassuntiva per `LinkChanged`.

      ## File Coinvolti
      - lib/NUTServer/src/NUTServer.h — `LinkChanged`, `closeAllSessions`
      - lib/NUTServer/src/NUTServer.cpp — implementazione
      - test/test_nut_server/test_main.cpp — nuovo caso

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio test -e native -f test_nut_server` passa
      - [ ] I casi esistenti non cambiano
    ref: TASK-07
  - id: TASK-08
    title: Collegare modalità e passaggio in main.cpp
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
      - TASK-07
    body: |-
      ## Descrizione
      **Obiettivo:** usare la modalità all'avvio, mettere il W5500 in attesa in Automatico e chiudere le sessioni NUT a ogni passaggio.

      **Leggere:** `src/core/main.cpp` (blocco W5500 di `setup()`, `loop()`), `lib/NetCore/src/NetBootPlan.h`.

      **Modifiche:**
      1. Dopo `eth_spi_store.load()`: `NetworkMode net_mode = eth_spi_store.loadMode();` e `mode` in `NetBootInput`.
      2. Dopo `probeEthernet()`: `if (needsFallback(net_plan, outcome)) { network_mgr.leaveEthernet(net_plan.auto_switch && outcome != EthProbeOutcome::NO_CHIP); net_plan = fallbackPlan(net_plan); } else if (outcome != EthProbeOutcome::CONNECTED) { log WARN "[MAIN] Ethernet mode: no connection (%s), staying on Ethernet. Double reset for the access point" }`.
      3. `network_mgr.setAutoSwitch(net_plan.auto_switch)` prima di `network_mgr.begin()`; log INFO se attivo: `"[MAIN] Automatic link choice: Ethernet when the cable is connected, otherwise Wi-Fi"`.
      4. Log INFO della modalità quando il W5500 è attivo (`"[MAIN] W5500 enabled, link mode %s"`, sostituisce "trying Ethernet first" e vale anche in modalità Wi-Fi, dove la prova non parte).
      5. `loop()`: `static uint32_t last_changes`; se `network_mgr.linkChanges() != last_changes` → `nut_server.closeAllSessions(NUTServer::CloseReason::LinkChanged)` e aggiorna.
      6. `web_server.setEthSpi(...)` riceve anche `net_mode` (vedi TASK-09).

      **Passi:** modificare, compilare le tre immagini.

      **Blocchi:** se `nut_server` non è avviato (configurazione non valida), `closeAllSessions` deve essere innocuo: verificarlo nel codice.

      ## File Coinvolti
      - src/core/main.cpp — modalità, ripiego, attesa, sessioni NUT

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio run -e esp32-s3-standard`, `pio run -e esp32-p4-eth`, `pio run -e esp32-p4-eth-v1` compilano (PowerShell)
      - [ ] Con W5500 spento il percorso di avvio è identico a US-126
      - [ ] In modalità Ethernet senza cavo la scheda non passa al Wi-Fi
    ref: TASK-08
  - id: TASK-09
    title: 'API: modalità e stati standby/unused in /api/network/eth'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-05
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** leggere e salvare la modalità dalla web UI e mostrare lo stato reale del W5500.

      **Leggere:** `lib/WebApi/src/WebApiJson.h/.cpp` (`ethSpiJson`, `checkEthSpiBody`, `networkLinksJson`), `src/network/web_config_server.cpp` (`handleGetEthSpi`, `handleSetEthSpi`, `handleGetConfig`), `include/network/web_config_server.h`.

      **Modifiche:**
      1. `WebApiJson`: overload `ethSpiJson(board, settings, NetworkMode mode, state, reason)` che aggiunge `"mode":"auto|ethernet|wifi"` dopo `"enabled"`; la firma di US-126 resta (senza `mode`). Overload `checkEthSpiBody(body, board, current, NetworkMode current_mode, next, NetworkMode& next_mode, restart, response)`: `"mode"` facoltativo, stringa valida per `parseNetworkMode` (altro tipo o testo → 400 `{"error":"Invalid network mode"}`, dopo i controlli di `enabled` e `pins`); `restart = next != current || next_mode != current_mode`. La firma di US-126 chiama il nuovo con la modalità invariata. Documentare nel header.
      2. `WebConfigServer`: `setEthSpi(store, settings, NetworkMode mode)`; GET con stati: `off` (spento), `unused` (modalità Wi-Fi), `active` (link attivo Ethernet), `standby` (`network->ethStandby()`), altrimenti `fallback` + motivo. POST: salva pin e modalità (`saveMode`) se cambiano, 500 `"Failed to save the W5500 settings"` se uno dei due fallisce, log INFO con la modalità. `handleGetConfig`: "ethernet" in `network.links` solo con W5500 attivo e modalità diversa da Wi-Fi.

      **Passi:** prima `WebApiJson`, poi il server.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/WebApi/src/WebApiJson.h — overload e documentazione
      - lib/WebApi/src/WebApiJson.cpp — implementazione
      - include/network/web_config_server.h — `setEthSpi` con la modalità
      - src/network/web_config_server.cpp — stati, salvataggio, links

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio run -e esp32-s3-standard` e `pio run -e esp32-p4-eth` compilano
      - [ ] I test di US-126 in `test_web_api` passano senza modifiche
