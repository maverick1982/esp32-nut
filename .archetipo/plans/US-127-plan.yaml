    body: |-
      ## Descrizione
      **Obiettivo:** permettere all'utente di scegliere Automatic, Ethernet o Wi-Fi e vedere gli stati Standby e Not used.

      **Leggere:** `data/www/index.html` (sezione `#sec-w5500`, scelta della porta USB `#usb-port` in Board Settings), `data/www/bundle.js` (blocco W5500 di US-126, costruzione delle `.port-card` della porta USB), `data/www/bundle.css` (`.port-options`, `.port-card`).

      **Modifiche:**
      1. `index.html`: nella sezione W5500, tra la riga dell'interruttore e la riga di stato, un blocco `#w5500-mode-row` (nascosto con l'interruttore spento) con titolo "Link to use" e `div.port-options#w5500-mode role="radiogroup"` con tre `.port-card` (stesso markup della porta USB): **Automatic** "Ethernet when the cable is connected, otherwise Wi-Fi. Switches by itself within 30 s."; **Ethernet** "Cable only. Without a cable the board stays offline; it uses Wi-Fi only if the W5500 does not answer."; **Wi-Fi** "Wi-Fi only. The W5500 is not used.". Aggiornare il testo d'aiuto del badge.
      2. `bundle.js`: la GET compila la scelta da `mode` (assente → auto); accendere l'interruttore mostra la riga con la scelta salvata o Automatic; la POST invia `mode` solo con l'interruttore acceso; il confronto per "No changes" lo lascia al server come oggi. Stati: `standby` → badge "Standby" (classe `connecting`, indicatore `info`) e testo "No Ethernet connection: the board is on Wi-Fi and goes back to Ethernet when the cable is connected."; `unused` → badge "Not used" (classe `idle`) e testo informativo "Wi-Fi mode: the W5500 is not used.". Tastiera: frecce sinistra/destra come la porta USB.
      3. CSS solo se serve, riusando `.port-options`.
      4. `python scripts/embed_web.py`.

      **Passi:** markup, logica, rigenerazione, `npx playwright test e2e/eth-spi.spec.ts`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - data/www/index.html — riga "Link to use"
      - data/www/bundle.js — scelta, stati, POST
      - data/www/bundle.css — eventuali ritocchi
      - data/www/index_inlined.html, include/network/web_assets.h — rigenerati

