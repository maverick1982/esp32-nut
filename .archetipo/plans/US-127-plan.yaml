  # US-127: Scelta del collegamento di rete nella pagina Network (Wi-Fi / Ethernet / Automatico) — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-06

  ---

  ## Spec

  **Epic:** EP-005 — Supporto multi-scheda (ESP32-P4, Ethernet)
  **Priorità:** MEDIUM | **Punti:** 3 | **Bloccata da:** US-126 (DONE)

  Vedi `.archetipo/specs/US-127.yaml` per user story e criteri di accettazione completi.

  ---

  ## Soluzione tecnica

  Oggi l'unica scheda con due collegamenti è l'ESP32-S3 con il W5500 attivo (US-126): la scelta Wi-Fi / Ethernet / Automatico compare solo lì, nella sezione W5500 della pagina Network, e viaggia con le impostazioni del modulo. La decisione all'avvio resta in `NetBootPlan`, il passaggio a caldo è una nuova macchina a stati pura, e il gestore di rete tiene il W5500 acceso in attesa mentre la scheda è sul Wi-Fi, così vede il cavo che torna.

  - **Modalità (`NetworkMode` di `board.h`, PDR 0002 D3).** Nuove funzioni pure in `include/board/eth_spi_settings.h`: `networkModeName()` ("auto", "ethernet", "wifi") e `parseNetworkMode()`. Salvata nell'NVS `eth` di `EthSpiStore` con la chiave `mode` (stringa); assente o non valida = Automatico. Il profilo non cambia (S3 `network_mode = WIFI` resta il valore delle schede senza W5500).
  - **Avvio (`NetBootPlan`).** `NetBootInput` riceve `NetworkMode mode` (in fondo). Con Wi-Fi, W5500 attivo e senza doppio reset: `WIFI` → come senza W5500 (il modulo non si avvia); `AUTO` → regola di US-126 (Ethernet, ripiego in stazione o AP su ogni fallimento) più `auto_switch = true` quando il ripiego è la stazione; `ETHERNET` → Ethernet, ripiego al Wi-Fi solo se il chip non risponde (`fallback_on_no_link = false`), nessun passaggio a caldo. Nuova `needsFallback(plan, EthProbeOutcome)`. `fallbackPlan()` mantiene `auto_switch` solo se il ripiego è la stazione. Il doppio reset avvia sempre l'AP.
  - **Ethernet senza cavo in modalità Ethernet.** La prova non ferma più il W5500 da sola: `main.cpp` decide con `needsFallback()`. Se non serve il ripiego e la scheda non è connessa, resta in Ethernet e lo scrive nel System Log ("Ethernet mode: no connection (no_link), staying on Ethernet. Double reset for the access point").
  - **Passaggio a caldo (`lib/NetCore/src/NetAutoSwitch.h`, puro).** Ingresso: Ethernet pronta = link e indirizzo. Sull'Ethernet: non pronta per più di `ETH_DOWN_MS = 10000` → `TO_WIFI` (solo con Wi-Fi configurato). Sul Wi-Fi: pronta per più di `ETH_UP_MS = 5000` → `TO_ETHERNET`. Nessun passaggio prima di `HOLD_MS = 15000` dall'ultimo (o dall'avvio): il caso peggiore resta sotto i 30 s del criterio. Aritmetica di `millis()` con sottrazione unsigned.
  - **Selettore (`NetLinkSelector`).** `activate(link, keep_previous = false)`: con `true` il link precedente non viene fermato (W5500 in attesa mentre la scheda è sul Wi-Fi). Resta un solo link attivo per server, nome e stato; il W5500 in attesa non ha indirizzo finché il cavo è staccato. Quando il cavo torna, per i ~5 s prima del passaggio il W5500 ottiene un indirizzo: il percorso di default resta il Wi-Fi (priorità di `esp_netif`) finché il Wi-Fi non viene spento.
  - **Link.** `EthLink::begin()` non fa nulla se il modulo è già avviato. `WifiStaLink::end()` spegne davvero il Wi-Fi (`WiFi.disconnect(true)`): oggi fa solo `disconnect()` con la riconnessione automatica attiva.
  - **Gestore di rete.** Conserva SSID e password per creare la stazione al passaggio; `setAutoSwitch(bool)`, `leaveEthernet(bool standby)`, `ethStandby()`, `linkChanges()` (contatore dei passaggi). In `loop()` esegue `NetAutoSwitch` se il W5500 è avviato, con una riga nel System Log a ogni passaggio.
  - **Nome host uguale sui due link.** Con una scheda che ha il Wi-Fi, il nome predefinito dell'Ethernet viene dal MAC della stazione Wi-Fi (come la stazione): stesso `esp32-nut-xxxxxx` su cavo e Wi-Fi, e il syslog (che memorizza il nome una volta) resta coerente. Il nome salvato vale già su entrambi. Il P4 non cambia.
  - **Server NUT.** Nuovo `NUTServer::closeAllSessions()` (motivo `LinkChanged`, una riga di log): `main.cpp` lo chiama quando `linkChanges()` aumenta, così i client si ricollegano subito al nuovo indirizzo. Web server, syslog e NTP ascoltano su tutte le interfacce o seguono il percorso di default: nessuna modifica.
  - **API.** `GET /api/network/eth` aggiunge `"mode"` e due stati: `standby` (Automatico, scheda sul Wi-Fi, W5500 in attesa del cavo) e `unused` (modalità Wi-Fi). `POST` accetta `"mode"` facoltativo (assente = invariato; non valido → 400 `{"error":"Invalid network mode"}`); un cambio di modalità conta come modifica (`restart:true`). Overload nuovi di `ethSpiJson`/`checkEthSpiBody`, le firme di US-126 restano come wrapper. `network.links` contiene "ethernet" solo se il W5500 è attivo e la modalità non è Wi-Fi.
  - **Web UI.** Nella sezione W5500, tra l'interruttore e i pin, una riga "Link to use" con tre schede radio (stile `.port-options` della porta USB in Board Settings): Automatic (predefinito), Ethernet, Wi-Fi, ognuna con una riga di spiegazione. Compare solo con l'interruttore acceso. Badge e testi per `standby` e `unused`. Nessun mockup: è una riga in una sezione esistente.
  - **Fuori ambito:** due link attivi insieme, IP statico, passaggio a caldo da o verso l'access point (cambierebbe la modalità del server web: in AP il ripiego resta fino al riavvio, come in US-126).

  ---

  ## Strategia di test

  La logica sta in header puri testati in nativo; gestore di rete, link e `main.cpp` sono sottili e coperti dalle tre build e dalla prova su hardware dei tester, insieme a US-126 (build di prova unica per la #64).

  - `test_net_boot_plan`: tre modalità × configurazione valida/assente × doppio reset; `needsFallback` per ogni esito; `fallbackPlan` e `auto_switch`. I casi di US-126 restano, con la modalità `AUTO` esplicita nell'helper `s3()` (aggiornamento meccanico).
  - `test_net_auto_switch` (nuovo): passaggio a 10 s e non a 9,9 s, ritorno a 5 s, attesa minima di 15 s, link che lampeggia, Wi-Fi non configurato, wrap di `millis()`, caso peggiore sotto 30 s.
  - `test_net_link_selector`: `keep_previous` non ferma il link precedente e il ritorno non lo riavvia.
  - `test_eth_spi_settings`: `networkModeName`/`parseNetworkMode`.
  - `test_nut_server`: `closeAllSessions` libera tutti gli slot.
  - `test_web_api`: `mode` nella GET, stati `standby` e `unused`, `mode` nella POST (valido, assente, non valido, cambio → restart), `network.links` con modalità Wi-Fi.
  - Regressione: suite nativa completa, `npm run e2e`, build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`.

  ### Test E2E — simulazione utente

  **Framework:** Playwright (`e2e/support/webui.ts`, API simulate con `page.route`), in `e2e/eth-spi.spec.ts`.
  **Video demo:** la Dimostrazione richiede cavo e scheda veri (passaggio a caldo): non è filmabile con le API simulate. Decide `archetipo-review`.

  | Scenario | Flusso utente |
  |---|---|
  | Scelta della modalità | Con il W5500 attivo l'utente vede "Link to use" con Automatic selezionato, sceglie Ethernet e salva: la POST contiene `mode:"ethernet"` e parte il conto alla rovescia |
  | Modulo spento | Con l'interruttore spento la scelta non c'è; accendendolo compare con Automatic |
  | Standby | GET con `state:"standby"`: badge Standby e testo che spiega che la scheda è sul Wi-Fi e torna all'Ethernet col cavo |
  | Modalità Wi-Fi | GET con `mode:"wifi"`, `state:"unused"`: badge "Not used" e scelta Wi-Fi selezionata |
  | Solo la modalità cambia | Pin invariati, modalità diversa: la POST la invia e la risposta `restart:true` avvia il conto alla rovescia |

  _Piano generato con ARchetipo Planning — 2026-11-06_
tasks:
  - id: TASK-01
    title: Modalità di rete nel piano di avvio (logica pura)
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** far decidere a `NetBootPlan` il link di avvio secondo la modalità Wi-Fi / Ethernet / Automatico.

      **Leggere:** `lib/NetCore/src/NetBootPlan.h`, `lib/NetCore/src/EthBootProbe.h`, `include/board/eth_spi_settings.h`, `include/board/board.h` (`NetworkMode`), `test/test_net_boot_plan/test_main.cpp` (helper `s3()`).

      **Modifiche:**
      1. `eth_spi_settings.h`: `inline const char* networkModeName(NetworkMode)` → "auto", "ethernet", "wifi"; `inline bool parseNetworkMode(const char* s, NetworkMode& out)` (false per null o testo sconosciuto).
      2. `NetBootPlan.h` (include `EthBootProbe.h`): `NetBootInput` riceve `NetworkMode mode` **in fondo**; `NetBootPlan` riceve `bool auto_switch` e `bool fallback_on_no_link` in fondo (inizializzatori aggregati aggiornati, default false).
      3. Regole di `planNetwork(const NetBootInput&)` con Wi-Fi, `spi_eth` e senza doppio reset: `mode == WIFI` → stesso ramo di `spi_eth == false`; `AUTO` → come oggi (Ethernet, `fallback` stazione/AP, `default_config = !config_valid`) con `fallback_on_no_link = true` e `auto_switch = (fallback == WIFI_STATION)`; `ETHERNET` → come AUTO ma `fallback_on_no_link = false`, `auto_switch = false`. Il wrapper a 3 argomenti passa `mode = AUTO` (irrilevante con `spi_eth = false`).
      4. `inline bool needsFallback(const NetBootPlan& p, EthProbeOutcome o)`: `CONNECTED`/`WAITING` → false; `NO_CHIP` → `p.fallback != NONE`; `NO_LINK`/`NO_IP` → `p.fallback != NONE && p.fallback_on_no_link`.
      5. `fallbackPlan()`: `auto_switch = plan.auto_switch && next.link == WIFI_STATION`, `fallback_on_no_link = false`.
      6. Aggiornare il commento di testata (US-127) e l'helper `s3()` dei test con `NetworkMode::AUTO` esplicito (aggiornamento meccanico: stesso comportamento verificato).

      **Passi:** header, poi helper dei test, poi compilare `test_net_boot_plan`.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - include/board/eth_spi_settings.h — nome e parsing della modalità
      - lib/NetCore/src/NetBootPlan.h — `mode`, `auto_switch`, `fallback_on_no_link`, `needsFallback`
      - test/test_net_boot_plan/test_main.cpp — helper `s3()` con la modalità

      ## Criteri di Completamento
      - [ ] **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_net_boot_plan` passa con i casi esistenti invariati nel significato
      - [ ] Nessuna variabile inline (GCC 5.1), solo `<stdint.h>` negli header di NetCore
    ref: TASK-01
