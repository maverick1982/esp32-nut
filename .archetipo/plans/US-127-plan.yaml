  - id: TASK-03
    title: Passaggio a caldo puro e selettore con link in attesa
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** decidere in logica pura quando passare tra Ethernet e Wi-Fi in Automatico, e permettere al selettore di lasciare acceso il W5500 mentre la scheda è sul Wi-Fi.

      **Leggere:** `lib/NetCore/src/NetLinkSelector.h`, `lib/NetCore/src/EthBootProbe.h` (stile), `test/test_net_link_selector/test_main.cpp`.

      **Modifiche:**
      1. Nuovo `lib/NetCore/src/NetAutoSwitch.h`: `enum class AutoLink : uint8_t { ETHERNET, WIFI }`, `enum class AutoAction : uint8_t { NONE, TO_WIFI, TO_ETHERNET }`; classe `NetAutoSwitch` con `static const uint32_t ETH_DOWN_MS = 10000, ETH_UP_MS = 5000, HOLD_MS = 15000;`, `void begin(uint32_t now, AutoLink active, bool wifi_available)`, `AutoAction step(uint32_t now, bool eth_ready)` (eth_ready = link e indirizzo), `void switched(uint32_t now, AutoLink active)`, `AutoLink active() const`. Regole: sull'Ethernet, `eth_ready` falso ininterrottamente per più di `ETH_DOWN_MS` → `TO_WIFI` se `wifi_available`; sul Wi-Fi, `eth_ready` vero ininterrottamente per più di `ETH_UP_MS` → `TO_ETHERNET`; mai prima di `HOLD_MS` da `begin()` o dall'ultimo `switched()`. `step()` non cambia `active`: lo fa `switched()`. Sottrazione unsigned per il wrap. Commento di testata con i tempi e il caso peggiore (25 s < 30 s).
      2. `NetLinkSelector::activate(INetLink* link, bool keep_previous = false)`: con `keep_previous` il link precedente non riceve `end()`. Commento: serve al W5500 in attesa (US-127), un solo link resta attivo per stato, nome e server.

      **Passi:** header, compilare la suite nativa dei due moduli.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/NetCore/src/NetAutoSwitch.h — nuovo
      - lib/NetCore/src/NetLinkSelector.h — `keep_previous`

      ## Criteri di Completamento
      - [ ] **Verifica:** `pio test -e native -f test_net_link_selector` passa invariato
      - [ ] Nessuna chiamata di piattaforma, solo `<stdint.h>`
    ref: TASK-03
  - id: TASK-04
