      ## Descrizione
      **Obiettivo:** riprodurre la dimostrazione della spec su hardware e verificare che il dato valga per un solo riavvio.

      **Da leggere:** criteri di accettazione della spec, `docs/test-results/US-072/` (formato dei risultati).

      **Modifiche:** nuovo `docs/test-results/US-110/README.md` con i risultati.

      **Passi:**
      1. Build S3 con `$env:PLATFORMIO_BUILD_FLAGS="-DNUT_TEST_TWDT_HANG=1"`, caricarla sulla scheda di prova con l'Eaton 3S collegato.
      2. Aspettare il riavvio (60 s + 30 s di timeout). Nel System Log: `Reset reason: TASK_WDT`, `Last crash` e `Backtrace` come prima, e `[DIAG] Watchdog: tasks not responding: ups_poll (CPU 0/1)`. Nel banner della web UI la riga corrispondente. Copiare le righe nei risultati.
