      - [ ] Fixture replay verdi con i nuovi valori
    ref: TASK-04
  - id: TASK-05
    title: executeCommand con parametro, sequenze, shutdown.default e INSTCMD
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** eseguire i comandi di spegnimento da NUT con la semantica di usbhid-ups.

      **Da leggere:** `lib/USBHostUPS/src/IUSBHostUPS.h` (`executeCommand`), `USBHostUPS.h/.cpp` (`executeCommand` con i log, `writeUsage`), `lib/NUTServer/src/NUTServer.cpp:365-398`, `lib/WebApi/src/WebApiJson.cpp` (`runUpsCommand`), `test/mocks/Arduino.h` (`delay`).

      **Passi:**
      1. `CommandResult` riceve `INVALID_ARGUMENT`.
      2. `executeCommand(const char* name, const char* param = nullptr)` in `IUSBHostUPS` e `USBHostUPS` (aggiornare l'override e ogni chiamante, anche i mock dei test se fanno override).
      3. Nel base, dopo il controllo di supporto:
         - `shutdown.default`: per ciascuno di `shutdown.return`, `shutdown.reboot`, `load.off.delay`, `shutdown.stayoff`, se supportato, chiamare `executeCommand(sub)` (virtuale, così ogni tentativo viene loggato); al primo `OK` salvare il nome in un membro `_last_default_shutdown` e restituire `OK`; altrimenti `FAILED`.
         - comandi `load.*`/`shutdown.*`: leggere `ups.delay.shutdown`/`ups.delay.start` da `UPSData` (ripiego sui default 20/30 se mancano), chiamare `resolveShutdownSteps()` sotto il data lock, poi, a lock rilasciato, `writeUsage(step.def, (uint32_t)step.value)` per ogni passo con `delay(125)` tra due passi. Prima scrittura fallita → `FAILED` senza la seconda. `StepsResult` → `CommandResult`.
         - il resto invariato (beeper, test).
      4. `USBHostUPS::executeCommand`: i comandi distruttivi (`CommandCatalog::find(name)->destructive`) si loggano a WARN anche se riescono, col parametro se presente; per `shutdown.default` riuscito aggiungere "via <comando>". `INVALID_ARGUMENT` loggato a WARN.
      5. `NUTServer`: passare `tokens.size() > 3 ? tokens[3].c_str() : nullptr`; `INVALID_ARGUMENT` → `ERR INVALID-ARGUMENT`; togliere il commento "(US-058)" superato.
      6. `WebApiJson::runUpsCommand`: nessun parametro; aggiungere `INVALID_ARGUMENT` → 400 `{"error":"Invalid request"}` al `switch`. Il 403 sui distruttivi resta prima di ogni chiamata all'host.

      **Verifica:** build firmware e test di TASK-06.

      **Blocchi:** non tenere `_mutex` né il data lock durante `writeUsage()` (ordine dei lock ADR 0008, come in US-057).

      ## File Coinvolti
      - `lib/USBHostUPS/src/CommandCatalog.h` — `INVALID_ARGUMENT`
      - `lib/USBHostUPS/src/IUSBHostUPS.h` — parametro, sequenze, ripiego
      - `lib/USBHostUPS/src/USBHostUPS.h/.cpp` — firma e log
      - `lib/NUTServer/src/NUTServer.cpp` — parametro e nuovo errore
      - `lib/WebApi/src/WebApiJson.cpp` — caso 400

      ## Criteri di Completamento
      - [ ] INSTCMD con parametro opzionale per i comandi di ritardo
      - [ ] `shutdown.default` ripiega nell'ordine di `upsdrv_shutdown()` e logga il comando usato
      - [ ] Comandi distruttivi loggati a WARN
      - [ ] Build firmware ok
    ref: TASK-05
  - id: TASK-06
    title: Test nativi di INSTCMD, shutdown.default e blocco web
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** verificare l'esecuzione end-to-end lato firmware.

      **Da leggere:** `test/test_nut_server/test_main.cpp` (`MockUSBHost`, scritture registrate, test US-057 da riga ~435), `test/test_web_api/test_main.cpp`, `test/test_usb_host_interface/test_main.cpp` (mock che fanno override).

      **Passi:**
      1. Nel mock NUT: possibilità di far fallire la scrittura su un path (`failPaths`) e usage per Shutdown, Startup e Reboot.
      2. INSTCMD, con le scritture attese in ordine:
         - `load.off` (Shutdown 0)
         - `load.on` (Startup 0)
         - `load.off.delay` (20)
         - `load.off.delay 30` (30)
         - `load.on.delay 5`
         - `shutdown.return` (Startup 30 poi Shutdown 20)
         - `shutdown.stayoff` (Startup -1 come complemento a due del campo, poi Shutdown 20)
         - `shutdown.stop` (-1)
         - `shutdown.reboot` (10)
      3. Errori:
         - `load.off.delay abc` → `ERR INVALID-ARGUMENT` senza scritture
         - `shutdown.return` con la prima scrittura fallita → `ERR INSTCMD-FAILED` e nessuna seconda scrittura
         - senza autenticazione con auth richiesta → `ERR ACCESS-DENIED`
      4. `shutdown.default`:
         - con tutti i gruppi → usa `shutdown.return`
         - senza Startup → `shutdown.reboot`
         - Reboot che fallisce e niente Startup → `load.off.delay`
         - tutte le scritture fallite → `ERR INSTCMD-FAILED`
         - nessun gruppo → `ERR CMD-NOT-SUPPORTED`
      5. `LIST CMD` contiene `shutdown.default` quando c'è almeno un gruppo.
      6. `test_web_api`: `{"name":"shutdown.default"}` e `{"name":"load.off.delay"}` → 403 e nessuna scrittura.
      7. Aggiornare i mock con override di `executeCommand` alla nuova firma (meccanico).

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_server -f test_web_api -f test_usb_host_interface`

