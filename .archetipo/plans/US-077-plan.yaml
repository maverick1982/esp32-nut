      - annota ogni differenza rispetto alle baseline del TASK-01.

      **Fatto:** in `PowercomDriver.cpp` gli unici `set(` sono `ups.mfr` e `ups.model` di `onLoop`.

      **Blocchi:**
      - una differenza non spiegata da una riga upstream o da una decisione del piano va segnalata prima di aggiornare i test;
