      **Modifica:**
      1. **Header:**
         - aggiungi `hid2nut()` e `commandTable()` (`NutTable::powercomHid2Nut(n)`), `supersededGenericPaths()`, `pollStaticReportsOnce()` true, `isStaticUsage()`, `collectStringRequests()` che chiama solo `collectTableStringRequests()`;
