      2. Helper protetto `void appendTableReports(IHidTransport* host, std::vector<PollItem>& out, bool (*keep)(const NutTable::HidInfo&, ...)) const` (firma libera, anche una lambda via template). Per ogni riga di `hid2nut()` in ordine, se passa il filtro: il primo usage FEATURE (`report_type == 3`, `report_id != 0`) che `pathMatches`, aggiunto senza duplicati come `PollItem{3, id, 0}`.
      3. `collectStringRequests()` diviso: il ciclo sulle righe StringId (`_nut_rows`) diventa `void collectTableStringRequests(IHidTransport*, std::vector<uint8_t>&) const` (protetta), chiamata da `collectStringRequests()` dopo `requestTableStrings()`.
      4. Commento: hook pensati anche per US-078.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_generic_driver -f test_apc_driver -f test_poll_cycle -f test_record_replay` verde (nessun comportamento cambia).

