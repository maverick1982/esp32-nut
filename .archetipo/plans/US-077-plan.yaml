         - restano `stepSpacingMs()` 800, `encodeBeeperValue`, `shutdownCommandsSupported()` false, le deleghe dei ritardi, `onLoop`, `buildPollLists`.
      2. **`decodeReport`:** solo il report 0xA4 (FEATURE). Con il report ID in `data[0]` lo salta, prende al massimo 7 caratteri, cerca la prima cifra o punto, prende cifre e punti, e se c'è un punto copia il testo in `_nut_ctx.powercom_battery_voltage`. Poi `GenericDriver::decodeReport`. Il dump di debug sotto `USBUPS_DEBUG_LOG` può restare.
      3. **`buildPollLists`:**
         - quick: `{3, 0x0A, 8}`, poi `appendTableReports` con le righe BOOL (`info_type` "BOOL");
         - full: le voci di quick, poi `appendTableReports` con le righe non BOOL, non comando, senza `HU_FLAG_ABSENT`, che non hanno davanti un'altra riga con lo stesso `info_type` legata a un report letto; in fondo `{3, 0xA4, 8}`;
         - lunghezza 8 per 0x1D, 0x1F e 0x21 come oggi (commento #36).
      4. **`isStaticUsage(u)`:** vero se ogni riga di `powercomHid2Nut()` che `pathMatches(u)` ha `HU_FLAG_STATIC`; un usage senza righe resta statico.
      5. **`kSupersededGenericPaths`:** l'elenco della sezione 4 del piano, copiato carattere per carattere da `GenericDriver::decodeReport()`, raggruppato per chiave. In fondo, un commento con le estensioni che restano (decisione 9).
