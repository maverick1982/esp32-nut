    body: |-
      ## Descrizione
      **Obiettivo:** simulare i flussi utente delle nuove regole.

      **Leggere:** `e2e/nut_config.spec.ts` (helper `APPLIED`, `openNutTab`, `saveNut` di US-124), `e2e/config_autopopulate.spec.ts`, `e2e/support/webui.ts`.

      **Test (in `e2e/nut_config.spec.ts`, con un mock di `/api/config` parametrico):**
      1. `changing the UPS name keeps the saved password`: `has_password:true`, username `admin`; la pagina mostra "A password is set"; cambio UPS Name, password vuota, salvataggio; il body inviato ha `password` vuota o assente; esito "Applied now".
      2. `a username without a password is refused before sending`: `has_password:false`, nessun username; scrivo solo lo username → `#nut-error` col messaggio, nessuna POST.
      3. `remove NUT credentials asks and clears them`: con credenziali, click su Remove, accetto il dialog (verifico il testo) → body `{remove_credentials:true}`, `#nut-username` vuoto, `#nut-no-credentials` visibile, pulsante nascosto, esito mostrato.
      4. `cancelling the removal sends nothing`: dismiss del dialog → nessuna POST.
      5. `without credentials the page warns and the form saves empty fields`: username vuoto e `has_password:false` → avviso visibile, pulsante nascosto, salvataggio con campi vuoti consentito dal browser (nessun `required`).
      6. Adeguare `an API error shows no applied message` (US-124): il 400 mostra il messaggio in `#nut-error` e non apre dialog.
      7. Gli altri test del file e di `config_autopopulate.spec.ts` restano verdi (aggiungere `has_password` ai mock solo dove serve).

      **Verifica:** `npx playwright test e2e/nut_config.spec.ts e2e/config_autopopulate.spec.ts` e suite completa verdi.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - e2e/nut_config.spec.ts — scenari di password conservata, username da solo, rimozione, sola lettura, errore in pagina
      - e2e/config_autopopulate.spec.ts — solo se il mock va adeguato

      ## Criteri di Completamento
      - [ ] I 5 scenari nuovi passano
      - [ ] Il test di errore di US-124 è adeguato al riquadro in pagina
      - [ ] Suite e2e completa verde
    ref: TASK-07
  - id: TASK-08
    title: README e architettura con le nuove regole delle credenziali NUT
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** documentare le regole nuove. Il manuale utente non si modifica (decisione dell'utente); le note di rilascio si scrivono prima della release.

      **Modifiche:**
      1. `README.md` riga ~287 (NUT credentials): facoltative; con credenziali i client NUT le usano per comandi e impostazioni, la lettura resta libera; **senza credenziali i client NUT possono solo leggere i dati** (comandi e modifiche rifiutati con `ACCESS-DENIED`, come NUT senza utenti); password lasciata vuota = resta quella attuale; **Remove NUT credentials** per cancellarle. Togliere "With no NUT credentials set, every client is allowed.".
      2. `README.md` riga ~252 (ESP32-P4): dopo "(no NUT credentials, UPS name `ups`)" aggiungere che senza credenziali i client NUT possono solo leggere e che per i comandi da Home Assistant o `upscmd` vanno impostate nella scheda NUT Server.
      3. `README.it.md`: stesse modifiche in italiano (righe ~252 e ~287).
      4. `docs/concepts/architecture.md`: un paragrafo (US-125) su `hasCredentials()`, il rifiuto di INSTCMD/SET VAR come in upsd (USERNAME-REQUIRED, PASSWORD-REQUIRED, ACCESS-DENIED), `LOGIN` ammesso senza credenziali (unico scostamento da upsd) e le regole di `nutConfigFromBody()`.

      **Verifica:** `grep -n "every client is allowed\|ogni client è ammesso" README.md README.it.md` non trova nulla.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - README.md — righe delle credenziali NUT e della ESP32-P4
      - README.it.md — stesse righe in italiano
      - docs/concepts/architecture.md — paragrafo US-125

      ## Criteri di Completamento
      - [ ] README EN/IT descrivono sola lettura senza credenziali, password conservata e rimozione
      - [ ] Nessuna frase dice più che senza credenziali ogni client è ammesso
      - [ ] Paragrafo in architecture.md
    ref: TASK-08
  - id: TASK-09
    title: Suite completa e prova sull'Eaton 3S (con consenso)
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-04
      - TASK-05
      - TASK-06
      - TASK-07
      - TASK-08
    body: |-
      ## Descrizione
      **Obiettivo:** regressione completa e dimostrazione della spec sull'hardware.

      **Passi:**
      1. `pio test -e native` completo (rilanciare da sole le suite ERRORED transitorie su Windows), build `esp32-s3-standard` e `esp32-p4-eth` da PowerShell, `npx playwright test` completo. Esiti in `docs/test-results/US-125/` (`native.log`, `e2e.log`, `summary.md`).
      2. **Prova sul campo, solo dopo un sì esplicito dell'utente**: OTA sulla scheda di test (credenziali da `C:\Users\pasquale\.esp32-nut-cred.json`, mai stampate; script `ota_upload.py` e un client NUT Python come in US-124). Cambiare il nome UPS con password vuota via API: `INSTCMD` con la password di prima funziona. Rimuovere le credenziali: `GET VAR` funziona, `INSTCMD` e `SET VAR` → `ERR USERNAME-REQUIRED` senza USERNAME e `ERR ACCESS-DENIED` con username e password, con le righe nel System Log, `LOGIN` → `OK`. Username senza password → 400. Ripristinare subito nome e credenziali originali (il client NUT esterno 192.168.1.4 riceve errori nel frattempo, e i comandi del beeper vanno scelti in modo da non cambiare lo stato dell'UPS).
      3. Esito in `docs/test-results/US-125/field.md`.

      **Blocchi:** senza il consenso alla prova sul campo il punto 2 resta da fare e va segnalato in review.

      ## File Coinvolti
      - docs/test-results/US-125/ — esiti di nativi, build, e2e e prova sul campo

      ## Criteri di Completamento
      - [ ] Nativi, build S3/P4 ed e2e verdi
      - [ ] Prova sull'Eaton 3S fatta dopo il consenso, oppure segnalata come mancante
      - [ ] Configurazione NUT originale ripristinata sulla scheda
    ref: TASK-09
