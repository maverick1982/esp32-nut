    ref: TASK-05
  - id: TASK-06
    title: 'Pagina NUT Server: campi facoltativi, stato della password, rimozione e avviso'
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** la pagina segue le nuove regole.

      **Leggere:** `data/www/index.html` (form `#nut-form`, ~507-560, `#nut-status` e `#nut-help` di US-124, markup `auth-alert` di `#cv-ok`/`#cv-error`), `data/www/bundle.js` (form NUT ~324-400 con `showNutStatus()`, caricamento `/api/config` ~1880, `window.confirm` ~683), `data/www/bundle.css` (`.auth-alert`, `.btn`).

      **Modifiche:**
      1. `index.html`: togliere `required` da `#nut-username` e `#nut-password` (resta su UPS Name). Sotto la password `<p class="field-hint" id="nut-password-state"></p>` (riusare la classe di hint già presente nel CSS, o `auth-fineprint` senza bordo se non c'è). Un `<div class="auth-alert info" id="nut-no-credentials" role="status" hidden>` con icona e testo "Without NUT credentials, NUT clients can only read the data: commands and setting changes are refused.". Un `<div class="auth-alert" id="nut-error" role="alert" hidden><span id="nut-error-text"></span></div>`. Nei `form-actions` un secondo pulsante `<button type="button" class="btn btn-secondary" id="btn-remove-nut-creds" hidden>Remove NUT credentials</button>` (classe secondaria già usata nella UI). Aggiornare `#nut-help` con "Leave Password empty to keep the current one.".
      2. `bundle.js`: stato `nutState = { hasPassword, username }` riempito da `/api/config` (`data.nut.has_password`, `data.nut.username`). Funzione `renderNutCredentials()`: testo di `#nut-password-state` ("A password is set: leave the field empty to keep it." / "No password set."), placeholder della password ("Leave empty to keep the current password" / "Password"), `#nut-no-credentials` visibile quando `!username || !hasPassword`, `#btn-remove-nut-creds` visibile quando ci sono credenziali.
      3. Submit: prima dell'invio, se `(username !== '') !== (password !== '' || hasPassword)` oppure username vuoto con password scritta → mostrare in `#nut-error` "Set both the NUT username and password, or remove the NUT credentials" e non inviare. Su risposta non ok leggere `error` dal JSON e mostrarlo in `#nut-error` (niente più `alert`). Su ok: `hasPassword = hasPassword || password !== ''`, aggiornare `username`, svuotare il campo password, `renderNutCredentials()`, `showNutStatus(data)`.
      4. Rimozione: click → `window.confirm('Remove the NUT credentials?\n\nNUT clients will only be able to read the data, and the connected NUT clients are disconnected.')`; se confermato POST `{remove_credentials: true}` (stesso `apiFetch` con Content-Type JSON); su ok svuotare username e password, `hasPassword = false`, `renderNutCredentials()`, `showNutStatus(data)`; su errore `#nut-error`.
      5. Nascondere `#nut-error` a ogni nuovo invio.
      6. `python scripts/embed_web.py`.

      **Verifica:** `npx playwright test e2e/nut_config.spec.ts e2e/config_autopopulate.spec.ts e2e/credentials.spec.ts`; il test US-124 che si aspetta il dialog sull'errore va adeguato in TASK-07.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - data/www/index.html — campi facoltativi, stato password, avviso, errore, pulsante di rimozione
      - data/www/bundle.js — stato delle credenziali, controllo prima dell'invio, rimozione con conferma, errori in pagina
      - data/www/bundle.css — solo se serve uno stile per il pulsante o la riga di stato
      - data/www/index_inlined.html e asset embedded — rigenerati

      ## Criteri di Completamento
      - [ ] Username e Password non obbligatori
      - [ ] La pagina indica se una password è impostata e la conserva se il campo è vuoto
      - [ ] Username senza password rifiutato prima dell'invio, con il messaggio dell'API
      - [ ] Remove NUT credentials con conferma, visibile solo con credenziali
      - [ ] Avviso di sola lettura senza credenziali
      - [ ] Asset rigenerati
    ref: TASK-06
