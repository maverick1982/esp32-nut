    ref: TASK-07
  - id: TASK-08
    title: 'Commit NUT di riferimento: nut_repo.commit, ADR 0011 e caso di test'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |
      ## Descrizione
      Objective: il commit su cui sono scritte le citazioni è nel repo e `test_nut_table` fallisce in chiaro se `nut_repo` è altrove.

      Read: `test/test_nut_table/test_main.cpp` (`readLines`, `RUN_TEST` in `main`); `docs/adr/0011-single-hid-to-nut-table-per-subdriver.md:106`.

      Change: nuovo `nut_repo.commit`; `test/test_nut_table/test_main.cpp`; `docs/adr/0011-single-hid-to-nut-table-per-subdriver.md`.

      Steps:
      1. `nut_repo.commit`: prima riga l'hash `1c4ab78c615a7b2b8231bdb023d553abd64b541d`; righe successive che iniziano con `#` spiegano a cosa serve (le ignora il test).
      2. Nel test, helper `nutRepoHead()`: legge `nut_repo/.git/HEAD`; hash di 40 caratteri → quello; `ref: refs/...` → `nut_repo/.git/refs/...`, altrimenti la riga `<hash> refs/...` di `nut_repo/.git/packed-refs`. Restituisce stringa vuota se non trova nulla.
      3. Caso `test_nut_repo_matches_reference_commit`: se `nut_repo/.git/HEAD` non esiste → fallisce con "nut_repo missing: clone networkupstools/nut into nut_repo and check out <hash>"; se l'hash differisce → "nut_repo is at <a>, NutTable.h citations are written for <b> (nut_repo.commit)". Registrato come primo `RUN_TEST`.
      4. ADR 0011, regola di copia: le righe si citano sul commit di `nut_repo.commit`; aggiornare quel file insieme alle citazioni (con `scripts/nut_line_map.py`).

      Verify: test verde su 1c4ab78; prova manuale `git -C nut_repo checkout esp32nut-base-2026-08-06` → il caso fallisce con i due hash; poi `git -C nut_repo checkout master` (1c4ab78).

      Done: file, caso e ADR presenti.

      Blockers: TASK-02.

      ## File Coinvolti
      - nut_repo.commit — nuovo
      - test/test_nut_table/test_main.cpp — helper e caso nuovo
      - docs/adr/0011-single-hid-to-nut-table-per-subdriver.md — regola di copia

      ## Criteri di Completamento
      - [ ] HEAD staccato, ref sciolto e packed-refs gestiti
      - [ ] Messaggi chiari per nut_repo mancante e per hash diverso
    ref: TASK-08
  - id: TASK-09
    title: 'Regressione: suite nativa completa e tre build'
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-06
      - TASK-07
      - TASK-08
    body: |
      ## Descrizione
      Objective: nessuna regressione fuori dai punti toccati.

      Read: `platformio.ini` (ambienti).

      Change: nessuno, salvo correzioni emerse.

      Steps:
      1. `pio test -e native` completo: tutti i casi verdi (oggi 6 falliti in `test_nut_table`).
      2. `pio run -e esp32-s3-standard` e i due ambienti P4.
      3. `grep -c $'\r'` e ricerca di NUL sui file modificati: zero.

      Verify: output della suite e delle build.

      Done: suite verde, tre build ok, file puliti.

      Blockers: TASK-04, TASK-06, TASK-07, TASK-08.

      ## File Coinvolti
