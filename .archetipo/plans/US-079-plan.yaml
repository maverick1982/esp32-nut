    body: |-
      ## Descrizione
      **Obiettivo:** chiudere la convergenza con documenti allineati e misure.

      **Leggi:** `docs/adr/0011-single-hid-to-nut-table-per-subdriver.md`, `docs/adr/0004-*.md`, `docs/adr/0008-*.md`, `docs/adr/0010-*.md`, `docs/plans/usb-layer-review.md`, `docs/plans/nutdrv-qx-support.md`; note di rilascio v1.12.0 (dove le hanno messe US-106 e US-078); misure di TASK-01.

