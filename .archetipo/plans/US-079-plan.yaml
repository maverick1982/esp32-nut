      1. ADR 0011: US-079 fatta, emendamento di ADR 0004 in vigore, riferimenti a `CommandCatalog`/`UsageMapIndex` sostituiti con `HidControl`, `genericHid2Nut()`, `NutTable::applyDefaultDelays`; ADR 0004 con la nota dell'emendamento; ADR 0008/0010 e i due piani in docs/plans aggiornati dove nominano i file rimossi.
      2. Note di rilascio v1.12.0: differenze per le marche sconosciute (da `kGenericDifferences`), nessuna per le marche note, impatto RAM/flash.
      3. Build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`: RAM e flash dopo, confronto con TASK-01 in `docs/test-results/US-079-baseline.md`.
      4. Con l'ok dell'utente: OTA sull'Eaton 3S (credenziali nel file JSON della scheda di test, mai stampate), controllo di `upsc` e `upscmd -l` uguali a prima.

      **Verifica:** suite nativa completa verde; tre build ok; grep `CommandCatalog|UsageMapIndex` in lib, src, test: zero (salvo le guardie dei test strutturali, se tenute).

      **Fatto:** documenti aggiornati, misure riportate, OTA fatta o rimandata con motivo.

      **Blocchi:** OTA solo con l'ok esplicito dell'utente.

