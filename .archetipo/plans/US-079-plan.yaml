  - id: TASK-06
    title: Test dei driver riallineati e differenze del generico dichiarate nei golden
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** test unitari sul nuovo percorso e differenze per le marche sconosciute scritte e motivate.

      **Leggi:** `test/test_generic_driver/test_main.cpp`, `test/test_eaton_driver/`, `test/test_legrand_driver/`; uscita di `test_golden_generic_all_fixtures`.

      **Modifica:**
      1. `test_generic_driver`: ogni test chiama `decodeReport` e `postDecode`; `test_communication_lost_gives_no_alarm` diventa commfault con ALARM `Internal UPS fault!`; test nuovi: beeper 1 bit e multibit tramite hook, nessun hook quando la tabella del driver ha `ups.beeper.status`, data batteria da stringa, `battery.capacity.full` assente, formati della decisione 3; `test_engine_superseded_mapping_does_not_write` riscritto sulla coda.
      2. `test_eaton_driver`, `test_legrand_driver`: allineati se dipendono da `_map`.
      3. Golden generici: rigenera solo i file generici e scrivi in `test_main.cpp` la lista `kGenericDifferences` (fixture, chiave, prima, dopo, motivo) con un test che controlla che ogni differenza tra il golden vecchio (copiato in `golden/before/`) e il nuovo sia elencata.
      4. `UPSData.h`: commento su `ups.status.comm_lost` aggiornato (la chiave non esiste più).

      **Verifica:** `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_generic_driver -f test_eaton_driver -f test_legrand_driver -f test_record_replay` verde. Mutazioni: togliere un percorso da `kSupersededGenericPaths` di Eaton (rompe il golden del registro); hook del beeper sempre attivo (rompe Eaton).

      **Fatto:** ogni differenza del generico motivata; golden del registro intatti.

      **Blocchi:** una differenza non spiegata dalla decisione 3 va segnalata, non dichiarata.

      ## File Coinvolti
      - test/test_generic_driver/test_main.cpp — test riallineati
      - test/test_eaton_driver/, test/test_legrand_driver/ — se servono
