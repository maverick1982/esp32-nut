  - id: TASK-07
    title: 'Comandi solo da tabella: logica in HidControl e NutTable, CommandCatalog.h cancellato'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** tutti i comandi dalle righe `HU_TYPE_CMD`, via la logica di presenza e di passi a gruppi.

      **Leggi:** `lib/USBHostUPS/src/CommandCatalog.h`, `HidControl.h`, `IHidControlPort.h`, `IUpsControlPort.h`, `IUPSDriver.h:170-220`, `USBHostUPS.cpp` intorno alle righe 801-1040, `GenericDriver.cpp` (`planSet`, `writableVariables`).

      **Modifica:**
      1. `GenericDriver`: override `commandTable()` restituisce `genericHid2Nut()`, `delayPaths()` restituisce `genericDelayPaths()`.
      2. `NutTable.h`: `parseDelayParam` e `applyDefaultDelays(data, usages, off, on, delay_vars, const DelayPaths& paths, saved)` spostate da CommandCatalog; `GenericDriver::planSet` e `USBHostUPS.cpp` le usano.
      3. `HidControl.h`: funzioni statiche pubbliche `buildCommands` (ex `buildFromTable` senza `allow`), `cmdField`, `cmdDefault`, `cmdValueFits`, `fitsField`, `WriteStep`, `StepsResult`, `kNoDelay`, `resolveShutdownSteps` e `resolveWrite` solo con tabella; `supportedCommands()` senza tabella restituisce lista vuota; in `executeCommand()` il beeper si scrive sempre con `setBeeperField()`.
      4. `USBHostUPS.cpp`: `activeBeeper` come funzione statica privata usata da `getActiveBeeperPath()`.
      5. `commandAllowList()` tolta da `IUPSDriver`, `IUpsControlPort`, `USBHostUPS` (decisione 8); `port.setBeeper` lasciato solo se ha altri chiamanti (grep).
      6. Cancella `lib/USBHostUPS/src/CommandCatalog.h`; aggiorna commenti in `NutTable.h`, `IHidControlPort.h`, `IUPSDriver.h`, `HIDParser.cpp`, `USBHostUPS.h`.

      **Verifica:** build nativa dei test che compilano ancora; `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_record_replay -f test_hid_control`: LIST CMD dei golden registro e generico invariati (salvo differenze già dichiarate). I test che includono CommandCatalog.h si sistemano in TASK-09.

      **Fatto:** `CommandCatalog.h` non esiste; nessun ramo senza tabella in HidControl.

      **Blocchi:** se LIST CMD cambia su una fixture col driver del registro, fermati.

      ## File Coinvolti
      - lib/USBHostUPS/src/HidControl.h — logica comandi
      - lib/USBHostUPS/src/NutTable.h — parseDelayParam, applyDefaultDelays
      - lib/USBHostUPS/src/GenericDriver.h, GenericDriver.cpp — commandTable, delayPaths
      - lib/USBHostUPS/src/USBHostUPS.h, USBHostUPS.cpp — activeBeeper, applyDefaultDelays, via commandAllowList
      - lib/USBHostUPS/src/IUPSDriver.h, IUpsControlPort.h, IHidControlPort.h — via commandAllowList, commenti
      - lib/USBHostUPS/src/CommandCatalog.h — cancellato

      ## Criteri di Completamento
      - [ ] CommandCatalog.h rimosso
      - [ ] LIST CMD invariato sulle fixture
      - [ ] Nessun commandAllowList nel codice
