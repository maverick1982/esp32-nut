      - [ ] Nuovo caso di `writeField` verde
    ref: TASK-03
  - id: TASK-04
    title: executeCommand() e writeUsage() su IUSBHostUPS e USBHostUPS
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** un unico punto di esecuzione dei comandi, con scrittura sicura sul dispositivo e log dell'esito.

      **Da leggere:** `lib/USBHostUPS/src/IUSBHostUPS.h` (`getSupportedCommands`, `UPSDataLock`), `lib/USBHostUPS/src/USBHostUPS.h` (commento sul threading, `OP_WAIT_MS`, `setBeeperLocked`, `log`), `lib/USBHostUPS/src/USBHostUPS.cpp` righe ~695-770 (`setBeeper`/`setBeeperLocked`).

      **Passi:**
      1. In `IUSBHostUPS.h` aggiungere `virtual bool writeUsage(const HIDUsageDef& def, uint32_t value) { return false; }`.
      2. In `IUSBHostUPS.h` aggiungere `virtual CommandResult executeCommand(const char* name)` inline, con la logica a 5 passi della sezione "Soluzione Tecnica". `name` nullo → NOT_SUPPORTED. Il confronto con `getSupportedCommands()` usa `strcmp`. Per `beeper.toggle` leggere `getUPSData()->getBool("ups.beeper.status")` in un'istruzione a sé, prima di `setBeeper`. `resolveWrite` va dentro `{ UPSDataLock lk = getUPSData(); ... }` e `def` si copia per valore.
      3. In `USBHostUPS.h` dichiarare gli override `writeUsage` e `executeCommand`, più il privato `bool writeUsageLocked(const HIDUsageDef& def, uint32_t value); // _op_mutex held`.
      4. In `USBHostUPS.cpp`:
         - `writeUsage` prende `_op_mutex` con `OP_WAIT_MS` (come `setBeeper`), chiama `writeUsageLocked` e rilascia.
         - `writeUsageLocked` segue `setBeeperLocked`:
           - verifica `_is_ready_to_poll`, `_hid_dev_handle` e `_link.canPoll(millis())`
           - sotto `_mutex` calcola `expected_length = _hid_parser.getExpectedLength(def.report_id, HID_REPORT_TYPE_FEATURE)` e `shared = BeeperLogic::reportHasOtherFields(...)`
           - fa GET_REPORT FEATURE senza lock e chiama `noteControlResult`
           - applica `BeeperLogic::canWriteBack`: se è false, log WARN e `return false`
           - se il GET fallisce ma il report non è condiviso, procede come il beeper (buffer azzerato con report_id)
           - `BeeperLogic::writeField(def, value, ...)`, poi SET_REPORT FEATURE e `noteControlResult`
           - restituisce `err == ESP_OK`
         - `executeCommand` chiama `IUSBHostUPS::executeCommand(name)` e logga: OK → `log("INFO", "Command %s: OK", name)`; FAILED → `WARN "Command %s: failed"`; NOT_SUPPORTED → `WARN "Command %s: not supported"`; NOT_CONNECTED → `WARN "Command %s: UPS not connected"`.
      5. Nessun lock applicativo durante i control transfer. Ordine dei lock `_op_mutex` → `_mutex`.

      **Verifica:** `~/.platformio/penv/Scripts/pio.exe run -e esp32-s3-standard` compila. La suite nativa compila senza modifiche ai mock.

      **Blocchi:** non toccare `setBeeper`/`setBeeperLocked` e non rendere puri i nuovi virtuali (romperebbe i mock dei test).

      ## File Coinvolti
      - `lib/USBHostUPS/src/IUSBHostUPS.h` — writeUsage (default false), executeCommand (logica)
      - `lib/USBHostUPS/src/USBHostUPS.h` — dichiarazioni
      - `lib/USBHostUPS/src/USBHostUPS.cpp` — writeUsage/writeUsageLocked, executeCommand con log

      ## Criteri di Completamento
      - [ ] executeCommand restituisce NOT_CONNECTED, NOT_SUPPORTED, OK, FAILED secondo la logica del piano
      - [ ] writeUsageLocked rifiuta di scrivere un report condiviso non riletto
      - [ ] Ogni esecuzione lascia una riga nel log di sistema
      - [ ] Build firmware ok
    ref: TASK-04
  - id: TASK-05
    title: INSTCMD del server NUT tramite executeCommand
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** sostituire i rami beeper scritti a mano di INSTCMD con l'esecuzione generica.

      **Da leggere:** `lib/NUTServer/src/NUTServer.cpp`, ramo `if (cmd == "INSTCMD")` (righe ~365-415).

      **Passi:**
      1. Mantenere invariati: controllo `ERR ACCESS-DENIED`, `ERR INVALID-ARGUMENT` con meno di 3 token, `ERR UNKNOWN-UPS`.
      2. Se `_usb_ups` è nullo → `ERR DRIVER-NOT-CONNECTED`.
      3. Sostituire i blocchi beeper.enable/disable/toggle e il `ERR CMD-NOT-SUPPORTED` finale con uno `switch` su `_usb_ups->executeCommand(cmdName.c_str())`: OK → `OK`, NOT_SUPPORTED → `ERR CMD-NOT-SUPPORTED`, NOT_CONNECTED → `ERR DRIVER-NOT-CONNECTED`, FAILED → `ERR INSTCMD-FAILED`.
      4. Ignorare un eventuale quarto token (valore): serve solo a US-058.

      **Verifica:** build firmware ok. Comportamento verificato da TASK-07.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - `lib/NUTServer/src/NUTServer.cpp` — ramo INSTCMD

      ## Criteri di Completamento
      - [ ] Nessun nome di comando scritto a mano nel ramo INSTCMD
      - [ ] I quattro esiti sono tradotti nei codici NUT del piano
    ref: TASK-05
