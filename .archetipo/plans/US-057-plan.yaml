  - id: TASK-03
    title: Estrarre BeeperLogic::writeField senza cambiare il comportamento del beeper
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** rendere riusabile la scrittura di un campo HID in un buffer di report.

      **Da leggere:** `lib/USBHostUPS/src/BeeperLogic.h` (`manipulateBeeperBuffer`), `test/test_beeper_logic/test_main.cpp`.

      **Passi:**
      1. Aggiungere `static size_t writeField(const HIDUsageDef& def, uint32_t raw, uint8_t* buffer, size_t fetched_len)`, che contiene la parte attuale di `manipulateBeeperBuffer` dopo il calcolo di `val`: allargamento a `requiredLength` (max 256, altrimenti 0), maschera, shift e scrittura byte per byte. Restituisce la lunghezza da inviare, 0 se `buffer` è nullo o il campo è troppo grande.
      2. Riscrivere `manipulateBeeperBuffer` come calcolo di `val` (come oggi, con `encodeBeeperValue`) seguito da `return writeField(*def, val, buffer, fetched_len);`.
      3. Aggiungere in `test/test_beeper_logic/test_main.cpp` un caso diretto: campo di 2 bit con `bit_offset` 3, report_id 0, buffer 0xFF → solo quei 2 bit cambiano al valore scritto.

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_beeper_logic`

      **Blocchi:** se un test esistente di `test_beeper_logic` cambia esito, il refactor è sbagliato: correggere il codice, non il test.

      ## File Coinvolti
