  ---
  # US-057: Esecuzione via NUT dei comandi di test batteria e test pannello — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-10-09

  ---

  ## Spec

  **Epic:** EP-003 — Server NUT
  **Priorità:** HIGH | **Punti:** 3

  **User Story**
  Come utente di Home Assistant o amministratore NUT, voglio avviare e fermare il test delle batterie e del pannello con `upscmd`, in modo da controllare periodicamente lo stato delle batterie, anche da un'automazione.

  **Criteri di Accettazione**
  - INSTCMD test.battery.start.quick/deep/stop e test.panel.start/stop scrivono il valore di usbhid-ups (Test: 1 = quick, 2 = deep, 3 = stop).
  - Comando assente dal catalogo → `ERR CMD-NOT-SUPPORTED`; UPS non connesso → `ERR DRIVER-NOT-CONNECTED`; scrittura fallita o timeout → `ERR INSTCMD-FAILED`.
  - Senza login, con autenticazione attiva → `ERR ACCESS-DENIED`.
  - Il comando non blocca server NUT e polling oltre il timeout del control transfer; nome ed esito vanno nel log di sistema.
  - I comandi beeper passano dallo stesso percorso di esecuzione senza regressioni.
  - Test nativi: successo, non supportato, UPS disconnesso, scrittura fallita.

  ---

  ## Soluzione Tecnica

  Un unico punto di esecuzione, `IUSBHostUPS::executeCommand(name)`, sostituisce i rami beeper scritti a mano in `NUTServer`. Per sapere cosa scrivere si usa il catalogo di US-056 (funzione pura e testabile). Per il come, la scrittura sul dispositivo riusa il read-modify-write sicuro già usato per il beeper.

  - **Esito (contratto):** in `CommandCatalog.h`, `enum class CommandResult { OK, NOT_SUPPORTED, NOT_CONNECTED, FAILED };`. `NUTServer` lo traduce in `OK`, `ERR CMD-NOT-SUPPORTED`, `ERR DRIVER-NOT-CONNECTED`, `ERR INSTCMD-FAILED`. Cambio voluto: un beeper.* la cui scrittura fallisce oggi risponde `OK`, d'ora in poi `ERR INSTCMD-FAILED`.
  - **Cosa scrivere (pura):** `bool CommandCatalog::resolveWrite(const char* name, const std::vector<HIDUsageDef>& usages, HIDUsageDef& def, uint32_t& value)`. Risolve solo i comandi di test:
    - `test.battery.start.quick` = 1, `test.battery.start.deep` = 2, `test.battery.stop` = 3 (`test_write_info` di usbhid-ups), sul primo usage FEATURE tra `UPS.BatterySystem.Battery.Test`, `UPS.Battery.Test`, `UPS.Output.Test`, in quest'ordine.
    - `test.panel.start` = 1, `test.panel.stop` = 0 (apc-hid.c), sull'usage FEATURE con codice 0xff860072.
    - Restituisce false per beeper.* (percorso dedicato), per load.*/shutdown.* (US-058) e per i comandi sconosciuti.
    - Va scelto l'usage FEATURE (report_type 3): diversi APC dichiarano `UPS.Battery.Test` sia INPUT sia FEATURE.
  - **Logica di esecuzione (default in `IUSBHostUPS`, inline):**
    1. `!isConnected()` → NOT_CONNECTED.
    2. Comando assente da `getSupportedCommands()` → NOT_SUPPORTED.
    3. `beeper.enable` / `beeper.disable` → `setBeeper(true/false)`. `beeper.toggle` legge `ups.beeper.status` con il lock dei dati, lo rilascia e chiama `setBeeper(!enabled)`. Esito OK o FAILED.
    4. Altrimenti `resolveWrite` dentro un blocco `{ UPSDataLock lk = getUPSData(); ... }` che copia `HIDUsageDef` per valore. Se fallisce → NOT_SUPPORTED (succede per load.*/shutdown.* finché non c'è US-058).
    5. Lock rilasciato, poi `writeUsage(def, value)` → OK o FAILED.
    - L'ordine dei lock resta `_op_mutex` → `_mutex` (ADR 0008): non si tiene mai `_mutex` mentre si chiama `writeUsage` o `setBeeper`.
  - **Scrittura sul dispositivo:** nuovo virtuale `virtual bool writeUsage(const HIDUsageDef& def, uint32_t value)`, con default `return false` così i mock non vanno toccati. `USBHostUPS` lo implementa come `setBeeper`:
    - prende `_op_mutex` con `OP_WAIT_MS`
    - controlla `_is_ready_to_poll`, `_hid_dev_handle` e `_link.canPoll()`
    - legge con GET_REPORT il report FEATURE
    - applica la regola `BeeperLogic::canWriteBack` (un report condiviso che non si riesce a rileggere non si scrive: gli zeri potrebbero valere DelayBeforeShutdown = 0)
    - scrive il campo, fa SET_REPORT e chiama `noteControlResult`
    - non tiene lock applicativi durante i transfer
    - `setBeeperLocked` non cambia.
  - **Codifica del campo:** si estrae da `BeeperLogic::manipulateBeeperBuffer` una funzione `static size_t writeField(const HIDUsageDef& def, uint32_t raw, uint8_t* buffer, size_t len)` (mascheratura, shift, allargamento del buffer). `manipulateBeeperBuffer` la richiama dopo `encodeBeeperValue`. È un refactor senza cambi di comportamento, coperto da `test_beeper_logic`.
  - **Log:** `USBHostUPS::executeCommand` sovrascrive il default solo per scrivere nel log di sistema: `INFO "Command <name>: OK"`, `WARN "Command <name>: failed"` / `not supported` / `UPS not connected`. `NUTServer` non ha un logger proprio.
  - **ups.test.result:** oggi nessun driver lo decodifica, ma serve alla Dimostrazione. Va aggiunto alla tabella di `GenericDriver::decodeReport` per i tre path Test con la `test_read_info` di usbhid-ups:
    - 1 Done and passed
    - 2 Done and warning
    - 3 Done and error
    - 4 Aborted
    - 5 In progress
    - 6 No test initiated
    - 7 Test scheduled
    - altri valori: chiave non impostata
    - Tutti i driver delegano prima a `GenericDriver::decodeReport`. Test (0x58) è già tra gli usage dinamici sottoposti a polling.
  - **Tempi:** il loopTask resta bloccato al più come oggi con il beeper: attesa di `_op_mutex` (`OP_WAIT_MS` = 4 s) più due control transfer (GET + SET, 1,5 s ciascuno). Non aggiungiamo attese nuove. Il polling non si sovrappone perché c'è `_op_mutex`.
  - **Fuori scope:** load.* e shutdown.* (US-058), Web UI (US-059), endpoint HTTP.

  ---

  ## Strategia di Test

  Test nativi Unity (`pio test -e native`). La parte pura (risoluzione, codifica del campo, decodifica di test.result) ha test unitari. Il protocollo si verifica con il `MockUSBHost` di `test_nut_server`, che registra cosa viene scritto. La scrittura USB reale si verifica a mano sull'Eaton 5P o su un APC dei tester; l'Eaton 3S dell'utente non espone Test.

  - **`test_command_catalog`:** valori e usage scelti da `resolveWrite` per ogni comando di test; preferenza per il FEATURE rispetto all'INPUT sullo stesso path; false per beeper, load/shutdown e nomi sconosciuti.
  - **`test_beeper_logic`:** i test esistenti restano verdi dopo l'estrazione di `writeField`, più un caso diretto di `writeField` su campo a 2 bit non allineato.
  - **`test_generic_driver`:** decodifica di `ups.test.result` per i valori 1, 5 e 6 e per un valore fuori tabella.
  - **`test_nut_server`:**
    - INSTCMD test.battery.start.quick → `OK`, con usage e valore registrati dal mock
    - comando fuori catalogo → `ERR CMD-NOT-SUPPORTED`
    - UPS disconnesso → `ERR DRIVER-NOT-CONNECTED`
    - `writeUsage` che fallisce → `ERR INSTCMD-FAILED`
    - senza login → `ERR ACCESS-DENIED`
    - shutdown.return elencato ma non ancora eseguibile → `ERR CMD-NOT-SUPPORTED`
    - beeper enable/disable/toggle invariati; beeper con `setBeeper` che fallisce → `ERR INSTCMD-FAILED`
  - **Regressione:** suite nativa completa e build `esp32-s3-standard`.
  - **Nessun test e2e:** la spec non ha UI.

  ---

  _Piano generato tramite ARchetipo Planning — 2026-10-09_
tasks:
  - id: TASK-01
    title: CommandResult e resolveWrite() per i comandi di test in CommandCatalog.h
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** definire l'esito di un comando e la funzione pura che, per i comandi di test, sceglie l'usage da scrivere e il valore.

      **Da leggere:** `lib/USBHostUPS/src/CommandCatalog.h` (struttura di `build()` e `hasFeature()`), la sezione "Soluzione Tecnica" del piano.

      **Passi:**
      1. Aggiungere `enum class CommandResult { OK, NOT_SUPPORTED, NOT_CONNECTED, FAILED };` dopo `UPSCommandInfo`.
      2. Aggiungere un helper interno `findFeature(usages, paths, n_paths, codes, n_codes)` che restituisce il puntatore al primo usage FEATURE che corrisponde, scorrendo i path nell'ordine dato: per ogni path si cerca nel vettore, poi si passa ai codici. `hasFeature()` diventa `findFeature(...) != nullptr`, così le due funzioni non divergono.
      3. Spostare le liste di path e codici (test, panel, shutdown, startup, reboot) in costanti a livello di namespace, usate sia da `build()` sia da `resolveWrite()`.
      4. Implementare `inline bool resolveWrite(const char* name, const std::vector<HIDUsageDef>& usages, HIDUsageDef& def, uint32_t& value)`:
         - test.battery.start.quick = 1, test.battery.start.deep = 2, test.battery.stop = 3, sull'usage Test trovato
         - test.panel.start = 1, test.panel.stop = 0, su 0xff860072
         - ogni altro nome, o usage non trovato → false
      5. Commento con il riferimento a `test_write_info` (usbhid-ups.c) e ad apc-hid.c.

      **Verifica:** compila con i test di TASK-02.

      **Blocchi:** non cambiare l'output di `build()`: i test di US-056 (`test_command_catalog`, `test_record_replay`) devono restare verdi.

      ## File Coinvolti
      - `lib/USBHostUPS/src/CommandCatalog.h` — CommandResult, findFeature, resolveWrite

      ## Criteri di Completamento
      - [ ] `resolveWrite` restituisce usage e valore corretti per i 5 comandi di test
      - [ ] `resolveWrite` restituisce false per beeper.*, load.*, shutdown.* e nomi sconosciuti
      - [ ] `build()` invariato nel comportamento
    ref: TASK-01
