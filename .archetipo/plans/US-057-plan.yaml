    body: |-
      ## Descrizione
      **Obiettivo:** verificare tutti i casi dei criteri di accettazione a livello di protocollo.

      **Da leggere:** `test/test_nut_server/test_main.cpp` (`MockUSBHost`, `setUp`, `test_instcmd_beeper`, `featureUsage`).

      **Passi:**
      1. Estendere `MockUSBHost`:
         - `bool writeOk = true;`, `bool setBeeperOk = true;` e `std::vector<std::pair<std::string, uint32_t>> writes;`
         - override `writeUsage(def, value)` che registra `{def.path, value}` e restituisce `writeOk`
         - `setBeeper` restituisce `setBeeperOk`, senza cambiare lo stato quando è false
         - reset di tutto in `setUp`
      2. Nuovi test (con `server.setAuthenticated(0, true)` dove serve):
         - usage `UPS.BatterySystem.Battery.Test` FEATURE + `INSTCMD testups test.battery.start.quick` → `OK\n`, `writes` = {"UPS.BatterySystem.Battery.Test", 1}
         - `test.battery.stop` → valore 3
         - `INSTCMD testups test.panel.start` senza usage panel → `ERR CMD-NOT-SUPPORTED\n`, nessuna scrittura
         - `connected = false` → `ERR DRIVER-NOT-CONNECTED\n`
         - `writeOk = false` → `ERR INSTCMD-FAILED\n`
         - non autenticato con credenziali configurate → `ERR ACCESS-DENIED\n`, nessuna scrittura
         - delay di shutdown e startup presenti + `INSTCMD testups shutdown.return` → `ERR CMD-NOT-SUPPORTED\n`, nessuna scrittura (US-058)
         - beeper con `setBeeperOk = false` → `ERR INSTCMD-FAILED\n`
         - `beeper.toggle` da enabled → beeperState false
      3. `test_instcmd_beeper` e `test_beeper_hidden_when_not_controllable` devono restare verdi senza modifiche semantiche.
      4. Registrare i test in entrambi i blocchi `RUN_TEST` (native e Arduino).

      **Verifica:** `PATH="$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH" ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_server`

      **Blocchi:** se l'autenticazione del server di test non è attiva di default, usare lo stesso schema dei test di autenticazione esistenti.

      ## File Coinvolti
