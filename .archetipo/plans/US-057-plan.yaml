      2. Aggiungere tre voci alla tabella, per `UPS.BatterySystem.Battery.Test`, `UPS.Battery.Test` e `UPS.Output.Test`. Ognuna imposta `ups.test.result` solo se `testResultText((int)v)` non è nullptr.
