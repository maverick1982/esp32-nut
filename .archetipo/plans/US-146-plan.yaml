  - id: TASK-05
    title: 'Driver: UPS che calcolano la potenza marcati, stima anche sui Q*'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** la stima chiamata dall'host non tocca mai un `ups.realpower` del driver, e i Q* hanno la stima senza che `publish()` la cancelli.

      **Leggere:** `lib/USBHostUPS/src/GenericDriver.cpp` (`loop` ~562-588, `bindNutTable` ~765-776, `postDecode` ~847-888, `publishRow` ~904-933), `lib/USBHostUPS/src/QxDriver.cpp` (`publish` ~259-272, commento sul reset ~206), `lib/USBHostUPS/src/QxDriver.h` (`_shadow`).

      **Modifiche:**
      1. `GenericDriver`: un piccolo metodo privato (o codice inline) che, se `_nut_has_realpower && !data.realPowerMeasured()`, chiama `data.markRealPowerMeasured()`. Va chiamato dopo `bindNutTable(host)` in `loop()` (blocco `!_lists_built`) e in `postDecode()`. Commento: `eaton_compute_realpower_info` o ActivePower letta posseggono la chiave e la stima dell'host (US-146) non deve sovrascriverla. Dichiarazione in `GenericDriver.h` se serve.
      2. `QxDriver::publish(UPSData& data)`, sotto il lock esistente:
         - prima della copia: `if (_shadow.find("ups.realpower") && !data.realPowerMeasured()) data.markRealPowerMeasured();`;
         - nel giro delle chiavi sparite: saltare `ups.realpower` quando `data.realPowerEstimated()`;
         - a fine funzione, dopo `_publishedWrites = ...`: `data.updateRealPower();`.
         Commento con US-146: la stima vive solo nei dati dell'host, non nello shadow.
      3. Nessun'altra modifica a `publishRow()`.

      **Verifica:** `pio test -e native -f test_generic_driver -f test_qx_driver -f test_record_replay -f test_eaton_driver -f test_apc_driver -f test_cyberpower_driver` verde, golden invariati.

      **Blocchi:** TASK-01.

