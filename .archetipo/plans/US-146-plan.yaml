      ## Descrizione
      **Obiettivo:** le nominali salvate in NUT Server arrivano a `UPSData` nel task di poll, al boot e a ogni salvataggio, e sopravvivono a riconnessioni e cicli della porta.

      **Leggere:** `lib/USBHostUPS/src/USBHostUPS.h` (`setQxSettings` ~115-118, campi ~387-395), `lib/USBHostUPS/src/USBHostUPS.cpp` (chiamata `applyQxSettings()` ~405, `releaseBoundState` ~789-800, `setQxSettings`/`applyQxSettings` ~971-1007), `src/core/main.cpp` (~240-244 load delle variabili, ~312 `setQxSettings`), `src/network/web_config_server.cpp` (`handleSetNutOverrides` ~381-402), `include/network/web_config_server.h` (`usb_ups` ~167).

      **Modifiche:**
      1. `USBHostUPS.h`: `void setCustomPowerNominals(float real_w, float apparent_va);` con commento (qualunque task; applicate dal task di poll al poll successivo e a ogni nuovo `UPSData`; US-146). Campi sotto `_mutex`: `float _custom_real_w = 0, _custom_apparent_va = 0; uint32_t _power_nominals_gen = 0, _power_nominals_applied = 0;` e `void applyPowerNominals();`.
      2. `USBHostUPS.cpp`:
         - `setCustomPowerNominals`: lock, assegna, `_power_nominals_gen++`.
         - `applyPowerNominals()`: lock; se `applied == gen` return; `bool changed = _ups_data.setCustomPowerNominals(_custom_real_w, _custom_apparent_va); _ups_data.updateRealPower(); _power_nominals_applied = _power_nominals_gen;` e, se `changed`, `log("INFO", "[USB] Nominal power for the ups.realpower estimate: %.0f W, %.0f VA (custom variables)", ...)`.
         - Chiamata subito dopo `applyQxSettings();` (~405).
         - `releaseBoundState()`: dopo `_ups_data = UPSData();` → `_ups_data.setCustomPowerNominals(_custom_real_w, _custom_apparent_va);`.
      3. `main.cpp`: subito prima di `usb_ups.setQxSettings(...)` (~312), `float w, va; NutOverrides::powerNominals(nut_overrides, w, va); usb_ups.setCustomPowerNominals(w, va); // US-146`. Include di `NutOverrides.h` se non arriva già.
      4. `web_config_server.cpp`, in `handleSetNutOverrides()` dopo `*nut_overrides = next;`: `if (usb_ups) { float w, va; NutOverrides::powerNominals(*nut_overrides, w, va); usb_ups->setCustomPowerNominals(w, va); }`.

      **Verifica:** build `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`; `test_web_api` verde.

      **Blocchi:** TASK-01, TASK-03, TASK-05.

      ## File Coinvolti
