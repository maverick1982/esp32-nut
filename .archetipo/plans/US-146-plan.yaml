schema: archetipo/plan/v2
spec_code: US-146
body: |
  ## Soluzione Tecnica

  La stima resta dov'è oggi, in `UPSData::updateRealPower()` (US-075), che diventa l'unico punto che decide se e come stimare `ups.realpower`. Le nominali impostate a mano entrano in `UPSData` come due campi privati, non come chiavi: i client NUT e la telemetria continuano a vedere `ups.realpower.nominal` tramite la variabile personalizzata (US-115, US-144). Il web server non tocca `UPSData`: passa i due numeri a `USBHostUPS`, che li applica nel task di poll come fa `setQxSettings()` (US-138).

  - **Stima (`lib/USBHostUPS/src/UPSData.h`)**
    - Campi nuovi: `_customRealNominal` e `_customApparentNominal` (float, 0 = assente) e `_realPowerEstimated` (true quando `ups.realpower` l'ha scritta la stima). Metodi: `bool setCustomPowerNominals(float w, float va)` (valori non finiti o ≤ 0 diventano 0, ritorna true se qualcosa cambia) e `bool realPowerEstimated() const`.
    - Ordine delle fonti: W personalizzata, poi W dell'UPS (`ups.realpower.nominal` > 0), poi VA personalizzata × 0,6, poi VA dell'UPS × 0,6. Una variabile personalizzata non valida conta come assente: per quella chiave vale il valore dell'UPS.
    - Calcolo in double con il load decimale e arrotondamento al watt: `lround(load × W / 100)` e `lround(load × VA × 0,6 / 100)`. Così 10,4 × 980 = 101,92 dà `102`. Se il load manca o è negativo non c'è nessuna fonte.
    - Senza fonte: se `_realPowerEstimated` è vero e la chiave c'è, `remove("ups.realpower")`, poi il flag torna false. Con una fonte: `set` solo se il testo cambia (`valueEquals`, ADR 0007) e il flag diventa true.
    - `markRealPowerMeasured()` toglie la stima già scritta (se il flag è vero) prima di marcare: da quel momento la chiave appartiene al dispositivo.
  - **Variabili personalizzate (`lib/NUTServer/src/NutOverrides.h`)**: `bool parsePositiveNumber(const String& text, float& out)` accetta spazi ai lati; il resto deve essere un numero intero per `strtod`, finito e > 0. `void powerNominals(const std::vector<NutOverride>& list, float& real_w, float& apparent_va)` cerca con `find()`, senza distinguere maiuscole e minuscole, `ups.realpower.nominal` e `ups.power.nominal`; un valore non valido dà 0. La validazione del salvataggio non cambia, quindi la Web UI non mostra nessun errore e i client NUT vedono il valore com'è.
  - **Host (`lib/USBHostUPS/src/USBHostUPS.h/.cpp`)**: `void setCustomPowerNominals(float real_w, float apparent_va)` si chiama da qualunque task, sotto `_mutex`, e incrementa `_power_nominals_gen`. `applyPowerNominals()` gira nel task di poll subito dopo `applyQxSettings()`: sotto `_mutex` passa i valori a `_ups_data.setCustomPowerNominals()`, chiama `_ups_data.updateRealPower()` e scrive un log INFO quando cambiano. `releaseBoundState()` ripassa i valori al nuovo `UPSData()` (riconnessione USB, ciclo della porta). Al boot `src/core/main.cpp` chiama il setter dopo `nut_override_store.load()`, prima di `usb_ups.begin()`. `handleSetNutOverrides()` lo chiama dopo il salvataggio, così l'effetto arriva al poll successivo, senza riavvio.
  - **Driver HID (`GenericDriver`)**: oggi la stima parte solo se `!_nut_has_realpower`, ma il percorso nuovo dell'host chiama `updateRealPower()` per conto suo. Quando `_nut_has_realpower` è vero (riga ActivePower letta o `eaton_compute_realpower_info`), il driver chiama `markRealPowerMeasured()` dopo `bindNutTable()`, sia in `loop()` sia in `postDecode()`. ActivePower resta marcata come oggi (`readsActivePower`). Il resto di `publishRow()` non cambia: continua a chiamare `updateRealPower()` quando cambiano il load o le nominali.
  - **Driver Q* (`QxDriver::publish`)**: oggi toglie dai dati dell'host ogni chiave che lo shadow non ha, e quindi cancellerebbe la stima. Regola nuova:
    - se lo shadow ha `ups.realpower`, `markRealPowerMeasured()` prima della copia;
    - nel giro delle chiavi sparite si salta `ups.realpower` quando `data.realPowerEstimated()`;
    - a fine publish `data.updateRealPower()`, che ricalcola a ogni `ups.load` e toglie la stima se il load sparisce o se il protocollo riparte.
  - **API e pagina**: `/api/ups-vars` e la card Real Power leggono `ups.realpower` da `UPSData`, quindi la stima ci arriva come valore dell'UPS senza codice nuovo. Il segno "NUT" della card resta legato alla sola chiave `ups.realpower` (US-144). Cambia solo il testo introduttivo del pannello "Custom variables" in `data/www/index.html`, poi si rigenerano gli asset con `python scripts/embed_web.py`.
  - **README**: una frase accanto alla voce Custom variables (~riga 308) con l'uso per la stima e il limite noto (load in % dei W e non dei VA). Le note di rilascio si scrivono prima della release e citano #128.
  - **Invariati**: fattore 0,6, `eaton_compute_realpower_fun`, logica della scheda, server NUT (la stima è una chiave come le altre) e validazione del salvataggio delle variabili.

  **Decisioni prese in pianificazione**
  - Un valore personalizzato non valido conta come assente, quindi vale quello dell'UPS per la stessa chiave.
  - La stima arrotonda al watt invece di troncare, anche quando usa le nominali dell'UPS.
  - Nessun limite superiore oltre a "finito".
  - Applicazione nel task di poll con generazione, sullo schema di `setQxSettings()`, così nessun altro task scrive `UPSData`.

  **Golden del replay**: hanno tutti load intero e prodotti esatti, oppure potenza misurata o calcolata dal driver (CyberPower CP1600 153 W, Eaton 3S 21 W da `eaton_compute_realpower_info`, Legrand 120 W). Non devono cambiare; se uno cambia, la differenza si spiega nel commit prima di aggiornarlo.

  **Fuori ambito**: il fattore 0,6, `ups.power` da `output.voltage` × `output.current`, il manuale utente.

  ---

  ## Strategia di Test

  Tutta la logica (fonti, precedenze, arrotondamento, rimozione, UPS che misurano, Q*) sta in header e driver già compilati in nativo, quindi i test nativi la coprono senza hardware. L'unica parte non nativa è il setter di `USBHostUPS`, che fa solo da passacarte; lo coprono le build e la prova sul campo, se l'utente la autorizza. La pagina si copre con Playwright e API simulate.

  - **Nativi, suite nuova `test_realpower_estimate`** (solo `UPSData.h`): W personalizzata; VA personalizzata × 0,6; W personalizzata contro W dell'UPS (vince la personalizzata); W dell'UPS contro VA personalizzata (vince la W); VA personalizzata contro VA dell'UPS; load decimale (10.4 × 980 = `102`, anche con la sola W dell'UPS); valore 0 o negativo ignorato; rimozione della personalizzata (la chiave sparisce, oppure torna la stima dalle nominali dell'UPS); load che sparisce; UPS che misura (nessuna stima, e `markRealPowerMeasured()` toglie una stima già scritta); nessuna scrittura se il valore non cambia (`writes()`).
  - **Nativi `test_nut_overrides`**: `parsePositiveNumber` ("980", " 980 ", "1.5", "0", "-5", "abc", "980W", "", "1e3", "nan", "inf") e `powerNominals` (maiuscole diverse, una sola delle due, valore non valido = 0).
  - **Nativi `test_generic_driver`**: con la nominale personalizzata e `ups.load` 10.4 da report la stima vale `102`; un dispositivo con ActivePower letta e uno con la riga `eaton_compute_realpower_info` non cambiano valore quando arrivano le nominali personalizzate.
  - **Nativi `test_qx_driver`**: con `ups.load` dal protocollo e la W personalizzata compare `ups.realpower`; resta dopo un publish successivo; segue il load nuovo; sparisce quando il load sparisce; uno shadow con `ups.realpower` vince sulla stima.
  - **Regressione**: `test_record_replay` con i golden invariati, `test_web_api` e `test_nut_overrides` esistenti invariati, suite nativa completa (in 4 gruppi paralleli, come da abitudine del progetto).
  - **Build**: `esp32-s3-standard`, `esp32-p4-eth`, `esp32-p4-eth-v1`.
  - **Prova sull'Eaton 3S**, solo dopo un sì esplicito dell'utente: con `ups.realpower.nominal` = 500 impostata in NUT Server, `ups.realpower` (calcolata dall'Eaton) non cambia; tolta la variabile, idem. È il caso "UPS che calcola già la potenza".

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (`playwright.config.ts`, `e2e/support/webui.ts`, API simulate con `page.route` come in `e2e/telemetry-overrides.spec.ts` e `e2e/nut-overrides.spec.ts`)
  **Video demo:** sì, l'incremento si vede (card Real Power da `--` a `102 W` dopo il salvataggio). Lo registra `archetipo-review`.

  | Scenario | Flusso utente |
  |---|---|
  | Nominale aggiunta | L'utente apre UPS Telemetry con `ups.load` 10.4 e senza `ups.realpower`: la card Real Power mostra `--`. Va in NUT Server, aggiunge `ups.realpower.nominal` = `980`, salva e torna in telemetria. Il mock, dopo il POST, risponde con `ups.realpower` 102 e `_overrides['ups.realpower.nominal']` aggiunta. La card mostra `102` W, il segno "NUT" della card Real Power resta nascosto e in tabella `ups.realpower.nominal` ha il chip "Added". |
  | Nominale tolta | L'utente toglie la variabile e salva: al poll successivo la card torna a `--` e la riga `ups.realpower` sparisce dalla tabella. |
  | Override di ups.realpower | Con la stima a 102 e un override di `ups.realpower` a 150, la card mostra `102` e il segno "NUT 150 W". |
  | Testo del pannello | In NUT Server il testo introduttivo di "Custom variables" cita `ups.realpower.nominal` e `ups.power.nominal` per la stima della potenza reale. |

  _Piano generato con ARchetipo Planning — 2026-11-22_

  ---

  ## Rework (review del 2026-11-22)

  La review ha chiesto un segno che dica quando `ups.realpower` è stimata dalla scheda e da dove viene la stima, come nel mockup `docs/mockups/US-146/` (stati A-F). Vale per le due fonti: le variabili personalizzate (US-146) e le nominali dell'UPS (US-075). Il valore resta un valore dell'UPS e il segno "NUT" di US-144 non cambia; il criterio sulla card Real Power diventa: "la card mostra la stima come valore dell'UPS, con il segno Estimated, la sua origine e la formula".

  - **Fonte ricordata (`UPSData.h`)**: `enum class RealPowerSource : uint8_t { NONE, CUSTOM_W, UPS_W, CUSTOM_VA, UPS_VA }`, più la nominale usata. `updateRealPower()` li imposta nel ramo scelto; `NONE` (e nominale 0) quando non c'è fonte, quando toglie la stima e in `markRealPowerMeasured()`. Accessori `realPowerSource()` e `realPowerSourceNominal()`.
  - **API (`WebApiJson::generateUpsVars`)**: nel ramo connesso, dopo il ciclo dei valori e prima di `_overrides`, se `data->realPowerEstimated()`, la fonte non è `NONE` e `ups.realpower` c'è: `_realpower_estimate = {"source": "custom"|"ups", "key": "ups.realpower.nominal"|"ups.power.nominal", "nominal": <numero>, "unit": "W"|"VA", "factor": 1|0.6}`. Assente con potenza misurata o calcolata dal driver, senza stima, con UPS scollegato (si esce prima). I valori reali e `_overrides` non cambiano; senza stima l'output resta identico byte per byte.
  - **Pagina**: markup e stili del mockup (`estimate.css` in una sezione US-146 di `bundle.css`, senza la parte di contorno del mockup). In `bundle.js` una `renderRealPowerEstimate(est, data)` mostra o nasconde badge, tooltip e formula della card a ogni poll; la riga `ups.realpower` della tabella prende lo stesso badge e la formula sotto la descrizione, e la sua firma (`tr.dataset.sig`) include la stima. Testi solo con `createElement`/`textContent`. Il link della formula chiama `openNutServerFor(est.key)` (ricerca già senza maiuscole, 0800de3). Il tooltip si apre con hover, focus e tocco (classe `open`), ancorato alla card.
  - **Testi del tooltip**: "Estimated by the board: the UPS does not report ups.realpower. {load} % load × {nominal} {unit}[ × 0.6]." Poi la fonte: "From the custom variable ups.realpower.nominal (NUT Server tab)." oppure "From ups.power.nominal of the UPS." Con unità W: "Right only if the UPS reports the load as a percentage of the watts." Con unità VA: "Set ups.realpower.nominal in NUT Server for a better estimate."

  ### Test del rework

  - Nativi `test_realpower_estimate`: fonte e nominale per ognuno dei 4 rami, `NONE` dopo la rimozione e dopo `markRealPowerMeasured()`.
  - Nativi `test_web_api`: `_realpower_estimate` per custom W, custom VA, UPS W, UPS VA; assente con potenza misurata, senza stima, con UPS scollegato; output invariato senza stima.
  - E2E `e2e/realpower-estimate.spec.ts` (esteso): stati A, B, C, D ed E del mockup, link della formula che apre NUT Server sulla riga, sparizione al poll successivo, 375 px senza scroll orizzontale.
  - Suite nativa ed e2e complete, tre build.

  _Rework pianificato con ARchetipo Planning — 2026-11-22_
tasks:
  - id: TASK-01
    title: 'UPSData: stima con nominali personalizzate, load decimale e rimozione'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** `UPSData::updateRealPower()` diventa l'unica regola della stima: nominali personalizzate, ordine delle fonti, load decimale arrotondato e rimozione della stima quando non c'è più una fonte.

      **Leggere:** `lib/USBHostUPS/src/UPSData.h` (campi ~14-16, `markRealPowerMeasured` ~251, `updateRealPower` ~256-270), `lib/USBHostUPS/src/GenericDriver.cpp` (`publishRow` ~904-933, solo per capire chi la chiama), il piano (sezione Stima).

      **Modifiche:**
      1. Campi privati: `float _customRealNominal = 0.0f; float _customApparentNominal = 0.0f; bool _realPowerEstimated = false;`.
      2. `bool setCustomPowerNominals(float real_w, float apparent_va)`: un valore non finito (`isfinite`) o ≤ 0 diventa 0; ritorna true se almeno uno dei due cambia. Non chiama `updateRealPower()`: lo fa chi chiama.
      3. `bool realPowerEstimated() const { return _realPowerEstimated; }`.
      4. `markRealPowerMeasured()`: se `_realPowerEstimated` e `find("ups.realpower")`, `remove("ups.realpower")`; poi `_realPowerEstimated = false; _realPowerMeasured = true;`.
      5. `updateRealPower()`:
         - `if (_realPowerMeasured) return;`
         - `double watts = -1;` Se `ups.load` c'è e `load = toFloat() >= 0`: se `_customRealNominal > 0` allora `watts = load * _customRealNominal / 100.0`; altrimenti, se la W dell'UPS è > 0, con la W dell'UPS; altrimenti, se `_customApparentNominal > 0`, `watts = load * _customApparentNominal * 0.6 / 100.0`; altrimenti, se la VA dell'UPS è > 0, con la VA dell'UPS × 0,6.
         - `watts < 0` (nessuna fonte): se `_realPowerEstimated && find("ups.realpower")`, `remove`; poi `_realPowerEstimated = false`; return.
         - Altrimenti `String v(lround(watts));` (via `(long)`), `if (!valueEquals("ups.realpower", v)) set("ups.realpower", v); _realPowerEstimated = true;`.
      6. Commento sopra `updateRealPower()` con l'ordine delle fonti, il riferimento a US-146 (#128) e la nota che la stima non è un valore upstream.

      **Verifica:** build `esp32-s3-standard`; `pio test -e native -f test_generic_driver -f test_record_replay` (PATH con `toolchain-gccmingw32/bin`) passa con i golden invariati.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/USBHostUPS/src/UPSData.h — campi, setter, flag della stima, nuova `updateRealPower()`, `markRealPowerMeasured()` che toglie la stima

      ## Criteri di Completamento
      - [ ] Ordine delle fonti: W personalizzata, W dell'UPS, VA personalizzata × 0,6, VA dell'UPS × 0,6
      - [ ] Load decimale arrotondato al watt (10.4 × 980 = 102)
      - [ ] Senza fonte, una stima già scritta viene tolta; un `ups.realpower` non scritto dalla stima non viene mai tolto
      - [ ] Nessuna scrittura quando il valore non cambia
      - [ ] `test_generic_driver` e `test_record_replay` verdi senza modificare i golden
    ref: TASK-01
  - id: TASK-02
    title: Test nativi della stima in UPSData
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** fissare con una suite nativa dedicata tutte le regole della stima.

      **Leggere:** `lib/USBHostUPS/src/UPSData.h` (dopo TASK-01), `test/test_nut_overrides/test_main.cpp` (struttura minima di una suite Unity: include, `setUp`/`tearDown`, `main` con `RUN_TEST`), `platformio.ini` (env `native`: le cartelle `test/test_*` vengono trovate da sole).

      **Modifiche:** nuova cartella `test/test_realpower_estimate/` con `test_main.cpp` che include solo `<unity.h>` e `UPSData.h`. Test:
      1. W personalizzata 980, `ups.load` "10.4" → `ups.realpower` "102";
      2. solo la W dell'UPS 980 e load "10.4" → "102" (prima era 98);
      3. VA personalizzata 1500, load "10" → "90";
      4. W personalizzata 1000 e W dell'UPS 500, load "50" → "500" (vince la personalizzata);
      5. W dell'UPS 500 e VA personalizzata 1500, load "50" → "250" (vince la W);
      6. VA personalizzata 1000 e VA dell'UPS 2000, load "50" → "300";
      7. `setCustomPowerNominals(0, -5)` e `NAN` → nessuna stima, `realPowerEstimated()` false;
      8. rimozione: con la sola personalizzata → stima, poi `setCustomPowerNominals(0,0)` + `updateRealPower()` → chiave sparita;
      9. rimozione con fallback: personalizzata 1000 e W dell'UPS 500, load 50 → "500"; tolta la personalizzata → "250";
      10. `ups.load` rimosso → la stima sparisce;
      11. `markRealPowerMeasured()` dopo una stima → chiave tolta e nessuna stima nuova; un `ups.realpower` scritto con `set()` da un dispositivo non viene mai tolto da `updateRealPower()`;
      12. due `updateRealPower()` con gli stessi dati → `writes()` aumenta una volta sola;
      13. `setCustomPowerNominals` ritorna true solo quando cambia qualcosa.

      **Verifica:** `pio test -e native -f test_realpower_estimate`. Invertire per prova l'ordine W/VA in TASK-01 e verificare che almeno un test fallisca, poi ripristinare.

      **Blocchi:** TASK-01.

      ## File Coinvolti
      - test/test_realpower_estimate/test_main.cpp — suite nuova, 13 casi

      ## Criteri di Completamento
      - [ ] I 13 casi sono presenti e registrati con `RUN_TEST`
      - [ ] `test_realpower_estimate` verde
      - [ ] Un'alterazione voluta dell'ordine delle fonti fa fallire almeno un test
    ref: TASK-02
  - id: TASK-03
    title: 'NutOverrides: lettura numerica delle nominali personalizzate'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** ricavare dalla lista delle variabili personalizzate le due nominali valide, con le stesse regole per il boot e per il salvataggio.

      **Leggere:** `lib/NUTServer/src/NutOverrides.h` (`find` ~163, stile delle funzioni inline), `test/mocks` (la `String` nativa, per `c_str()`, `trim()`).

      **Modifiche:**
      1. `inline bool parsePositiveNumber(const String& text, float& out)`: copia, `trim()`; vuota → false; `strtod(c_str, &end)`; false se `end` non arriva alla fine, se il risultato non è finito o se è ≤ 0; altrimenti `out = (float)v` e true. Aggiungere `#include <stdlib.h>` e `<math.h>` se mancano.
      2. `inline void powerNominals(const std::vector<NutOverride>& list, float& real_w, float& apparent_va)`: entrambi a 0; per `ups.realpower.nominal` e `ups.power.nominal`, se `find(list, key)` trova una voce e `parsePositiveNumber` va, si assegna il valore.
      3. Commento: servono alla stima di `ups.realpower` (US-146, #128), unica eccezione alla regola "la logica della scheda usa i valori reali". Aggiornare di conseguenza la frase del commento iniziale del file ("They apply to the NUT server only").

      **Verifica:** `pio test -e native -f test_nut_overrides` verde con i test esistenti.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - lib/NUTServer/src/NutOverrides.h — `parsePositiveNumber`, `powerNominals`, commento iniziale

      ## Criteri di Completamento
      - [ ] Un valore non numerico, vuoto, zero, negativo o non finito dà 0
      - [ ] La ricerca della chiave ignora le maiuscole
      - [ ] La validazione di salvataggio (`checkEntry`, `checkList`) non cambia
      - [ ] `test_nut_overrides` verde
    ref: TASK-03
