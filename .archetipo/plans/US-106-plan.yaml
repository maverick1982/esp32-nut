      - [ ] Le due mutazioni colte
    ref: TASK-03
  - id: TASK-04
    title: 'legrandHid2Nut() e liebertHid2Nut(): tutte le righe upstream'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo:** copiare le due tabelle upstream nell'ordine originale.

      **Leggi:** `nut_repo/drivers/legrand-hid.c:127-188`, `nut_repo/drivers/liebert-hid.c:70-145`, `nut_repo/drivers/usbhid-ups.c:612` (`divide_by_10`); `ecoflowHid2Nut()` e `powercomHid2Nut()` in `NutTable.h` come modello.

      **Modifica:**
      1. `legrandHid2Nut()` dopo `openupsHid2Nut()` (o dove l'ordine dei test di copertura lo richiede): righe 129-184, ognuna con `// legrand-hid.c:N <path>`.
         - 130, 132, 139, 141, 142, 150: `Conv::Number` con `%.1f` e commento: conversione legrand_times* / divide_by_10 esclusa (US-087), formato della funzione (decisione utente 2026-10-30);
         - 165-168 come commenti: `ups.delay.*` gestiti da `legrandDelayPaths()` / `applyDefaultDelays` (US-066);
         - comandi 169-184 con `HU_TYPE_CMD` e i valori upstream.
      2. `liebertHid2Nut()`: righe 73-83 dentro `#if WITH_UNMAPPED_DATA_POINTS`, poi 87-141; percorsi vendor in notazione `0xFFFF0057`, `0xFFFF0058`, `0xFFFF00F9`, `0xFFFF00F8`; 133-134 come commenti (`liebertDelayPaths()`); `shutdown.stop` con `-1`.
      3. Commento sopra `mgeHid2Nut()` aggiornato.

      **Verifica:** `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_table -f test_rw_catalog` verde (aggiorna `test_tables_hold_only_rw_rows_without_ups_delay` se elenca le tabelle).

      **Fatto:** tabelle complete e compilate.

      **Blocchi:** se `DEFAULT_OFFDELAY` / `DEFAULT_ONDELAY` non hanno un equivalente in `NutTable.h`, usa quello delle righe `load.*.delay` di mge/cps.

      ## File Coinvolti
      - lib/USBHostUPS/src/NutTable.h — legrandHid2Nut, liebertHid2Nut, commenti
      - test/test_rw_catalog/test_main.cpp — solo se il conteggio delle tabelle lo richiede

      ## Criteri di Completamento
      - [ ] Ogni riga upstream presente in ordine con la citazione
      - [ ] Esclusioni motivate in commento
    ref: TASK-04
  - id: TASK-05
    title: Copertura delle tabelle e formati
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** dimostrare che le due tabelle contengono tutte le righe upstream.

      **Leggi:** `test/test_nut_table/test_main.cpp` (`checkTableCoverage`, `checkSupportedFormats`, test di US-078).

      **Modifica:** `test_legrand_table_covers_every_upstream_row`, `test_liebert_table_covers_every_upstream_row`, `test_legrand_rows_have_supported_formats`, `test_liebert_rows_have_supported_formats`; nessun `unmapped.*` fuori dal `#if`; le sei righe Legrand con conversione esclusa hanno `%.1f`.

      **Verifica:** `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_nut_table` verde.

      **Fatto:** copertura verificabile riga per riga.

      **Blocchi:** se il parser di `checkTableCoverage` non riconosce le righe con due spazi di rientro di liebert-hid.c, correggi il parser senza cambiare i risultati delle altre tabelle.

      ## File Coinvolti
      - test/test_nut_table/test_main.cpp — copertura e formati

      ## Criteri di Completamento
      - [ ] Copertura verde per entrambi i file upstream
      - [ ] Togliere una citazione fa fallire il test
    ref: TASK-05
  - id: TASK-06
    title: 'LegrandDriver: solo hook non tabellari'
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** togliere le mappature scritte a mano da LegrandDriver.

      **Leggi:** `lib/USBHostUPS/src/LegrandDriver.{h,cpp}`; `EcoFlowDriver.cpp` (US-078) come modello di percorsi superati e `formatDeviceStrings`; `GenericDriver::decodeReport` (mappature generiche).

      **Modifica:**
      1. Override `hid2nut()` e `commandTable()` → `NutTable::legrandHid2Nut`, `supersededGenericPaths()`, `formatDeviceStrings()` (`Legrand` se `ups.mfr` manca o è vuoto).
      2. `kSupersededGenericPaths` copiati carattere per carattere dalle mappature generiche delle chiavi di tabella (vedi piano, sezione 3); non superare `UPS.Input.Frequency`, `UPS.Flow.ConfigApparentPower` (ups.power.nominal), `PresentStatus.FullyCharged`, `PresentStatus.RemainingTimeLimitExpired` (estensioni, decisione 9).
      3. `decodeReport`: base, poi solo l'hook di `ups.beeper.status` con il significato Legrand (funzione `legrandBeeperStatus`, senza `UsageMapIndex`), con il motivo in un commento (decisione 7). Superare i percorsi generici di AudibleAlarmControl.
      4. Via: le altre mappature, `_map`, `onLoop`, `parseStringDescriptor`, `setup` se vuoto. Aggiorna il commento di testa (deviazioni di US-087 ancora valide).

      **Verifica:** `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_legrand_driver` compila; i test si allineano nel TASK-07.

      **Fatto:** nessuna mappatura scritta a mano oltre all'hook del beeper.

      **Blocchi:** un valore che sparisce senza una decisione va segnalato.

      ## File Coinvolti
      - lib/USBHostUPS/src/LegrandDriver.h — override
      - lib/USBHostUPS/src/LegrandDriver.cpp — percorsi superati, hook beeper, formatDeviceStrings

      ## Criteri di Completamento
      - [ ] Solo hook non tabellari, ognuno con il motivo
      - [ ] encodeBeeperValue e beeperMuteSupported invariati
    ref: TASK-06
  - id: TASK-07
    title: Test di LegrandDriver sulla tabella
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Descrizione
      **Obiettivo:** riallineare `test_legrand_driver` al flusso decodeReport + postDecode.

      **Leggi:** `test/test_legrand_driver/test_main.cpp`; `test/test_ecoflow_driver/test_main.cpp` (helper `decode` di US-078).

      **Modifica:**
      - helper `decode()` con postDecode; test di oggi riallineati: `no_legrand_voltage_conversions` (13.7 e 12.0 con `%.1f`), `output_overload_sets_status` (riga 162), `legrand_only_rows`, `mfr_fallback` via `formatDeviceStrings`;
      - test nuovi: `battery.runtime` dalla riga 144 (RuntimeToEmpty) su una usage RunTimeToEmpty; `input.voltage` / `output.voltage` `%.0f`; LIST CMD da tabella senza `shutdown.stop`; beeper enable/disable scrivono 2/3.

      **Verifica:** `PATH=$HOME/.platformio/packages/toolchain-gccmingw32/bin:$PATH ~/.platformio/penv/Scripts/pio.exe test -e native -f test_legrand_driver` verde.

      **Fatto:** ogni comportamento cambiato ha un test con il motivo.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - test/test_legrand_driver/test_main.cpp — test riallineati e nuovi

