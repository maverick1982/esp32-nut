  - id: TASK-07
    title: 'Firmware: storage NVS delle sessioni, rotta logout-all, Retry-After e modalità per i comandi'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo:** collegare le nuove funzioni al firmware.

      **Leggi:** `src/network/auth_platform.h/.cpp`, `src/network/web_config_server.cpp`, `include/network/web_config_server.h`, ADR 0009.

      **Modifica:**
      1. `NvsAuthStorage::loadSessions/saveSessions`: namespace `web_auth`, chiave `sessions`, blob di `count * 36` byte (32 di hash + `seq` uint32 little-endian); lunghezza non multipla di 36 o più di `max` voci → `count = 0` e true; `saveSessions` con `count == 0` rimuove la chiave.
      2. `WebConfigServer`: membro `LoginThrottle throttle`; `SessionTable sessions(auth_crypto, auth_storage)`; `AuthService auth(credentials, sessions, throttle)`; in `begin()` chiamare `sessions.begin()` dopo `credentials.begin()`.
      3. `sendAuth`: se `res.retry_after_s > 0` aggiunge l'header `Retry-After`.
      4. Rotta `POST /api/auth/logout-all` (guarded, `requireJson()`), log INFO `[AUTH] All sessions closed by '<username>'`. Log WARN quando il login risponde 429 (senza password).
      5. `handleUpsCommands` e `handleUpsCommand` passano `!is_ap_mode` a `generateUpsCommands`/`runUpsCommand`. Log WARN dei comandi distruttivi eseguiti dalla Web UI con il nome del comando e lo username.

      **Verifica:** `pio run -e esp32-s3-standard` compila; `pio test -e native` invariato.

      **Bloccanti:** nessuno.

      ## File Coinvolti
      - src/network/auth_platform.h — metodi delle sessioni
      - src/network/auth_platform.cpp — blob NVS `sessions`
      - src/network/web_config_server.cpp — throttle, logout-all, Retry-After, modalità ai comandi
      - include/network/web_config_server.h — nuovi membri e handler

      ## Criteri di Completamento
      - [ ] Le sessioni persistenti sono salvate nel blob `sessions` e ricaricate all'avvio
      - [ ] `POST /api/auth/logout-all` richiede sessione e JSON
      - [ ] Il 429 porta l'header `Retry-After`
      - [ ] In AP i comandi distruttivi rispondono 403, in STA vengono eseguiti
      - [ ] `pio run -e esp32-s3-standard` compila
    ref: TASK-07
  - id: TASK-08
    title: 'Frontend: Remember me, attesa dopo troppi tentativi, logout globale e conferma dei comandi'
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Descrizione
      **Obiettivo:** rendere visibili in UI le funzioni della spec.

      **Leggi:** `data/www/login.html`, `data/www/login.js`, `data/www/index.html` (sidebar `#sidebar-session`, gruppo `#cmd-group-power`), `data/www/bundle.js` (sezione US-059 dei comandi, logout di US-061), `data/www/bundle.css`, sezione "Frontend" del piano.

      **Modifica:**
      1. Login: casella "Remember me" nel form "Sign in" (stile coerente con i form esistenti), inviata come `remember` (bool). Risposta 429: alert `Too many attempts. Try again in N s` con N da `retry_after` (o dall'header `Retry-After`), conto alla rovescia ogni secondo, pulsante "Sign in" disabilitato fino a zero.
      2. Sidebar: pulsante "Log out of all devices" vicino a "Log out", con la stessa visibilità; click → `POST /api/auth/logout-all` (`Content-Type: application/json`, body `{}`) → `location.replace('/login')`.
      3. Comandi: `CMD_LOCK_NOTE = 'Available via NUT only in Access Point mode'`; `CMD_ERRORS[403]` uguale; `buildCommandRow` blocca un comando se `destructive && cmd.locked !== false`; un comando distruttivo non bloccato ha il pulsante Run normale e prima di `runCommand` chiede `window.confirm` con il testo `Run "<name>"?\n\nThis command switches off the power to the UPS outlets: the devices connected to the UPS will lose power.`; annullando non invia nulla. Il gruppo "Power control" ha la classe `locked` solo se contiene almeno un comando bloccato (in `index.html` togliere la classe statica e gestirla in `renderCommands`).
      4. Rigenerare gli asset con `python scripts/embed_web.py`.

      **Verifica:** `python scripts/embed_web.py`; `npx playwright test` (atteso: falliscono solo i test di `ups-commands.spec.ts` sul lucchetto, aggiornati in TASK-09); `pio run -e esp32-s3-standard`.

      **Bloccanti:** nessuno.

      ## File Coinvolti
      - data/www/login.html — casella Remember me
      - data/www/login.js — remember e gestione del 429
      - data/www/index.html — pulsante Log out of all devices, classe locked dinamica
      - data/www/bundle.js — logout-all, comandi sbloccati con conferma
      - data/www/bundle.css — stili dei nuovi elementi
      - data/www/*_inlined.html, include/network/web_assets.h — rigenerati

      ## Criteri di Completamento
      - [ ] "Remember me" inviato nel login
      - [ ] Il 429 mostra l'attesa con conto alla rovescia
      - [ ] "Log out of all devices" visibile solo dove lo è Log out
      - [ ] Comandi distruttivi sbloccati chiedono conferma; bloccati con la nuova nota
