body: |
  #### US-092: Supporto ESP32-P4 con Ethernet: profilo, link Ethernet e immagini

  **Epic:** EP-005 | **Priorità:** MEDIUM | **Punti:** 3 | **Stato:** TODO
  **Bloccato da:** US-090, US-091

  **User Story**
  Come utente con una scheda ESP32-P4 Ethernet (per esempio Waveshare ESP32-P4-ETH, anche PoE),
  voglio installare esp32-nut e collegarlo via cavo,
  in modo da avere il server NUT con la stabilità della rete cablata e un solo cavo per dati e alimentazione.

  **Dimostrazione**
  `pio run -e esp32-p4-eth` e `pio run -e esp32-p4-eth-v1` producono le due immagini P4, e `esp32-s3-standard` resta invariato. Sull'hardware di rtadams89: indirizzo via DHCP, Web UI con stato Ethernet e senza la scheda Wi-Fi, UPS letto sulla porta USB, OTA che rifiuta l'immagine sbagliata.

  **Criteri di Accettazione**
  - [ ] Profilo `esp32p4_eth` con il design di riferimento Espressif (PHY IP101, MDC 31, MDIO 52, reset 51, clock 50), senza LED, UPS sulla porta USB High-Speed. Ambienti `esp32-p4-eth` e `esp32-p4-eth-v1`, e range di revisione scritto nell'immagine (`chip_rev.py`).
  - [ ] Link Ethernet (RMII) dietro l'interfaccia di US-090: DHCP, nome host `esp32-nut-xxxxxx`, stato `Ethernet: <IP> (<velocità> Mbps)`, riconnessione automatica, link su/giù nel log.
  - [ ] Sulle schede senza Wi-Fi la Web UI nasconde la scheda Wi-Fi e mostra l'etichetta Ethernet. Gli asset incorporati sono rigenerati con `scripts/embed_web.py`.
  - [ ] Al primo avvio senza configurazione la scheda entra in rete con i valori NUT predefiniti, e il recupero dell'accesso è quello di US-091.
  - [ ] La diagnostica dei crash funziona anche su RISC-V (PC, RA, MCAUSE).
  - [ ] Regressione: comportamento dell'S3 invariato; test nativi, replay ed e2e verdi.

  **Assunzioni**
  - **Origine:** implementazione della PR di rtadams89 (#94), adattata a profili e link. I commit restano a suo nome.
  - **Divisione del lavoro:** CI a tre immagini, zip della release, web installer e README sono in US-102 e li facciamo noi: rtadams89 non può provarli e si intrecciano con US-099 e US-100. La PR non tocca `.github/workflows/`, `web-installer/` e README.
  - **Fuori ambito:** Wi-Fi tramite il coprocessore C6 e scelta della modalità di rete; impostazioni di porta USB e LED nella Web UI (spec successive). CI, release, web installer e README (US-102). La diagnostica USB opzionale (`-DNUT_USB_DIAG`) può restare come opzione di build.
