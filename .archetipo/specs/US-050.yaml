body: |-
  #### US-050: Ordinamento alfabetico tabella parametri UPS Telemetry

  **Epic:** EP-002 | **Priority:** LOW | **Points:** 1 | **Status:** TODO
  **Blocked by:** -

  **User Story**
  Come utente della Web UI,
  voglio che la tabella dei parametri nel tab "UPS telemetry" sia ordinata in ordine alfabetico crescente in base alla colonna Parameter,
  così da poter individuare più rapidamente i parametri di interesse durante la consultazione.

  **Demonstrates**
  Dopo aver implementato questa spec, visualizzando il tab "UPS telemetry", le righe della tabella risulteranno sempre ordinate alfabeticamente (A-Z) in base al nome del parametro, anche durante gli aggiornamenti in tempo reale dei dati.

  **Acceptance Criteria**
  - [ ] I parametri nella tabella "UPS telemetry" sono ordinati alfabeticamente in modo crescente (A-Z) usando la colonna "Parameter".
  - [ ] L'ordinamento viene mantenuto coerente anche quando i valori della tabella si aggiornano in tempo reale.
