body: |
  #### US-012: Interfaccia Web di Configurazione Wi-Fi

  **Epic:** EP-002 | **Priority:** HIGH | **Points:** 5 | **Status:** TODO
  **Blocked by:** -

  **User Story**
  As an end user,
  I want to access a graphical web interface to configure the Wi-Fi connection,
  so that I can easily select my network, enter the password, and connect the device to my local network without hardcoding credentials.

  **Demonstrates**
  After implementing this spec, a user can connect to the ESP32 (e.g. via an Access Point mode if not connected) and open a web page in their browser. The page displays a list of available Wi-Fi networks. The user can select a network, input the password, and save the configuration to connect the device to the selected network.

  **Acceptance Criteria**
  - [ ] The ESP32 hosts a web server serving a configuration page.
  - [ ] The page performs a scan of available Wi-Fi networks and displays them in a dropdown or list.
  - [ ] The user can enter the password for the selected network and submit the form.
  - [ ] The ESP32 saves the credentials securely (e.g., in NVS) and attempts to connect to the configured network.
  - [ ] The interface provides basic feedback (e.g., success or error) after attempting the connection.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - **src/main.cpp:15** — Errore di compilazione: 'WARNING' is not a member of 'LedState'. Sostituire con uno stato valido dall'enum (es. LedState::ERROR o simile).
  - **src/web_config_server.cpp:14** — Errore di compilazione: 'WiFi' was not declared in this scope. Aggiungere l'inclusione di <WiFi.h>.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - **src/web_config_server.cpp:19** — Errore di compilazione: `invalid use of 'void'`. Nella libreria WebServer per ESP32, il metodo `serveStatic` restituisce `void`, quindi non è possibile concatenare `.setDefaultFile("index.html")`. Rimuovere la chiamata a `setDefaultFile`.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - A runtime, la pagina web non viene caricata e i log mostrano ripetuti errori `_handleRequest(): request handler failed to handle request`. Verificare che LittleFS sia montato correttamente prima di servire i file, che l'immagine del filesystem sia stata caricata (Upload File System Image), oppure aggiungere un handler esplicito `server.on("/", ...)` per servire `index.html` se `serveStatic` da solo non basta per la route radice senza `setDefaultFile`.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - A runtime, la pagina web si apre, ma premendo il tasto "Scan" per la scansione delle reti l'ESP32 va in errore (`_handleRequest(): request handler failed to handle request`) e perde la connessione all'Access Point. Questo è probabilmente dovuto al blocco causato dalla chiamata sincrona `WiFi.scanNetworks()` mentre si è in modalità AP o nel mezzo di una richiesta HTTP del WebServer. Verificare l'implementazione asincrona o la gestione corretta della scansione Wi-Fi senza far crashare il server/AP.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - Il pulsante Scan ora non fa più crashare la rete Wi-Fi dell'ESP32, ma la chiamata a `/api/wifi/scan` fallisce con un errore HTTP 404 (Not Found) nella console di Chrome. Probabilmente c'è un problema di instradamento o precedenza nel server HTTP (es. la registrazione di `serveStatic` rispetto ai route REST), oppure il route della API non viene più trovato.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - Il pulsante Scan non fa disconnettere esplicitamente il router/access point lato ESP32, ma causa un errore `net::ERR_NETWORK_CHANGED` nel browser durante la chiamata a `/api/wifi/scan`. Questo accade perché quando il firmware chiama `WiFi.scanNetworks(true, true)` (che impone una scansione attiva) in modalità Access Point, il modulo radio è costretto a cambiare continuamente canale per scansionare le reti circostanti. Questo salto di canali interrompe la connessione con il client connesso all'AP, spingendo il browser a sganciare la rete con l'errore `ERR_NETWORK_CHANGED`. Servirà implementare un workaround (come fare una scansione passiva o differita, limitare il tempo di scansione, oppure accettare che la connessione cada ma informando la UI che dovrà attendere e riprovare la connessione in un secondo momento con retry automatici più prolungati).

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - Il pulsante Scan continua a restituire errori. Nei log dell'ESP32 compare ancora `_handleRequest(): request handler failed to handle request` durante la scansione e la UI riporta un fallimento. È probabile che la cache del browser stia mantenendo la vecchia versione di `app.js` senza logica di retry, oppure che il workaround del passive scan su `web_config_server.cpp` non sia stato sufficiente a impedire al core dell'ESP32 di scartare le richieste concorrenti. Occorre indagare ulteriormente: ad esempio provando a gestire lo status di scan a livello C++ rifiutando nuove connessioni con un 503 temporaneo, oppure disabilitando completamente lo scan e delegandolo a una configurazione manuale se i drop di rete si rivelassero insormontabili lato hardware.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - Il workaround del passive scan a 100ms per canale nasconde l'errore frontend (grazie alla logica retry anti-cache che ha funzionato) ma, purtroppo, non trova alcuna rete e continua a far cadere la connessione Access Point (con i consueti log `request handler failed`). Questo è causato da un limite fisico della radio condivisa dell'ESP32. Si deve cambiare strategia architetturale: la scansione simultanea all'AP non è supportata stabilmente su questo specifico hardware. Suggerisco di aggiungere l'inserimento manuale dell'SSID (come alternativa primaria) o di sospendere la connessione client prima della scansione in modo esplicito per poi ripristinarla a risultati memorizzati.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - Il salvataggio funziona, ma appena ci si connette all'AP dell'ESP32 compaiono log di errore: [E][WebServer.cpp:895] _handleRequest(): request handler failed to handle request.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - Continuano i log [E][WebServer.cpp:895] _handleRequest(). Inoltre c'è un problema nel redirect iniziale del captive portal: compare un'icona di un fulmine a tutto schermo al posto della pagina di configurazione. Navigando manualmente su 192.168.4.1 la pagina compare correttamente.
