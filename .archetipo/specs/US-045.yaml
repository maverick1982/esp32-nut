body: |
  #### US-045: Numero di Versione Dinamico nella Web UI

  **Epic:** EP-004 | **Priority:** MEDIUM | **Points:** 2 | **Status:** TODO
  **Blocked by:** -

  **User Story**
  Come utente dell'interfaccia web,
  Voglio vedere il numero di versione reale del firmware nell'angolo in alto a sinistra,
  Così da sapere esattamente quale versione sto eseguendo senza doverlo indovinare.

  **Demonstrates**
  Dopo aver implementato questa spec, il numero di versione mostrato nell'interfaccia web in alto a sinistra (attualmente hardcoded a "v1.0") verrà popolato dinamicamente. Se l'utente flasha una release creata da GitHub (es. v1.2.3), l'interfaccia web mostrerà "v1.2.3". Durante la compilazione locale mostrerà un fallback appropriato (es. "dev").

  **Acceptance Criteria**
  - [ ] Rimozione del valore hardcoded "v1.0" (o simili) dall'interfaccia web.
  - [ ] Meccanismo per propagare la versione dal sistema di build (PlatformIO / GitHub Actions) al codice C++ e, di conseguenza, al frontend.
  - [ ] L'interfaccia web aggiorna l'etichetta della versione usando il valore dinamico (es. restituito tramite un endpoint dedicato o iniettato nel template).
  - [ ] Gestione del fallback (es. "dev") se compilato fuori da GitHub Actions.
