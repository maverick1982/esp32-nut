body: |
  #### US-039: Completamento decodifica dati UPS CyberPower

  **Epic:** EP-001 | **Priority:** HIGH | **Points:** 3 | **Status:** TODO
  **Blocked by:** -

  **User Story**
  Come utente finale con un UPS CyberPower,
  voglio che il driver del mio dispositivo decodifichi correttamente e completamente tutti i parametri operativi (come Voltaggio, percentuale di Batteria, Carico, e tutti gli altri gestiti già dal driver Eaton),
  così da avere nel sistema un supporto paritario rispetto alle altre marche, con dati esatti al posto degli 0.0V generati dal codice incompleto della US-036.

  **Demonstrates**
  Dopo aver implementato questa spec, il driver `CyberPowerDriver` sostituirà il suo codice stub attuale. Collegando un UPS CyberPower supportato e inviando i report USB, i dati mappati dal codice C++ (similmente al file `cps-hid.c` di NUT) permetteranno di estrapolare la totalità dei parametri dell'UPS che oggi sono gestiti dal driver Eaton, abilitando la visualizzazione corretta sulla Web UI di batteria, voltaggio in ingresso, carico, e reale stato operativo (e non un finto OL hardcoded).

  **Acceptance Criteria**
  - [ ] Il metodo `decodeReport` in `CyberPowerDriver.cpp` estrapola da CyberPower *tutti* i parametri attualmente estratti per gli UPS Eaton (es. Batteria, Voltaggio, Carico, stato AC/DC, e altri campi previsti dal modello dati) usando i giusti offset (rif. `cps-hid.c`).
  - [ ] Il fallback hardcoded `ups_data.acPresent = true;` (introdotto come placeholder) è rimosso o sostituito dalla lettura corretta del flag HID.
  - [ ] Il codice compila senza errori e non introduce regressioni negli altri driver (Eaton, APC, Generic).

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - Il parametro Real Power (Watt) calcolato è errato, risulta più basso di circa 100W rispetto al display dell'UPS.
  - Il parametro Battery Ah capacity riporta 100, che non è un valore corretto per la capacità della batteria.
  - La frequenza nominale non viene trasmessa (riporta 0) e la tensione nominale è errata (riporta 240V, ma in USA dovrebbe essere 120V e 60Hz). Verificare se sono hardcoded o se vanno estratti correttamente.
