body: |-
  #### US-043: Esportazione Diagnostica USB (Dump HID) via Web UI

  **Epic:** EP-002 | **Priority:** MEDIUM | **Points:** 3 | **Status:** TODO
  **Blocked by:** -

  **User Story**
  Come utente con un UPS non riconosciuto nativamente,
  Voglio poter scaricare un file di diagnostica USB completo cliccando un pulsante nell'interfaccia web,
  Così da poterlo fornire agli sviluppatori su GitHub per l'implementazione del driver senza dover usare console seriali o sistemi Linux esterni.

  **Demonstrates**
  Dopo aver implementato questa spec, nella Web UI sarà presente un pulsante "Export USB Diagnostics (for Support)". Cliccandolo, il browser scaricherà un file (es. JSON o log) contenente i dati grezzi del dispositivo USB connesso: VID, PID, String Descriptors e soprattutto l'intero HID Report Descriptor (richiesto tramite `GET_DESCRIPTOR` e salvato in hex), permettendo a un developer di fare il reverse engineering della mappa dati.

  **Acceptance Criteria**
  - [ ] La Web UI include un pulsante/azione per esportare il log diagnostico USB.
  - [ ] Il firmware espone un endpoint (es. `/api/usb/dump`) che restituisce VID, PID e String Descriptors.
  - [ ] L'endpoint effettua una Control Transfer USB (tipo `0x22`) per leggere il raw HID Report Descriptor del dispositivo e lo include nel file esportato come array esadecimale.
  - [ ] Il download del file non interferisce in modo permanente con il normale polling del driver USB.
