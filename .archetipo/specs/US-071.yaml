body: |
  #### US-071: Allineamento a upsd di GET TYPE, ordinamento di LIST VAR e risposte senza UPS collegato

  **Epic:** EP-003 | **Priorità:** LOW | **Punti:** 5 | **Stato:** TODO
  **Bloccato da:** US-066

  **User Story**
  Come amministratore che usa upsc, upsrw o Home Assistant,
  voglio che il server NUT dell'ESP32 risponda a GET TYPE, LIST VAR e alle richieste senza UPS collegato esattamente come upsd,
  in modo che client e script scritti per NUT funzionino senza eccezioni.

  **Dimostrazione**
  `upsrw` e `upsc` danno lo stesso output che danno contro upsd con usbhid-ups sullo stesso UPS:
  - `GET TYPE ups battery.charge` risponde `NUMBER` e `GET TYPE ups ups.model` risponde `STRING:<n>`;
  - `LIST VAR` è in ordine alfabetico;
  - con l'UPS scollegato, `upsc ups@<ip>` stampa `Error: Driver not connected` invece di una lista vuota.

  **Criteri di Accettazione**
  - [ ] `GET TYPE` delle variabili non RW risponde `NUMBER` o `STRING:<n>` come upsd, con il tipo e la lunghezza dei flag della voce upstream (`ST_FLAG_STRING`, `info_len`). Le variabili senza voce upstream seguono una regola documentata.
  - [ ] `GET TYPE`, `GET DESC` e `LIST ENUM`/`LIST RANGE` fanno i controlli di upsd: `ERR UNKNOWN-UPS`, `ERR DATA-STALE`, `ERR DRIVER-NOT-CONNECTED`, `ERR VAR-NOT-SUPPORTED`.
  - [ ] `GET DESC` restituisce il testo di cmdvartab per ogni variabile che upsd descrive (per esempio `ups.status` "UPS status"), non solo per quelle della tabella NUT di US-066. "Description unavailable" resta solo per le variabili assenti da cmdvartab.
  - [ ] Senza UPS collegato, `LIST VAR`, `LIST RW`, `LIST CMD`, `GET VAR` e `INSTCMD` rispondono `ERR DRIVER-NOT-CONNECTED`, come `ups_available()` in upsd.
  - [ ] `LIST VAR` e `LIST RW` sono ordinate come l'albero di upsd (`strcasecmp`).
  - [ ] I test nativi del server NUT coprono ogni caso. Prima del merge si verifica Home Assistant (integrazione NUT) con UPS collegato e scollegato.

  **Assunzioni**
  - Riferimenti: `nut_repo/server/netget.c` (`get_type`, `get_desc`), `nut_repo/server/netlist.c`, `nut_repo/server/upsd.c` (`ups_available`), `nut_repo/common/state.c`.
  - Nasce dalla verifica di fedeltà del piano di US-066 (2026-10-15): sono deviazioni già presenti prima di US-066.
  - Il comportamento senza UPS cambia ciò che vedono i client oggi: va segnalato nelle note di release.
