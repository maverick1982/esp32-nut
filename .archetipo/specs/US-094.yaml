body: |
  #### US-094: Impostazioni della scheda nella Web UI: LED di stato e porta USB dell'UPS

  **Epic:** EP-005 | **Priorità:** MEDIUM | **Punti:** 3 | **Stato:** TODO
  **Bloccato da:** US-090

  **User Story**
  Come utente della scheda,
  voglio poter spegnere il LED di stato e, sulle schede con più porte USB, scegliere quella a cui è collegato l'UPS,
  in modo da adattare la scheda al mio montaggio senza dover compilare un firmware dedicato.

  **Dimostrazione**
  Nella Web UI c'è una sezione "Scheda". Sull'S3 compare il LED acceso/spento: spegnendolo, il LED resta spento in ogni stato, anche dopo un riavvio. Con un profilo finto a due porte (test e2e e nativi) compare anche la scelta della porta USB. Sulle schede senza LED la voce del LED non compare.

  **Criteri di Accettazione**
  - [ ] LED di stato acceso/spento, salvato in NVS, con valore iniziale dal profilo (acceso sull'S3). Spento, il LED non si accende in nessuno stato. La voce compare solo se il profilo ha un LED.
  - [ ] Porta USB dell'UPS (sul P4: High-Speed o Full-Speed), salvata in NVS e applicata con un riavvio, con valore iniziale dal profilo. La voce compare solo se il profilo ha più di una porta USB host.
  - [ ] Le impostazioni passano dalle API protette dal login, come le altre (ADR 0009), e vengono rifiutate con un errore se il valore non è tra quelli ammessi dal profilo.
  - [ ] Le due impostazioni rispettano la regola del PDR 0002 D4: un valore sbagliato non toglie l'accesso alla Web UI (al massimo l'UPS non viene visto, e si corregge dalla stessa pagina).
  - [ ] Regressione: senza modifiche dell'utente, comportamento invariato su S3 e P4; test nativi, replay ed e2e verdi.

  **Assunzioni**
  - **Riferimento:** PDR 0002 D4; ADR 0010 §3.
  - **Utilità immediata:** il LED acceso/spento serve già agli utenti S3, quindi la spec non dipende dal P4. La porta USB si potrà provare su hardware solo con US-092.
  - **Fuori ambito:** scelta del pin del LED dalla Web UI; impostazioni dei pin Ethernet o SDIO, che restano fisse nel profilo.
