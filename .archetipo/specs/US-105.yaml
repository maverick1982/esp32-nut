body: |
  #### US-105: Comandi e variabili scrivibili dietro il modello UPS

  **Epic:** EP-006 | **Priorità:** MEDIUM | **Punti:** 5 | **Stato:** TODO
  **Bloccato da:** US-103, US-104

  **User Story**
  Come sviluppatore che aggiunge un protocollo UPS non HID,
  voglio che comandi e variabili scrivibili passino per il driver invece di essere costruiti sugli usage HID dentro l'interfaccia,
  in modo che un driver Q* possa offrire i suoi comandi (beeper, test, spegnimento) senza riscrivere la logica HID.

  **Dimostrazione**
  Gli stessi comandi e le stesse variabili di prima compaiono in `upscmd -l`, `LIST RW` e nella Web UI. I test nativi di comandi e `SET VAR` passano invariati. La build di test, provata da noi e dai tester su UPS reali, esegue `beeper.toggle`, `shutdown.stop` e un `SET VAR`.

  **Criteri di Accettazione**
  - [ ] La logica HID dei comandi esce da `IUSBHostUPS.h` e diventa una parte del lato HID usata dai driver HID: catalogo, passi di spegnimento con la pausa di 125 ms, sequenza di `shutdown.default`, beeper e scritture.
  - [ ] `IUpsSource` esegue comandi, `SET VAR` e reset tramite il driver: un driver non HID può fornire i propri con lo stesso aggancio.
  - [ ] Nessun cambio di comportamento: stessi elenchi di comandi e variabili, stessi valori scritti nello stesso ordine, stesso ordine dei lock (`_op_mutex` poi `_mutex`, ADR 0008), stessi messaggi nel System Log.
  - [ ] Una build di test viene distribuita ai tester prima della release (ADR 0010).
  - [ ] Regressione: test nativi, replay ed e2e verdi; build `esp32-s3-standard` OK.

  **Assunzioni**
  - **Rischio:** è il passo che tocca la parte USB sensibile ai tempi, per questo serve la build di test.
  - **Fuori ambito:** `nutdrv_qx` stesso e MQTT.

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - **lib/USBHostUPS/src/IHidControlPort.h:19** — La porta passata a IUpsControl non deve essere legata a HID. Oggi IHidControlPort eredita IHidTransport, quindi un driver di un altro protocollo (Q*) che fornisce il proprio IUpsControl riceverebbe comunque il trasporto HID e un'interfaccia con un nome HID: l'aggancio del criterio 2 esiste, ma non è neutro. Separare una porta neutrale rispetto al protocollo (es. IUpsControlPort: isConnected, upsData, lock, flag del driver, executeCommand, noteDefaultShutdown, passi di SET VAR e reset) dalla parte HID (IHidTransport), che deve restare raggiungibile solo da HidControl senza dynamic_cast (ad esempio un accessor che restituisce il trasporto HID, nullptr per una sorgente non HID, oppure IHidControlPort che estende la porta neutrale). Vincoli: nessun cambio di comportamento (stessi comandi, valori, ordine delle scritture, pausa di 125 ms, ordine dei lock _op_mutex poi _mutex come da ADR 0008, stesse righe di System Log); la porta neutrale non include IHidTransport.h né header HID; test esistenti invariati salvo i nomi dei tipi.
  - **lib/USBHostUPS/src/IUpsControl.h:6** — IUpsControl deve dipendere solo dalla porta neutrale: includere quella al posto di IHidControlPort.h e usarla nelle firme di supportedCommands, executeCommand, setVariable e resetVariable. Aggiungere un controllo strutturale (come quelli di TASK-06) che fallisce se IUpsControl.h o la porta neutrale includono IHidTransport.h, HidControl.h o IHidControlPort.h.
