body: |
  #### US-137: Trasporti USB krauler, fabula e hunnox copiati da nutdrv_qx

  **Epic:** EP-007 | **Priorità:** MEDIUM | **Punti:** 5 | **Stato:** TODO
  **Bloccato da:** US-136

  **User Story**
  Come utente con un UPS Q* dietro un bridge della famiglia krauler (0001:0000, come quelli di #91 e #28),
  voglio che la scheda parli con il mio UPS come fa NUT, mandando i comandi come indici di string descriptor,
  in modo che il mio UPS passi da "non ancora supportato" al riconoscimento del protocollo.

  **Dimostrazione**
  I test nativi con primitive finte controllano, per ogni comando, l'indice di string descriptor e il langid richiesti, i tentativi, la lunghezza del buffer e la risposta ricostruita, compresa la sequenza preliminare di hunnox. Sulla scheda, un UPS che corrisponde alle righe krauler, fabula o fabula_hunnox usa questi trasporti e arriva al riconoscimento del protocollo.

  **Criteri di Accettazione**
  - [ ] `krauler_command()`, `fabula_command()` e `hunnox_command()` (`nut_repo/drivers/nutdrv_qx.c:1294`, `1427`, `1546`) e la sequenza di `hunnox_protocol()` (`nutdrv_qx.c:1240-1291`) portati fedelmente: tabelle comando → indice, langid (0x0409 per hunnox quando `langid_fix` non è impostato), tentativi, buffer da 102 byte di hunnox, ricostruzione della risposta.
  - [ ] Le righe Q* krauler, fabula e fabula_hunnox di US-132 usano questi trasporti; le altre righe restano "non ancora supportato".
  - [ ] Un comando che il trasporto non sa codificare fallisce subito, senza trasferimenti USB, come in NUT.
  - [ ] Il limite di attesa di ogni trasporto rispetta il criterio di US-136.
  - [ ] Gli scambi compaiono nella sezione Q* dell'export diagnostico.
  - [ ] Test nativi per i tre trasporti con primitive finte, compresi errori e risposte vuote.

  **Assunzioni**
  - `langid_fix` e `noscanlangid` non servono a #91: senza `langid_fix` il trasporto hunnox usa già 0x0409, e la scansione dei langid parte solo con `langid_fix`. Si aggiungono se un tester ne ha bisogno (ADR 0013).
  - La verifica sull'UPS vero arriva con la build di test di US-138.

  **Da includere nel piano (revisione di US-136, 2026-11-07)**
  Punti lasciati aperti all'approvazione di US-136, da trasformare in task di questa storia:
  1. **Test nativi della casella dei comandi Q*.** `postQxRequest()` / `serviceQxRequest()` / `answerQxRequest()` in `lib/USBHostUPS/src/USBHostUPS.cpp` (generazione, abbandono, risposta NOT_CONNECTED allo stacco, risposta FAILED con il link in pausa, richiesta dal task di poll stesso) non hanno test perché stanno nell'host, che non si compila in nativo. Estrarre la logica in una classe pura, come `EventBacklog.h`, con le attese e i semafori dietro un'interfaccia, e provarla in nativo. È la strada di `shutdown.default`.
  2. **Dati del protocollo precedente dopo un nuovo riconoscimento.** `QxDriver::setup()` (`lib/USBHostUPS/src/QxDriver.cpp`) tiene i dati ombra, così un ripristino del collegamento non mostra "Unknown". Se dopo un ripristino o uno stato Held viene riconosciuto un protocollo diverso, le chiavi del vecchio protocollo restano pubblicate ai client NUT. Correzione prevista: al riconoscimento, se il protocollo è diverso dal precedente, svuotare i dati ombra tenendo `driver.name`, `ups.vendorid` e `ups.productid`. Il primo giro completo li ripopola prima che il dato sia servito, e `publish()` toglie già le chiavi assenti. Test: dispositivo finto che passa dalla tabella Megatec a quella Q1.
