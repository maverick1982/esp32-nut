site_name: ESP32-NUT
site_description: Open-source firmware for ESP32-S3 and ESP32-P4 boards that turns a USB UPS into a NUT server on your network.
docs_dir: docs/user-manual

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: slate
      primary: teal
      accent: deep purple
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - User Manual (English):
    - Introduction: en/index.md
    - Hardware Requirements: en/hardware.md
    - Installation: en/installation.md
    - Configuration: en/configuration.md
    - Web Interface: en/web-interface.md
    - Status LED: en/status-led.md
    - Client Integration: en/integration.md
    - Troubleshooting: en/troubleshooting.md
    - FAQ: en/faq.md
  - Manuale Utente (Italiano):
    - Introduzione: it/index.md
    - Requisiti Hardware: it/hardware.md
    - Installazione: it/installation.md
    - Configurazione: it/configuration.md
    - Interfaccia Web: it/web-interface.md
    - LED di Stato: it/status-led.md
    - Integrazione Client: it/integration.md
    - Risoluzione Problemi: it/troubleshooting.md
    - FAQ: it/faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - callouts

extra_css:
  - stylesheets/extra.css
